  game: 1.4.6
summary: >-
  On 16 March 1375 the sultan reorders the realm and proclaims the Restoration of al-Andalus. Murcia's twelve
  towns pass directly to the crown and its heir Bernarda is betrothed to Prince Ismāʿīl. The conquered lands
  of Aragon become two ṭāʾifas: Catalonia (28 towns around Barcelona) and a renewed Aragon (6 towns around
  Benabarre). Granada becomes al-Andalus (the game's ADU; the campaign keeps the realm as GRA), with the rank
  of an empire. The sultan chooses the convivencia: the Ornament of the World runs for 30 years. The crown
  holds 72 towns and 874,000 people, Muslims a majority again; its four ṭāʾifas hold 64 more. Shares of power
  are estimated from the 1 June 1349 reading.
