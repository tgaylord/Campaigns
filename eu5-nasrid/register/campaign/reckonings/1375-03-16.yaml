tellings:
  - id: 0776-10-12-of-the-restoration-of-al-andalus
    'on': '1375-03-16'
    title: Of the Reordering of the Realm, and the Restoration of al-Andalus
    verse: 7:128
    who:
      - saad-ibn-yusuf
      - dolca-of-murcia
      - bernarda-of-murcia
      - ismail-ibn-saad
      - francesc-de-montsoriu
      - alfons-de-borja
      - maryam-bint-yusuf
      - aiman-mamluk
      - fatima-bint-yusuf
      - dua-marinid
    where:
      - mursiyya
      - barshaluna
      - qurtuba
      - gharnata
    covers:
      - 1375-03-15-the-new-taifas
      - 1375-03-16-murcia-into-the-crown
      - 1375-03-16-bernarda-betrothed
      - 1375-03-16-two-new-taifas
      - 1375-03-16-restoration-of-al-andalus
      - 1375-03-17-maryam-to-the-diwan
      - 1375-04-15-catalan-marriage
    text: >
      The ink on the peace with Arghūn was hardly dry when our lord [Saʿd](person:saad-ibn-yusuf) reordered
      the realm. He did it in three parts, and the court said afterwards that the third was the one the first
      two had been for.


      The first part was [Mursiyya](place:mursiyya). It had been one of the first ṭāʾifas, under the sultan's
      protection for thirty-five years, and the crown now took it into its own hands. Its towns, from Mursiyya
      and Qarṭājanna to Lūrqa and the hills of Albacete, passed to the sultan directly. Its ḥājiba,
      [Dolça](person:dolca-of-murcia), the old house of Oriola's daughter, was not cast aside. She was granted
      lands and titles and confirmed as a governor. Her daughter [Bernarda](person:bernarda-of-murcia), eight
      years old and gifted beyond her years, was betrothed to the heir [Ismāʿīl](person:ismail-ibn-saad). The
      boy was nine and charmed everyone who met him. His tutors noted that he had already learned to tell each
      of his elders what that elder wished to hear, and they did not all count it a virtue. The crown's reach
      in Mursiyya would be short at first, and the sultan meant it to be. Mursiyya's traders were bound to the
      Catalans of the coast, and its court had a Catalan cast to it, so he let its institutions stand inside
      the state instead of ignoring them. There was one thing the dīwān watched. Bernarda, a Castilian by her
      father's blood, was being raised at the court of Qashtāla. The betrothal held all the same.


      The second part was the conquered land itself. The sultan did not keep it. In the east he freed the
      Catalans from the Aragonese, as his heralds put it, and made a strong ṭāʾifa of them around
      [Barshalūna](place:barshaluna): twenty-eight towns and four hundred and fifty thousand souls under a
      Catalan of their own, [Francesc de Montsoriu](person:francesc-de-montsoriu), whom the court called the
      ḥājib. In the west, on the edge of the Aragonese hills, he proclaimed a renewed Arghūn: six towns around
      Benabarre and Munt Shūn, under a king of the house of Borja, [Alfons](person:alfons-de-borja), whom the
      scribes counted the fifth Alfons to wear that crown. It was an Islamic state remade from the old one,
      dressed as its successor. The kings of Ifranja and the Pope at Avignon could say that the sultan had
      swallowed a Christian kingdom. They could not easily say it of a sultan who had given Arghūn back to a
      king of Arghūn.


      The third part was the restoration. Ever since the first war against the Aragonese, the sultan had
      called himself the successor of the caliphs. Now he gave up the word successor. On 12 Shawwāl 776 the
      dīwān proclaimed the restoration of al-Andalus: not a new state that inherited the old one, but the old
      one itself, a single line running back through the Naṣrids and the ṭāʾifas to the Umayyads of
      [Qurṭuba](place:qurtuba) and the conquest, more than six hundred years. The sultanate of
      [Gharnāṭa](place:gharnata) was no more. In its place stood al-Andalus, and its lord was Emperor and
      Sultan. Woe to those who denied it.


      The scholars put a question to him that al-Andalus had faced since the days of the Umayyads. Would he
      revive the convivencia of the caliphs, when mosques stood beside synagogues and churches, Ibn Rushd
      argued with Aristotle and Maimonides found refuge under Muslim rule? Or would he take the road of the
      Almohads and the Almoravids, who crossed the Strait with armies of Berber cavalry and built an empire on
      military piety and strict doctrine? The Emperor did not hesitate. *Let Qurṭuba shine again as the
      ornament of the world.* Tolerance, wealth and learning were to stand level with the Word. The realm
      would feel it for thirty years, in its scholars and its markets and in the ease of its Christians and
      Jews.


      The dīwān changed with the realm. The next day the Emperor's younger sister
      [Maryam](person:maryam-bint-yusuf) took a seat in it, eighteen years old and the ablest mind at court,
      set to reshaping the realm's ideals. His principal wife, [Aiman](person:aiman-mamluk), held no office
      there, for no custom allowed a consort to sit on the council. Everyone at court knew she sat there all
      the same, by the strength of the harem. [Duʿāʾ](person:dua-marinid), who held her seat by law and had
      held it for twenty years, was heard to say that she had never needed to sit anywhere by strength. Aiman
      was heard to answer that she had never needed the law. A month later his sister
      [Fāṭima](person:fatima-bint-yusuf) was married to the ḥājib of Barshalūna, and the house of Naṣr was
      bound to the Catalans.


      Much work remained. The bureaucracy would have to stretch over the new lands, and Qashtāla watched the
      consolidation greedily from behind a truce with three months left to run. But the empire had been
      proclaimed, and it was not waiting for the Christians' permission.


      *Indeed, the earth belongs to Allāh. He causes to inherit it whom He wills of His servants, and the best
      outcome is for the righteous.*
