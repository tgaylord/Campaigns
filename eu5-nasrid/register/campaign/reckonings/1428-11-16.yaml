tellings:
  - id: 0831-08-19-of-the-village-granaries-and-the-road-to-niani
    'on': '1428-06-03'
    title: Of the Village Granaries, and the Road to Niani
    verse: '12:47'
    who:
      - ismail-ibn-saad
      - tiramakhan-mali
      - khayr-al-din-al-jayyani
    where:
      - ishbiliyya
      - qurtuba
    covers:
      - 1428-06-03-the-village-granaries
      - 1428-06-03-farms-mills-and-acequias
      - 1428-06-03-embassy-to-niani
      - 1428-05-25-primacy-revoked
      - 1391-07-coast-to-mali
    text: >
      The Emperor [Ismāʿīl](person:ismail-ibn-saad) had taken the umarāʾ's equality from them at the Jamāʿa of
      831, and he knew it would not be forgotten. He did not try to win back the great houses. He went around
      them, to the people who lived on their lands. In the first half of that year, at his insistence, the
      crown began to build a granary in nearly every large village of the empire: a stone store, held in
      common, where a farming settlement could set aside part of each harvest against a bad year. The Emperor
      told the dīwān why. He was old enough to remember the wars with Qashtāla, when armies ate the harvest
      before it was in, bread doubled in price in a season, and the villages of the frontier went hungry while
      their lords sold grain in the cities. A village with its own store would not go hungry again, and it
      would know who had built the store.


      The granaries had to be filled. Across several of the farming countries the crown laid out new wheat
      fields, built windmills on the ridges to grind them, and dug acequias to water them, in the manner of
      the canals the Emperor's father had dug along the great river from Ishbīliya to
      [Qurṭuba](place:qurtuba). Lumber mills went up beside them to cut the timber for the granaries and, when
      the time came, to rebuild them. The work cost the umarāʾ almost nothing and the peasants less, and that
      was the point: the villages would owe their bread to the crown, and the lords could not even complain of
      the price.


      The other half of his plan lay across the sea. Thirty-seven years earlier, as crown prince, Ismāʿīl had
      sent [Khayr al-Dīn al-Jayyānī](person:khayr-al-din-al-jayyani) to find a road to Mālī by water, so that
      the gold of the south would no longer pay a toll at every well of the Ṣaḥrāʾ. Now the road was there, by
      way of the islands of the Green Cape, and in the spring of 831 his envoys took it. They sailed south to
      the coast and went inland, up the rivers and across the savanna, to Niani, the city of Mansa
      [Tiramakhan](person:tiramakhan-mali), who had ruled the gold country for eighteen years. They carried
      gifts from Ishbīliya, and they came home with gifts from Niani and with something worth more: the
      Mansa's word that Andalusī merchants would pay no tariff anywhere in his empire.


      Before the envoys had finished their report, the merchants of Ishbīliya were fitting out expeditions to
      bring the gold north. Some of it would go to the jewellers of the capital, whose work was already sold
      from Cairo to Bruges. The rest would be sold on to the Christians, who had no road to Mālī of their own
      and would have to buy its gold from the Emperor. The court said that the Emperor had spent the umarāʾ's
      privileges on the villages and would get them back from the Franks.


      *He said: You will plant for seven years consecutively; and what you harvest, leave in its spikes,
      except a little from which you will eat.*
