  - id: 1428-06-03-embassy-to-niani
    'on': '1428-06-03'
    kind: world
    what: >-
      Andalusī envoys sail the new sea roads and travel inland to Niani, the city of Mansa Tiramakhan of Mālī.
      The two empires exchange gifts, and the Mansa exempts Andalusī traders from tariffs throughout his
      empire. Expeditions are already being planned to bring the gold of Mālī north, to the jewellers of
      al-Andalus and for resale to the Europeans
    who:
