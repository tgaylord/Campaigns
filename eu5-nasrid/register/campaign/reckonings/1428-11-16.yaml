      result: Andalusī traders exempt from tariffs in the Mali Empire (Trent)
      plans: >-
        expeditions to bring Mali's gold north for the Andalusī jewellery market and for resale to Europe
        (Trent)
      mali: >-
        14th in the world, 82 towns and 92 in subjects; Mansa Tiramakhan since 1410, heir Majan born 1405
        (world file of 25 May 1428)
