  - id: 1370-09-14-strait-ends
    'on': '1370-09-14'
    kind: world
    what: >-
      The Battle for the Strait is over: the Throne of Granada endures. Qashtāla has stopped sending demands,
      Fās has failed to cross, and the throne in Gharnāṭa has the same occupant it began with. Granada stands
      free
    who:
      - saad-ibn-yusuf
    from:
      - seen
    cite: Trent's screenshots of the event (14 September 1370)
    detail:
      situation: battle_for_the_strait
      ending: The Throne of Granada Endures
      option: Granada stands free
      effects:
        - 'Consolidated Governance for 100 years: +0.5% monthly control, +25% speed of integration'
        - Al-Andalus can be formed while holding fewer Iberian territories
        - the Reconquest of Iberia can be fabricated at reduced cost
        - every location held in Granada, Andalusia and Murcia raised to core integration
        - every ṭāʾifa being annexed gains 25% annexation progress
        - enables the decision Usher in the Golden Century, which starts the Golden Century situation
