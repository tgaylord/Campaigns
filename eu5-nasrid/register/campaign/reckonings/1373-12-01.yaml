    text: >
      After [Antaqīra](place:antaqira) the war belonged to [Khālid](person:khalid-ibn-yahya). On the twentieth
      of Rabīʿ al-Thānī 771 he fell on a Marīnid landing at [Abdara](place:abdara) and left none of its nine
      hundred and seventy alive. In Jumādā al-Ūlā the Egyptians came down from Jarghal and joined him before
      [Mālaqa](place:malaqa). It was a strange army: Andalusīs, men of [Balansiyya](place:balansiyya),
      mercenaries from every shore of the sea, and the soldiers of the Mamlūk sultan in their quilted coats.
      When seven hundred and fifty Marīnids were foolish enough to attack it, they were destroyed without the
      loss of a single man. In Shaʿbān the Marīnid general Muṣliḥ al-Dīn tried again at Mālaqa with three
      thousand three hundred and left two thousand four hundred and forty of them under its walls.


      In Ramaḍān the Egyptians wanted a victory of their own. With the men of Balansiyya beside them, five
      thousand six hundred and fifty Mamlūks attacked [ʿUthmān](person:osman-marinid) at
      [Sharīsh](place:sharish) on the third of the month. They were thrown back, and three thousand one
      hundred and ten of them were left in the vineyards. Six days later Khālid came to Sharīsh with seven
      thousand two hundred and sixty. ʿUthmān lost eighteen hundred and seventy men and Sharīsh, and the
      Egyptians were avenged. In Dhū al-Qaʿda a last Marīnid army of three thousand three hundred and eighty
      landed in al-Gharb, hoping to find [Gharnāṭa](place:gharnata)'s newest ṭāʾifa undefended. Khālid marched
      the length of the south to meet it at [Bāja](place:baja), and two thousand two hundred and sixty of the
      invaders never saw the sea again.


      By the summer [Fās](place:fas) was finished, though it did not yet admit it. One more battle was needed.
      On the nineteenth of Ṣafar 772 two thousand eight hundred and ninety Marīnids met eight thousand three
      hundred and seventy Granadans at Mālaqa, where so much of the war had been fought. They lost a thousand
      and forty men, and we lost a hundred and fifty-four. That same day the envoys of [Abū
      ʿInān](person:abu-inan-faris) sealed the peace.


      Fās gave up the whole northern shore. [Runda](place:runda) and [Marballa](place:marballa) came back to
      the house of Naṣr, and so did the nine towns of the so-called Kingdom of Sevilla, which ceased to exist:
      [Qādis](place:qadis), Sharīsh, [Labla](place:labla), [Shalūqa](place:shaluqa),
      [Shidhūna](place:shidhuna), [Arkush](place:arkush), [Jabal Ṭāriq](place:jabal-tariq),
      [Ṭarīfa](place:tarifa) and [al-Jazīra al-Khaḍrāʾ](place:al-jazira-al-khadra). That was eighty-four
      thousand souls, many of them already Muslims after five years under Fās. The Marīnids would pay
      reparations and swore to keep the sea free of their corsairs. With its ṭāʾifas, Gharnāṭa held every one
      of the seventy-two towns of the Strait's three lands, both of its shores. The price was written in the
      dīwān's registers: some thirteen thousand of the sultan's own men dead in two years of war, and
      twenty-three thousand of the enemy.


      Two days later, on the twenty-first of Ṣafar, the chancellor read a reckoning to the court. The crown of
      Qashtāla had stopped sending demands. Fās had tried twice to cross and failed both times. The throne in
      Gharnāṭa had the same occupant it had begun the war with. For a generation every court of Christendom
      and the Maghrib had expected the house of Naṣr to fall, and it had outlasted them all. Our lord
      [Saʿd](person:saad-ibn-yusuf) answered in three words, and the scribes wrote them at the head of the
      register: *Gharnāṭa stands free.* Every town of the old kingdom and the valley of the great river was
      made a part of the realm for good, the government of the realm was confirmed for a hundred years, and
      the ṭāʾifas were drawn closer to the throne.


      So the scale that had hung between Qashtāla and Fās for twenty-four years came to rest, and it came to
      rest in Gharnāṭa. Al-Ḥājj Yūsuf began this book as the tributary of one and the prey of the other. His
      son ended it as the master of the Strait. What the house of Naṣr does with that freedom belongs to
      another book.


      Here ends the Book of the Balance.


      *O you who have believed, persevere and endure and remain stationed, and fear Allāh that you may
      succeed.*
    behind: >-
      Book II now runs complete from 1346 to 1370.


      **Kept out of the text**

      - **The tributary glitch.** At the peace of 5 April 1366 the game put Granada back under Castile as a
      tributary, although Trent had declared independence. He removed it with the console before 6 November
      1366. The chronicle treats Granada as free from the peace. The Mamlūk alliance vanished in the same
      window and was most likely lost in the fix. The chronicle has it lapse and Saʿd renew it in January
      1367, which the save shows.

      - **The missing battles.** The game drops a war's battle records at the peace. The second Marīnid war's
      battles come from the saves of 18 November 1369 and the 1 July 1370 autosave, plus Trent's screenshot of
      the last battle at Málaga. Anything fought between July and September 1370 is lost. Granada's dead,
      about 13,000, are from Trent's war screen and include attrition. The 23,000 Moroccan dead are battle
      losses only.


      **From the game, with the chronicle's reading**

      - Naṣr al-Istijjī died the day the regency ended. The game says hunting accident, and Trent's account
      says "sickness". The text follows the rule for deaths the court keeps quiet (SYSTEMS §5): the court's
      "sickness" in the prose, with the huntsmen's story as the hint.

      - Saʿd married Duʿāʾ, his father's widow. The game allows it. The Qurʾān (al-Nisāʾ 4:22) forbids it, so
      the chronicle makes the ʿulamāʾ's anger (37% in May 1364, from Trent) about the marriage, and the
      Jamāʿa's restored jizya the price of their silence.


      **Invented colour**

      - The fever on Yūsuf's last march.

      - The huntsmen's story.

      - Murād's flank attack at Zafra.

      - The mercenaries giving way and Khālid's guard at Antequera.

      - Aiman's letter to Cairo, her answer about Umm al-Fatḥ's name, and Saʿd's "Let them come".

      - Saʿd taking the blame for the Cádiz assault before the dīwān.

      - Ibn al-Khaṭīb's escape at San Clemente. The save shows him alive.

      - The Egyptians' quilted coats.

      - In the Book V entries of 1374–1378: Saʿd breaking the fast with his soldiers and standing in the line
      at Shalūqa, his letters home from the camp, the letters between Duʿāʾ and the camp, the envoys' threat
      of a war in Ṣiqilliya, the sultan's "for now", the tutors' remark on Ismāʿīl, and the reasons given for
      the shipwrights. The events and figures are the game's.
