    covers:
      - 1370-09-13-the-world
      - 1367-10-04-castile-portugal-union
      - 1367-01-30-mamluk-alliance
      - 1370-09-12-peace-morocco
    text: >
      When the map of the caliphs hung in the Hall of Ambassadors, our lord [Saʿd](person:saad-ibn-yusuf) saw
      that it showed only al-Andalus, and he asked for the rest of the world. He told the chancery to make him
      a survey of the kingdoms like the one Ibn Faḍl Allāh al-ʿUmarī wrote in Cairo a generation before, *The
      Roads of the Eyes through the Kingdoms of the Cities*. It was to say who ruled each kingdom, how many
      towns and men it had, whom it loved and whom it hated. The scribes questioned the Genoese factors in
      [Gharnāṭa](place:gharnata), the Mamlūk envoys, the captives of the last war and the pilgrims coming home
      from the East. At the end of Ṣafar 772 they laid before him a list of the powers of the world in order
      of their weight, and this is its substance.


      **Of the far East.** The three heaviest kingdoms of the earth lie beyond India, in al-Ṣīn and the
      islands past it. The reckoners set them down with care, because the numbers were hard to believe: the
      first of them counts its people in tens of millions. None of them has ever heard of Gharnāṭa, and the
      sultan said it was a comfort to know that some empires are too far away to be a danger.


      **Of Miṣr, the sultan's friend.** The seventh kingdom of the world is the realm of the Mamlūks, and it
      is the only crown that stands with Gharnāṭa. Its sultan is [Būlād](person:bolot-mamluk), who took the
      throne when his father Jamāl died in Ṣafar 770. He is twenty-six, and he is the half-brother of the
      sultan's wife [Aiman](person:aiman-mamluk), so the alliance now runs through the household as well as
      through the treaty. Miṣr has a hundred and fifty towns of its own and nearly as many again in its
      subjects, from the Ḥijāz to the Taurus, and some sixty thousand men under arms. Its weakness is at home:
      the envoys admitted that Cairo has been restless since the old sultan died.


      **Of the house of ʿUthmān.** The Ottoman Turks have done what the Companions of the Prophet could not
      do, and taken Constantinople. Their sultan [Muḥammad](person:muhammad-ottoman) is twenty-two, the same
      age as our lord. He is a careful governor and a timid soldier, and the second is said of him more
      quietly. He is at war with Karaman and the beyliks of Anatolia, with twenty-seven thousand men in the
      field and seventy-three ships at sea. The Rūm who once ruled from Constantinople keep only twenty-five
      towns around Demetrias in Thessaly. The ʿulamāʾ wept when they heard it. A courtier pointed out that the
      Turks are twenty-seventh among the powers and nowhere near the Strait.


      **Of the Franks.** France and England are the fourth and fifth kingdoms of the world, and they hate each
      other. [Jean of France](person:jean-of-france) has reigned for twenty-eight years and is losing his
      kingdom slowly. His realm is in disorder, and England's vassals hold Aquitaine, Burgundy, Flanders and
      Brittany. England has a new king, [Edward](person:edward-of-england), crowned in Dhū al-Ḥijja. His crown
      rules more land through its subjects than in England itself. The scribe noted that the king of France
      also counts Qashtāla among his enemies, and he wrote that line in red.


      East of France sits [Charles of Bohemia](person:charles-of-bohemia), Emperor over three hundred and
      nineteen princes and cities. He is fifty-four, and by every report the ablest prince in Christendom. For
      reasons no envoy could explain, he names [Fās](place:fas) and Tūnis among his rivals. The
      [Pope](person:pope-abundius), an old man of sixty, sits at Avignon rather than Rome, and of all the
      princes of the north he is the only friend of Qashtāla. Italy is divided between two leagues. The
      Guelphs follow Naples, the Pope and Genoa. The Ghibellines follow Florence, Venice, Milan and Ṣiqilliya.
      Naples, Hungary and Croatia have one king, [Robert of Anjou](person:robert-of-anjou), a scholar of
      nineteen. His armies are far away in Halych and Volhynia. Genoa has only six towns of its own. But the
      scribe counted its trade and found it worth twice the trade of all Qashtāla, and he advised the sultan
      never to quarrel with a Genoese he owed money to.


      **Of the Maghrib.** Fās is eleventh in the world, two places above Gharnāṭa. It is twice beaten but not
      broken. [Abū ʿInān Fāris](person:abu-inan-faris) rules [Tilimsān](place:tilimsan) as his fief, and
      Tilimsān still had eleven thousand men under arms when the peace was sealed. The Marīnid fleet is the
      true danger: eighty ships, against the sultan's four. The reckoners also found that Fās names Qashtāla,
      Portugal and Naples as its rivals, and not Gharnāṭa. The dīwān argued over whether this meant
      forgiveness or contempt. Beyond Fās, the Ḥafṣid [Ibrāhīm](person:abu-ishaq-ibrahim) rules Tūnis and nine
      subject lands, the twenty-first power of the world. His realm is close to disorder and his quarrel is
      with Tilimsān, so the Marīnids have an enemy at their back.


      **Of the Land of the Blacks.** South of the sands, Mālī is sixteenth in the world, and every caravan of
      gold that reaches the Maghrib comes from its mines. Its throne stood empty when the scribes wrote, its
      heir is a boy of seven, and its armies are at war with the Mossi. Merchants said the gold still came
      north.


      **Of the Peninsula.** Last the scribes came home. Qashtāla is eighth in the world, and with the
      Portuguese crown on its king's head since Ṣafar 769 it is the greatest power any sultan of Gharnāṭa has
      faced. But among the great powers it stands second from the last, barely ahead of Bohemia, and no
      stronger. [Jerónimo](person:jeronimo-of-castile) kept no army in the field. Arghūn, forty-seventh in the
      world, has a king of twenty, [Joan](person:joan-of-aragon), who also rules Ṣiqilliya, and Arghūn itself
      has spent its strength.


      **Of Gharnāṭa.** Then the scribes wrote the realm itself into the list: thirteenth among the powers of
      the world, not yet counted among the great powers, but in the company of Delhi and of Majapahit in the
      islands of the Indies. Twenty years before, Gharnāṭa had no place on the list at all, because the
      reckoners only count sovereign kingdoms, and Gharnāṭa paid tribute to Qashtāla. The scribes judged that
      the distance between it and the last of the great powers was no longer great.


      The sultan read the whole survey in one sitting. Then he asked for three things to be copied out on a
      single leaf: the king of France is Qashtāla's enemy, Fās does not count Gharnāṭa among its enemies, and
      Miṣr is ruled by his wife's brother. He kept that leaf with him. The rest of the survey went to the
      treasury beside the map of the caliphs.


      *O mankind, We have created you from male and female and made you peoples and tribes, that you may know
      one another.*
    behind: >-
      The survey's order is the game's great-power ladder in the save of 13 September 1370, read by
      `tools/world_powers.py`, and the Kingdoms hall shows the same ladder at every checkpoint. The game ranks
      only sovereign countries, which is why Granada has no place on it in its tributary years. The Great
      Powers are the ranked countries above the first Regional Power: nine in 1370, seven to ten over the
      campaign. "Men under arms" means regulars and raised levies on the map. In peacetime most countries
      stand their levies down, so a zero for Castile means no army in the field, not none to raise. Egypt's
      60,000 are mostly raised levies.


      Invented colour: the commission and the scribes' sources, the sultan's leaf of three lines, the court's
      tears for Constantinople and its argument over Fās, the Genoese advice, and Cairo's restlessness (the
      save shows Egypt's stability low, not its cause). Bolot's father Jamāl and his kinship with Aiman come
      from the save.
