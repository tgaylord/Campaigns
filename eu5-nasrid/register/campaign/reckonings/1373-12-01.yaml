    text: >
      When the war chest was empty and the mercenaries had gone home, our lord [Saʿd](person:saad-ibn-yusuf)
      turned to the lands he had won. He did not like what the dīwān's reckoners showed him. Three realms were
      living under one crown, and only one of them was rich.


      The first was the old kingdom of the mountains and the coast, from [Gharnāṭa](place:gharnata) to
      [Mālaqa](place:malaqa): eighteen towns and a quarter of a million souls, nearly all of them Muslim, and
      nearly three-quarters of what the land could yield reaching the treasury. The second was the valley of
      the great river, won from Qashtāla in the wars of the last twenty years: thirty-one towns and four
      hundred thousand souls, one in five of them Muslim, held by the crown with half a grip and yielding
      three-fifths of what it might. The third was the north shore of the Strait, taken from [Fās](place:fas)
      only months before. There were eleven towns and eighty-five thousand souls, more than half of them
      Muslims, because the Marīnids had converted them. They had been fought over again and again in twenty
      years of war. Their fields were poorer than when the wars began, [Runda](place:runda) poorest of all. Of
      every hundred dīnārs the north shore could have paid, less than one came to Gharnāṭa.


      Then there was [Ishbīliya](place:ishbiliyya). The reckoners counted seventy-seven thousand seven hundred
      souls in it, more than in Gharnāṭa itself, so the greatest city of the realm was not the sultan's
      capital. Its weavers made cloth fine enough for kings, its smiths made arms, and its paper-makers and
      copyists kept a scriptorium. It was still a Christian city in its tongue and in most of its prayers. But
      in the last four years the Muslims within its walls had grown from twenty thousand to twenty-four
      thousand, and the crown's hold on it had risen from less than half to more than half. In the merchants'
      reckoning its market had become the first in all the West, ahead of Fās. The sultan said that a city
      like that was worth more than a province of wheat, and that he would rebuild the north around it.


      He began with the dīwān. [Maryam bint Ismāʿīl](person:maryam-bint-ismail), who had spent four years
      binding the new lands to the crown, was set to the same work as [Duʿāʾ](person:dua-marinid): making the
      conquered towns Andalusī again. Duʿāʾ took Ishbīliya and Maryam took [Jayyān](place:jayyan), which
      already had its madrasa. The sultan told them he did not want the Castilians driven out, because a
      weaver who left took his loom with him. He wanted their children to speak Arabic.


      In Shaʿbān 772 the ʿulamāʾ came to him about the moneylenders. In the towns of the valley, they said,
      Muslim merchant families had begun to lend at interest, as the Jews and the Genoese did, and the
      practice was spreading. The qāḍī recited the verse: *Allāh has permitted trade and forbidden usury.* The
      court waited. The sultan had sat through every war of his reign in debt to his own estates, and he still
      owed seven loans. He answered that the ʿulamāʾ were overreacting, and that he would sooner have Muslims
      lending in Ishbīliya than Genoese. The ʿulamāʾ went away displeased, and they did not forget it.


      The treasury now gained a little over ten dīnārs a month, and the sultan meant to spend all of it in the
      north. There were Castilian rebels in arms in the hills and a claim against Qashtāla to be drawn up.
      There was also [Mursiyya](place:mursiyya), one of the two oldest ṭāʾifas, which the crown had begun to
      draw into its own hands; its new ḥājiba, [Dolça](person:dolca-of-murcia) of the old house of
      [Uryūla](place:uryula), had taken her seat only that winter. None of it would come cheap. But the court
      noted that this was the first sultan of the house of Naṣr to talk about rebuilding the towns of the
      valley instead of defending the passes against them.


      *O you who have believed, do not consume one another's wealth unjustly, but only in lawful business by
      mutual consent.*
