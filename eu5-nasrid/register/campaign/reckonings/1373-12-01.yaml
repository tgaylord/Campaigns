date: '1373-12-01'
title: The War of the Upper March
source:
  save: SP_GRA_1373_12_01 (compressed)
  game: 1.4.6
summary: >-
  On 1 December 1373 Granada declares war on Aragon under the Reconquest of Iberia claim, six months after the
  truce ran out. Aragon fights with only the crown its king also wears, Sicily, and Sicily's three subjects;
  Sicily's allies Genoa (at war with Bologna and Pisa since May) and the Pope stay out. The Mamlūks answer the
  call with their vassals, their galleys pointed at Sicily (Trent's account). The sultan leads the regulars
  himself and raises no levies: 3,300 men under arms against Aragon's 400. The debts are paid, the treasury
  holds 344, and the Castilian truce holds until June 1375. Shares of power are estimated from the 1 June 1349
  reading.
