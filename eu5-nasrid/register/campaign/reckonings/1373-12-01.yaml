    text: >
      The day after the reckoning of the Strait was read, our lord [Saʿd](person:saad-ibn-yusuf) had the great
      map of al-Andalus brought out of the treasury of [Gharnāṭa](place:gharnata). It had been drawn in the
      days of the caliphs, and no sultan of the house of Naṣr had unrolled it in living memory, because it
      only showed what had been lost. Across its northern half ran three lines in red ink, the *thughūr*: the
      marches where the land of Islam met the kingdoms of the Christians. The Lower March ran from
      [Bāja](place:baja) to [Baṭalyaws](place:batalyaws) and [Mārida](place:marida). The Middle March was the
      march of [Ṭulayṭula](place:tulaytula). The Upper March was the march of [Saraqusṭa](place:saraqusta) on
      the Ebro. In the caliphs' day the marches had been the realm's shield. For a hundred and fifty years
      since, they had been the roads by which the Christians came south.


      Now the sultan laid the map beside the dīwān's own, and the court saw how far the frontier had moved.
      The ṭāʾifa of al-Gharb under [Rodrigo of Silves](person:rodrigo-of-silves) looked across the Tagus at
      [al-Ushbūna](place:al-ushbuna). The ṭāʾifa of [Balansiyya](place:balansiyya) looked north up the coast
      toward [Barshalūna](place:barshaluna), the city of the Catalans. Between them the realm's own lands,
      from [Qurṭuba](place:qurtuba) to the hills of [Mursiyya](place:mursiyya), faced the long border of
      Qashtāla. The thughūr were the frontier again, and for the first time since the caliphs they faced the
      other way.


      The dīwān's reckoners laid out the balance, and they began with a marriage of crowns. Three years
      before, in Ṣafar of the year 769, Queen [Maria of Portugal](person:maria-of-portugal) had died, and her
      crown had passed to her son [Jerónimo](person:jeronimo-of-castile), who had been king of Qashtāla since
      his father Alfonso fell on the march in the last war. Maria and Alfonso had joined their crowns by
      marriage a quarter of a century before; now the son wore both. Each kingdom kept its own council and its
      own law of succession, and the Portuguese still called themselves a free people. But al-Ushbūna and
      Ṭulayṭula now sent their letters to one court, and the frontier from the Tagus to the hills of Mursiyya
      answered to one king. For a generation the reckoners did not count Portugal as a separate realm.


      Arghūn had thirty-six towns and had lost its nerve, and its young king wore the crown of Ṣiqilliya as
      well. [Fās](place:fas), across the water, had ninety and had been beaten twice. The two crowns of
      Jerónimo together held two hundred and eighty-three towns and four million souls: two hundred and
      twenty-nine towns and three million in Qashtāla, fifty-four towns and nine hundred thousand in Portugal.
      Gharnāṭa with its ṭāʾifas had a hundred and two towns and one million one hundred thousand. On paper the
      north was nearly four to one. But Qashtāla had bled for twenty years. It had lost its southern shore to
      the Marīnids, its south to Gharnāṭa, and a fifth of the people of Extremadura and the lands of Ṭulayṭula
      to the wars that burned across them. Portugal had lost its south to the ṭāʾifa of al-Gharb. The
      reckoners' spies found that Jerónimo kept no army in the field at all, only nine ships, while the sultan
      still kept his regulars under arms. Its king no longer sent demands. The court judged it an even fight,
      if Gharnāṭa struck before the two crowns learned to fight as one.


      The reckoning of the Strait had left the sultan more than a title. The old kingdom and the valley were
      his for good. The jurists said the claim to all al-Andalus could now be pressed at less cost than ever
      before. And the ṭāʾifas had been drawn closer to the throne. The sultan had been made heir, in the eyes
      of his court, to the caliphs whose map lay on his table. One more war might be enough to make that claim
      true.


      There were reasons for patience. The estates were still owed four hundred and sixty-nine dīnārs. The
      mercenaries still had to be paid. Thirteen thousand of the sultan's men lay in the soil of
      [Mālaqa](place:malaqa), [Qādis](place:qadis) and [Antaqīra](place:antaqira). And Saʿd was twenty-two,
      with a lifetime before him. The court remembered what his father had learned: a war of freedom cannot be
      fought from the treasury, but a war of conquest must be.


      The sultan had the old map hung in the Hall of Ambassadors, under the cedar heavens his uncle
      [Faraj](person:faraj-ibn-ismail) had raised as regent, where every envoy from the north would see it.
      Three days later, on the twenty-fifth of Ṣafar, Faraj himself died far beyond the desert, where he had
      lived since his marriage in the land of Ghāna fifteen years before. He was fifty-three. The news was
      months on the road, and few at court still remembered his face, though every envoy who came to Gharnāṭa
      would stand under his ceiling. The sultan went back to the business of the treasury. Here begins the
      Book of the Marches.


      *And We wanted to confer favour upon those who were oppressed in the land and make them leaders and make
      them inheritors.*
  - id: 0772-02-27-the-survey-of-the-kingdoms
    'on': '1370-09-20'
    title: The Survey of the Kingdoms, After the Manner of the Roads of the Eyes
    verse: '49:13'
    who:
