tellings:
  - id: 0767-07-23-the-peace-of-independence
    'on': '1366-04-05'
    title: Of the Conqueror, the Renegade at San Clemente, and the Peace of Independence
    book: book-of-balance
    verse: '48:1'
    who:
      - saad-ibn-yusuf
      - murad
      - ibn-al-khatib
      - aiman-mamluk
      - dua-marinid
      - ismail-ibn-saad
      - umm-al-fath-bint-saad
      - rodrigo-of-silves
      - sayyida-of-fezzan
    where:
      - balansiyya
      - tulaytula
      - gharnata
      - walba
      - ayamunt
      - ukshunuba
    covers:
      - 1364-12-13-birth-umm-al-fath-bint-saad
      - 1365-03-saad-conqueror
      - 1365-07-14-battle-canete
      - 1365-09-02-peace-aragon
      - 1366-01-06-battle-san-clemente
      - 1366-03-08-birth-ismail-ibn-saad
      - 1366-04-05-peace-castile
      - 1366-04-13-taifa-al-gharb
      - 1366-04-05-the-south-burned
    text: >
      In Rabīʿ al-Awwal of the year 766 [Aiman](person:aiman-mamluk) gave the sultan his first child, a
      daughter. He named her [Umm al-Fatḥ](person:umm-al-fath-bint-saad), mother of victory, which was either
      a prayer or a boast. Aiman, a daughter of the Mamlūk house, is said to have answered that in Cairo it
      would be read as both. By spring the chancellor was recording a new title in the registers of the dīwān.
      The court had stopped calling [Saʿd](person:saad-ibn-yusuf) the prodigy. It called him *al-Fātiḥ*, the
      Conqueror. He was seventeen.


      The war in the east still had to be finished. On the twenty-fourth of Shawwāl, at Cañete, where the
      Portuguese had broken the men of [Balansiyya](place:balansiyya) the year before, sixteen hundred
      Aragonese attacked [Murād](person:murad)'s army of five thousand seven hundred. Twelve hundred and sixty
      of them were left on the field, against a hundred and ninety of ours. Arghūn had joined the war for an
      ally's sake and gained nothing from it. On the fifteenth of Dhū al-Ḥijja it made its own peace and
      agreed to pay reparations for ten years.


      That left Qashtāla, alone, as [Gharnāṭa](place:gharnata) had been alone so often. On the twenty-second
      of Rabīʿ al-Thānī 767 Murād found its last army in the field at San Clemente, in La Mancha. There were
      nine hundred and fifty men, and at their head was a man the court knew well. It was [Ibn
      al-Khaṭīb](person:ibn-al-khatib), the vizier who had gone over to the Cross a quarter of a century
      before and served Qashtāla ever since as Frederick, its admiral. Murād had six thousand two hundred and
      fifty men. Eight hundred and forty Castilians died, a hundred and five were taken, and thirty-one
      Granadans fell. The renegade escaped, as he always did. The army pushed on into La Mancha and up the
      road to [Ṭulayṭula](place:tulaytula), the old city of the Goths, and held it when the envoys came.


      A month before the peace, [Duʿāʾ](person:dua-marinid) gave the sultan a son,
      [Ismāʿīl](person:ismail-ibn-saad), and the realm had an heir of the sultan's own blood. The ʿulamāʾ
      remembered whose widow his mother was, and prayed for the child all the same. From that month the palace
      had two parties. Aiman had the sultan's first child and Egypt behind her: the Mamlūk sultan's alliance,
      his money and his soldiers. Duʿāʾ had the heir, the dīwān, and the learning of the Maghrib that half the
      scholars of the realm now copied. Sayyida, the matriarch, belonged to neither and was courted by both.
      The sultan had just won his kingdom its freedom. He found that it was now worth fighting over, and that
      the fight had begun in his own house.


      On the twenty-third of Rajab 767 the peace was sealed, and the tyrant of Qashtāla let Gharnāṭa go. The
      house of Naṣr, which had paid tribute to the Castilian crown for longer than anyone living could
      remember, declared itself free and subject to no one but Allāh. Qashtāla gave up the country of
      [Walba](place:walba): six towns between the Guadalquivir and the Guadiana, from the coast to the hills
      of Aracena. Among them was [Ayamūnt](place:ayamunt), where al-Ḥājj Yūsuf had died on the march, so the
      son brought the place of his father's death into the realm. Qashtāla paid a sum into the treasury and
      owed reparations for ten years. Ṭulayṭula was given back, burned and half emptied, its people fewer by a
      third than they had been seven years before.


      Eight days later the sultan kept his word to the Portuguese south. On the first of Shaʿbān the thirteen
      towns of al-Gharb were made a ṭāʾifa, with its seat at [Ukshūnuba](place:ukshunuba), under [Rodrigo of
      Silves](person:rodrigo-of-silves). He was a Portuguese lord who had taken the shahāda and a soldier of
      real ability. Gharnāṭa now had three ṭāʾifas, and no overlord at all.


      *Indeed, We have given you a clear conquest.*
