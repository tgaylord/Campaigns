summary: >-
  The War of Independence is won. Granada has declared its independence. Castile gave up the land of Niebla
  and Huelva and pays reparations, as Portugal and Aragon do. The realm holds 62 towns and 732,000 people, and
  with its ṭāʾifas 61 of the Strait's 72. The treasury holds 1,131. The game put Granada back under Castile as
  a tributary after the peace, which Trent will remove with the console, so the chronicle and this snapshot
  treat Granada as independent. Shares of power are estimated from the 1 June 1349 reading.
