tellings:
  - id: 0741-01-05-the-second-battle-of-uryula
    'on': '1340-07-01'
    title: Of the Winter before Uryūla, the Closing of the Road, and the Second Battle
    book: book-of-mending
    verse: 2:250
    who:
      - ibn-al-khatib
      - yahya-rahhu
      - yusuf-i
    where:
      - uryula
      - mursiyya
    covers:
      - 1339-11-08-volunteers-withdraw
      - 1340-03-09-estate-loans
      - 1340-05-26-battle-mursiyya
      - 1340-05-30-uryula-falls
      - 1340-05-30-road-cut
      - 1340-05-30-nobles-discontent
      - 1340-06-20-second-battle-uryula
    text: >
      All that winter the host lay before [Uryūla](place:uryula). When the supplies ran short, the Volunteers
      of the Faith under [Yaḥyā Raḥḥū](person:yahya-rahhu) drew back to find bread, while [Ibn
      al-Khaṭīb](person:ibn-al-khatib) kept the siege lines with the rest. The sultan raised more men to carry
      food and paid for everything with borrowed gold. By the ninth of Ramaḍān in the year 740 the treasury
      owed the estates of the realm more than thirteen hundred and fifty dīnārs. The estates lent freely and
      asked their price in return. With every dīnār lent, their voice in the dīwān grew louder and the crown's
      grew fainter. By spring the nobles spoke louder in the affairs of the state than all the rest together,
      and the crown's own voice was barely heard.


      On the second of Dhū al-Ḥijja, after nearly seven months, Uryūla opened its gates. That same week came
      the news that undid the joy of it. Four days earlier the Castilians had fallen on the Tlemcenī garrison
      of [Mursiyya](place:mursiyya) and killed seven hundred of them, and now they besieged the town. The road
      by which the host had come was closed. There was no way home but through the enemy, so the host stood
      where it was and made ready. And in the realm the nobles, their satisfaction worn thin, began to mutter
      in their castles.


      They did not have to wait long. On the twenty-third of Dhū al-Ḥijja the kings of Nabarra, Mayūrqa and
      Arghūn came down together to throw the Muslims into the sea, thirteen thousand of them under the same
      captain who had been beaten before the same walls. Eighteen thousand of ours held the ground and the
      town behind them. The fight lasted into the new year. On the fifth of Muḥarram 741 the Christians broke,
      leaving seven and a half thousand of their number on the field. We lost two thousand three hundred.
      Twice now Ibn al-Khaṭīb had beaten that captain before Uryūla, and the war turned further in our favour.


      *Our Lord, pour upon us patience and plant firmly our feet and give us victory over the disbelieving
      people.*
