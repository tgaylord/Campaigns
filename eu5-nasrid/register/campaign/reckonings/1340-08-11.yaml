    text: >
      On the first of Ṣafar in the year 741 [Jumalla](place:jumalla) fell to the main army, the same town
      where the war had first drawn blood a year before. The host had won every battle it fought, but it was
      starving. Each day the quartermasters found less to put in the pot, and the road home was still closed
      at Mursiyya.


      But the enemy did not know it. The army of Arghūn and its allies had dwindled to some six thousand men,
      and ours stood near sixteen thousand: the Volunteers at Alsh, [Ibn al-Khaṭīb](person:ibn-al-khatib)'s
      host at Jumalla. So the sultan wrote to the Aragonese king in his own hand. He did not ask for peace. He
      named the towns he would take in it, and told the king plainly that unless he made it, the army of
      [Gharnāṭa](place:gharnata) would march up the coast and burn Barshalūna to the ground. In truth the host
      would hardly have passed the fortress of [Shāṭiba](place:shatiba). Had the king known it, the war would
      have ended in ruin instead of glory. He did not know it. Allāh veiled our hunger from his eyes and
      showed him only our banners.


      On the sixteenth of Ṣafar 741 the peace was sealed. Arghūn gave up everything south of al-Qasṭalyūn and
      Tīrwāl. That meant [Balansiyya](place:balansiyya) the great city, lost to the Christians a hundred and
      two years before, and Shāṭiba of the fortress, [Dāniya](place:daniya) and [Qandiya](place:qandiya) on
      the coast, [al-Qant](place:al-qant) and [Alsh](place:alsh), [al-Qūy](place:al-quy),
      [Ayūra](place:ayura), [Bunyūl](place:bunyul), [Shalba](place:shalba) and [Līriya](place:liriya),
      together with [Uryūla](place:uryula) and Jumalla, where our men had bled. He agreed as well to pay
      reparations for ten years, and the treasury, which had held a hundred and twenty dīnārs in Dhū al-Ḥijja,
      held six hundred and seventy by the day of the peace.


      So the realm that had been eighteen towns grew to thirty-one, and its souls from four hundred and
      eighty-five thousand to six hundred and eighty-three thousand. Among them now are a hundred and
      forty-seven thousand Christians, Catalans and Aragonese and Castilians, who must be ruled justly if they
      are to be ruled at all. Three days after the peace the sultan paid the hired companies their wages early
      and sent them away, and put the host back on peacetime pay. The treasury fell to four hundred and
      seventy, but the monthly loss shrank from twenty-four dīnārs to five. The debt to the estates remains,
      and the nobles remain sullen. But Gharnāṭa is no longer only a jewel in a narrow ring. *Say: O Allāh,
      Owner of Sovereignty, You give sovereignty to whom You will.*
    behind: >-
      From the saves: the estate loans, Uryūla, the garrison lost at Murcia, both battles of Uryūla, the towns
      ceded, the reparations, the treasury and the population. From Trent's account: the road cut, the hunger,
      Jumilla's fall, the bluff and the armies behind it, and the paying-off of the mercenaries.
