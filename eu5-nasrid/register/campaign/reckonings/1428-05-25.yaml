summary: >-
  The day of the Jamāʿa of 831, which revoked the Primacy of Nobility. The umarāʾ are one in six content and
  the realm's peace is all but gone (stability 1). The crown holds 194 towns and 2,552,000 people, with
  armouries in ten of its cities and settlements now on four islands of the Azores, four of the Canaries and
  three of the Cape Verdes. Seven ṭāʾifas; Banbalūna has a new lord, Aḥmad ibn Yūsuf. The truce with Castile
  ran out in 1426, and Galicia has swallowed Asturias. Estates estimated from the reading of 16 November 1428,
  six months later, after the Primacy was gone. Treasury 201; manpower full at 13,700.
