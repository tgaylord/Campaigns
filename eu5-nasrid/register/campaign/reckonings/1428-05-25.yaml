tellings:
  - id: 0831-02-11-of-the-islands-of-the-ocean-and-the-naft-of-ethiopia
    'on': '1427-12-01'
    title: Of the Islands of the Ocean, and the Naft of Ethiopia
    verse: '16:15'
    who:
      - ismail-ibn-saad
    where:
      - ishbiliyya
    covers:
      - 1421-06-01-tamaraceite
      - 1421-08-01-the-secret-of-the-naft
      - 1422-09-01-santo-antao
      - 1423-02-01-santa-cruz-das-flores
      - 1425-03-01-fogo
      - 1425-06-01-tedote
      - 1425-07-01-horta
      - 1427-08-01-santiago-cape-verde
      - 1427-12-01-ponta-delgada
      - 1420-08-01-angra
    text: >
      When Angra was founded on Terceira in 823, the empire had three towns in the Ocean. Seven years later it
      had eleven, and the clerks of the Dīwān al-Inshāʾ had to keep a separate register for them, because the
      islands were too far apart to be written up with any province of the mainland.


      In the Canaries the settlers went where the islanders already were. Tamaraceite on Gran Canaria became a
      town of the crown in Jumādā al-Ūlā 824, with eight and a half thousand Guanches, and Tedote on La Palma
      followed in Rajab 828 with five and a half thousand more. Like the people of Maxorata, they were left to
      their own customs and their own gods, and they paid their dues to the Emperor's governor and were
      otherwise left alone.


      The Green Cape was empty, and there the empire had to bring its own people. Santo Antão, the
      northernmost of the islands, became the empire's first town in the southern sea in Ramaḍān 825, with
      seventeen hundred Andalusī settlers. Fogo, the island of the fire mountain, followed in Rabīʿ al-Thānī
      828. Santiago, the largest of the islands, followed in Shawwāl 830, settled by Portuguese-speaking
      Muslims of al-Gharb and Burtuqāl. The dīwān had told the first fleet that the islands were to be a land
      of their own one day, and the captains now spoke of them as the halfway house to Mālī and the Gulf,
      where a ship bound south could take on water, salt and goats.


      The Azores filled from the west. After Angra came Santa Cruz on Flores, the furthest island of all, in
      Ṣafar 826; Horta on Faial in Shaʿbān 828; and on 11 Ṣafar 831 Ponta Delgada on São Miguel, the largest
      of the islands, each with twelve or thirteen hundred settlers. Unlike the Christian farmers of Angra,
      nearly all of them were Andalusīs and Muslims, and the first building in each town was a mosque. The
      pilots said that from Flores the sun set over nothing at all, and that no one knew how far the nothing
      went.


      The Ocean paid for itself in unexpected ways. In Shaʿbān 824 envoys came to
      [Ishbīliya](place:ishbiliyya) from Ethiopia, the Christian kingdom beyond Egypt, wanting to buy naft,
      the fire weapons the armies of al-Andalus had used since the days of the sultans. The dīwān warned that
      a weapon once sold could one day be turned against the seller. The Emperor
      [Ismāʿīl](person:ismail-ibn-saad) asked how far Ethiopia was from Ishbīliya and how much it was
      offering. It was a very long way, and the offer was four hundred and nineteen pieces of gold, which the
      treasurers reckoned at twice the crown's yearly income. He said that it would never backfire, and took
      the gold.


      *And He has cast into the earth firmly set mountains, lest it shift with you, and rivers and roads, that
      you may be guided.*
  - id: 0831-08-10-of-the-jamaa-of-831-and-the-armouries
    'on': '1428-05-25'
    title: Of the Jamāʿa of 831, the Armouries, and the Spies of the North
    verse: '4:58'
    who:
      - ismail-ibn-saad
      - diego-villamarin
      - yusuf-ibn-ismail
      - ahmad-ibn-yusuf-ibn-ismail
      - umm-al-fath-bint-muhammad
      - jadila-bint-saad-ibn-faraj
      - saad-ibn-yusuf-ibn-saad
      - yusuf-ibn-saad
    where:
      - ishbiliyya
      - banbaluna
      - al-ushbuna
      - tulaytula
      - qurtuba
      - gharnata
      - malaqa
      - al-mariyya
      - yabura
      - shantarin
      - istijja
      - uryula
    covers:
      - 1425-03-25-galicia-takes-asturias
      - 1426-02-01-truce-with-castile-ends
      - 1427-04-28-war-in-france
      - 1425-12-17-umm-al-fath-to-the-diwan
      - 1428-04-30-death-of-yusuf-of-banbaluna
      - 1428-05-25-the-spies-go-north
      - 1428-05-25-the-armouries
      - 1428-05-25-jamaa-against-primacy
      - 1428-05-25-primacy-revoked
    text: >
      The petty kings of the mountains did not stay four for long. In Jumādā al-Ūlā 828
      [Diego](person:diego-villamarin) of Galicia, the soldier king, made war on Asturias and took all of it,
      Oviedo and its eight towns, and Galicia stretched from Santiago to Llanes. Three Christian kingdoms were
      left in the north: Galicia, Navarre on the Basque coast, and what remained of Qashtāla at Santander. In
      Rabīʿ al-Awwal 829 the truce of the Peace of Rajab ran out, and for the first time in fifteen years
      nothing bound the empire to peace with any of them. A year later the English went to war with France
      again, and King Fernando of Qashtāla went with them, until in Jumādā al-Ūlā 831 he made a peace of his
      own with the French and came home.


      The Emperor [Ismāʿīl](person:ismail-ibn-saad) was sixty-two. He had never been a soldier, and he had
      always known what he wanted. He wanted the last war of the Istirdād fought in his own lifetime, and he
      set about it as he had set about everything, by making sure that when it came it would be short. In the
      spring of 831 his spies went north into all three kingdoms. They did not go to count soldiers. They went
      to talk, in the markets and the monasteries and the lords' halls, about the return of al-Andalus: that
      it was not a conquest but a homecoming, that the Portuguese and the Catalans now sat in the Emperor's
      dīwān, and that every Iberian, whatever he prayed, had a place in it. The secretaries who wrote their
      instructions remembered what the Emperor had said after Fermoselle, that four small kingdoms were easier
      to take one at a time, and they noticed that the spies were told to say something a little different in
      each.


      At home he began to build an army that would not need the umarāʾ to raise it. In a dozen towns and
      cities of the empire, from Lisbon, Évora and Santarém to Toledo, Córdoba, Granada, Málaga and Almería,
      the crown built armouries, so that each could arm its own men and fill the ranks without waiting on any
      lord's levy. The umarāʾ watched the walls go up and understood exactly what they were for.


      The house changed in those years too. In Ṣafar 829 the heir's daughter [Umm
      al-Fatḥ](person:umm-al-fath-bint-muhammad), fourteen years old and named for her grandmother, took a
      seat in the dīwān beside her mother [Jadīla](person:jadila-bint-saad-ibn-faraj), and the clerks said she
      was already abler than her father had ever been. Saʿd ibn Yūsuf and then Prince Yūsuf himself turned
      from settling the new lands to spreading the tongue and learning of al-Andalus through them. And on 15
      Rajab 831 [Yūsuf ibn Ismāʿīl](person:yusuf-ibn-ismail), lord of [Banbalūna](place:banbaluna) since the
      Peace of Rajab, died of a fever in camp at fifty-six. His son
      [Aḥmad](person:ahmad-ibn-yusuf-ibn-ismail), who had sat in the dīwān for thirteen years and was one of
      the ablest men of the house, succeeded him on the Navarrese frontier.


      Then the Emperor called the Jamāʿa. It met at [Ishbīliya](place:ishbiliyya) on 10 Shaʿbān 831, and the
      Emperor told it that a war was coming and the empire must be ready. He asked the assembly for one thing.
      Since the days of the first sultans the great houses had held the Primacy of Nobility: they counted
      themselves the ruler's equals, and no important decision could be made without them. The Emperor said
      that an empire about to go to war could not wait for every lord in it to be consulted, and that the
      caliphs of Qurṭuba had consulted no one. The ʿulamāʾ, the merchants and the dhimmī voted with the crown,
      and the Primacy was revoked.


      The umarāʾ had lost their mercenaries in 817 and their lordships with them. Now they had lost their
      equality. Barely one great house in six was content with the crown, and the peace of the realm, which
      had been mended slowly for fourteen years, was worn through. The Emperor did not send them gifts this
      time. He had armouries now, and a war to fight, and he seemed to think the umarāʾ would come round once
      they had castles in Galicia to quarrel over.


      *Indeed, Allāh commands you to render trusts to whom they are due, and when you judge between people, to
      judge with justice.*
    behind: >-
      The save of 25 May 1428 was made on the day of the Jamāʿa. In it the Primacy of Nobility is already
      gone, noble satisfaction is at 16% (41% in August 1424) and stability is at 1. Ten armouries stand in
      the save, against Trent's dozen; others may still be under construction. The spies and their message are
      Trent's account. Galicia's conquest of Asturias is dated by Oviedo's change of owner. The Andalusī
      madrasa at Ishbīliya (the game's nd_adu_madrasa) went up between the saves of 1424 and 1428 and isn't in
      the prose yet.


      The estates were recalibrated on 16 November 1428 from Trent's full panel and tooltips. With the Primacy
      gone, the umarāʾ have 17% of the power of the state, and the May checkpoint is now estimated from that
      reading.


      Invented colour: the spies' talk in markets and monasteries and the different message for each kingdom;
      the Emperor's speech to the Jamāʿa and the estates' votes; the umarāʾ watching the armouries go up; the
      clerks' opinion of Umm al-Fatḥ; the Emperor's expectation of castles in Galicia. In the islands entry:
      the separate register, the captains' halfway house, the mosques of the Azores towns and the pilots'
      sunset at Flores. Santo Antão and Fogo appear in the save as Andalusī settlements whose faith is
      Catholic, so the chronicle doesn't describe their faith.
