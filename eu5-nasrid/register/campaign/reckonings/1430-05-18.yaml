  - id: 1430-05-18-the-princes-counsel
    'on': '1430-05-18'
    kind: note
    what: >-
      The first test of the new reign. The Emperor Muḥammad, wanting to finish his father's work and prove
      himself a worthy heir, orders the army north for a swift conquest of Castile. The princes Ismāʿīl and
      Aḥmad talk him round: Galicia would be the nobler and harder conquest, and Navarre after it, for the
      Basques are a far more redoubtable people than the Castilians. For now the Emperor is convinced
    who:
      - muhammad-ibn-ismail-ibn-saad
      - ismail-ibn-muhammad-ibn-ismail
      - ahmad-ibn-muhammad-ibn-ismail
    threads:
      - war-of-shant-yaqub
      - two-princes
    from:
      - told
    cite: Trent's account, May 1430
    detail:
      account: Trent's account, May 1430
      context: Castile is allied to the Angevin Empire and Navarre; Galicia has no allies (world file of 2 July 1429)
