date: '1430-05-18'
title: The War of Shant Yāqub
source:
  save: SP_ADU_1430_05_18 (compressed)
  game: 1.4.7
summary: >-
  The day al-Andalus declared war on Galicia, the fifth war of the Istirdād, steered there by the two princes
  when their father wanted Castile. All seven ṭāʾifas march with the crown; Galicia, 31 towns and no army,
  stands alone. The crown holds 196 towns and 2,585,000 people (São Nicolau in the Cape Verdes settled on 1
  January). Muḥammad V's first year: political influence back to 42, stability 9, the umarāʾ two in five
  content. Estates estimated from the reading of 16 November 1428. Treasury 591; income 280 against 291;
  manpower 17,000 of 18,800.
