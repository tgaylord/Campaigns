tellings:
  - id: 0745-06-02-the-jamaa-of-744
    'on': '1344-10-11'
    title: Of the Jamāʿa of 744, the Sultan's Marriage, and the Crown Strengthened
    verse: '30:21'
    who:
      - yusuf-i
      - sayyida-of-fezzan
      - alfonso-xi
      - maria-of-portugal
    covers:
      - 1344-03-23-castile-aragon-alliance
      - 1344-04-castile-intervenes-portugal
      - 1344-05-12-jamaa-sits
      - 1344-jamaa-marriage
      - 1344-05-29-favor-the-ruler
      - 1344-10-11-royal-harem
    text: >
      In the spring of 744 the sultan called the Jamāʿa, the great assembly of the realm, where the nobles and
      the *ʿulamāʾ*, the burghers, the commoners and the dhimmīs each send their voices to the throne. He had
      meant to call it for war. Portugal was still divided against itself, and Qashtāla was weakened by it.
      The grievance against Qashtāla had lain sealed in the dīwān for two years. There were voices in the
      dīwān that said the hour had come to use it.


      But the hour passed before the Jamāʿa could meet. On the eighth of Dhū al-Qaʿda word came that Qashtāla
      and Arghūn had sworn an alliance, and that on the same day Qashtāla and Portugal had sealed an Iberian
      wedding pact. The three crowns of the Christians, which had fought one another for a hundred years, now
      stood together. In the middle of Dhū al-Ḥijja the tyrant [Alfonso](person:alfonso-xi) marched into
      Portugal to end its civil war in favour of his queen, [Maria](person:maria-of-portugal). The moment in
      the north was gone, and a realm still in debt could not fight all three crowns at once.


      So when the Jamāʿa sat at the end of Dhū al-Ḥijja, our lord [Yūsuf](person:yusuf-i) turned it to other
      work. He would strengthen the crown that the Christians feared to see strong, and pay what the crown
      still owed. He asked the assembly to change the Distribution of Power itself, so that the balance of the
      realm's government should favour the ruler and not the estates. The debate was long and the nobles were
      bitter. But the sultan had paid down half their loans in four years, and he had won them a war. He saw
      the greatest of them one by one in the evenings, and he bargained with each as a merchant bargains,
      giving way on small things and never on the great one, until each had sold his voice for less than he
      had meant to ask. On the fifteenth of Muḥarram 745 the change was proclaimed. Where the old law had
      weighed against the crown, the new law weighed for it.


      In those same days, while the delegates of the Jamāʿa filled the city, the sultan married. The lady
      [Sayyida](person:sayyida-of-fezzan), daughter of the house of Murzuq in Fazzān, had been betrothed to
      him at nine years old, in the first year of this chronicle. Now she was fifteen. The wedding was held in
      the Alhambra with the whole realm, in a manner of speaking, as its guests. The poets sang of the sultan
      who took a bride and a crown in the same season.


      The marriage left its mark on the customs of the court. In Jumādā al-Ākhira the old aristocratic court,
      where the great houses had their places by right of birth, gave way to the royal harem, where the
      household of the sultan is its own world, and its women and their sons are bound to him alone. Some of
      the nobles said that the sultan had shut the door of the palace in their faces. So he had.


      *And of His signs is that He created for you from yourselves mates that you may find tranquillity in
      them, and He placed between you affection and mercy.*
