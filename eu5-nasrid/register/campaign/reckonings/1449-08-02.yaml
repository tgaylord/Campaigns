date: '1449-08-02'
title: Corsica and Sardinia Held
source:
  save: SP_ADU_1449_08_02 (compressed)
  game: 1.4.7
summary: >-
  From a save. Al-Andalus holds seven Corsican towns (Aleria, Calvi, Corte, Ajaccio, Bonifacio, Sartène, Vico)
  and five of Arborea's in Sardinia (Oristano, Ales, Sorgono, Terralba, Thiesi); Bastia is under siege. The
  allies' attacks on Palermo itself have failed four times, and Gabès left the war in December. Aḥmad, lord of
  Banbalūna, died of camp fever on campaign (18 February 1449) and his son succeeded him. In the Mamlūks' war
  on the Banū Lām, in which al-Andalus has not fought, the Mamlūk side has lost most of its battles in the
  Ḥijāz and Najd. Further north, Bohemia's war for the Hungarian throne (from September 1447) has overrun
  eastern Hungary. Stability 19.3, political influence at its cap of 100, prestige 93; treasury 175. Since
  October 1447: gunsmiths at Jaén and Santarém, tanneries at Córdoba, masons, scriptoria, distilleries,
  potteries, a paper mill at Lleida, a bridge at Vielha, and the Jamāʿa's urban seat at al-Ushbūna. Estate
  power estimated from the reading of 16 November 1428.
