date: '1450-02-01'
title: The Army Gathered
source:
  save: autosave of 1 February 1450 (compressed)
  game: 1.4.7
summary: >-
  From an autosave, two weeks before the landing at Syracuse. The army has grown from 9 regiments to 13 with
  the 4,000 thughūr raised in October; the fleet has 95 ships. The treasury stands at 2,990, up from 175 in
  August; the saves don't say where the gold came from. Corsica is held, Bastia having fallen in September;
  Tripoli's army was beaten before Catania in December. Stability 20.8, political influence 100. Estate power
  estimated from the reading of 16 November 1428.
