tellings:
  - id: 0853-07-29-of-sardinia-and-the-siege-of-bastia
    'on': '1449-09-17'
    title: Of Sardinia and the Siege of Bastia
    book: book-of-the-franks
    verse: 8:66
    who:
      - abu-al-hasan-ali-ibn-ahmad
      - yusuf-ibn-ismail-ibn-muhammad
      - ahmad-ibn-yusuf-ibn-ismail
      - abu-al-hasan-ali-of-banbaluna
      - muhammad-ibn-ismail-ibn-saad
      - amie-of-mali
    covers:
      - 1448-09-26-battle-seddori
      - 1448-10-21-battle-corsica-channel
      - 1448-11-05-the-call-of-the-mamluks
      - 1449-02-18-death-of-ahmad-of-banbaluna
      - 1449-04-23-birth-of-aram-ibn-yusuf
      - 1449-06-30-corsica-overrun
      - 1449-09-17-the-fall-of-bastia
    text: >
      The army that [Abū al-Ḥasan ʿAlī](person:abu-al-hasan-ali-ibn-ahmad) landed on Sardinia was the first
      the Emperor had sent overseas in this war. It was not large: some five thousand men, nearly half of them
      light horse, with a few hundred of Banbalūna's among them. For three weeks it marched inland while
      Arborea gathered what it had. On 27 Rajab 852, at Seddori, the Arboreans attacked it with fifteen
      hundred archers. They were all killed or taken. Al-Andalus lost two hundred and ninety-one men, most of
      them foot. It was the first victory of the Emperor's own army in the war.


      Twenty-five days later the prince [Yūsuf](person:yusuf-ibn-ismail-ibn-muhammad) took twenty-one galleys
      into the channel between Corsica and the Tuscan shore and found five Genoese ships there. He sank all
      five and lost none. The captains who had called him an accomplished sailor in the winter now called him
      lucky as well, which sailors value more.


      On 8 Ramaḍān the Mamlūks of Miṣr went to war with the Banū Lām of Najd and called their allies in. The
      Emperor answered as he always answered Cairo, and al-Andalus was at war in Arabia. It sent no one there.
      The news that came back through the year was bad for Cairo. The Banū Lām and their friends beat the
      Sharīf's men at Makka itself and won fight after fight in the Ḥijāz. In Rabīʿ al-Thānī 853 they routed
      the main Mamlūk army in the desert between ash-Shamlī and Taymāʾ. The Mamlūks had meant to make
      themselves masters of the Red Sea coast, and they were not managing it.


      [Aḥmad](person:ahmad-ibn-yusuf-ibn-ismail), lord of Banbalūna, did not see the end of the Sardinian war.
      He had taken the field again after Grasse. On 24 Dhū al-Ḥijja 852 he died in camp of the fever that
      kills more soldiers than any enemy. He was fifty-three. His son [Abū al-Ḥasan
      ʿAlī](person:abu-al-hasan-ali-of-banbaluna) succeeded him. The men of Banbalūna who had come back from
      Grasse said that the son was a gentler man than his father had become, and that this was no bad thing.


      Before the year was out the army crossed from Sardinia to Corsica. At the end of Dhū al-Qaʿda 852 it sat
      down before Bastia, a Genoese fortress on a rock above the harbour with the sea at its back, and through
      the winter and spring the rest of the island fell around it. By 9 Jumādā al-Ūlā 853 Ajaccio had been
      taken, and Aleria, Calvi, Corte, Bonifacio, Sartène and Vico were held, and in Sardinia five of
      Arborea's towns, Oristano among them. Only Bastia held out, and the army was still before it in the
      summer. In Ṣafar a son was born to Yūsuf and [Amie](person:amie-of-mali) of Mālī, and they called him
      Āram. The general Abū al-Ḥasan ʿAlī was still in the trenches before Bastia when the news reached him.


      Bastia fell on 29 Rajab 853, after two hundred and sixty-five days. With it went the last of Corsica. In
      Ishbīliya the [Emperor](person:muhammad-ibn-ismail-ibn-saad) had the keys of the fortress hung in the
      palace by the river. The court began to ask where the army should go next: to the Genoese coast, where
      the enemy's strength lay, or to Sicily, which was the point of the war.


      *Now God has lightened the burden for you, and He knows that among you is weakness. So if there are from
      you one hundred who are steadfast, they will overcome two hundred. And if there are among you a
      thousand, they will overcome two thousand by permission of God. And God is with the steadfast.*
questions:
  - >-
    The treasury rose from 175 in August 1449 to 2,990 by February 1450, the same kind of jump as in 1447.
    What pays for these?
