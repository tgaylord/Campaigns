tellings:
  - id: 0815-03-14-of-the-captains-of-811-and-the-pepper-of-the-indies
    'on': '1412-06-24'
    title: Of the Captains of 811, and the Pepper of the Indies
    book: book-of-the-encircling-sea
    verse: '31:31'
    who:
      - ismail-ibn-saad
    where:
      - ishbiliyya
      - al-ushbuna
    covers:
      - 1408-10-11-expeditions
      - 1412-01-01-funchal
      - 1412-06-24-spice-trade
      - 1397-08-14-explorers-push-south
    text: >
      The old Emperor had sent his kinsmen to sea. His son sent whoever would serve him best. In Jumādā al-Ūlā
      811, while the dīwān was still busy with the lands of the north, four expeditions put to sea from the
      ports of [Ishbīliya](place:ishbiliyya) and the coast. One went south, to follow the coast of Africa
      further than any ship of al-Andalus had gone. One went to the islands that had been found off the
      western coast, beyond Mali. And two went to the islands the Christian sailors called the Canaries and
      Madeira, which the geographers called the Eternal Isles. A fifth captain was at sea already: ʿAbd
      al-Ghafūr, an Andalusī of the merchant class with a rare gift for talking to strangers, had been in the
      sea of the Azores since before the year began.


      The captain who went south was a Sephardi named Daniel, who had come to Islam and kept the name he was
      born with. The Sephardim had been under the Emperor's protection since the year of Avignon, and the
      scribes recorded with some pride that the first of them to command a ship of the empire had sailed
      further from home than anyone. By 813 he was in the gulf below the bulge of Africa, where the coast
      turns east and the stars of the north sink into the sea.


      The captain who went to the islands beyond Mali was stranger still. He was García of Ponte de Sor, a
      Portuguese noble and a Christian, who in 808 had led the rebels of Estremadura against the walls of
      [al-Ushbūna](place:al-ushbuna) and been thrown back. Three years later he sailed under the Emperor's
      flag. The Emperor [Ismāʿīl](person:ismail-ibn-saad) had a way of turning men, and he never explained to
      the dīwān how he had turned this one. By 813 García was off the islands of the Green Cape, charting
      their harbours.


      The voyages to the islands did more than chart them. On the first day of 1412 by the Christian
      reckoning, Funchal on Madeira became a town of the crown, the first the empire had ever held beyond the
      sea: eighteen hundred souls, peasants and slaves, who spoke Castilian and prayed as Muslims.


      In Rabīʿ al-Awwal 815 news reached Ishbīliya that changed the worth of everything the captains were
      doing. A sea road to the Indies had been found. For as long as anyone remembered, the pepper and
      cinnamon of the East had come overland, through the hands of the Mamlūks and the Venetians, and every
      hand had taken its share. Now there was another way. The price of spices rose in every market of the
      West, and seven markets became the ports of the new trade: Genoa, Constantinople, Barcelona, Bordeaux,
      Naples, and two of the Emperor's own, Ishbīliya and al-Ushbūna. The merchants of the capital said the
      Emperor's father had moved the court to the river for exactly this day, and that he had only been thirty
      years early.


      *Do you not see that the ships sail through the sea by the favour of Allāh, that He may show you of His
      signs?*
  - id: 0816-01-29-of-the-madrasas-of-815
    'on': '1413-05-01'
    title: Of the Madrasas of 815, and the Children of the House
    book: book-of-the-call
    verse: 20:114
    who:
      - ismail-ibn-saad
      - saad-ibn-yusuf
      - fatima-bint-yusuf
      - isabel-de-montsoriu
      - saad-ibn-ismail-ibn-saad
      - maryam-bint-saad-ibn-faraj
      - abu-al-hasan-ali-ibn-saad
    where:
      - qunka
      - al-ushbuna
      - shantarin
    covers:
      - 1409-09-18-death-of-fatima
      - 1410-04-17-birth-of-abu-al-hasan-ali
      - 1411-11-01-the-end-of-portugal
      - 1413-01-14-madrasas-everywhere
      - 1413-05-01-education-of-the-people
      - 1397-08-14-infrastructure
    text: >
      In Jumādā al-Ūlā 812 the house of Naṣr lost [Fāṭima](person:fatima-bint-yusuf), the daughter of Yūsuf I
      who had married into the Catalan house of Montsoriu. She had been given to Francesc de Montsoriu in the
      year of the Restoration, when the Ṭāʾifa of Catalonia was made, and she left behind a son who ruled
      Catalonia, a daughter married to the lord of Shalamanka, and another,
      [Isabel](person:isabel-de-montsoriu), who was the wife of the heir. So the blood of Yūsuf I ran in three
      of the ṭāʾifas and in the crown itself. In Dhū al-Ḥijja of the same year a son was born to the Emperor's
      son [Saʿd](person:saad-ibn-ismail-ibn-saad) and the Shaykha [Maryam](person:maryam-bint-saad-ibn-faraj)
      of [Qūnka](place:qunka). They named him [Abū al-Ḥasan ʿAlī](person:abu-al-hasan-ali-ibn-saad), and the
      frontier had its first heir of the new line.


      The Peace of Rajab had filled the treasury and emptied the kingdom of Portugal, and it left the Emperor
      [Ismāʿīl](person:ismail-ibn-saad) ruling more Christians than any Muslim prince since the conquest. His
      father had answered the north with madrasas at [al-Ushbūna](place:al-ushbuna) and
      [Shantarīn](place:shantarin) and a handful of other towns. Ismāʿīl meant to answer it everywhere. On 11
      Shawwāl 815, ten days after the feast at the end of Ramaḍān, he ordered a madrasa built in every town
      and city of the empire, and he did not stop at the crown's own lands. The ṭāʾifas were to have them too,
      from Burtuqāl to Banbalūna, and the gold taken from Qashtāla would pay for them.


      The ʿulamāʾ had never been given so much at once, and they said so from every minbar. The lords of the
      ṭāʾifas were less pleased to find the Emperor's teachers in their towns, but none of them could refuse a
      gift paid for by the Emperor's own treasury. In the dīwān the Emperor gave his reasons in the plain way
      he kept for matters he meant to see done. A conquered town that has a garrison obeys while the garrison
      is there, he said. A town that has a madrasa will obey after the garrison has gone, and its children
      will not need to be conquered at all.


      His second order came on 29 Muḥarram 816, and he made it in honour of his father. The Emperor
      [Saʿd](person:saad-ibn-yusuf) had sent the costliest tutors in the Islamic world to his sons and paid
      the estates every dirham he owed them, and the clerks had written of him that he left the country a more
      honest place. Ismāʿīl now gave his father's realm a law of the Education of the People. Its preamble
      said that knowledge was the right of every subject, and that all men are born with free will and free
      thought, which the state must protect. The burgher, the peasant, the labourer and the soldier were all
      to have their chance at letters. The umarāʾ grumbled that a ploughman who could read would soon stop
      ploughing. The ʿulamāʾ, who had just been given a madrasa in every town, grumbled that the law spoke of
      free thought and not of faith. The Emperor told them both that his father would have signed it, and
      signed it.


      *And say: My Lord, increase me in knowledge.*
  - id: 0817-08-09-of-the-jamaa-of-817-and-the-landlords-of-the-north
    'on': '1414-10-24'
    title: Of the Jamāʿa of 817, and the Landlords of the North
    book: book-of-the-marches
    verse: 12:76
    who:
      - ismail-ibn-saad
      - saad-ibn-yusuf
    where:
      - banbaluna
      - ishbiliyya
      - qurtuba
    covers:
      - 1410-09-01-catalan-privileges-return
      - 1414-10-24-rising-at-pamplona
      - 1414-10-24-jamaa-of-the-mercenaries
      - 1414-10-24-the-umara-mutinous
      - 1402-08-the-umara
      - 1402-09-jamaa-of-the-markets
    text: >
      In Shaʿbān 817 a handful of malcontents rose at [Banbalūna](place:banbaluna) and were put down before
      the news of their rising had crossed the Ebro. It was nothing, and the Emperor
      [Ismāʿīl](person:ismail-ibn-saad) made a great deal of it. He told the dīwān that the north was
      restless, that the empire's armies must be ready to march at a word, and that the old ways of raising
      them would not serve. He called a Jamāʿa at [Ishbīliya](place:ishbiliyya) for 9 Shaʿbān.


      For a generation the hiring of foreign soldiers had been the business of the umarāʾ. The great families
      signed the contracts, paid the captains and kept the companies, and every mercenary in the empire's
      service owed his wages, and so his loyalty, to some lord of the Andalusī houses before he owed it to the
      crown. The Emperor [Saʿd](person:saad-ibn-yusuf) had seen the danger in that, and from the year 805 the
      dīwān's policy had been to break the power of the umarāʾ now that the state was built. Ismāʿīl now laid
      before the Jamāʿa a law to take the contracts away from them, and with it several smaller reforms, each
      of which took a little more. He had an old ally in it. In Jumādā al-Ūlā 813 the Catalan merchant
      privileges had come back into force, sixty-four years after the war of the three crowns had ended them.
      They had always been the first thing lost whenever al-Andalus went to war with the Catalans, and they
      had always weakened the great lords in favour of the crown. Now Catalonia, Arghūn and Balansiyya were
      all ṭāʾifas of the Emperor, there could be no more wars with the Catalans, and the privileges were the
      crown's for good.


      He did not present it as a loss. He came to the assembly with the banners of Cuéllar and Toro carried
      before him and the keys of Porto on a cushion, and he spoke of the north. The empire had won more land
      in the War of Jillīqiya than the house of Naṣr had held when he was born, he said, and it needed men of
      good family to settle it. He offered dozens of the noble houses estates in the conquered lands, and to
      others he offered claims on lands Qashtāla still held, to be theirs when the next war was won. The
      umarāʾ had been grumbling for twelve years. Now they went home talking of the castles they would build
      in León and the vineyards they would have on the Ebro, and they voted for the law.


      It was some time before they read the grants closely. The lands were theirs to live on and to draw rents
      from, but the grants gave them no courts, no levies and no lordship over the people who worked the land.
      They had become landlords, not lords. The conquests of Jillīqiya were still the property of the crown
      and the house of Naṣr, and the mercenaries now drew their pay from the Emperor's treasury. The court
      remembered that the Emperor's tutors had once said he could tell every man what he wished to hear, and
      the umarāʾ, who had heard exactly what they wished, had only themselves to blame.


      When they understood, the umarāʾ came very near to rising. Not one great house in ten was content with
      the crown, and the peace of the realm was more shaken than it had been since the risings of 807. The
      Emperor had expected it. He had dressed the law in the oldest authority al-Andalus knew. The Umayyads,
      he reminded the dīwān, had divided the land into kūras, each under a governor named and recalled by
      [Qurṭuba](place:qurtuba), with the tax registers and the qāḍīs answering to the capital and not to the
      governor. That was the order of the caliphs, and he was only restoring it. To the younger men of the
      chancery he spoke of a newer idea, that a sovereign stands above every estate and bows to no earthly
      power. The old families heard the first argument and the young secretaries the second, and he meant both
      to be heard.


      Then he set about cooling tempers. He sent the angriest lords north to the ṭāʾifas, where kinsmen of the
      house of Naṣr sat on most of the thrones and could give them honours, wives and offices that cost the
      crown nothing. He wrote to each great house himself, in the style the Dīwān al-Inshāʾ had taught a
      generation of secretaries, and to each he said something a little different. In the dīwān a law to
      curtail the nobles was passed with little noise while the letters were still on the road.


      *We raise in degrees whom We will, and over every possessor of knowledge is one more knowing.*
