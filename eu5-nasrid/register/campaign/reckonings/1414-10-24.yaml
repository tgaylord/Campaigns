title: The Jamāʿa of 817
source:
  save: SP_ADU_1414_10_24 (compressed)
  game: 1.4.7
summary: >-
  On 24 October 1414 (9 Shaʿbān 817) a Jamāʿa took the empire's mercenary contracts from the umarāʾ, passed a
  law to curtail them, and bought their votes with estates in the north that made them landlords, not lords.
  Wrapped in the Umayyad order of the kūras and the new doctrine of the sovereign, it left the nobles
  near-mutinous, one in ten content, and the realm shaken. The crown holds 162 towns and 2,078,000 people,
  with nine ṭāʾifas; Abū Ḥammū has ruled Burghush since his father Khālid's death in 1412. Treasury 697,
  income 284 against 239. Shares of power are estimated from the 31 December 1415 reading.
