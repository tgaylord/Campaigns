tellings:
  - id: 0838-11-04-of-the-emperors-pilgrimage-and-the-sufi-shaykh-al-islam
    'on': '1435-06-01'
    title: Of the Emperor's Pilgrimage, and the Ṣūfī Shaykh al-Islām
    verse: 2:197
    who:
      - muhammad-ibn-ismail-ibn-saad
      - abu-hammu-rahhu
      - khalid-ibn-abi-hammu
      - temur
      - aktai-mamluk
      - yusuf-ibn-saad
      - ismail-ibn-muhammad-ibn-ismail
      - ahmad-ibn-muhammad-ibn-ismail
      - umm-al-fath-bint-muhammad
      - yusuf-i
      - ahmad-ibn-ismail-ibn-muhammad
      - abu-al-hasan-ali-ibn-ahmad-ibn-muhammad
    where:
      - ishbiliyya
    covers:
      - 1431-01-21-death-of-abu-hammu
      - 1432-10-16-death-of-aktai
      - 1433-03-19-the-emperor-leaves-the-admiralty
      - 1433-07-26-death-of-temur
      - 1433-11-23-the-emperors-hajj
      - 1434-09-27-the-shaykh-al-islam
      - 1435-06-01-death-of-prince-yusuf
      - 1432-07-17-birth-ahmad
      - 1433-03-12-birth-abu-al-hasan-ali
      - 1433-04-24-birth-muhammad
    text: >
      Two months after the Peace of Ṣafar gave him Santander and the Cantabrian shore, [Abū
      Ḥammū](person:abu-hammu-rahhu), lord of the Ṭāʾifa of Burghush, died suddenly in Jumādā al-Ūlā 834. The
      court said it was a fever of the chest, and no one in the dīwān asked further. His heir
      [Khālid](person:khalid-ibn-abi-hammu) was nine years old. The tutors of Burghush said he was the
      cleverest child they had ever taught, but a boy of nine could not rule a frontier ṭāʾifa with the last
      king of Qashtāla living at his court. So the Emperor [Muḥammad](person:muhammad-ibn-ismail-ibn-saad)
      took the regency of Burghush himself, to hold until the boy turned sixteen.


      In the spring of 836 the Emperor laid down the command of the fleet, which he had held for twenty-two
      years. In the summer he went on the Hajj. He was the first ruler of the house of Naṣr to make the
      pilgrimage since the Sultan [Yūsuf I](person:yusuf-i), eighty years before, and he went by sea, as he
      did everything. The Mamlūk sultan [Aktai](person:aktai-mamluk), who had been the empire's ally for
      thirty-six years, had died in camp the autumn before, and it was his successor Jyral who received the
      Emperor of al-Andalus on the road to the Holy Places. On 8 Dhū al-Ḥijja 836, the day the pilgrims went
      out from Makka to Minā, [Temür](person:temur), master of half of Asia, died on the march in the far east
      of his empire at the age of ninety-seven. The news reached the pilgrims of al-Andalus on their way home.
      The Emperor returned to Ishbīliya in Rabīʿ al-Thānī 837 with the title of ḥājj, and the people of the
      capital came out to the river to meet his ship.


      He came home a changed man in one respect. He had always been worldly, and he still was. But at ʿArafa
      he had stood among the Ṣūfīs of the East, and he came back wanting their kind of faith at the head of
      the faith of his own realm. When the dīwān told him in Ṣafar 838 that an empire so large needed a Shaykh
      al-Islām, a single authority over all the muftīs of the realm to write fatwās, appoint the muftīs of the
      provinces and judge whether the Emperor's own edicts were lawful, it offered him three kinds of
      candidate: the most loyal of the muftīs, the most learned, or a famous Ṣūfī. The ʿulamāʾ expected him to
      choose loyalty, as his father would have. He chose the Ṣūfī. He would be a Mālikī like every jurist of
      al-Andalus, but the court noticed that the Emperor's legitimacy in the eyes of the people rose a little
      every month he sat in the office, and that the ascetics and the brotherhoods of the realm, who had never
      cared much for the house of Naṣr, began to pray for it.


      The house was growing again. Since the year of the Emperor's accession, nine grandchildren had been born
      to him. The heir [Ismāʿīl](person:ismail-ibn-muhammad-ibn-ismail) had a son,
      [Aḥmad](person:ahmad-ibn-ismail-ibn-muhammad), and three daughters, Prince
      [Aḥmad](person:ahmad-ibn-muhammad-ibn-ismail) a daughter and two sons, one of them named [Abū al-Ḥasan
      ʿAlī](person:abu-al-hasan-ali-ibn-ahmad-ibn-muhammad) after the general of Shant Yāqub, and the
      Emperor's daughter [Umm al-Fatḥ](person:umm-al-fath-bint-muhammad) a daughter and a son. The house was
      also losing its oldest member. On 4 Dhū al-Qaʿda 838 Prince [Yūsuf](person:yusuf-ibn-saad), a son of the
      first Emperor, died of old age at sixty-three, thirty years after he had first taken his seat in the
      dīwān. He had settled the new lands of two Emperors and spread the tongue of al-Andalus through them.


      *Hajj is in the well-known months. And take provisions, but indeed, the best provision is the fear of
      Allāh. So fear Me, O you of understanding.*
