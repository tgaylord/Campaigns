summary: >-
  Three years after the crusade. The arsenals are finished and eight Andalusī war galleys have joined the
  fifty caravels, and the realm's temper has moved far toward the sea. The Emperor has made the Hajj, given
  the realm a Ṣūfī Shaykh al-Islām, and rules Burghush as regent for a boy. Stability 17.6, the highest yet,
  prestige 90, income 396 against 305 spent, treasury 1,282. The realm is at peace, and the courts of the
  world still rank it third. Estates estimated from the reading of 16 November 1428.
