date: '1449-02-01'
title: The Commons in the Jamāʿa
source:
  save: autosave of 1 February 1449 (compressed)
  game: 1.4.7
summary: >-
  From an autosave. Since the Jamāʿa of 2 September 1448, called by the two princes, the commons sit in the
  Jamāʿa as an equal estate (the privilege 'peasants represented in parliament'); their satisfaction has risen
  from 50 to 59, the burghers' from 54 to 56. Stability is 17.7, the highest in years. The army of al-Andalus
  landed on Sardinia in September and destroyed Arborea's army at Seddori (26 September); Yūsuf sank five
  Genoese ships in the Corsica Channel (21 October). The fleet has grown from 9 war galleys to 22, with 10
  hulks: 87 ships. On 5 November al-Andalus joined the Mamlūks' war on the Banū Lām. In the ṭāʾifas, the king
  of al-Burtughāl died at sea (1 June 1448) and his widow rules as regent for their daughter; Maryam, Shaykha
  of Qūnka, died (28 June) and her son succeeded her. Treasury 219. Estate power estimated from the reading of
  16 November 1428.
