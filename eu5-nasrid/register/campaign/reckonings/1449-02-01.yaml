tellings:
  - id: 0852-07-03-of-the-jamaa-of-the-commons
    'on': '1448-09-02'
    title: Of the Jamāʿa of the Commons
    book: book-of-the-franks
    verse: 16:90
    who:
      - muhammad-ibn-ismail-ibn-saad
      - ismail-ibn-muhammad-ibn-ismail
      - ahmad-ibn-muhammad-ibn-ismail
      - abu-al-hasan-ali-of-burtughal
      - maryam-bint-saad-ibn-faraj
      - abu-al-hasan-ali-ibn-saad
      - abu-al-hasan-ali-ibn-ahmad
    where:
      - ishbiliyya
      - qurtuba
      - jayyan
    covers:
      - 1448-06-01-death-of-the-king-of-portugal
      - 1448-06-28-death-of-maryam-of-qunka
      - 1448-09-02-the-jamaa-of-the-commons
      - 1448-09-02-the-landing-on-sardinia
    text: >
      The year 852 took two of the ṭāʾifa rulers in a month.


      On 28 Rabīʿ al-Awwal [Abū al-Ḥasan ʿAlī](person:abu-al-hasan-ali-of-burtughal), king of al-Burtughāl,
      was lost at sea in command of his own ships in the war for Balarm. He was fifty-three. The next day his
      widow Christine bore him a daughter. She was named ʿĀʾisha and never saw her father. The crown of
      al-Burtughāl passed to his elder daughter Fāṭima, who was seven, and Christine governed in her name. The
      court at Ishbīliya sent her its condolences and a great many advisers, and she kept the condolences.


      Four weeks later [Maryam](person:maryam-bint-saad-ibn-faraj), Shaykha of Qūnka, died of a burst ulcer at
      fifty-seven. She had ruled the frontier ṭāʾifa for forty years, since she was seventeen. Her son [Abū
      al-Ḥasan ʿAlī ibn Saʿd](person:abu-al-hasan-ali-ibn-saad), the Emperor's nephew, followed her without
      dispute. He was a man of business more than of war, and the merchants of Qūnka liked him for it.


      In Jumādā al-Ākhira the two princes, [Ismāʿīl](person:ismail-ibn-muhammad-ibn-ismail) and
      [Aḥmad](person:ahmad-ibn-muhammad-ibn-ismail), called a Jamāʿa at [Ishbīliya](place:ishbiliyya). The
      business was ordinary: the war's costs, the levies of the ṭāʾifas, the new galleys. It met on 3 Rajab
      852. The umarāʾ and the ʿulamāʾ took their places, the burghers theirs, and the clerks began on the
      accounts.


      Then the Emperor [Muḥammad](person:muhammad-ibn-ismail-ibn-saad) came in, which he did not usually do.
      He had a decree read. From that day, the commons would sit in every Jamāʿa as an estate equal to the
      others. These were not the great merchants, who already had their seats, but the middling men: the
      master craftsmen of the towns, the small-town notables, the men who kept the workshops of
      [Qurṭuba](place:qurtuba) and the forges of [Jayyān](place:jayyan) running.


      The hall went into uproar. The umarāʾ shouted that the Emperor had let the cobblers into the council of
      the realm. Several of the ʿulamāʾ walked out to consult on whether he could do it at all. The burghers
      had spent a century earning their seats. They watched the commons handed theirs in a morning and said
      less than they thought. The Emperor sat through all of it, pleased.


      Aḥmad said nothing, and many people noticed. The men being given seats were the men his gold had made
      over the past ten years: the gunsmiths, the tanners, the glassmakers, the masons of the bridges. Ismāʿīl
      spent the rest of the day going from bench to bench. By evening the umarāʾ had agreed that the commons
      should sit below them, and the commons had agreed to sit wherever they were put, so long as they sat.
      The decree stood.


      On the same day [Abū al-Ḥasan ʿAlī ibn Aḥmad](person:abu-al-hasan-ali-ibn-ahmad), who had broken the
      Galicians at Shant Yāqub eighteen years before, landed the army of al-Andalus on Sardinia.


      *Indeed, God orders justice and good conduct and giving to relatives, and forbids immorality and bad
      conduct and oppression. He admonishes you that perhaps you will be reminded.*
