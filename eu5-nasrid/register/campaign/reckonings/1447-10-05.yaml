date: '1447-10-05'
title: The Call of Tunis
source:
  save: SP_ADU_1447_10_05 (compressed)
  game: 1.4.7
summary: >-
  From a save, four months into the Tunisian war for Palermo, which al-Andalus and all its ṭāʾifas joined on
  13 June. The allies have lost at Ozieri in Sardinia (6 August), off western Corsica (9 September) and in the
  Gulf of Termini, where the fleets of Tunis, Tripoli and Gabès lost nineteen of twenty-eight ships (11
  September); on the day of the save Aḥmad of Banbalūna's 385 men were cut down at Grasse in Provence.
  Al-Andalus's own armies and fleets haven't yet fought. On 1 August the Emperor told the envoys of Europe 'We
  have arrived': the benefits of the Restoration of al-Andalus stay while the realm holds 25 European
  dominance, and the claim to the Umayyad caliphate's borders is open. The treasury, 2,680 in March, is down
  to 216, gone on six bridges in the country of the Tagus and Guadiana (Alcántara, Medellín, Villanueva de la
  Serena, Valencia de Alcántara, Brozas, Jaraicejo), gunsmiths at Jaén, Santarém and Badajoz, tanneries at
  Córdoba and Lleida, glassworks at Seville, a distillery at Jerez, a lumber mill at Écija, a winery at
  Castellón and a cannon foundry at Girona. The Emperor's wife Isabel de Montsoriu died on 19 August. New at
  court since February: a scholar of Delhi, a scholar of Iraq and a lord of the Tandroy of Madagascar.
  Stability has recovered to 10.7; al-Andalus is still the world's third great power. Estate power estimated
  from the reading of 16 November 1428.
