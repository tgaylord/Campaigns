tellings:
  - id: 0851-05-18-of-the-envoys-of-europe-and-the-borders-of-the-umayyads
    'on': '1447-08-01'
    title: Of the Envoys of Europe and the Borders of the Umayyads
    book: book-of-the-franks
    verse: 16:91
    who:
      - muhammad-ibn-ismail-ibn-saad
      - ismail-ibn-muhammad-ibn-ismail
      - ahmad-ibn-muhammad-ibn-ismail
      - dua-marinid
    where:
      - ishbiliyya
      - qurtuba
      - fas
    covers:
      - 1447-08-01-presence-in-europe
      - 1447-03-27-the-timurid-stagnation
      - 1447-06-13-the-call-of-tunis
    text: >
      In Muḥarram 851 news came from the east by way of the Mamlūk post. The empire of the Tīmūrids, which in
      the Emperor's youth had frightened every court from Cairo to Constantinople, had gone thirteen years
      without Temür and found no one to fill his place. Okhotur sat on Temür's throne. The provinces did as
      they pleased, and the great host did nothing. The merchants of [Ishbīliya](place:ishbiliyya) who traded
      with Tabrīz said the roads were worse every year. The court heard it as one hears of weather in another
      country.


      Nearer home there was a different change. For a century the Christian princes had written of al-Andalus
      as of a thing finished, a chapter closed long ago. Now their envoys came to Ishbīliya. They came from
      Italy, from the princes of the Empire, from the Angevins' rivals and even, quietly, from the Angevins.
      They brought gifts and careful compliments, and each of them asked, in his own way, what the Emperor
      meant to do.


      The Emperor [Muḥammad](person:muhammad-ibn-ismail-ibn-saad) received them on 18 Jumādā al-Ūlā 851 in the
      new palace by the river. He had built it for exactly this, and he enjoyed every hour of it. His
      secretaries remembered that he had read the history of ʿAbd al-Raḥmān II the night before, and the
      embassy of the Greek emperor Theophilos to [Qurṭuba](place:qurtuba) in the year 225. When the last envoy
      had finished, the Emperor gave them one answer for all their masters: "We have arrived." The court wrote
      it down as a boast. The heir [Ismāʿīl](person:ismail-ibn-muhammad-ibn-ismail) said it was a promise, and
      a harder one to keep. Al-Andalus held no mastery in Europe, only a seat regained at a table its fathers
      had once headed. It would keep the gifts of the Restoration as long as it kept its weight among the
      powers of Europe, and the dīwān set itself to make sure it did.


      The answer had a second half, and the jurists gave it its name. If al-Andalus was the heir of Qurṭuba,
      it was the heir of the Umayyads. And the Umayyads had not ruled al-Andalus alone. In their first age,
      from Damascus, their writ had run from the Pyrenees to the Oxus: across the whole Maghrib, through Egypt
      and Syria and Arabia, and into Persia. The jurists drew up the claim, and the Emperor had the map of it
      drawn and hung in the hall of the dīwān.


      Then the dīwān looked at the map. Iberia was already the Emperor's, or his ṭāʾifas'. Fās and all the
      Maghrib al-Aqṣā belonged to the Banū Marīn, the Emperor's oldest allies, whose blood ran in his own
      house through his grandmother [Duʿāʾ](person:dua-marinid). Ifrīqiya belonged to the Banū Ḥafṣ of Tūnis,
      whose war in Sicily al-Andalus had joined in Rabīʿ al-Awwal. Egypt, Syria and the Ḥijāz belonged to the
      Mamlūks of Miṣr, the realm's friends for eighty years. Ismāʿīl had married princesses of Fās and of
      Egypt. Only Persia, at the far edge of the map, belonged to anyone else, and that was the empire that
      was falling in on itself.


      Ismāʿīl laughed when he saw it. A claim on the lands of one's friends, he said, was a sword that does
      not leave the scabbard, and a sword in the scabbard is still a sword. The old Mamlūk party at court did
      not laugh. Its men had served the alliance with Cairo all their lives, and they asked the Emperor to say
      plainly that the claim was a scholar's exercise. Prince [Aḥmad](person:ahmad-ibn-muhammad-ibn-ismail)
      studied the roads on the map and said nothing about the borders.


      The Emperor gave no order either way. The map stayed on the wall.


      *And fulfil the covenant of God when you have taken it, and do not break oaths after their confirmation
      while you have made God, over you, a witness. Indeed, God knows what you do.*
  - id: 0851-07-24-of-the-lady-isabel-and-the-bridges-of-the-west
    'on': '1447-10-05'
    title: Of the Lady Isabel and the Bridges of the West
    book: book-of-the-franks
    verse: '31:14'
    who:
      - isabel-de-montsoriu
      - ahmad-ibn-muhammad-ibn-ismail
      - muhammad-ibn-ismail-ibn-saad
      - ahmad-ibn-yusuf-ibn-ismail
      - abd-al-jalil-al-qubbasi
    where:
      - ishbiliyya
      - batalyaws
      - jayyan
      - shantarin
      - qurtuba
      - larida
      - sharish
      - istijja
      - jarunda
    covers:
      - 1447-08-19-death-of-isabel-de-montsoriu
      - 1447-06-29-birth-of-fatima-bint-saad
      - 1447-10-05-the-bridges-of-the-wadi-ana
      - 1447-10-05-the-explorer-turns-to-the-cape
    text: >
      On 14 Rabīʿ al-Thānī 851 a daughter was born in the house of the lords of Banbalūna. Her father was
      Saʿd, son of [Aḥmad](person:ahmad-ibn-yusuf-ibn-ismail) of Banbalūna. Her mother was Muʾmina, daughter
      of the prince [Aḥmad](person:ahmad-ibn-muhammad-ibn-ismail). They named her Fāṭima. The court counted
      her twice over: a great-granddaughter of the Emperor, and one more knot between the crown and the
      ṭāʾifas of the north.


      Her great-grandmother lived to hear of her and not much longer. The lady [Isabel de
      Montsoriu](person:isabel-de-montsoriu) had come south from the Catalan houses as a girl. She was the
      Emperor's wife for more than forty years and the mother of his son Aḥmad, and through her own mother she
      was a granddaughter of the house of Naṣr. She died of old age on 6 Jumādā al-Ākhira 851, on the day she
      turned sixty-five.


      The Emperor [Muḥammad](person:muhammad-ibn-ismail-ibn-saad) mourned her with the ceremony he gave to
      everything, and it was real for all that. Aḥmad mourned her by working. His mother had been the first to
      praise the cities he drew in the sand as a boy. In the months after her death he spent the treasury
      almost to the bottom.


      The treasury had been full in the spring. By Rajab it held less than a tenth of what it had held in
      Muḥarram, and the clerks could show where every dirham had gone. Six bridges went up in the country of
      the Tagus and the Guadiana, at al-Qanṭara, Madallīn, the Serena, Valencia de Alcántara, Brozas and
      Jaraicejo, so that the roads of the west no longer waited on the seasons for a ford. The townsmen of
      al-Qanṭara already had a bridge, the old Roman one, which had given the town its name. Aḥmad gave them a
      second. The gunsmiths of [Jayyān](place:jayyan), [Baṭalyaws](place:batalyaws) and
      [Shantarīn](place:shantarin) took on more hands. New tanneries opened at [Qurṭuba](place:qurtuba) and
      [Lārida](place:larida), and new glassworks at [Ishbīliya](place:ishbiliyya). There was a distillery at
      [Sharīsh](place:sharish), a lumber mill at [Istijja](place:istijja), and a press for the wine of the
      Christian vineyards at Castellón. At [Jarunda](place:jarunda) a second foundry began to cast cannon. The
      Emperor asked what it all cost and was told. He let his son go on.


      The court had grown in other ways. In those months it took in a scholar of Delhi named Dilipapala, a
      scholar of ʿIrāq, and a lord of the Tandroy from the great island beyond the Cape, Matoky of the
      Fahambahy. He was the first man of Madagascar most of the court had ever seen, and the pages followed
      him through the palace. No one wrote down how he had come.


      On 20 Rajab [ʿAbd al-Jalīl al-Qubbāṣī](person:abd-al-jalil-al-qubbasi) came to the end of his
      commission. Four days later he sailed again for the cape where Africa ends, this time to find a place
      where the crown could leave men behind.


      *And We have enjoined upon man care for his parents. His mother carried him in weakness upon weakness,
      and his weaning is in two years. Be grateful to Me and to your parents; to Me is the destination.*
