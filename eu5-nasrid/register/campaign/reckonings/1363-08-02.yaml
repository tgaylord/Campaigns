tellings:
  - id: 0764-10-19-the-death-of-al-hajj-yusuf
    'on': '1363-08-01'
    title: Of the March into the West, and the Death of al-Ḥājj Yūsuf
    verse: 3:185
    who:
      - yusuf-i
      - saad-ibn-yusuf
      - nasr-al-istijji
      - dua-marinid
    where:
      - ayamunt
      - tulaytula
      - balansiyya
      - mursiyya
      - fas
      - qurtuba
      - istijja
    covers:
      - 1362-11-01-qasr-al-riyad
      - 1363-05-20-war-of-independence
      - 1363-05-20-state
      - 1363-05-20-portugal-first
      - 1363-05-20-taifas-untouched
      - 1363-07-27-aragon-joins
      - 1363-08-01-death-yusuf
      - 1363-08-01-saad-succeeds
      - 1363-08-dua-marries-nasr
      - 1363-08-02-state
    text: >
      On the fifth of Shaʿbān in the year 764, the truce with Qashtāla ran out, and our lord
      [Yūsuf](person:yusuf-i) did not wait an hour longer. He had a just cause, and he had the ṭāʾifas of
      [Balansiyya](place:balansiyya) and [Mursiyya](place:mursiyya), whole and untouched. He also had a rival
      who could barely stand. The Marīnids held fifty-eight Castilian towns, as far as
      [Ṭulayṭula](place:tulaytula) itself, and the tyrant of Qashtāla had fewer than two hundred men left to
      call up. The treasury held fifty-seven dīnārs. The sultan said that a war for freedom is not fought with
      what is in the treasury, and he marched north.


      His plan was simple. Portugal had made its own peace with [Fās](place:fas) and its army was whole, so
      Portugal would be knocked out first, before it could join the others. The army went west through the
      hills toward the Guadiana. In Shawwāl came word that Arghūn had joined Qashtāla. A year earlier the two
      had been at war with each other.


      The sultan never reached Portugal. On the nineteenth of Shawwāl, at [Ayamūnt](place:ayamunt) where the
      Guadiana meets the sea, al-Ḥājj Yūsuf died on the march, ten weeks into the war he had waited thirty
      years to fight. He was forty-five. The physicians spoke of the heat of the road and a fever that came on
      in the night. The soldiers said only that he had gone to Allāh with his face turned toward the enemy,
      and they asked for nothing better for themselves.


      Consider what he left. He came to the throne at fifteen, lord of eighteen towns in the mountains,
      tributary to Qashtāla and in debt to his own estates. He left forty-three towns, the valley of the great
      river and [Qurṭuba](place:qurtuba) of the caliphs, a treasury that had once been free of debt, and a
      sovereignty the court reckoned complete. He had made the pilgrimage and fed the poor of Makka. He had
      outlived the pestilence. In his last year he had begun the Qaṣr al-Riyāḍ al-Saʿīd in the heart of the
      Alhambra, with its lions and its vaults of muqarnas, so that the house of Naṣr would have a palace
      worthy of what it had become. He did not live to see it finished.


      His son [Saʿd](person:saad-ibn-yusuf) was fifteen, the same age his father had been, and the court said
      there was no child like him in all of Islam. But he could not rule until he came of age in Rabīʿ
      al-Thānī. The dīwān named a regent, [Naṣr al-Istijjī](person:nasr-al-istijji), a noble of the house of
      [Istijja](place:istijja). He was a man of no great gifts, chosen perhaps because no one feared him.
      Within days of the burial he had married [Duʿāʾ](person:dua-marinid), the late sultan's Marīnid widow
      and minister. The court noticed. The army, still in the field, went on without its sultan, and the
      treasury held twenty-four dīnārs.


      *Every soul will taste death, and you will only be given your full reward on the Day of Resurrection.*
