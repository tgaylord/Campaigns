tellings:
  - id: 0846-03-29-of-the-princes-mending-and-the-golden-century
    'on': '1442-08-07'
    title: Of the Princes' Mending, and the Golden Century
    verse: '14:7'
    who:
      - muhammad-ibn-ismail-ibn-saad
      - ismail-ibn-muhammad-ibn-ismail
      - ahmad-ibn-muhammad-ibn-ismail
    where:
      - ishbiliyya
      - qurtuba
    covers:
      - 1442-06-11-the-princes-mend-the-damage
      - 1442-08-07-the-golden-century
      - 1442-08-07-establish-a-thalassocracy
      - 1440-10-01-the-palace-city-of-qurtuba
      - 1442-06-01-national-assemblies
      - 1442-06-01-privileges-for-the-burghers
    text: >
      The princes [Ismāʿīl](person:ismail-ibn-muhammad-ibn-ismail) and
      [Aḥmad](person:ahmad-ibn-muhammad-ibn-ismail) had not been asked about their father's Jamāʿa, but they
      were left to deal with what came of it, and they did not waste a day. While the umarāʾ were still
      drafting their protests, the princes rode out to the hinterland. They spoke to the headmen of the
      villages, the men who had eaten from the Emperor Ismāʿīl's granaries and remembered who had built them,
      and they told them that the crown had not forgotten the countryside for the cities. The commoners had no
      love for the merchants, but they had less for the lords, and the hinterland stayed quiet. Then the
      princes went to the ʿulamāʾ. They could not undo the merchants' seats, but they could promise the
      scholars that when the heir Ismāʿīl came to the throne, every right the ʿulamāʾ held would be confirmed
      by his own hand on the day of his accession. The ʿulamāʾ took the promise, and grumbled, and stayed.


      Ten days after the Jamāʿa the dīwān took stock. The realm's peace had held. The crown's standing with
      the people had even risen a little, for the princes had been seen to listen where the Emperor had not.
      But there was no estate of the realm except the burghers that was not deeply angry. The umarāʾ had lost
      their land rights four years before, and now their place above the merchants. The commoners felt passed
      over, and the ʿulamāʾ and the dhimmī felt crowded. The burghers, for their part, had never been happier,
      and in the arsenals of the coast their new contracts were already turning out ships faster than the old
      masters had ever managed.


      Two months later, at the end of Rabīʿ al-Awwal 846, the Emperor
      [Muḥammad](person:muhammad-ibn-ismail-ibn-saad) proclaimed what the court had been saying in private for
      five years. The Strait was held and the rival driven back. For the first time in centuries the call to
      prayer rose over an Iberia gathered under one banner. The age of the petty kings was over, and what the
      fall of [Qurṭuba](place:qurtuba) had scattered four hundred years before, he had made whole again. The
      proclamation was read in the mosques of every city from Lisbon to Perpignan: a century of wealth and
      consolidation lay ahead, the Golden Century of al-Andalus. Many maps, the clerks of the chancery said,
      would have to be redrawn.


      The Emperor's first act of the new age was signed the same day. Al-Andalus was to be a thalassocracy, an
      empire whose strength was its sea. For twenty years the crown would pay a fifth less for every ship it
      built, great or small, and the arsenals, the shipwrights' contracts and the sons of the umarāʾ serving
      their seasons with the fleet were all bent to one purpose: a navy that no league of Christian kings
      could match. Above Qurṭuba, the palace-city of the caliphs, Madīnat al-Zahrāʾ, had risen again from its
      ruins on the Emperor's orders. The court said that the new age had been given both its symbols at once,
      a palace on the land and a fleet on the sea, and that it was not hard to tell which the Emperor loved
      more.


      The princes read the proclamation with care, and so did the ambassadors in
      [Ishbīliya](place:ishbiliyya). The Christian kingdoms beyond the mountains had long counted al-Andalus a
      spent and fading power. Now they would have to reckon with its return, and the secretaries of the Dīwān
      al-Inshāʾ warned that if the empire's power in Europe or across the seas grew too great, its enemies and
      rivals would one day league together against it. The Emperor said that he had read about leagues too,
      and that the ones that formed against the great empires of old had usually been too late.


      *And when your Lord proclaimed: If you are grateful, I will surely increase you; but if you deny,
      indeed, My punishment is severe.*
