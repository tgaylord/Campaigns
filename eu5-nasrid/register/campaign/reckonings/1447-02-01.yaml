summary: >-
  From an autosave. Harbor Administration has replaced Autocracy among the realm's reforms: the crown gives up
  some power elsewhere to bring the ports under its control, and the realm's temper has swung hard to the sea
  (land against sea +86, from +52). The grand palace at Ishbīliya, commissioned in October 1444, stands.
  Aquitaine (23 November 1444) and Flanders (7 January 1447) have joined Genoa and Ireland in embargoing
  al-Andalus, and on 8 January 1447 al-Andalus closed its markets to the Angevins in turn. The treasury, 2,484
  in 1444, is down to 570, spent on the towns (foundries, gunsmiths, saltpetre, tanneries, cloth, bridges;
  Trent), and the realm's peace has fallen to 8.3; the estates sit at the levels the crown holds them at
  (umarāʾ 40, the rest 50, burghers 54). Estate power estimated from the reading of 16 November 1428.
