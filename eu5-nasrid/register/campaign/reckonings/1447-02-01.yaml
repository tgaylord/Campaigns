  - id: 0848-10-20-of-the-palace-on-the-river-and-the-harbours-of-the-crown
    'on': '1445-01-30'
    title: Of the Palace on the River, and the Harbours of the Crown
    book: book-of-the-golden-century
    verse: '14:32'
    who:
      - muhammad-ibn-ismail-ibn-saad
      - yusuf-ibn-ismail-ibn-muhammad
      - mumina-bint-muslih-al-din
      - amie-of-mali
      - tiramakhan-mali
      - fatima-bint-yusuf-ibn-ismail
      - abu-al-hasan-ali-ibn-yusuf-ibn-ismail
      - saad-ibn-yusuf-ibn-ismail
      - aisha-bint-yusuf-ibn-ismail-ibn-muhammad
      - faruq-ibn-yusuf-ibn-ismail
      - saad-ibn-ismail-ibn-saad
    where:
      - ishbiliyya
      - gharnata
    covers:
      - 1442-10-09-birth-abu-al-hasan-ali
      - 1443-07-24-birth-saad
      - 1443-09-03-death-saad-ibn-ismail
      - 1443-09-24-birth-aisha
      - 1444-10-24-birth-faruq
      - 1444-10-10-a-palace-by-the-sea
      - 1445-01-30-harbor-administration
    text: >
      The anger of the Jamāʿa of 846 did not last. By the spring of 848 the ʿulamāʾ, the commoners and the
      dhimmī had settled back to the measure at which the crown liked to keep them. Even the umarāʾ grumbled
      less, and the burghers, who had been delighted with the world for a year, were merely satisfied with it.
      The peace of the realm was not what it had been, but it was mending, and the Emperor's right to rule had
      never stood higher in the eyes of his subjects. The princes, who had spent two years appeasing the
      estates, were able to go home.


      The house grew in those years, and most of it grew around the admiral prince
      [Yūsuf](person:yusuf-ibn-ismail-ibn-muhammad). His wife [Muʾmina](person:mumina-bint-muslih-al-din) gave
      him his first son at [Gharnāṭa](place:gharnata) on 3 Jumādā al-Ākhira 846, and he was named [Abū
      al-Ḥasan ʿAlī](person:abu-al-hasan-ali-ibn-yusuf-ibn-ismail); he was third in line before he could walk.
      [Amie](person:amie-of-mali) of Mālī bore him two sons, [Saʿd](person:saad-ibn-yusuf-ibn-ismail) in 847
      and [Fārūq](person:faruq-ibn-yusuf-ibn-ismail) in 848, both at Niani, at the court of her father Mansa
      [Tiramakhan](person:tiramakhan-mali). [Fāṭima](person:fatima-bint-yusuf-ibn-ismail) of Banbalūna gave
      him a daughter, [ʿĀʾisha](person:aisha-bint-yusuf-ibn-ismail-ibn-muhammad), at Gharnāṭa. The court joked
      that the prince now had heirs on both shores of the desert.


      The house also lost one of its own. On 8 Jumādā al-Ūlā 847 the Emperor's brother
      [Saʿd](person:saad-ibn-ismail-ibn-saad) died at fifty-one. When the two of them were boys, the first
      Emperor had watched Saʿd closely, wondering whether he would make the better ruler. He had lived quietly
      since his brother took the throne, and he was buried quietly.


      On 26 Jumādā al-Ākhira 848 the Emperor announced that he would build a new palace at
      [Ishbīliya](place:ishbiliyya), on the river, where the sea-going ships came up to the capital. His
      grandfather had built mosques and his father madrasas. He meant to build a house from which an emperor
      of the sea could watch his ships come in, and he had it raised beside the quays.


      Four months later he turned to the harbours themselves. On 20 Shawwāl 848 he ordered that the ports of
      the realm be taken out of the hands of the towns and the tax-farmers and placed under the crown's own
      officers. A governor of the sea would answer for them, and the harbour masters would answer to him. The
      order was to take nearly two years to carry through. The clerks of the dīwān al-inshāʾ said that the
      crown's hand would reach the coast a fifth more easily through its ports, and that the coastal towns
      would grow faster for it. The harbour masters, who had grown rich under the old arrangement, said
      nothing in public. The ports had a price, and the Emperor paid it in his own power. To make room for the
      new ordinance he let go the old one by which he had ruled alone, and gave up a measure of his say
      elsewhere in the realm so that his officers might hold every harbour. The princes thought it a fair
      exchange: the court could argue about the rest, but the sea would answer to the crown.


      *And He subjected for you the ships to sail through the sea by His command, and subjected for you the
      rivers.*
  - id: 0849-12-16-of-the-cape-where-africa-ends-and-the-island-given-up
    'on': '1446-03-15'
    title: Of the Cape Where Africa Ends, and the Island Given Up
    book: book-of-the-encircling-sea
    verse: '29:20'
    who:
      - abd-al-jalil-al-qubbasi
      - muhammad-ibn-ismail-ibn-saad
    where:
      - ishbiliyya
    covers:
      - 1446-03-the-cape-where-africa-ends
      - 1443-06-26-the-jamaa-of-847
    text: >
      [ʿAbd al-Jalīl](person:abd-al-jalil-al-qubbasi) was born at al-Qubbāṣa, in the old lands of Portugal,
      two years after Portugal had ceased to be a kingdom, and he grew up an Andalusī of the umarāʾ in a
      country that had only lately become Andalusī. He had no great name to inherit, so he made one: the house
      he founded took its name from his birthplace, and men called him al-Qubbāṣī. He was a soldier more than
      a courtier. The officers who served under him said he could take a fortified harbour in a morning and
      could not hold a conversation at dinner. He had one passion besides war, and that was to know what lay
      beyond the last headland on the chart.


      On 28 Rajab 849 the Emperor [Muḥammad](person:muhammad-ibn-ismail-ibn-saad) made him one of the
      explorers of the empire and sent him south. The pilots of [Ishbīliya](place:ishbiliyya) had followed the
      coast of Africa for fifty years, past the Green Cape, past the gold coast, past the mouths of the great
      rivers, and every year the coast had gone on turning south and east and south again, as though the land
      had no end. ʿAbd al-Jalīl followed it further than any of them. In Dhū al-Ḥijja 849, the month of the
      pilgrimage, his ships came to a great cape where the land fell away and the coast turned at last toward
      the east. Beyond it there was open water. The pilots said that Africa had come to an end, and that the
      sea of the Indies might lie on the other side.


      The merchants were quicker than the court. While the explorer's report was still being copied, the
      burghers of Ishbīliya sent factors to study the kingdom of the Kongo, whose river and markets the ships
      had passed on the way south. Its copper, its cloth and its ivory were already being priced in the
      funduqs.


      In the same season the crown let go of the island of Fernando Po. The Jamāʿa of 847 had asked for it
      with one voice, and the burghers had offered to share the cost, but few settlers could be found to go so
      far, and the ships had no need of it: they went south along the coast of Mālī, where the Mansa's
      harbours and the trading posts of Kaabu served them well enough. The settlement was withdrawn, and the
      Emperor told the court that the island would wait until the sea road needed it. The lords who had hoped
      for estates there were not pleased. The burghers, who had found the Kongo, were less troubled than they
      had expected to be.


      *Say: Travel through the land and observe how He began creation.*
  - id: 0850-10-20-of-the-closed-ports-of-the-franks
    'on': '1447-01-08'
    title: Of the Closed Ports of the Franks
    book: book-of-the-franks
    verse: 16:126
    who:
      - muhammad-ibn-ismail-ibn-saad
      - ahmad-ibn-muhammad-ibn-ismail
    where:
      - ishbiliyya
      - jayyan
      - batalyaws
      - shantarin
      - sharish
      - qurtuba
    covers:
      - 1447-02-01-the-towns-taught-a-trade
      - 1444-05-27-the-irish-embargo
      - 1444-11-23-the-aquitaine-embargo
      - 1447-01-07-the-flanders-embargo
      - 1447-01-08-markets-closed-to-the-angevins
      - 1440-06-the-genoese-embargo
    text: >
      The trade war that Genoa had begun in 844 did not end. It spread, one market at a time, and wherever it
      spread the court of the Angevin crowns in London had been there first.


      On 8 Ṣafar 848 Ireland closed its ports to the merchants of al-Andalus. The Irish had no quarrel with
      Ishbīliya of their own. Their king was the Angevins' man, and he did as he was told. On 11 Shaʿbān of
      the same year the merchants of Aquitaine did the same. The wine of Bordeaux had been sold for a
      generation to Andalusī factors who paid for it in gold and sugar, and the Gascon merchants complained
      loudly that they were the ones being punished. Two years later, on 19 Shawwāl 850, Flanders followed.
      That was the heaviest blow. The cloth towns of Flanders were the greatest market of the north, and the
      Andalusī houses at Bruges had been buying and selling there since the days of the old Emperor.


      The court at [Ishbīliya](place:ishbiliyya) had kept its own embargo on the Angevins for six years, and
      it had not been enough. The day after Flanders closed, the Emperor
      [Muḥammad](person:muhammad-ibn-ismail-ibn-saad) ordered that the markets of al-Andalus be shut to every
      Angevin merchant: not only their ships kept out of the harbours, but their goods kept out of the
      funduqs, whoever carried them.


      The young merchants of the capital applauded. The old ones counted, found that by Dhū al-Qaʿda 850 the
      treasury held less than a quarter of what it had held three years before, and blamed the Franks. They
      were wrong. The gold had not gone on the trade war. It had gone into the towns, and the hand that spent
      it was the prince [Aḥmad](person:ahmad-ibn-muhammad-ibn-ismail)'s. His father kept his eyes on the
      harbours and the new palace and left the towns to the son who had drawn cities in the sand as a boy. In
      those years Aḥmad paid for foundries for cannon at Jarunda and [Jayyān](place:jayyan) and on the
      Henares; gunsmiths at [Baṭalyaws](place:batalyaws), al-Ushbūna, [Shantarīn](place:shantarin) and Jayyān;
      saltpetre works and distilleries at [Sharīsh](place:sharish); tanneries, masons, glassworks and
      potteries; and doubled the cloth workshops of [Qurṭuba](place:qurtuba) and Ishbīliya. Twenty-seven
      bridges were thrown over the rivers of the west and the centre. Town by town, the realm was being taught
      a trade.


      The Emperor still asked his treasurers every month what the war was costing. They told him it cost
      little, and that the towns cost a great deal. He let his son go on building. The peace of the realm,
      meanwhile, stood lower than at any time since the crusade.


      *And if you punish, punish with an equivalent of that with which you were harmed. But if you are
      patient, it is better for those who are patient.*
    behind: >-
      This note covers three entries: the palace and the harbours, the cape and Fernando Po, and the closed
      ports.


      **What the saves show.** There are three saves (29 August 1442, 6 February 1444, 27 August 1444) and an
      autosave of 1 February 1447.

      - *The estates:* back near the levels the tax rate holds them at by February 1444. The umarāʾ are at 35
      and the burghers at 56; by 1447 the umarāʾ are at 40, the burghers at 54 and the rest at 50. Legitimacy
      is full from 1444.

      - *The house:* Prince Yūsuf's four children, their mothers and their birthplaces (Saʿd and Fārūq at
      Niani) all come from the 1447 autosave, as does the death of Saʿd ibn Ismāʿīl on 3 September 1443.

      - *The palace:* a grand palace stands at Seville in the 1447 autosave; Trent's account gives the
      commission of 10 October 1444.

      - *Harbor Administration:* the effects (a naval governor, port proximity −20%, coastal growth +10%, 649
      days) are from Trent's screenshot of 30 January 1445. The autosave lists it among the reforms in force,
      with Autocracy gone: Trent swapped one for the other, and asked for it to be told as the crown giving up
      some power elsewhere to bring the ports under its control.

      - *The sea:* the land-versus-naval value moves from +27 (August 1442) to +86 (February 1447).

      - *The treasury and the peace:* 2,528 and 17.1 in February 1444; 570 and 8.3 in February 1447. The
      treasury went on the towns (Trent): between June 1442 and February 1447 the saves show 27 bridges;
      cannon foundries at Girona, Jaén and Alcalá de Henares; gunsmiths at Badajoz, Lisbon, Santarém and Jaén;
      saltpetre and distilleries at Jerez; a tannery at Alcalá; masons, glass, pottery, paper and jewellery
      guilds; and cloth workshops doubled at Córdoba (6 to 12) and Seville (6 to 11). The saves don't say why
      the peace fell, and the entry doesn't either.

      - *The embargoes:* Ireland on 27 May 1444, Aquitaine on 23 November 1444, Flanders on 7 January 1447.
      Al-Andalus's own closing of its markets to the Angevins on 8 January 1447 comes from the autosave; Trent
      didn't mention it. The save's dates were used where they differ from Trent's by a few days.


      **From Trent's account.** The explorer's cape in mid-March 1446, the merchants researching the Kongo,
      and Fernando Po withdrawn for want of migrants and of any direct need, since the route south runs by
      Mali; it may be taken up again when the sea road needs it. The explorer himself (birth at Alcobaça, his
      own house, his traits and his appointment on 30 October 1445) is from the autosave.


      **Invented colour.**

      - *Palace entry:* the princes going home, Saʿd's quiet life, the court's joke about heirs on both shores
      of the desert, the brothers watched as boys (the 1398 succession note supports it), the palace's
      purpose, the quays, the harbour masters and tax-farmers, and the clerks' talk.

      - *Cape entry:* ʿAbd al-Jalīl's character beyond his traits, the officers' saying, the pilots' fifty
      years down the coast, the month of the pilgrimage as the season, the open water and the sea of the
      Indies, the Kongo's goods, and the lords' and burghers' reactions.

      - *Closed-ports entry:* the Irish king as the Angevins' man, the Gascon wine trade, the Andalusī houses
      at Bruges, the young and old merchants, the old merchants blaming the Franks, and the treasurers'
      answer.

      - *Palace entry, the harbours:* the princes' view of the exchange.
