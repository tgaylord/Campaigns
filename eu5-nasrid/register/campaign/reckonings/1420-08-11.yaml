    text: >
      On 25 Muḥarram 819 [Umm al-Fatḥ](person:umm-al-fath-bint-saad), the old Emperor's first child, died at
      fifty-one. She had sat in the dīwān for twenty-two years, from the year of the League, and for most of
      them she had done one thing: she took lands the armies had won and made them part of the empire, from
      the valley of the Tagus to the country of the risings. Her seat stood empty for most of two years. Her
      daughter [Jadīla](person:jadila-bint-saad-ibn-faraj), the heir's third wife, sat in the dīwān already,
      and in Shaʿbān the Emperor took her off the settling of migrants and gave her the hardest task he had,
      to keep the realm at peace. The umarāʾ were still sore from the Jamāʿa of 817, and Prince
      [Yūsuf](person:yusuf-ibn-saad) was still at work soothing them.


      On the first day of Ramaḍān 819 the Emperor [Ismāʿīl](person:ismail-ibn-saad) told the dīwān how the
      empire would be governed from then on. The state was the Emperor's, and those who served it served him.
      The viziers and the governors were members of his household, as the slaves of the palace and the eunuchs
      of the harem were, and they would answer to him as his household answered, without appeal to any estate.
      The ʿulamāʾ looked for a precedent and found one in the caliphs of Qurṭuba, who had governed through the
      men of the palace and not through the great families. The umarāʾ looked for a way to object and found
      none. They had already given up their mercenaries and their lordships, and they had nothing left to give
      up but their pride.


      He used his new hand at once. On 27 Ramaḍān, the night the faithful keep as the Night of Power, sixteen
      of the twenty-one towns of the old Ṭāʾifa of [Shalamanka](place:shalamanka) were given away. The crown
      had taken them in a year and a half before, when the ṭāʾifa's lord died, and the Emperor had never
      wanted them. Shalamanka itself, Ciudad Rodrigo, Ledesma, Béjar and Coria and five more went to his son
      [Aḥmad](person:ahmad-ibn-ismail-ibn-saad) in Liyūn, and Ávila, Arévalo, Oropesa and three more went to
      [Abū Ḥammū](person:abu-hammu-rahhu) in Burghush. The rule his father had begun was now the rule of the
      empire. The north, where the Christians were many and the Muslims few, would be held through lords who
      owed their thrones to the Emperor, and the lands south of it would be the crown's. [Aḥmad ibn
      Yūsuf](person:ahmad-ibn-yusuf-ibn-ismail) of the dīwān was given new lands to integrate that same day,
      and in Dhū al-Qaʿda 820 the Emperor's nephew [Saʿd ibn Yūsuf](person:saad-ibn-yusuf-ibn-saad), raised at
      his court since the age of four, took Umm al-Fatḥ's seat.


      The generation of Yūsuf I passed in those years. [Jadīla](person:jadila-bint-yusuf), his daughter, queen
      of the Marīnids for thirty-five years, died in Dhū al-Qaʿda 819, three months before her husband.
      [ʿĀʾisha](person:aisha-bint-yusuf) died in Shaʿbān 822, and of all his children only [Umm
      al-Fatḥ](person:umm-al-fath-bint-yusuf), the youngest, was left. The court mourned them as the last of
      the sultanate, the realm of the old Alhambra that had paid tribute to Qashtāla. The empire that buried
      them stretched from Porto to Barshalūna.


      The next generation had grown up meanwhile. The heir [Muḥammad](person:muhammad-ibn-ismail-ibn-saad) was
      thirty-four and no better a governor than he had been at seventeen, and the clerks of the treasury now
      complained that he squeezed his own estates for every dirham they had. But his sons were men.
      [Ismāʿīl](person:ismail-ibn-muhammad-ibn-ismail) and [Aḥmad](person:ahmad-ibn-muhammad-ibn-ismail), born
      eight months apart, had come out of their tutors' hands as able as anyone in the house, and the younger,
      Isabel's son, was better at every art than the elder. No one at court said aloud that the crown would
      pass from a strong man through a weak one to a strong one again. Everyone had worked it out.


      On 21 Rajab 823 [Balansiyya](place:balansiyya) came into the crown. It had been a ṭāʾifa since Ṣafar
      741, when the young Yūsuf I had won it from Arghūn and given it to Joan d'Oriola to hold for him:
      seventeen towns, from Balansiyya itself, [Shāṭiba](place:shatiba) and [Dāniya](place:daniya) to
      [al-Qant](place:al-qant), Elche and Orihuela, and two hundred and twenty thousand people, Catalan in
      speech and Muslim in faith. Its last lord, Melchior, of Joan d'Oriola's house, went to the court of
      Catalonia with his family and his household. No one in Balansiyya had been asked, and no one in
      Balansiyya complained. The Emperor's letters had been preparing them for three years, and the governor
      who would sit in the city had a university and a great road waiting for him.


      The Emperor did not stay for the ceremony. On 19 Jumādā al-Ūlā the Castilians of Zamora had risen
      against his son in Liyūn, under a lord named [Eduardo de Avellaneda](person:eduardo-de-avellaneda), and
      proclaimed a kingdom of their own. It was a kingdom of a few hundred men. The Emperor was fifty-four and
      had not commanded an army since the War of Jillīqiya, and he took the whole standing army of the empire
      north himself, four thousand nine hundred men, and found the rebels at Fermoselle above the gorges of
      the Duero. On 30 Rajab he destroyed them, all three hundred and seventy, and lost no one. The next day
      was the first of Shaʿbān, the rising was over, and the Emperor's letters to the ṭāʾifas of the north had
      already gone out. A lord who could not keep his own towns quiet, they said, would find the Emperor there
      to keep them for him, and the Emperor never left a town quite as he had found it.


      *Blessed is He in whose hand is dominion, and He is over all things competent.*
  - id: 0823-08-01-the-second-survey-of-the-kingdoms
    'on': '1420-08-11'
    title: The Second Survey of the Kingdoms, and the Three Empires of the East
    verse: '30:9'
    who:
      - ismail-ibn-saad
      - saad-ibn-yusuf
      - temur
      - ahmad-ottoman
      - muhammad-ottoman
      - aisha-ottoman
      - aktai-mamluk
      - bolot-mamluk
      - umm-al-fath-bint-saad
      - yahya-marinid
      - abu-al-fadl-marinid
      - jadila-bint-yusuf
      - pedro-of-castile
    where:
      - ishbiliyya
      - fas
    covers:
      - 1420-08-11-the-world
      - 1417-04-22-ottoman-peace
      - 1417-03-19-death-of-abu-al-fadl
      - 1417-07-14-yahya-of-fas
      - 1411-11-27-alliance-of-tunis
      - 1370-09-13-the-world
    text: >
      Fifty years after the first survey of the kingdoms, the Emperor [Ismāʿīl](person:ismail-ibn-saad) found
      it in the treasury, still beside the map of the caliphs, with the leaf of three lines that his father
      [Saʿd](person:saad-ibn-yusuf) had kept. He read it and laughed at the last section, where the scribes
      had judged that Gharnāṭa was no longer far from the great powers. Then he ordered a new one. The Dīwān
      al-Inshāʾ had envoys at every court that mattered by now, and it did not need to question pilgrims and
      captives. Its survey was ready on the first day of Shaʿbān 823, the day after Fermoselle, and the
      Emperor read it on the road home.


      **Of the three empires of the East.** The scribes began where the news was. Fifty years ago the East had
      been a quarrel of emirs and beys. Now it had three masters, and every envoy wrote of them in the same
      breath.


      The greatest in land is [Tīmūr](person:temur), lord of Samarqand. He has reigned for sixty years and is
      eighty-four, and he has never stopped conquering. When the first survey was written his name was not on
      the list. Now his empire is the fourth power of the world, with seven hundred and seven towns, more than
      any realm but the empire of al-Ṣīn. Its frontiers run from Tabrīz to Kāshghar beyond the mountains, and
      in the last six years he has added Farghāna, Fārs, Kirmān and Hurmuz on the Gulf, where the spice ships
      of India put in. The envoys said three things of him: that he has never lost a battle, that he leaves
      pyramids of skulls outside the cities that resist him, and that his treasury is empty, because he spends
      everything on the next war. The dīwān has named him among the empire's rivals for years, which amused
      the envoys, since his nearest town lies a thousand leagues from Ishbīliya. He has named as his heir a
      captain called Köke, a conqueror and a reformer of armies, who is forty-eight. No one at Samarqand
      expects the empire to hold together long once Tīmūr dies, and no one there says so.


      The second is the house of ʿUthmān at Constantinople, sixth in the world. Fifty years ago the scribes
      wrote that the Turks were twenty-seventh among the powers and nowhere near the Strait. They have two
      hundred and ninety-four towns now, from the Danube to Erzurum, and eighty-two ships, the largest fleet
      in the Middle Sea. Their sultan is [Aḥmad](person:ahmad-ottoman), son of the
      [Muḥammad](person:muhammad-ottoman) of the first survey, and brother of the Emperor's own wife
      [ʿĀʾisha](person:aisha-ottoman). He has reigned since 815. He is a pious man and nothing else; the
      envoys found him slow in council and slower in the field. But in Rabīʿ al-Awwal 820 his generals made a
      peace that brought Sivas and the lands of Eretna, Amasya and the Dobruja into the empire, and the Turks
      now hold all of Anatolia except Cilicia, which is the Mamlūks', and the hills of Karaman, which pay them
      homage. His son Murād is a better man than his father, and the Greeks and the Hungarians watch him.


      The third is the realm of the Mamlūks, ninth in the world and the only one of the three that is a
      friend. The sultan [Aqṭāy](person:aktai-mamluk) is the son of [Būlād](person:bolot-mamluk), and so a
      cousin of the Emperor's late half-sister [Umm al-Fatḥ](person:umm-al-fath-bint-saad). He has reigned for
      twenty-four years, a soldier whom his men will follow anywhere and a man who has seen the world. He
      holds Cairo, Syria and Palestine, and through his vassals the Ḥijāz and the Holy Cities, nearly three
      hundred towns in all. His merchants' trade is nearly as rich as the empire's own. The alliance of 768
      still stands, the oldest the empire has. The envoys warned that Aqṭāy names both the Turks and Tīmūr
      among his rivals, and that if either of them turned south the Mamlūks would need their friends.


      **Of the Maghrib.** Fās has a new sultan. [Abū al-Faḍl](person:abu-al-fadl-marinid), the Emperor's ally
      in the War of Jillīqiya, died of a fever of the lungs in Muḥarram 820 after thirty-five years on the
      throne. His son had died hunting in 813, so the throne went to his grandson
      [Yaḥyā](person:yahya-marinid), who was fifteen and has ruled in his own name since his sixteenth
      birthday. He is a grandson of [Jadīla](person:jadila-bint-yusuf), so the blood of Yūsuf I sits on the
      throne of [Fās](place:fas). The envoys did not like him: a cold young man, they wrote, who is cruel to
      his servants. But Fās is fourteenth in the world, it has forty-four ships, and it keeps the alliance. So
      do the Ḥafṣids of Tūnis, who joined it a month after the Peace of Rajab. For the first time since the
      Almohads every Muslim crown of the West stands together, and al-Andalus stands at their head.


      **Of the Franks.** England is the second power of the world, though half its strength lies in its
      vassals across the sea. Its king, William, is the only prince of Christendom who names al-Andalus among
      his enemies, and the only friend left to Qashtāla. France is fifth. Its king, Pierre, has the largest
      army in Christendom, more than forty thousand men, and is using it against the princes of the Low
      Countries. He names England among his enemies, and not al-Andalus. The crown of the Germans has passed
      to the duke of Saxony. The Pope, a man of fifty-nine named Guilhèm, sits at Rome again and not at
      Avignon. Hungary and Naples have one king, László, twenty-eight years old.


      **Of the Peninsula.** [Pedro](person:pedro-of-castile) of Qashtāla still reigns at Oviedo, as he has for
      twenty-six years, over forty-five towns in the rain. The scribes counted Qashtāla sixty-sixth among the
      powers of the world, and they found that it kept no army at all, only four ships. Its heir, Fernando, is
      twenty-eight.


      **Of al-Andalus.** Then the scribes set down the empire: third among the powers of the world, behind
      only al-Ṣīn and England. It rules a hundred and eighty-six towns of its own and as many again in its
      ṭāʾifas, from Porto to Barshalūna, and its trade is worth more than that of any realm in the West. The
      scribes noted one thing more, in red, as their predecessors had noted the enmity of France. Among the
      great powers of the world only England counts al-Andalus an enemy, and England has no army to speak of.


      The Emperor read it all on the road from Fermoselle. He had a leaf copied, as his father had, and the
      clerks who saw it said it had four lines: Tīmūr is eighty-four, the Turks have the fleet, the Mamlūks
      are our friends, and Qashtāla has no army. He kept it with him.


      *Have they not traveled through the land and seen how was the end of those before them? They were
      greater than them in power.*
    behind: >-
      The second survey follows the game's great-power ladder in the save of 11 August 1420, as the first did
      in 1370. Trent's reading: the East has formed into three empires. The ladder agrees. Tīmūr (fourth, 707
      towns), the Ottomans (sixth, 294) and the Mamlūks (ninth, 191 of their own and 103 in vassals) are the
      only Great Powers of the East on it, and the Tīmūrids now join the Mamlūks and the Ottomans on the
      Mashriq circle of the Kingdoms hall. The Ottoman peace of 22 April 1417 and the Tīmūrid conquests of
      1414–1415 are counted from the towns that changed hands in the save, not from any treaty text. "Men
      under arms" is still regulars and raised levies on the map. A zero for Castile means no army in the
      field, not none to raise.


      Rulers' character comes from their game traits: Tīmūr a conqueror, tactical genius, strategist and
      cruel; Aḥmad a zealot of 17/14/20; Aqṭāy an inspiring leader and worldly; Yaḥyā malevolent; the heir
      Muḥammad an extortioner. The Ottoman sultan Aḥmad is the son of the Muḥammad of 1370 and brother of the
      Emperor's wife ʿĀʾisha, and Yaḥyā of Fās is Jadīla bint Yūsuf's grandson. Both links are in the save.


      Invented colour, across this survey and the entries of August 1420: the Emperor finding the old survey
      and his leaf of four lines; Tīmūr's pyramids of skulls and unbeaten record (history's, not the save's);
      the envoys' opinions of Aḥmad and Yaḥyā; the old houses' objections to the universities and the
      Emperor's reply; the secretaries' laughter over Ibn Gharsiya's letter and the margin note (the letter,
      its argument and "a man is what he knows" are the game's event); the slaves and eunuchs of the household
      in the Autocracy speech (the game's reform says only that ministers become members of the royal
      household); the letters to the ṭāʾifas after Fermoselle; Angra's church and the Emperor's remark on it;
      the instructions to the Cape Verde settlers (the save's colony goal is to form a colonial nation); and
      the sailors' saying at Daniel's death (the fever and Sanlúcar are in the save). The treasury fell from
      1,923 to 277 between the saves of 1416 and 1420, with nothing owed (the loans of 1379 had been repaid
      before 1394). The save doesn't record what it was spent on.
