tellings:
  - id: 0822-08-10-of-the-universities-the-letter-from-denia-and-the-road-to-balansiyya
    'on': '1419-09-01'
    title: Of the Universities, the Letter from Denia, and the Road to Balansiyya
    verse: '30:22'
    who:
      - ismail-ibn-saad
      - saad-ibn-yusuf
    where:
      - ishbiliyya
      - qurtuba
      - gharnata
      - tulaytula
      - malaqa
      - daniya
      - balansiyya
    covers:
      - 1416-05-20-the-first-universities
      - 1419-04-01-the-letter-from-denia
      - 1419-04-the-catalans-and-valencia
      - 1419-09-the-road-to-balansiyya
      - 1413-01-14-madrasas-everywhere
      - 1413-05-01-education-of-the-people
    text: >
      The madrasas of 815 taught the children of the towns their letters. Three years later the Emperor
      [Ismāʿīl](person:ismail-ibn-saad) wanted something above them. On 22 Rabīʿ al-Awwal 819 the first
      universities of al-Andalus opened their doors, five of them at once: at [Ishbīliya](place:ishbiliyya),
      where the court sat; at [Qurṭuba](place:qurtuba), the old capital of the caliphs; at
      [Gharnāṭa](place:gharnata), where the house of Naṣr began; at [Ṭulayṭula](place:tulaytula), the city of
      the translators; and at [Mālaqa](place:malaqa), the port. The Emperor's charters gave each of them the
      same instruction. They were to teach law and grammar, as the mosques always had, but also medicine,
      astronomy, the measuring of the earth and the reckoning of accounts, and their doors were open to any
      subject of the empire who could pay or find a patron to pay for him. The umarāʾ asked what the sons of
      merchants would do with astronomy. The Emperor said they would find their way to the Indies with it, and
      that the umarāʾ's sons were welcome to come and learn it too.


      The new scholars soon found an old quarrel waiting for them. In Rabīʿ al-Awwal 822 a letter more than
      three hundred years old began to pass from hand to hand among the secretaries of the dīwān. Its author
      was Ibn Gharsiya, a Basque Christian who had been carried off as a child and raised a Muslim at the
      court of [Dāniya](place:daniya), in the age of the first ṭāʾifas. He had written it against the old Arab
      families who sneered at men like him. The Arabs, he wrote, were masters at describing camels.
      Philosophy, astronomy and the measuring of the earth had belonged to the peoples they conquered long
      before the Arabs came, and those peoples still knew them better. In his own day the letter had caused a
      scandal. Now the secretaries read it aloud to each other and laughed, because half of them were the
      grandsons of converts themselves. The Berbers had carried the conquest of al-Andalus, the Slavs had
      commanded the guard of the caliphs, and the sons of converted natives had filled the chanceries, and
      still the old houses counted a man's descent before they counted his learning.


      The Emperor heard of it and asked for the letter. When he had read it he gave the dīwān his answer in
      four words that the secretaries copied into the margins of their own copies: a man is what he knows. He
      sent invitations to scholars of every nation to come to the new universities, and the old Arab families
      had to accept Berbers, converts and the sons of Christians in office beside them. The court said the
      Emperor had put it more shortly than Ibn Gharsiya, and had not needed to insult anyone's camels to do
      it.


      The answer had a purpose nearer home. The integration of [Balansiyya](place:balansiyya), a ṭāʾifa of the
      crown for eighty years, was nearly complete. Its people spoke Catalan and had nearly all come to Islam,
      and the dīwān meant them to stand at court as the Portuguese of al-Gharb and Burtuqāl already stood, as
      subjects whose tongue was no bar to office. The Castilians were not invited. They were the most numerous
      of the Emperor's subjects, and their king still sat at Oviedo, and the court left them out, when it
      noticed them at all.


      On 10 Shaʿbān 822 the Emperor ordered a great road built from Ishbīliya to Balansiyya, over the
      mountains of the old kingdom of Murcia. When Balansiyya came into the crown a governor would sit there,
      and the road would carry the empire's orders to him, and his influence out into the Middle Sea, as fast
      as a rider could go. The dīwān noted a second purpose that no one put in the charter. In the crusade of
      806 the Emperor's father [Saʿd](person:saad-ibn-yusuf) had marched over the Pyrenees to Avignon. A road
      that carried a governor's letters to the coast would carry an army to the French border just as fast,
      should a Pope ever preach another.


      *And of His signs is the creation of the heavens and the earth and the diversity of your languages and
      your colours. Indeed in that are signs for those of knowledge.*
  - id: 0823-07-21-of-daniel-the-green-cape-and-angra
    'on': '1420-08-01'
    title: Of Daniel, the Green Cape, and Angra
    verse: 17:66
    who:
      - ismail-ibn-saad
    where:
      - ishbiliyya
    covers:
      - 1419-09-04-death-of-daniel
      - 1420-03-09-maps-of-cabo-verde
      - 1420-08-01-angra
      - 1415-04-01-maxorata
      - 1412-01-01-funchal
      - 1408-10-11-expeditions
    text: >
      On 13 Shaʿbān 822 Daniel died, at fifty. He was the Sephardi who had come to Islam and kept the name he
      was born with, the first of his people to command a ship of the empire, and in the years after 811 he
      had taken it further south than any captain of al-Andalus had gone, into the gulf below the bulge of
      Africa where the coast turns east. He died of a fever at Sanlúcar, where the river of
      [Ishbīliya](place:ishbiliyya) meets the sea, and the sailors said it was more than most captains who had
      seen the gulf could hope for, to die in sight of home.


      The voyages he had begun went on without him. On 23 Ṣafar 823 the captains of the Green Cape came home
      with charts of the islands that lie off the westernmost point of Africa, beyond the country of Mālī:
      their harbours, their springs and the winds that reach them. There was no one on them. Within the month
      a fleet of settlers sailed for the islands with tools, seed and livestock, to found the first town of
      the empire in the southern sea. The dīwān's instructions to them were longer than any it had given
      before. The islands were not to be a fishing post like the others but a land of their own one day, with
      its own governor and its own people.


      The other islands were filling meanwhile. Funchal on Madeira had been a town of the crown since 814, and
      Maxorata in the Canaries since 818, where the Guanche islanders lived under the Emperor's protection and
      kept their own gods. On 21 Rajab 823, the same day Balansiyya came into the crown, the settlers of the
      Azores founded their first town, Angra, on the island of Terceira, thirty months after they had landed.
      It had a thousand people. Most were Portuguese, Castilian and Leonese peasants from the north,
      Christians who had taken the Emperor's offer of land in the middle of the Ocean, and they named their
      church before they had finished their houses. The dīwān did not object. The Emperor said that every town
      he founded in the Ocean was a town the king of Qashtāla would never found there, and that the faith of
      its farmers could wait for the madrasa.


      *Your Lord is the one who drives the ship for you through the sea that you may seek of His bounty.
      Indeed, He is ever Merciful to you.*
  - id: 0823-08-01-of-the-household-of-the-emperor-balansiyya-and-fermoselle
