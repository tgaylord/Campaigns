date: '1420-08-11'
title: The Annexation of Balansiyya
source:
  save: SP_ADU_1420_08_11 (compressed)
  game: 1.4.7
summary: >-
  Ten days after Balansiyya was taken into the crown (1 August 1420) and the day after Fermoselle, where the
  Emperor destroyed the rising of Zamora. The crown holds 186 towns and 2,434,000 people directly, with seven
  ṭāʾifas: sixteen of Shalamanka's towns went to Liyūn and Burghush in November 1416, and Angra in the Azores
  was settled on 1 August. Estates are estimated from the reading of 31 December 1415: the crown about a
  quarter, the umarāʾ and the burghers a fifth each, the dhimmī 17% (lower now that Balansiyya's Muslims are
  the crown's), the ʿulamāʾ 12%. The umarāʾ are two in five content again. The treasury, 1,923 in 1416, is
  down to 277, after the universities and the road to Balansiyya; income 260 against 236. Stability is barely
  above nothing, 5. The realm stands third in the world.
