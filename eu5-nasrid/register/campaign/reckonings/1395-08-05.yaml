tellings:
  - id: 0797-10-17-of-the-diwan-al-insha-and-the-two-taifas
    'on': '1395-08-05'
    title: Of the Dīwān al-Inshāʾ, the Two Ṭāʾifas, and the Embassies
    book: book-of-the-marches
    verse: '68:1'
    who:
      - saad-ibn-yusuf
      - saad-ibn-ismail
      - saad-ibn-faraj
      - umm-al-fath-bint-saad
      - ismail-ibn-saad
    where:
      - shalamanka
      - qunka
      - majrit
      - al-ushbuna
      - qurtuba
      - ishbiliyya
    covers:
      - 1395-08-05-diwan-al-insha
      - 1395-08-05-the-embassies
      - 1395-08-05-two-new-taifas
      - 1395-08-05-hold-on-al-ushbuna
    text: >
      Six weeks after the Peace of Ramaḍān the Emperor [Saʿd](person:saad-ibn-yusuf) gave the realm its fourth
      great office. The Count of the Christians had come in 780, the Ḥijāba in 789 and the Ḥisba in 791. On 17
      Shawwāl 797 he founded the Dīwān al-Inshāʾ, the chancery, whose secretaries drafted the edicts, the
      treaties and the letters to foreign kings in the high style of the court. Under the caliphs the kātib of
      the Inshāʾ had been prized above poets, for a well-turned letter could win what an army could not. The
      ʿulamāʾ approved. The umarāʾ grumbled that the realm was now governed by men who held pens instead of
      lances, and the Emperor answered that the lance had won the land and the pen would keep it. He fixed the
      secretaries' pay from the treasury himself and forbade them to take gifts from the courts they wrote to.
      A chancery that could be bought, he said, would write whatever the highest bidder wanted.


      The empire's letters already went far. That summer its envoys were received at Paris, at Naples, at
      Qusṭanṭīniyya of the Ottomans, and even in London, at the court of the English king.
      [Ismāʿīl](person:ismail-ibn-saad) the crown prince, who sat in the dīwān and could talk a bird down from
      a tree, was said to read the letters to Paris before they were sealed. Qashtāla would not be a friend;
      its young king had signed away fifty-one towns and did not mean to forget it. France was another matter.
      Its king answered warmly, and there was talk in the dīwān of an alliance. The cost was plain to
      everyone. France was losing a war against the English, the Burgundians and its own rebels of Boulogne
      and Brittany, and an alliance with France meant a share of that war. The Emperor let the talk go on and
      signed nothing.


      Then came the question the peace had left. The seventy-one towns of Ramaḍān had all passed to the crown,
      and the ṭāʾifas of the north had taught the court that Christians obeyed a Christian king who owed his
      crown to the Emperor more readily than a Muslim governor. On the same day as the chancery the Emperor
      carved two new ṭāʾifas from the Castilian lands, and gave them to two of his cousins, each of them named
      Saʿd like himself. [Saʿd ibn Ismāʿīl](person:saad-ibn-ismail), son of his late uncle Ismāʿīl and an
      Aydınid princess, took the Ṭāʾifa of [Shalamanka](place:shalamanka), twenty-one towns of the Leonese
      west from Ávila to the Portuguese border. [Saʿd ibn Faraj](person:saad-ibn-faraj), son of his uncle
      Faraj, took the Ṭāʾifa of [Qūnka](place:qunka), twenty towns of the Castilian east from Guadalajara and
      Sigüenza to Molina and Requena. He was also the Emperor's son-in-law, the husband of [Umm
      al-Fatḥ](person:umm-al-fath-bint-saad), who sat in the dīwān and had the integration of the new lands in
      her charge.


      The crown kept the rest: [Majrīṭ](place:majrit) and its towns from Alcalá to the Escorial, Cáceres and
      the country of Alcántara, and every town that had been Portugal's. The crown's own towns fell from a
      hundred and eighty-nine to a hundred and forty-eight. Giving away so much land in a day unsettled the
      realm for a season, and the old families of [Ishbīliya](place:ishbiliyya) wondered aloud why the Emperor
      had fought for towns only to hand them to his cousins. The foreign courts drew the opposite conclusion.
      A realm with six ṭāʾifas under its hand was a power, and they ranked al-Andalus among the first seven
      kingdoms of Christendom and Islam.


      [Al-Ushbūna](place:al-ushbuna), which the court had feared would be the hardest of all to hold, proved
      the easiest of the new lands. The seas along the coast were safer than they had been in living memory,
      and what could be reached by water could be governed by water. The governors of al-Ushbūna already
      answered to Ishbīliya far better than those of Majrīṭ, and far better than the Alentejo, where Yābura
      hardly answered at all. The dīwān reckoned that in a generation al-Ushbūna would be bound to the crown
      as closely as [Qurṭuba](place:qurtuba).


      *Nūn. By the pen and what they inscribe.*
