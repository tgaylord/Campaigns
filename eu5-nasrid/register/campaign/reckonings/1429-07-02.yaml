tellings:
  - id: 0832-09-25-of-the-death-of-the-emperor-ismail-and-the-two-princes
    'on': '1429-06-28'
    title: Of the Death of the Emperor Ismāʿīl, and the Two Princes
    verse: '31:34'
    who:
      - ismail-ibn-saad
      - muhammad-ibn-ismail-ibn-saad
      - ismail-ibn-muhammad-ibn-ismail
      - ahmad-ibn-muhammad-ibn-ismail
      - edward-v-of-england
      - berenguer-ramon-de-montsoriu
      - saad-ibn-yusuf
      - isabel-de-montsoriu
      - umm-al-fath-bint-muhammad
      - jadila-bint-saad-ibn-faraj
      - yusuf-ibn-saad
    where:
      - ishbiliyya
      - barshaluna
      - qurtuba
      - balansiyya
      - al-ushbuna
    covers:
      - 1428-12-01-forts-of-jaca-and-talarn
      - 1428-12-01-catalonia-to-the-crown
      - 1429-06-11-the-angevin-empire
      - 1429-06-28-death-of-the-emperor-ismail
      - 1429-06-28-accession-of-muhammad-v
      - 1429-06-28-the-two-princes
      - 1405-03-02-death-of-the-emperor
    text: >
      The last winter of the Emperor [Ismāʿīl](person:ismail-ibn-saad) was spent looking north. The English
      were on the far side of the Pyrenees now, and he ordered two fortresses built in the mountains: at Jaca,
      in the Ṭāʾifa of Arghūn, and at Talarn in the Pallars, in the Ṭāʾifa of Catalonia. He also told the
      dīwān that Catalonia itself must come into the crown, as Balansiyya had, and that he expected the work
      done within nine years. Its lord was his own cousin [Berenguer
      Ramon](person:berenguer-ramon-de-montsoriu), the son of Yūsuf I's daughter Fāṭima, and a good soldier.
      The Emperor did not think that made [Barshalūna](place:barshaluna) any less important. A great port on a
      border with the English was not a thing to leave to a ṭāʾifa, however loyal.


      In Ramaḍān 832 word came from the north that King [Edward](person:edward-v-of-england) had been crowned
      in Paris and had joined his crowns into one, which the Franks called the Angevin Empire. Its borders
      were those of the peace of the year before. Its name was new, and so were its ambitions. The envoys
      reported that the English king spoke of the whole inheritance of his ancestors, which had once run from
      the Scottish border to the Pyrenees. The Emperor had the report read to him twice.


      He did not live to answer it. On 25 Ramaḍān 832, in the last ten nights of the month, with the army
      gathered in its camp outside [Ishbīliya](place:ishbiliyya), the Emperor Ismāʿīl died. He was
      sixty-three. His father [Saʿd](person:saad-ibn-yusuf) had died on the march on the eve of Ramaḍān,
      twenty-four years before, and the people of the capital said that the father had died at the beginning
      of the month of mercy and the son at its end, and that the whole of the son's reign had been held
      between them.


      Consider what he left. He had come to the throne in the middle of the risings of 807, with a hundred
      towns of the crown still loyal out of a hundred and forty-eight, and he ended them in six months. He
      took al-Gharb with letters and Balansiyya with patience. In the War of Jillīqiya he led the army
      himself, though no one had ever called him a soldier, and at the Peace of Rajab he ended the kingdom of
      Portugal and drove Qashtāla into the mountains it had come out of, where it fell apart into four petty
      kingdoms and then three. He left a hundred and ninety-five towns under the crown and as many again under
      seven ṭāʾifas, two and a half million subjects of his own, and an empire that the courts of the world
      ranked third among all the powers, behind only al-Ṣīn and the new empire of the English. He built a
      madrasa in every town, universities in five cities and a granary in nearly every village. He took the
      mercenaries from the umarāʾ, then their lordships, then their equality, and he never once let them rise.
      He married his grandsons into the houses of Fās, Cairo and Constantinople, and sent his envoys to Niani
      by the sea road he had sent Khayr al-Dīn to find when he was a young man.


      The court had always said that he told every man in private what that man wished to hear. The court also
      said, and this was rarer, that he judged every man in public by the law, and that no one who came before
      him could say he had been judged by favour. When the chancellor announced his death to the realm, it was
      that he chose to mention: the Emperor's fair and impartial rulings, which the realm would miss. Those
      who had been lied to by him found, on reflection, that they had been lied to for the good of the state,
      and those who had been judged by him found that they had been judged fairly, and most of the umarāʾ had
      been both.


      The crown passed by the law of the house, which he had never changed, to his eldest son
      [Muḥammad](person:muhammad-ibn-ismail-ibn-saad), forty-three, who took the throne as Muḥammad V with
      [Isabel](person:isabel-de-montsoriu) of the Montsoriu beside him. The court had judged him unfit to rule
      when he was twelve, and in thirty years nothing had changed its mind except a day at the mouth of the
      Duero, when he had commanded the fleet and won. He was slow in council, and the treasury clerks said he
      squeezed his estates for every dirham. When the chancellor came to proclaim the new Emperor in the
      mosques, the old men of the court were heard to say that the realm had been cursed, and to ask God's
      mercy on them all.


      But the old Emperor had seen this coming for thirty years, and he had left the realm something better
      than a law. The new Emperor's sons, [Ismāʿīl](person:ismail-ibn-muhammad-ibn-ismail), now the heir, and
      [Aḥmad](person:ahmad-ibn-muhammad-ibn-ismail), took seats in the dīwān at their father's accession,
      beside their sister [Umm al-Fatḥ](person:umm-al-fath-bint-muhammad), her mother
      [Jadīla](person:jadila-bint-saad-ibn-faraj) and their great-uncle Prince [Yūsuf](person:yusuf-ibn-saad).
      In every earlier generation of the house of Naṣr the princes had been rivals. These two were not. They
      were twenty-six and twenty-six, sons of different mothers born eight months apart, and they had grown up
      being told that one of them would have to rule for the father who could not. They had decided between
      themselves to do it together. From the first week of the new reign the dīwān learned that a request
      refused by one prince was refused by both, and that an order the Emperor gave in a temper would be
      reconsidered by both before it was carried out. The realm would be kept together, whatever its Emperor
      did. They divided the work as they had divided everything since childhood. Ismāʿīl took the business of
      state that needed a tongue: the allies, the ṭāʾifas, and the long labour of making the north Muslim and
      Andalusī. Aḥmad took the business that needed a builder: the cities, the roads, the bridges and the
      trades. And it was understood, though no one wrote it down, that when Ismāʿīl reigned, Aḥmad would
      preside over his council, a second seat of power beside the throne.


      *And no soul perceives what it will earn tomorrow, and no soul perceives in what land it will die.
      Indeed, Allāh is Knowing and Acquainted.*
