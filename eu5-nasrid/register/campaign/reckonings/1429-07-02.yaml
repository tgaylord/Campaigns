  game: 1.4.7
summary: >-
  Four days after the Emperor Ismāʿīl II died in camp at Ishbīliya, on 28 June 1429, after twenty-four years
  on the throne. His son Muḥammad V, forty-three, reigns; the heir is Muḥammad's eldest son Ismāʿīl, and
  Ismāʿīl and his brother Aḥmad now sit in the dīwān. The succession has cost the crown most of its political
  influence (22, from 100). The crown holds 195 towns and 2,571,000 people, with seven ṭāʾifas; Teguise on
  Lanzarote was settled on 1 July. The Angevin Empire, Castile's ally, is second in the world with 180 points
  to al-Andalus's 101. Estates estimated from the reading of 16 November 1428. Treasury 647; income 280
  against 295; stability 6.
