tellings:
  - id: 0770-04-08-of-the-two-queens-in-the-autumn-fas-came-again
    'on': '1368-11-20'
    title: Of the Two Queens, in the Autumn Fās Came Again
    verse: '4:35'
    who:
      - saad-ibn-yusuf
      - dua-marinid
      - aiman-mamluk
      - sayyida-of-fezzan
      - abu-inan-faris
      - ismail-ibn-saad
      - murad
    where:
      - gharnata
      - qadis
      - fas
    covers:
      - 1367-01-30-mamluk-alliance
      - 1368-11-11-battle-cadiz
    text: >
      The chroniclers of other courts write their wars from the field. This one must also be written from the
      harem, because in the autumn of 770 the war with [Fās](place:fas) was fought there too.


      When the Marīnid sultan [Abū ʿInān](person:abu-inan-faris) declared his second war for the submission of
      Gharnāṭa, the first question at court was not where he would land. It was what
      [Duʿāʾ](person:dua-marinid) would do. She was a daughter of his house. She sat in the dīwān, she had
      borne the heir, and she had made half the court read Maghribī books and eat Maghribī food. Now the
      Maghrib was coming across the Strait with an army. In the souks they said she had letters from Fās. In
      the harem they said worse. The whisperers never found the letters, because there were none, but they did
      not need them.


      [Aiman](person:aiman-mamluk)'s party did not need to whisper. Two years before, when Cairo had let its
      alliance with Gharnāṭa lapse, it was Aiman who had written to Cairo, and it was her envoy who brought
      the treaty home in Jumādā al-Ūlā 768. Egypt stood with Gharnāṭa again because of her. Now her people
      said it openly in the dīwān: the Mamlūks were the realm's friends, the Marīnids its enemies, and the
      sultan should consider which queen came from which.


      Duʿāʾ answered as she answered everything, with work. She gave her jewels to the war chest, in public,
      before the dīwān. She had the Maghribī scholars of her circle preach the jihad against the Marīnid in
      the mosques of [Gharnāṭa](place:gharnata), which they did with more fervour than the Andalusīs. She sent
      her son [Ismāʿīl](person:ismail-ibn-saad), who was two, to be shown to the troops at the gate. The court
      said she had become more Andalusī than the Andalusīs. Some of them meant it as praise.


      Between the two queens stood [Sayyida](person:sayyida-of-fezzan), the sultan's mother. She had never
      forgiven Duʿāʾ for marrying her husband and then her son. She did not join the whisperers. She said, in
      the hearing of the whole court, that the sultan's wives were the sultan's business, and that a court
      that talked about them in wartime had too little to do. The whispering grew quieter after that. The
      court understood that the matriarch had not defended Duʿāʾ. She had defended the house.


      The war itself settled the question. On 29 Rabīʿ al-Awwal [Murād](person:murad) broke Abū ʿInān's army
      before [Qādis](place:qadis), and the Marīnid sultan went home. No letter from Fās was ever found. Our
      lord [Saʿd](person:saad-ibn-yusuf), who had said nothing through all of it, said one thing afterwards:
      that he had married the Maghrib and Egypt both, and meant to keep them both. He kept them both. He did
      not reconcile them.


      *And if you fear dissension between the two, send an arbitrator from his people and an arbitrator from
      her people.*
    behind: >-
      Written in November 2026 at Trent's direction: the struggle between the queens is to be a central thread
      of Saʿd's reign. Duʿāʾ stands for the Maghrib and Aiman for Egypt, with the matriarch Sayyida against
      Duʿāʾ, Faraj's going opening the way for Duʿāʾ's rise, and the princes Ismāʿīl and Aḥmad bound together
      from childhood. Trent allowed details the saves don't hold to be invented for this. Everything below is
      invented colour unless marked.


      **The new entry, *Of the Two Queens, in the Autumn Fās Came Again*.**

      - *From the record:* the Mamlūk alliance, lost in autumn 1366 and renewed on 30 January 1367; Abū
      ʿInān's declaration and his defeat at Cádiz on 11 November 1368; the ages of the children.

      - *Invented:* the whispers about Duʿāʾ's letters; Aiman writing to Cairo and her envoy bringing the
      treaty home; Duʿāʾ's jewels, her scholars preaching the jihad, and the heir shown at the gate; Sayyida's
      words to the court; and Saʿd's saying about keeping the Maghrib and Egypt both.


      **Passages added to earlier entries.**

      - *The Governor of Qurṭuba (1355):* Faraj going gladly, the Saharan guides and his talk of the salt
      roads; Sayyida's remark on the harem law.

      - *The Great Madrasa (1358):* Sayyida's court in the harem, and the scholars not asked to it.

      - *The Regent Who Did Not Last (1364):* Sayyida's year of silence, and Aiman writing to Cairo.

      - *The Peace of Independence (1366):* the two parties of the palace.

      - *Duʿāʾ's Regency (1374):* the perfect courtesy between Duʿāʾ and Sayyida.

      - *The Restoration (1375):* the exchange between Duʿāʾ and Aiman.

      - *The Kingdom of Ṭulayṭula (1380):* the order of the wives behind Sayyida's bier.

      - *The Death of Duʿāʾ (1388):* Aiman's white mourning.

      - *The Western Ocean (1392):* the guides who knew Faraj's name.

      - *The Sons of Muḥammad (1408):* the two boys never apart, Ismāʿīl talking and Aḥmad drawing towns in
      the sand.

      - *The Two Princes (1429):* the division of the work between them, and Aḥmad to preside over Ismāʿīl's
      council.

      - *The Closed Ports (1447):* Aḥmad as the hand that spent the treasury on the towns (Trent's direction),
      with the building itself from the saves.
