    text: >
      In the spring [Fās](place:fas) began to pour men across the Strait, and it did not stop. Its fleet was
      eighty ships strong and ruled the water, so it could land wherever it chose, and it chose everywhere. On
      the twenty-sixth of Shaʿbān 770 a Granadan column of two thousand one hundred attacked a Marīnid force
      of equal size at [Sharīsh](place:sharish) and was destroyed. [Murād](person:murad) retook the town in
      Ramaḍān with seven thousand men and five hundred of al-Gharb, and in Shawwāl he cleared
      [Shalūqa](place:shaluqa) at the mouth of the river.


      The Marīnid general that year was [ʿUthmān](person:osman-marinid). He was a level-headed man, born in
      the saddle, and he understood what the Granadans did not: [Qādis](place:qadis) mattered more than
      anything else on the coast. In Shawwāl he landed beside it, wiped out the five hundred and eighty
      Granadans who held the siege lines, and brought the fortress fresh men and grain. On the twentieth of
      Dhū al-Qaʿda [Khālid ibn Yaḥyā](person:khalid-ibn-yahya) came to take it back. Khālid was the architect
      who had sat in the dīwān from sixteen and had now been made a general. He brought six thousand four
      hundred and sixty men, Granadans, Gharbīs and the men of [Mursiyya](place:mursiyya), against four
      thousand seven hundred and seventy behind the causeway and the walls. It was the worst day of the war.
      Three thousand eight hundred and sixty of ours were left on the causeway, in the shallows and before the
      gate, and fourteen hundred and twenty of theirs. Khālid brought the rest home. When the dīwān met, our
      lord [Saʿd](person:saad-ibn-yusuf) spoke before anyone could reproach the general. The assault had been
      his order, he said, given in [Gharnāṭa](place:gharnata) and not in the lines, and the dead on the
      causeway were his to answer for before Allāh. No one at court reproached Khālid after that.


      The treasury could not replace those men, so the sultan borrowed from his own estates. Seven loans of
      sixty-seven dīnārs each, four hundred and sixty-nine in all, bought a company of four thousand eight
      hundred mercenaries. They were half of Khālid's army by autumn. The rest of the money came wherever the
      sultan could squeeze it: from the estates, from the ṭāʾifas, from what Fās had conceded, and from Egypt.


      In Ṣafar 771 a Marīnid army of four thousand eight hundred landed at [Mālaqa](place:malaqa). It caught
      the host of Mursiyya, four hundred and ten men under [Juan Manuel](person:juan-manuel-enriquez), and
      destroyed it. Then ʿUthmān marched inland with eight thousand men to cut the realm in two at
      [Antaqīra](place:antaqira), on the road between Mālaqa and Gharnāṭa.


      Khālid met him there on the thirteenth of Rabīʿ al-Awwal with six thousand two hundred. Those who fought
      that day said the line nearly broke in the afternoon. The mercenaries on the left gave ground and the
      Marīnid horse came through the gap. Khālid filled it himself with the last of the sultan's guard. The
      line held. When ʿUthmān drew off at dusk, four thousand and ninety of his men lay before it, against
      nine hundred and sixty of ours. No battle of the war killed more of the enemy, and none mattered more.
      Antaqīra was the high-water mark of the Marīnid flood. The heart of the realm was not reached.


      Three weeks later Khālid caught eighteen hundred and seventy Marīnids besieging [Ḥiṣn
      al-Munakkab](place:hisn-al-munakkab) on the coast and broke them, eleven hundred dead for two hundred of
      ours. In the same days the first Mamlūk army came ashore at [Jarghal](place:jarghal) in the hills above
      [al-Mariyya](place:al-mariyya), five thousand seven hundred soldiers of Egypt on the soil of al-Andalus.
      But the year belonged to Fās. Of all the north shore, only [Labla](place:labla) still answered to
      Gharnāṭa. Marīnid armies stood at [Runda](place:runda), [Abdara](place:abdara) and the gates of Mālaqa.
      The treasury was spending a hundred and seventy-six dīnārs a month and taking in seventy-six.


      *O you who have believed, when you encounter a company, stand firm and remember Allāh much, that you may
      be successful.*
