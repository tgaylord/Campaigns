    text: >
      The sultan of [Fās](place:fas) came across the water himself to take what he had demanded. [Abū ʿInān
      Fāris](person:abu-inan-faris) was a zealot and a soldier, and he had planned many attacks in his life.
      The plague had marked him years before. He landed at [Qādis](place:qadis) with eight hundred men, the
      vanguard of the host that was to follow. On the twenty-ninth of Rabīʿ al-Awwal 770, eighteen days after
      the declaration, [Murād](person:murad) fell on him with three thousand three hundred. Seven hundred and
      forty Marīnids died and sixty were taken. Sixty-five of ours fell. Abū ʿInān escaped to his ships. A
      sultan who had come to demand submission sailed home with the smallest army he had ever commanded.


      Then the court did what it had promised in 761: it threw its whole weight into the war.
      [Marballa](place:marballa) fell on the nineteenth of Rabīʿ al-Thānī to a single assault, its garrison of
      thirteen overwhelmed. On the fourth of Jumādā al-Ūlā the army of the so-called Kingdom of Sevilla, eight
      hundred men, stood at [Jabal Ṭāriq](place:jabal-tariq) and was broken. Ten days later its last three
      hundred and twenty were destroyed to a man at [Ṭarīfa](place:tarifa). The puppet kingdom had no army
      left, and its towns began to open their gates.


      In the middle of that campaign news came from [Gharnāṭa](place:gharnata). [Aiman](person:aiman-mamluk)
      had given our lord [Saʿd](person:saad-ibn-yusuf) a second daughter, [Jadīla](person:jadila-bint-saad),
      named for her aunt. Seven weeks later the first fruit of the Egyptian alliance arrived in the western
      sea. Ten Mamlūk ships out of Barqa met a ship of [Tilimsān](place:tilimsan) off the eastern coast and
      sank it. They were the first ships of Egypt in those waters in the memory of anyone living.


      The Marīnids answered with their first landing. On the twenty-ninth of Jumādā al-Ākhira two thousand six
      hundred came ashore at Marballa to take it back and fell on Murād's army of six thousand four hundred.
      Fifteen hundred and forty of them died, against five hundred and seventy of ours, and the rest were
      driven back into the sea. A week later the stragglers, a thousand and fifty men cut off in the
      mountains, attacked five hundred and seventy-five Granadans at [Runda](place:runda) and were destroyed
      to the last man.


      By Rajab the whole northern shore was in the sultan's hands, save one place. The old fortress of Qādis,
      on its island at the end of its causeway, still flew the banner of Fās. By any reckoning the war was
      going Gharnāṭa's way. But the dīwān's reckoners looked across the water and were not comforted. Fās and
      its allies had forty-seven thousand men under arms, twenty-three thousand of them the Marīnid sultan's
      own. Gharnāṭa had eight thousand eight hundred, and its ṭāʾifas fewer than three thousand. The Mamlūk
      sultan and his vassals had a hundred thousand more, but they were at the other end of the sea. The
      winter had been won with speed. The spring would be a test of numbers.


      *And remember when you were few and oppressed in the land, fearing that people might abduct you, but He
      sheltered you, supported you with His victory, and provided you with good things.*
