summary: >-
  A year into the Second Marīnid War. After the first winter's conquests on the north shore, the Moroccan
  counterattack has taken back all of it but Niebla. Khālid's army, half of it mercenaries paid with loans
  from the estates, held at Antequera and Almuñécar, and the first Mamlūk troops have landed at Gérgal.
  Expenses are more than double income. Shares of power are estimated from the 1 June 1349 reading.
