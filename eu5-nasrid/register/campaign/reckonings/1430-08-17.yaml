tellings:
  - id: 0833-10-23-of-the-war-of-shant-yaqub-and-the-shrine-of-the-apostle
    'on': '1430-07-15'
    title: Of the War of Shant Yāqub, and the Shrine of the Apostle
    verse: '22:40'
    who:
      - muhammad-ibn-ismail-ibn-saad
      - ismail-ibn-muhammad-ibn-ismail
      - ahmad-ibn-muhammad-ibn-ismail
      - abu-al-hasan-ali-ibn-ahmad
      - ahmad-ibn-ismail-ibn-saad
      - diego-villamarin
      - magdalena-de-borja
      - isabel-de-montsoriu
      - jadila-bint-saad-ibn-faraj
    where:
      - shant-yaqub
      - ishbiliyya
      - qurtuba
    covers:
      - 1430-05-18-the-princes-counsel
      - 1430-05-18-war-on-galicia
      - 1430-05-18-take-the-capital
      - 1430-06-30-battle-santiago
      - 1430-06-30-the-emperor-worldly
      - 1430-06-30-ahmad-the-architect
      - 1430-06-30-the-emperors-household
      - 1430-07-15-santiago-falls
      - 1420-09-04-the-fall-of-qashtala
      - 1425-03-25-galicia-takes-asturias
    text: >
      The Emperor [Muḥammad](person:muhammad-ibn-ismail-ibn-saad) had been on the throne less than a year when
      he called for war, and he called for it the way he did everything, all at once. His father had died with
      the work of the Istirdād unfinished, and the son meant to finish it and be done. He ordered the army
      north against Qashtāla, which had begun every war of the house of Naṣr for a hundred years, and he
      wanted it gone by the end of the summer.


      His sons talked him out of it. The princes [Ismāʿīl](person:ismail-ibn-muhammad-ibn-ismail) and
      [Aḥmad](person:ahmad-ibn-muhammad-ibn-ismail) did not argue with their father in the dīwān, where he did
      not like to be argued with. They argued with him in private, and they argued for a greater war, not a
      lesser one. Qashtāla was four towns and a king who sheltered behind the English, they said. The greatest
      of the kingdoms of the mountains was Jillīqiya, thirty-one towns from Shant Yāqub to the sea at Llanes,
      ruled by [Diego Villamarín](person:diego-villamarin), the best soldier left in the Christian north.
      Jillīqiya would be the nobler conquest and the harder one. After it would come Nabarra on the Basque
      coast, whose people the princes reckoned far more formidable than any Castilian. Qashtāla could wait for
      last. The Emperor liked the sound of a nobler conquest, and for now he was persuaded.


      On 24 Shaʿbān 833 (18 May 1430) war was declared on Jillīqiya. It was the fifth war of the Istirdād, and
      it was named for the city at its end, Shant Yāqub, which the Christians call Santiago de Compostela. All
      seven ṭāʾifas marched with the crown. The Emperor's orders to his generals ran to one line: take the
      capital. The princes added the rest. Jillīqiya had no army in the field and two ships; the empire had
      four thousand six hundred regulars and fifty sail. The princes meant to reach Shant Yāqub before Diego
      could raise one.


      He very nearly raised one in time. On 8 Shawwāl 833 the Galicians met the vanguard before the walls of
      Shant Yāqub: seven thousand men, nearly all of them levied archers called in from the villages. Against
      them stood four thousand nine hundred under [Abū al-Ḥasan ʿAlī](person:abu-al-hasan-ali-ibn-ahmad), the
      son of the Emperor's brother [Aḥmad](person:ahmad-ibn-ismail-ibn-saad) of Liyūn. He was seventeen years
      old. He sent his light horse around the archers' flanks, rode the heavy horse into them, and broke them
      before noon. Three thousand eight hundred Galicians were killed or taken, for two hundred and
      twenty-seven of ours. The way to the city was open, and the court reckoned the war a quarter won in a
      single day.


      The Emperor heard the news among his ships. The court said that his years with the fleet had made him
      another man from the slow boy of the dīwān. He knew fishermen and harbour-masters and the captains of
      every merchant house in Ishbīliya by name, and he understood how things were actually done in the world
      better than many cleverer men. His eyes, all the same, were on the sea, and the state was carried by
      those around him. His three wives, [Magdalena](person:magdalena-de-borja) of the Borja,
      [Isabel](person:isabel-de-montsoriu) of the Montsoriu and [Jadīla](person:jadila-bint-saad-ibn-faraj) of
      his own house, had been chosen by his father and grandfather for their minds as well as their blood.
      With the two princes they did most of the governing, and the old Emperors had meant them to. Prince
      Aḥmad had begun to draw buildings, as his forebears had, and to talk of the great works he would raise
      in the capital one day.


      Shant Yāqub held out for fifteen days. Its garrison was broken by hunger and sickness, not by assault,
      and on 23 Shawwāl 833 (15 July 1430) it was allowed to march out under its own banners. Then the Emperor
      gave the order that will be remembered longer than the battle.


      The cathedral of Shant Yāqub was the greatest church of the Christian West outside Rome. It had been
      raised over the tomb the Christians believed was that of the Apostle James, whom they called their
      patron and the Moor-slayer, and it stood at the end of the pilgrim road that ran across all of
      Christendom from the Rhine and the Alps. Every year tens of thousands walked that road to touch the
      stone. When al-Manṣūr took the city in 387 he carried its bells back to [Qurṭuba](place:qurtuba) on the
      backs of Christian captives, to be hung upside down as lamps in the Great Mosque. But he left the tomb
      alone. The chroniclers said he found a single old monk sitting beside it and told his men to leave the
      man in peace.


      The Emperor Muḥammad did not leave the tomb alone. On his direct orders the cathedral was pulled down.
      The masons of the army were told to save one thing. The great carved porch of the west front, the
      Pórtico de la Gloria, with its two hundred figures of prophets, elders and the saved, was taken down
      stone by stone and carted south to [Ishbīliya](place:ishbiliyya). The rest became a field of rubble.


      No one in the dīwān asked the Emperor why. Some of the ʿulamāʾ praised the deed from the pulpit, and
      others kept silent, and the silent ones were the more learned. The princes did not speak of it at all.
      The court had seen what happened to Christendom when a pope preached a crusade, and it knew that the
      Christians of the north, who had been told for two years that the Emperor's coming was a homecoming, now
      had a different story to tell. What the destruction of the Apostle's shrine would cost al-Andalus, and
      when, and to whom it would be paid, remains to be seen.


      *And were it not that Allāh checks the people, some by means of others, there would have been demolished
      monasteries, churches, synagogues, and mosques in which the name of Allāh is much mentioned.*
