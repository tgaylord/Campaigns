summary: >-
  The day of the declaration on Navarre, with Galicia beaten but not yet at peace: Santiago taken and its
  cathedral destroyed, the last Galician army wiped out at Oviedo. Navarre and Castile have no men under arms;
  the Angevin Empire, Castile's ally, stays out. The crown holds 196 towns, seven ṭāʾifas march with it, and
  stability has fallen below nothing (−0.4) with the new war. Estates estimated from the reading of 16
  November 1428. Treasury 581; manpower 17,300 of 19,000.
