  - id: 1430-08-17-the-princes-opening
    'on': '1430-08-17'
    kind: note
    what: >-
      The peace with Galicia is not so simple. Its annexation is beyond question, but the two princes are not
      done in the north: their father is set on destroying the Castilians, and the realm is not ready for a
      war with the Angevins. Then an opening: Navarre has allied itself to Castile, and while Castile is under
      London's protection, Navarre is not. If the armies already in the north overwhelm both before London
      decides whether it must help, the crown has its chance
    who:
      - ismail-ibn-muhammad-ibn-ismail
      - ahmad-ibn-muhammad-ibn-ismail
      - muhammad-ibn-ismail-ibn-saad
    threads:
