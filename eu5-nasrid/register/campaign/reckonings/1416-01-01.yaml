date: '1416-01-01'
title: The Estates of 818
source:
  save: SP_ADU_1416_01_01 (compressed)
  game: 1.4.7
summary: >-
  The estates panel of 31 December 1415, read the day before this save: the crown holds about a quarter of the
  power of the state, the dhimmī 22%, the burghers 19%, the umarāʾ 18%, the ʿulamāʾ 10%, the commoners 2%, and
  the tribes, new with the Canaries, under 1%. Fourteen months after the Jamāʿa the umarāʾ are a quarter
  content and recovering, with Prince Yūsuf appeasing them in the dīwān. On 11 June 1415 the Ṭāʾifa of
  Shalamanka was taken into the crown after its ruler's death, and Maxorata in the Canaries was settled. The
  crown holds 184 towns and 2,445,000 people directly, with eight ṭāʾifas. Treasury 1,923, income 251 against
  232; the realm's peace is still shaken.
