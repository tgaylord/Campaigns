date: '1459-03-02'
title: The End of the Ṭāʾifa of Qūnka
summary: >-
  From a save and Trent's account. On 1 March 1459 the Ṭāʾifa of Qūnka, a subject since 1395, was folded into
  the crown: twenty towns from Qūnka and Alarcón to Guadalajara and Sigüenza, and some 300,000 souls. Its last
  shaykh, Abū al-Ḥasan ʿAlī, stays on as a noble. The realm now counts 298 towns and 5.2 million people.
  Stability rose from 16 to 48. The Angevins have held a claim of conquest on al-Andalus since November 1458.
  The settlements in Cuba and the Bahamas are a year old.
