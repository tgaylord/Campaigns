date: '1454-05-03'
title: The End of the Ṭāʾifa of Portugal
summary: >-
  From a save, a screen and Trent's account. On 1 May 1454 the ṭāʾifa of Portugal, a subject since 1411, was
  integrated into the crown: 34 towns and some 800,000 souls. The realm now counts 278 towns and 4.72 million
  people. The Portuguese are its largest people, and Catholics (49%) now outnumber Muslims (46%). The
  child-queen Fāṭima and her mother stay on as nobles. Ismāʿīl has become a charismatic negotiator. The
  Mamlūks' war on the Banū Lām is over; its terms are not yet known.
