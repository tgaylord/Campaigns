tellings:
  - id: 0763-10-07-the-marinid-demand
    'on': '1362-07-30'
    title: Of the Marīnid Demand, and the Peace Bought with a Warning
    book: book-of-balance
    verse: '47:35'
    who:
      - yusuf-i
      - ismail-ibn-ismail
      - sayyida-of-fezzan
      - khalid-ibn-yahya
      - aisha-bint-yusuf
      - saad-ibn-yusuf
      - tizemt-hafsid
      - umm-al-fath-bint-yusuf
    where:
      - gharnata
      - qurtuba
      - fas
      - tilimsan
      - al-mariyya
      - sharish
      - ishbiliyya
      - qadis
      - walba
      - balansiyya
    covers:
      - 1354-03-16-betrothal-aydinids
      - 1359-03-15-castile-aragon-war
      - 1359-ismail-to-aydin
      - 1359-04-khalid-council
      - 1359-07-01-funduq
      - 1360-06-26-state
      - 1360-06-26-marinid-war
      - 1360-06-26-chance-lost
      - 1360-11-07-battle-almeria
      - 1360-11-14-diwan-al-mustakhlas
      - 1361-02-03-marinid-landings
      - 1361-03-23-battle-jerez
      - 1361-12-13-battle-sevilla
      - 1362-04-08-battle-sevilla
      - 1362-06-10-state
      - 1362-07-30-white-peace-morocco
    text: >
      For twenty years the court had worked to set the Christian crowns against one another. In Rabīʿ al-Thānī
      of the year 760 the work bore fruit. Qashtāla and Portugal marched east together into Arghūn, and Arghūn
      called Savoy and Sicily to its side. The dīwān counted the dead of that war as the reports came in, ten
      thousand Castilians and thirty thousand Portuguese, and began to speak openly of independence.
      [Gharnāṭa](place:gharnata) was still Qashtāla's tributary in name. If the Christians bled each other
      white, it would strike for its freedom.


      The house of Naṣr lost another prince to a foreign court that spring. [Ismāʿīl ibn
      Ismāʿīl](person:ismail-ibn-ismail), the sultan's brother, married the bride of the house of Aydīn
      promised to him five years before, and went east to live in her father's palace in Anatolia. As with
      Faraj, the harem was blamed for it. The sultan would have given his brother's seat to
      [Sayyida](person:sayyida-of-fezzan), his first wife, but it was not to be. It went to
      [Khālid](person:khalid-ibn-yahya), son of the late Yaḥyā Raḥḥū. He was sixteen years old and one of the
      ablest men the court had seen in a generation.


      That summer the merchants, the Italians above all, who carried the better part of the realm's trade,
      pressed the sultan for a walled inn where their wares might lie under lock and their factors sleep under
      guard. He built them a *funduq* beside the silk market and chose the ground for it himself. The burghers
      were delighted, and the trade of Gharnāṭa and [Qurṭuba](place:qurtuba) ran more freely through its
      gates. In the winter Sayyida bore the sultan another daughter, [ʿĀʾisha](person:aisha-bint-yusuf).


      Then [Fās](place:fas) spoiled everything. On the tenth of Shaʿbān 761, with the friendship between the
      two courts at its warmest, the Marīnid sultan declared war on Gharnāṭa to demand its submission as his
      subject. [Tilimsān](place:tilimsan), Tāfīlālt and Tuwāt marched with him. The court could hardly believe
      it. The ambassadors had been feasted in Fās that very spring. But a sultan who sees two crowns exhausted
      and a third alone does not care what his ambassadors ate. By the reckoning of the dīwān that very day,
      Gharnāṭa had never been so wholly its own master, and Qashtāla's overlordship had shrunk to a word on
      parchment. Fās had chosen that day to demand that it become a subject. Qashtāla, as Gharnāṭa's overlord,
      came into the war to defend it. The bitterest men at court said that the great chance had been thrown
      away. Instead of striking at an exhausted Qashtāla, Gharnāṭa would spend its men holding off the
      Marīnids until Qashtāla recovered.


      The Marīnids found the shore of al-Andalus harder to hold than their fleet had promised. The first
      landing, two thousand men of Tilimsān at [al-Mariyya](place:al-mariyya), was thrown back into the sea by
      ten thousand Granadans on the twenty-sixth of Dhū al-Ḥijja. A week later, in the first days of 762, the
      sultan founded the Dīwān al-Mustakhlaṣ to keep his private domain, the estates, mills and revenues set
      apart from the public treasury to pay for the court and al-Ḥamrāʾ. It grew out of the harem's widening
      hand in the palace. The burghers liked it, and the nobles did not. At [Sharīsh](place:sharish), in
      Jumādā al-Ūlā 762, the Marīnids attacked an army four times their number and left fifteen hundred dead.
      Twice before [Ishbīliya](place:ishbiliyya) they broke themselves on the sultan's lines. Elsewhere they
      did as they pleased. They landed at [Qādis](place:qadis) and on the coast of [Walba](place:walba), and
      their horsemen rode through Qashtāla as far as El Escorial and Cáceres, breaking every Castilian army
      they met. Their fleets ruled the sea.


      So in the summer of 763 our lord sent a message to Fās, and it was not a plea. If Gharnāṭa threw its
      full weight into this war, he wrote, Fās would lose it. If Gharnāṭa stood aside, Fās would very likely
      beat Qashtāla. The young [Saʿd](person:saad-ibn-yusuf), fourteen that summer, sat at his father's side
      while the letter was drafted. He asked only how many men the Marīnids had lost on this shore. When he
      was told more than six thousand, he said that the number was the letter and the rest was courtesy. The
      Marīnids understood. On the seventh of Shawwāl they granted a white peace and promised to respect the
      lands of Gharnāṭa. Qashtāla was left to fight on alone. The ṭāʾifas of [Balansiyya](place:balansiyya)
      and Mursiyya had been kept out of the war entirely, and they would come untouched to the war that the
      court still meant to fight.


      Three weeks before the peace [Tizemt](person:tizemt-hafsid) had borne the sultan a daughter, and he had
      named her [Umm al-Fatḥ](person:umm-al-fath-bint-yusuf), the mother of victory. The court took the name
      for an omen.


      *So do not weaken and call for peace while you are superior; and Allāh is with you and will never
      deprive you of the reward of your deeds.*
