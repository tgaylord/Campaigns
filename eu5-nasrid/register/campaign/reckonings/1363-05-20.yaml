  The day the truce with Qashtāla ends, Granada holds its casus belli (the game's reclaim al-Andalus) and goes
  to war for its independence. Qashtāla is still at war with Morocco, which holds 58 of its towns as far as
  Toledo; Aragon has come in on Qashtāla's side against Morocco, and Portugal has made its peace with Fās.
  Shares of power are estimated from the 1 June 1349 reading.
