date: '1375-06-05'
title: The War of the Aragonese Restoration
source:
  save: SP_ADU_1375_06_05 (compressed)
  game: 1.4.6
summary: >-
  On 5 June 1375, the day the Castilian truce runs out, al-Andalus declares war on Castile under the
  Reconquest of Iberia claim, framed as the restoration of Aragon. With France pushing England into the sea,
  the Emperor will not wait for Rome to rally the French. A levy of gold and men on the nobles and the ṭāʾifas
  fills the treasury: 1,579 against 286 in March. Portugal and the Papal States join Castile; the Mamlūks and
  the four ṭāʾifas join al-Andalus. At the declaration al-Andalus has 3,300 regulars and 4 ships against
  Castile's 1,750 men, Portugal's 1,050 and Rome's 684; the Mamlūks have 3,930. Maryam has sat in the dīwān
  since 17 March. The game now ranks al-Andalus 13th among the powers. Shares of power are estimated from the
  1 June 1349 reading.
