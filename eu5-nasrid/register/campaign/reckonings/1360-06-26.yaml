  - id: 1360-06-26-marinid-war
    'on': '1360-06-26'
    kind: war
    what: >-
      The Marīnids declare war on Gharnāṭa itself, demanding its submission as their subject, with Tilimsān,
      Tāfīlālt and Tuwāt beside them. Qashtāla takes the field to defend its tributary, and Portugal with it.
      It comes a year before the court meant to seek the Marīnids' alliance for a war of independence, and
      with relations between the two courts at their warmest
    who:
