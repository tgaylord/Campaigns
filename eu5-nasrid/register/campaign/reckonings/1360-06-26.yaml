    kind: note
    what: >-
      The court's bitterness: Qashtāla and Portugal had bled in Arghūn (their losses reckoned at 10,000 and
      30,000) and lay open to a war of independence. Instead Gharnāṭa must spend its own men throwing back the
      Marīnids until Qashtāla can send its levies south
