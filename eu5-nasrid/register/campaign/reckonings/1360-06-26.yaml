beats:
  - id: 1359-ismail-to-aydin
    'on': '1359-03-20'
    kind: marriage
    what: >-
      Ismāʿīl ibn Ismāʿīl, the amir's brother and his minister, marries his Aydınid bride and goes to live at
      her father's court in Anatolia. After Faraj, it is the second brother of the amir to leave Gharnāṭa by
      marriage, and the court whispers that the harem prefers the throne to have no grown brothers about it
    who:
      - ismail-ibn-ismail
      - yusuf-i
    threads:
      - house
    from:
      - told
    cite: >-
      Trent's account (about March 1359); the harem as the cause is the chronicle's reading, at Trent's
      direction
    detail:
      with: AYD
      betrothed: '1354-03-16'
      residence: Aydın
      cabinetSeatVacated: true
  - id: 1359-04-khalid-council
    'on': '1359-04-02'
    kind: office
    what: >-
      Ismāʿīl's empty seat in the dīwān goes to Khālid Raḥḥū, son of the late general Yaḥyā Raḥḥū and of
      Qamar, at sixteen, to promote Andalusī culture in the new lands. The amir would have given it to
      Sayyida, his first wife, but it was not to be
    who:
      - khalid-ibn-yahya
      - sayyida-of-fezzan
    from:
      - save
      - told
    cite: save of 26 June 1360 (cabinet action since 2 April 1359); Trent's account
    detail:
      replaces: ismail-ibn-ismail
      action: promote_culture
  - id: 1359-07-01-funduq
    'on': '1359-07-01'
    kind: realm
    what: >-
      The New Caravanserai: at the merchants' pressing, above all the Italians who carry the better part of
      the realm's trade, the amir has a funduq built beside the silk market, a walled inn where wares are kept
      under lock and traders lodged under guard. The burghers are delighted, and the trade of Gharnāṭa and
      Qurṭuba flows more freely
    who:
      - yusuf-i
    where:
      - malaqa
      - gharnata
      - qurtuba
    threads:
      - towns
    from:
      - seen
    cite: Trent's screenshot of the event, with the option's tooltip open
    detail:
      event: The New Caravanserai
      choice: Build it, and let the trade flow through our gates.
      cost: 44.4
