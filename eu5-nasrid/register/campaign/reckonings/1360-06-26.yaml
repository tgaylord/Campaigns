date: '1360-06-26'
title: The Marīnids demand submission
source:
  save: SP_GRA_1360_06_26 (compressed)
  game: 1.4.5
summary: >-
  Morocco declares war on Granada itself, under the Strait's casus belli to demand Andalusī submission, with
  Tlemcen, Tafilalt and Touat beside it; Qashtāla defends its tributary and Portugal comes in with Qashtāla,
  though Qashtāla has almost no men left after its war in Arghūn. Granadan sovereignty stands at 100. Khālid
  Raḥḥū sits in the dīwān. Shares of power are estimated from the 1 June 1349 reading.
