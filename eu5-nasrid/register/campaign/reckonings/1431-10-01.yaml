title: The Second Crusade
source:
  save: SP_ADU_1431_10_01 (compressed)
  game: 1.4.7
summary: >-
  The day the Pope proclaims the second crusade against al-Andalus, sparked by the destruction of Santiago,
  and declares war on the Ṭāʾifa of Aragon. Every ally answers: eight ṭāʾifas, the Mamlūks, Morocco and Tunis.
  The Emperor has embraced the name of warmonger that his enemies gave him in June. Stability has recovered to
  4 and prestige to 82; the courts of the world still rank al-Andalus third. Treasury 784. Estates estimated
  from the reading of 16 November 1428.
