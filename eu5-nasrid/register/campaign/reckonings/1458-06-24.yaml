tellings:
  - id: 0862-07-12-of-the-western-ocean
    'on': '1458-05-26'
    title: Of the Western Ocean
    book: book-of-the-franks
    verse: '10:22'
    who:
      - abd-al-jalil-al-qubbasi
      - ismail-ibn-muhammad-ibn-ismail
      - burhan-al-din-al-abidin
      - ahmad-ibn-muhammad-ibn-ismail
    where:
      - ishbiliyya
    covers:
      - 1457-04-03-the-new-army-laws
      - 1457-07-04-the-voyage-into-the-western-ocean
      - 1457-10-29-the-crew-wants-to-turn-back
      - 1458-01-01-word-of-the-gold-island
