    text: |
      In the spring of 861 the Emperor made ready for war, though no one had declared one. The Angevin's league had grown to eight, and the dīwān no longer laughed at it. On 8 Jumādā al-Ūlā the laws of the levy were widened, the offices of the bureaucracy brought under one hand at [Ishbīliya](place:ishbiliyya), and the hiring of foreign swords cut back. Over the year that followed the army went from thirteen regiments to forty-two, and the armouries worked through the nights. [Aḥmad](person:ahmad-ibn-muhammad-ibn-ismail) paid for it.

      In the same season the court sent [ʿAbd al-Jalīl](person:abd-al-jalil-al-qubbasi) al-Qubbasī west. He was forty-one, the oldest of the pilots still at sea, and the first of them to have seen the Cape. Young Burhān had been carried west against his will the year before and not come back. ʿAbd al-Jalīl meant to go on purpose. He left Šanta Maryat in the Algarve on 11 Shaʿbān 861 with four ships, put in at Fuerteventura, and turned his bows into the empty ocean.

      For three months there was nothing. There was weed, so thick in places that it held the hulls back, and the old hands swore it meant shallows; he hove to and sounded, and found none. There was an old chart someone had brought aboard, showing Antillia, the island of seven cities, which the Christians said their bishops had founded when they fled the armies of the Umayyads. He laid his course by it. Nobody aboard missed the joke. On 10 Dhū al-Ḥijja the bread was green, the water stank, three men had fever, and the crews came to him together and said they were turning east, with his leave or without it. He asked for three days and promised every man a share of whatever they found. They gave him the three days, and then more.

      On 14 Ṣafar 862 the wind died. The sails hung, the sea lay like glass, and the men said they had sailed off the edge of the world's winds. ʿAbd al-Jalīl put the boats out and had the ships towed by oars. That same day, though he could not know it, another Andalusī ship came home to the Algarve from the west. Its crew told of a small island across the ocean, and of people there who wore gold and spoke no tongue anyone knew. Some said it was the Indies. Some said it was not.

      On 4 Rabīʿ al-Thānī, just before dawn, a cry came from the masthead, then another, and then every man on deck was shouting. There were trees, a shore, green hills, and water gone from blue to green to turquoise, and birds no one could name. ʿAbd al-Jalīl stood at the bow and said nothing for a long time. Then he went ashore and planted the flag. Whatever this place was, he said, it belonged to al-Andalus. The people of the island wore gold, and when the interpreters asked where it came from they pointed inland and to the south. The interpreters could not agree on what they meant, and ʿAbd al-Jalīl had the pilots write it all down, the contradictions with it.

      He came home on 12 Rajab, with salt on the hulls and the men thin from eating stores that had rotted in the heat. His account was read aloud before the Emperor. Some of the court believed none of it. [Ismāʿīl](person:ismail-ibn-muhammad-ibn-ismail) had it copied into the dīwān's books as it stood, and the map-makers began, carefully, to draw on the western edge of their charts, where until then there had been nothing. By the end of Shaʿbān the first settlers were on their way across the ocean, to Havana and Bayamo and three other places on the great island the people there called Cuba, and to the Bahamas.

      *It is He who enables you to travel on land and sea until, when you are in the ships and they sail with them by a good wind and they rejoice therein, there comes a storm wind and the waves come upon them from everywhere and they assume that they are surrounded, supplicating God, sincere to Him in religion, "If You should save us from this, we will surely be among the thankful."*
    behind: |
      **What the save and the screens show.** This note draws on the saves of 2 January 1457 and 24 June 1458, and on Trent's screens of the voyage from July 1457 to May 1458.
      - *The voyage:* the expedition "Voyage into the Western Ocean", led by ʿAbd al-Jalīl, began 4 July 1457 from Faro and ended 26 May 1458. The screens show each event and the choice made: sound the depths in the weed; chart the course by Antillia (the legend of the seven bishops who fled the Umayyad conquest is the game's and real history's); promise three more days and a share; tow the ships when becalmed; plant the flag; note the islanders' directions with contradictions included; ration the rotten stores; let the account stand as written. Four ships throughout.
      - *The first word of the island:* the "Discovery of a New World" screen of 1 January 1458 says one of our expeditions returned having met islanders wearing gold. It doesn't name the explorer. Burhān now has the treasure-hunter trait, so the record leans to him; this is a guess.
      - *Settlement:* colonial efforts at Havana, Morón, Camagüey, Bayamo and Baracoa (Cuba) and in the Bahamas, each about three months old in June 1458. Bonny (since late 1454) and Kabinda (since 1456) in Africa are older.
      - *The army:* expanded levies, centralised bureaucracy and restricted mercenaries from 3 April 1457; shipwright standard from 16 June 1458. Regiments 13 to 42; manpower 31,800 to 20,700; armouries +16; ships 131 to 144.
      - *Also:* the Galician war is gone from the save. Saʿd ibn Yūsuf died 10 May 1458 in a hunting accident. The Emperor led a Hajj caravan from 16 September 1454 (a regency began that day) that failed on 23 February 1455. Stability fell from 25.7 to 16.3; the save doesn't say why.

      **From Trent's account.** On 15 March 1457 the tension with the Angevins spurred change at court; the crown raised a much larger force, nearly doubling the land army, with the fleet to follow. On 4 July 1457 another voyage west, four ships. On 24 June 1458 further expeditions and colonisation efforts are starting.

      **Invented colour.**
      - Aḥmad paying for the army, the armouries working at night, the dīwān no longer laughing.
      - ʿAbd al-Jalīl's age as "the oldest of the pilots still at sea"; "Nobody aboard missed the joke."
      - The other ship coming home to the Algarve on the same day. The screen says only that it returned to al-Andalus.
      - The islanders' name for Cuba.
      - The court's reactions to the account beyond the screen's "some doubt most of what is said".
questions:
  - Stability fell from 25.7 to 16.3 between January 1457 and June 1458. What drove it?
  - Which explorer brought home the first word of the gold island on 1 January 1458? Burhān?
  - The save shows the Emperor leading a Hajj caravan in 1454–55 that failed. Do you remember what happened?
