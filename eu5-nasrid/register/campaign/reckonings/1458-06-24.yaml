date: '1458-06-24'
title: The Western Ocean
summary: >-
  From a save, Trent's screens and his account. ʿAbd al-Jalīl al-Qubbasī sailed west from the Algarve in July
  1457 with four ships, faced down a crew that wanted to turn back, was becalmed, towed his ships by oar, and
  in February 1458 made land beyond the ocean. Another expedition had come home on 1 January with word of an
  island of people wearing gold. By June settlers were going out to Cuba and the Bahamas. At home the crown
  nearly tripled its army, from 13 regiments to 42, under new laws of levy and a centralised bureaucracy, while
  the Grand Alliance looked on. The Galician nobles' war is over. Stability fell from 25.7 to 16.3.
