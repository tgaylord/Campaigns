tellings:
  - id: 0839-10-14-of-the-arsenals-finished-and-the-turn-to-the-sea
    'on': '1436-05-01'
    title: Of the Arsenals Finished, and the Turn to the Sea
    book: book-of-the-encircling-sea
    verse: 55:19-20
    who:
      - muhammad-ibn-ismail-ibn-saad
      - berenguer-ramon-de-montsoriu
      - francesc-de-montsoriu
      - vukmir-jankovic
      - abd-al-jalil-al-qbasai
      - raimundo-coimbra
    where:
      - ishbiliyya
      - malaqa
      - al-mariyya
      - al-ushbuna
      - balansiyya
      - mursiyya
    covers:
      - 1435-10-10-the-turn-to-the-sea
      - 1432-08-30-death-of-berenguer-ramon
      - 1435-04-09-death-of-vukmir
      - 1433-03-19-the-emperor-leaves-the-admiralty
      - 1436-05-01-the-two-explorers
      - 1432-05-the-dar-al-sinaa
    text: >
      The crusade ended, and the arsenals went on rising. Two years after the Emperor
      [Muḥammad](person:muhammad-ibn-ismail-ibn-saad) had signed the orders, all seven were finished, at
      [Ishbīliya](place:ishbiliyya), [Mālaqa](place:malaqa), [al-Mariyya](place:al-mariyya),
      [al-Ushbūna](place:al-ushbuna), [Balansiyya](place:balansiyya), Cartagena and
      [Mursiyya](place:mursiyya). Their first work was already at sea: eight war galleys of a new Andalusī
      pattern, long, low and fast under oar, the first warships of the empire not copied from the Christians.
      They sailed beside the fifty caravels the fleet already had. A new guild of naval chandlers was licensed
      at Cáceres, far inland, to send pitch and cordage down the river roads to the ports, and the treasurers,
      who had complained of every arsenal, found that the realm took in ninety dīnārs a month more than it
      spent.


      The Emperor had given up the admiral's command before his pilgrimage, but he had not given up the sea,
      and he did not let the realm give it up either. He gave the arsenals' masters seats at his audiences. He
      gave his prizes for poetry to poems about ships. He sent the sons of the umarāʾ to serve a season with
      the fleet before he would give them a command on land. In the three years after the crusade the court's
      talk, and the talk of the cities, turned further from the land to the sea than in all the reign of his
      father. The young men of Lisbon and the Algarve wanted to be pilots. The merchants of Ishbīliya wanted
      ships of their own. In Mālaqa the ʿulamāʾ were heard to preach that al-Andalus lay between two seas as
      the believer lies between fear and hope, and that it would live by both.


      The sea took its price. [Berenguer Ramon](person:berenguer-ramon-de-montsoriu) of Catalonia, who had
      beaten the Mecklenburgers off Cape Mondego, was lost at sea two months later, in Muḥarram 836, and his
      son [Francesc](person:francesc-de-montsoriu) took his seat in Barshalūna. Less than three years later
      the sea took the crusaders' admiral [Vukmir Janković](person:vukmir-jankovic) too, and the captains of
      Ishbīliya drank to him in their own fashion, with sherbet.


      By Shawwāl 839 the Emperor's ships were reaching further than they had ever gone. A new town of the
      crown had been planted at Ipalán on La Gomera in the Canaries, and an expedition was fitting out at
      Ishbīliya for the open Ocean. Two men of al-Ushbūna led the work. [ʿAbd al-Jalīl
      al-Qbasī](person:abd-al-jalil-al-qbasai) was an Andalusī of nineteen, a born soldier with the explorer's
      eye. Dom [Raimundo Coimbra](person:raimundo-coimbra) was a Portuguese Muslim of twenty-six, and in that
      month he was somewhere out on the high sea of the eastern Ocean, beyond sight of any land, toward the
      waters where the pilots of Flores had said that the sun set over nothing at all.


      *He released the two seas, meeting side by side; between them is a barrier which neither of them
      transgresses. So which of the favours of your Lord would you deny? From both of them emerge pearl and
      coral.*
    behind: >-
      This note covers three entries: the pilgrimage and the Shaykh al-Islām, the turn to the sea, and
      Barshalūna and the hegemony.


      **What the save of 10 October 1435 shows.**

      - The seven arsenals are complete.

      - The fleet is 50 caravels and 8 of the mod's Andalusī war galleys.

      - There's a new naval supplies guild at Cáceres, and a sea exploration is being prepared at Seville.

      - Hipalan in the Canaries is a new crown town. The game's Canary province lists it beside Aguere and
      Tedote, and the chronicle places it at Ipalán on La Gomera.

      - The realm's land-versus-naval value moved from −26.4 (July 1432) to −10.2. Negative means land, so the
      realm moved toward the sea, as Trent describes. The entry shows that shift as the court's and the
      cities' talk turning to the sea.


      **The Emperor and the court, from the same save.**

      - The Emperor's admiral role ended on 19 March 1433.

      - His hajji modifier dates from 23 November 1433, which the entry takes as his return from the
      pilgrimage of Dhū al-Ḥijja 836.

      - His Ṣūfī modifier from 27 September 1434 confirms the Ṣūfī Shaykh al-Islām.

      - He has been regent of Burghush since 21 January 1431.

      - The deaths come from the same save. The game gives Abū Ḥammū's death as a suicide; the chronicle tells
      the court's version.


      **From Trent's account, with no save yet.** The annexation of Catalonia (1 June 1436), the explorers (1
      May 1436), the Age of Discovery and the Cultural Hegemon title (1 January 1437), and the New World
      institution appearing in Ishbīliya (screenshot of 1 March 1437).


      **Invented colour.**

      - *Pilgrimage entry:* the fever of the chest, the sea route and Jyral receiving the Emperor, the news of
      Temür reaching the pilgrims, the welcome at the river, the Ṣūfīs at ʿArafa, the ʿulamāʾ's expectations,
      and the brotherhoods' prayers.

      - *Sea entry:* the galleys' look, the Cáceres guild's river roads, the Emperor's patronage of masters,
      poets and young nobles, the pilots and merchants, the sermon at Mālaqa, and the sherbet.

      - *Hegemony entry:* the scholars' stocktaking, the books, gardens and masons abroad, the tax-collector,
      the Emperor's reading habits, and the life of the city in the New World paragraph (its pilots, funduqs,
      shares and scholars).


      **The admiral prince entry (save of 16 January 1438).** Yūsuf's birth, education, traits and three wives
      come from the save, and their fathers identify them. Amie is Mansa Tiramakhan's daughter. Fāṭima is the
      daughter of Yūsuf ibn Ismāʿīl of Banbalūna. Muʾmina is the daughter of Muṣliḥ al-Dīn, a Naṣrid courtier.
      The admiralty is Trent's account; the save doesn't list the role yet. Also from the save:

      - the land-versus-naval value crossed to +1.1;

      - protected harbours are under construction in five Catalan ports;

      - Burghush's regency ended on 11 June 1437;

      - Bernarda died on 6 November 1437.


      Invented colour: the Emperor's lessons at sea, his reason for the appointment, Amie's journey and dowry,
      and the court reading the marriages as a map.


      **The charter of Majrīṭ (8 April 1438).** This is Trent's account, with no save yet. The Emperor's words
      are Trent's. The Land Rights terms come from Trent's screenshot of the privilege. Invented colour:
      Majrīṭ's trades, the burghers' journey, the northern umarāʾ's stake in the market, the clerks' name for
      the stipend, and the princes' winter of reckoning.


      **The scholar Emperor (15 July 1439).** The Scholar trait and the state of the realm come from Trent's
      screenshot: stability −6, Majrīṭ's city rights still in progress, and the crown appeasing the estates.
      That stability fell because of the land-rights concession is an inference from Trent's account, not
      something the game states. The save dates the trait to 15 July 1439 itself, so the entry has his reading
      begin in 842 AH (from June 1438), after the hegemony entry's line that he had never read for pleasure;
      earlier wording that set it in the years after the pilgrimage was corrected. Invented colour: what the
      Emperor read and whom he questioned, his seat at the back of the lectures, his sayings, and the
      comparison with the risings of 807.


      **The trade war (early June 1440).** The Catalan privileges complaint, the Genoese embargo under Angevin
      pressure, and the Andalusī embargo of Angevin merchants are Trent's account, with no save yet. The
      markets' ranks come from Trent's screenshot of 1 March 1437. Invented colour: the Catalan houses'
      consuls and courts, the dīwān's reasoning, London leaning on Genoa "all spring", Prince Yūsuf enforcing
      the embargo, the merchants' arguments, the Venetians, and the monthly accounting.


      **The Jamāʿa of 846 (1 June 1442).** The reform, the burghers' seat and the two privileges are from
      Trent's account and screenshots. The satisfaction changes on the privilege tooltips are previews taken
      before each grant. The Emperor's line about city walls echoes the Urban Development Grants text.
      Invented colour: the Emperor's reading of Rome and Baghdad, his words to the princes, the estates'
      particular complaints, and the princes' private reaction.


      **The princes' mending and the Golden Century (save of 11 June 1442; screenshots of 7 August 1442).**

      - The save shows the nobles' Land Rights gone and the two burgher privileges in place. It has the
      National Assemblies advance, but the reform doesn't yet appear among the implemented reforms.

      - Also in the save: estate satisfaction (burghers 74, umarāʾ 32, commoners 34, ʿulamāʾ 44, dhimmī 45),
      legitimacy 65, and the land-versus-naval value at +26.3.

      - The princes' rallying of the commoners and their promise to the ʿulamāʾ are Trent's account.

      - The Golden Century wording follows the game's event text.

      - The Thalassocracy decision was open on 7 August, but the screenshot doesn't show whether it was taken.

      - Invented colour: the princes' ride to the villages, the ʿulamāʾ's grumbling, the shipyards' speed, the
      readings in the mosques, the secretaries' warning (it paraphrases the Grand Alliance rules), and the
      Emperor's reply.

      - The Jamāʿa entry moved from Book VI into Book VIII, the Golden Century, which opens with it.


      **The Jamāʿa of 847 (26 June 1443).** This is Trent's account: a noble agenda to expand colonization,
      the burghers' support, and Fernando Po as the target. Invented colour: the lords' motives, the vote
      before noon, the island's description beyond its mountain and people, and the princes' and the Emperor's
      reactions.


      **The Radiant City and the Thalassocracy (Trent).** The restoration of Madīnat al-Zahrāʾ (event of 1
      October 1440, "They will see our prestige!", 117 gold) and the Thalassocracy, taken on the same day as
      the Golden Century, are confirmed by Trent. The building takes 365 days, so the chronicle has it
      standing by the autumn of 1441. The history of the caliphal city is drawn from the historical record.
      Invented colour: the sheepfold, the Emperor's day among the ruins, his answer to the dīwān, paying from
      his own purse, the merchants' cheap cloth, and the court's two symbols.
  - id: 0840-08-22-of-barshaluna-returned-the-hegemony-of-letters-and-the-new-world
    'on': '1437-03-01'
    title: Of Barshalūna Returned to the Crown, the Hegemony of Letters, and the New World
    book: book-of-the-call
    verse: 2:143
    who:
      - muhammad-ibn-ismail-ibn-saad
      - francesc-de-montsoriu
      - ismail-ibn-saad
    where:
      - barshaluna
      - ishbiliyya
      - qurtuba
    covers:
      - 1436-06-01-catalonia-annexed
      - 1437-01-01-the-age-of-discovery
      - 1437-01-01-cultural-hegemon
      - 1437-03-01-the-new-world-institution
      - 1428-12-01-catalonia-to-the-crown
    text: >
      The Emperor [Ismāʿīl](person:ismail-ibn-saad) had told the dīwān that Catalonia must come into the crown
      within nine years, and he had not lived to see it. His son did it within eight. On 16 Dhū al-Qaʿda 839
      (1 June 1436) the Ṭāʾifa of Catalonia was annexed, a year before the court had expected, and
      [Barshalūna](place:barshaluna), the great port on the English border, was ruled from
      [Ishbīliya](place:ishbiliyya) for the first time. Its lord [Francesc](person:francesc-de-montsoriu), son
      of the Berenguer Ramon who had died at sea, was a Muslim and a grandson of the house of Naṣr through his
      grandmother. He gave up his throne without a war. The Catalans had been accepted at court for thirteen
      years, and the merchants of Barshalūna had been trading under the Emperor's peace for sixty. Most of
      them found that very little changed except the address of the tax-collector.


      At the turn of the year 840 the scholars of the court took stock, as they did at the end of every age.
      They agreed that the age of the rebirth of learning, which the Franks had called the Renaissance, was
      over, and that a new age had begun, the age of the discovery of the world. The ships of al-Andalus were
      already in it. They also agreed, more quietly, on something that would not have been believed in
      [Qurṭuba](place:qurtuba) a hundred years before. The learning, the poetry, the music, the buildings and
      the manners of al-Andalus were once more what the rest of the world imitated. The books copied in the
      madrasas of Ishbīliya were read in Cairo and Fās and, in translation, in Paris and Bologna. The courts
      of Christendom built their gardens with Andalusī water and hired Andalusī masons. In the chanceries of
      the world al-Andalus was named the first of all realms in culture.


      Two months later the new age found its name in Ishbīliya itself. No one had yet found land beyond the
      Ocean. But the city was full of men who meant to: pilots home from the Azores and the Green Cape arguing
      over charts in the funduqs by the river, merchants buying shares in voyages that had not yet sailed,
      scholars of the madrasas asking what the ancients had meant by the Isles of the Blessed, and the crown
      paying for all of it. By Shaʿbān 840 the scholars of other realms had begun to call it a new way of
      thinking about the world, and to say that it had been born on the banks of the Wādī al-Kabīr. Perhaps
      the captains would find something out there.


      The old men of the court said that it was the age of the caliphs come again. The Emperor
      [Muḥammad](person:muhammad-ibn-ismail-ibn-saad), who had never read a book for pleasure in his life,
      accepted the compliment on behalf of his grandfather, his father and the madrasas they had built in
      every town, and went back to his ships.


      *And thus We have made you a middle nation, that you will be witnesses over the people, and the
      Messenger will be a witness over you.*
  - id: 0841-07-19-of-the-admiral-prince-and-his-three-wives
    'on': '1438-01-16'
    title: Of the Admiral Prince, and His Three Wives
    book: book-of-the-encircling-sea
    verse: 6:165
    who:
