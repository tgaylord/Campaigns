    covers:
      - 1438-01-16-the-admiral-prince
      - 1438-01-16-the-realm-turns-to-the-sea
      - 1437-06-11-khalid-comes-of-age
      - 1437-11-06-death-of-bernarda
    text: >
      The Emperor [Muḥammad](person:muhammad-ibn-ismail-ibn-saad) had been twenty-five, and judged unfit to
      rule by everyone who knew him, when he was given the fleet. He had never forgotten what it had done for
      him. The court had called him slow; the captains had called him admiral. He had learned the names of
      harbour-masters, the price of pitch and the turn of the winds off Cape Saint Vincent, and he had come
      back from the sea a man who could win a battle at the mouth of the Duero. In the winter of 841 he did
      for his grandson what had been done for him.


      [Yūsuf](person:yusuf-ibn-ismail-ibn-muhammad) was the eldest son of the heir
      [Ismāʿīl](person:ismail-ibn-muhammad-ibn-ismail), by Tella of the house of Fās, and second in line to
      the throne after his father. He was sixteen. He had been born at [Gharnāṭa](place:gharnata) and given
      the most expensive schooling the realm could buy, and his tutors had called him shrewd before he could
      ride. He was not slow, and he had not been judged unfit by anyone. The Emperor made him admiral of the
      fleet anyway, because, he said, a prince who had never been to sea did not know what his empire was made
      of.


      Yūsuf had already married three wives, and the court read them as a map of the realm his grandfather
      meant him to rule. The first was [Amie](person:amie-of-mali), a daughter of Mansa
      [Tiramakhan](person:tiramakhan-mali) of Mālī, who had come north by the sea road to Ishbīliya with a
      dowry the treasurers spoke of for a month. The second was [Fāṭima](person:fatima-bint-yusuf-ibn-ismail),
      daughter of the late [Yūsuf ibn Ismāʿīl](person:yusuf-ibn-ismail), lord of [Banbalūna](place:banbaluna),
      so that the heir's heir was bound by marriage to the ṭāʾifas of the north at the moment the Emperor was
      demanding more of them. The third was [Muʾmina](person:mumina-bint-muslih-al-din), daughter of Muṣliḥ
      al-Dīn, a Naṣrid of the court, so that Ishbīliya would not feel left out. The gold country, the frontier
      and the palace now shared a household.


      The realm the young admiral would sail for had changed again. [Barshalūna](place:barshaluna) and all of
      Catalonia had come into the crown, and the Emperor was building protected harbours at Barcelona, Girona,
      Tarragona, Tortosa and Perpignan. For the first time in the memory of the court, the temper of
      al-Andalus leaned more to the sea than to the land. In Burghush the boy
      [Khālid](person:khalid-ibn-abi-hammu) had come of age and taken back his ṭāʾifa from the Emperor's
      regency. And on 7 Jumādā al-Ūlā 841 the Emperor's mother [Bernarda](person:bernarda-of-murcia) died at
      seventy. She had been born an heiress of Mursiyya, Castilian in speech, and raised at the court of
      Qashtāla, she had been the wife of one Emperor and the mother of another, and she had lived to see
      Qashtāla vanish from the map.


      *It is He who has made you successors upon the earth and has raised some of you above others in degrees,
      that He may try you through what He has given you.*
