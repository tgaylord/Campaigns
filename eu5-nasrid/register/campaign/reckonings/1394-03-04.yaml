  - id: 1380-gharnata-historical-capital
    'on': '1380-05-03'
    kind: note
    what: >-
      Gharnāṭa keeps the honours of a capital. The old seat of the house of Naṣr is recognised as the realm's
      historical capital, and the court of al-Ḥamrāʾ keeps its full weight: the fortress its strength, the
      crown its power, the realm its culture and legitimacy
