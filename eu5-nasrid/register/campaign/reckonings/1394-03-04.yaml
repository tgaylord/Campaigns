          fortDefense: +10% at Granada
          crownPower: +5%
          culturalInfluence: +5%
          monthlyLegitimacy: '+0.025'
        condition: counts_as_capital (capital or historical capital)
      ooc: >-
        The game recorded no historical capital when the capital moved to Seville in November 1379 (likely
        because of the Al-Andalus formation), which left al-Ḥamrāʾ inactive. Trent restored it from the
        console on 3 May 1380 with set_capital to Granada and straight back to Seville; the save of 3 May 1380
        shows historical_capitals={2894}.
