tellings:
  - id: 0785-02-26-of-the-kingdom-of-tulaytula
    'on': '1383-04-30'
    title: Of the Deaths of Sayyida and Abū ʿInān, and the So-Called Kingdom of Ṭulayṭula
    verse: 3:139
    who:
      - saad-ibn-yusuf
      - sayyida-of-fezzan
      - yusuf-i
      - abu-inan-faris
      - abu-al-fadl-marinid
      - jadila-bint-yusuf
      - dua-marinid
      - ismail-ibn-yusuf
      - aiman-mamluk
    where:
      - gharnata
      - fas
      - tulaytula
      - jayyan
      - mursiyya
      - ishbiliyya
    covers:
      - 1380-11-19-death-of-sayyida
      - 1381-10-07-death-of-abu-inan
      - 1382-12-01-revolt-of-tulaytula
      - 1382-12-01-ismail-to-the-diwan
      - 1383-02-22-battle-munt-shaqir
      - 1383-04-30-battle-jaen
      - 1383-04-30-revolt-crushed
    text: >
      In Shaʿbān 782 the Emperor's mother died. [Sayyida](person:sayyida-of-fezzan), daughter of the lords of
      Fezzan, had been betrothed to [Yūsuf](person:yusuf-i) at nine years old. She came to
      [Gharnāṭa](place:gharnata) across the desert and the sea and outlived her husband by seventeen years.
      She sat in her son's dīwān through the worst of his wars and lived to see him proclaimed Emperor. She
      was fifty-two. The court mourned her as a mother of the dynasty. Her son mourned her as his mother, and
      for some weeks he would see no one. [Duʿāʾ](person:dua-marinid) and [Aiman](person:aiman-mamluk) walked
      behind the bier, in the order of their marriages, which put the Mamlūk first. The harem said that
      Sayyida would have approved of the order, and that it was the one thing the three women had ever agreed
      on: the house came first.


      A year later news came from [Fās](place:fas) that [Abū ʿInān Fāris](person:abu-inan-faris) was dead. He
      had ruled the Marīnids for thirty-six years and twice made war on the house of Naṣr to bring it to heel,
      and twice failed. His son [Abū al-Faḍl](person:abu-al-fadl-marinid) took the throne, and with him the
      Emperor's sister [Jadīla](person:jadila-bint-yusuf) became queen of the Marīnids. The alliance
      [Duʿāʾ](person:dua-marinid) had argued for was now a family matter on both sides of the Strait.


      The peace held for four years and then broke from inside. On 24 Ramaḍān 784, as the city kept the last
      nights of the fast, [Ṭulayṭula](place:tulaytula) rose. The Castilians of the old Visigothic capital
      drove the Emperor's governor out of the city and wrecked the madrasa the crown had built in its heart.
      They proclaimed a Kingdom of Ṭulayṭula, and the country followed them. Fifty-eight towns went over: the
      Middle March and La Mancha, the hills of Extremadura, and even the lands of [Mursiyya](place:mursiyya)
      and [Jayyān](place:jayyan), Ubbadha and Bayyāsa, and the coast of Walba. Half a million souls were in
      revolt, most of them Castilians and three in four of them Christians. The rebels raised nearly six
      thousand men, most of them peasant levies, against the Emperor's thirty-seven hundred regulars. The
      court called it another so-called kingdom, as it had called the rising of [Ishbīliya](place:ishbiliyya)
      thirty years before. It was no small matter.


      The Emperor's younger brother [Ismāʿīl](person:ismail-ibn-yusuf), twenty-eight, took their mother's
      empty seat in the dīwān as the revolt began. The Emperor took the field. The rebels came to him in Dhū
      al-Ḥijja, at Munt Shāqir in the hills above the Guadiana, four thousand nine hundred against his ten
      thousand six hundred, and he broke them there. It was the only real battle of the revolt. The rest was a
      hunt. On 26 Ṣafar 785 the Emperor caught the last rebel host, one thousand eight hundred and seven men,
      outside the walls of Jayyān, and destroyed it to the last man. Forty-four of his own fell. The rebels'
      kingdom had lasted five months.


      The towns came back to their obedience one by one. The governor went back to Ṭulayṭula, and the masons
      went back to the madrasa. The Emperor, with the realm secure for the first time in ten years, began to
      plan the pilgrimage he had put off since 774.


      *So do not weaken and do not grieve, and you will be superior if you are believers.*
  - id: 0787-12-04-of-the-pilgrimage-that-came-too-late
    'on': '1386-01-06'
    title: Of the County of Teruel, and the Pilgrimage That Came Too Late
    verse: 2:286
    who:
      - saad-ibn-yusuf
      - alfons-de-borja
      - ismail-ibn-saad
      - dua-marinid
      - aiman-mamluk
      - bolot-mamluk
    where:
      - ishbiliyya
    covers:
      - 1383-04-30-hajj-planned
      - 1385-05-03-county-of-teruel
      - 1385-08-23-teruel-crushed
      - 1385-08-23-the-emperor-departs-on-hajj
      - 1385-10-28-al-qahira
      - 1386-01-06-the-season-passed
      - 1386-jamaa-theological-seminaries
    text: >
      The pilgrimage was put off once more. In Rabīʿ al-Awwal 787 the lords of the Aragonese uplands rose
      against King [Alfons](person:alfons-de-borja) of the renewed Arghūn, and proclaimed a County of Teruel
      in the inner country of his kingdom. It was a small rising, but it was a rising in a ṭāʾifa the Emperor
      had made and promised to protect, and he would not leave for Makka with it unsettled. It took the
      summer. On 16 Rajab 787 the County of Teruel was crushed and its towns returned to King Alfons. That
      same day the Emperor's caravan left [Ishbīliya](place:ishbiliyya) for the east.


      It was as fine as the caravan his father had led thirty-four years before. There were camels and horses
      and the scholars of the court, gifts for the sharīf of Makka, and alms for the poor of the two holy
      cities. The crown prince [Ismāʿīl](person:ismail-ibn-saad), nineteen years old, ruled as regent in his
      father's absence. He ruled well, by the dīwān's account. He had a gift for sending a minister away from
      an audience sure that the prince agreed with him, whatever the prince meant to do. That gift did not
      serve him in the harem. His mother [Duʿāʾ](person:dua-marinid) and the Emperor's first wife
      [Aiman](person:aiman-mamluk) had been rivals since the princes were children, and with the Emperor gone
      they quarrelled openly. They argued over precedence and households, and over whose son the court should
      look to. The regent learned that it was easier to govern an empire than to keep peace between two women
      who had each borne the Emperor a son.


      In Ramaḍān the caravan reached al-Qāhira, the city of a thousand minarets, which swallows a caravan the
      moment it passes the northern gate. Above the noise and spice and roasting meat rose the mosque of
      al-Azhar, whose scholars were counted among the finest in the Muslim world. The Emperor lingered. He sat
      with them for a month, and he held long talks with his brother-in-law the sultan
      [Būlād](person:bolot-mamluk) about the fleet, the Maghrib and the Christians of the north. He said
      afterwards that it was the best month of his reign. Then he pushed on for Makka.


      He came too late. When the caravan reached the holy city, the standing at ʿArafāt had passed: the hours
      between noon and sunset when every pilgrim of the season stands together on the plain beneath the Mount
      of Mercy, praying and asking forgiveness. A saying of the Prophet holds that the Ḥajj is nothing more or
      less than that single afternoon, and no rite performed afterwards can complete the pilgrimage. The
      Emperor heard the news in silence. Then he gave the order the caravan dreaded: they had tarried too
      long, and it must all be done again. The caravan broke up and turned for home.


      But misfortune turned to fortune on the road back. The scholars the Emperor had sat with in al-Qāhira
      had taken his measure as he had taken theirs. When he offered them halls, stipends and students in
      Ishbīliya, many of them came west with him. The Jamāʿa had to be persuaded to pay for them. The ʿulamāʾ
      backed the measure warmly, since it was their own order the Emperor proposed to enlarge, and the
      assembly voted to sponsor theological seminaries across the realm for ten years. A pilgrimage that never
      reached ʿArafāt had brought al-Azhar to Ishbīliya.


      *Allāh does not charge a soul except with that within its capacity.*
  - id: 0791-08-15-of-the-hijaba-the-hisba-and-the-death-of-dua
    'on': '1389-08-09'
    title: Of the Ḥijāba and the Ḥisba, and the Death of Duʿāʾ
    verse: 89:27-28
    who:
      - saad-ibn-yusuf
      - ismail-ibn-saad
      - bernarda-of-murcia
      - dua-marinid
      - maryam-bint-yusuf
      - ismail-ibn-yusuf
      - aiman-mamluk
    where:
      - ishbiliyya
      - qurtuba
    covers:
      - 1387-01-22-the-hijaba
      - 1387-01-22-ismail-to-the-diwan
      - 1387-hammams
      - 1387-10-01-castile-and-france
      - 1387-10-01-state
      - 1388-12-28-death-of-dua
      - 1389-08-09-the-hisba
    text: >
      The Emperor returned from al-Qāhira with his head full of what he had seen there: the Mamlūk court with
      its offices and ranks, and the books the scholars of al-Azhar had opened for him on the government of
      the old caliphs. He meant to build on them. The first fruit was the Ḥijāba. Under the Umayyads of
      [Qurṭuba](place:qurtuba) the ḥājib had been the chamberlain of the court. He presided over his own
      council, received petitioners and embassies, and drafted decrees in the caliph's name. Under al-Manṣūr
      he became the caliph's power in all but name. The Emperor revived the office. It made the throne
      stronger and gave it something of the dignity of the caliphs' own court. Like the ḥājibs of old, it
      would also stand between the throne and the great lords, and the nobles noticed.


      The Ḥijāba brought a new seat in the dīwān, and the Emperor filled it with his heir. The crown prince
      [Ismāʿīl](person:ismail-ibn-saad) had been at sea as an admiral, carrying the crown's authority over the
      coasts. Nobody took him for a fighting sailor, and he did not pretend to be one; he governed the coasts
      by persuasion and left the fighting to his captains. His father called him home, and on the first day of
      Muḥarram 789 he took his seat beside his aunt [Maryam](person:maryam-bint-yusuf), his uncle
      [Ismāʿīl](person:ismail-ibn-yusuf) and his mother. He was set to the Emperor's great project: the
      seminaries, the scholars, and the shaping of what the realm should prize. He was twenty, married now to
      [Bernarda](person:bernarda-of-murcia) of Mursiyya, and the court said he could talk a bird down from a
      tree.


      Other lessons from the east took root in the towns. Across the realm the crown began to build hammams,
      beginning at [Ishbīliya](place:ishbiliyya): bathhouses for washing, company and ritual purity, a
      cornerstone of Andalusī town life that the Castilians had let fall into ruin. From beyond the Pyrenees
      came news the court did not pretend to regret. Qashtāla had joined a war in the north on the side of a
      little Ardennes county against the king of France, and lost two armies in the hills of the Rhône.


      In Dhū al-Ḥijja 790, in the last days of the year, [Duʿāʾ](person:dua-marinid) the Marīnid died. She was
      fifty years old. She had sat in the dīwān for thirty-three years, under two husbands and two reigns. She
      had brought the court foreign learning and kept the realm through the War of the Upper March as regent,
      and she had seen her son made heir. The court gave out that she died of a short illness. It was very
      short. The physicians were not called until it was over, and the household was quiet for a long time
      afterwards. The Emperor ordered her buried with every honour, in the Rawḍa beside the kings of the
      house, and he did not speak of her again in the dīwān. [Aiman](person:aiman-mamluk) wore white for the
      forty days, as the women of Miṣr do for the dead, and received the court's condolences as though they
      were hers. The court could not decide whether it was mourning or a victory, and suspected that Aiman
      could not either.


      More than seven months later, in Shaʿbān 791, the bureaucracy gained a third office, as the empire
      turned slowly toward the sea and its trade. This was the Ḥisba, the old inspectorate of the Islamic
      city. Its muḥtasib walked the markets, checked the weights and the measures, put down fraud and enforced
      honest dealing. The ʿulamāʾ approved, since the muḥtasib was one of their own. The merchants did not,
      since he was not one of theirs. The Emperor gave the first muḥtasib of Ishbīliya one order in his own
      words: to begin with the crown's warehouses, and to hold the Emperor's weights to the same measure as
      any grocer's in the sūq. The merchants still grumbled, but none of them could say the scales were
      weighted for the crown. The empire's goods sold better for being honestly weighed, and its markets moved
      a little further from barter and a little nearer to coin.


      *O reassured soul, return to your Lord, well-pleased and pleasing to Him.*
  - id: 0794-03-25-of-al-hajj-saad
    'on': '1392-02-20'
    title: Of the Second Pilgrimage, the Death of Aiman, and al-Ḥājj Saʿd
    verse: 3:97
    who:
