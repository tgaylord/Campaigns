date: '1394-03-04'
title: The War of the League
source:
  save: SP_ADU_1394_03_04 (compressed)
  game: 1.4.6
summary: >-
  On 4 March 1394 al-Andalus declares war on Castile under the Reconquest of Iberia, the third war of the
  Istirdād, with Morocco, the Mamlūks and the four ṭāʾifas; Portugal, Rome and Andorra stand with Castile's
  new king Pedro. Since 1379: the capital at Ishbīliya, the Toledan and Teruel risings crushed, the Hajj made
  at the second attempt, and the bureaucracy grown to three offices. The realm has 118 towns and 1,438,000
  people; the game ranks it ninth. Prestige stands at 95 and the treasury at 568. Shares of power are
  estimated from the 1 June 1349 reading.
