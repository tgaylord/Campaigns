    covers:
      - 1391-05-ottoman-marriage
      - 1391-05-11-second-hajj-departs
      - 1391-07-01-merchant-at-sea
      - 1391-07-25-al-qahira-again
      - 1391-10-the-kaaba
      - 1391-10-14-death-of-aiman
      - 1392-02-20-hajji
      - 1392-11-banking
      - 1371-02-24-spread-of-usury
    text: >
      Five years after the season passed him by, the Emperor set out again, and this time he left in spring.
      He stayed at court only long enough for one more marriage. A princess of the house of ʿOthmān, the
      sultans rising in Anatolia, came west to marry his son: [ʿĀʾisha](person:aisha-ottoman), fifteen years
      old, who became the crown prince's second wife beside [Bernarda](person:bernarda-of-murcia). The wedding
      was hardly over before the caravan moved. On 6 Jumādā al-Ākhira 793 he left
      [Ishbīliya](place:ishbiliyya) with half a year in hand, and the crown prince
      [Ismāʿīl](person:ismail-ibn-saad) took up the regency a second time.


      This time the pilgrimage went by sea along the coast of the Maghrib. Off that coast a merchant ship
      hailed the Emperor's galleys, her decks stacked with bolts of silk and fine cloth from distant ports,
      and her captain would sell only after a merchant's unhurried haggling. The Emperor bought the finest
      cloth aboard for the caravan, and lost ten days to the bargaining. In Shaʿbān he came again to
      al-Qāhira, and the court that had watched him the first time watched him now. He was a creature of
      habit. He sat with the scholars of al-Azhar for another month, and took up with the sultan
      [Būlād](person:bolot-mamluk) where they had left off. But it was summer, not autumn, and when he rode
      out of the northern gate there were months to spare.


      In the last days of Dhū al-Qaʿda 793 the Grand Mosque of Makka opened before him. The Kaʿba stood at its
      heart, black-draped, older than memory, with the white-robed faithful moving round it in patient
      circles, thousands of them from every land where the call to prayer is heard. Sultan and shepherd
      dressed alike. On the ninth of Dhū al-Ḥijja the Emperor stood with them on the plain of ʿArafāt beneath
      the Mount of Mercy, from noon until the sun went down, and the pilgrimage he had first meant to make in
      774 was complete. He had been asked what kind of pilgrim he would be, since what a king gives in Makka
      is told in every market of Islam for a generation. He answered by distributing his gold freely, so that
      no pilgrim in the city went hungry that season.


      He was in the holy city when the letter from Ishbīliya found him. [Aiman](person:aiman-mamluk) of the
      Baḥrī house, his first wife, sister of the Mamlūk sultan and mother of his son
      [Yūsuf](person:yusuf-ibn-saad), was dead at forty-seven. She had gone home to Miṣr to see her family
      while the caravan was on the road, and the letter said a beast of the Nile had taken her by the river.
      The Emperor read it twice and gave the order for prayers. Courts keep count of such things, and this one
      counted two great wives lost in three years: [Duʿāʾ](person:dua-marinid) while the Emperor was at court,
      and now Aiman while he was half the world away at Makka. It noted too that Aiman's son, twenty years
      old, now had no mother to speak for him, and that there were those in the crown prince's household who
      did not seem sorry. Nobody at court said any of this aloud.


      On 25 Rabīʿ al-Awwal 794 the caravan came home. Its stores were lighter and its pilgrims were changed,
      and word had outpaced the camels. Crowds filled the road into Ishbīliya to welcome a ruler who had stood
      before the Kaʿba and come back to tell of it. From that day he bore the title al-Ḥājj, earned and not
      granted, as his father had. *Let it be known*, the heralds cried, *Makka and back, by the grace of
      Allāh.* The ʿulamāʾ were content with him as they had not been in years, and every Muslim court from
      [Fās](place:fas) to al-Qāhira sent its congratulations.


      He met his grief as he always had, with work. Before the year was out he did a thing that would have
      been unthinkable twenty years earlier, when the ʿulamāʾ had come to him about the moneylenders of
      Ishbīliya. He gave moneylending a form and a law. Banking, the new craft of the Genoese and the
      Florentines, was admitted into the empire and set under rules, so that the houses of credit of Ishbīliya
      could stand beside those of Janawa. The ʿulamāʾ, freshly content with their Ḥājj, let it pass.


      *And pilgrimage to the House is a duty owed to Allāh by all people who are able to find a way there.*
  - id: 0794-03-26-of-the-western-ocean
    'on': '1392-02-21'
    title: Of the Mansa's Merchants, and the Ships Sent into the Western Ocean
    verse: '55:24'
    who:
      - ismail-ibn-saad
      - khayr-al-din-al-jayyani
      - saad-ibn-yusuf
      - faraj-ibn-ismail
    where:
      - ishbiliyya
      - jayyan
      - washqa
    covers:
      - 1391-06-08-guns-for-mali
      - 1391-07-coast-to-mali
      - 1392-02-atlantic-expeditions
    text: >
      While the Emperor was on the road to Makka, merchants arrived at [Ishbīliya](place:ishbiliyya) from the
      far side of the desert. The old men of the court remembered that the first of the house of Naṣr to cross
      that desert had been [Faraj](person:faraj-ibn-ismail), the old sultan's brother, who married into Ghāna
      forty years before and died on the far side of the sands. The guides who brought these merchants north
      knew his name, and some had learned the road from men who had travelled with him. They had been sent by
      the Mansa of Mali himself, the lord of the gold country, whose forebear Mansa Mūsā had passed through
      al-Qāhira on pilgrimage spending so much gold that its price fell for years. They had come to buy the
      *madāfiʿ* of the empire's arsenals: the fire-tubes and small bombards whose roar the Naṣrids had first
      loosed at the walls of [Washqa](place:washqa) nearly seventy years before. They wanted the craft of
      casting them as well. The crown prince [Ismāʿīl](person:ismail-ibn-saad), ruling as regent, weighed it.
      Some in the dīwān warned that arms sold to a friend can be turned against a friend's trade. The prince
      judged otherwise. Mali was far away and rich, and it would pay a fifth of a year's income for the
      privilege. It would also become a grateful friend in the lands where the gold came from. He sold, and
      the Mansa's merchants went home content.


      A friendship with Mali needed a road to Mali, and the prince did not want it to be the old one. For six
      hundred years the gold had come north on camels across the Ṣaḥrāʾ, through Sijilmāsa and the oases,
      paying a toll at every well. The prince sent instead a courtier of [Jayyān](place:jayyan), [Khayr al-Dīn
      al-Jayyānī](person:khayr-al-din-al-jayyani), a man of forty with a gift for talking to strangers, to
      find the way by sea: down the Atlantic coast of Africa, past the last towns the merchants knew, to
      wherever the shore turned toward the Mansa's country.


      When the Emperor returned from Makka he did not undo his son's work. He added to it. Two more
      expeditions were fitted out with new captains. One was to chart the sea around the Azores, the scattered
      islands the Genoese had glimpsed in the western Ocean. The other was to Madeira, the wooded island the
      Arab geographers had heard of and the Portuguese had not yet claimed. The Catalan shipwrights were set
      to building ships for the Ocean.


      The scholars of the court muttered about the Sea of Darkness. The Emperor had all three expeditions
      entered in the dīwān's registers, with their stores, their wages and their cost to the last dirham, for
      he meant to know what the Ocean gave back for what he spent on it.


      *And His are the ships raised high in the sea like mountains.*
