tellings:
  - id: 0768-01-26-the-slow-return
    'on': '1366-10-02'
    title: Of the Slow Return, and the Day Qurṭuba Turned
    verse: 2:256
    who:
      - saad-ibn-yusuf
    where:
      - qurtuba
      - al-qusayr
      - balma
      - istijja
      - qusantina
      - ishbiliyya
      - jayyan
      - gharnata
    covers:
      - 1363-05-baena-andalusi
      - 1364-05-19-jamaa-summoned
      - 1364-09-11-andalusi-majority
      - 1366-04-qurtuba-andalusi
      - 1366-qurtuba-muslim
      - 1366-11-06-state
    text: >
      The return of al-Andalus did not happen in the mosques first. It happened in the kitchens and the
      markets, in the songs mothers sang over cradles and the words men used to haggle over wool. The tongue
      came back before the faith.


      The first town to turn was Baena, in the hills south of [Qurṭuba](place:qurtuba), some time in the years
      of the Marīnid war. The dīwān's surveyors found that its people now counted themselves Andalusīs and not
      Castilians. They spoke the Arabic of the south, kept its feasts and wore its clothes, and they still
      went to Mass on Sundays. Over the next three years the surveyors found the same thing again and again.
      [al-Quṣayr](place:al-qusayr) turned in 764, [Balma](place:balma) in 765, and [Istijja](place:istijja),
      [Qusanṭīna](place:qusantina) and Fuenteovejuna in 766. Towns that had been Castilian for a century
      became Andalusī within a single generation, and stayed Christian. The jurists did not know what to make
      of them. Some said they were halfway to Islam. Others said they were Mozarabs again, the Christians of
      al-Andalus who had lived under the caliphs and spoken their tongue, as their ancestors had been before
      Qashtāla came. Both may be true.


      Faith came more slowly, and it needed help. In Shaʿbān 765 the Jamāʿa restored the jizya and began a new
      campaign of preaching. The jizya is a hard teacher but a patient one. A Christian of
      [Ishbīliya](place:ishbiliyya) who paid it every year was reminded every year what conversion would save
      him. When the campaign began, thirteen in every hundred souls of Ishbīliya were Muslims. A year later it
      was twenty-six. In [Jayyān](place:jayyan), where scarcely one soul in fifty had prayed toward Makka when
      the war began, three in ten did so by the time it ended.


      Then Qurṭuba turned. In the spring of 767, in the weeks of the peace, the surveyors counted more
      Andalusīs in the city than Castilians, for the first time since Ferdinand of Qashtāla took it a hundred
      and thirty years before. In 749 there had been thirty-four thousand Castilians to six thousand
      Andalusīs. Now there were nineteen thousand five hundred Andalusīs to sixteen thousand three hundred
      Castilians. Six months later, on the twenty-sixth of Muḥarram 768, the count of the faithful was
      finished. Eighteen thousand two hundred Muslims, eighteen thousand Christians and three thousand four
      hundred Jews lived in the city of the caliphs. By the narrowest of margins, Qurṭuba was a Muslim city
      again.


      Our lord [Saʿd](person:saad-ibn-yusuf) was told in [Gharnāṭa](place:gharnata). He is said to have asked
      only one question: whether the great mosque was still a cathedral. It was. He said that he could wait.
      The mosque had waited a hundred and thirty years, and the people of Qurṭuba would give it back
      themselves when they were ready. He was less patient with the treasury. It had been filled at the peace,
      and the young sultan, who read the dīwān's ledgers line by line himself, would not let it sit idle. That
      same year it opened new silver mines at Qusanṭīna, laid out new farms at Úbeda at the head of the
      valley, and paid for another Great Madrasa, this one at Ishbīliya. A mosque could wait for its people,
      he told the treasurers, but silver left in the ground earned nothing for anyone.


      *There is no compulsion in religion. The right way has become distinct from the wrong.*
