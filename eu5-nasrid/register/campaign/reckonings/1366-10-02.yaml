summary: >-
  Six months after the Peace of Independence. The Ṭāʾifa of al-Gharb has been released, and the treasury of
  1,131 has gone into the Great Madrasa of Ishbīliya, the silver of Qusanṭīna and the farms of Úbeda. The game
  still lists Granada as Castile's tributary, which Trent removed with the console soon after; the chronicle
  treats Granada as free. Shares of power are estimated from the 1 June 1349 reading.
