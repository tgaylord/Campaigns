tellings:
  - id: 0752-12-09-the-departing-of-the-pestilence
    'on': '1352-01-27'
    title: Of the Departing of the Pestilence
    book: book-of-pestilence
    verse: 2:155
    who:
      - yusuf-i
    where:
      - gharnata
      - malaqa
      - al-mariyya
    covers:
      - 1352-01-27-plague-gone
      - 1350-09-02-great-dying-census
      - 1350-09-02-cities-emptied
    text: >
      On the ninth of Dhū al-Ḥijja in the year 752, the Day of ʿArafa, while our lord stood on the plain
      beyond Makka, the pestilence left the last town of the realm. No messenger brought word of it, for there
      was no one moment of its going. A physician in a mountain village found one morning that there was no
      new swelling to lance. A grave-digger in [Mālaqa](place:malaqa) found that no one came to him that day.
      The bells of the Christians fell silent, and the muezzins called the prayer to mosques that were fuller
      than they had been in years. Only later, when the scribes of the dīwān went through their reports, did
      they find that the last house had been cleared on that day.


      The reckoning was made, and it is written in this book. Two hundred and twenty-one thousand of the
      realm's people were dead. Fifty-two million were dead in the whole known world from Yāyiq to the Ocean.
      Of every five souls in the old realm of Gharnāṭa, two were in the ground. The cities had suffered most,
      [Gharnāṭa](place:gharnata), Mālaqa and [al-Mariyya](place:al-mariyya), with their alleys and their
      markets. The houses of healing had slowed the sickness but could not stop it. It took the burghers and
      the scholars hardest of all, the very men who had made those cities the light of the West.


      In the years that followed, the dead were not replaced. Four years after the pestilence left, the old
      lands of the realm counted fewer souls than they had at the reckoning. The empty houses of the Albayzín
      stayed empty. The realm that came out of the plague years was not the realm that went in. It was smaller
      in its cities and larger in its lands, more rural and more martial than before, and nearly half
      Christian. It had been won in the field by the sword while it was being emptied at home by the sickness.


      The physicians say the pestilence has not left the world. It lingers in the East and may come again. But
      in Gharnāṭa no one has died of it in four years, and the court has decided that this book may be closed.
      What comes next must be a book of filling what was emptied, of the madrasas and the libraries, of the
      call to prayer carried back into the towns that had forgotten it.


      Here ends the Book of the Pestilence.


      *And We will surely test you with something of fear and hunger and a loss of wealth and lives and
      fruits, but give good tidings to the patient.*
  - id: 0753-02-20-the-royal-hajj
    'on': '1352-04-07'
    title: Of the Royal Ḥajj
    book: book-of-balance
    verse: 2:201
    who:
      - yusuf-i
      - faraj-ibn-ismail
    where:
      - gharnata
    covers:
      - 1351-08-09-hajj-departs
      - 1351-10-07-hajj-al-qahira
      - 1352-01-01-hajj-makka
      - 1352-01-27-plague-gone
      - 1352-04-07-hajj-return
    text: >
      *And proclaim to the people the Ḥajj; they will come to you on foot and on every lean camel, coming from
      every distant pass.*


      No reigning sultan of the house of Naṣr, it was said, had ever made the pilgrimage. The road from
      [Gharnāṭa](place:gharnata) to Makka is the longest in the Muslim world: across the whole sea, the whole
      of Egypt and the whole of the Ḥijāz. A prince of al-Andalus who leaves his throne for a year leaves it
      within a day's ride of Qashtāla. But the war was won and the pestilence was passing, and our lord
      [Yūsuf](person:yusuf-i) resolved to go. On the fifteenth of Jumādā al-Ākhira in the year 752, half a
      year before the season of the pilgrimage, he took ship for the East. His elder brother [Faraj ibn
      Ismāʿīl](person:faraj-ibn-ismail) governed the realm as regent. The caravan was stocked for a year and
      guarded like an army, and at its head went the *maḥmal* of Gharnāṭa, the empty litter that is the banner
      of a prince's pilgrimage. It was hung with brocade and carried in all the splendour the treasury could
      bear.


      On the fifteenth of Shaʿbān, the night of the middle of the month, when the faithful say the record of
      the year is written, the caravan came through the northern gate of al-Qāhira. The city swallowed it at
      once: the noise, the spice, the tanneries and the roasting meat. Over the roofs rose al-Azhar, whose
      scholars are counted among the finest in Islam. The sultan might have sat with them, or pushed on at
      once for Makka. He did neither. He had the caravan dressed in banners and silk and kept it ten days in
      the city of the Mamlūks, so that the court whose daughter was promised to his son might see what the
      house of Naṣr could still put on the road.


      On the thirteenth of Dhū al-Qaʿda the caravan came down into Makka, and the Grand Mosque opened before
      it. The Kaʿba stood at its heart, draped in black, older than memory, and the white-robed faithful moved
      around it in their patient circles. There a sultan and a shepherd dress alike. Our lord asked himself
      what kind of pilgrim he would be, for what a king does in Makka is talked of in every market of Islam
      for a generation. He chose to be a generous one. He gave gold freely in the streets of the holy city,
      that no pilgrim there should go hungry while the lord of Gharnāṭa was among them.


      Then he waited a month for the days of the pilgrimage. On the eighth of Dhū al-Ḥijja he went out to Minā
      with the multitude. On the ninth he stood on the plain of ʿArafa from noon until the sun went down,
      among a hundred thousand voices crying *labbayka*, and asked Allāh's forgiveness for himself and his
      people. The scribes of the dīwān later found that on that same day, far away in the West, the pestilence
      left the last town of the realm. Not one house in Gharnāṭa was still touched by it. The chronicler sets
      the two facts side by side and draws no conclusion.


      He came home on the twentieth of Ṣafar in the year 753, eight months after he had left. Word had outrun
      the caravan. Every court of Islam had heard of the sultan of al-Andalus who stood at ʿArafa and fed the
      poor of Makka, and they thought better of Gharnāṭa for it. The *ʿulamāʾ* were content as they had not
      been for years. Faraj handed back the seal of the regency. And from that day our lord carried a title
      that no victory could have given him: al-Ḥājj Yūsuf.


      *Our Lord, give us in this world good and in the Hereafter good, and protect us from the punishment of
      the Fire.*
  - id: 0753-02-20-the-works-of-the-regency
    'on': '1352-04-07'
    title: Of the Works of the Regency, the Thought of Qurṭuba, and the Murmuring of the Castilians
    book: book-of-balance
    verse: 3:103
    who:
      - faraj-ibn-ismail
      - nasr-al-istijji
      - yusuf-i
      - najib
    where:
      - istijja
      - gharnata
      - qurtuba
      - qusantina
      - jayyan
      - ishbiliyya
    covers:
      - 1351-10-01-great-madrasa
      - 1351-10-06-najib-to-castile
      - 1351-11-08-unlimited-export
      - 1352-01-01-hall-of-ambassadors
      - 1352-04-capital-qurtuba
      - 1352-04-castilian-unrest
      - 1352-04-jizya-remitted
    text: >
      While the sultan walked toward Makka, the regent [Faraj](person:faraj-ibn-ismail) did not sit idle in
      the Alhambra. He governed as his brother would have wished, which is to say he built. His audiences were
      crowded with the lords of the realm, and loudest among them was [Naṣr
      al-Istijjī](person:nasr-al-istijji), of the house that takes its name from [Istijja](place:istijja), a
      man who could talk through a whole afternoon of council and leave it no wiser than he found it.


      On the ninth of Shaʿbān in the year 752 he founded the Great Madrasa of [Gharnāṭa](place:gharnata)
      beside the great mosque. For years the scholars of the city had begged for a college where the law might
      be taught under one roof, as it is in Fās and al-Qāhira. The pestilence had taken more than half of
      them, and those who remained pressed the harder for it, lest the learning of al-Andalus die with them.
      The regent paid two hundred and eighteen dīnārs, and the walls began to rise. It was meant to draw
      students and jurists from across the Strait and to bind the learning of the cities to the service of the
      sultan.


      Five days later Allāh showed how much such a house was needed. [Najīb al-ʿĀbidīn](person:najib) of the
      *ʿulamāʾ*, the most gifted mind left at court, was claimed by Qashtāla at its demand as overlord. He
      went north without a struggle. There, before the cathedral chapter of the Christians, he was baptised
      and took the name Ramiro. He carried with him in his saddlebags the letters, treatises and reckoning
      tables that were the inheritance of the libraries of [Qurṭuba](place:qurtuba). The Christian scholars
      rejoiced over what he brought them. This was the second great mind of Gharnāṭa to go over to the Cross,
      after Ibn al-Khaṭīb. The court began to say bitterly that Qashtāla no longer needed to take our towns
      when it could take our men.


      In Ramaḍān the regent turned to the silver of [Qusanṭīna](place:qusantina), which was the realm's own at
      last. He opened the treasuries to the merchants. Gold and silver were to flow out freely to the markets
      of the world, where they would buy more than they could ever buy as coin in the mint at home. And on the
      thirteenth of Dhū al-Qaʿda, in the days when the sultan came down into Makka, Faraj raised within the
      great tower of the palace a hall to receive the envoys of kings. Its cedar ceiling was carved with the
      seven heavens, thousands of pieces set above the throne, so that every embassy might see the order of
      creation under which the house of Naṣr sits. It cost a hundred dīnārs, a fifth of a year's income. It
      speaks for Gharnāṭa more plainly than any letter.


      So when al-Ḥājj Yūsuf came home in Ṣafar 753, he found his city richer in learning and in splendour,
      though poorer by one great scholar. He stood a long while under the cedar ceiling of the new hall,
      following the seven heavens with his eyes, and said only that he would have hung the stars a little
      higher. Then he called for the masons' drawings of the madrasa and sat over them half the night. And he
      found himself looking north. Gharnāṭa had been the capital of a mountain kingdom of eighteen towns. The
      realm was now forty-three towns, its heart lay in the valley of the great river, and its greatest cities
      were Qurṭuba and Ishbīliya. Qurṭuba had been the seat of the caliphs when al-Andalus was the light of
      the West. The sultan began to speak of moving the throne back to it. The court was divided, and the old
      families of Gharnāṭa were alarmed.


      But one matter outweighed all the others, and it was not in Gharnāṭa. In the new lands, in the villages
      around [Jayyān](place:jayyan) and [Ishbīliya](place:ishbiliyya), the Castilian peasants were murmuring.
      They had buried a third of their people in the plague years, and they paid their taxes to a Muslim lord.
      They had not been asked whether they wished to change masters. The Castilian patriots who had gathered
      in the hills since the peace were no longer a band of malcontents. They were becoming a cause. A throne
      in Qurṭuba would sit in the middle of it.


      So the crown offered a concession. For a time the *jizya*, the tax that the dhimmīs pay for the
      protection of the Muslim state, would not be collected. The Christians of the new lands would keep in
      their own purses what they had paid to Gharnāṭa every year since the peace. The *ʿulamāʾ* grumbled that
      the law of Allāh was not the sultan's to suspend, and that a tax forgiven to rebels is a reward for
      rebellion. The sultan heard them and did it anyway. But he told those closest to him that he doubted it
      would be enough. A man who hates his master, he said, does not love him more for being charged less.


      *And hold firmly to the rope of Allāh all together, and do not become divided.*
