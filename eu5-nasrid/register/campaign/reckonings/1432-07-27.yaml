tellings:
  - id: 0835-11-28-of-the-peace-of-the-pope-and-the-decree-on-the-taifas
    'on': '1432-07-27'
    title: Of the Peace of the Pope, and the Decree on the Ṭāʾifas
    book: book-of-the-franks
    verse: 10:99
    who:
      - muhammad-ibn-ismail-ibn-saad
      - pope-fabrizio-ricci
      - berenguer-ramon-de-montsoriu
      - rodrigo-de-borja
      - magdalena-de-borja
      - maryam-bint-saad-ibn-faraj
      - jadila-bint-saad-ibn-faraj
      - saad-ibn-ismail-ibn-saad
    where:
      - ishbiliyya
    covers:
      - 1432-05-17-battle-terracina
      - 1432-06-01-battle-viterbo
      - 1432-06-27-battle-cape-mondego
      - 1432-07-27-peace-with-the-pope
      - 1432-07-the-decree-on-the-taifas
    text: >
      By the summer of 835 the crusade had run out of crusaders. The Ḥafṣid landings in Lazio ended at
      Terracina, where the Pope's army caught two hundred and seventy Tunisians and killed them all, and the
      Moroccans who had marched on Viterbo were beaten off by an army seven times their size. But the Pope's
      army could not stay in Lazio. Since Rajab the lords of Mantua and Milan had been at war with Faenza, his
      vassal, and the Pope, Genoa and every subject of Genoa were bound to defend it. The court of
      [Ishbīliya](place:ishbiliyya) watched the princes of Christendom fight a crusade against al-Andalus with
      one hand and each other with the other, and found it very satisfying.


      The war at sea ended in the Ocean, where it had never been expected. On 27 Shawwāl a fleet of
      twenty-nine ships from Mecklenburg, on the Baltic, came down the coast of Burtuqāl and attacked a fleet
      off Cape Mondego. It was [Berenguer Ramon](person:berenguer-ramon-de-montsoriu) of Catalonia with
      thirty-two Catalan ships and eight of the Emperor's own. The Mecklenburgers lost eighteen ships and did
      not sink one. It was the first time in the war that the Emperor's ships had fought, and the Emperor had
      the report read to him more than once.


      In Dhū al-Qaʿda the Pope's envoys came to Ishbīliya asking for peace. The Emperor's terms were short.
      The Pope would pay a hundred and fifteen dīnārs at once and a tenth of his income for five years, some
      thirty-six dīnārs a month, in reparation for the war he had begun, and he would annul every treaty he
      had with Genoa, Siena and Aquileia, so that the next pope who preached a crusade would have to find his
      allies again from the beginning. No town changed hands. [Fabrizio Ricci](person:pope-fabrizio-ricci)
      accepted on 28 Dhū al-Qaʿda 835 (27 July 1432), and the Crusade of 835 was over ten months after it
      began. The court called it the Peace of Dhū al-Qaʿda. It said that the Christians could not even keep
      their own quarrels in check long enough to fight the Muslims.


      The peace changed the Emperor. His father and grandfather had left the ṭāʾifas to rule their own courts
      in their own way, Christian subjects and all, and had been content with tribute, loyalty and soldiers.
      Muḥammad was no longer content. A crusade had been preached against his realm and fought in the name of
      its Christians, and he did not mean to leave enemies in his rear for the next one. He decreed that the
      ṭāʾifas of Arghūn, Qūnka, Banbalūna, Burghush and Liyūn, each as soon as it was bound closely enough to
      the crown, were to impose the ways of al-Andalus on the Christians who remained in their lands.


      Only two were bound closely enough yet, and both were ruled by the Emperor's own family by marriage.
      Arghūn belonged to [Rodrigo de Borja](person:rodrigo-de-borja), the brother of the Empress
      [Magdalena](person:magdalena-de-borja), a gentle and talkative man whose kingdom had just been the
      target of the crusade. Qūnka belonged to the Shaykha [Maryam](person:maryam-bint-saad-ibn-faraj), sister
      of the Empress [Jadīla](person:jadila-bint-saad-ibn-faraj) and married to the Emperor's brother
      [Saʿd](person:saad-ibn-ismail-ibn-saad). Their courts were ordered to act, and they obeyed. They also
      complained, and in the ṭāʾifas of the north, which knew their turn would come, the complaints were
      louder. For three generations the house of Naṣr had told the Christians of Iberia that its coming was a
      homecoming. Some of the old men of the dīwān wondered what the Christians would call it now.


      *And had your Lord willed, those on earth would have believed, all of them entirely. Then will you
      compel the people in order that they become believers?*
    behind: >-
      The peace terms are from Trent's screenshot, and the save of 27 July 1432 was taken just before the
      peace. There's no save after it, because no land changed hands. The war score in that save is 5 in the
      defenders' favour. The peace screen's gold line, +114.64, is the immediate payment. The reparations are
      a tenth of the Pope's income for five years, 36.45 gold a month at the time of the peace (Trent). The
      war with Mantua and Milan (started 6 March 1432, against Faenza, with the Pope and Genoa defending) and
      the late joining of Friuli and Lower Carinthia are from the save. The decree on the ṭāʾifas is Trent's
      account and has no save of its own. It is dated to the day of the peace, and the order may have been
      given a little later.


      Invented colour: the court's satisfaction at Christendom's two wars, the Emperor rereading the Mondego
      report, the Pope's envoys coming to Ishbīliya, the purpose behind the treaty clause, the name "Peace of
      Dhū al-Qaʿda", the louder complaints in the northern ṭāʾifas, and the old men of the dīwān at the end.
      Who complained, and how loudly, is Trent's "more than a little grumbling", given a shape.
