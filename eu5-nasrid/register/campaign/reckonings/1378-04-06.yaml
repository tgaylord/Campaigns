date: '1378-04-06'
title: The Peace of the Restoration
source:
  save: SP_ADU_1378_04_06 (compressed)
  game: 1.4.6
summary: >-
  On 6 April 1378 Castile and Portugal make peace. The Aragonese heartland, 24 towns with Zaragoza, is
  restored to the Ṭāʾifa of Aragon, which grows to 30 towns; 46 towns of the Middle and Lower Marches, with
  Toledo, Badajoz and Mérida, pass to al-Andalus; Castile pays reparations and falls from 229 towns to 159.
  The crown now holds 118 towns and 1,287,000 people. Castilians are again its largest people and Catholics
  outnumber Muslims, 713,000 to 503,000. The mercenaries still cost dearly: 133 a month out against 80 in,
  with 1,016 in the treasury. Truces run with Castile, Portugal and Rome to April 1393. Shares of power are
  estimated from the 1 June 1349 reading.
