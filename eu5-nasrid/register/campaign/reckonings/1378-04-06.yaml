  - id: 0777-08-20-of-the-war-of-restoration-and-the-day-of-shalba
    'on': '1376-01-14'
    title: Of the War of the Aragonese Restoration, and the Day of Shalba
    verse: '47:7'
    who:
      - saad-ibn-yusuf
      - francesc-de-montsoriu
      - alfonso-de-onate
      - dua-marinid
      - abu-inan-faris
      - abu-al-fadl-marinid
      - jadila-bint-yusuf
    where:
      - saraqusta
      - balansiyya
      - shalba
      - barshaluna
      - gharnata
      - fas
    covers:
      - 1371-03-01-reconquest-claim-ready
      - 1375-06-05-war-on-castile
      - 1375-06-05-rome-and-lisbon
      - 1375-12-12-catalans-ambushed
      - 1376-01-14-battle-xelva
      - 1376-01-14-second-levy
      - 1376-01-14-envoys-to-fas
      - 1376-01-14-jadila-married
    text: >
      The truce with Qashtāla ran out on 4 Muḥarram 777, and the Emperor [Saʿd](person:saad-ibn-yusuf) did not
      let a day of the new year pass. Beyond the Pyrenees the French were pushing the English into the sea.
      Once they had finished, the Pope at Avignon would rally them against al-Andalus, and every advance the
      Emperor made after that would be blunted by French lances. *We cannot afford to wait*, he told the
      dīwān. War was declared on Qashtāla that day. The claim the dīwān had drawn up four years before reached
      to all the peninsula the Christians had taken, but the heralds proclaimed the war as the Aragonese
      restoration. [Saraqusṭa](place:saraqusta) and the heart of old Arghūn, from Jaca to Teruel, lay in
      Castilian hands, and the renewed kingdom had a right to them.


      A levy was laid on the nobles and on the ṭāʾifas, in gold and in men. The treasury, which had held two
      hundred and eighty-six dīnārs in Shawwāl, held fifteen hundred and seventy-nine by the declaration.
      Al-Ushbūna and Avignon answered the Castilian call: al-Burtughāl, whose king was also king of Qashtāla,
      and the Pope with his vassals of Faenza and Siena. Miṣr answered ours, and the four ṭāʾifas marched
      beside the Emperor. At the declaration he had three thousand three hundred regulars under arms, and the
      Castilian king had seventeen hundred and fifty. Nobody had yet called out the levies.


      They were called out over the summer and autumn. The campaign opened in the east in Rajab. The ḥājib
      [Francesc](person:francesc-de-montsoriu) had brought six thousand Catalans and Algarvians to the
      outskirts of [Balansiyya](place:balansiyya), and on 17 Rajab, at [Shalba](place:shalba) in the hills
      behind the coast, the Castilian general [Alfonso de Oñate](person:alfonso-de-onate) fell on them with
      nearly twenty-five thousand. The Emperor was marching to them with ten thousand five hundred, and
      Balansiyya's levies with him, but the Catalans did not hold until he came. They lost three thousand two
      hundred men to Qashtāla's eight hundred and sixty and broke for the coast.


      That left the Emperor facing Oñate's whole army on Oñate's chosen ground: hills, forest and a river,
      everything that hobbles horse and favours the defender. Retreat would give up the country around
      Balansiyya. On 18 Rajab he gave battle, thirteen thousand eight hundred against twenty-three thousand
      nine hundred.


      It went on for a month, into Shaʿbān. The Emperor did what the Andalusī horse had always done. He threw
      his cavalry at both Castilian flanks to sweep them away before the weight of the Castilian foot could
      tell. On the open plain before [Barshalūna](place:barshaluna) two years earlier that had won the day. In
      the broken country of Shalba the horse could not close the jaws fast enough. The centre held, by a
      thread, through weeks of grinding, while the wings were worn down against twice their numbers. On 20
      Shaʿbān the Emperor drew off what was left. He had lost eight thousand one hundred and seventy men,
      against seven thousand five hundred and twenty of Oñate's. Qashtāla had lost nearly as many as he had,
      and it could spare them; he could not. The old soldiers said it was the price of fighting on unsuitable
      ground, and the Emperor did not argue with them.


      He levied two thousand more men from the nobles, and he listened to [Duʿāʾ](person:dua-marinid). Since
      the last war there had been a warm silence between [Gharnāṭa](place:gharnata) and [Fās](place:fas). It
      was not hostile, but on our side it was distrustful. The Marīnids had courted Gharnāṭa and then stabbed
      it in the back the moment they could, and the court had a long memory. Duʿāʾ argued that the time had
      come to renew the alliance all the same. The dīwān's clerks had grown with the realm and could carry the
      embassy, she said, and it would be months before the first Mamlūk army could reach Iberia. There was a
      bond now as well. [Abū ʿInān](person:abu-inan-faris)'s heir, [Abū al-Faḍl](person:abu-al-fadl-marinid),
      had lately married the Emperor's sister [Jadīla](person:jadila-bint-yusuf). Between Jadīla and Duʿāʾ
      there was enough to open a dialogue between what had once been good friends.


      The envoys rode for Fās, and a pact was offered. On 22 Shaʿbān the alliance was signed. Fās had a truce
      with Qashtāla that would not end until the autumn of the year after next, so it could not join the war
      before then. Its envoys swore it would help when it could. The Emperor's council was not sure their word
      was worth believing.


      *O you who have believed, if you support Allāh, He will support you and plant firmly your feet.*
  - id: 0778-04-15-of-the-mercenaries-and-the-slaughter-at-agramunt
    'on': '1376-09-01'
    title: Of Defeat in Detail, the Mercenaries of the Marches, and the Slaughter at Agramunt
    verse: 8:60
    who:
      - francesc-de-montsoriu
      - saad-ibn-yusuf
      - abu-inan-faris
      - dua-marinid
      - alfonso-de-onate
      - bolot-mamluk
    where:
      - shalba
      - barshaluna
      - gharnata
      - jarunda
      - fas
    covers:
      - 1376-01-21-catalans-destroyed-at-barcelona
      - 1376-03-01-battle-cape-ben-sakka
      - 1376-05-25-battle-girona
      - 1376-06-12-second-battle-girona
      - 1376-06-mercenaries-and-the-faithful
      - 1376-08-moroccan-gift
      - 1376-09-01-battle-agramunt
      - 1376-12-catalan-shipwrights
    text: >
      The spring of 777 was the worst of the war. A week after [Shalba](place:shalba), the Pope at Avignon put
      two thousand men ashore on the Catalan coast. On 27 Shaʿbān they caught the Catalans of
      [Francesc](person:francesc-de-montsoriu) who had escaped Shalba, two thousand five hundred and
      sixty-seven of them, before the walls of [Barshalūna](place:barshaluna), and killed or took every one
      without losing a man. On 8 Shawwāl, off Cape Ben Sakka on the coast of Ifrīqiya, the fleets of
      al-Burtughāl and Qashtāla, twenty-eight sail under the Portuguese admiral Rafael Araújo, found the
      Catalan fleet of twenty and sank or took nineteen. After that the sea belonged to the Iberians. By the
      spring a Castilian army had Barshalūna itself under siege, the war was going plainly against us, and men
      in the markets of [Gharnāṭa](place:gharnata) asked one another whether the Emperor
      [Saʿd](person:saad-ibn-yusuf) had overreached.


      The Emperor had an answer, and he gave it a soldier's name: *defeat in detail.* The enemy had more men,
      but they were scattered across the Peninsula, landed in pieces and marching in pieces. He meant to meet
      each piece alone. The Pope's army was the first. In Muḥarram 778 the Emperor came on it before
      [Jarunda](place:jarunda), eight thousand four hundred against two thousand nine hundred, and in a day
      two thousand two hundred and fifty-two of the Pope's men were lost for two hundred and thirty-four of
      ours. The court called the papal landing a foolish venture, and nobody defended it. Eighteen days later
      the men of Siena followed their master's footsteps to the same field. Fifteen hundred and fifty-eight
      came against the Emperor, and every one of them fell, for one hundred and one of ours.


      That cleared the north of the Pope's men. It did not lift the siege of Barshalūna. For that the Emperor
      went back to a remedy the house of Naṣr had used in its first war, nearly forty years before:
      mercenaries and the faithful. He raised more than seven thousand veterans from the Marches, hard men who
      had fought on the frontier all their lives and would fight wherever they were paid. They were expensive.
      The treasury paid out seventy dīnārs a month more than it took in. Then help came from an unexpected
      quarter. [Abū ʿInān](person:abu-inan-faris) of [Fās](place:fas), who could not join the war while his
      truce held, sent a gift of gold into the Emperor's treasury, freely given. The councillors who had
      doubted his word found that [Duʿāʾ](person:dua-marinid) had been right about her own house, and she let
      them find it without any help from her.


      In Rabīʿ al-Awwal the Emperor brought fifteen thousand men, the veterans of the Marches at their heart,
      against [Alfonso de Oñate](person:alfonso-de-onate) in the Catalan plain at Agramunt. Oñate had nineteen
      thousand Castilians and papal troops, and he had beaten the Emperor at Shalba. This time the ground was
      open. The Emperor's heavy foot held the centre, and his horse had room to work. They fought for a
      fortnight. When it ended on 15 Rabīʿ al-Thānī, twelve thousand seven hundred of Oñate's men were dead or
      scattered, against two thousand eight hundred and thirty-nine of ours. It was not a victory, the
      soldiers said; it was a slaughter. A war that had looked all but lost when the battle began was in the
      balance again, though the balance still leaned against us.


      There was still the sea. The armies of Miṣr, tens of thousands of them, waited on the far shore because
      the Mamlūks had almost no ships, and the Iberian fleets would sink anything they sent. *This will not
      do*, the Emperor said. In Rajab 778 the crown sent Catalan shipwrights east, to five ports of the Mamlūk
      sultan [Būlād](person:bolot-mamluk): al-Iskandariyya, Dimyāṭ, ʿAkkā, Anṭākiya and Ṭarsūs. They were to
      build proper shipbuilding wharves there with the Mamlūks' coin, and to teach the Egyptians to build
      galleys of the new Catalan kind. The plan was the Emperor's own, and so was the reckoning behind it: the
      Mamlūks would pay for the wharves, and the sea would be cleared at little cost to the treasury of
      al-Andalus. By the next winter the Mamlūks had twenty-two ships, where eighteen months before they had
      had one.


      *And prepare against them whatever you are able of power and of steeds of war, by which you may terrify
      the enemy of Allāh and your enemy.*
  - id: 0779-12-07-of-saraqusta-and-the-peace-of-the-restoration
    'on': '1378-04-06'
    title: Of Saraqusṭa, the Day of Shalūqa, and the Peace of the Restoration
    verse: '61:13'
    who:
