    covers:
      - 1378-04-06-castles-razed
      - 1377-01-31-battle-zaragoza
      - 1377-06-13-battle-calatayud
      - 1377-09-30-morocco-joins
      - 1377-10-19-battle-cape-sao-vicente
      - 1377-11-04-battle-bay-setubal
      - 1378-01-17-battle-shaluqa
      - 1378-04-06-peace-castile
      - 1378-04-06-sayyida-diplomacy
      - 1378-05-khilafat-qurtuba-renewed
      - 1378-07-09-tunis-marriage
    text: >
      Qashtāla raised another army over the winter, and the Emperor [Saʿd](person:saad-ibn-yusuf) went to meet
      it in the country it was fighting for. On 20 Ramaḍān 778 he found it before [Saraqusṭa](place:saraqusta)
      on the Ebro, the old capital of the Upper March, which no Muslim army had seen for two hundred and fifty
      years. The Castilians were led now by Alfonso Yáñez, a capable administrator but no great general, and
      they numbered seven thousand four hundred, with the Pope's men among them. The Emperor had thirteen
      thousand two hundred. Five thousand six hundred and seventy-five of theirs fell or fled, for seven
      hundred and five of ours. In Ṣafar 779 he caught the last of that army at [Qalʿat
      Ayyūb](place:qalat-ayyub) on the Jalón, the fortress of Ayyūb, and destroyed it: two thousand and
      twenty-nine of theirs against three hundred and eighty-five of ours. Qashtāla had no field army left,
      and the war ran in our favour again. The Emperor turned his attention west, to the Portuguese.


      The Marīnids kept their word. On 26 Jumādā al-Ūlā 779, the day their truce with Qashtāla ended, the
      court asked [Fās](place:fas) to join the war, and [Abū ʿInān](person:abu-inan-faris) answered with a
      call to arms. Three weeks later the fleet of Fās, eighteen sail under Abū Ḥammū, met five Castilian
      ships off Cape São Vicente and sent all five to the bottom without losing one. The Iberian fleets still
      had teeth. They sank the last ship of [Barshalūna](place:barshaluna) in the bay of Setúbal and three
      ships of [Tilimsān](place:tilimsan), Fās's vassal, off Cape Mondego. But they were no longer alone on
      the sea, and the ships of Fās began to clear a path through it.


      In Ramaḍān the Portuguese came down out of the west on [Ishbīliya](place:ishbiliyya), eleven thousand
      three hundred of them, while another of the Emperor's armies lay before Valladolid in the heart of
      Qashtāla. The Emperor met them at [Shalūqa al-Kubrā](place:shaluqa-al-kubra), on the edge of the
      greatest city of the realm, with ten thousand three hundred. For ten days he stood with the heavy foot
      of the centre, slept on the ground among them and kept the fast as they kept it, and the soldiers said
      afterwards that wherever the line thinned, his banner was there. The battle ended on the seventeenth of
      Ramaḍān, the day of Badr, and the army knew it. Eight thousand three hundred and forty-three Portuguese
      were lost to their king, against one thousand and sixty-nine of ours, and the rest were driven back
      across the border. After that day the Iberians could no longer hope to win the war, only to end it.


      By Dhū al-Ḥijja Valladolid was weeks from falling. The Emperor's army was marching on
      [al-Ushbūna](place:al-ushbuna). The fleet of Fās had cleared the sea, and the first Mamlūk army,
      carried, the court said, in galleys from the new wharves, lay off the coast of Tūnis. The Emperor's
      envoys went to [Jerónimo](person:jeronimo-of-castile), king of Qashtāla and al-Burtughāl, with the offer
      the king of Arghūn had been given three years before: peace, or blood. The Iberians knew when they were
      beaten. On 7 Dhū al-Ḥijja 779, two days before the pilgrims stood at ʿArafa, they chose peace.


      The heartland of Arghūn, twenty-four towns from Jaca under the Pyrenees to Teruel, with Saraqusṭa,
      Huesca and Qalʿat Ayyūb, was restored to the renewed kingdom of [Alfons](person:alfons-de-borja), whose
      six towns became thirty. The Upper March had its capital again, and the war had earned its name. To the
      crown itself passed forty-six towns of the Middle and Lower Marches: [Ṭulayṭula](place:tulaytula), the
      old capital of the Visigoths and of a ṭāʾifa of our own faith, with Ṭalabayra and the towns of La
      Mancha, and in the west [Baṭalyaws](place:batalyaws), [Mārida](place:marida), Turjāla and the hills of
      the Guadiana. Four hundred thousand souls came with them, nearly all Castilian and Christian. Qashtāla
      paid reparations besides, and razed seven of its own castles, at León, Zamora, Valladolid, Segovia,
      Cuenca, Pamplona and Laguardia, so that the road to its heart would lie open if it ever broke the peace.
      It had held two hundred and twenty-nine towns when the war began and now held one hundred and
      fifty-nine.


      Seven years earlier our lord Saʿd had unrolled the great map of the caliphs from the treasury of
      [Gharnāṭa](place:gharnata) and looked at its three red lines, the thughūr. Now every one of them lay
      within the realm of al-Andalus or of its ṭāʾifas: the Upper March of Saraqusṭa, the Middle March of
      Ṭulayṭula, the Lower March of Baṭalyaws and Mārida. The cost was written in the dīwān's ledgers.
      Nineteen thousand two hundred and fifty-six of our side had fallen in the field, and forty-one thousand
      one hundred and twenty-one of theirs. The truce would hold for fifteen years.


      The Emperor meant the peace to be used. A month before it was sealed his mother
      [Sayyida](person:sayyida-of-fezzan) had left the work of the new towns for the embassies of the realm.
      In the months after it the scholars set to work at his command on the renewal of the caliphate of
      [Qurṭuba](place:qurtuba): the ceremonial of ʿAbd al-Raḥmān III, a throne hall in a rebuilt Madīnat
      al-Zahrāʾ, robes of ṭirāz with the regnal year worked in gold thread, and dīnārs struck from the gold of
      the Land of the Blacks. With it went a covenant setting down in writing what the Christians and Jews of
      the realm owed and what they were owed. He wanted it written, he said, so that no governor could take
      from a dhimmī a dirham more than the law allowed. In the summer a royal marriage bound al-Andalus to the
      Ḥafṣids of Tūnis.


      *And another favour that you love: victory from Allāh and an imminent conquest; and give good tidings to
      the believers.*
