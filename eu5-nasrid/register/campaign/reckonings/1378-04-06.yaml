  - id: 1376-01-14-envoys-to-fas
    'on': '1376-01-14'
    kind: world
    what: >-
      Envoys ride for Fās. Since the last war there has been a warm silence between the courts: not hostile,
      but distrustful on ours, for the Marīnids courted the Emirate and then stabbed it in the back the moment
      they could. Now Duʿā argues for renewing the alliance; the expanded bureaucracy can bear it, and the
      first Mamlūk army is months away. The crown prince of Fās, Abū al-Faḍl, has lately married the Emperor's
      sister Jadīla, and that and Duʿā open the dialogue. A pact is offered. Morocco's truce with Castile runs
      to September 1377, but if its words are to be believed, and that is questionable, it is willing to help.
      The alliance is signed on 16 January
    who:
      - dua-marinid
      - saad-ibn-yusuf
      - abu-al-fadl-marinid
      - jadila-bint-yusuf
      - abu-inan-faris
    threads:
      - war-of-the-aragonese-restoration
      - europe
    from:
      - told
    cite: Trent's account, January 1376
    detail:
      with: MOR
      proposal: alliance
      advocate: Duʿā the Marīnid
      ties:
        - Jadīla bint Yūsuf married to Abū al-Faḍl, heir of Fās
        - Duʿā, a Marīnid princess
      obstacle: Morocco's truce with Castile until 30 September 1377 (save of 5 June 1375)
      trust: questionable (Trent)
      pastWars:
        - '1368-1370: the Second Marīnid War for the Submission of Granada'
      concluded: alliance signed on 16 January 1376 (save of 13 January 1377)
