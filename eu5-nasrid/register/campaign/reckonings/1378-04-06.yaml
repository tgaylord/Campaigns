    what: >-
      The Battle of Šalba (Xelva). With the Catalans broken, the Emperor must give battle on bad ground,
      hills, forest and a river, against nearly twice his numbers. His horse tries to sweep away both
      Castilian flanks before their numbers tell, and the centre holds by a thread; but the wings are worn
