title: The Kingdom of Sicily
source:
  save: SP_ADU_1450_11_29 (compressed)
  game: 1.4.7
summary: >-
  From a save on the day of the peace. The whole kingdom of Sicily, twenty-two towns from Messina to Trapani,
  is the Emperor's, with its palace, cathedral and castle at Palermo: the realm now holds 244 towns. Athens
  and Negroponte, Sicily's subjects, are vassals of al-Andalus; Tunis has northern Sardinia; Genoa made its
  own peace in July and has Corsica back. Naples, across the strait, has a claim on al-Andalus. The army is 13
  regiments (6 of thughūr), the fleet 97 ships with 20 hulks. The Mamlūks' war on the Banū Lām goes on, with
  al-Andalus in it in name; a new ṭāʾifa is to be raised in Sicily when it ends (Trent). Stability 22.9,
  prestige 94, treasury 2,804. Estate power estimated from the reading of 16 November 1428.
