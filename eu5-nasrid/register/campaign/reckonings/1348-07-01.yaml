tellings:
  - id: 0748-02-06-the-day-of-jayyan
    'on': '1347-05-18'
    title: Of the Day of Jayyān
    verse: 17:81
    who:
      - yusuf-i
      - alfonso-xi
    where:
      - tilimsan
      - balansiyya
      - al-mariyya
      - jayyan
      - ishbiliyya
    covers:
      - 1346-11-22-battle-bay-palma
      - 1346-12-02-battle-gulf-of-almeria
      - 1347-01-16-battle-bay-alcudia
      - 1347-02-13-battle-castellon-de-la-plana
      - 1347-03-17-battle-sevilla
      - 1347-05-18-battle-jaen
    text: >
      The winter brought our allies nothing but grief. In the bay of Palma the Aragonese galleys sank the
      fleets of Bijāya and [Tilimsān](place:tilimsan), fourteen ships sent to the bottom without one Christian
      hull lost. Off Alcúdia they did the same to the fleet of Qābis. The ships of
      [Balansiyya](place:balansiyya) were worsted by the Portuguese in the very gulf of
      [al-Mariyya](place:al-mariyya), within sight of our own shore. On the first of Dhū al-Qaʿda the Ṭāʾifa's
      little army of two thousand was caught at al-Qasṭalyūn by eight thousand Aragonese and destroyed to the
      last man. And on the third of Dhū al-Ḥijja the Marīnids, landed at last on our side of the Strait, came
      before [Ishbīliya](place:ishbiliyya) with fewer than three thousand men. The Castilians met them with
      nearly twelve thousand and drove them off.


      The Christians took heart and believed the Muslims of the West could be beaten one by one. The tyrant
      himself, [Alfonso](person:alfonso-xi), son of Ferdinand, king of Qashtāla, came south with thirteen
      thousand men to finish the matter before the walls of [Jayyān](place:jayyan).


      Our lord [Yūsuf](person:yusuf-i) had marched north to meet him with twenty-two thousand of the faithful,
      and three and a half thousand Moroccans joined him on the road. It was the sixth of Ṣafar in the year
      748. The king of Qashtāla was a soldier who had fought Muslims since his youth. He did not refuse
      battle, though he was outnumbered two to one, for he thought the Andalusīs soft from long peace and fat
      on Catalan trade. The Volunteers held the centre with the *mutaṭawwiʿa* in the first line, as at Uryūla.
      The jinetes rode on the wings in the old manner of al-Andalus, wheeling in, loosing and wheeling out
      again. All day the Castilian knights threw themselves at the line and all day the line held. At evening
      the jinetes turned their flank, and the Castilian army broke.


      Seven thousand five hundred Castilians fell or were taken, more than half of those who came. We lost
      four thousand two hundred, Allāh have mercy on them. That night the sultan did not sit down to the
      victory feast. He went among the wounded with the physicians and a lamp, cleaning and binding wounds
      with his own hands as he had learned to do on campaign, and he had the Castilian wounded carried in and
      laid beside ours. The physicians said he had a surgeon's hands and wasted them on a throne. The king
      escaped with his household, but he left the confidence of the winter on that field. The Andalusīs, whom
      the Christians had called soft, began to call themselves the sword of the West.


      *Truth has come, and falsehood has departed. Indeed, falsehood is ever bound to depart.*
  - id: 0748-05-23-of-al-qusayr-and-balma
    'on': '1347-08-31'
    title: Of al-Quṣayr and Balma
    verse: 3:160
    who:
      - yusuf-i
    where:
      - jayyan
      - qurtuba
      - al-qusayr
      - ishbiliyya
      - qadis
      - sharish
      - balma
      - gharnata
    covers:
      - 1347-06-17-battle-jerez-de-la-frontera
      - 1347-06-21-battle-carpio
      - 1347-07-13-battle-sevilla
      - 1347-08-08-constantinople-falls
      - 1347-08-31-battle-palma-del-rio
      - 1347-09-14-the-war-so-far
    text: >
      After [Jayyān](place:jayyan) the sultan did not go home. He turned the host down the valley of the great
      river, the Wādī al-Kabīr, toward [Qurṭuba](place:qurtuba). The farms and granaries of the Castilian
      frontier burned behind it, for the Christians had burned ours for a hundred years and had taught us how.
      On the eleventh of Rabīʿ al-Awwal, at [al-Quṣayr](place:al-qusayr) on the river above Qurṭuba, a
      Castilian army of seven thousand stood across the road. The sultan had eighteen thousand. The battle was
      short. Four thousand three hundred Christians fell, against fourteen hundred of ours, and the road to
      Qurṭuba lay open.


      Our Marīnid brothers fared otherwise. On the far side of [Ishbīliya](place:ishbiliyya), between that
      city and [Qādis](place:qadis), the Marīnid columns landed in small bands and were beaten in small bands.
      On the seventh of Rabīʿ al-Awwal a column of two and a half thousand was beaten at
      [Sharīsh](place:sharish) by ten thousand. On the third of Rabīʿ al-Thānī a column of nine hundred was
      destroyed before Ishbīliya to the last man, without the loss of one Castilian. Qashtāla's southern army,
      nearly ten thousand strong, grew fat on these easy victories. Its captains came to believe that every
      Muslim in the field would break as the Moroccans broke.


      So the sultan swung west to relieve his allies. On the twenty-third of Jumādā al-Ūlā, at
      [Balma](place:balma) where the Shanīl runs into the Wādī al-Kabīr, the Castilian southern army attacked
      him. He had sixteen thousand of his own and four thousand Moroccans who had gathered to his banner. The
      Castilians came on in the confidence of men who had won all summer and found they were not fighting
      Moroccans. By evening five thousand three hundred of them lay on the riverbank. Our dead numbered seven
      hundred. Of all the sultan's victories it was the cheapest.


      In those same weeks word came from the East that Qusṭanṭīniyya, the Queen of Cities, had fallen to the
      Ottomans, and that the Cross was taken down from its great church. The faithful of
      [Gharnāṭa](place:gharnata) gave thanks in the mosques. The wiser heads at court reflected that the Turks
      had won their city alone, and that no one should count on help from the far end of the sea.


      When the first year of the war was reckoned in Jumādā al-Ākhira, the account stood thus. The army of
      Gharnāṭa had won every battle it fought and lost fewer than six thousand men in them. The Moroccans had
      lost three and a half thousand in battle and six thousand more to hunger and sickness on the march.
      Qashtāla had lost more than eighteen thousand, most of them to the sultan's sword. The dīwān held that
      Gharnāṭa had done almost twice Morocco's share of the war, and done it with half the men.


      *If Allāh should aid you, no one can overcome you.*
  - id: 0748-09-09-of-muntil-and-the-gate-of-qurtuba
    'on': '1347-12-13'
    title: Of Munṭīl, and the Gate of Qurṭuba
    verse: 2:249
    who:
      - yusuf-i
    where:
      - muntil
      - qurtuba
      - jayyan
      - al-qusayr
      - balma
    covers:
      - 1347-10-04-battle-montiel
      - 1347-10-30-battle-montiel
      - 1347-12-13-battle-cordoba
    text: >
      In the autumn the Marīnids tried their fortune in the north. A Marīnid army of four thousand, with a
      handful of Tunisians, struck into the high plain of La Mancha. On the twenty-seventh of Jumādā
      al-Ākhira, at [Munṭīl](place:muntil), it met eight thousand Castilians. The Moroccans were beaten and
      fled. Yet they sold the field dearly: twelve hundred of them fell, and three thousand eight hundred of
      the enemy.


      When the sultan heard of it he marched north to Munṭīl. On the twenty-fourth of Rajab, on the same field
      where the Moroccans had broken, he met what remained of the Castilian army, some four and a half
      thousand men, with sixteen thousand of his own. The Christians had not had time to bury their dead from
      the first battle before they joined them. Three thousand one hundred fell, and we lost five hundred. The
      jinetes pursued the rest into the hills, and the Moroccans' debt was paid.


      Then the host came down again to [Qurṭuba](place:qurtuba), the old seat of the caliphs. The Christians
      have held it for a hundred and eleven years and made its great mosque into a church. On the ninth of
      Ramaḍān, the month of Badr, Qashtāla's southern army was rebuilt once more and sent to keep the sultan
      from the city. It had four thousand four hundred men. The sultan had fifteen thousand seven hundred. The
      Castilians did not break at once, but when they broke the jinetes rode them down. Three thousand three
      hundred and fifty Christians died before the gate of Qurṭuba, and two hundred and fifty of ours.


      That made five great victories in a year, at [Jayyān](place:jayyan), [al-Quṣayr](place:al-qusayr),
      [Balma](place:balma), Munṭīl and Qurṭuba. Nearly twenty-four thousand Castilians had fallen in them, and
      the king's armies in the south had been broken again and again and made whole again from fresh levies.
      The old soldiers said they could not be made whole for ever. Qashtāla had men still. What it was running
      out of was men who believed they could win.


      *How many a small company has overcome a large company by permission of Allāh.* So it was said of Badr,
      when the believers were few. In Ramaḍān of 748 the believers were many and the infidels few, and the
      verse was turned around, and still it held, for Allāh is with the patient.
  - id: 0748-10-15-the-birth-of-saad
    'on': '1348-01-18'
    title: Of the Birth of Saʿd
    verse: '18:46'
    who:
      - saad-ibn-yusuf
      - yusuf-i
      - sayyida-of-fezzan
      - faraj-ibn-ismail
      - dua-marinid
    where:
      - qurtuba
      - gharnata
      - fas
    covers:
      - 1348-01-18-birth-saad
      - 1348-01-18-betrothal-morocco
    text: >
      In the middle of Shawwāl in the year 748, while the host wintered on the frontier of
      [Qurṭuba](place:qurtuba), a rider came up from [Gharnāṭa](place:gharnata) with the news the court had
      waited for. The lady [Sayyida](person:sayyida-of-fezzan), daughter of the house of Murzuq in Fazzān, had
      given our lord [Yūsuf](person:yusuf-i) a son. He was named [Saʿd](person:saad-ibn-yusuf), which is good
      fortune, and the name was thought well chosen: he was born in the second year of the war, in a season of
      victories, with the pestilence still far off in the East. A son of the sultan's body stood before a
      brother in the succession, and from that day the court counted the infant, and no longer his uncle
      [Faraj](person:faraj-ibn-ismail), the heir of Gharnāṭa.


      Sayyida had come to Gharnāṭa a child of nine, betrothed to the young sultan in 738, and had married him
      in the year of the Jamāʿa. The women of the palace had long whispered that the harem the Jamāʿa
      enshrined would fill with sons. Now it had given one to the house of Naṣr. Alms were given at the gates
      of the Alhambra, and the poets of the court wrote odes that were better in their sentiment than their
      metre.


      That same day a Naṣrid betrothal was sealed with the Marīnids of [Fās](place:fas), binding the two
      houses as the war bound the two realms. The bride was [Duʿāʾ](person:dua-marinid), a girl of nine of the
      Marīnid house, and she was promised not to the newborn but to the sultan himself. The dīwān thought it a
      prudent knot. In time the court would learn how quickly the knots the Marīnids tied could come undone,
      and that this one, alone of them, would hold.


      *Wealth and children are the adornment of the life of this world.*
  - id: 0749-02-15-the-coming-of-the-pestilence
    'on': '1348-05-15'
    title: Of the Coming of the Pestilence
    verse: 4:78
    who:
      - yusuf-i
    where:
      - qurtuba
      - gharnata
    covers:
      - 1348-05-15-black-death-arrives
      - 1348-plague-segregation
      - 1348-plague-scapegoats
    text: >
      On the fifteenth of Ṣafar in the year 749 the thing the merchants had spoken of two years before came
      ashore. No chronicle records the name of the ship that carried it. It came in the spring with the trade
      from the east, as the sultan had said it would, while the host was far away on the plains of
      [Qurṭuba](place:qurtuba). Within days the physicians of the new houses of healing were sending word up
      to the Alhambra: the swellings, the fever, the black blood. The *ṭāʿūn* had come to al-Andalus.


      The sultan's answer was the hardest one. He ordered the infected separated from the healthy. Whole
      streets were closed with chains, the sick were carried out of the cities to camps beyond the walls, and
      their houses were sealed with their goods inside. The physicians said it was the only way to slow the
      sickness, and they were right. But the burghers, whose shops were shut, and the common people, whose
      sons and mothers were carried off to the camps, cursed the order and the men who enforced it. Some of
      the *ʿulamāʾ* said that to flee a plague, or to drive others from it, was to doubt the decree of Allāh.
      Others answered with the Prophet's own words, peace be upon him: if you hear of a plague in a land, do
      not enter it; and if it breaks out in a land where you are, do not leave it.


      When the sultan came back from the frontier in the weeks that followed, he went to the house of healing
      in [Gharnāṭa](place:gharnata) against the pleading of his physicians. He walked its wards with a cloth
      soaked in vinegar over his mouth, looked at the swellings as a man who had dressed wounds on the field,
      and asked each physician what he lacked. What they asked for, the treasury sent.


      In the farther villages, where the sultan's officers rode seldom, the people found a different remedy.
      Elders gathered and named those they held guilty. Sometimes it was a Jew who had sold medicines,
      sometimes a widow who lived alone, sometimes a stranger who had come up from the coast the month before.
      Then they drove them out, or worse. The government sent orders to stop it and the orders came too late.
      It is the oldest sin of frightened men to seek a hand to punish when the hand that strikes is Allāh's.


      *Wherever you may be, death will overtake you, even if you should be within towers of lofty
      construction.* The faithful knew it as a verse. Now they learned it as a season.
  - id: 0749-04-03-the-madman-and-the-flame
    'on': '1348-07-01'
    title: Of the Madman at al-Manṣūra, and the Flame the Turks would not Rekindle
    verse: 3:145
    who:
      - yusuf-i
    where:
      - qurtuba
      - al-mansura
      - gharnata
    covers:
      - 1348-05-30-battle-cordoba
      - 1348-06-01-assassination-attempt
      - 1348-06-12-battle-cape-ben-sakka
      - 1348-07-01-help-from-the-east
      - 1348-07-01-influence-crosses
      - 1348-07-01-war-chest
    text: >
      On the first of Rabīʿ al-Awwal in the year 749 the host destroyed one more Castilian column before
      [Qurṭuba](place:qurtuba), two thousand men caught in the open. It was a small victory and the last of
      that spring, for the pestilence was already in the land behind the army. Two days later Allāh tested the
      realm in its head.


      The sultan had come back from the frontier and was at [al-Manṣūra](place:al-mansura) in the east of the
      realm. As he came out from the prayer a man rushed through the crowd with a blade and fell on him. He
      was a madman, the guards said. Others said, more quietly, that he had been paid. Our lord
      [Yūsuf](person:yusuf-i) took the blade across the face, and the guards cut the man down before he could
      strike again. The sultan lived. He bears the scar to this day, and the people say it has made him look
      more like the warrior he has shown himself to be.


      But the court asked why the guards had been so far from his side at the mosque door. Some whispered that
      they had been drawn away on purpose, by men who opposed the sultan's rule, his strengthened crown and
      his costly war. No one was named and no one was punished, which only made the whispers louder. The blow
      fell on the realm's sovereignty as much as on the sultan's face. The war, the pestilence and the knife
      together drove it far below the half.


      In those weeks the scales of the Strait tipped in a new direction. For the first time, the sway of the
      Marīnids over [Gharnāṭa](place:gharnata) outweighed the sway of Qashtāla. On the fourteenth of Rabīʿ
      al-Awwal the great fleet of Fās, fifty-four ships, fell on the Aragonese off Cape Ben Sakka and sank
      thirteen of their sixteen galleys. It was the first victory the allies had won at sea in the whole war,
      and it made the Marīnid sultan bold and his envoys at Gharnāṭa overbearing. The court had gone to war to
      keep Qashtāla's hand off the realm. It began to fear that it was only exchanging one master for another.


      So the sultan looked further east. He sent a delegation to Qusṭanṭīniyya to congratulate the Ottoman
      beys on their conquest and to ask, after ten years of friendly letters, for soldiers against the crowns
      of Iberia. Sulaymān Bey received them courteously and sent them home with this answer: *Why should we
      try to rekindle a nearly extinguished flame?* By this he meant al-Andalus.


      The war was now costing fifty dīnārs a month against an income of nineteen. Five loans were owed again,
      and the treasury held eight hundred and nineteen. The realm was winning every battle and paying for
      every one of them.


      *And it is not for a soul to die except by permission of Allāh at a decree determined.*
