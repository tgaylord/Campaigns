tellings:
  - id: 0772-02-20-the-reckoning-of-the-faithful
    'on': '1370-09-13'
    title: Of the Reckoning of the Faithful, in the Year the Strait Was Won
    book: book-of-the-call
    verse: 16:125
    who:
      - saad-ibn-yusuf
    where:
      - fas
      - qurtuba
      - qarmuna
      - ishbiliyya
      - jayyan
      - qadis
      - sharish
      - shaluqa
      - jabal-tariq
      - al-jazira-al-khadra
      - gharnata
    covers:
      - 1370-09-conversion-reading
      - 1370-09-13-state
      - 1366-qurtuba-muslim
    text: >
      When the peace with [Fās](place:fas) was sealed, our lord [Saʿd](person:saad-ibn-yusuf) ordered a count
      of the realm, as his grandfather's grandfathers had done after every war: how many souls, of what
      tongue, of what faith. The scribes worked through Ṣafar, and their reckoning is set down here, because
      it is the measure of everything this book is about.


      In the valley of the great river, the lands won from Qashtāla in 749, seven of every hundred souls had
      been Andalusī at the Peace of [Qurṭuba](place:qurtuba). On the eve of the Marīnid war it was
      thirty-three. In faith the change was slower: eight in a hundred had been Muslim in 749, and nineteen
      were by the eve of the war. Twelve towns of the valley now counted themselves Andalusī,
      [Qarmūna](place:qarmuna) the latest of them, on the eve of the war. Only one was yet Muslim by the
      greater part of its people, and that one was Qurṭuba. There the faithful had been twenty-seven in a
      hundred at the peace and were now fifty-nine. [Ishbīliya](place:ishbiliyya) had gone from fourteen to
      thirty-one and [Jayyān](place:jayyan) from none to thirty. Úbeda, at the far end of the valley, had gone
      from none to ten. It had heard the call last.


      The northern shore taught the scribes something they did not like. [Qādis](place:qadis),
      [Sharīsh](place:sharish), [Shalūqa](place:shaluqa), [Jabal Ṭāriq](place:jabal-tariq) and [al-Jazīra
      al-Khaḍrāʾ](place:al-jazira-al-khadra) had been Castilian towns when Fās took them five years before.
      They came back to the house of Naṣr already Muslim by the greater part of their people. In five years
      the Marīnids had done there what twenty years of libraries and madrasas had not done in the valley. The
      ʿulamāʾ of [Gharnāṭa](place:gharnata) praised it. The older men of the dīwān asked how it had been done.
      They reminded the court that there is no compulsion in religion, and that what is made by the sword can
      be unmade by the sword.


      Across the whole realm the count was this. Of seven hundred and forty-nine thousand souls, three hundred
      and sixty-eight thousand were Muslims and three hundred and thirty-three thousand Christians, with
      forty-seven thousand Jews beside them. Four hundred and seven thousand were Andalusīs and two hundred
      and eighty-nine thousand Castilians. The Muslims had been the larger faith before, by a few thousand,
      and lost that place when the Portuguese south came in. Now they held it by thirty-five thousand. The
      realm of Gharnāṭa was Muslim by the count of its own people, and not only by the faith of its prince.


      The call has been made. It is being answered, slowly, in Arabic first and in prayer after, and town by
      town. The madrasas will go on teaching for a hundred years. This book will go on as long as they do.


      *Invite to the way of your Lord with wisdom and good instruction.*
    behind: >-
      The figures in Book IV come from the population of every location Granada held at each checkpoint from
      June 1349 to September 1370, summed by culture and religion. "The valley of the great river" means the
      locations of the game's Andalusia area that Granada held at the time. The 1370 figures also include the
      north shore taken from Morocco, which is why the valley's Muslim share jumps from 19% to 25% in the last
      two years.


      A town "turns" when the game changes its main culture or religion, and the date given is the first save
      that shows the change. In Qurṭuba, Muslims outnumbered Christians on 2 October 1366 (18,239 to 17,968)
      and became an outright majority by May 1368. The mosque-cathedral is the game's cathedral building,
      which Qurṭuba had in 1370.


      Invented colour: Saʿd's question about the cathedral and his remark about silver left in the ground, the
      Badr answer to the ʿulamāʾ, Yūsuf's answer to the nobles about Khadīja and ʿĀʾisha, and the court's
      unease about how Fās converted the north shore. The save shows that it did, but not how.
