date: '1365-07-01'
title: The Portuguese south
source:
  save: autosave of 1 July 1365 (compressed)
  game: 1.4.5
summary: >-
  Portugal made a separate peace on 11 September 1364 and gave up the Algarve and the lower Alentejo, thirteen
  towns, which the court means to make a vassal after the war. Saʿd is now called Conqueror and has a daughter
  by Aiman. The realm is 56 towns and 709,000 people, majority Catholic again with the Portuguese. Castile and
  Aragon fight on. Shares of power are estimated from the 1 June 1349 reading.
