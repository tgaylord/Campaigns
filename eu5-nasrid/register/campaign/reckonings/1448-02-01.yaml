    covers:
      - 1447-06-13-the-call-of-tunis
      - 1447-08-06-battle-ozieri
      - 1447-09-09-battle-corsica-west-coast
      - 1447-09-11-battle-gulf-termini
      - 1447-10-05-battle-grasse
      - 1448-01-13-the-prince-raids-naples
    text: >
      On 28 Rabīʿ al-Awwal 851 the Ḥafṣid sultan of Tūnis declared war on the king of Ṣiqilliya for Balarm and
      its province. Balarm had been a city of the faith for more than two centuries before the Normans took
      it, and the assembly of Tūnis had voted for the war. The same day the sultan's letter came to
      [Ishbīliya](place:ishbiliyya) calling the Emperor to arms.


      The dīwān did not take long over it. Sicily had Athens and Negroponte behind it, and its allies Genoa
      and the Pope would come in, Genoa bringing Arborea, Corsica and the rest of its little subjects. The
      heir [Ismāʿīl](person:ismail-ibn-muhammad-ibn-ismail) said what the court had said of every such call
      since his grandfather's time: an alliance that is not answered is not an alliance. The Emperor
      [Muḥammad](person:muhammad-ibn-ismail-ibn-saad) accepted, and the seven ṭāʾifas came in with him that
      day. The old king of Aragon, [Rodrigo de Borja](person:rodrigo-de-borja), was Ismāʿīl's uncle and
      sixty-six years old. He took the field himself in the early summer and gave up his command a month
      later.


      The summer went badly for the allies. Al-Andalus itself had not yet fought. On 23 Jumādā al-Ūlā, at
      Ozieri in Sardinia, Arborea's four thousand broke the Gallurese, Tūnis's vassals, who lost half their
      men. On 27 Jumādā al-Ākhira two Sicilian ships drove three of al-Burtughāl's off the western shore of
      Corsica. Two days later, in the gulf of Termini, a day's sail from Balarm, six Genoese ships fell on the
      combined fleet of Tūnis, Ṭarābulus and Qābis, twenty-eight sail. Nineteen were lost, to one of Genoa's.
      The Ḥafṣid sultan wrote to Ishbīliya that the Genoese were few and the sea was wide, and asked for
      ships.


      On 24 Rajab [Aḥmad](person:ahmad-ibn-yusuf-ibn-ismail), lord of Banbalūna, who was fifty-one years old,
      found four thousand two hundred Genoese at Grasse in the hills of Provence. He had three hundred and
      eighty-five men, and he attacked anyway. Twenty-nine came back. He did not explain himself to the dīwān,
      and the men of Banbalūna said afterwards that their lord had grown hard.


      The Emperor's grandson [Yūsuf](person:yusuf-ibn-ismail-ibn-muhammad) was the one who answered the
      sultan. He had been admiral since he was sixteen, made so by a grandfather who believed the sea had made
      a man of him. In the winter, at twenty-six, he took the eleventh squadron out and raided along the
      coasts of Nābulī. His galleys were in and out again before the coast guards had their sails up. On 6 Dhū
      al-Qaʿda 851 the chancellor reported to the Emperor that the captains of the squadron called the prince
      an accomplished sailor, and that ships under him reached where they were going sooner than ships under
      any other man.


      The Emperor had the report read to him twice. His son Ismāʿīl said only that Yūsuf had his grandfather's
      love of the sea and, he hoped, his father's judgement of when to leave it.


      *And do not weaken in pursuit of the enemy. If you should be suffering, so are they suffering as you are
      suffering, but you expect from God that which they expect not. And God is ever Knowing and Wise.*
    behind: >-
      This note covers three entries: the envoys and the Umayyad borders, the lady Isabel and the bridges, and
      the war for Palermo.


      **What the saves show.** Two saves, 28 March and 5 October 1447.

      - *The treasury:* 570 in the autosave of 1 February, 2,680 on 28 March, 216 on 5 October. Income runs at
      about 425–435 a month against about 365–380 out, and there is no debt in any of them, so the saves don't
      say where the 2,100 between February and March came from. The entry says only that the treasury was full
      in the spring. Trent, if you know, it's worth a line.

      - *Where it went:* between March and October, six bridges (Alcántara, Medellín, Villanueva de la Serena,
      Valencia de Alcántara, Brozas, Jaraicejo); gunsmiths at Jaén, Santarém and Badajoz; tanneries at Córdoba
      and Lleida; two levels of glassworks at Seville; a distillery at Jerez; a lumber mill at Écija; a winery
      at Castellón; a cannon foundry at Girona. Between February and March, potteries at Valencia, cloth and a
      tannery at Córdoba, and a furniture workshop at Cervera. The entry gives them to Aḥmad, as Trent asked
      for the earlier building.

      - *The house:* Isabel de Montsoriu died of old age on 19 August 1447, her sixty-fifth birthday. Fāṭima
      was born on 29 June 1447 to Saʿd ibn Aḥmad of Banbalūna and Muʾmina, Prince Aḥmad's daughter. Aḥmad of
      Banbalūna is marked ruthless in October. The scholar of Delhi, the scholar of Iraq and the Tandroy lord
      (Matoky, of the Fahambahy) are new at court since February.

      - *The war:* Tunis's war is the game's "2nd Tunis–Sicily War", fought for the province of Palermo, with
      a war goal granted by Tunis's parliament. The sides and the four battles are from the October save.
      Al-Andalus's own forces had not fought by then. In the Gulf of Termini the save records the Genoese
      attack as not carrying the day, but the allies lost 19 ships to Genoa's 1. The entry gives the losses
      and names no winner. Rodrigo de Borja, king of the Ṭāʾifa of Aragon, held a general's command from 2
      July to 5 August 1447.

      - *The explorer:* his commission ran from 30 October 1445 to 1 October 1447 in the save. Trent's account
      dates his sailing for the cape, to leave an outpost, to 5 October.


      **From Trent's screenshots and account.** The Tīmūrid stagnation (27 March); the call from Tunis and "We
      are accepting" (13 June); "Presence in Europe" with the choice "We have arrived" and what it unlocks (1
      August); the Umayyad Caliphate's borders; and Yūsuf raiding the coast of Naples, with the Accomplished
      Sailor report (13 January 1448).


      **The Umayyad borders.** The game's term covers 2,816 locations: Iberia, the Maghrib (Sūs, Morocco, the
      Atlas plateau, Algiers, Tunis, Tripolitania and the desert areas), and the regions of Egypt, the Fertile
      Crescent, Arabia and Persia. In the October save:

      - Iberia is al-Andalus and its ṭāʾifas, apart from five Moroccan locations and Andorra.

      - The Maghrib is Morocco (with Algiers as its fiefdom and Touat as its vassal) and Tunis (with its
      tributaries and governorships), plus Fezzan and a few independents in the desert.

      - Egypt and most of the Crescent are the Mamlūks'.

      - Arabia is split among the Mamlūks, Mecca, Lām, Yemen and smaller lords.

      - Persia is mostly the Tīmūrids' (350 locations).


      So outside Persia and Arabia almost every claimable location belongs to an ally or an ally's subject.
      The entry leaves the court undecided, as Trent hasn't decided.


      **Invented colour.**

      - *Envoys entry:*
        - the news reaching the court by the Mamlūk post;
        - the Tabrīz merchants;
        - where the envoys came from;
        - the Emperor reading of ʿAbd al-Raḥmān II the night before, and enjoying the audience;
        - Ismāʿīl calling the answer a promise;
        - the jurists drawing up the claim;
        - the map in the dīwān;
        - Ismāʿīl's remark about the sword in the scabbard;
        - the Mamlūk party's objection;
        - Aḥmad studying the roads.
      - *Isabel entry:*
        - the court's view of the birth;
        - Isabel coming south as a girl;
        - the Emperor's ceremony of mourning;
        - Aḥmad mourning by working, and his mother praising his drawings;
        - the purpose of the bridges;
        - the second bridge at al-Qanṭara (the Roman bridge at Alcántara is real history);
        - the pages following the Tandroy lord.
      - *War entry:*
        - why Tunis wanted Palermo, beyond the parliament's war goal;
        - the dīwān's quick decision and Ismāʿīl's saying;
        - the sultan's letter asking for ships;
        - why Aḥmad of Banbalūna attacked, and his men's verdict;
        - Yūsuf's raids being quick;
        - the captains' words (the game's text is the chancellor's report and the trait);
        - the Emperor having the report read twice, and Ismāʿīl's remark.
