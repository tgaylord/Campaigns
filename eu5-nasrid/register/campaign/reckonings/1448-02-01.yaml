tellings:
  - id: 0851-11-06-of-the-war-for-balarm-and-the-prince-at-sea
    'on': '1448-01-13'
    title: Of the War for Balarm and the Prince at Sea
    verse: 4:104
    who:
      - yusuf-ibn-ismail-ibn-muhammad
      - ismail-ibn-muhammad-ibn-ismail
      - muhammad-ibn-ismail-ibn-saad
      - ahmad-ibn-yusuf-ibn-ismail
