date: '1448-02-01'
title: The Prince's Galleys
source:
  save: autosave of 1 February 1448 (compressed)
  game: 1.4.7
summary: >-
  From an autosave, eight months into the Tunisian war for Palermo. The winter's fighting was at sea: Genoa
  and Sicily destroyed Annaba's fleet in the Gulf of Asinara (25 November), Genoa lost 26 of 31 ships
  attacking Tunis's 88 in the Gulf of Oristano (16 December), and the prince Yūsuf's eight ships sank an
  Athenian off Terracina and two Sicilians in the Gulf of Termini (5 and 13 January). On land the allies lost
  again at Oristano and at Toulon, where Burgos's small army was destroyed. The Emperor's own army has not
  fought. The treasury is 376; stability 11.9; the fleet has added a war galley and six hulks. Estate power
  estimated from the reading of 16 November 1428.
