tellings:
  - id: 0860-03-29-of-the-grand-alliance
    'on': '1456-03-07'
    title: Of the Grand Alliance
    book: book-of-the-franks
    verse: '3:173'
    who:
      - ismail-ibn-muhammad-ibn-ismail
      - ahmad-ibn-muhammad-ibn-ismail
      - ahmad-ibn-ismail-ibn-saad
      - saad-ibn-ahmad-ibn-ismail
    where:
      - ishbiliyya
      - qunka
    covers:
      - 1447-08-01-the-grand-alliance-founded
      - 1451-02-17-hungary-joins-the-alliance
      - 1454-06-02-cuenca-to-come-under-the-crown
      - 1454-12-18-an-envoy-at-istanbul
      - 1456-01-04-death-of-ahmad-of-liyun
      - 1456-03-07-the-madrasas-of-burtuqal-and-sicily
