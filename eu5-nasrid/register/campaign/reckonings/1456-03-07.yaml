date: '1456-03-07'
title: The Grand Alliance
summary: >-
  From a save, a screen and Trent's account. By March 1456 the Christian league the Angevins founded in 1447
  stands eight strong: the Angevins, Hungary, Viennois, Savoy, Arborea, Genoa, Montferrat and Mondovì. The court
  reads it as a threat and sends envoys to Istanbul (Trent). Meanwhile the ʿulamāʾ built eleven madrasas in
  Portugal and Sicily, Cuenca's integration began, and Aḥmad, ruler of the Ṭāʾifa of Liyūn, died after a fall
  and was succeeded by his son Saʿd.
