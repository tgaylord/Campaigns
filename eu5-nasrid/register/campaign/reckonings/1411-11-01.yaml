date: '1411-11-01'
title: The Peace of Rajab
source:
  save: SP_ADU_1411_11_01 (compressed)
  game: 1.4.7
summary: >-
  On 1 November 1411 (14 Rajab 814) the War of Jillīqiya, the fourth war of the Istirdād, ended with the Peace
  of Rajab. Portugal was annexed whole and Qashtāla gave up 63 towns, Old Castile, León and Navarre; what is
  left of Qashtāla, 45 towns, is ruled from Oviedo. The conquests were given out at once as four new ṭāʾifas:
  Burtuqāl (the old Portugal) to the Emperor's cousin Aḥmad, Liyūn to the Emperor's son Aḥmad, Burghush (Old
  Castile) to Khālid ibn Yaḥyā Raḥḥū, and Banbalūna (Navarre) to the Emperor's cousin Yūsuf. The crown keeps
  161 towns and 2,042,000 people, with nine ṭāʾifas under it. Europe is horrified, all but Paris. Treasury
  816, income 220 against 303. Shares of power are estimated from the 1 June 1349 reading.
