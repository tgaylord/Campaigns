      The Catalan Merchant Privileges come back into force, sixty-four years after the war of the three crowns
      ended them. With Catalonia, Aragon and Valencia all ṭāʾifas of the crown, al-Andalus can no longer be at
      war with the Catalans, and the privileges can no longer be lost
