tellings:
  - id: 0749-08-09-of-wages-medicines-and-maids
    'on': '1348-11-02'
    title: Of Wages, Medicines and Maids
    verse: '9:51'
    who:
      - yusuf-i
    where:
      - washqa
      - antaqira
      - balansiyya
      - shatiba
      - qandiya
      - muyaqar
      - ishbiliyya
    covers:
      - 1348-07-01-plague-spread
      - 1348-07-01-wage-fixing
      - 1348-09-01-expired-medicaments
      - 1348-11-01-maid-draft
      - 1348-11-02-plague-toll
    text: >
      By the beginning of Rabīʿ al-Thānī the pestilence was in [Washqa](place:washqa) in the north and
      [Antaqīra](place:antaqira) in the west, and in the mountain villages of the Alpujarra. In
      [Balansiyya](place:balansiyya) it was in [Shāṭiba](place:shatiba) and [Qandiya](place:qandiya). The
      realm counted seventeen thousand fewer souls than in the autumn before. That was only the beginning,
      though no one yet knew it.


      The plague killed the poor first and fastest, for they lived closest together. Within a season the
      masters of the workshops and the owners of the fields were crying that there were no hands to hire.
      Those labourers who were left knew their worth and asked double. In [Muyaqar](place:muyaqar) and the
      towns around it the guilds agreed among themselves to hold wages where they had been, and the labourers
      came to the governor to complain of it. The sultan was asked to judge. He sided with the guilds, for a
      realm at war cannot let its wages run wild, and the judgment went out in the words the guild masters had
      asked for: the labourers must be shown their place. Those about him said he gave it with a heavy face,
      and that winter bread was handed out at the gates of Muyaqar, paid for from his own purse and not the
      treasury's. The labourers went back to work. They did not forget, and their grumbling spread across the
      realm further than the governor reported.


      In Jumādā al-Ākhira the physicians of the houses of healing came to the sultan with a darker complaint.
      Half the medicines sold in the markets were spoiled, they said, or cut with chalk and flour by merchants
      who had seen that a frightened man will pay anything. Worse, such filth might itself carry the sickness
      from house to house. The sultan ordered them burned. Officers went through the markets of the realm,
      whose trade all answers to the great market of [Ishbīliya](place:ishbiliyya) beyond the frontier, and
      nearly half the medicines in that whole trade went onto the fires. The merchants wept and the crown paid
      them a little to quiet them. The physicians said it was the best order of the year.


      In Shaʿbān the nobles came to the sultan with their own complaint. No servant would enter the house of a
      sick nobleman for any wage, and the great houses were left with no one to carry the water or wash the
      dying. They asked for the right to draft servants from among the common people. The sultan needed the
      nobles, who led his levies, more than he needed the goodwill of the villages. He granted it, and of all
      his orders that year it was the one he liked least. Men and women of the villages were taken from their
      fields to serve in houses where the plague already was.


      On the ninth of Shaʿbān the dīwān's account stood thus. The sickness had touched eleven of the realm's
      towns and the pestilence itself had killed nine thousand of its people. In all the known world it had
      carried off more than twenty million since it rose at Yāyiq. Some at court hoped the worst had passed.


      They were wrong.


      *Say: Never will we be struck except by what Allāh has decreed for us. He is our protector, and upon
      Allāh let the believers rely.*
  - id: 0749-11-07-the-peace-of-qurtuba
    'on': '1349-01-27'
    title: Of the Peace of Qurṭuba
    verse: 8:61
    who:
      - yusuf-i
      - alfonso-xi
    where:
      - qurtuba
      - ishbiliyya
      - jayyan
      - istijja
      - al-qusayr
      - balma
      - wubira
      - mursiyya
      - gharnata
    covers:
      - 1348-09-02-portugal-peace
      - 1349-01-27-peace-of-qurtuba
      - 1349-01-27-tributary-in-name
      - 1349-01-27-realm-doubled
      - 1349-01-27-unrest
    text: >
      In Jumādā al-Ākhira of the year 749 the first crown fell away. Portugal had lost no army and hardly a
      ship, but fifty-five thousand of its people had died in the years of the war. It made a separate peace
      with the Marīnids and annulled for ten years every treaty it had with Qashtāla. It paid reparations and
      gave a hundred and forty gold pieces to the allies besides. [Alfonso](person:alfonso-xi) of Qashtāla was
      left with Arghūn alone beside him, and Arghūn's best fleet lay at the bottom of the sea off Cape Ben
      Sakka.


      The pestilence did not take sides. It came into Qashtāla as it had come into [Gharnāṭa](place:gharnata),
      and it found the Castilian armies in their winter camps, crowded, hungry and beaten. The levies deserted
      to bury their families. The captains wrote to the king that they could not hold the frontier. And at the
      beginning of Dhū al-Qaʿda in the year 749 the envoys of Alfonso came, not to the Marīnid sultan, who had
      begun the war, but to our lord [Yūsuf](person:yusuf-i), who had won it. They asked for a separate peace
      with Gharnāṭa alone.


      The sultan received the envoys standing, with the scar of al-Manṣūra still red across his face. He named
      his terms once, town by town, in a level voice, and when the Castilians began to bargain he left them
      with his secretary and went out to his other business. The dīwān expected the terms to be refused.
      Before evening the envoys had sent after him. On the seventh of Dhū al-Qaʿda the Peace of
      [Qurṭuba](place:qurtuba) was sealed. Qashtāla gave up twenty-three towns along the river and in the
      hills of the frontier:


      - Qurṭuba of the caliphs, lost a hundred and twelve years before;

      - [Ishbīliya](place:ishbiliyya), lost a hundred years before;

      - [Jayyān](place:jayyan), where the tyrant had been broken;

      - Ubbadha al-ʿArab, Bayyāsa and [Istijja](place:istijja), and al-Yusāna, Martush and Ūshūna;

      - [al-Quṣayr](place:al-qusayr) and [Balma](place:balma), where the sultan had won his victories;

      - [Wubīra](place:wubira) of the old Naṣrid claim, and others besides.


      The Ṭāʾifa of [Mursiyya](place:mursiyya) took the whole of its own land, eleven towns more. Qashtāla
      paid reparations in gold and annulled its treaties with Arghūn. In return Gharnāṭa took again the name
      of Qashtāla's tributary.


      It was only a name. The realm that had held nineteen of the seventy-two towns of the Strait's three
      lands now held fifty-three. It had been eighteen towns and was now forty-one. Its souls had been three
      hundred and seventy-seven thousand, after the plague's first year, and were now seven hundred and
      fifty-four thousand. But nearly half of them were Castilian Christians who had gone to sleep subjects of
      Alfonso and woken subjects of the house of Naṣr. They had not been asked, and they had buried their own
      dead that winter.


      The realm was greater than at any time since the house of Naṣr was founded, and it was not at peace with
      itself. War and plague had shaken every estate, and the realm was more unsettled than at any time in the
      reign. In the new lands the bells still rang for the Christian dead. The Marīnids fought on alone. The
      sultan had made the peace his victories had earned, and Fās would have to make its own.


      *And if they incline to peace, then incline to it also, and rely upon Allāh.*
    behind: >-
      Battle numbers are from the saves of 14 September 1347, 1 July 1348 and 27 January 1349; battles got
      prose by size, since the save doesn't record war score per battle. The turns of the story are Trent's
      reading. The deserting levies, the guards at al-Manṣūra, the sultan's manner with the envoys and
      Sulaymān Bey's courtesy are colour; the Ottoman reply is quoted from the event.
