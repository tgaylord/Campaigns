tellings:
  - id: 0739-11-14-the-road-through-mursiyya
    'on': '1339-05-24'
    title: Of the Road through Mursiyya, and the Host of Ibn al-Khaṭīb
    verse: '65:3'
    who:
      - yusuf-i
      - ibn-al-khatib
      - gideon-ben-joshua
    where:
      - gharnata
      - mursiyya
      - ishbiliyya
      - qarmuna
      - shaluqa
    covers:
      - 1338-11-01-battle-ishbiliyya
      - 1338-11-09-tunis-joins
      - 1339-02-03-alliance-tunis
      - 1339-02-28-battle-shaluqa
      - 1339-03-10-battle-ishbiliyya
      - 1339-03-25-battle-qarmuna
      - 1339-04-06-battle-shaluqa
      - 1339-05-14-death-gideon
      - 1339-05-24-cb-aragon
      - 1339-05-24-murcia-held
      - 1339-05-24-war-on-aragon
      - 1339-05-24-ibn-al-khatib-commands
    text: >
      Of the war that the Marīnid sultan made upon Qashtāla, there is little to tell that gladdens the heart.
      In Rabīʿ al-Thānī of the year 739 the Castilians met the men of Fās beneath the walls of
      [Ishbīliya](place:ishbiliyya), nearly eighteen thousand against fewer than four, and the field was
      theirs. That winter and spring they won again at [Shalūqa](place:shaluqa), at Ishbīliya a second time,
      at [Qarmūna](place:qarmuna), where six hundred men of the Maghrib stood against twelve thousand, and at
      Shalūqa once more. Five times the infidel prevailed, and five times the banners of the Maghrib went back
      across the plain. Tūnis entered the war in that same Rabīʿ, bringing Ṭarābulus, Qābis, Qafṣa, Tuqqurt
      and Bijāya behind it. On the twenty-second of Rajab our lord bound himself to the Ḥafṣids by alliance,
      as he was already bound to them by marriage.


      Yet Allāh gives openings where men see only walls. While the Castilian hosts were busy in the west, the
      Tunisians took [Mursiyya](place:mursiyya) with its fortress and the country around it. For a season,
      therefore, there ran a road from our own marches eastward to the frontiers of Arghūn, where a Christian
      king holds lands that were once al-Andalus. Our lord knew that such a road would not stay open long.


      In the court there was one small sorrow. On the fourth of Dhū al-Qaʿda [Gideon ben
      Joshua](person:gideon-ben-joshua), the Jewish burgher, a man quick with figures and quicker with the
      cup, missed his footing on a stair and did not rise again.


      Ten days later, on the fourteenth of Dhū al-Qaʿda in the year 739, the claim was made good.
      [Gharnāṭa](place:gharnata) would reclaim from Arghūn what belonged to al-Andalus, and
      [war](war:war-on-aragon) was proclaimed, the first that Gharnāṭa had made in its own name in this reign.
      Command of the host went to [Muḥammad ibn al-Khaṭīb](person:ibn-al-khatib), who was twenty-five years
      old and had no equal at court in counsel or in arms. Under him marched nearly ten thousand volunteers of
      the towns and the mountains, twelve hundred regulars of the sultan, and twelve hundred hired swords.
      With them went a baggage train of three hundred and fifty, so that the army might still eat when the
      road through Mursiyya closed behind it.


      *And whoever puts his trust in Allāh, He suffices him.*
    behind: >-
      The save has the casus belli against Aragon, dated the day of the save; the declaration, the host and
      Tunis taking Murcia are Trent's account (the save credits the occupied Murcia area to Morocco, the war
      leader). The host's figures follow the correction from the 2 September 1339 save (about 9,890
      mutaṭawwiʿa, 1,200 regulars and 1,200 mercenaries), not Trent's first count.
