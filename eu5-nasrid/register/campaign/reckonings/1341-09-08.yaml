tellings:
  - id: 0742-03-25-the-defection-of-ibn-al-khatib
    'on': '1341-09-08'
    title: Of the Defection of Ibn al-Khaṭīb
    verse: '3:8'
    who:
      - ibn-al-khatib
      - yusuf-i
      - ismail-ibn-ismail
      - yusuf-ibn-muhammad
    where:
      - uryula
      - balansiyya
      - gharnata
    covers:
      - 1341-07-08-ibn-al-khatib-castile
      - 1341-09-08-cabinet
      - 1341-09-08-loans
      - 1341-09-08-burghers
      - 1341-09-08-sovereignty
      - 1341-09-08-valencia-conversion
    text: >
      The chronicler must now set down what he would rather leave out.


      [Muḥammad ibn al-Khaṭīb](person:ibn-al-khatib) was the ablest man at the court of Gharnāṭa. In counsel,
      in letters and in war there was no one to match him. It was he who led the host down the road through
      Mursiyya and broke the Aragonese on the Day of [Uryūla](place:uryula). If the Peace of
      [Balansiyya](place:balansiyya) had a father after Allāh and the sultan, it was he. In Ṣafar of 741 he
      came home with the army, and the people of [Gharnāṭa](place:gharnata) threw flowers under his horse.


      Some time in the winter or the spring that followed he left the realm. He did not go to Fās, as an
      unhappy courtier of Gharnāṭa might, or to Tilimsān or Tūnis. He went north to Qashtāla. In Muḥarram of
      the year 742 he appears in the rolls of the Christian king's fleet as an admiral of Qashtāla. He had
      taken the faith of the Cross, and with it a Christian name, Frederick.


      The chronicle does not know why. No letter of his survives in the dīwān, and the sultan has not spoken
      of it in the hearing of any scribe. Some at court say he was slighted after the peace, when the honours
      went to princes of the blood and not to the man who had won the war. Others say Qashtāla had been paying
      him all along, and that the bluff before Shāṭiba was his to expose and he chose not to. Still others say
      only that a man of such gifts was too large for so small a kingdom. Allāh knows best what is hidden in
      the hearts. The chronicler records the fact and leaves the judgment to the One who judges.


      The court went on without him. [Ismāʿīl ibn Ismāʿīl](person:ismail-ibn-ismail), the sultan's young
      brother, took the seat in the dīwān for strengthening the government, in place of their cousin [Yūsuf
      ibn Muḥammad](person:yusuf-ibn-muhammad). Three more loans were repaid to the estates, and the debt fell
      to seven hundred and sixty-four. The treasury held ten dīnārs. The burghers soured that year, from
      content to sullen, and they had cause. The crown, hungry for every dīnār, had raised the tariffs at the
      ports and the gates and trimmed what it paid out wherever it could, and it was the merchants who paid.
      Nor had they forgiven the war with Arghūn. It had broken the ties with the Catalan traders through which
      so much of the silk of Gharnāṭa was sold, and those ties were slow to mend. The realm's sovereignty
      slipped to within a breath of the half. In the Ṭāʾifa of Balansiyya the call to prayer was heard in more
      streets every month: fifty-two thousand Muslims now, where there had been forty-five, and the Christians
      fewer by eight thousand.


      *Our Lord, let not our hearts deviate after You have guided us.*
