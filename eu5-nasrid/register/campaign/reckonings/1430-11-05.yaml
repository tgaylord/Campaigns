date: '1430-11-05'
title: The Ṭāʾifas of the North
source:
  save: SP_ADU_1430_11_05 (compressed)
  game: 1.4.7
summary: >-
  Two days after the Peace of Ṣafar the conquered north is settled. Old Asturias goes to Liyūn (now 35 towns),
  Cantabria to Burghush (38) and the Basque coast to Banbalūna (28), and the other 23 towns of Galicia, from
  Santiago, are made a ṭāʾifa again under Diego Sotomaior, a Galician Muslim. The crown keeps 196 towns and
  2.59 million people; eight ṭāʾifas hold 236 towns and nearly 4 million more. The whole peninsula belongs to
  the Emperor and his ṭāʾifas, and the courts of the world rank the empire third, behind al-Ṣīn and the
  Angevins. Estates estimated from the reading of 16 November 1428. Treasury 753.
