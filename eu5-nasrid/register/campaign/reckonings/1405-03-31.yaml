summary: >-
  On 2 March 1405 the Emperor Saʿd died on the march through Moya, and his son Ismāʿīl, thirty-eight, became
  Emperor and Sultan of al-Andalus; sixteen days later he broke the Kingdom of Toledo's army before Qūnka. By
  the law of primogeniture his heir is his eldest son Muḥammad, twenty, with the able Saʿd, twelve, behind
  him. His brother Yūsuf takes his old seat in the dīwān. The risings of 807 go on: al-Andalus holds 100 towns
  and 1,284,000 people directly. Treasury 291, income 217 against 177; 35 regiments in the field. Shares of
  power are estimated from the 1 June 1349 reading.
