  - id: 0807-09-16-of-the-risings-of-807-and-the-death-of-the-emperor-saad
    'on': '1405-03-18'
    title: Of the Risings of 807, and the Death of the Emperor Saʿd
    book: book-of-the-marches
    verse: 55:26-27
    who:
      - saad-ibn-yusuf
      - saad-ibn-ismail
      - ismail-ibn-saad
      - muhammad-ibn-ismail-ibn-saad
      - saad-ibn-ismail-ibn-saad
      - saad-ibn-yusuf-ibn-saad
      - yusuf-ibn-saad
      - bernarda-of-murcia
    where:
      - shantarin
      - yabura
      - majrit
      - shalamanka
      - tulaytula
      - al-ushbuna
      - batalyaws
      - marida
      - qunka
      - barshaluna
      - saraqusta
      - ishbiliyya
      - al-mariyya
    covers:
      - 1404-10-22-peace-of-avignon
      - 1405-01-01-the-risings
      - 1405-03-02-death-of-the-emperor
      - 1405-03-02-accession-of-ismail
