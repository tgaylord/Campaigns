    text: >
      The Pope's gold was barely counted when the dīwān turned back to Qashtāla. Since Shawwāl its scribes had
      been drawing up a new claim on the lands the Castilians still held, and by Rabīʿ al-Thānī 807 the work
      was well advanced. The ʿulamāʾ had begun to speak of the fourth war of the Istirdād. It did not come
      that winter, because the north rose first.


      On 28 Jumādā al-Ākhira 807 the lands taken from Portugal at the Peace of Ramaḍān proclaimed a kingdom of
      their own, which they called Estremadura, from [Shantarīn](place:shantarin) on the Tagus to
      [Yābura](place:yabura) and Elvas. On the same day the country of [Majrīṭ](place:majrit) and La Mancha
      rose as a Kingdom of Toledo, thirty towns from Alcalá and the Escorial down to Ciudad Real and Caravaca.
      The next day the Leonese of [Shalamanka](place:shalamanka) rose against their own ṭāʾifa and its ruler,
      the Emperor's cousin [Saʿd ibn Ismāʿīl](person:saad-ibn-ismail), and set up a lordship at Ciudad
      Rodrigo. Forty-eight towns of the crown went over in two days, and sixteen of Shalamanka with them. The
      iron of the Escorial and the gems of Qrabaqa went with them. [Ṭulayṭula](place:tulaytula) held, and
      [al-Ushbūna](place:al-ushbuna), and Setúbal, Cáceres, [Baṭalyaws](place:batalyaws) and
      [Mārida](place:marida). Some at court said this was what the Pope had been waiting for all along. Others
      said the Christians of the north had simply looked at an emperor of fifty-six who had just spent a
      summer in France, and decided their moment had come.


      The Emperor marched north at once. He took the army up through the Ṭāʾifa of [Qūnka](place:qunka) toward
      the rebels of Toledo, and he was with it on 29 Shaʿbān 807, the eve of Ramaḍān, as it passed through
      Moya. There he died. He was fifty-seven, and he had reigned for forty-one years. The army was on the
      march, the enemy was in front of it, and he had spent the day in the saddle. The soldiers said he could
      not have wished for anything else.


      Consider what he left. He came to the throne at fifteen, lord of forty-three towns, with twenty-four
      dīnārs in the treasury and an income of fifty-two a month against expenses of eighty-nine. He left a
      hundred and forty-eight towns under the crown before the risings, six ṭāʾifas under his hand from
      Shalamanka to [Barshalūna](place:barshaluna), an income of more than two hundred and forty dīnārs a
      month and two hundred and eighteen in the treasury, and an empire the courts of Christendom ranked among
      their first six. He had restored al-Andalus and taken the style of Emperor. He had won back the north
      shore of the Strait, Ṭulayṭula, [Saraqusṭa](place:saraqusta) and al-Ushbūna, and he had taken Avignon
      from the Pope.


      The court had called him the Conqueror since he was seventeen. It would be truer to call him the
      Builder. He moved the capital to [Ishbīliya](place:ishbiliyya) for its river and its market, and gave it
      a fleet, a chancery, banks, warehouses and jewellers. He gave the realm its four great offices, among
      them the Ḥisba to keep its weights honest. He built the mills and the forges and the workshops of the
      south, the acequias of the great river, the bridges of the north and the madrasas of the converts,
      eleven hammams from [al-Mariyya](place:al-mariyya) to Baṭalyaws, and the new heart of al-Andalus at
      Majrīṭ. He had the counts' books audited every year, paid the estates every dirham he owed them before
      he would march or go on pilgrimage, and would not change the law of succession even for the grandson he
      loved. When the clerks of the dīwān wrote up his reign, the words they chose were that his strong
      character had made the country a more honest place.


      A death answers many questions. The one he had left open answered itself. The crown passed by the law he
      had kept to his son [Ismāʿīl](person:ismail-ibn-saad), thirty-eight years old, with
      [Bernarda](person:bernarda-of-murcia) of Mursiyya beside him, and the heir was now Ismāʿīl's eldest,
      [Muḥammad](person:muhammad-ibn-ismail-ibn-saad), nineteen, slow still, but married and the father of
      three. The boy the old Emperor had hoped for, Ismāʿīl's second son
      [Saʿd](person:saad-ibn-ismail-ibn-saad), was twelve and doing all his teachers asked. Prince
      [Yūsuf](person:yusuf-ibn-saad) took his brother's old seat in the dīwān, and his son, the other
      [Saʿd](person:saad-ibn-yusuf-ibn-saad), went on with the costly education of the heirs, as gifted as
      ever. Whether the law would be changed was now for Ismāʿīl to decide, and Ismāʿīl had always been better
      at saying what men wished to hear than at telling them what he meant.


      He took up his father's war at once. The army went on from Moya, and on 16 Ramaḍān the self-styled king
      of Toledo threw five thousand men against it before Qūnka. More than three thousand of them fell. The
      new Emperor lost three hundred. It was his first battle as Emperor, and it was won by a man the court
      had never thought of as a soldier.


      *Everyone upon the earth will perish, and there will remain the Face of your Lord, Owner of Majesty and
      Honour.*
    behind: >-
      The six entries from August 1395 to March 1405 were written together during the chronicle sweep of
      November 2026. Their facts come from the saves and Trent's screens as logged in the events they cite.
      Saʿd's character follows his traits in the 1405 save (conqueror, entrepreneur, hardy warrior,
      incorruptible), and the "more honest place" is the game's death notice. Trent's reading, that the
      Conqueror became the nation's greatest builder, is the thread of the obituary.


      Invented colour: the Emperor's remarks (the lance and the pen, the crossroads town, the assayers "paid
      to find", the merchant who tells the market, the Pope's city as a lesson); the chancery's pay and its
      ban on gifts; Ismāʿīl reading the letters to Paris; the Emperor riding out to the first water at
      Qarmūna; his refusal to hand the army to a general in 806; the crown prince's fair words to his nephew;
      and the soldiers' words at Moya. The game gives no detail of how Avignon fell or how Saʿd died beyond
      the place.
