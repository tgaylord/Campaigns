date: '1379-12-02'
title: The Capital at Ishbīliya
source:
  save: SP_ADU_1379_12_02 (compressed)
  game: 1.4.6
summary: >-
  By the end of November 1379 the capital has moved from Gharnāṭa to Ishbīliya, decided by the Jamāʿa in
  April. New roads tie the city to Sharīsh, Mālaqa, Baṭalyaws and Ṭulayṭula, paid for with five loans from the
  estates (565 in all); seven stretches are finished. The crown's grip on Seville has risen from 60% to 67%;
  it will take years to spread. The whole dīwān is integrating the new lands. The game recorded no historical
  capital at Gharnāṭa. Shares of power are estimated from the 1 June 1349 reading.
