tellings:
  - id: 0780-01-02-of-tulaytula-and-the-count-of-the-christians
    'on': '1378-05-01'
    title: Of Ṭulayṭula, the Gem of Iberia, and the Count of the Christians
    book: book-of-the-call
    verse: '5:48'
    who:
      - saad-ibn-yusuf
    where:
      - tulaytula
      - qurtuba
      - mursiyya
      - gharnata
    covers:
      - 1378-05-01-gem-of-iberia
      - 1378-05-count-of-the-christians
      - 1378-05-khilafat-qurtuba-renewed
      - 1378-05-governor-of-tulaytula
      - 1378-05-silk-of-gharnata
      - 1378-04-06-peace-castile
    text: >
      The year 780 opened with the Emperor in [Ṭulayṭula](place:tulaytula). The city stands on its rock in a
      bend of the Tagus at the centre of Iberia. It had been the capital of the Visigoths, then a city of
      Islam for three hundred and seventy years, and the seat of a ṭāʾifa king of our own faith, before
      Alfonso of Qashtāla took it in the year 478. For three centuries since, Christians, Muslims and Jews had
      lived in it side by side, more or less, and scholars of all three had sat in its libraries putting the
      books of the Arabs into Latin. Now it was the Emperor's again. Twenty-nine thousand souls lived in it,
      nearly all of them Christian.


      The court did not mean to hold it as a conquered city. On 2 Muḥarram 780 the Emperor declared that
      Ṭulayṭula would become the gem of Iberia, and every estate was set to the work: the ʿulamāʾ, the nobles,
      the merchants and the dhimmīs. The city's markets were rebuilt, and before the year was out its streets
      were busier and its merchants richer than they had been under Qashtāla. Ṭulayṭula and the towns of its
      land, Wādī al-Lubb, Illīshka, al-Yabānis, Muntalbān and the rest, were declared lands of al-Andalus in
      full, no longer conquests held by the sword. A governor was set over the city to see it done.


      The harder question was how to govern four hundred thousand Christians who had been Castilians a month
      before. The Emperor answered it from the history of [Qurṭuba](place:qurtuba). Under the Umayyads, the
      Christians of the capital had answered to the emir through one of their own: the *qūmis*, from the Latin
      *comes*, the Count of the Christians, who spoke for his community and was held to account for its taxes.
      A Christian judge beside him heard their cases by the old law of the Visigoths, and the Jews had a head
      of their own, the office Ḥasdai ibn Shaprūṭ had held under ʿAbd al-Raḥmān III. The treasury of the
      caliphs had found the arrangement cheap and sure. The Mālikī jurists had found it hard to bear that a
      Christian or a Jew should be set over revenue. The scholars of the court were already at work reviving
      the ceremonial of ʿAbd al-Raḥmān III, his robes of ṭirāz and his Friday sermon in the Great Mosque, and
      the count belonged to the same revival: the covenant of the dhimma, as the caliphs had kept it, set down
      again over the realm's Christians and Jews.


      The Emperor revived the office as the first new branch of the bureaucracy he had promised the conquered
      lands. He was clear about its terms. The counts would gather the dhimmīs' taxes more fully, their
      communities would be treated with more tolerance, and the ʿulamāʾ, though they would grumble, would have
      no real cause for complaint, since the call to Islam would not slow in the new lands. But the office had
      to be paid for, every year. If the crown let it starve, the jurists' objection would come back, the
      scholars' patience would wear thin, and conversion would falter. The Emperor meant to keep paying, and
      he meant to see what he paid for. Each count's books were to come to the dīwān once a year, to be
      audited by its own scribes dirham by dirham. He would not take a false account from his own treasurers,
      and he would not take one from a Christian count. The dhimmīs were glad to answer to one of their own.


      There was money for it, for once, because Qashtāla was paying reparations. Part of it went south. In the
      spring the Emperor spent five hundred dīnārs of Castilian gold to carry the famous silk of
      [Gharnāṭa](place:gharnata) into [Mursiyya](place:mursiyya), now in the crown's own hands: more mulberry
      groves, more silkworm houses, and more silk sent on to the markets of Europe, which had always paid well
      for it. Qashtāla, which had once taken tribute from the house of Naṣr, was now paying for its silk.


      *To each of you We prescribed a law and a way. Had Allāh willed, He would have made you one nation.*
  - id: 0781-08-13-of-the-move-to-ishbiliya
    'on': '1379-11-24'
    title: Of the Jamāʿa of 781, and the Court's Removal to Ishbīliya
    book: book-of-the-encircling-sea
    verse: '67:15'
    who:
      - saad-ibn-yusuf
    where:
      - gharnata
      - qurtuba
      - ishbiliyya
      - barshaluna
      - sharish
      - malaqa
      - batalyaws
      - tulaytula
    covers:
      - 1379-04-jamaa-of-the-capital
      - 1379-04-roads-to-ishbiliya
      - 1379-11-capital-at-ishbiliya
      - 1380-gharnata-historical-capital
    text: >
      When the Jamāʿa met in Muḥarram 781, the question before it was the one the conquests had been asking
      for ten years. The house of Naṣr had ruled from [Gharnāṭa](place:gharnata) for a hundred and forty
      years. The city had been chosen because the mountains defended it, and the mountains had kept the
      Christians out of it through every war since. But the frontier was no longer in the mountains. It ran
      now past [Ṭulayṭula](place:tulaytula) and [Baṭalyaws](place:batalyaws), many days' ride north, and the
      lands won from Qashtāla were still only half held. The court found itself far from the provinces it most
      needed to govern. A governor's letter took a week to reach the dīwān, and the answer took another week
      to go back.


      The elders of the court spoke first, for [Qurṭuba](place:qurtuba), seat of the caliphs, at the heart of
      al-Andalus, with the Great Mosque of ʿAbd al-Raḥmān still standing in it. It was the capital a restored
      al-Andalus seemed to call for, and for a time the assembly leaned toward it. Then a second proposal was
      put. The empire should invest in the sea. The Catalan shipwrights of [Barshalūna](place:barshaluna), who
      had built galleys for the Mamlūks at al-Iskandariyya, were the Emperor's own subjects now, and they
      could build the empire a merchant fleet. If the empire was going to live by trade, its capital belonged
      where the trade was. [Ishbīliya](place:ishbiliyya) was the greatest city of the realm, with
      seventy-eight thousand souls and the first market in the world, and its river ran down to the Ocean. The
      assembly agreed, and so did the Emperor, who had always read a ledger as closely as a map: he chose the
      river and the market over the prestige of Qurṭuba. The court would move to Ishbīliya before the year was
      out.


      The move would not be cheap. A capital needs roads, and the Emperor ordered them in every direction:
      south to [Sharīsh](place:sharish), east to [Mālaqa](place:malaqa), and north across the Guadiana to
      Baṭalyaws and to Ṭulayṭula itself. Each road would take as long as its length and its ground required.
      To pay for them the crown borrowed from the estates, five loans of a hundred and thirteen dīnārs each.
      The nobles and the merchants lent willingly enough, since the roads would carry their goods as well as
      the Emperor's letters.


      In Shaʿbān 781 the court came down from the hills. The dīwān sat in the palaces of Ishbīliya, and the
      Emperor's grip on the city, which had never been more than half certain, tightened within months. By the
      end of the year seven stretches of new road were finished, and the rest were under way.


      Gharnāṭa was not abandoned. The Emperor decreed that the city of his fathers would keep the honours of a
      capital. Al-Ḥamrāʾ still stood on its hill, and the court that sat there kept its full weight: the
      fortress its strength, the crown its authority, and the realm the learning and the dignity that had been
      gathering in those halls for a century and a half. Gharnāṭa had become the realm's ancestral seat, and
      in a realm that called itself a restoration, that was worth a great deal.


      *It is He who made the earth tame for you, so walk among its slopes and eat of His provision.*
