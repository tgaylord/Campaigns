  - id: 1375-03-15-the-new-taifas
    'on': '1375-03-15'
    kind: note
    what: >-
      The sultan resolves not to keep Catalonia and Aragon for the crown. They will be made two new ṭāʾifas:
      Catalonia, and a resurrected Aragon in the interior. Returning Aragonese land to a successor kingdom
      looks far less aggressive than seizing it outright. In the same reordering, Mursiyya is to be absorbed
      directly into the crown
    who:
      - saad-ibn-yusuf
      - joan-of-aragon
    threads:
      - war-of-the-upper-march
    from:
      - told
    cite: Trent's account, after the peace of 15 March 1375
    detail:
      plannedTaifas:
        - Catalonia
        - Aragon (the interior)
      absorbed: Murcia, into the crown
      why: to be seen returning rightful Aragonese land to a successor kingdom rather than seizing it
      status: carried out the next day, 16 March 1375
tellings:
  - id: 0775-09-06-the-battle-before-barshaluna
    'on': '1374-02-19'
    title: Of the March into the Upper March, and the Battle Before the Walls of Barshalūna
    verse: 3:123
    who:
      - sayyida-of-fezzan
      - dua-marinid
      - saad-ibn-yusuf
      - joan-of-aragon
      - bolot-mamluk
      - ali-ibn-yusuf
    where:
      - mursiyya
      - gharnata
      - balansiyya
      - barshaluna
    covers:
      - 1373-01-16-state
      - 1373-01-16-court
      - 1372-12-13-murcia-fezzan
      - 1373-01-16-hajj
      - 1373-10-01-march-on-valencia
      - 1373-12-01-war-on-aragon
      - 1373-12-01-mamluks-join
      - 1374-02-19-battle-barcelona
    text: >
      In the winter of 774 the last of the seven loans of the Marīnid war was paid back to the estates, every
      dirham of it, with the interest the dīwān had promised. The sultan had refused to think of a new war, or
      even of the pilgrimage, while he still owed his own lords money. A man who stood at ʿArafa in debt, he
      said, stood there with another man's purse. Now the treasury took in half again what it spent, every
      estate paid more into it than before, and even the north shore, which had yielded almost nothing at the
      peace, had begun to pay. His mother [Sayyida](person:sayyida-of-fezzan) had taken a seat in the dīwān
      beside [Duʿāʾ](person:dua-marinid), and a marriage had bound the ṭāʾifa of [Mursiyya](place:mursiyya) to
      Fezzan, her homeland beyond the desert. Only then did the sultan begin to make ready for the Hajj.


      The truce with Arghūn ran out in Dhū al-Ḥijja of the year 774, on the day of the feast, and the sultan
      let it run out in [Gharnāṭa](place:gharnata) rather than at Minā. He had put off his pilgrimage for it,
      and he did not mean to waste the delay. By Rabīʿ al-Thānī 775 the dīwān's second claim was written, this
      one against the crown of the Catalans, and our lord [Saʿd](person:saad-ibn-yusuf) rode north at the head
      of the armies of the realm. He wintered them at [Balansiyya](place:balansiyya), within sight of the
      Upper March. The old map of the caliphs called that country the Thaghr al-Aʿlā, and no army of the house
      of Naṣr had ever marched into it.


      Arghūn stood alone. Its king, [Joan](person:joan-of-aragon), was twenty-four and wore two crowns,
      Arghūn's and Ṣiqilliya's, but the second brought him only three ships and Ṣiqilliya's subjects across
      the sea. The Genoese, who were the Sicilians' friends, were busy with a war against Bologna and Pisa.
      The Pope at Avignon wrote letters and sent nothing. The dīwān reckoned the Catalan host at a few hundred
      men under arms against the sultan's three thousand three hundred. So the sultan raised no levies. He
      said the regulars would do, and that the peasants of the valley had a harvest to bring in.


      On 14 Jumādā al-Ākhira 775 the herald read the declaration in Balansiyya. The same week, word came from
      Alexandria that the sultan [Būlād](person:bolot-mamluk) had answered the call as an ally should. The
      Mamlūk galleys had put out with the Egyptian vassals behind them, and they were sailing for the shores
      of Ṣiqilliya, so that Joan's second crown would have to look to itself.


      King Joan chose not to sit out a siege. He called out the levies of Catalonia: archers from the mountain
      towns, foot from the coast, and a few hundred horsemen, among them the mailed knights of the estates
      around [Barshalūna](place:barshaluna). In Shaʿbān he brought five thousand three hundred men to meet the
      sultan's three thousand three hundred on the coastal plain below the city walls.


      The sultan commanded in person. He set his heavy foot in the centre to hold whatever came at them. He
      gave the right wing, and two-thirds of all the horse, to his brother [Abū al-Ḥasan
      ʿAlī](person:ali-ibn-yusuf), who was eighteen and had never led men in battle. The sultan kept the left
      under his own banner. The plan was the old one of the Andalusī jinetes: hold the centre, ride round the
      wings, and close the jaws.


      The battle lasted three weeks of manoeuvre, sallies and skirmishes in the winter rain, and it ran on
      into Ramaḍān. The jurists ruled that men in the field were travellers and might break the fast, and the
      sultan broke it with them so that none would be ashamed to eat. The centre did what was asked of it. It
      took the weight of the Catalan foot and the archers' arrows and did not move, while the two wings fell
      on the Aragonese flanks and destroyed them. By the end only the Catalan centre was left on the field:
      levies, and the Catalan knights gathered around them. Then the centre pushed forward. Abū al-Ḥasan's
      right wavered under the knights' last charge, and for a moment the court's watchers on the hill thought
      the day might turn. Then the sultan brought the left round on the Catalans' other side, and they were
      caught between the two wings.


      It ended on 6 Ramaḍān. Three thousand three hundred and seventy-five of King Joan's men lay dead or
      scattered before the walls of his capital, against one thousand two hundred and twenty-eight of ours.
      Barshalūna's gates were shut, and the Catalan army had left the field. The court poets compared the
      battle to a woven cloth, with the centre the warp, the horse the weft, and the sultan the weaver, and
      for once the courtiers did not think they had exaggerated. It was the first Muslim victory before
      Barshalūna since the days of the caliphs. It had cost the realm more than a third of the army that
      fought it.


      *And already had Allāh given you victory at Badr while you were few. So fear Allāh, that you may be
      grateful.*
  - id: 0775-09-24-the-pursuit-to-tarrakuna
    'on': '1374-03-09'
    title: Of the Pursuit to Ṭarrakūna
    verse: 2:251
    who:
      - saad-ibn-yusuf
      - joan-of-aragon
      - jean-of-france
    where:
      - barshaluna
      - tarrakuna
      - gharnata
      - walba
    covers:
      - 1374-03-09-battle-tarragona
      - 1374-02-19-battle-barcelona
      - 1374-03-09-france-busy
      - 1372-02-01-france-england
      - 1374-03-09-constructions
    text: >
      Our lord [Saʿd](person:saad-ibn-yusuf) gave the Catalans no time to gather again under the walls of
      [Barshalūna](place:barshaluna). He marched the whole army south along the coast after what was left of
      King [Joan](person:joan-of-aragon)'s army: thirteen hundred archers and a few dozen riders making for
      the old Roman walls of [Ṭarrakūna](place:tarrakuna).


      The jinetes caught them on the plain before the city, and the foot came up behind; it ended on 24
      Ramaḍān. It was hardly a battle. The archers had no horse to cover them and nowhere to run, and the
      sultan's riders broke them in a morning. Thirteen hundred Catalans were killed. Eleven horsemen
      surrendered and were taken into the sultan's service, to the delight of the court, which said that
      Arghūn was now paying the sultan in men. Thirty-one of ours were lost.


      When the sultan broke the fast that night in the camp outside Ṭarrakūna, the scouts reported that the
      whole host of Arghūn now came to a hundred and sixty-one levies hiding in the mountains. The king who
      wore two crowns had no army left to defend either of them.


      The sultan's council sat late that night, and the talk was of Ifranja as much as of Arghūn. Beyond the
      Pyrenees the king of France, [Jean](person:jean-of-france), was fighting for his kingdom against the
      English again. The merchants said the English held the west of France from the sea of Normandy to
      Poitou, and that every French lance was needed there. In any other year, the sultan said, he would have
      been wary of carrying his banners up to the French border, because a French king with nothing else to do
      might come over the mountains to save his Catalan neighbour. This year the French king had plenty to do.
      Every month the English kept him busy was a month the Upper March lay open. The sultan resolved to take
      all of Arghūn, from the Ebro to the Pyrenees, before France was free to look south. He told the dīwān it
      was a race, and that he meant to win it.


      Before he slept he sealed the week's letters for home, as he did throughout the campaign, and the war
      took up less of them than the building. The treasury was to go on paying for the new royal court rising
      in [Gharnāṭa](place:gharnata), for the mines being cut at Almonaster in the hills above
      [Walba](place:walba), and for stronger walls on the frontier fort at Aracena, on the Castilian border.
      The Upper March, he wrote, was no reason to leave the Lower March unguarded, and a mine opened in a year
      of war paid as well as one opened in peace.


      *So they defeated them by permission of Allāh.*
  - id: 0775-11-19-the-regency-of-dua
    'on': '1374-05-02'
    title: Of Duʿāʾ's Regency, and the Tithe Given to the ʿUlamāʾ
    verse: 3:159
    who:
      - dua-marinid
      - saad-ibn-yusuf
      - sayyida-of-fezzan
    where:
      - gharnata
      - barshaluna
    covers:
      - 1374-03-jamaa-tithes
      - 1374-05-02-jamaa-passes
      - 1371-02-24-spread-of-usury
      - 1374-02-19-battle-barcelona
    text: >
      While the sultan was in the Upper March, the court at [Gharnāṭa](place:gharnata) was run by a woman, and
      nobody who knew her was surprised. [Duʿāʾ](person:dua-marinid) the Marīnid had sat in the dīwān for
      nineteen years, under three husbands and two reigns. She had brought the court foreign learning and the
      nobles' displeasure with it, and she had spent the last thirteen of those years making the Christians of
      the new lands into Andalusīs. When our lord [Saʿd](person:saad-ibn-yusuf) rode north, he left the seal
      with her. The sultan's mother, [Sayyida](person:sayyida-of-fezzan), sat beside her in the dīwān. No one
      at court could remember the realm in more experienced hands, nor, the harem said, in two pairs of hands
      that liked each other less. The women had shared a husband and then a son's ear. For a season they ran
      the realm together with perfect courtesy and not one private word.


      The quarrel over the moneylenders was still open. Three years earlier the sultan had told the ʿulamāʾ
      they were overreacting, and they had nursed the wound since. Duʿāʾ meant to heal it before the army came
      home. In the spring of 775 a letter came from the camp before [Barshalūna](place:barshaluna), written in
      the sultan's own hand. It gave her leave to summon the Jamāʿa. The question she put to it was the tithe:
      who should collect the dues of the faithful and the taxes of the dhimmīs, and by what rule. Across the
      realm, and above all in the new lands, collection had grown irregular. Each town paid what its governor
      could squeeze out of it, and the Christians and Jews of the valley never knew from one year to the next
      what they owed. Duʿāʾ proposed to give the whole business to the ʿulamāʾ, under one rule for the realm.
      They would gain the revenue and the authority over the dhimmī communities. The crown would gain a tax
      that was reliably paid.


      The ʿulamāʾ were delighted. The nobles were not. Every dirham the scholars collected was a dirham the
      lords of the valley could not, and they made their price plain. Duʿāʾ paid it. It was a handful of small
      privileges, nothing the sultan would notice from Catalonia, and each of them bound the peasants of the
      nobles' estates a little more tightly to the land. On 19 Dhū al-Qaʿda 775 the Jamāʿa voted the measure
      through. For ten years the tithe would be regulated across the realm, the ʿulamāʾ would be content, and
      the treasury would collect more of what it was owed.


      Duʿāʾ wrote to the sultan that the scholars were reconciled to him and the dhimmīs would know what they
      owed. She also wrote that the nobles had been bought cheaply. The sultan wrote back that nothing the
      nobles sold was cheap, and that the peasants would remember the price after the lords had forgotten it.
      But he did not undo the bargain. He had a war to finish.


      *And consult them in the matter; then when you have decided, rely upon Allāh.*
  - id: 0776-08-02-of-the-siege-of-barshaluna
    'on': '1375-01-06'
    title: Of the Siege of Barshalūna, the Taking of Māliṭa, and the Two Princes
    verse: 9:71
    who:
      - saad-ibn-yusuf
      - ramadan-of-barqa
      - bolot-mamluk
      - ismail-ibn-saad
      - yusuf-ibn-saad
      - dua-marinid
      - aiman-mamluk
    where:
      - barshaluna
      - gharnata
      - jarunda
      - fas
    covers:
      - 1374-10-25-malta-taken
      - 1374-11-12-battle-george-bay
      - 1374-10-the-princes-tutors
      - 1375-01-06-mamluk-army-catalonia
      - 1375-01-06-court-factions
      - 1374-05-23-battle-zuwara
      - 1374-06-24-battle-gharyan
    text: >
      Arghūn had no army left, but [Barshalūna](place:barshaluna) still had its walls. They were the walls of
      the old counts of the city, built on Roman ones, with the sea at their back where the Catalan galleys
      could come and go. In the last days of Dhū al-Ḥijja 775, with the Feast of the Sacrifice kept in camp,
      our lord [Saʿd](person:saad-ibn-yusuf) drew his lines around the city. The siege that followed was not
      the work of a season. Summer passed, and autumn, and the sultan's engineers counted the days by the
      stones they had brought down. The townsmen counted them by what was left in their granaries.


      The war was being fought on other shores too. The Mamlūk sultan [Būlād](person:bolot-mamluk) had
      promised to keep the second crown of King Joan busy, and he kept his word through the shaykh of Barqa,
      [Ramaḍān](person:ramadan-of-barqa). Ramaḍān was a Baḥrī of the sultans' own house, fifty-four years old,
      with four wives, eight children, and a soldier's temper. In the spring he had marched west along the
      coast of Ifrīqiya against the Jabal Nafūsa, the Berbers of the mountains who paid homage to Ṣiqilliya.
      He scattered their army at Zuwāra and finished it at Gharyān. Then he took ship. In Jumādā al-Ūlā 776 he
      landed two thousand nine hundred men on Māliṭa, the rock between Ṣiqilliya and Ifrīqiya, which the Duke
      of Athens held for the Sicilian crown, and took it. The Arabs had held that island once, and the Normans
      had taken it from them. The court at [Gharnāṭa](place:gharnata) said it was another front of the faith's
      return, from the Ebro to the sea of Ṣiqilliya.


      The Sicilians did not let it go quietly. Three weeks later, on 6 Jumādā al-Ākhira, their fleet of
      thirty-one sail found Barqa's eight ships at anchor in the bay below the island, which the Christians
      call St George's. Not one of Ramaḍān's ships came out of it. Māliṭa stayed taken, but its garrison was
      cut off from home, and the Sicilians let the shaykh know that the sea around their island was still
      theirs.


      In those same weeks the sultan settled a matter of his own house, and it was harder than the siege. His
      father had brought the finest tutors of the Islamic world to Gharnāṭa for him when he was a boy, and the
      court said the realm had been paying back the cost ever since in victories. Now there were two princes.
      The heir, [Ismāʿīl](person:ismail-ibn-saad), son of [Duʿāʾ](person:dua-marinid), was eight, and already
      had a tongue that could talk a qāḍī out of his own verdict. [Yūsuf](person:yusuf-ibn-saad), son of
      [Aiman](person:aiman-mamluk) the Mamlūk, was three and already following his father about the yard with
      a wooden sword. Duʿāʾ wrote from the regency that the tutors were an heir's right and an heir's alone.
      The sultan wrote back from the camp before Barshalūna that both were his sons. The masters were sent
      for, at great cost, and both boys sat before them. Duʿāʾ said nothing more about it, which the court
      took for a bad sign.


      On 2 Shaʿbān 776 a second Mamlūk host was in Catalonia. There were four thousand two hundred and
      seventy-two of them, foot and horse, under another Baḥrī cousin of the sultans' house. They marched
      through [Jarunda](place:jarunda) for Empúries under the mountains, though the country had been stripped
      bare and they could draw no bread from it. Barshalūna was already under siege and hardly needed them.
      The court understood what they had come to say. The Marīnids of [Fās](place:fas), Duʿāʾ's house, had
      twice made war on Gharnāṭa in a dozen years. The Baḥrī sultans of Miṣr, Aiman's house, were fighting
      beside it in Ifrīqiya, at Māliṭa and now in Catalonia. Those who had spoken for the Mamlūk alliance were
      heard more often in the dīwān that winter, and Aiman's household had more visitors than it had had in
      years.


      *The believing men and believing women are allies of one another.*
  - id: 0776-10-11-of-the-peace-of-the-upper-march
    'on': '1375-03-15'
    title: Of the Peace of the Upper March, and the End of Arghūn
    verse: 8:62
    who:
      - saad-ibn-yusuf
      - joan-of-aragon
      - ramadan-of-barqa
    where:
      - barshaluna
      - qurtuba
      - balansiyya
      - tarrakuna
      - jarunda
      - larida
      - turtusha
      - saraqusta
      - mursiyya
      - ishbiliyya
      - gharnata
    covers:
      - 1375-03-15-peace-aragon
      - 1375-03-15-aragon-falls-apart
      - 1375-03-15-state
      - 1375-03-15-the-new-taifas
      - 1374-11-12-battle-george-bay
    text: >
      By the end of Ramaḍān 776, [Barshalūna](place:barshaluna) had been under siege for two hundred and
      eighty days. The walls on the landward side were breached in three places, and the townsmen were eating
      what townsmen eat when the bread is gone. King [Joan](person:joan-of-aragon) knew how few days he had
      left. He was not finished, though. He still wore the crown of Ṣiqilliya, and the Sicilians had an army
      of five thousand levies and the fleet that had sunk Barqa's ships off Māliṭa. A king with an island
      behind him could lose his capital and still go on fighting, and the war might go on for years.


      The shaykh of Barqa ended that hope. [Ramaḍān](person:ramadan-of-barqa) had lost his ships, so he found
      others. In the last weeks of the fast he put three thousand men ashore on Ṣiqilliya itself and took
      Saraqūsa by storm, the old city of the Greeks on the island's eastern shore. The Sicilian levies could
      probably have driven his three thousand back into the sea. But the sultan's envoys, when they came to
      King Joan in the days after the feast of the breaking of the fast, asked him what he would do about the
      next landing, and the one after that.


      They gave him a choice. He could make peace. Arghūn would pass to the sultan. Māliṭa would pass to the
      Mamlūks. And the king himself would go to Balarm unharmed and free, with his household and his Sicilian
      crown. Or the war could go on in Ṣiqilliya. The island had been a land of Islam for two hundred years
      before the Normans took it. The envoys said its peasants would soon show whether they remembered the
      faith of their forefathers as well as [Qurṭuba](place:qurtuba) had. Joan was greedy, but he was not a
      fool. On 11 Shawwāl 776 he accepted, and sailed for Balarm.


      By the time the peace was sealed, Arghūn had already come apart. Its outlying lordships had gone their
      own ways in the last months of the war. Montpellier, beyond the mountains, swore itself to the king of
      Inkiltara rather than the king of Ifranja. Sassari, on the island of Sardāniya, was taken back by the
      judges of Arborea, who were vassals of Janawa. What was left was thirty-four towns from the Pyrenees to
      the Ebro: Barshalūna and [Ṭarrakūna](place:tarrakuna), [Jarunda](place:jarunda) under the mountains,
      [Lārida](place:larida) on the Segre, [Ṭurṭūsha](place:turtusha) at the Ebro's mouth, Perpignan beyond
      the passes, and the hill towns of the old Aragonese marches at Fraga, Munt Shūn and Barbashturu. Half a
      million souls lived in them, nearly all of them Catalan and Christian. All of it passed to the sultan,
      and the Kingdom of Arghūn held no land at all. The courtiers called it the end of Arghūn. The sultan
      said: for now.


      The dīwān's reckoners brought him the new count, and it made the old courtiers uneasy. The realm now had
      ninety-four towns and one million two hundred and seventy-five thousand souls. For the first time, the
      Catalans outnumbered the Andalusīs in the sultan's own lands, four hundred and fifty-five thousand to
      four hundred and fifty-two thousand. The Christians outnumbered the faithful two to one. Barshalūna,
      with forty-six thousand people, was the third city of the realm after [Ishbīliya](place:ishbiliyya) and
      [Gharnāṭa](place:gharnata). The war had cost the sultan one thousand two hundred and sixty men in battle
      and Arghūn four thousand seven hundred, besides those the siege and the winter took. In fifteen months
      the sultan had more than doubled the number of Christians who called him lord.


      Our lord [Saʿd](person:saad-ibn-yusuf) did not mean to keep it that way. He had read the Survey of the
      Kingdoms. He knew what Ifranja, Qashtāla and the Pope at Avignon would say of a Muslim sultan who
      swallowed a Christian kingdom whole. So he told the dīwān that the crown would not keep Catalonia and
      Arghūn. They would become two new ṭāʾifas, like [Balansiyya](place:balansiyya) and al-Gharb before them.
      One would be Catalonia on the coast. The other would be Arghūn itself, raised again in the interior, a
      successor kingdom to the one that had died. The sultan would not be seen to have seized Aragonese land.
      He would be seen to have returned it to its rightful heirs, under his protection. In the same
      reordering, [Mursiyya](place:mursiyya), a ṭāʾifa for thirty-five years, would be taken into the crown
      directly.


      The old men of the dīwān who had studied the caliphs' map in the Hall of Ambassadors understood what
      came next. The War of the Upper March had been won without [Saraqusṭa](place:saraqusta), the Upper
      March's own capital. Saraqusṭa and the heart of old Arghūn, from the Ebro to the mountains of Jaca, were
      held by Qashtāla. A restored Arghūn would have a claim to them, and its protector would have a cause.
      The truce with Qashtāla would end on the fourth day of Muḥarram 777. The sultan's scribes were already
      drafting the claim. He meant the world to read it not as a war of Gharnāṭa, but as the restoration of
      Arghūn.


      *But if they intend to deceive you, then sufficient for you is Allāh. It is He who supported you with
      His help and with the believers.*
