date: '1375-03-15'
title: The Peace of the Upper March
source:
  save: SP_GRA_1375_03_15 (compressed)
  game: 1.4.6
summary: >-
  On 15 March 1375 the War of the Upper March ends. Aragon gives up all 34 towns it still held, from the
  Pyrenees to the Ebro, and holds no land; Malta goes to the Mamlūks, and Sicily pays reparations. The realm
  grows from 60 towns to 94 and from 765,000 people to 1,275,000. The Catalans are now its largest people and
  Catholics outnumber Muslims two to one. The army of 3,300 regulars is whole, no levies were raised, and the
  treasury holds 286. New truces run with Sicily and its subjects to April 1386 and with Aragon to March 1388;
  the Castilian truce ends on 5 June 1375. Shares of power are estimated from the 1 June 1349 reading.
