tellings:
  - id: 0823-08-25-of-the-petty-kings-of-the-mountains
    'on': '1420-09-04'
    title: Of the Petty Kings of the Mountains
    verse: 3:137
    who:
      - ismail-ibn-saad
      - pedro-of-castile
      - diego-villamarin
      - jose-fernando-tunon
      - alfonso-gaston
    where:
      - ishbiliyya
      - banbaluna
    covers:
      - 1420-09-04-the-fall-of-qashtala
      - 1411-11-01-the-end-of-portugal
      - 1420-08-11-the-world
    text: >
      Since the Peace of Rajab, Qashtāla had been a kingdom of forty-five towns in the rain of the north, with
      no army and four ships. On 25 Shaʿbān 823, three weeks after Fermoselle, it stopped being even that. The
      news reached [Ishbīliya](place:ishbiliyya) in the last days of the month, before the new moon of
      Ramaḍān, in letters from the merchants of the Cantabrian ports. The lords of the mountains had stopped
      answering to their king, and each of them now called himself a king.


      The greatest of them was in the west. [Diego Villamarín](person:diego-villamarin), a Galician lord not
      yet thirty and the best soldier left in the Christian north, made himself king of Galicia with
      twenty-three towns, from Santiago, where the Christians keep the tomb of their apostle, to A Coruña,
      Lugo, Ourense and Tui on the Miño. The secretaries of the Dīwān al-Inshāʾ pointed out that his kingdom
      was the country the Arabs had always called Jillīqiya, and the Emperor had named his war after it. Now
      it was a kingdom of its own. At Oviedo, in the mountains where the Christians said their reconquest had
      begun, a Leonese lord named [José Fernando Tuñón](person:jose-fernando-tunon) took Asturias, eight towns
      and its old capital. The Basques of the coast, from Bilbao and San Sebastián to Vitoria in the plain of
      Álava, took a king of their own, [Alfonso Gastón](person:alfonso-gaston), and called him king of
      Navarre, though the Navarre of the old kings was the Emperor's Ṭāʾifa of [Banbalūna](place:banbaluna)
      and had been for nine years. [Pedro](person:pedro-of-castile), who had reigned for twenty-six years and
      lost two wars to the house of Naṣr, was left with four towns around Santander, the port of Laredo, and
      the valley of Potes beneath the Picos de Europa.


      The court of Ishbīliya received the news with a joy it did not try to hide. The preachers said that the
      kingdom that had called itself the sword of the reconquest had broken itself on the same rocks where it
      was born. The older men of the dīwān were less certain. One king with no army had been easy to watch.
      Now there were four, and only Pedro was bound by the truce sworn at the Peace of Rajab. Diego of Galicia
      had signed nothing, and he had a soldier's reputation.


      The Emperor [Ismāʿīl](person:ismail-ibn-saad) did what he always did. He wrote to all four kings. To
      Diego he sent congratulations on his crown and the respect of one soldier for another. To Tuñón he wrote
      of the antiquity of Oviedo. To Alfonso Gastón he wrote that the Basques had always been a people apart,
      and that al-Andalus had no quarrel with them. To Pedro he wrote nothing at all for a month, and then a
      short letter of condolence. The secretaries who copied the four letters noticed that no two of them said
      the same thing, and none of them were surprised. The ʿulamāʾ said that the last war of the Istirdād
      would come when Allāh willed it. The Emperor said that four small kingdoms were easier to take one at a
      time than one large one, and that he was in no hurry.


      *Similar situations have passed on before you, so proceed throughout the earth and observe how was the
      end of those who denied.*
