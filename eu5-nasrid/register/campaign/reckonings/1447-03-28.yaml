date: '1447-03-28'
title: The Treasury Refilled
source:
  save: SP_ADU_1447_03_28 (compressed)
  game: 1.4.7
summary: >-
  From a save. The treasury stands at 2,680, up from 570 at the autosave two months before. The save doesn't
  say where the gold came from: income runs at about 433 a month against 366 out, and there is no debt. Since
  February the towns have added potteries at Valencia, cloth workshops and a tannery at Córdoba and a
  furniture workshop at Cervera. Stability 8.6, prestige 89, legitimacy full; the dīwān and the succession are
  unchanged. On 27 March the Tīmūrid empire, thirteen years without Temür, fell into stagnation (Trent's
  screenshot). Estate power estimated from the reading of 16 November 1428.
