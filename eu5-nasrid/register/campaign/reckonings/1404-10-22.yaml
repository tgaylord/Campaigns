summary: >-
  On 22 October 1404 the Pope ends his crusade: his army destroyed by the Emperor at Barjols and Avignon
  itself taken, he is humiliated before Christendom and pays 585 in gold and reparations. No land changes
  hands. The French, who opened the road to Avignon, now also give food access. The court is already preparing
  a new claim on Castile. The realm holds 148 towns and 1,841,000 people; the game ranks it sixth. Income 209
  a month against 178; the treasury stood at 45 before the gold came in. Shares of power are estimated from
  the 1 June 1349 reading.
