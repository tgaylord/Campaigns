tellings:
  - id: 0807-04-16-of-the-crusade-of-806-and-the-peace-of-avignon
    'on': '1404-10-22'
    title: Of the Crusade of 806, the March on Avignon, and the Peace of Avignon
    book: book-of-the-marches
    verse: 2:190
    who:
      - saad-ibn-yusuf
      - rodrigo-de-borja
    where:
      - al-mariyya
      - ishbiliyya
    covers:
      - 1404-02-01-the-crusade
      - 1404-02-09-battle-gulf-of-roses
      - 1404-05-10-battle-aix
      - 1404-06-24-battle-mouths-rhone-ii
      - 1404-08-03-battle-gulf-florent
      - 1404-07-04-march-on-avignon
      - 1404-10-01-the-sephardim-of-al-mariyya
      - 1404-10-10-battle-barjols
      - 1404-10-20-battle-barjols-ii
      - 1404-avignon-taken
      - 1404-10-22-peace-of-avignon
    text: >
      For nearly nine years after the Peace of Ramaḍān the empire fought no one. It was broken from the least
      likely quarter. On 19 Rajab 806 the Pope at Avignon proclaimed a crusade against al-Andalus, the first
      ever preached against the empire by name, and declared war on the Ṭāʾifa of Arghūn and its young king
      [Rodrigo](person:rodrigo-de-borja). The Emperor [Saʿd](person:saad-ibn-yusuf) answered for his ṭāʾifa at
      once, as he was bound to.


      The court at [Ishbīliya](place:ishbiliyya) waited to see who would take the cross. Almost no one did.
      The kings of Christendom had their own wars, and Qashtāla, which had most cause to hate the Emperor, did
      not stir. The crusade was the Pope's own vassals, his cities of Faenza and Siena, and a handful of
      German prince-bishops and lords from Mainz to Magdeburg, some five thousand men at the proclamation and
      most of them levies. The Pope's own regiments mustered fewer than three hundred men under arms. Against
      them stood the empire's regular army and its ṭāʾifas, the Mamlūks of Miṣr with the Holy Cities and all
      their vassals, and the Marīnids of Fās with their fleet. The preachers of Ishbīliya asked what kind of
      crusade it was that could not fill a town square.


      Its one weapon was a fleet. Eight days into the war seven papal galleys caught two Catalan ships in the
      Gulf of Roses and sank them both. They did not last the summer. The joined fleets of Catalonia and the
      Marīnids, ninety-one sail, swept the mouths of the Rhône, and in Muḥarram 807 the Marīnid admiral Abū
      Ḥammū caught a papal squadron off Corsica and sank it to the last ship. On land the Catalan army marched
      into Provence, and at Aix three hundred and seventy Sienese crusaders threw themselves on it and died to
      the last man.


      In Dhū al-Ḥijja 806 the King of France, who had been the empire's friend since the embassies of 797,
      opened his roads to the armies of the faithful, and the Emperor crossed into Languedoc at their head. He
      was fifty-six. His officers asked him to let a general take the army over the mountains; he answered
      that he had marched with the army since he was sixteen and saw no reason to stop now. He slept in the
      camp, ate what the soldiers ate, and laid siege to Avignon, the Pope's own city on the Rhône.


      It was before Avignon, in Rabīʿ al-Awwal 807, that the question of the Jews of
      [al-Mariyya](place:al-mariyya) reached him. Jews from all over the peninsula had made the town a haven,
      where they lived and traded without fear. Some at court called it the justice owed to all of Allāh's
      creation. The zealous called it a stain on the empire. The Emperor ruled from his tent that the rights
      of the Jews were under his protection, and he ordered the crown to build them a house for their
      community at al-Mariyya. It did not escape the dīwān that he did it while making war on the Pope, and it
      did not escape the Jews of the Christian kingdoms either.


      In Rabīʿ al-Thānī the last papal army came up to relieve the city. On the fourth of the month it threw
      back the Valencians at Barjols in Provence, and nearly half the Valencian army died there. Ten days
      later the Emperor came up with his own army and destroyed what was left of the papal host on the same
      field: of five hundred and nineteen men, twenty-four escaped. He lost four. Avignon had fallen by the
      time the Pope sued for peace.


      The Pope gave up his crusade on 16 Rabīʿ al-Thānī 807. He was made to declare his humiliation before
      Christendom, to pay five hundred and eighty-five dīnārs of gold at once and reparations for years to
      come. The Emperor took no land. He had no wish to rule a Christian city in the middle of France, and he
      said the Pope's city was worth more to him as a lesson than as a province. Every king in Christendom had
      seen the Pope preach a crusade against al-Andalus, and every one of them had seen how it ended.


      *Fight in the way of Allāh those who fight you, but do not transgress. Indeed, Allāh does not like
      transgressors.*
