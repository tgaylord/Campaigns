title: The Sons of Muḥammad
source:
  save: SP_ADU_1408_08_05 (compressed)
  game: 1.4.7
summary: >-
  The north is the crown's again. The rising of Ciudad Rodrigo ended on 8 July 1405, six days after Khālid ibn
  Yaḥyā's victory at Granadilla, and the Kingdom of Toledo and Estremadura collapsed on 24 August 1405, giving
  the crown back its forty-eight towns. On 1 September 1405 the Ṭāʾifa of al-Gharb was taken into the crown.
  The crown now holds 161 towns and 2,018,000 people directly, with five ṭāʾifas under it; Maryam bint Saʿd,
  the Emperor's niece and wife of his son Saʿd, has ruled Qūnka since her father's death in February 1408. In
  March 1408 the Emperor kept his court at Ishbīliya but named Qurṭuba the Capital of the Old Caliphate. The
  heir Muḥammad, twenty-two, has two gifted sons, Ismāʿīl and Aḥmad, both five, enough to set aside the
  question of the succession. Treasury 418, income 270 against 192; 9 regiments. Shares of power are estimated
  from the 1 June 1349 reading.
