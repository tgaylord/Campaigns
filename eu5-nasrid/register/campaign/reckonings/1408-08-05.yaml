tellings:
  - id: 0808-03-06-of-granadilla-the-end-of-the-risings-and-al-gharb
    'on': '1405-09-01'
    title: Of Granadilla, the End of the Risings, and al-Gharb
    verse: '8:46'
    who:
      - ismail-ibn-saad
      - khalid-ibn-yahya
      - saad-ibn-ismail
    where:
      - qunka
      - shalamanka
      - al-ushbuna
      - majrit
      - shantarin
      - yabura
      - ukshunuba
      - shilb
      - baja
      - ishbiliyya
    covers:
      - 1405-01-28-battle-buitrago
      - 1405-03-18-battle-cuenca
      - 1405-07-02-battle-granadilla
      - 1405-07-08-ciudad-rodrigo-crushed
      - 1405-07-10-battle-cuenca-ii
      - 1405-08-05-battle-lisbon
      - 1405-08-24-the-risings-crushed
      - 1405-09-01-al-gharb-annexed
      - 1395-08-05-diwan-al-insha
    text: >
      The new Emperor [Ismāʿīl](person:ismail-ibn-saad) inherited three rebel kingdoms and an army on the
      march. He had never been thought a soldier, and he did not pretend to be one. He set himself one task,
      to end the risings before the year was out, and gave every order in the dīwān to that end. The court,
      which had heard him called a man who told everyone what they wished to hear, now heard him tell the
      treasurers what the war would cost, and the generals what he expected of them, and both found he meant
      it.


      The rebels of Toledo had shown what they were in Rajab, when nearly five thousand of them fell on the
      hundred and twenty men of the Ṭāʾifa of [Qūnka](place:qunka) at Buitrago in the Guadarrama and killed
      them all. In Ramaḍān the Emperor had broken their army before Qūnka. Now he turned first to the west,
      where the Leonese of Shalamanka had set up their lordship at Ciudad Rodrigo. He gave that war to [Khālid
      ibn Yaḥyā Raḥḥū](person:khalid-ibn-yahya), sixty-two years old, who had beaten the Marīnids in his youth
      and walked the hills with the prospectors in his age. Khālid gathered the crown's army and the hosts of
      Arghūn and Catalonia, more than twenty thousand men, and on 4 Muḥarram 808 he found the rebels at
      Granadilla, three thousand levies with no hope of standing against him. More than half of them fell. Six
      days later, on the day of ʿĀshūrāʾ, the lordship of Ciudad Rodrigo was gone, and its sixteen towns,
      [Shalamanka](place:shalamanka), Ávila and Ciudad Rodrigo among them, went back to the Emperor's cousin
      [Saʿd ibn Ismāʿīl](person:saad-ibn-ismail).


      On 12 Muḥarram the Emperor came before Qūnka a second time, where what was left of the army of Toledo
      had gathered again, and he destroyed it: twelve hundred of theirs dead or taken, and fewer than a
      hundred of ours. In the west the rebels of Estremadura had been sitting before
      [al-Ushbūna](place:al-ushbuna) since the winter. On 8 Ṣafar they tried to take it by storm and met the
      army of the Ṭāʾifa of al-Gharb under the walls. The men of al-Gharb spoke Portuguese and prayed as
      Muslims, and they threw the Portuguese Christians back from the city with half their number dead.


      On 27 Ṣafar 808 the Kingdom of Toledo and the Kingdom of Estremadura came to an end together. Their
      forty-eight towns, from [Majrīṭ](place:majrit) and Alcalá to Ciudad Real and Albacete, and from
      [Shantarīn](place:shantarin) on the Tagus to [Yābura](place:yabura) and Elvas, came back to the crown.
      The risings of 807 had lasted eight months. The Emperor's father had died marching against them, and his
      son had finished them in under six.


      Al-Gharb had earned its reward, and the Emperor gave it in his own way. The ṭāʾifa had served the crown
      since the peace of 767: thirteen towns from [Ukshūnuba](place:ukshunuba), [Shilb](place:shilb), Lagos
      and Tavira on the coast to [Bāja](place:baja), Mértola and Serpa in the Alentejo, a hundred and
      thirty-seven thousand people who spoke the tongue of Portugal and had nearly all come to Islam. The
      secretaries of the Dīwān al-Inshāʾ wrote to its court, and wrote again, and on 6 Rabīʿ al-Awwal 808
      al-Gharb was taken into the crown without a sword drawn. What his father had won with armies, the court
      said, Ismāʿīl gathered in with letters. The crown held a hundred and sixty-one towns of its own, with
      five ṭāʾifas beside it.


      *And obey Allāh and His Messenger, and do not dispute, lest you lose courage and your strength depart,
      and be patient. Indeed, Allāh is with the patient.*
  - id: 0811-03-12-of-the-old-capital-and-the-sons-of-muhammad
    'on': '1408-08-05'
    title: Of the Old Capital, the Shaykha of Qūnka, and the Sons of Muḥammad
    verse: '52:21'
    who:
