title: The independent realm
source:
  save: SP_GRA_1366_11_06 (compressed)
  game: 1.4.5
summary: >-
  Seven months after the Peace of Independence. Granada has no overlord, and the Portuguese south is now the
  Ṭāʾifa of al-Gharb. The army is stood down and the budget balances. A Great Madrasa is rising at Ishbīliya.
  Saʿd has a son and heir, Ismāʿīl, by Duʿāʾ. Sunnīs and Catholics are exactly even. The alliance with the
  Mamlūks, in force since 1349, has lapsed since April. The Marīnids still hold the Strait's north shore.
  Shares of power are estimated from the 1 June 1349 reading.
