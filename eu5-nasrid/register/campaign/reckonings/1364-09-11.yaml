summary: >-
  Saʿd, of age since 18 January 1364, rules with two wives, Aiman the Mamlūk and Duʿāʾ the Marīnid. The Jamāʿa
  of May 1364 restored the dhimmī tax to win back the ʿulamāʾ. In the War of Independence his army broke the
  joined Portuguese and Aragonese at Zafra (3 August) and destroyed their remnants before Lisbon (10–11
  September). Andalusīs are now 54% of the realm to the Castilians' 40%. Shares of power are estimated from
  the 1 June 1349 reading.
