tellings:
  - id: 0765-08-16-the-regent-who-did-not-last
    'on': '1364-05-19'
    title: Of the Regent Who Did Not Last, and the Sultan's Second Wife
    verse: '4:28'
    who:
      - saad-ibn-yusuf
      - nasr-al-istijji
      - dua-marinid
      - aiman-mamluk
      - yusuf-i
      - sayyida-of-fezzan
    where:
      - gharnata
      - ishbiliyya
      - qurtuba
      - balansiyya
    covers:
      - 1364-01-18-saad-of-age
      - 1364-01-18-death-nasr
      - 1364-01-saad-marries-dua
      - 1364-03-01-battle-canete
      - 1364-04-05-battle-castellon
      - 1364-05-19-ulama-displeased
      - 1364-05-19-jamaa-summoned
    text: >
      On the twelfth of Rabīʿ al-Thānī in the year 765 our lord [Saʿd](person:saad-ibn-yusuf) turned sixteen
      and took the government of the realm into his own hands. The regency of [Naṣr
      al-Istijjī](person:nasr-al-istijji) ended that morning, and so, by evening, did Naṣr. The court gave out
      that he had died of a sickness. The huntsmen who had ridden out with him told a different story, of a
      fall in the hills and a horse that came home without its rider, and were told to stop telling it. The
      chronicler writes down both and judges neither. Allāh knows best.


      Within days the young sultan made his choice of a second wife. He had one already,
      [Aiman](person:aiman-mamluk), daughter of the Mamlūk sultan, promised to him when he was three and
      married to him before his majority. But a sultan of al-Andalus needs the Maghrib as well as Egypt, and
      there was a Marīnid princess in his own palace. So Saʿd married [Duʿāʾ](person:dua-marinid): twice
      widowed, ten years his elder, the most capable mind in the dīwān, and the widow of his father.


      The ʿulamāʾ were outraged, and they were right to be. The Book is plain on it: *do not marry those women
      whom your fathers married.* The jurists of [Gharnāṭa](place:gharnata) said so from the pulpit of the
      great mosque, and the jurists of [Qurṭuba](place:qurtuba) said it more loudly still. Men who had loved
      [al-Ḥājj Yūsuf](person:yusuf-i) said that his son had married his stepmother before the earth on his
      grave had settled. In the souks they said worse: that it was Duʿāʾ, not the boy, who had arranged it,
      and that a regent's fall from his horse had cleared the way for her. No one took the marriage harder
      than the sultan's mother. [Sayyida](person:sayyida-of-fezzan) had shared a husband with Duʿāʾ for nine
      years, and now she was asked to share a son. She did not speak against the match in public. She did not
      speak to Duʿāʾ in private for a year. [Aiman](person:aiman-mamluk), who had been Saʿd's only wife, found
      the cleverest woman in the dīwān sharing her husband's bed and his ear, and she wrote to Cairo. By the
      middle of Shaʿbān the ʿulamāʾ were nearer to open defiance of the throne than they had been in a
      generation. In the middle of a war that was a danger, not just a scandal.


      Meanwhile the war went badly in the east. On the twenty-sixth of Jumādā al-Ūlā the Portuguese, whom the
      dead sultan had marched west to find, appeared instead at Cañete and broke the host of
      [Balansiyya](place:balansiyya). In Rajab the ṭāʾifas attacked the joined armies of Portugal and Arghūn
      at Castellón and were thrown back.


      The young sultan proved his gifts first in the council, not on the field. He summoned the Jamāʿa and
      gave the ʿulamāʾ what they had wanted for twelve years. The tax on the dhimmīs, remitted since 753 to
      quiet the Castilians of the valley, would be collected again. A new campaign of conversion would be
      preached in Qurṭuba and [Ishbīliya](place:ishbiliyya) and every town the crown held. The jurists took
      the bargain. They did not forgive the marriage, but they stopped preaching against it. The Christians of
      the valley would pay for the sultan's peace with his clergy, as subjects so often pay for their rulers'
      sins. The old men of the court noted that a prince of sixteen had struck his first bargain with the
      ʿulamāʾ in the open, before the Jamāʿa, with the price written into the registers for any man to read.
      They noted too whose money paid it.


      *Allāh wants to lighten for you your difficulties; and mankind was created weak.*
  - id: 0765-12-13-zafra-and-the-walls-of-lisbon
    'on': '1364-09-11'
    title: Of Zafra and the Walls of al-Ushbūna, and the Peace with Portugal
    verse: '8:17'
    who:
      - saad-ibn-yusuf
      - murad
    where:
      - gharnata
      - al-ushbuna
      - balansiyya
      - shilb
      - ukshunuba
      - baja
      - mursiyya
    covers:
      - 1364-08-03-battle-zafra
      - 1364-09-10-battle-lisbon
      - 1364-09-11-battle-lisbon
      - 1364-09-11-peace-portugal
      - 1364-09-11-state
    text: >
      Al-Ḥājj Yūsuf had marched to knock Portugal out of the war, and his son [Saʿd](person:saad-ibn-yusuf)
      kept to the plan. In the summer of 765 the army of [Gharnāṭa](place:gharnata) went deep into Portugal
      and laid siege to [al-Ushbūna](place:al-ushbuna) itself. But the Portuguese army was not there. It had
      gone east to join the host of Arghūn, and together they were burning their way through the lands of the
      ṭāʾifas. So the army left a screen before the walls and marched east, under a general named
      [Murād](person:murad). He was a quiet man who kept his own company, and he planned every attack as
      carefully as a merchant counts his coin. He chased the joined host halfway across Iberia.


      He caught them on the fourth of Dhū al-Qaʿda at Zafra. It was Castilian land that the Marīnids had
      taken, so that Muslims of the far shore held the field on which Muslims of this one fought. Murād had
      nine thousand eight hundred men, the sultan's army with a contingent of [Balansiyya](place:balansiyya).
      The enemy had six thousand seven hundred and fifty, Portuguese and Aragonese under one command. The
      Portuguese commander was a capable man, and the Christian line held through the morning. In the
      afternoon Murād sent the jinetes of Gharnāṭa around its flank, and then he sent the thagrī footmen in.
      The Christian line broke, the Aragonese first. Three thousand three hundred and fifty of the enemy were
      left on the field, and two thousand two hundred of ours. It was not cheap, but it was a victory. The
      joined host of the two crowns no longer existed. Only its pieces were left, running west toward the one
      city they still hoped to hold.


      Murād followed them all the way back to al-Ushbūna. Under its walls, on the twelfth of Dhū al-Ḥijja, he
      destroyed what was left of the Portuguese: sixteen hundred men, every one of them killed or taken, and
      not one of ours lost. The next day it was the Aragonese remnant's turn, seventeen hundred and seventy
      men, and again not one of ours. Those were the days of tashrīq, when the pilgrims at Minā cast their
      stones at the pillars of the Devil. The army of Gharnāṭa cast its own before the gates of al-Ushbūna.


      Portugal had nothing left in the field, and it sued for peace the same day. It gave up its whole south:
      the Algarve that the old geographers called al-Gharb, with [Shilb](place:shilb),
      [Ukshūnuba](place:ukshunuba) and Tavira, and the lower plains of the Alentejo with [Bāja](place:baja),
      Mértola and Serpa. That was thirteen towns and eighty-three thousand souls. Portugal would also pay
      reparations for ten years. The court did not mean to keep these Portuguese Christians under its own
      hand. When the war was won they would be given a prince of their own, as Balansiyya and
      [Mursiyya](place:mursiyya) had been, and become a third ṭāʾifa of al-Andalus.


      Qashtāla and Arghūn fought on. But the sultan's treasury, which had held twenty-four dīnārs on the day
      his father died, now held five hundred.


      *And you did not kill them, but it was Allāh who killed them. And you threw not when you threw, but it
      was Allāh who threw.*
