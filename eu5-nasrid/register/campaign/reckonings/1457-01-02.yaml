date: '1457-01-02'
title: The Prominent Prince
summary: >-
  From a save, Trent's screens and his account. A new generation of explorers sailed from Ishbīliya in 1456;
  Burhān, sent south for the Cape, was swept west. The nobles of Galicia rose against their young ruler and
  the whole realm took his side. On 1 December the Emperor brought his half-brother Yūsuf, a famous leader of
  men and a famously ambitious one, closer to the court, and ordered a census of the realm. The Emperor's
  mother, Magdalena de Borja, died after a fall in April.
