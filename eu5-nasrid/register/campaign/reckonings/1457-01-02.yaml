    text: |
      In Rabīʿ al-Thānī of 860 the Emperor's mother died. [Magdalena](person:magdalena-de-borja) de Borja had come to the court of Gharnāṭa as a Christian bride more than fifty years before. She lived to see her son made Emperor, and she was seventy-three when she fell on a stair and did not get up. It was the second death on a stair in the family in three months, after Aḥmad of Liyūn. Nobody said anything about it aloud.

      A month later the nobles of Galicia rose against their young lord Louis, who had come to his seat at Santiago at twenty and had not yet learned to be feared. Every ṭāʾifa of the north, and the crown with them, declared for him. The first battle went to his side in Rajab.

      That summer a new generation of pilots went down the river from [Ishbīliya](place:ishbiliyya). The old men who had first rounded the Cape were ashore now, and the young ones had their own ideas. [Burhān al-Dīn](person:burhan-al-din-al-abidin), who was twenty, was sent south to find a road to the Cape that was faster than the coast and safer than the open sea. The open sea had its own opinion. His ship was caught by the winds and carried west, and by the turn of the year he was somewhere in the great ocean below the line, far from any coast the books knew. Others followed him: Uways Ḥakīmī, a Catalan named Ramon de Solanell, and a hard Turk called [Mänär](person:manar-yavantey), who had found his way into the Emperor's service and out along the coast of Benin.

      On 3 Muḥarram 861 two matters came before the Emperor. The first was his half-brother. [Yūsuf](person:yusuf-ibn-muhammad-ibn-ismail) was the old Emperor's son by the lady Jadīla, forty years old, with a house at Gharnāṭa, two wives and nine children. Through the years of trouble on the borders his name had gone round the realm as a man the soldiers would follow anywhere. He wanted, by every account, a great deal more than he had. Those closest to [Ismāʿīl](person:ismail-ibn-muhammad-ibn-ismail) told him to leave Yūsuf in Gharnāṭa and keep him there. Ismāʿīl heard them and decided the other way. Great men, he said, belonged to a great country, and a man the army loved was safer at court than away from it. He brought Yūsuf close, gave him the standing of a leader of the realm for the rest of his life, and watched him. So did [Aḥmad](person:ahmad-ibn-muhammad-ibn-ismail).

      The second matter was a happier one. The secretaries of the dīwān asked the Emperor to set the registers in order again, to number the people and their holdings as the dīwān of old had done from Qurṭuba to Baghdād. A ledger honestly kept, they said, was the foundation every strong reign had stood on. Ismāʿīl ordered the survey the same day, and the clerks went out into the provinces with their books.

      *O you who have believed, obey God and obey the Messenger and those in authority among you. And if you disagree over anything, refer it to God and the Messenger, if you should believe in God and the Last Day. That is the best way and best in result.*
    behind: |
      **What the save and the screens show.** This note draws on the saves of 7 March 1456 and 2 January 1457, and on Trent's screens of June and December 1456.
      - *Magdalena de Borja:* died 5 April 1456; the save gives the cause as falling down stairs. Born 1382. Aḥmad of Liyūn died the same way on 4 January 1456.
      - *Galicia:* a civil war ('1st Galician Nobles Civil War') began 3 May 1456, the Galician nobles against the ṭāʾifa's ruler Louis (born 1435). Al-Andalus and all its subjects are defenders. One battle so far, 20 June 1456, won.
      - *The explorers:* Burhān al-Dīn al-ʿĀbidīn, Uways Ḥakīmī and Ramon Berenguer de Solanell on Trent's screen of June 1456; Mänär on the screen of December (the save gives his name as Mänär Yavantey, of Turkic culture, malevolent). In January 1457 the save has Burhān exploring the north equatorial Atlantic, Ramon the equatorial countercurrent and Mänär the Benin coast.
      - *Yūsuf:* the event "A Prominent Figure", 1 December 1456. The save shows he was invited: he carries the prominent-leader modifier from that date. His own abilities are 53 / 65 / 38.
      - *The census:* the event "A Reckoning of the Realm", same day; the save carries the census-and-cadaster modifier.
      - *Also:* four births in the house; the Emperor's son Aḥmad gained the fiscal hawk trait. Income 736 a month, stability 25.7.

      **From Trent's account.** A new generation of explorers spreads from Seville in June 1456. Burhān travels south looking for a faster, safer route to the Cape when his ship is swept west.

      **Invented colour.**
      - Magdalena's arrival as a Christian bride; that nobody said anything aloud about the two falls.
      - Louis not yet having learned to be feared.
      - The old pilots ashore and the young with their own ideas; Mänär as a "hard Turk".
      - Those close to Ismāʿīl advising him to keep Yūsuf at Gharnāṭa (the event says they worry), and Ismāʿīl's reasoning; Aḥmad watching.
      - The clerks going out with their books.
questions:
  - Is the second fall on a stair (Aḥmad of Liyūn in January, Magdalena in April) worth anything to the story, or just the game's dice?
  - Where did Burhān's westward voyage end up, if anywhere?
