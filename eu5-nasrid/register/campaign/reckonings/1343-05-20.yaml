tellings:
  - id: 0743-12-24-the-lean-years
    'on': '1343-05-20'
    title: Of the Lean Years, the Gold of Tūnis, and the Royal Decree
    verse: '11:6'
    who:
      - yusuf-i
      - ismail-ibn-ismail
      - yahya-rahhu
      - qamar
      - khalid-ibn-yahya
      - maria-of-portugal
      - alfonso-xi
      - peter-of-castile
    where:
      - gharnata
      - malaqa
      - balansiyya
    covers:
      - 1342-01-01-renaissance
      - 1342-02-07-promote-sovereignty
      - 1342-05-02-hafsid-gift
      - 1342-08-14-catalan-privileges-restored
      - 1342-10-01-independence-cb
      - 1342-12-30-birth-khalid
      - 1343-01-27-royal-decree
      - 1343-05-20-loans
      - 1343-05-20-sovereignty
      - 1343-05-20-shared-heir
      - 1343-05-20-conversion
    text: >
      The years 742 and 743 have no battles in them, and so the chroniclers of other courts would pass over
      them in a line. This chronicle will not, for in those years the state was mended. Mending is slower work
      than war and harder to praise.


      The debt to the estates was the first matter. It had been taken on in the war with Arghūn and it hung on
      the crown like a chain, for every dīnār owed to the nobles was a dīnār's worth of their say in the
      realm's affairs. Year by year the sultan paid it down, and year by year the treasury stood empty to do
      it. By Dhū al-Ḥijja of 743 twelve more loans had been repaid, and the debt stood at four hundred and
      thirty-seven, less than half what it had been when the war with Arghūn ended. The treasury held four
      dīnārs.


      In Dhū al-Qaʿda of 742 the sultan wrote across the sea to the Ḥafṣid sultan of Tūnis. He spoke of the
      struggle for the Strait and of the burden of a lone Muslim kingdom on the Christian shore. The Ḥafṣid
      answered as a brother and sent two hundred and fifty-eight gold pieces. It was not a great sum, but he
      asked nothing in return, and the court did not forget it.


      In Rabīʿ al-Awwal of 743 the Catalan merchant privileges came back into force. They had been granted
      again in the days after the peace with Arghūn, and the merchants of Barshalūna returned to the silk
      markets of [Gharnāṭa](place:gharnata) and [Mālaqa](place:malaqa) with their ships and their credit. The
      nobles and the burghers both lost some of their weight in the realm by it, and so the crown weighed more
      beside them. In Rabīʿ al-Thānī the dīwān's quiet grievance against Qashtāla was complete: the realm now
      had a just cause for a war of independence, written and sealed, whenever it should choose to use it. It
      was locked away.


      In Shaʿbān the sultan issued the Royal Decree, by which the crown might command where before it had only
      asked. The crown's hand grew firmer by it, and the realm began, slowly, to bend toward the throne.
      Meanwhile [Ismāʿīl ibn Ismāʿīl](person:ismail-ibn-ismail) had turned his seat in the dīwān back to the
      defence of the realm's sovereignty. It stood a hair above the half, and Qashtāla's pull on the realm had
      eased.


      In the house of Raḥḥū a son was born. [Khālid](person:khalid-ibn-yahya) was the child of [Yaḥyā
      Raḥḥū](person:yahya-rahhu), the commander of the Volunteers, and the lady [Qamar](person:qamar), widow
      of the sultan Ismāʿīl and mother of Ismāʿīl ibn Ismāʿīl. So the house of the Volunteers' general was
      joined to the house of Naṣr through the old sultan's widow. The court was of two minds about it.


      In the West the Portuguese war went on, and some in the dīwān hoped it might be turned to the realm's
      use. But Queen [Maria](person:maria-of-portugal) was the wife of [Alfonso](person:alfonso-xi) of
      Qashtāla, and their son [Peter](person:peter-of-castile) was heir to both crowns. Any blow at Portugal
      was a blow at the house of Qashtāla. And in the Ṭāʾifas the call to prayer spread on.
      [Balansiyya](place:balansiyya) now counted sixty-six thousand Muslims, and Mursiyya was nearly half
      Muslim.


      *And there is no creature on earth but that upon Allāh is its provision.*
