summary: >-
  A save for Europe: three days after the peace that ended the Hundred Years' War, Edward of England is king
  of France as well. English Toulouse holds Languedoc along the Pyrenees, beside the Ṭāʾifa of Catalonia, and
  England, Castile's one ally, is the second power of the world. Al-Andalus is unchanged: 194 towns, seven
  ṭāʾifas, third in the world with 108 points. Estates estimated from the reading of 16 November. Treasury
  611; stability 2; manpower 14,100 of 15,700.
