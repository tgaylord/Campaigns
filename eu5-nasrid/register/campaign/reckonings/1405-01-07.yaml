  game: 1.4.6
summary: >-
  Ten weeks after the Peace of Avignon the conquered north rises: a Kingdom of Estremadura in the Portuguese
  lands, a Kingdom of Toledo again in La Mancha and the Madrid country, and Ciudad Rodrigo against the Ṭāʾifa
  of Shalamanka. Al-Andalus holds 100 towns of 148 and 1,295,000 people; Toledo, Lisbon and Setúbal hold. The
  rebels raise some 11,000 men, nearly all levies, against 3,400 regulars. The treasury stands at 218 with the
  Pope's gold. A rebellion, not a new border: the map shows the risings as they stood. Shares of power are
  estimated from the 1 June 1349 reading.
