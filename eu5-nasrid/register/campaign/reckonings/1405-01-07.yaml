  - id: 1405-01-01-the-risings
    'on': '1405-01-01'
    kind: war
    what: >-
      The north rises. Perhaps this was what the Pope had counted on. On New Year's Day 1405 the Portuguese
      lands proclaim a Kingdom of Estremadura and La Mancha and the Madrid country rise again as a Kingdom of
      Toledo; the next day the Leonese of Shalamanka rise against their Naṣrid ṭāʾifa as Ciudad Rodrigo.
      Forty-eight towns of the crown and sixteen of Shalamanka go over; Toledo, Lisbon and Setúbal hold
    who:
      - saad-ibn-yusuf
      - saad-ibn-ismail
