tellings:
  - id: 0740-05-05-the-day-of-uryula
    'on': '1339-11-08'
    title: Of the Day of Uryūla
    book: book-of-mending
    verse: 3:126
    who:
      - ibn-al-khatib
      - yusuf-i
    where:
      - uryula
    covers:
      - 1339-11-01-shadhili-order
      - 1339-11-08-battle-uryula
      - 1339-11-08-siege-uryula
    text: >
      At the end of Rabīʿ al-Thānī in the year 740 there came to the court a delegation of the Shādhilī
      shaykhs, sent from the great zāwiyas of Salā and Tiṭwān with letters from the chamber of the Marīnid
      sultan. They are not wanderers of the desert but men of the law and of the *Ḥikam* of Ibn ʿAṭāʾ Allāh,
      as easy at a merchant's table as at a palace door. They offered to found a zāwiya in our land and to
      lend us their brotherhood on both shores of the Strait. Our lord welcomed them, for theirs is a coin
      that the Christian kings cannot mint.


      Then Allāh gave the victory. On the fifth of Jumādā al-Ūlā the host of [Muḥammad ibn
      al-Khaṭīb](person:ibn-al-khatib) came down upon the Aragonese before the walls of
      [Uryūla](place:uryula). The infidel had eight thousand men in the field and fed more into the fight. Our
      army was twenty-one thousand: the *mutaṭawwiʿa* and the Volunteers of the Faith, the sultan's horse and
      the hired camel-riders. Their commander knew his trade, but the weight of our numbers told, and at last
      the Aragonese line broke and fled.


      Six thousand of the enemy fell or were lost, more than half his army, against four and a half thousand
      of ours, nearly all of them *mutaṭawwiʿa*, who stood in the first line and bore the brunt. It was the
      greatest victory of the reign, and the dīwān reckons that it turned the war plainly in our favour. The
      siege of Uryūla began that same day.


      *And victory comes only from Allāh, the Mighty, the Wise.*
