tellings:
  - id: 0758-07-12-roads-libraries-and-the-weavers
    'on': '1357-07-01'
    title: Of Roads, Libraries, and the Charter of the Weavers
    book: book-of-the-call
    verse: 96:3-5
    who:
      - yusuf-i
    where:
      - gharnata
      - al-mariyya
      - wadi-ash
      - basta
      - qurtuba
      - jayyan
      - ishbiliyya
    covers:
      - 1356-06-09-textile-charter
      - 1356-10-roads
      - 1356-10-libraries
      - 1357-07-northern-madrasas
    text: >
      *Read, in the name of your Lord who created.* The first word Allāh sent down to His Prophet was not
      *fight* or *rule* but *read*. In the years after the pestilence and the Sevillan revolt, our lord
      [Yūsuf](person:yusuf-i) set out to make it the first word of his government as well.


      He began, as a prudent prince does, with the wealth that would pay for it. On the ninth of Jumādā
      al-Ākhira 757 he granted a charter to the weavers of [Gharnāṭa](place:gharnata). For a generation the
      silk of the city had been carried to every market from Genoa to Tūnis, and now the guilds of the city
      had a law of their own and the protection of the crown. The looms of the Albayzín, which the plague had
      half emptied, filled again.


      In Shawwāl the roads followed. Engineers cut new ways through the mountains: south from Gharnāṭa to
      [al-Mariyya](place:al-mariyya) and its harbour, and north-east to the saffron fields of [Wādī
      Āsh](place:wadi-ash) and [Basṭa](place:basta). Tracks that a mule could barely climb in winter became
      roads that carried carts in every season. Every road the sultan built to carry silk would also carry
      teachers.


      At the same time the libraries rose, in Gharnāṭa first and then in the other cities of the south. These
      were not the treasure-houses of a prince, locked away for his own pleasure. They were rooms where any
      man who could read might sit and read. The sultan's purpose was plain, and he did not hide it. More than
      a hundred years under Qashtāla had stripped [Qurṭuba](place:qurtuba) and the valley of the great river
      of their faith and their language. The mosques had been made churches, the schools closed, and the books
      burned or carried north. The Peace of Qurṭuba had given back the land. The libraries were meant to give
      back the people.


      On the twelfth of Rajab 758 the second part of the reform began. Madrasas were founded in the northern
      cities as well, in the lands won from Qashtāla, where [Jayyān](place:jayyan) and
      [Ishbīliya](place:ishbiliyya) had not heard the law taught for a century. The jurists who taught in them
      were paid from the treasury. They were told to teach the Book and the law to anyone who would listen,
      the sons of Christian farmers among them, and not to compel anyone. The ʿulamāʾ grumbled that teaching
      unbelievers was a strange use of the treasury. The sultan answered that the Prophet had freed captives
      at Badr for teaching ten Muslim children to read, and that he could at least pay for the same in
      reverse.


      The court did not expect quick results, and it got none. In the year the northern madrasas opened, three
      in every ten souls in Qurṭuba were Muslims, the same as at the peace, and about one in ten in the valley
      around it. But a madrasa is not built for a year. It is built for a hundred.


      *Read, and your Lord is the most Generous, who taught by the pen, taught man that which he knew not.*
  - id: 0759-09-02-the-great-madrasa-of-qurtuba
    'on': '1358-08-08'
    title: Of the Great Madrasa of Qurṭuba, and the Foreign Wisdom
    book: book-of-the-call
    verse: '58:11'
    who:
      - yusuf-i
      - saad-ibn-yusuf
      - dua-marinid
      - sayyida-of-fezzan
      - ismail-ibn-yusuf
      - jadila-bint-yusuf
      - tizemt-hafsid
      - ali-ibn-yusuf
      - maryam-bint-yusuf
      - fatima-bint-yusuf
      - muhammad-ibn-yusuf
    where:
      - qurtuba
      - fas
      - jayyan
      - gharnata
      - istijja
      - ishbiliyya
      - malaqa
      - urjuba
    covers:
      - 1358-02-great-madrasa-qurtuba
      - 1358-08-08-foreign-wisdom
      - 1358-08-08-works
    text: >
      In Ṣafar of the year 759 the masons came to [Qurṭuba](place:qurtuba) again, this time to build for Allāh
      and not for the governor. Beside the great mosque, which the Castilians had made a cathedral and which
      still stood as one, our lord [Yūsuf](person:yusuf-i) began a Great Madrasa. It was meant to be the
      largest college west of [Fās](place:fas). Qurṭuba's Muslims were few, perhaps three in ten, but there
      were more each year: converts from the Christian quarters, Andalusīs back from exile in the mountains,
      students drawn by the libraries. The old mosques of the city could no longer hold them, and the old
      learning of the city had no house. The Great Madrasa was to be both.


      Nor was it the only work that year. By Ramaḍān the dīwān's register of works read like a census of the
      realm's ambitions. There was a madrasa rising in [Jayyān](place:jayyan) and a guild of spinners in
      [Gharnāṭa](place:gharnata). There were marketplaces in [Istijja](place:istijja),
      [Ishbīliya](place:ishbiliyya) and [Mālaqa](place:malaqa), and a road of gravel to [Yuz
      Aryuba](place:urjuba). The dīwān paid for its new clerks out of the crown's own coffers, so that no
      estate could claim to own them. The sultan's son [Saʿd](person:saad-ibn-yusuf), ten years old that year,
      was allowed to sit at the foot of the table when the register was read. His tutors wrote that he asked
      of every work not what it would cost but what it would bring in, and how soon.


      The mind behind much of this sat in the dīwān and not on the throne. [Duʿāʾ](person:dua-marinid), the
      Marīnid wife who had taken a seat in the council in 756, had become the most talked-about minister in
      the realm. She had grown up in the palaces of Fās and had seen how the Marīnids ran their colleges and
      their chanceries. She brought those methods to Gharnāṭa: the endowments that paid for the madrasas, the
      registers that counted their students, and the habit of asking what a thing cost before praising it.
      Scholars and merchants praised her for the fresh air she brought into a court that had grown stale in
      the lean years. The nobles were troubled. A foreigner, a woman and a Marīnid sat at the sultan's right
      hand, and they did not like any of the three. They muttered it to each other, and once, unwisely, to the
      sultan. He told them that the Prophet's wife Khadīja had been a merchant and his wife ʿĀʾisha a scholar,
      and asked which of them they would have advised him against. [Sayyida](person:sayyida-of-fezzan) said
      less and said it better. The first wife kept her own court in the harem, with its own poets and its own
      guests, and it was noticed that the scholars who praised Duʿāʾ in the dīwān were not asked to it.


      The harem that had brought Duʿāʾ to the council had filled by then, as the women of the palace had
      foretold at Saʿd's birth, though not with sons alone. [Sayyida](person:sayyida-of-fezzan) had borne the
      sultan [Ismāʿīl](person:ismail-ibn-yusuf) and [Jadīla](person:jadila-bint-yusuf).
      [Tizemt](person:tizemt-hafsid) had borne him [ʿAlī](person:ali-ibn-yusuf),
      [Maryam](person:maryam-bint-yusuf) and [Fāṭima](person:fatima-bint-yusuf). Duʿāʾ had borne him a son,
      [Muḥammad](person:muhammad-ibn-yusuf), a sickly child, and lost him that spring when he was barely two.
      The nurses said that little Maryam was as quick as Saʿd had been at her age.


      The Great Madrasa took years to finish, as such houses do. But from the year it was begun the call to
      prayer was heard more often in Qurṭuba. By the year the War of Independence began, nearly four in ten of
      the city's people were Muslims.


      *Allāh raises those who have believed among you and those who were given knowledge, by degrees.*
