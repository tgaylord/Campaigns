    text: >
      While [Gharnāṭa](place:gharnata) won its war in the east, the Marīnids lost theirs in the west. For
      three years the lion of [Fās](place:fas) had fought Qashtāla to reclaim al-Andalus, and Gharnāṭa, bound
      by tribute to the one side and by its word to the other, had watched from the mountains and was never
      drawn in. When the reckoning came, it did not have to share it.


      On the sixth of Jumādā al-Ūlā in the year 741 Abū al-Ḥasan made his peace with Qashtāla, and he paid for
      it with everything his house still held on the Iberian shore. [Runda](place:runda) on its gorge passed
      to the Christians, and [Marballa](place:marballa) on the coast. So did [al-Jazīra
      al-Khaḍrāʾ](place:al-jazira-al-khadra), the green island where Ṭāriq's army first came ashore, and
      [Jabal Ṭāriq](place:jabal-tariq) itself, the mountain that bears his name. For six hundred years Muslims
      had crossed the Strait and found Muslim harbours waiting. Now every harbour between Mālaqa and the Ocean
      flew the castle of Qashtāla. Gharnāṭa was the last Muslim crown in al-Andalus, and Qashtāla held towns
      inside the realm's own mountains, Runda and Marballa, like thorns in a hand.


      The court mourned the towns and did not mourn the lesson. The Marīnids, it was said, are a great help to
      have across the water and a poor one to have on the same shore. They had lost al-Andalus once already.
      The scales of the Strait swung far toward Qashtāla that year, and the sultan resolved that Gharnāṭa
      would be its own weight on them and not a counterweight in another man's hand.


      Three days before the peace, word came from the west that Portugal had fallen into civil war. Queen
      [Maria](person:maria-of-portugal), who is also the wife of Alfonso of Qashtāla, faced a rising by her
      own younger brother, [Peter](person:peter-of-portugal). The dīwān watched it closely. A crown fighting
      itself cannot lend its spears to its neighbours.


      And on the first of Jumādā al-Ākhira a royal marriage bound the house of Naṣr to the princely house of
      the Ṭāʾifa of [Balansiyya](place:balansiyya): the lady [Fāṭima](person:fatima-bint-ismail), the sultan's
      sister, was given in marriage into it. What had been made by treaty was now sealed in blood, so that the
      prince of the ṭāʾifa might count himself kin to the sultan and not only his servant.


      *And these days We alternate among the people.*
