  - id: 0740-02-26-the-ghuzat-al-mujahidin
    'on': '1339-09-02'
    title: Of the First Blood at Jumalla, and the Coming of the Ghuzāt
    book: book-of-mending
    verse: '9:41'
    who:
      - yusuf-i
      - ibn-al-khatib
      - yahya-rahhu
    where:
      - gharnata
      - mursiyya
      - jumalla
      - al-mariyya
      - shaluqa
      - muntil
      - tilimsan
      - al-karash
    covers:
      - 1339-05-24-war-on-aragon
      - 1339-05-24-aragon-allies
      - 1339-06-13-battle-shaluqa
      - 1339-08-12-battle-muntil
      - 1339-08-18-battle-jumalla
