    text: >
      When the war against Arghūn was proclaimed, the Christian kings came to stand beside their kinsman as
      crows gather to one carcass: the king of Mayūrqa, the king of Nabarra, and the lord of Qalyari across
      the sea. [Ibn al-Khaṭīb](person:ibn-al-khatib) led the host out by the road through
      [Mursiyya](place:mursiyya) and made his camp there, twelve thousand six hundred strong. Most of them
      were *mutaṭawwiʿa*, volunteers of the towns who take up the sword for the faith.


      The first blood of the war was shed at [Jumalla](place:jumalla) on the eleventh of Ṣafar in the year
      740. A company of five hundred levies from [al-Mariyya](place:al-mariyya) came upon five men of Arghūn.
      Not one of the five lived to carry the news home, and not one of ours was scratched. It was a small
      thing. The poets of the court have nonetheless made a great deal of it, and the chronicle records it so
      that the reader may smile.


      The war of the Marīnids went a little better that summer. At [Shalūqa](place:shaluqa), on the fourth of
      Dhū al-Ḥijja 739, the men of Fās broke a Castilian army at last. They lost three hundred and seventy and
      killed two thousand seven hundred. In Ṣafar, though, a Tunisian column was cut down at
      [Munṭīl](place:muntil). Five days after Jumalla the men of [Tilimsān](place:tilimsan), fewer than five
      hundred, held [al-Karash](place:al-karash) against two and a half thousand Castilians.


      On the twenty-fifth of Ṣafar there came to [Gharnāṭa](place:gharnata) a great company of volunteers for
      the jihad, the *Ghuzāt al-Mujāhidīn*, most of them Amazigh from across the water. At their head was
      [Yaḥyā Raḥḥū](person:yahya-rahhu) of the Zanāta, a man of nine and thirty, bold in the fight and able in
      counsel, but known to bend with the wind. The dīwān warned that such men are kingmakers, and that in the
      contest for the Strait whoever pays their wages may come to hold the throne. Some urged the sultan to
      keep only those whose loyalty was certain. Our lord answered: *let these men serve, all of them.* On the
      next day he took the Volunteers of the Faith into his pay, ten thousand foot and twelve hundred
      *tornadizo* horse, and Yaḥyā rode at their head as a general of Gharnāṭa.


      The treasury groans under it. Even before the volunteers came, the realm was spending fifty-one dīnārs a
      month against an income of twenty-seven. But the sultan has an army now such as Gharnāṭa has not seen in
      a generation, and he means to use it before the road through Mursiyya closes.


      *Go forth, whether light or heavy, and strive with your wealth and your lives in the cause of Allāh.*
