tellings:
  - id: 0847-02-27-of-the-jamaa-of-847-and-the-island-of-fernando-po
    'on': '1443-06-26'
    title: Of the Jamāʿa of 847, and the Island of Fernando Po
    book: book-of-the-golden-century
    verse: '30:46'
    who:
      - muhammad-ibn-ismail-ibn-saad
    where:
      - ishbiliyya
    covers:
      - 1443-06-26-the-jamaa-of-847
      - 1442-06-01-national-assemblies
      - 1432-05-01-the-green-cape
      - 1432-05-01-trading-posts
    text: >
      A year after the Emperor [Muḥammad](person:muhammad-ibn-ismail-ibn-saad) had seated the burghers in the
      Jamāʿa, the assembly met again at [Ishbīliya](place:ishbiliyya), on 27 Ṣafar 847. Everyone at court
      expected a quarrel. The umarāʾ had not forgiven the merchants for their seats, and the merchants had not
      forgotten how loudly the lords had protested. The clerks prepared for a long session.


      It was short. The umarāʾ brought the first business of the session, and it was not a grievance. They
      asked the crown to push the empire's settlements further down the African coast and out into the Ocean,
      with lords of the great houses to lead them and lands to be granted there to the men who took them. Some
      of the lords wanted estates to replace the land rights they had lost at home. Others wanted to be away
      from a court where they now had to sit beside cloth merchants. The burghers, who had expected to oppose
      them, found that the lords were asking for exactly what the merchants wanted too: new ports, new
      harbours for the ships of the Green Cape and the gold coast, and new goods to sell. The two estates that
      had hated each other for a year voted together, and the motion passed before the noon prayer.


      The assembly named its first object. In the Gulf of Guinea, beyond the trading posts of Kaabu and past
      the mouths of the great rivers, the pilots had found a high green island rising out of the sea, with a
      mountain at its heart, a good anchorage and people of its own: the island of Fernando Po. The Jamāʿa
      asked for it, the burghers offered to share the cost, and the Emperor, who had never needed persuading
      about anything that floated, agreed.


      The princes noted that the new Jamāʿa had done in a morning what the old one had never managed in a
      season. The Emperor took it as proof that he had been right.


      *And among His signs is that He sends the winds as bearers of good news, and to let you taste His mercy,
      and so that the ships may sail at His command, and that you may seek of His bounty.*
