summary: >-
  Granada has answered Morocco's call and stands at war with Castile, Portugal and Aragon; taking up arms
  against its overlord has suspended the tributary bond to Castile; the war will decide whether Granada keeps
  its independence. The Volunteers of the Faith have risen again under Yaḥyā Raḥḥū. Shares of power are
  estimated from the 11 August 1340 reading; no law or privilege has changed since January 1345.
