tellings:
  - id: 0756-03-04-the-governor-and-the-harem
    'on': '1355-03-19'
    title: Of the Governor of Qurṭuba, and the Brides from Across the Sea
    book: book-of-balance
    verse: 16:72
    who:
      - yusuf-i
      - dua-marinid
      - tizemt-hafsid
      - sayyida-of-fezzan
      - faraj-ibn-ismail
      - fatiu-ghana
      - shama-sahara
      - aisha-bint-faraj
      - yahya-rahhu
    where:
      - qurtuba
      - gharnata
      - ishbiliyya
      - fas
    covers:
      - 1354-03-01-royal-marriage-central-sahara
      - 1354-07-governor-begun
      - 1354-08-12-marinid-marriage
      - 1354-11-19-hafsid-marriage
      - 1355-ghana-marriage
      - 1355-yahya-council
      - 1355-powerful-harem
      - 1355-yahya-dies
      - 1355-dua-council
      - 1355-03-15-governor-qurtuba
      - 1355-03-19-calm
      - 1355-03-28-birth-aisha
    text: >
      The so-called kingdom had been beaten, but our lord [Yūsuf](person:yusuf-i) knew that the valley of the
      great river had not been won. A man who means to keep a valley must sit in it. So on the sixteenth of
      Jumādā al-Ākhira in the year 755 the masons began work on a governor's seat in [Qurṭuba](place:qurtuba),
      the old city of the Umayyads. The road from [Gharnāṭa](place:gharnata), built when Qurṭuba was the
      capital, still ran through the hills. For two hundred and fifty days the court's men rebuilt halls that
      had stood empty since the Castilians came. On the twenty-ninth of Ṣafar 756 the governor took his seat.
      From that day the crown's word went up and down the river as easily as the barges, as far as
      [Ishbīliya](place:ishbiliyya).


      While the masons worked, the sultan kept two promises made long before. On the twenty-second of Rajab
      755 he married [Duʿāʾ](person:dua-marinid) of the house of [Fās](place:fas). She had been promised to
      him in the year of the war with the three crowns, and she was the one thread to Fās that had not been
      cut when Qashtāla made the Marīnids tear up their treaties. On the third of Dhū al-Qaʿda he married
      [Tizemt](person:tizemt-hafsid) of Tūnis. In three months two daughters of the Maghrib had come to the
      Alhambra to stand beside [Sayyida](person:sayyida-of-fezzan), the first wife. The harem grew, and with
      it a new kind of power. The *ḥarīm* had always been a household. Now it became a court within the court,
      full of women who had learned statecraft in the palaces of Fās and Tūnis, and their clients and their
      whispers. The nobles complained that power was flowing inward, to the throne and to the women around it,
      and no one at court troubled to deny it.


      Not every marriage went as the court intended. [Faraj](person:faraj-ibn-ismail), the sultan's elder
      brother and lately regent, married [Fatiu](person:fatiu-ghana), a princess of Ghāna, and went south
      across the desert to live at her father's court. The court said it was the harem's work: a brother who
      might have been a rival was now a guest at the edge of the world. Those who knew him said he went
      gladly. Faraj had always looked south. He kept Saharan guides at his table, he had married into the
      desert once already, and he talked of the salt roads and the gold of the Niger the way other princes
      talked of horses. He left behind in Gharnāṭa his first wife, [Shamʿa](person:shama-sahara), of a ruling
      house of the Sahara, whom he had married the spring before, and she was with child. Three months after
      he had gone she bore him a daughter, [ʿĀʾisha](person:aisha-bint-faraj). His seat in the dīwān went to
      [Yaḥyā Raḥḥū](person:yahya-rahhu), the Zanāta general who had led the Volunteers of the Faith against
      Arghūn. Yaḥyā sat there barely a month. On the fourth of Ṣafar he died of an illness, at fifty-four. The
      court called it a coincidence, and said so a little too often.


      Twenty days later the empty seat went to Duʿāʾ. She was the most capable of the sultan's wives, and the
      law of the harem now allowed a woman to sit in the council. The great houses watched a Marīnid princess
      take her place among the viziers and said nothing in public. [Sayyida](person:sayyida-of-fezzan), the
      first wife and the mother of the heir, said one thing, to her women, and it went round the palace by
      evening: that the law of the harem had been made for the women of the house, not for the daughters of
      its enemies.


      By Rabīʿ al-Awwal the fruit of all this was plain. The remitted tax and the new governor together had
      stopped a second Castilian rising before it began. The valley paid its dues, the crown's hold on it grew
      month by month, and for the first time since the Peace of Qurṭuba the sultan could look at the map
      without counting the towns he might lose.


      *And Allāh has made for you from yourselves mates and has made for you from your mates sons and
      grandchildren.*
