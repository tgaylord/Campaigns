tellings:
  - id: 0741-02-28-the-two-taifas
    'on': '1340-08-23'
    title: Of the Two Ṭāʾifas
    verse: '13:11'
    who:
      - yusuf-i
      - joan-doriola
      - juan-manuel-enriquez
      - yusuf-ibn-muhammad
    where:
      - gharnata
      - balansiyya
      - jumalla
      - shatiba
      - uryula
    covers:
      - 1340-08-14-cb-independence
      - 1340-08-23-taifas
      - 1340-08-23-taifa-rulers
      - 1340-08-23-strengthen-government
      - 1340-08-28-loans-repaid
      - 1340-08-28-demobilised
      - 1340-08-28-taifa-loyalty
    text: >
      The thirteen towns won from Arghūn were a gift that could choke the one who swallowed it. Nearly two
      hundred thousand souls lived in them, and three in four were Christians, Catalans and Aragonese who had
      never known a Muslim lord. The dīwān of [Gharnāṭa](place:gharnata) had neither the clerks nor the
      soldiers to govern them from the Alhambra. The sultan's counsellors remembered how the old caliphate had
      fallen. The great city had tried to hold everything, and in the end it held nothing.


      So our lord [Yūsuf](person:yusuf-i) chose the way of the old kings of al-Andalus, before the caliphs and
      after them. On the twenty-eighth of Ṣafar in the year 741 he raised two ṭāʾifas, two lesser kingdoms
      bound to Gharnāṭa by oath and tribute and ruled by their own princes. The first was the Ṭāʾifa of
      [Balansiyya](place:balansiyya), twelve towns with the great city among them, from
      [Shāṭiba](place:shatiba) to [Uryūla](place:uryula). Over it he set [Joan d'Oriola](person:joan-doriola),
      a Catalan lord of that land who had taken the faith of Islam. The second was the Ṭāʾifa of Mursiyya,
      which for now was only the one town of [Jumalla](place:jumalla). Over it he set [Juan Manuel
      Enríquez](person:juan-manuel-enriquez), a Castilian and likewise a convert, a hard soldier with no gift
      for words. Both princes kept the Christian names they were born with, for their people knew them by
      those names and would follow them more readily. So the crown's own towns, thirty-one on the day of the
      peace, were eighteen again, the old realm of the mountains and the sea, with two tributary kingdoms at
      its side.


      Neither ṭāʾifa loved its new master. The prince of Balansiyya was near content and growing more so. The
      prince of Mursiyya was a Castilian, and his loyalty was thin. The sultan's envoys went to both with
      gifts and assurances, and the dīwān settled down to the long work of making friends of them.


      At home the realm put down its arms. The host of nineteen regiments was sent back to its villages until
      three remained. Five of the loans owed to the estates were repaid from the gold of the peace, and the
      debt fell from nine hundred and sixty-four dīnārs to eight hundred and forty-three. The treasury was
      left almost bare again. The sultan's cousin [Yūsuf ibn Muḥammad](person:yusuf-ibn-muhammad), who had
      spent three years defending the realm's sovereignty, was turned to strengthening the government. Within
      days of the peace the clerks of the dīwān began, very quietly, to set down the realm's claims against
      Qashtāla, the long grievance of tribute and lost lands that would one day justify a war of independence.
      No one spoke of it aloud. The scales were not ready.


      *Allāh does not change the condition of a people until they change what is in themselves.*
