    text: >
      The dīwān had agreed in the year of the conquest that Sicily should have a ṭāʾifa of its own when the
      Mamlūks' war was over. The Mamlūks' war was not over. Over the year 855 a second idea came to the court,
      and it grew stronger with every month the first was put off.


      [Ismāʿīl](person:ismail-ibn-muhammad-ibn-ismail) argued for the ṭāʾifa. That was how the realm had
      always held what it took: under a house of the blood, bound by marriage, with its own court and its own
      levies. It was how the north had been held for forty years.
      [Aḥmad](person:ahmad-ibn-muhammad-ibn-ismail) argued for the crown. A ṭāʾifa king would build for
      himself, he said. A governor would build for the realm, and Sicily needed roads, mills and harbours more
      than it needed another court. The [Emperor](person:muhammad-ibn-ismail-ibn-saad) settled it, as he
      settled most things, by what pleased him. He did not want to give away the palace of the Norman kings,
      the cathedral, the harbour of Balarm and the wheat of the island to a cousin. Sicily would have a
      governor, answerable to the dīwān, and the ṭāʾifa would wait. Everyone at court understood "for now" in
      his own way.


      Through all that year the news from the east was bad. The Mamlūks' war on the Banū Lām had gone wrong in
      the Ḥijāz. By the end of 854 the men of the Banū Lām held Makka and Madīna, with Jeddah and Yanbuʿ,
      their ports on the Red Sea. The Holy Cities were in the hands of the Mamlūks' enemies. The Mamlūks had
      gone to war to make themselves masters of the Red Sea coast, and they had lost the cities whose
      protection was their first title to rule. In Jumādā al-Ākhira 855 their army caught a column of the Banū
      Lām at al-Ukhaydir and destroyed it, but the cities were not retaken. The Emperor had stood in the Ḥaram
      himself eighteen years before. He took the news harder than anyone at court. Al-Andalus was at war
      beside Cairo and had not sent one ship or one man. Ismāʿīl said that Cairo had not asked. The Emperor
      said that Cairo should not have had to.


      Meanwhile the treasury, which had been full at the start of the year, was spent almost to nothing. Most
      of it went where Aḥmad's gold always went. There were new paper mills at [Ishbīliya](place:ishbiliyya),
      [al-Mariyya](place:al-mariyya) and [Shantarīn](place:shantarin), and above all at
      [Shāṭiba](place:shatiba). Shāṭiba had made the best paper in the west since before the Christians took
      it, and it was making it again under the crown. There were jewellers at [Qurṭuba](place:qurtuba),
      [Jayyān](place:jayyan) and [Sharīsh](place:sharish), a library at [al-Ushbūna](place:al-ushbuna), a
      quarry at Balarm for the governor's builders, and paved roads where there had been tracks. On 22 Dhū
      al-Qaʿda a grandson was born to Aḥmad, the son of his son Muḥammad. They named him Aḥmad.


      No new land was found that year. The explorer [ʿAbd al-Jalīl](person:abd-al-jalil-al-qubbasi) was
      somewhere beyond the Cape, and the ships of the Kongo trade came and went. But by the turn of the year
      the voyages had changed the way the realm thought. In the madrasas of Ishbīliya students argued over the
      maps the pilots brought home. The merchants priced the wares of lands no Andalusī had seen, and the
      jurists asked what the law owed to peoples it had never heard of. By 2 Dhū al-Qaʿda 855 the court was
      speaking of the world as larger than the books had said. It did not yet know how much larger.


      *Have they not travelled through the land and have hearts by which to reason and ears by which to hear?
      For indeed, it is not eyes that are blinded, but blinded are the hearts which are within the breasts.*
    behind: >-
      **What the saves show.** This note draws on an autosave of 1 February 1451 and a save of 21 December
      1451.

      - *Sicily:* its 22 towns are still held directly in December, and there is no new subject. Trent's
      account explains why: the crown, "for now". The court's debate and who argued what are invented, but
      they follow the princes' arcs.

      - *The Holy Cities:* the Banū Lām's occupation of Mecca, Medina, Jeddah, Yanbuʿ, Khaybar and the rest
      shows in every save from 29 November 1450 to 21 December 1451. The August 1449 save doesn't have it. The
      Mamlūks' victory at al-Ukhaydir (24 July 1451) is the war's only battle that year. Trent had said the
      Mamlūks were failing on the Red Sea coast; the saves show how badly.

      - *The treasury:* 2,812 in February, 26 in December. The building difference covers most of it: paper
      mills (Seville, Almería, Xàtiva, Santarém), jewellers, a library at Lisbon, a quarry at Palermo, a
      cannon foundry at Jaén, lumber mills and cloth. Trent's screenshot of 26 November shows paved roads
      under construction. Two armouries and a grand palace are gone from the count, and the save doesn't say
      why.

      - *Stability:* it fell from 23.6 to 16.1, and the saves don't explain it either.

      - *The New World:* the institution and its date come from Trent's screenshot, and "no discovery, just
      the entrenchment of exploration ideals" is his account.

      - *The house:* the prince Aḥmad's grandson Aḥmad was born on 16 December 1451.


      **Invented colour.**

      - *Sicily:* the "second idea" growing as the first was put off; Ismāʿīl's and Aḥmad's arguments; the
      Emperor deciding by what pleased him; "for now" read differently by everyone.

      - *The Holy Cities:* the Emperor taking the news hardest, and the exchange with Ismāʿīl about Cairo.

      - *Xàtiva:* its paper is real history.

      - *The New World:* the students, the merchants and the jurists.
questions:
  - Stability fell from 23.6 to 16.1 during 1451. Why?
  - >-
    Two armouries and a grand palace are gone from the building count since November 1450. What happened to
    them?
  - 'Sicily: a governor ''for now''. What would make the court raise a ṭāʾifa after all?'
