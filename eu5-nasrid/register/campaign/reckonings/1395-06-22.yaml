  - id: 1395-06-22-peace-castile-portugal
    'on': '1395-06-22'
    kind: peace
    what: >-
      The Peace of Ramaḍān with Castile and Portugal, which ends the War of the League and the third war of
      the Istirdād. Four days after Portalegre, with the war score at a hundred, King Pedro of Castile
      surrenders, and King Jerónimo of Portugal must follow him. Castile gives up 51 towns, from Salamanca,
      Ávila and Ciudad Rodrigo in the west through Madrid, Alcalá and Guadalajara to Cuenca, Molina and
      Requena in the east, with the Cáceres and Plasencia country of upper Extremadura; Portugal gives up 20,
      Lisbon, Setúbal, Santarém and Évora among them, all the land south of the Tagus mouth and the Alentejo.
      Castile pays reparations for ten years. All 71 towns pass directly to the crown; the realm grows from
      118 towns to 189 and from 1,291,000 people to 2,334,000
