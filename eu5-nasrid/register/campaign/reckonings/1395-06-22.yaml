  - id: 0797-04-12-of-the-days-of-banbaluna-and-ejea
    'on': '1395-02-04'
    title: Of the League, the Ships of Catalonia, and the Days of Banbalūna and Ejea
    book: book-of-the-marches
    verse: '61:4'
    who:
      - saad-ibn-yusuf
      - pedro-of-castile
      - agustin-arce
      - rodrigo-de-borja
    where:
      - ishbiliyya
      - fas
      - balansiyya
      - banbaluna
      - qalat-ayyub
    covers:
      - 1393-coalition
      - 1393-02-24-death-of-alfons
      - 1394-01-02-eve-of-war
      - 1394-01-06-pedro-of-castile
      - 1394-03-04-war-on-castile
      - 1394-06-13-battle-mouths-rhone-ii
      - 1394-07-03-battle-atlantic
      - 1394-07-14-battle-mouth-douro
      - 1394-09-18-battle-bay-setubal-ii
      - 1394-08-siguenza
      - 1394-08-18-battle-grosseto
      - 1394-09-11-battle-piombino
      - 1394-11-15-battle-grosseto-ii
      - 1394-08-14-algarve-armies
      - 1394-09-the-chase
      - 1394-10-12-battle-pamplona
      - 1394-11-17-return-from-the-north
      - 1394-12-14-battle-ejea
      - 1395-02-04-battle-penafiel
      - 1395-05-24-battle-montalcino
    text: >
      The peace of 779 had been made for fifteen years, and the Christians spent the last of them afraid. In
      Jumādā al-Ākhira 795 Qashtāla, Portugal and the little mountain lordship of Andorra swore a league
      against al-Andalus. The court at [Ishbīliya](place:ishbiliyya) took it as a compliment, and when the war
      came it named the war after the League. Its spies had been inside Qashtāla for two years. By the turn of
      the Christian year the dīwān had its claim ready, and the ʿulamāʾ gave the cause its name. The
      chroniclers of Qashtāla had long written of their wars on al-Andalus as a recovery of what the Goths had
      lost. The ʿulamāʾ turned the word around: al-Istirdād, the Recovery, of what the Christians had taken.
      They counted the War of the Upper March and the War of the Aragonese Restoration as its first two wars.
      This would be the third. Five days later, King Fernando of Qashtāla died at fifty-nine, and his son
      [Pedro](person:pedro-of-castile), twenty-three, stubborn and fond of his wine, inherited the war his
      father had seen coming.


      On 1 Jumādā al-Ūlā 796 the Emperor [Saʿd](person:saad-ibn-yusuf) declared it. The four ṭāʾifas marched
      with him, and so did the Marīnids of [Fās](place:fas) with their vassals and the Mamlūks of Miṣr with
      theirs. With Qashtāla stood Portugal, Andorra, and the Pope in Rome, with his cities of Siena and
      Faenza.


      The sea war went both ways. In Shaʿbān the fleet of Fās, seventy-two sail, caught the Pope's squadron at
      the mouths of the Rhône and sank all fourteen of its galleys. Far out on the Ocean, though, a Castilian
      squadron of only eleven ships hunted the Catalan fleet down three times: off Galicia, at the mouth of
      the Duero, and in the bay of Setúbal. Of the thirty-three ships Catalonia had sent out, three came home.
      The Castilians lost none.


      On land, the Christians struck first and struck the weakest. In Shawwāl Qashtāla's great host,
      twenty-four thousand men, came down past Sigüenza onto the small armies of the ṭāʾifas. Arghūn's fell
      back in time. [Balansiyya](place:balansiyya)'s did not, and it died there to the last man, three
      thousand nine hundred and fifty-eight of them, for a hundred and forty Castilians. In the same week the
      Portuguese came down into the Alentejo and destroyed both armies of the Ṭāʾifa of the Algarve, at
      Setúbal and at Montemor.


      The Emperor had seventeen thousand six hundred men and no wish to meet twenty-four thousand on their own
      terms. He followed them north instead. Through Shawwāl and Dhū al-Qaʿda his host shadowed the Castilians
      up the Aragonese border, from [Qalʿat Ayyūb](place:qalat-ayyub) toward the Ebro and Tudela, with the
      Catalans and Aragonese on their other flank, waiting for the Castilians to make a mistake. On 16 Dhū
      al-Ḥijja they made it. They had chased an Aragonese army of nearly nine thousand into the hills of
      Navarre, and at [Banbalūna](place:banbaluna) they found the Emperor across their road. Their pursuit was
      cut off and their host beaten, nearly two and a half thousand of theirs lost for fewer than fifteen
      hundred of ours, and the Castilians went back the way they had come in haste.


      They came south again with the cold weather, still nearly twenty-two thousand strong, under the best
      general left to Qashtāla. [Agustín Arce](person:agustin-arce) was Grand Master of the Order of
      Alcántara, fifty years old, a soldier since boyhood. On 10 Ṣafar 797 the Emperor caught him on the plain
      of the Cinco Villas at Ejea de los Caballeros. It was ground of Arce's choosing, and the officers told
      the Emperor so. He attacked anyway, and he did not command it from a hill. He was forty-six, and for
      nine days he rode among his men from first light, ate what they ate and slept where they slept. Through
      all nine the Grand Master held, and the knights of Alcántara were all that the chronicles of their order
      would later claim. On the ninth day they broke. Ten thousand eight hundred Castilians were dead or
      scattered, against some four thousand seven hundred of ours. That one field moved the war further than
      the whole of the summer before it.


      What was left of Arce's host fled west into Old Castile, nearly eleven thousand men with no fight left
      in them. On 12 Rabīʿ al-Thānī, at Peñafiel on the Duero, fewer than nine hundred horsemen of the Ṭāʾifa
      of Arghūn found them. They rode for the boy-king [Rodrigo](person:rodrigo-de-borja), whose father had
      died two years before, and they cut down or scattered more than ten and a half thousand men without
      losing one of their own. Qashtāla had no army left in the field.


      Only in Tuscany did the war go badly for the faithful. There the men of Barqa and a Mamlūk detachment,
      sent to keep the Pope busy at home, were beaten by the Sienese, twice at Grosseto, once at Piombino and,
      when the spring came, at Montalcino. The Pope stayed busy, though, and he sent nothing more to Qashtāla.


      *Indeed, Allāh loves those who fight in His cause in a row as though they are a single structure joined
      firmly.*
  - id: 0797-09-03-of-portalegre-and-the-peace-of-ramadan
    'on': '1395-06-22'
    title: Of the Stand at Portalegre, and the Peace of Ramaḍān
    book: book-of-the-marches
    verse: '24:55'
    who:
      - saad-ibn-yusuf
      - pedro-of-castile
      - jeronimo-of-castile
    where:
      - al-ushbuna
      - majrit
      - shalamanka
      - qunka
      - yabura
      - shantarin
      - tulaytula
      - ishbiliyya
      - balansiyya
    covers:
      - 1389-05-01-castile-portugal-split
      - 1395-06-18-battle-portalegre
      - 1395-06-22-peace-castile-portugal
    text: >
      With Qashtāla's armies gone, the war passed to Portugal. Its king was
      [Jerónimo](person:jeronimo-of-castile), fifty-two, who had once worn the crowns of Qashtāla and Portugal
      together and had kept only the second when they parted six years before. He had lost a war to the
      Emperor already, in 779, and he had no wish to lose another. In the spring he gathered every man
      Portugal could raise, nearly fifteen thousand of them, and waited on the Alentejo border at Portalegre.


      The Emperor came to him on 10 Shaʿbān 797 with fourteen thousand six hundred, the Aragonese riders of
      Peñafiel and the Mamlūk contingents beside him. The armies were near enough equal that the Portuguese
      had reason to hope, and for eighteen days they held. On 28 Shaʿbān they broke, with some seven thousand
      of theirs lost for fewer than four thousand of ours. The scribes of the dīwān reckoned the war complete.
      There was nothing left that the Christians could put in the field, and nothing left that the Emperor
      could not take.


      On the third day of Ramaḍān, King [Pedro](person:pedro-of-castile) of Qashtāla asked for peace, and
      Portugal, which had gone to war for Qashtāla, was made to sign beside him. It was signed in the holy
      month, so the court called it the Peace of Ramaḍān, and the preachers of [Ishbīliya](place:ishbiliyya)
      made much of the date at the Friday prayer. So ended the War of the League, the third war of the
      Istirdād.


      Qashtāla gave up fifty-one towns. In the west it lost [Shalamanka](place:shalamanka) on the Tormes, the
      largest of them, with Ávila behind its walls, Ciudad Rodrigo, Ledesma and the Leonese country to the
      Portuguese border. Beyond the Guadarrama it lost [Majrīṭ](place:majrit), the fortress the amīr Muḥammad
      built on the Manzanares five hundred years before to guard the road to [Ṭulayṭula](place:tulaytula), and
      Alcalá, Guadalajara and Sigüenza, where the army of [Balansiyya](place:balansiyya) had died. To the east
      went [Qūnka](place:qunka), Molina and Requena, and to the south-west Cáceres, Plasencia and Coria, the
      upper country of the old Lower March. Qashtāla would also pay reparations for ten years.


      Portugal gave up twenty: Setúbal and the Sado, [Yābura](place:yabura) and the Alentejo from Elvas to
      Portalegre, [Shantarīn](place:shantarin) on the Tagus, and [al-Ushbūna](place:al-ushbuna) itself.
      Al-Ushbūna had been a city of al-Andalus for four hundred and thirty years before the crusaders took it,
      and now, after more than two centuries under the cross, it was one again. Its mosques had become
      churches, and they would stay churches. The court said so plainly at the signing, for the Emperor meant
      al-Ushbūna to know at once that he had come to rule its Christians, not to unmake them: they would keep
      their worship under him, so long as they kept the peace and paid what the dhimma asked of them.


      All seventy-one towns passed directly to the crown. The realm grew in a day from a hundred and eighteen
      towns to a hundred and eighty-nine, and its people by a million, to more than two million three hundred
      thousand souls. The war itself had cost the realm nearly a hundred and fifty thousand of its own. The
      scribes added up the new figures more slowly than the old. The Castilians in the empire now outnumbered
      the Andalusīs two to one, with the Leonese and the Portuguese besides, and the Christians outnumbered
      the faithful three to one.


      No Muslim ruler had held so much of the peninsula since the caliphs. And no Muslim ruler had ever ruled
      so many Christians. The foreign courts watched the empire to see whether it would choke on what it had
      swallowed, and for a season they ranked it lower than they had before the war. In the dīwān the question
      was already how such lands should be governed, and by whom. The ṭāʾifas of the north had taught the
      court that Christians would obey a Christian king who owed his crown to the Emperor more readily than a
      Muslim governor, and there was talk of new ṭāʾifas in the conquered lands, from the Leonese country in
      the west to the hills of Qūnka in the east.


      *Allāh has promised those among you who believe and do righteous deeds that He will surely make them
      successors upon the earth, as He made those before them successors.*
  - id: 0797-09-03-of-the-encircling-sea-and-fifteen-years-of-building
    'on': '1395-06-22'
    title: Of the Encircling Sea, and Fifteen Years of Building
    book: book-of-the-encircling-sea
    verse: '16:14'
    who:
