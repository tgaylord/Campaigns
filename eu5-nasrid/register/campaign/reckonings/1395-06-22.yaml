date: '1395-06-22'
title: The Peace of Ramaḍān
source:
  save: SP_ADU_1395_06_22 (compressed)
  game: 1.4.6
summary: >-
  At the Peace of Ramaḍān, 22 June 1395, Castile surrenders the War of the League at +100%, and Portugal
  follows: the third war of the Istirdād ends. Castile gives up 51 towns, Madrid, Salamanca, Ávila, Cuenca and
  Cáceres among them, and pays reparations for ten years; Portugal gives up 20, Lisbon, Setúbal, Santarém and
  Évora among them. All 71 pass to the crown: the realm grows from 118 towns to 189 and from 1,291,000 people
  to 2,334,000, and Catholics now outnumber Sunnis three to one. The game ranks it twelfth, down from ninth at
  the declaration. The treasury stands at 235. Shares of power are estimated from the 1 June 1349 reading.
