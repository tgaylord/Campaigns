    text: >
      The geographer al-Idrīsī, who wrote for a Norman king in Ṣiqilliya, tells of eight cousins of
      [al-Ushbūna](place:al-ushbuna) who fitted out a ship with water and food for months and sailed west into
      the Ocean, to learn what was in it and where it ended. The geographers called that Ocean al-Baḥr
      al-Muḥīṭ, the Encircling Sea, because it was believed to run around the whole inhabited world. The
      sailors called it the Sea of Darkness. The cousins found islands, some of them deserted and some of them
      inhabited, and a people who held them prisoner until a king sent them home blindfolded. The Ushbūnīs
      called them the Mugharrirūn, the men who were led astray, and named a street of the city after them. Two
      hundred and fifty years after the Christians took al-Ushbūna, it is a city of al-Andalus again, and the
      empire has its own Mugharrirūn at sea. This book tells how al-Andalus turned to the Ocean.


      The court dates it from the Jamāʿa of 7 Muḥarram 781, which moved the capital from the mountains to
      [Ishbīliya](place:ishbiliyya) for its river and its market. A capital on a river that runs down to the
      Ocean needed ships, and the empire had four. It also had the Catalan shipwrights, who had already been
      sent to build galleys for the Mamlūks in five ports, and now they built for their own sovereign. By the
      declaration of 796 the fleet numbered sixteen. Its first admiral of the blood was the crown prince
      [Ismāʿīl](person:ismail-ibn-saad), who took the command at seventeen and held it until the Ḥijāba called
      him into the dīwān.


      The court had called Saʿd the Conqueror since the year 766. In these fifteen years the Conqueror became
      the greatest builder the house of Naṣr had known. He studied a smelter's accounts as closely as the plan
      of a siege, and every dīnār the crown did not spend on war and on settling the new lands went into
      building. Lumber mills went up in the Sierra Morena around [Qusanṭīna](place:qusantina), in the campiña
      below it at [Qarmūna](place:qarmuna) and [Istijja](place:istijja), and at the capital itself, to feed
      the shipwrights, and their number went from nine to twenty-two. In the marshes of [Walba](place:walba),
      [Labla](place:labla) and [Ayamunt](place:ayamunt), and on the bay of [Qādis](place:qadis), the crown
      raised eight smelters for the bog iron that lies under the reeds, with eight charcoal-burners to feed
      them. The silver of Qusanṭīna, held since the bargain of 752, went to the jewellers, whose guilds went
      from seven to fifteen, most of them at Ishbīliya. There were four new workshops for tools and five for
      cloth, and in the fields of [Sharīsh](place:sharish), [Baṭalyaws](place:batalyaws) and
      [Mursiyya](place:mursiyya) cotton was planted again, as it had been under the caliphs until the
      Castilians let it die.


      The trade needed markets, and the crown built nine more, with three great warehouses at Ishbīliya. It
      needed honest weights, and the Ḥisba gave it inspectors. It needed money that could travel without a
      camel to carry it, and the banking offices went from one, a Genoese house at Ishbīliya, to eight, in
      [Qurṭuba](place:qurtuba), [Gharnāṭa](place:gharnata), [Mālaqa](place:malaqa),
      [Ṭulayṭula](place:tulaytula) and the capital. The trade of the African coast brought men as well as
      gold, as it always had, and two slave markets opened at Ishbīliya.


      He did not build for the purse alone. Because a city of al-Andalus is not a city without them, the crown
      raised eleven hammams, from [al-Mariyya](place:al-mariyya) to Baṭalyaws. The libraries of the realm went
      from five to eleven and its madrasas from four to seven, and there were five hospitals where there had
      been three. And at Ishbīliya the empire at last gave itself the house of a capital: the halls of a royal
      court, a hall for the scribes of the dīwān, and a royal garden beside them.


      The scribes counted it all on the eve of the Peace of Ramaḍān. The crown's income, a hundred and one
      dīnārs a month when the court came down to Ishbīliya, was a hundred and forty-five. By then [Khayr
      al-Dīn al-Jayyānī](person:khayr-al-din-al-jayyani) was charting the coast toward Mali, the Emperor's
      ships had gone out to the sea of the Azores and to Madeira, and the crown was fitting out new voyages to
      the Canaries and the islands beyond them.


      *And it is He who subjected the sea, that you may eat from it tender meat and bring forth from it
      ornaments to wear. And you see the ships ploughing through it, that you may seek of His bounty.*
