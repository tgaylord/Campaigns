      - shant-yaqub
      - malaqa
      - al-mariyya
      - al-ushbuna
      - balansiyya
      - mursiyya
    covers:
      - 1431-06-24-the-warmongers-name
      - 1431-10-01-the-second-crusade
      - 1431-10-03-genoa-joins-the-crusade
      - 1431-11-20-battle-oristano
      - 1431-11-26-battle-gulf-talamone
      - 1431-12-05-battle-gulf-talamone
      - 1431-12-20-battle-coast-lazio
      - 1431-12-31-battle-tivoli
      - 1432-01-27-battle-gulf-olbia
      - 1432-02-01-battle-gulf-orosei
      - 1432-03-14-battle-corsica-channel
      - 1432-03-26-battle-pitigliano
      - 1432-05-the-dar-al-sinaa
      - 1432-05-01-the-green-cape
      - 1430-07-15-santiago-falls
      - 1404-02-01-the-crusade
    text: >
      Here begins the Book of the Franks.


      For seven hundred years, since the first governors of al-Andalus failed to take a cave in the Asturian
      hills, there had always been some corner of the peninsula where a Christian king still ruled. After the
      Peace of Ṣafar there was none. Every town from Finisterre to the Pyrenees belonged to the Emperor or to
      a lord who owed his throne to him. The courts of Christendom had watched al-Andalus come north for sixty
      years, one war at a time. Now they had to decide what to do about it, and the answer began with the
      rubble of Shant Yāqub.


      The first sign came from inside the palace. In Shawwāl 834 a pamphlet began to pass from hand to hand at
      court in [Ishbīliya](place:ishbiliyya). It said that the Emperor
      [Muḥammad](person:muhammad-ibn-ismail-ibn-saad) was a ruthless warmonger, a man who had destroyed the
      shrine of an Apostle out of spite and who would drag the realm into war with all of Christendom. No one
      knew who had written it. The dīwān expected the Emperor to find someone to hang for it, and offered him
      several names. He refused them all. He had the pamphlet read to him, and he told the dīwān that it was
      true and that he did not mind who knew it. A man who sold his estates' grain for every dirham it would
      fetch had never cared to be loved, and a warmonger, he said, was what the Christians called a Muslim who
      won. The courts of Europe heard of his answer within the month, and they did not take it as a joke.


      On 23 Muḥarram 835 (1 October 1431) the Pope at Rome, [Fabrizio Ricci](person:pope-fabrizio-ricci),
      proclaimed a crusade against al-Andalus, the second to be preached against the empire by name. The
      first, in 806, had ended with the Emperor [Saʿd](person:saad-ibn-yusuf) in the Pope's own city of
      Avignon. This Pope was sixty, a careful and hard-working man, and his crusade fell where the first one
      had. He declared war on the Ṭāʾifa of Arghūn and its king [Rodrigo de Borja](person:rodrigo-de-borja),
      who was the brother of the Empress [Magdalena](person:magdalena-de-borja) and the uncle of the heir
      [Ismāʿīl](person:ismail-ibn-muhammad-ibn-ismail), and he named Barbastro as the crusade's prize. The
      Pope himself held three towns and had thirteen ships and no army. The Church's call brought him
      Provence, the archbishops of Cologne and Trier, a dozen lords of the German and French lands, and from
      the far edge of the world Ireland and Iceland. The English king, who now ruled France, did not come. The
      court said that he had heard what had happened at Avignon.


      Every ally of al-Andalus answered on the same day. All eight ṭāʾifas came in, the new Ṭāʾifa of
      Jillīqiya among them, so that [Diego Sotomaior](person:diego-sotomaior) of Shant Yāqub marched against a
      crusade preached in revenge for his own city. With them came the Mamlūks of Miṣr and all their vassals
      from Makka to Suakin, the Marīnids of Fās, and the Ḥafṣids of Tūnis.


      Two days later the crusade found its real strength. Genoa joined it, with Siena and Aquileia. Genoa had
      eleven towns, Corsica and Arborea in Sardinia, a trading colony on the Black Sea, and twenty-four war
      galleys. Its merchants had been the rivals of the merchants of Ishbīliya on the western sea for as long
      as the empire had had a fleet. Its doge Raimondo was a clever diplomat who would not trouble the Pope
      for long if the trade turned against him, but while the war lasted the western sea was no longer the
      empire's own.


      The war that winter was fought far from al-Andalus, and the Emperor's own army never left its camps. The
      fleets of the Maghrib carried it to Italy. The Ḥafṣids landed men in Sardinia and on the coast of Lazio,
      within a few days' march of Rome, and won and lost by turns. The Pope had found himself an admiral, a
      Slav named [Vukmir Janković](person:vukmir-jankovic), and in Rabīʿ al-Awwal and Rabīʿ al-Thānī he showed
      what one good seaman could do. With six ships he destroyed a squadron of fourteen from Tripoli in the
      Gulf of Talamone. Then, with fifteen Genoese galleys beside his own, he fell on the fleet of Tūnis off
      Lazio and sank or took fifteen of its twenty-four ships for the loss of one. That was the high-water
      mark of the crusade at sea. In Jumādā al-Ūlā the Marīnids came up, and with the ships of Tūnis and Barqa
      they put a hundred and eighty-five sail into the waters off Sardinia. Nine papal ships that attacked
      them in the Gulf of Olbia were lost to the last one, and seventeen of Aquileia's twenty-eight in the
      Gulf of Orosei. In Rajab Vukmir attacked again in the Corsica Channel with the five ships he had left,
      and lost them all. On land the crusaders had the stranger captain. Their army in Tuscany was led by
      [Khayr al-Dīn Khayyām](person:khayr-al-din-khayyam), an Andalusī and a Muslim, who sold his company of
      jinetes to whoever paid. He beat the Tunisians at Tivoli, and in Rajab at Pitigliano the Moroccans broke
      his army of seventeen thousand with four and a half thousand. The court of Ishbīliya was not sure
      whether to be ashamed of him or proud.


      The Emperor had waited his whole life for a war at sea. The fleets of Fās and Tūnis had won the winter,
      and he did not mean to owe the next war to them. In Shaʿbān 835 he ordered arsenals built in seven ports
      of the empire, of the kind the caliphs of Qurṭuba had called the dār al-ṣināʿa, the house of making: at
      [Ishbīliya](place:ishbiliyya), [Mālaqa](place:malaqa), [al-Mariyya](place:al-mariyya),
      [al-Ushbūna](place:al-ushbuna), [Balansiyya](place:balansiyya), Cartagena and
      [Mursiyya](place:mursiyya). The Christians had taken the word along with the thing and called it the
      arsenal. Each one would take two years to finish, and the treasurers reminded him what seven of them
      would cost. He signed the orders anyway, and had seven war galleys laid down on the slipways beside them
      before a single arsenal wall was up. In the same month the four towns of the islands of the Green Cape
      were made a land of their own, as the dīwān had promised the first settlers, under an Andalusī governor,
      [ʿAbd al-Wahhāb Barakat](person:abd-al-wahhab-barakat), at Santiago. The Emperor's eyes were on the sea
      in every direction. The admirals of Ishbīliya said that it was the first time since his accession that
      they had seen him look happy.


      *And of His signs are the ships in the sea, like mountains. If He willed, He could still the wind, and
      they would remain motionless on its surface. Indeed in that are signs for everyone patient and
      grateful.*
    behind: >-
      The reputation event is from Trent's screenshot of 24 June 1431. The save of 1 October 1431 holds an
      "embraced antagonism" bias against al-Andalus, so the Emperor embraced the name. The crusade's
      participants come from that save. Genoa, Siena and Aquileia joining on 3 October, with Genoa's subjects,
      and the two small actions of November come from the autosave of 1 December 1431, which isn't a
      checkpoint. The Pope is Fabrice Ricci in the game; the chronicle gives him the Italian form of his name,
      as the game's own localization does for other languages. The arsenals are Trent's account and his
      screenshot of the game's Dar al-Sina'a building. The save of 1 May 1432 shows seven under construction
      (Seville, Málaga, Almería, Lisbon, Valencia, Cartagena and Murcia), about 1,760 gold already paid for
      them, and seven of the mod's Andalusī war galleys queued at Lisbon, Murcia, Faro, Orihuela, Málaga,
      Seville and Almería. The same save carries the winter's 23 battles, all fought by allies and subjects,
      and a war score of 4 in the allies' favour. It also shows Cape Verde made a colonial nation on 1 May
      1432, which Trent's account doesn't mention. Naval losses in the war tables are in ships; a fraction
      means ships damaged, not sunk. Khayr al-Dīn Khayyām is a character of the game's mercenary pool,
      Andalusī and Sunni, commanding the Campagna army.


      Invented colour: what the pamphlet said beyond "ruthless warmonger", the names the dīwān offered and the
      Emperor's reply, Europe hearing of it within the month, the court's reason for the English king staying
      out, the old rivalry between the merchants of Genoa and Ishbīliya, the doge's readiness to leave the war
      if trade turned against him, the treasurers' reminder, the admirals' remark, and the court's mixed
      feelings about Khayr al-Dīn.


      The trading posts entry (Book VI) is from Trent's account and the save of 1 May 1432. That save shows
      eight overseas trading posts under construction in Kaabu, a vassal of Mali, at Bafatá, Bintang, Bissau,
      Cacheu, Casamance, Diaboudior, Gambia and Tankular. It also shows a new trade office at Cairo with 22
      construction stages queued, 9 more stages for Marrakesh (level 3) and 6 for Sijilmasa (level 4). None of
      these is in the save of 1 October 1431. The office in Genoa (level 1) is in both saves. Invented colour:
      the posts as wharves and stores, the treasurers' question and the Emperor's answer, and his reason for
      keeping the Genoa office open. The Red Sea route of the spices is history, not the save.
