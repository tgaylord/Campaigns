  - id: 0835-08-29-of-the-trading-posts-of-the-gold-coast-and-the-spice-road
    'on': '1432-05-01'
    title: Of the Trading Posts of the Gold Coast, and the Spice Road
    book: book-of-the-encircling-sea
    verse: 106:1-2
    who:
      - muhammad-ibn-ismail-ibn-saad
      - tiramakhan-mali
      - ismail-ibn-saad
    where:
      - ishbiliyya
    covers:
      - 1432-05-01-trading-posts
      - 1428-06-03-embassy-to-niani
      - 1432-05-the-dar-al-sinaa
    text: >
      A crusade was being fought in the waters of Sardinia, and the Emperor
      [Muḥammad](person:muhammad-ibn-ismail-ibn-saad) was thinking about the rivers of Guinea. His father
      [Ismāʿīl](person:ismail-ibn-saad) had sent envoys to Niani and won the Mansa's word that Andalusī
      merchants would pay no tariff anywhere in Mālī. The son meant to use it. In the spring of 835 the crown
      began eight trading posts on the coast of Kaabu, the Mansa's vassal on the Gambia and the rivers south
      of it: at the mouth of the Gambia, at Bintang, on the Casamance and at Diaboudior, at Cacheu and Bissau,
      and at Bafatá and Tankular. They were stores and wharves more than towns, where the ships that watered
      at the islands of the Green Cape could load the gold that came down the rivers from the mines of the
      interior without sending a single caravan across the Ṣaḥrāʾ.


      The caravans were not forgotten either. The empire already kept trade offices at Niani and at Timbuktu,
      at the ports of Ifrīqiya and Sicily, and in the cities of the Marīnids. Now the offices at Marrakesh and
      at Sijilmasa, where the gold of the desert road came out of the sands, were ordered enlarged again and
      again, and a new office was opened at Cairo, beside the Emperor's embassy there, with a plan for its
      growth that ran to more than twenty stages. Cairo was where the pepper, cloves and cinnamon of the
      Indies came up the Red Sea from the ports of Yemen, and the Emperor wanted the spices of the East to
      reach Ishbīliya through the hands of his own merchants and those of his Mamlūk allies, with no Venetian
      or Genoese in between.


      The treasurers asked whether this was the time. The fleet had seven arsenals to pay for, and the crusade
      was not over. The Emperor said that the war would end and the trade would not, and that the Genoese were
      at war with him for the same reason he was building in Cairo. The empire still kept a trade office in
      Genoa itself, and he gave no order to close it.


      *For the accustomed security of the Quraysh, their accustomed security in the caravan of winter and of
      summer, let them worship the Lord of this House, who has fed them against hunger and made them safe from
      fear.*
  - id: 0835-08-29-of-the-warmongers-name-the-crusade-of-835-and-the-arsenals
    'on': '1432-05-01'
    title: Of the Warmonger's Name, the Crusade of 835, and the Arsenals
    book: book-of-the-franks
    verse: 42:32-33
    who:
      - muhammad-ibn-ismail-ibn-saad
      - pope-fabrizio-ricci
      - vukmir-jankovic
      - khayr-al-din-khayyam
      - abd-al-wahhab-barakat
      - rodrigo-de-borja
      - magdalena-de-borja
