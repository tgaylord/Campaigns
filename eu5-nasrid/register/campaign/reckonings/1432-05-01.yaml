  - id: 1431-10-03-genoa-joins-the-crusade
    'on': '1431-10-03'
    kind: war
    what: >-
      Two days in, the crusade widens: the Pope's allies Genoa, Siena and Aquileia join it, and Genoa brings
      its subjects, Orange, Arborea in Sardinia, Corsica, Cuneo and Gazaria on the Black Sea. The Genoese
      fleet, 24 ships, is the crusade's real strength at sea
    threads:
      - crusade-of-835
      - europe
    from:
      - save
      - told
    cite: Trent's account; autosave of 1 December 1431
    detail:
      joined:
        - Genoa
        - Siena
        - Aquileia
      genoeseSubjects:
        - Orange
        - Arborea
        - Corsica
        - Cuneo
        - Gazaria
      genoa: 11 towns, 3,000 men, 24 ships; its doge Raimondo (28/81/46) favours the Ghibellines
