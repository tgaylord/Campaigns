date: '1432-05-01'
title: The Arsenals
source:
  save: SP_ADU_1432_05_01 (compressed)
  game: 1.4.7
summary: >-
  Seven months into the Crusade of 835. The war has been fought at sea and in Italy and Sardinia by the
  allies' fleets and armies; al-Andalus's own army hasn't fought, and the war score stands at 4 in the allies'
  favour. Seven arsenals and seven war galleys are under construction. The four Cape Verde towns have just
  become a colonial dominion, leaving the crown 192 towns. Stability 6.2, prestige 96, treasury 1,878. Estates
  estimated from the reading of 16 November 1428.
