      By November 1423 the Catalans stand at court beside the Andalusīs and the Portuguese as an accepted
      culture, as the dīwān intended once Balansiyya was integrated, and the Sephardim, long tolerated and
      under the Emperor's protection since the year of Avignon, are accepted with them
