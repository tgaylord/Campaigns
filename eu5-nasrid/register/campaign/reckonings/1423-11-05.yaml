  - id: 1421-08-01-the-secret-of-the-naft
    'on': '1421-08-01'
    kind: world
    what: >-
      The Secret of the Naft. Ethiopia offers the Emperor a sum of money for the empire's naft, its fire
      weapons. To sell is to let them be used against al-Andalus one day; the court answers that it will never
      backfire
    who:
      - ismail-ibn-saad
    from:
      - seen
    cite: Trent's screenshot, 1 August 1421
    detail:
      event: The Secret of the Naft
      text: >-
        Ethiopia has offered us a sum of money if we are to sell them some of our weaponry, specifically the
        nafts. We can accept, but that will allow them to potentially use them against us (the game's text)
      choice: >-
        It will never backfire (the option whose tooltip is open; the other was 'They will not have our
        weapons!')
      effects:
        Ethiopia: unlocks the Naft Throwers unit type
        al-Andalus: receives 419.55 gold from Ethiopia, 200% of yearly income
      realm:
        treasury: 610 before the sale
        population: 2.459 million
        army: 4,900
        fleets: six squadrons of 7–8 ships
      diwan:
        - integrating Trujillo
        - integrating Ocaña
        - integrating Cáceres
        - encouraging migration to Ishbīliya
        - developing Ishbīliya
  - id: 1421-11-04-kingdom-of-burtuqal
    'on': '1421-11-04'
    kind: realm
    what: >-
      The Ṭāʾifa of Burtuqāl proclaims itself the Kingdom of Portugal. Its lord Aḥmad ibn Ismāʿīl, the
      Emperor's cousin, takes the crown of the old kings and remains the Emperor's ṭāʾifa; the new kingdom's
      state faith is Catholic, the faith of its people, though its king is a Muslim
    who:
      - ahmad-ibn-ismail-ibn-yusuf
      - ismail-ibn-saad
    from:
      - save
    cite: save of 5 November 1423
    detail:
      rank: county to kingdom
      tag: ABA10 to POR
      stateReligion: Catholic (Sunni before)
      ruler: Aḥmad ibn Ismāʿīl ibn Yūsuf, Sunni
      towns: 34
      population: 698000
