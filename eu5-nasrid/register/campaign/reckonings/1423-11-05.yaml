  game: 1.4.7
summary: >-
  Five weeks after the Mamlūks went to war with the Ottomans, and a month after al-Andalus answered their call
  with all seven ṭāʾifas. The Ṭāʾifa of Burtuqāl has been the Kingdom of Portugal since 4 November 1421, still
  the Emperor's. Catalans and Sephardim are now accepted cultures beside the Portuguese. The crown holds 189
  towns, with new settlements on Gran Canaria, the Cape Verde islands and Flores. Estates estimated from the
  reading of 31 December 1415. Treasury 232; stability 17.
