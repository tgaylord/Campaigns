  - id: 1423-03-26-the-three-brides
    'on': '1423-03-26'
    kind: marriage
    what: >-
      By 1423 the heir's sons are married. Ismāʿīl has taken three princesses of the three Muslim empires
      around him: Tella of Fās, sister of the sultan Yaḥyā; Ayaulym of Miṣr, daughter of the Mamlūk sultan
      Aqṭāy; and Khadīja, daughter of the Ottoman sultan Aḥmad. His brother Aḥmad has married Dīma of the
      Ḥafṣids of Tūnis, Muʾmina of Burtuqāl and ʿĀʾisha bint Saʿd. Their first children are born in 1422
    who:
      - ismail-ibn-muhammad-ibn-ismail
      - ahmad-ibn-muhammad-ibn-ismail
      - yahya-marinid
      - aktai-mamluk
      - ahmad-ottoman
      - ahmad-ibn-ismail-ibn-yusuf
    threads:
      - two-princes
      - house
    from:
      - save
    cite: save of 5 November 1423
    detail:
      date: >-
        not in the save; the marriages lie between September 1420 and January 1422, when the first children
        were born. Dated here to the first save that shows them
      children:
        - Yūsuf, son of Ismāʿīl and Tella, 6 January 1422
        - ʿĀʾisha, daughter of Ismāʿīl and Khadīja, 24 January 1422
        - Jadīla, daughter of Ismāʿīl and Ayaulym, 29 June 1422
        - Saʿd, son of Aḥmad and Muʾmina, 29 April 1423
        - Muʾmina, daughter of Aḥmad and ʿĀʾisha, 14 June 1423
