tellings:
  - id: 0841-10-12-of-the-charter-of-majrit-and-the-land-rights-of-the-umara
    'on': '1438-04-08'
    title: Of the Charter of Majrīṭ, and the Land Rights of the Umarāʾ
    verse: '28:57'
    who:
      - muhammad-ibn-ismail-ibn-saad
      - ismail-ibn-muhammad-ibn-ismail
      - ahmad-ibn-muhammad-ibn-ismail
      - ismail-ibn-saad
    where:
      - majrit
      - tulaytula
      - ishbiliyya
    covers:
      - 1438-04-08-the-charter-of-majrit
      - 1438-04-08-land-rights-unravelled
      - 1428-05-25-primacy-revoked
    text: >
      [Majrīṭ](place:majrit) had been a frontier fort when the amīr Muḥammad I built it on the Manzanares, to
      guard the road to [Ṭulayṭula](place:tulaytula) against the Christians of the north. Nearly six hundred
      years later it had become something else. The road it guarded now ran through the middle of the empire,
      and the town had grown along it faster than any other in the interior, a market of wool, grain and
      leather where the drovers of the meseta met the merchants of Ṭulayṭula. In the spring of 841 its
      burghers came to [Ishbīliya](place:ishbiliyya) to ask the Emperor for a city charter.


      The Emperor [Muḥammad](person:muhammad-ibn-ismail-ibn-saad) did not want to give it. "Why should I grant
      such a favour so far from the sea?" he asked the dīwān. "Won't the city merely wither and die?" Every
      dirham the crown spent, in his view, should float.


      The two princes saw a different chance. [Ismāʿīl](person:ismail-ibn-muhammad-ibn-ismail) and
      [Aḥmad](person:ahmad-ibn-muhammad-ibn-ismail) had taken up the work their grandfather
      [Ismāʿīl](person:ismail-ibn-saad) had begun and never finished: the breaking of the umarāʾ. The great
      houses had lost their mercenaries, their lordships and their equality with the crown. They had kept
      their land. In the integrated territories of the north they still held their estates by right, could
      open new mines and fields as they pleased, raise villas, and bind the peasants a little tighter to the
      soil every year. The northern umarāʾ wanted Majrīṭ's charter to fail as little as the burghers did,
      because their wool and grain went through its market, and the princes made them pay for it. In Shawwāl
      841 the charter was granted, and the umarāʾ of the north agreed in return that their Land Rights in the
      integrated territories would be unravelled, slowly, one estate at a time.


      Nobody at court pretended that this was a fair bargain. To soften it, the crown granted the great houses
      a yearly stipend for the patronage of the arts, so that every noble household might keep its poets,
      musicians and copyists. The clerks of the treasury, who paid it, called it by its real name, the fund
      that kept the umarāʾ from open mutiny. The Emperor signed both orders without much interest. The princes
      had spent the winter working out exactly what each one was worth.


      *Have We not established for them a safe sanctuary, to which are brought the fruits of all things as
      provision from Us?*
  - id: 0843-02-02-of-the-emperor-who-became-a-scholar
    'on': '1439-07-15'
    title: Of the Emperor Who Became a Scholar
    verse: '39:9'
    who:
      - muhammad-ibn-ismail-ibn-saad
      - ismail-ibn-saad
      - saad-ibn-yusuf
      - ismail-ibn-muhammad-ibn-ismail
      - ahmad-ibn-muhammad-ibn-ismail
    where:
      - ishbiliyya
      - majrit
    covers:
      - 1439-07-15-the-emperor-a-scholar
      - 1438-04-08-land-rights-unravelled
      - 1437-03-01-the-new-world-institution
    text: >
      The Emperor [Muḥammad](person:muhammad-ibn-ismail-ibn-saad) had been told all his life that he was not
      the man his forebears were. His grandfather [Saʿd](person:saad-ibn-yusuf) had restored al-Andalus and
      his father [Ismāʿīl](person:ismail-ibn-saad) had built it a madrasa in every town, and the court had
      judged him unfit at twelve and said so again when he took the throne. He had never argued. He had gone
      to sea instead, and then to Makka, and only two years before, when the old men hailed the age of the
      caliphs come again, he had accepted the compliment for his forebears and gone back to his ships. Then,
      in the year 842, past fifty, he did something no one at court had expected of him: he began to read.


      He read the way he did everything, slowly and without shame. He had the pilots of the Ocean voyages
      brought to him to explain their charts, and kept them until he understood the charts himself. He sat in
      on the lectures of the madrasa of Ishbīliya, at the back, and asked the questions the students were too
      proud to ask. He had the astronomers explain the instruments by which a ship found its latitude, and the
      physicians explain the plagues that came in with the ships, and the engineers of the arsenals explain
      why one hull was faster than another. Within the year, by Ṣafar 843, the scholars of the court had
      stopped humouring him and begun to argue with him, and they agreed among themselves that he understood a
      new idea, once he had it, better and faster than most of them. Under him the realm took up new learning
      more readily than it ever had, and the madrasas taught more children to read.


      He did not pretend to be his father. He said that his father had known things and he had to find them
      out, and that the finding out was the part he enjoyed. The court noticed that he had begun to say "the
      old Emperors" with less weight in his voice than before.


      It was a hard year at home. The umarāʾ had not taken the loss of their land rights quietly, the stipend
      for their poets notwithstanding, and the peace of the realm had fallen further in a year than in any
      year since the risings of 807. The princes [Ismāʿīl](person:ismail-ibn-muhammad-ibn-ismail) and
      [Aḥmad](person:ahmad-ibn-muhammad-ibn-ismail) spent it appeasing the estates while the charter of
      [Majrīṭ](place:majrit) worked its way through the chancery. The Emperor left that to them and went back
      to his books.


      *Say: Are those who know equal to those who do not know? Only they will remember who are people of
      understanding.*
  - id: 0844-01-09-of-the-trade-war-with-genoa-and-the-angevins
    'on': '1440-06-10'
    title: Of the Trade War with Genoa and the Angevins
    verse: 83:1-3
    who:
      - muhammad-ibn-ismail-ibn-saad
      - rodrigo-de-borja
      - edward-v-of-england
    where:
      - ishbiliyya
      - barshaluna
    covers:
      - 1440-06-the-catalan-privileges
      - 1440-06-the-genoese-embargo
      - 1432-05-01-trading-posts
      - 1432-07-27-peace-with-the-pope
    text: >
      The crusade had been fought with ships and swords. The war that followed it was fought with ledgers, and
      it had been coming for years. The merchants of Ishbīliya had outgrown the western sea. Their offices ran
      from Niani to Cairo, the Emperor's arsenals had given them a fleet, and the markets of Ishbīliya,
      [Barshalūna](place:barshaluna) and al-Ushbūna were each the first of their region. The merchants of
      Genoa, who had been the masters of that sea before them, had watched every one of those offices open.


      The first quarrel was at home. In the last days of Dhū al-Ḥijja 843 the Andalusī merchants of the crown
      brought a complaint to the dīwān. In the Ṭāʾifa of Arghūn, under King [Rodrigo de
      Borja](person:rodrigo-de-borja), the Catalan merchant houses still kept the privileges they had held
      since before the Restoration: their own consuls, their own courts, their own rates at the customs. Now
      that Barshalūna itself belonged to the crown, the merchants asked why the Catalans of Arghūn should
      trade on better terms than the Emperor's own subjects. The dīwān heard them and did nothing. The king of
      Arghūn was the Empress's brother, and the Emperor had a larger quarrel on his hands.


      In the same weeks Genoa closed Italy to the merchants of al-Andalus. The Genoese did not do it alone.
      The court of King [Edward](person:edward-v-of-england) in London, which ruled France as well, had leaned
      on them all spring, and the embargo they proclaimed reached every port and market where Genoa's word
      counted. The answer from Ishbīliya came within days, in the first week of Muḥarram 844. No merchant of
      the Angevin crowns, English, French or Gascon, would be received in any port of the Emperor. The admiral
      prince Yūsuf was given the order to enforce it at sea.


      The old merchants of the capital said that a trade war hurt both sides and helped neither, and that the
      Venetians would be the only ones to profit. The young ones said that the Franks would need Andalusī
      sugar, gold and paper long before al-Andalus needed English wool. The Emperor, who had read a good deal
      about trade by then, agreed with the young ones. He also ordered the treasurers to tell him every month
      what it was costing.


      *Woe to those who give less than due, who, when they take a measure from people, take in full. But if
      they give by measure or by weight to them, they cause loss.*
  - id: 0844-05-04-of-the-radiant-city-restored
    'on': '1440-10-01'
    title: Of the Radiant City Restored
    verse: 26:128-129
    who:
      - muhammad-ibn-ismail-ibn-saad
    where:
      - qurtuba
      - ishbiliyya
    covers:
      - 1440-10-01-the-palace-city-of-qurtuba
      - 1439-07-15-the-emperor-a-scholar
      - 1437-01-01-cultural-hegemon
    text: >
      Three miles west of [Qurṭuba](place:qurtuba), on the slope where the Sierra Morena comes down to the
      plain, the caliph ʿAbd al-Raḥmān III had built a city for himself and named it Madīnat al-Zahrāʾ, the
      Radiant City. It had palaces of marble and onyx, a hall whose roof was said to be made of gold and
      silver tiles, gardens watered from the mountains, a mosque, a mint and barracks for the caliph's guard.
      Ambassadors from Constantinople and the German emperor had been received there and told to wait in halls
      designed to make them feel small. It had stood for less than eighty years. In the fitna of the eleventh
      century, when the caliphate tore itself apart, the Berber soldiers sacked it, and for four hundred years
      its stones had been carried off to build other men's houses. By the time the house of Naṣr took Qurṭuba
      back, it was a field of broken columns that the shepherds of the Sierra used as a sheepfold.


      The Emperor [Muḥammad](person:muhammad-ibn-ismail-ibn-saad) went to see it in Jumādā al-Ūlā 844. He had
      been reading the histories of the caliphate, as he now read everything, and he walked the ruins for a
      whole day with the old books in the hands of a secretary, matching the descriptions to the stones. When
      he came back to [Ishbīliya](place:ishbiliyya) he told the dīwān that he would rebuild it. Some in the
      dīwān said that a ruin was a ruin and that the money would be better spent on ships. He answered that
      every king and pretender in Christendom who doubted the empire's right to the peninsula should be made
      to wait in its halls, as their ancestors had waited. He paid for the first year's work out of his own
      treasury.


      The masons, glassmakers and goldsmiths came from every city of the empire, and the merchants of
      Ishbīliya sent fine cloth for the hangings at prices that the clerks thought suspiciously low. A year
      later the halls of the Radiant City were standing again on the slope above Qurṭuba, built over the old
      foundations and as close to the old descriptions as the Emperor and his secretaries could make them. The
      court began to receive ambassadors there. The crown's hold on the country around it tightened, and the
      town below grew prosperous on the custom of the court. Across the peninsula, the court noticed, people
      had begun to speak of the Emperor as the caliphs' heir, which was what the court had intended.


      *Do you construct on every elevation a sign, amusing yourselves, and take for yourselves palaces that
      you might abide eternally?*
  - id: 0846-01-21-of-the-jamaa-of-846-and-the-burghers
    'on': '1442-06-01'
    title: Of the Jamāʿa of 846, and the Burghers
    verse: '42:38'
    who:
      - muhammad-ibn-ismail-ibn-saad
      - ismail-ibn-muhammad-ibn-ismail
      - ahmad-ibn-muhammad-ibn-ismail
      - ismail-ibn-saad
    where:
