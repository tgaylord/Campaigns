      - 1442-06-01-privileges-for-the-burghers
      - 1428-05-25-jamaa-against-primacy
      - 1439-07-15-the-emperor-a-scholar
      - 1440-06-the-genoese-embargo
    text: >
      The Emperor [Muḥammad](person:muhammad-ibn-ismail-ibn-saad) called the Jamāʿa to
      [Ishbīliya](place:ishbiliyya) in Muḥarram 846, and for once he did not tell his sons what he meant to
      say to it. The princes [Ismāʿīl](person:ismail-ibn-muhammad-ibn-ismail) and
      [Aḥmad](person:ahmad-ibn-muhammad-ibn-ismail) had steered the realm for thirteen years. They had argued
      him out of Qashtāla, bargained Majrīṭ's charter out of the umarāʾ, and spent a year of their lives
      appeasing the estates. They learned what he intended at the same moment as the assembly did. He was the
      Emperor, he told them afterwards, and he had read more about the empires of old than either of them.


      What he had read was this. The empires that lasted were the ones that listened to the men who made their
      money, and the ones that fell were the ones whose princes and lords had stopped listening. Rome had been
      ruined by its senators, and Baghdad by its soldiers. He did not intend al-Andalus to be ruined by its
      umarāʾ. The realm already had the first market of the Middle Sea, a fleet of its own building and
      trading offices from Niani to Cairo, and it was fighting a trade war with Genoa and the Angevins. The
      men who would win or lose that war were not in the Jamāʿa as anything more than petitioners.


      So he changed the Jamāʿa. From that session it was to be an assembly of the whole realm, and the
      burghers of the cities were to sit in it as the equals of the umarāʾ and the ʿulamāʾ, with their own
      voice in every matter put to it. Then, before the shock had passed, he gave them two privileges as well.
      The first was the Shipwright Contracts, which handed the building of the empire's ships to merchant
      houses under state contract, freed from the old regulations of the arsenals. The second was the Urban
      Development Grants, which put crown money into the walls, streets and markets of the towns. "The
      future," the Emperor said, quoting no one in particular, "will dawn within city walls."


      The court was, as the clerks put it, incensed. The umarāʾ had lost their equality to his father's Jamāʿa
      of 831. Now they had lost it again, this time to men who sold cloth. The ʿulamāʾ, who had voted with the
      crown in 831, found that they had voted themselves into a chamber full of merchants. Even the dhimmī,
      who had always sided with the crown against the lords, complained that the merchants were getting more
      than their share. Only the burghers were pleased, and they were very pleased. As for the princes, they
      said nothing in public. In private the dīwān heard them say that their father had finally done something
      they had not planned for him, and that they were not yet sure whether to be proud of him.


      *And those who have responded to their Lord and established prayer, and whose affair is consultation
      among themselves, and from what We have provided them, they spend.*
