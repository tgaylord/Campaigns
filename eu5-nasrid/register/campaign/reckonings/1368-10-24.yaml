summary: >-
  Morocco declares war to demand Granada's submission, with Tlemcen, Tafilalt, Touat and the puppet Kingdom of
  Sevilla. Granada has its three ṭāʾifas, and the Mamlūks and their vassals are allies again since January
  1367. Sunnīs outnumber Catholics again, 317,000 to 305,000. Castile has closed its markets and guaranteed
  al-Gharb's independence. Shares of power are estimated from the 1 June 1349 reading.
