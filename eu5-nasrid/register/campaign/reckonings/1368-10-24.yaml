tellings:
  - id: 0770-03-11-the-marinids-on-the-northern-shore
    'on': '1368-10-24'
    title: Of the Marīnids on the Northern Shore, and the Second Demand of Fās
    verse: '22:39'
    who:
      - saad-ibn-yusuf
      - abu-inan-faris
      - rodrigo-of-silves
      - aiman-mamluk
    where:
      - gharnata
      - fas
      - runda
      - marballa
      - qadis
      - sharish
      - jabal-tariq
      - tarifa
      - al-jazira-al-khadra
      - ishbiliyya
      - ukshunuba
      - tilimsan
    covers:
      - 1365-08-31-moroccan-peace-castile
      - 1366-01-10-marinid-sevilla
      - 1366-05-12-castile-courts
      - 1367-01-30-mamluk-alliance
      - 1367-08-01-moroccan-claim
      - 1368-05-10-moroccan-insult
      - 1368-07-moroccan-hostility
      - 1368-07-26-castile-markets
      - 1368-07-30-spies-in-fas
      - 1368-09-26-castile-guarantees-al-gharb
      - 1368-10-24-marinid-war
    text: >
      While [Gharnāṭa](place:gharnata) was winning its freedom, [Fās](place:fas) was winning something else.
      On the thirteenth of Dhū al-Ḥijja 766 the Marīnids made their own peace with Qashtāla and took from it
      the whole northern shore of the Strait. That was eleven towns, from [Runda](place:runda) in its
      mountains and [Marballa](place:marballa) on the sea to [Qādis](place:qadis), [Sharīsh](place:sharish),
      [Jabal Ṭāriq](place:jabal-tariq), [Ṭarīfa](place:tarifa) and [al-Jazīra
      al-Khaḍrāʾ](place:al-jazira-al-khadra). These were the very gates through which Ṭāriq had come into
      al-Andalus. At court men said it was better that the shore should be held by Muslims than by Christians.
      The wiser ones answered that it was better still that it should not be held by Fās.


      Fās soon showed what it intended. In Rabīʿ al-Thānī 767 the Marīnid sultan, [Abū ʿInān
      Fāris](person:abu-inan-faris), made nine of the eleven towns into a fief under a lord of his own. He
      gave it the name the rebels had used thirteen years before, the Kingdom of Sevilla.
      [Ishbīliya](place:ishbiliyya) itself was Gharnāṭa's and had been since 749, so the kingdom was named for
      a city it did not hold, and anyone could see which city it meant to claim.


      Peace lasted two years, and they were not quiet ones. Qashtāla, beaten, began to court Gharnāṭa with
      sweet words. In Ṣafar 768 the alliance with Cairo lapsed. [Saʿd](person:saad-ibn-yusuf)'s wife
      [Aiman](person:aiman-mamluk) wrote to her father, and in Jumādā al-Ūlā the sultan renewed it. Then Fās
      took up its old demand again. In Dhū al-Ḥijja 768 the dīwān learned that the Marīnid sultan claimed the
      same right he had used in 761, to demand Gharnāṭa's submission as his subject.


      The year 769 was worse. The Marīnids broke the trade agreements. Their envoys spoke of the claims of the
      Kingdom of Sevilla as if it were a real crown and not a garrison. On the twenty-first of Ramaḍān they
      insulted the sultan's ambassadors before the whole court of Fās. That gave Gharnāṭa a just cause of its
      own, and the sultan put it away for later. In the month of the pilgrimage Qashtāla closed its markets to
      Gharnāṭa's merchants. In Ṣafar 770 it declared itself guarantor of the independence of al-Gharb,
      Gharnāṭa's newest ṭāʾifa, as though [Rodrigo of Silves](person:rodrigo-of-silves) needed a Christian
      king to protect him from his own lord. The next day the sultan's agents were in
      [Ukshūnuba](place:ukshunuba) buying up the loyalty of al-Gharb's notables. Other agents had been in Fās
      since Dhū al-Ḥijja.


      On the eleventh of Rabīʿ al-Awwal 770 Fās declared war, as everyone had known it would.
      [Tilimsān](place:tilimsan), Tāfīlālt, Tuwāt and the puppet kingdom marched with it. Gharnāṭa had its
      three ṭāʾifas. It also had something it had never had before: the sultan of Egypt, and with him every
      vassal of the Mamlūk house from Makka and Madīna to Barqa and the Western Oases. Saʿd heard the
      declaration read and is said to have answered: *Let them come, and let them remember Sharīsh.*


      *Permission to fight has been given to those who are fought against, because they were wronged. And
      indeed, Allāh is competent to give them victory.*
