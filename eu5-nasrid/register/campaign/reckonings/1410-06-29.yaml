beats:
  - id: 1408-10-11-expeditions
    'on': '1408-10-11'
    kind: note
    what: >-
      A new round of expeditions sets out: one south, to follow the coast of Africa further; one to the
      islands found off the west coast, west of Mali; and two to the islands the Portuguese and Castilian
      explorers call the Canaries and Madeira
    threads:
      - voyages
    from:
      - save
      - told
    cite: Trent's account (11 October 1408); autosaves of 1 March 1409 and 1 March 1410
    detail:
      expeditions:
        - south along the African coast
        - the islands west of Mali (Cape Verde)
        - the Canaries
        - Madeira
      note: >-
        the Canaries and Madeira voyages are no longer active in the autosaves of 1 March 1409 and 1 March
        1410; the explorers of the other three are named from those autosaves and the save of 29 June 1410
      explorersInLaterSaves:
        south, into the Gulf of Guinea: Daniel, born 1369, a Sephardi convert to Islam (52/51/63)
        the islands west of Mali (Cape Verde): >-
          García de Ponte de Sor, born 1377, a Catholic Portuguese noble, an offensive planner (62/46/69), who
          in August 1405 had led the rebels of Estremadura against al-Ushbūna
        the Azores (already at sea by August 1408): ʿAbd al-Ghafūr, born 1372, an Andalusī of the burghers (56/90/57)
  - id: 1409-09-18-death-of-fatima
    'on': '1409-09-18'
    kind: death
    what: >-
      Fāṭima bint Yūsuf, daughter of Yūsuf I and widow of Francesc de Montsoriu, dies at fifty-one. Her son
      Berenguer Ramon rules the Ṭāʾifa of Catalonia, her daughter Isabel is the wife of the heir Muḥammad, and
      another daughter is married to Saʿd ibn Ismāʿīl of Shalamanka
    who:
