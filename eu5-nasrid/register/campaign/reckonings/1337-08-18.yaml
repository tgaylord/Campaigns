tellings:
  - id: 0738-01-02-the-marinid-war-upon-castile
    'on': '1337-07-31'
    title: Of the Spring of the Year 737, and the Marīnid War upon Qashtāla
    book: book-of-mending
    verse: '3:54'
    who:
      - yusuf-i
      - fatima-bint-al-ahmar
      - faraj-ibn-ismail
      - yusuf-ibn-muhammad
      - ismail-i
    where:
      - gharnata
      - tilimsan
      - fas
    covers:
      - 1337-04-03-death-fatima
      - 1337-04-22-joins-tlemcen-war
      - 1337-04-25-peace-tlemcen
      - 1337-05-01-strait-begins
      - 1337-05-01-parias
      - 1337-05-03-tunis-marriage
