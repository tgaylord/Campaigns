      - 1337-07-31-morocco-war-on-castile
    text: >
      In the name of Allāh, the Merciful, the Compassionate. Here begins the account of the reign of our lord
      the sultan Abū al-Ḥajjāj [Yūsuf](person:yusuf-i), son of [Ismāʿīl](person:ismail-i), may Allāh make his
      days a garden and his banners a shade. He sat in the Alhambra above [Gharnāṭa](place:gharnata) in the
      nineteenth year of his age, and the realm he held was eighteen towns and their districts, close to four
      hundred and fifty thousand souls. It was a jewel set in a narrow ring, with Qashtāla pressing on the
      north and the sea at its back.


      On the first night of Ramaḍān there passed from this world the lady [Fāṭima bint
      al-Aḥmar](person:fatima-bint-al-ahmar), daughter of the sultan Muḥammad al-Faqīh, mother of Ismāʿīl and
      grandmother of our lord. She had seen seventy-six years and seven reigns, and she went out with the
      crescent of the fast. *Every soul shall taste death*, but few are given so fitting an hour to taste it.


      In that same month there came a call from [Fās](place:fas). The Marīnid sultan Abū al-Ḥasan ʿAlī, lord
      of the Maghrib al-Aqṣā, had made war two years since upon the Banū ʿAbd al-Wād of
      [Tilimsān](place:tilimsan), and now he called on his ally across the water. On the twentieth of Ramaḍān
      our lord gave his answer and his word, and three days later [the war](war:fate-of-tlemcen) was ended.
      Tilimsān bowed its head and became a fief of the Marīnids. Not one Andalusī fell, for the matter was
      settled before our men had left their homes. Yet the court remembered that the word had been given, and
      so did Fās.


      With the end of Ramaḍān the old contest over the Strait took on a new and sharper form, the one the
      clerks of the dīwān name its *battle*. On the first day of the contest the tribute owed to Qashtāla was
      fixed anew as *parias*, gold weighed out for the infidel king Alfonso. On the morning of ʿĪd al-Fiṭr
      itself, as the city broke its fast, a royal marriage joined our house to the Ḥafṣids of Tūnis, so that
      the realm might stand upon more than one shore.


      The dīwān was filled. Our lord set his elder brother [Faraj ibn Ismāʿīl](person:faraj-ibn-ismail), now
      named heir, to strengthen the government. On the Day of ʿArafa he charged his cousin [Yūsuf ibn
      Muḥammad](person:yusuf-ibn-muhammad), a man with a rare gift for embassies and plain gifts in all else,
      with the defence of Granadan sovereignty.


      Then, on the second day of Muḥarram in the year 738, with the new year barely begun, Abū al-Ḥasan
      declared [war](war:moroccan-castilian-war) upon Qashtāla to reclaim al-Andalus, and Tilimsān marched
      under his banner. The alliance gives Abū al-Ḥasan the right to summon our lord, and he has not yet done
      so. Our lord is bound by tribute to the one side and by his word to the other. As this is written, the
      sovereignty of Gharnāṭa stands a hair above the half, by the reckoning of the scribes, and the pull of
      the two shores leans toward Qashtāla. Between the lion of Fās and the castle of Qashtāla lies a strait
      one may cross in an afternoon, and Gharnāṭa stands upon its shore and waits. *And Allāh is the best of
      planners.*
    behind: >-
      Drawn from the 18 August 1337 save. Granada isn't in the war: Morocco can call us in under the scripted
      alliance, and has not done so. The Hijri coincidences (1 Ramaḍān, ʿĪd al-Fiṭr, ʿArafa, 2 Muḥarram) come
      from the tabular calendar and may be a day or two out.
