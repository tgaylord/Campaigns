tellings:
  - id: 0857-02-24-of-the-death-of-the-emperor-muhammad
    'on': '1453-03-06'
    title: Of the Death of the Emperor Muḥammad
    book: book-of-the-franks
    verse: '31:27'
    who:
      - muhammad-ibn-ismail-ibn-saad
      - ismail-ibn-muhammad-ibn-ismail
      - ahmad-ibn-muhammad-ibn-ismail
      - yusuf-ibn-ismail-ibn-muhammad
