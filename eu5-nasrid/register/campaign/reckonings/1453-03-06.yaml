date: '1453-03-06'
title: The Death of the Emperor Muḥammad
summary: >-
  From a save and Trent's screens. The Emperor Muḥammad died of old age on 5 March 1453, aged 67, in the
  24th year of his reign. His son Ismāʿīl was proclaimed the next day, with Yūsuf, Ismāʿīl's eldest, as heir.
  The fourteen months before were quiet (Trent): steady building, the treasury back from 26 to 583, thirteen
  new ships, and the start of Sicily's integration. Under Ismāʿīl, Aḥmad heads the council; Sicily keeps its
  governor, with its traditions tolerated and many of its laws confirmed; and Portugal is being brought under
  the crown, expected done about May 1454 (Trent). The Mamlūks' war on the Banū Lām goes on.
