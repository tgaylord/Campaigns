      - 1453-03-06-portugal-to-come-under-the-crown
    text: |
      The year 856 was a quiet one, and the court was glad of it. The treasury had been spent to nothing on paper mills and roads, and it filled again. The yards launched thirteen ships. There were more mills at the end of the year than at the start, and a new madrasa. The governor's men in Sicily began the slow work of making the island a province like any other, and three seats of the dīwān were given to it. One of them went, on 13 Rabīʿ al-Thānī, to [Yūsuf](person:yusuf-ibn-ahmad-ibn-muhammad), the son of the prince [Aḥmad](person:ahmad-ibn-muhammad-ibn-ismail), who was eighteen and already spoken of as the best tongue in the family.

      Abroad little changed. The Mamlūks and the Banū Lām fought nine times between the winter and the autumn and settled nothing, and al-Andalus, at war beside Cairo in name, sent no one. On 23 Dhū al-Qaʿda the Genoese, who had not forgotten Corsica, closed their markets to Andalusī merchants. The dīwān had already begun the work of bringing Burtuqāl, ruled by a regent for a child, under the crown, as Barshalūna and Balansiyya had been brought before it.

      On 23 Ṣafar 857 the Emperor [Muḥammad](person:muhammad-ibn-ismail-ibn-saad) ibn Ismāʿīl died at [Ishbīliya](place:ishbiliyya). He was sixty-seven, and he died of his years and of nothing else. He had reigned since 25 Ramaḍān 832.

      At twelve he had been judged unfit to rule, stubborn and slow in the dīwān, and he never became quick there. He liked ships, harbours and the look of things. He left the work of the state to his wives and to his two eldest sons, and he knew that he did. But the things he cared for, he saw done. He made the pilgrimage and stood in the Ḥaram. Past fifty he taught himself to read as scholars read, and the court's report of his death says that his learning brought the realm both new things and fame. He seated the burghers in the Jamāʿa as equals, and then the commons. He put the ports under the crown. He told the envoys of Europe that al-Andalus had arrived, and hung a map of the Umayyad borders in the dīwān without saying what it was for. In his last years Sicily was taken, and Balarm governed again in the name of a Muslim prince, and his pilots came home with word of a world larger than the books allowed. He took a realm of a hundred and ninety-five towns and fifty ships. He left one of two hundred and forty-four towns and a hundred and ten ships, and nearly four million souls.

      His son [Ismāʿīl](person:ismail-ibn-muhammad-ibn-ismail) was proclaimed the next day, 24 Ṣafar. He was fifty years old and had been heir for twenty-four of them, and for most of those he had done an emperor's talking. His wife Tella stood as consort. His eldest son [Yūsuf](person:yusuf-ibn-ismail-ibn-muhammad), the admiral, was named heir.

      Ismāʿīl's own seat on the dīwān was now empty, and it went to [Abū al-Ḥasan ʿAlī](person:abu-al-hasan-ali-ibn-saad-ibn-ahmad), a grandson of the dead Emperor through his daughter Muʾmina, and so Aḥmad's nephew. He was nineteen. With Aḥmad's son already seated, two of the Emperor's grandsons now sat where his sons had. It had been said for twenty years that when Ismāʿīl reigned, Aḥmad would stand at the head of his council, and so it was. Aḥmad kept the seat he had always had and took the first place at the table, and nobody at court was surprised.

      The new Emperor's first acts concerned Sicily. He had argued two years before that the island should have a ṭāʾifa, and his father had overruled him. He did not now overrule his father. The governor's writ was reaching further into the island each season, and Ismāʿīl let him stay. What he changed was the manner of the rule. He gave the Sicilians a far wider tolerance for their own customs than they had been shown since the conquest, and he confirmed many of their laws, as the Portuguese and the Catalans had been confirmed in theirs. Burtuqāl's own turn went forward. It was to lose its court and its autonomy and become a province. The child Fāṭima would keep her lands and her rank among the nobles of the country, and no more than that. The dīwān reckoned the work would be done within the year 858.

      *And if whatever trees upon the earth were pens and the sea was ink, replenished thereafter by seven more seas, the words of God would not be exhausted. Indeed, God is Exalted in Might and Wise.*
    behind: |
      **What the save shows.** This note draws on the saves of 1 January 1452 and 6 March 1453, and on Trent's two screens of 6 March 1453.
      - *The death:* the save dates it 5 March 1453, of old age; the court's report on screen is dated 6 March and gives his age as 67. The entry puts the death on the 5th and the proclamation on the 6th.
      - *The succession:* Ismāʿīl is ruler, Tella his consort and Yūsuf his heir. The screen gives Ismāʿīl 70 / 73 / 63 and calls him balanced; the save marks him deceitful. "Ismāʿīl III" and "Muḥammad V" are the numbers on the screens.
      - *The dīwān:* Yūsuf ibn Aḥmad has held a seat since 3 May 1452 (58 / 97 / 81, honest). Abū al-Ḥasan ʿAlī (84 / 81 / 67) holds the seat Ismāʿīl held in January 1452; the save doesn't say when he took it, and the entry puts it at the succession. Aḥmad's seat is unchanged since 1448.
      - *The quiet year:* treasury 26 to 583; ships 97 to 110; five more levels of paper mill, a madrasa, a scriptorium; stability 16.3 to 19.6. Nine battles in the Mamlūk war between 1 February and 1 November 1452. Genoa's embargo dates from 5 December 1452. The royal marriage with Aragon is gone from the save, and so is Portugal's claim to resist annexation.
      - *The reign in numbers:* 195 towns, 2.57 million souls and 50 ships in the save of 2 July 1429; 244 towns, 3.90 million souls and 110 ships now.

      **From Trent's account.** Nothing in particular happened in these fourteen months: steady building and the start of integrating Sicily. Under Ismāʿīl, Aḥmad does head the council. Sicily keeps its governor because control is being extended to the island successfully, and Ismāʿīl greatly increases the tolerance of Sicilian traditions and grants continuity for many of their laws, as for the Portuguese and Catalans. Portugal is being integrated as Barcelona and Valencia were, roughly done by May 1454; it is the removal of autonomy, and the child-queen remains a noble in the area. May 1454 falls in Jumādā al-Ūlā 858.

      **Invented colour.**
      - That he died at Ishbīliya. The save doesn't give a place.
      - The court being glad of a quiet year, and Yūsuf ibn Aḥmad's reputation as the family's best tongue (his diplomacy is 97).
      - The Genoese remembering Corsica as the reason for the embargo.
      - The judgement of the reign. Its facts are from earlier entries; the weighing of them is the chronicler's.
      - Ismāʿīl having "done an emperor's talking".
      - Nobody at court being surprised at Aḥmad's place.
      - Ismāʿīl's toleration and the confirming of the laws placed among his first acts; Trent gives no date. That he "did not overrule his father" is the chronicler's reading of the governor staying.
      - Fāṭima keeping her lands and rank. Trent says she remains a noble in the area.
questions:
