      - abu-al-hasan-ali-ibn-saad-ibn-ahmad
    where:
      - ishbiliyya
    covers:
      - 1452-05-03-yusuf-ibn-ahmad-joins-the-diwan
      - 1452-11-01-the-mamluk-war-in-1452
      - 1452-12-05-genoa-closes-its-markets
