beats:
  - id: 1396-03-13-majrit-and-tulaytula
    'on': '1396-03-13'
    kind: note
    what: >-
      Majrīṭ and Ṭulayṭula: a rising town and a growing industry. On the flat plains of the Tagus and the
      Manzanares the crown is building another centre of Andalusī power in the heart of the peninsula:
      weaponsmiths at Ṭulayṭula, mines, wheat farms and lumber mills in the country between the two cities and
      up to the Guadarrama
    who:
      - saad-ibn-yusuf
    where:
      - majrit
      - tulaytula
    from:
      - seen
      - told
    cite: Trent's account and map screen, 13 March 1396
    detail:
      underConstruction:
        - weaponsmiths at Ṭulayṭula
        - >-
          a mine and a lumber mill toward the Guadarrama, by Colmenar (the game's Qelmnar) and Buitrago del
          Lozoya
        - wheat farms on the plain
        - further works between Toledo and Madrid (Trent's map screen shows seven building sites in progress)
      note: >-
        Trent's map screen of 13 March 1396 uses the game's Arabic-style names Ṭlayṭla and Qelmnar; Madrid
        itself is the 'new rising town'
  - id: 1397-08-14-explorers-push-south
    'on': '1397-08-14'
    kind: note
    what: >-
      The explorations go on as the empire's explorers round the coast of Africa and push south. Two of the
      Emperor's kin lead them: his brother-in-law Muḥammad al-Aḥmar charts the Canary Islands, and his cousin
      Ismāʿīl ibn Muḥammad al-ʿĀbid the seas of southern Macaronesia toward Cape Verde
    who:
      - muhammad-ibn-ismail
      - ismail-ibn-muhammad-al-abid
    threads:
      - voyages
    from:
      - save
      - told
    cite: Trent's account, August 1397; autosave of 1 June 1397
    detail:
      explorations:
        Canary Islands:
          explorer: Muḥammad ibn Ismāʿīl al-Aḥmar, 64 (51/70/60), explorer from 10 February 1396
          from: Ishbīliya
          position: off Aguere, Tenerife (1 June 1397)
        southern Macaronesia (Cape Verde):
          explorer: Ismāʿīl ibn Muḥammad al-ʿĀbid, 47 (40/36/66), explorer from 19 February 1396
          from: Coria del Río
          position: off Funchal, Madeira (1 June 1397)
      alreadyKnown: the north-west African coast and the seas of the Azores and Madeira
      rivals: Castile is exploring the Azores; another power is in the Madeira sea
      note: >-
        Khayr al-Dīn al-Jayyānī's voyage of 1391 and the Azores and Madeira expeditions of 1392 are no longer
        active in the save; their explorers' names are not recorded there
  - id: 1397-08-14-infrastructure
