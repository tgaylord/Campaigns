  - id: 1404-02-01-the-crusade
    'on': '1404-02-01'
    kind: war
    what: >-
      The long peace is broken. The Pope proclaims a crusade against al-Andalus, the first, and declares war
      on the Ṭāʾifa of Aragon; the Emperor answers for his subject. The crusade's temporal support is thin:
      the Pope's own vassals and a handful of German bishops and princes, some five thousand men at the
      declaration, most of them levies
    who:
      - saad-ibn-yusuf
      - rodrigo-de-borja
    threads:
      - crusade-of-806
      - europe
    from:
      - save
      - seen
      - told
    cite: save of 3 February 1404; Trent's account and screen
    detail:
      cb: cb_crusade
      target: ARA (the Borja Sultanate of Aragon, as the game styles it)
      gameName: The 1st Crusade against Andalusia
      crusaders:
        Papal States: >-
          270 men under arms on 3 February (four regiments far under strength: crossbowmen at 10%, men-at-arms
          at 5%), 26 ships; the Pope's manpower pool stood near 2,000
        Faenza: 358
        Siena: 373
        Magdeburg: 950
