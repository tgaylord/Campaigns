  - id: 0799-11-19-of-majrit-the-acequias-and-the-eternal-isles
    'on': '1397-08-14'
    title: Of Majrīṭ, the Acequias, and the Eternal Isles
    verse: '21:30'
    who:
      - saad-ibn-yusuf
      - muhammad-ibn-ismail
      - maryam-bint-yusuf
      - ismail-ibn-muhammad-al-abid
    where:
      - majrit
      - tulaytula
      - qarmuna
      - istijja
      - shaluqa-al-kubra
      - qurtuba
      - binar
      - al-ushbuna
      - malaqa
      - shantarin
      - al-mariyya
      - ishbiliyya
    covers:
      - 1396-03-13-majrit-and-tulaytula
      - 1397-08-14-infrastructure
      - 1397-08-14-explorers-push-south
    text: >
      The amīr Muḥammad had built [Majrīṭ](place:majrit) as a watchtower, to guard the road to
      [Ṭulayṭula](place:tulaytula) from the Christians beyond the mountains. Five hundred years later the
      Emperor [Saʿd](person:saad-ibn-yusuf) looked at it with a merchant's eye. It stood in the middle of the
      peninsula, where the roads from the four quarters crossed, with the Guadarrama behind it for timber and
      iron and the plain before it for wheat. A town at a crossroads, he told the dīwān, will grow whether a
      king helps it or not, and a king who helps it will be paid back many times over. In Jumādā al-Ākhira 798
      he set the crown to building a second heart for al-Andalus on the Tagus and the Manzanares. Ṭulayṭula,
      which had made blades since before the Arabs came, was given weaponsmiths. Mines and lumber mills went
      up toward the Guadarrama, and wheat farms on the plain, and seven building sites stood open between the
      two cities at once.


      In Dhū al-Qaʿda 799 a new round of building began across the empire. Across the valley and the new lands
      of the north the crown threw fourteen bridges, and it raised madrasas at [al-Ushbūna](place:al-ushbuna)
      and [Shantarīn](place:shantarin), so that the children of the converts would learn their religion from
      Andalusī teachers. In the old lands [Mālaqa](place:malaqa) and [al-Mariyya](place:al-mariyya) were given
      madrasas too. Majrīṭ was given a guild of toolmakers and Ṭulayṭula a tannery. Along the great river,
      from the capital to [Qurṭuba](place:qurtuba), the crown dug a chain of acequias at
      [Qarmūna](place:qarmuna), [Istijja](place:istijja), [Shalūqa al-Kubrā](place:shaluqa-al-kubra) and
      Qurṭuba itself, canals that carried water from the hills to the fields and gardens. Another watered the
      fields of [Bīnār](place:binar). The Castilians had kept the old canals of the caliphs and called them by
      their Arabic name, acequia, from al-sāqiya. Now the Arabic word was spoken over them again. The Emperor
      rode out to see the first water come down the channel at Qarmūna, and asked the engineers what each
      cubit of it had cost before he praised them.


      The same years carried the empire's ships further south than they had gone before. The geographers
      called the islands off the coast of the Maghrib al-Jazāʾir al-Khālidāt, the Eternal Isles, and placed
      the edge of the known world there. Two men of the Emperor's own family went to find them. [Muḥammad ibn
      Ismāʿīl al-Aḥmar](person:muhammad-ibn-ismail), the husband of his half-sister
      [Maryam](person:maryam-bint-yusuf), took ship from [Ishbīliya](place:ishbiliyya) in Rabīʿ al-Thānī 798
      at the age of sixty-two, an age at which most men of the house asked only for a garden. By the summer of
      799 he was charting the Canaries and lay off Aguere on Tenerife, where the islanders still went about in
      goatskins and had never heard the call to prayer. His cousin [Ismāʿīl ibn Muḥammad
      al-ʿĀbid](person:ismail-ibn-muhammad-al-abid) sailed from Coria on the river for the seas beyond, toward
      the green cape far down the African coast, and in the summer of 799 he lay off Funchal on Madeira,
      gathering water for the long run south.


      They were not alone on the Ocean. The ships of Qashtāla were in the sea of the Azores, and the sails of
      another kingdom had been seen off Madeira. The Christians of the north had begun to look at the
      Encircling Sea as the Emperor did.


      *And We made from water every living thing. Then will they not believe?*
  - id: 0800-12-20-of-the-grandsons-and-the-prince-from-benabarre
    'on': '1398-09-03'
    title: Of the Grandsons, and the Prince Who Came Home from Benabarre
    verse: 25:74
    who:
      - saad-ibn-yusuf
      - yusuf-ibn-saad
      - caterina-de-borja
      - alfons-de-borja
      - rodrigo-de-borja
      - ismail-ibn-saad
      - bernarda-of-murcia
      - aisha-ottoman
      - muhammad-ibn-ismail-ibn-saad
      - saad-ibn-ismail-ibn-saad
      - saad-ibn-yusuf-ibn-saad
      - dua-marinid
      - aiman-mamluk
    where:
      - ishbiliyya
    covers:
      - 1393-02-24-death-of-alfons
      - 1398-09-03-the-grandsons
      - 1398-09-03-yusuf-comes-home
    text: >
      The Emperor's second son, [Yūsuf](person:yusuf-ibn-saad), had married twice: Madīna, of a house of the
      Mamlūk lands, and [Caterina](person:caterina-de-borja), daughter of King
      [Alfons](person:alfons-de-borja) of the Ṭāʾifa of Arghūn. The Christians of the north have a custom that
      a prince who marries an heiress goes to live at her father's court, and Yūsuf went. By the year 796 he
      was living at Benabarre in the Aragonese hills, a guest of the house of Borja, and in the spring of 800
      he led its soldiers in the field. King Alfons had died in Rabīʿ al-Thānī 795, and his son
      [Rodrigo](person:rodrigo-de-borja), a boy of eleven then, had worn the little crown since. Rodrigo had
      no son, and Caterina was his heir.


      So the old quarrel of the harem ended without anyone winning it. [Duʿāʾ](person:dua-marinid) and
      [Aiman](person:aiman-mamluk), who had fought for the better part of twenty years over whose son would
      inherit, were both in their graves. The crown prince [Ismāʿīl](person:ismail-ibn-saad) was heir beyond
      dispute, and his brother was across the mountains. But the question did not die. It went down a
      generation.


      Ismāʿīl had three sons. The eldest, [Muḥammad](person:muhammad-ibn-ismail-ibn-saad), son of
      [Bernarda](person:bernarda-of-murcia) of Mursiyya, was twelve, stubborn and slow, and his tutors had
      given up making excuses for him. The second, [Saʿd](person:saad-ibn-ismail-ibn-saad), son of the Ottoman
      princess [ʿĀʾisha](person:aisha-ottoman), was six. He was quick, he loved his books, and he had been
      given the costliest teachers in the realm. The third, Aḥmad, was four and wanted everything his brothers
      had. By the law of the house, which the Emperor had inherited and never changed, the crown would pass
      from Ismāʿīl to Muḥammad.


      Then there was Yūsuf's son, another [Saʿd](person:saad-ibn-yusuf-ibn-saad), born at Benabarre in Rabīʿ
      al-Thānī 796 to the heiress of Arghūn. He was four, and his teachers wrote that they had never seen a
      child like him. The old men of the court remembered another boy named Saʿd of whom the same had been
      said, fifty years before, and they looked at the Emperor when they said it. The Emperor did not hide
      that he had grown fond of the boy. He stood sixth in the line of succession.


      The law could be changed. A sultan of the house could name whichever son he chose, as the caliphs had
      done. But a crown that changed its law for a favourite would shake the realm from end to end, and the
      realm had only just steadied itself after the giving of the ṭāʾifas. The umarāʾ would ask what other law
      the Emperor might change for his pleasure. The Emperor had spent thirty-five years telling the qāḍīs,
      the counts and the tax-farmers that the law bound everyone, and he would not now make himself the
      exception. He left the law as it stood. If Ismāʿīl's son Saʿd grew into a man fit to rule, the question
      would wait for Ismāʿīl's reign. If not, the Emperor would decide it himself, and pay the price.


      What he did not leave was the boy. In Dhū al-Ḥijja 800 he sent to Benabarre and called his son Yūsuf
      home to [Ishbīliya](place:ishbiliyya), and the little Saʿd with him, to be raised at his grandfather's
      court and under his grandfather's eye. Caterina stayed at her brother's court, with child by Yūsuf
      again. The crown prince welcomed his brother and his nephew with the fairest words in the dīwān, and
      everyone who heard them agreed that nobody could have said it better.


      *Our Lord, grant us from among our wives and offspring comfort to our eyes, and make us a leader for the
      righteous.*
  - id: 0805-12-27-of-the-prospectors-and-the-jamaa-of-the-markets
    'on': '1403-07-18'
    title: Of the Prospectors, the Silver of Qusanṭīna, and the Jamāʿa of the Markets
    verse: '17:35'
    who:
      - saad-ibn-yusuf
      - khalid-ibn-yahya
    where:
      - ishbiliyya
      - qusantina
      - istijja
    covers:
      - 1402-01-17-highland-prospecting-survey
      - 1402-01-18-prospecting-commission
      - 1402-03-09-iron-at-al-iskuriyal
      - 1402-04-26-silver-at-qusantina
      - 1402-06-11-gems-at-qrabaqa
      - 1402-08-03-survey-returns
      - 1402-08-burghers-privileges
      - 1402-08-the-umara
      - 1402-09-jamaa-of-the-markets
      - 1402-09-jewellery-charter
      - 1403-07-18-state
    text: >
      The hills of al-Andalus had fed the caliphs with silver and iron, and the Emperor
      [Saʿd](person:saad-ibn-yusuf) wanted to know what they still held. In Jumādā al-Ākhira 804 he sent a
      survey into the highlands: prospectors to walk the streambeds and hammer the outcrops, and assayers to
      test what they found. He gave the command to [Khālid ibn Yaḥyā Raḥḥū](person:khalid-ibn-yahya),
      fifty-nine years old, son of the captain of the Volunteers of the Faith, once of the dīwān and once the
      general who won the second half of the Marīnid war. Khālid had a builder's training and a soldier's
      legs, and he was the man the court sent whenever no prince of the house could go himself. When the
      treasurers asked how much the assayers might spend, the Emperor told them to spare nothing: a survey
      done cheaply would find only what it was paid to find.


      The first find was a warning. At Almonaster in the Sierra a new copper prospect was set to roast its
      first heap of ore, and it gave off a yellow smoke that drove the men off the slope and withered the
      grass downwind. The farmers of the valley brought a complaint to the governor. The metallurgist offered
      to build kilns that would keep the smoke in, at a cost no one had counted. The court sided with the
      farmers, and the copper was left in the ground.


      The hills paid for it afterwards. In Shaʿbān the prospectors found a seam of iron at al-Iskuriyāl in the
      Guadarrama, the rock streaked black and red and running deep into the mountain, where the headman's
      grandfather had spoken of old workings. In Ramaḍān they found silver at [Qusanṭīna](place:qusantina),
      the old silver town of the house of Naṣr: a vein wide enough to swing a pick in, so pure it could be
      polished straight from the rock. In Dhū al-Qaʿda, at Qrabaqa, they traced a scatter of bright gravel up
      a streambed to a pocket of crystal in the hillside, and the lapidaries called the stones exceptional.
      The Emperor ordered all three kept quiet. A merchant who tells the market what he has found, he said,
      sells it for less. Khālid's men came home to [Ishbīliya](place:ishbiliyya) in Muḥarram 805, after seven
      months in the hills, and the finds had already repaid the assayers nearly three times over.


      Silver needed coiners, and the Emperor gave the coinage to the burghers. They would strike good coin of
      honest weight from the new silver and gold, under the eye of the Ḥisba, and with it they were given
      grants to raise the cities. The burghers were delighted. The umarāʾ were not, nor were the ʿulamāʾ and
      the dhimmīs, and of all the estates the nobles were now the least content. The court sent them gifts to
      keep their temper. But the dīwān had already set its course. The state was built: its offices, its
      chancery, its inspectors and its banks no longer needed the great lords. From now on the crown would
      grow by taking from the umarāʾ, as gently as it could, and the burghers would rise in their place.


      In the first days of Ṣafar 805 the Emperor called a Jamāʿa at Ishbīliya. The umarāʾ came for their gift,
      a monopoly on the land roads of trade for ten years. The burghers came to pay for their privileges, and
      they pledged a great sum to build up the markets of the south. On the day after the assembly rose, the
      Emperor granted Ishbīliya a charter for its jewellers, to double their trade with the silver of
      Qusanṭīna.


      By Dhū al-Ḥijja of that year the workshops were rising. Ishbīliya had eight halls of jewellers and nine
      more half-built, and [Istijja](place:istijja) two and three more, and the great market of the capital
      was being enlarged again beside them. The treasury took in far more each month than it had on the eve of
      the War of the League, and spent a quarter less than it took. And still the umarāʾ, between them, sat on
      many times the gold the treasury held.


      *And give full measure when you measure, and weigh with an even balance. That is the best way and best
      in result.*
