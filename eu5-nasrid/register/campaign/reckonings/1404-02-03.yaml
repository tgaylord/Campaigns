      A new round of building across the empire. Bridges and madrasas go up in the new lands, a madrasa among
      them at al-Ushbūna, and a chain of acequias, irrigation canals fed from the hills, is dug along the
      great river from the capital to Qurṭuba to feed the growing population
    who:
