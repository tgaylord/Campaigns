summary: >-
  On 1 February 1404 the Pope proclaims the first crusade against al-Andalus and declares war on the Ṭāʾifa of
  Aragon; the Emperor answers for his subject, with the Mamlūks, Morocco and all six ṭāʾifas beside him.
  Against him stand the Papal States, Faenza, Siena and a few German princes, some 5,100 men. Since 1395: the
  two ṭāʾifas of Shalamanka and Qūnka, the Dīwān al-Inshāʾ, the Highland Survey's silver and iron, the
  burghers' privileges and the jewellers' charter. The realm holds 148 towns and 1,833,000 people; the game
  ranks it fourth. Income 200 a month against 165; the treasury stands at 51. Shares of power are estimated
  from the 1 June 1349 reading.
