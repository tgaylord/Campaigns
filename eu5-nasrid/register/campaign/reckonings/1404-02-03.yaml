  - id: 1398-09-03-the-grandsons
    'on': '1398-09-03'
    kind: note
    what: >-
      The question of the sons. With the two mothers dead and Prince Yūsuf away at the court of Aragon, the
      old quarrel between Ismāʿīl's party and Yūsuf's has cooled. The next generation is harder. The crown
      prince's eldest, Muḥammad, is stubborn and unfit to rule; his second, Saʿd, is intelligent and studious.
      But Yūsuf's son, another Saʿd, four years old and raised at Benabarre, outshines them both, and the
      Emperor has grown set on raising this grandson at his own court
    who:
      - saad-ibn-yusuf
      - ismail-ibn-saad
      - yusuf-ibn-saad
      - muhammad-ibn-ismail-ibn-saad
      - saad-ibn-ismail-ibn-saad
      - saad-ibn-yusuf-ibn-saad
      - caterina-de-borja
    from:
      - save
      - told
    cite: Trent's account; save of 3 September 1398
    detail:
      crownPrinceSons:
        Muḥammad (b. 1385, by Bernarda): child_idiot, 14/18/14, balanced education
        Saʿd (b. 1392, by ʿĀʾisha): child_intelligent, 27/16/21, expensive in-depth education
        Aḥmad (b. 1393, by ʿĀʾisha): child_ambitious, 13/17/7
      yusufsSon:
        Saʿd (b. 1394, by Caterina de Borja): child_gifted, 11/14/18, expensive in-depth education, at the Aragonese court
      aragon: >-
        King Rodrigo (b. 1381); heir his sister Caterina, Yūsuf's wife, who is with child; the boy's own place
        in the Aragonese succession is not shown in the save
      yusuf: >-
        living at the Aragonese court since his marriage (by January 1394); Trent counts the move a quirk of
        the game's marriages and is looking at moving him back
      succession:
        law: cognatic primogeniture (save of 3 September 1398)
        line:
          - Ismāʿīl ibn Saʿd (the crown prince)
          - his son Muḥammad (b. 1385)
          - his son Saʿd (b. 1392)
          - his son Aḥmad (b. 1393)
          - Prince Yūsuf
          - Yūsuf's son Saʿd (b. 1394)
        note: >-
          the line as primogeniture orders it, sons before daughters and the elder line first; the game's
          other heir selections include Favored Son Succession, in which the ruler names any of his sons
          regardless of age
        favoredSonOption: >-
          open to al-Andalus, at a cost of 50 stability and 50 legitimacy (Trent); in September 1398 stability
          stood at 13.3 and legitimacy at 100
        decision: >-
          the Emperor leaves the law as it stands for now. If the crown prince's son Saʿd grows into a worthy
          ruler, the question waits for Ismāʿīl's reign; if not, the Emperor will choose himself (Trent)
  - id: 1398-09-03-yusuf-comes-home
    'on': '1398-09-03'
    kind: note
    what: >-
      The Emperor calls his son Yūsuf and his grandson Saʿd home from Benabarre to the court at Ishbīliya,
      where the boy will be raised under his grandfather's eye. Caterina, heir of Aragon, stays at her
      brother's court
    who:
      - saad-ibn-yusuf
      - yusuf-ibn-saad
      - saad-ibn-yusuf-ibn-saad
      - caterina-de-borja
    from:
      - told
    cite: Trent's account, September 1398
    detail:
      how: >-
        moved back with the Script Runner (move_country), undoing the game's move of a husband to his wife's
        court (Trent)
      staysInAragon: Caterina de Borja, heir to King Rodrigo, with child by Yūsuf
  - id: 1402-01-17-highland-prospecting-survey
    'on': '1402-01-17'
    kind: note
    what: >-
      A Highland Prospecting Survey goes into the hills under Khālid ibn Yaḥyā Raḥḥū, fifty-nine, once of the
      dīwān, son of the old captain of the Volunteers of the Faith: prospectors and assayers to walk the
      streambeds, hammer the outcrops and test the rocks for metal. At Almonaster in the Sierra the copper
      workings throw up acrid yellow smoke that drives the workers off the slope and wilts the grass downwind,
      and the farmers bring a formal complaint. The court sides with the farmers and the copper prospect is
      abandoned
    who:
      - khalid-ibn-yahya
    where:
      - qusantina
      - ishbiliyya
    from:
      - seen
    cite: Trent's screens, 17 January 1402
    detail:
      expedition: Highland Prospecting Survey (exploration expedition)
      leader: Khālid ibn Yaḥyā Raḥḥū, Zenati, Sunni, 59 (80/85/78), architect, hardy warrior
      route:
        at: El-Mnastir (Almonaster, the game's name)
        next: Eš-Šeršna, 20 January 1402
        then:
          - Al-Iskuriyāl (El Escorial)
          - Qusanṭīna
          - Qrabaqa
          - Ishbīliya
      event:
        name: Toxic Smoke from the Workings
        text: >-
          the copper prospect yields ore of unexpected character; the first roasting heap, set to drive off
          the sulphides before smelting, gives off acrid yellow smoke; the metallurgist offers to build proper
          roasting kilns at unbudgeted cost
        choiceOnScreen: Abandon the prospect. Locals are not wrong about the air (the option Trent had chosen on screen)
      otherExpeditions:
        - Circumnavigation (west, round the southern cape and home by the Cape of Good Hope)
        - The Royal Ḥajj
        - Voyage into the Western Ocean
      state:
        treasury: 342.75
        monthly: 24.53
        stability: 23
        population: 1807000
        legitimacy: 100
        prestige: 91
        army: 4900
        ships: 28
        age: the Age of Renaissance has begun
  - id: 1402-01-18-prospecting-commission
    'on': '1402-01-18'
    kind: note
    what: >-
      The Prospecting Commission: the crown spares no expense, and sends skilled assayers and gold for samples
      with Khālid's prospectors, who will walk the highlands for a year testing streambeds for placer gold,
      hammering at quartz veins and asking shepherds which valleys give up colour in the pan
    who:
      - khalid-ibn-yahya
    from:
      - seen
    cite: Trent's screens of the Highland Prospecting Survey, 1402
    detail:
      choice: Spare no expense. Send skilled assayers, gold for samples (the option on Trent's screen)
      effects:
        gold: -83.61
        prestige: 5
        pause: 10 days
      alternative: A modest fee will do. Headmen provide guides and shelter
  - id: 1402-03-09-iron-at-al-iskuriyal
    'on': '1402-03-09'
    kind: note
    what: >-
      A seam of iron at al-Iskuriyāl (El Escorial): high-grade ore running deep into the mountain, the rock
      streaked black and red, perhaps old workings reopened that the village headman's grandfather spoke of.
      The crown develops it quietly; rival foundries need not hear of it yet
    who:
      - khalid-ibn-yahya
    from:
      - seen
    cite: Trent's screens of the Highland Prospecting Survey, 1402
    detail:
      find: Iron
      place: Al-Iskuriyāl (El Escorial)
      choice: Develop it quietly
      effects:
        modifier: 'Rich Iron Seam, 18 years, decaying: local iron output +50%'
        gold: 41.53
      alternative: Announce the find
  - id: 1402-04-26-silver-at-qusantina
    'on': '1402-04-26'
    kind: note
    what: >-
      Silver in the rock at Qusanṭīna, the old silver town of the house of Naṣr: a vein wide enough to swing a
      pick in and pure enough to polish straight from the rock, the shaft timbered and the first cartloads
      hauled up by windlass. The crown keeps it quiet; foreign eyes on al-Andalus's silver bring trouble
    who:
      - khalid-ibn-yahya
    where:
      - qusantina
    from:
      - seen
    cite: Trent's screens of the Highland Prospecting Survey, 1402
    detail:
      find: Silver
      place: Qusanṭīna (Constantina)
      choice: Keep it quiet
      effects:
        modifier: 'Rich Silver Vein, 20 years, decaying: local silver output +75%'
        gold: 83.27
      alternative: Announce it to the Empire
  - id: 1402-06-11-gems-at-qrabaqa
    'on': '1402-06-11'
    kind: note
    what: >-
      Stones that catch the light at Qrabaqa: gem-bearing gravels in a streambed, traced up to a pocket of
      crystal-shot pegmatite in the hillside, and a cuttable fraction the lapidaries call exceptional. The
      gems are kept for the imperial coffers, quietly
    who:
      - khalid-ibn-yahya
    from:
      - seen
    cite: Trent's screens of the Highland Prospecting Survey, 1402
    detail:
      find: Gems
      place: Qrabaqa (the game's name)
      choice: Keep the gems for imperial coffers, quietly kept
      effects:
        modifier: 'Productive Gem Workings, 20 years, decaying: local gems output +75%'
        gold: 100.02
      alternative: Announce the find
  - id: 1402-08-03-survey-returns
    'on': '1402-08-03'
    kind: note
    what: >-
      The Highland Prospecting Survey comes home to Ishbīliya after seven months in the hills. It found iron
      at al-Iskuriyāl, silver at Qusanṭīna and gems at Qrabaqa, and the court kept all three quiet
    who:
      - khalid-ibn-yahya
    where:
      - ishbiliyya
    from:
      - seen
    cite: Trent's screens of the Highland Prospecting Survey, 1402
    detail:
      effects:
        modifier: 'Highland Survey Returned, 20 years, decaying: raw materials output +5%'
        prestige: 10
      goldFromFinds: 224.82
      spentOnAssayers: 83.61
  - id: 1402-08-burghers-privileges
    'on': '1402-08-03'
    kind: realm
    what: >-
      With the mines found, the burghers are given two privileges: control over the coinage, to cut and
      circulate good coin from the new silver and gold, and urban development grants, to raise the cities. The
      burghers are delighted; the umarāʾ, the ʿulamāʾ and the dhimmīs less so
    who:
      - saad-ibn-yusuf
    threads:
      - estates
    from:
      - seen
      - told
    cite: Trent's account and screens, 1402
    detail:
      estate: burghers
      privileges:
        Control over the Coinage:
          effects:
            politicalInfluenceGain: −10%
            copperOutput: +5%
            goldOutput: +5%
            silverOutput: +5%
            mintingThreshold: +1%
          burghersSatisfaction: +5%
          burghersPower: +50%
          cost: 18
          text: >-
            cutting and circulating new coins of adequate quality ... by taking control of the coinage, we
            will strengthen our economic foundations and consolidate our authority (the game's text)
        Urban Development Grants:
          effects:
            monthlyDevelopment: 0.001
            monthlyProgressToInnovative: 0.1
          burghersSatisfaction: +5%
          burghersPower: +50%
          cost: 18
          text: the future will dawn within city walls (the game's text)
      satisfactionPerGrant:
        burghers: +15% (to 65%)
        umara (nobles): −6.5% (to 33.6%)
        ulama (clergy): −2.7% (to 47.3%)
        commoners: −0.5% (to 49.5%)
        dhimmi: −5.4% (to 44.7%)
      note: >-
        the satisfaction figures are the game's preview for a single grant; the day is taken as the survey's
        return
  - id: 1402-08-the-umara
    'on': '1402-08-03'
    kind: note
    what: >-
      The umarāʾ are given gifts to bring their temper back up after the burghers' privileges. But the court's
      long view has changed: now that the state is built, breaking the power of the umarāʾ is the easiest road
      to a stronger crown
    who:
      - saad-ibn-yusuf
    from:
      - told
    cite: Trent's account, 1402
    detail:
      policy: gifts to the nobles for now; in the long run, reduce the umarāʾ to grow the crown's power (Trent)
      context: the nobles stood at about a third satisfied after the burghers' grants, the lowest of the estates
  - id: 1402-09-jamaa-of-the-markets
    'on': '1402-09-01'
    kind: realm
    what: >-
      The crown calls a Jamāʿa. The umarāʾ are given a ten-year monopoly on the land trade routes, the gift
      that brings them back to the table. In exchange for their support and their new privileges, the burghers
      invest heavily in building up the markets of southern Iberia
    who:
      - saad-ibn-yusuf
    threads:
      - estates
    from:
      - told
    cite: Trent's account, 1402
    detail:
      assembly: Jamāʿa of 1402
      nobles: 10-year monopoly on land trade routes
      burghers: >-
        a very significant investment in the markets of southern Iberia, in exchange for their support and the
        privileges of coinage and urban grants
      note: early September 1402 (Trent's account)
  - id: 1402-09-jewellery-charter
