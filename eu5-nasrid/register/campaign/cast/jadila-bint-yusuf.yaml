note: >-
  Daughter of Yūsuf I and Sayyida of Fezzan, full sister of Sultan Saʿd. Betrothed on 3 April 1372 to Abū
  al-Faḍl, son and heir of Abū ʿInān Fāris of Fās (save of 16 January 1373). Married to him by January 1376,
  when the match helped reopen talks of an alliance between al-Andalus and Fās (Trent's account). Queen of the
  Marīnids from her husband's accession on 7 October 1381. She died on 27 December 1416, at sixty, three
  months before her husband; her son Abū Ḥammū had died before her, and her grandson Yaḥyā became sultan of
  Fās in 1417 (save of 11 August 1420).
