    source: Of the Reordering of the Realm, and the Restoration of al-Andalus
  - from: '1379-04-25'
    text: Turns the realm to the sea and to trade, and moves the court to Ishbīliya for its river and its market.
    by: trent
    source: Trent's account, April 1379
  - from: '1387-01-22'
    text: 'The Conqueror becomes the realm''s greatest builder: the Ḥijāba, the scholars, the madrasas.'
    by: trent
