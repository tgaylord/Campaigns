    source: save of 1351; the Chancellor's report
  - from: '1364-01-18'
    text: >-
      Takes his personal rule hard and fast: the regent dies the day the regency ends, and Saʿd marries his
      father's widow Duʿāʾ.
    by: trent
    source: Trent; Of the Regent Who Did Not Last, and the Sultan's Second Wife
  - from: '1364-01-18'
    text: The soldier who shares the camp, with a merchant's eye and honest books.
    by: chronicle
