note: >-
  First son of Yūsuf I and Sayyida of Fezzan, born 18 January 1348 in the second year of the war with the
  three crowns. Betrothed on 19 January 1351 to Aiman, daughter of the Mamluk Sultan. The same winter the
  Chancellor reported him a Prodigy: a child predestined, the court said, to leave his name in the history
  books. His father brought the finest tutors of the Islamic world to Gharnāṭa for him, several Christians
  among them. Succeeded his father on 1 August 1363 at fifteen, under the regency of Naṣr al-Istijjī until he
  came of age on 18 January 1364. At his accession his abilities stood at 100/69/100, the prodigy fulfilled.
  His accession was not clean. Naṣr died on the very day the regency ended, of 'sickness' as the court gave
  out (a hunting accident, the game says), and Saʿd then married Naṣr's widow Duʿāʾ, his father's Marīnid
  widow and minister. He began his personal rule with two wives, Aiman the Mamlūk and Duʿāʾ the Marīnid. He
  knocked Portugal out of the War of Independence on 11 September 1364 and took its south, and by 1365 the
  court called him Conqueror. His first child, Umm al-Fatḥ, was born to Aiman on 13 December 1364. His son and
  heir Ismāʿīl was born to Duʿāʾ on 8 March 1366. He won the War of Independence on 5 April 1366. He completed
  the Hajj in 1391 and returned on 20 February 1392 as al-Ḥājj Saʿd. He proclaimed the Restoration of
  al-Andalus on 16 March 1375 and took the style of Emperor, moved the capital to Ishbīliya in 1379, and
  fought the three wars of the Istirdād and the crusade of 1404, in which he took Avignon from the Pope. He
  died on 2 March 1405 (29 Shaʿbān 807), aged fifty-seven, while marching an army through Moya against the
  risings of 807, after a reign of forty-one years. The game's notice says his strong character had made the
  country a more honest place (save-day notice of 2 March 1405).
