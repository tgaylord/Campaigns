  - from: '1364-09-11'
    text: Means to break Qashtāla's hold on Granada for good, and does, in the War of Independence.
    by: chronicle
    source: Of the Conqueror, the Renegade at San Clemente, and the Peace of Independence
  - from: '1366-04-05'
    text: >-
      His reign is fought over at home: once Granada is free and worth the having, his two queens pull the
      court between them, Duʿāʾ for the Maghrib and Aiman for Egypt. He rules by keeping both close and
      neither satisfied.
    by: trent
    source: Trent's direction, November 2026
  - from: '1375-03-16'
    text: >-
      Restores al-Andalus and takes the style of Emperor: the peninsula is to be taken back from the north,
      war by war (the Istirdād).
