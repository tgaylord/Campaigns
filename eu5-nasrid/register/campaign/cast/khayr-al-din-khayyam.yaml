note: >-
  An Andalusī and a Muslim, captain of a mercenary company of Granadan jinetes and frontier horse, a general
  since 1426. In the Crusade of 835 he fought in the crusaders' pay, commanding the army of Campagna and
  Siena: he beat the Tunisians at Tivoli on 31 December 1431, and on 26 March 1432 he led 16,964 men against
  4,567 Moroccans at Pitigliano and was broken (save of 1 May 1432).
