note: >-
  Daughter of Yūsuf I and Tizemt the Ḥafṣid, full sister of Maryam and younger half-sister of the Emperor
  Saʿd. Married on 15 April 1375 to Francesc de Montsoriu, the ḥājib of the new Ṭāʾifa of Catalonia, binding
  the house of Naṣr to Barcelona (Trent's account; save of 5 June 1375). Mother of Berenguer Ramon de
  Montsoriu, ruler of Catalonia, of Isabel, wife of the heir Muḥammad, and of a daughter married to Saʿd ibn
  Ismāʿīl of Shalamanka. She died on 18 September 1409, aged fifty-one (save of 29 June 1410).
