note: >-
  Heir to his brother Saʿd until Saʿd's son Ismāʿīl was born on 8 March 1366 (saves of 11 September 1364 and 6
  November 1366). Married Hippolyte of Villa di Chiesa, a Sardinian of Cagliari, on 14 September 1370. He took
  a seat in the dīwān on 1 December 1382, as the revolt of Ṭulayṭula broke out (save of 8 December 1382). He
  left the dīwān in August 1405, when Muḥammad ibn Yūsuf took his seat, and died on 27 May 1408, aged
  fifty-four (save of 5 August 1408).
