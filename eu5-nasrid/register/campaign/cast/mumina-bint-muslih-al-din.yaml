name: Muʾmina bint Muṣliḥ al-Dīn
arabic: مؤمنة بنت مصلح الدين
sex: f
born: '1416-11-06'
roles:
  - wife of Prince Yūsuf
note: >-
  Daughter of Muṣliḥ al-Dīn, a Naṣrid of the court. Married to Prince Yūsuf by January 1438 (Trent; save of 16
  January 1438). Her father Muṣliḥ al-Dīn died on 18 October 1446 (autosave of 1 February 1447).
