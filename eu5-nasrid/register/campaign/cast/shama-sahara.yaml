name: Shamʿa
arabic: شمعة
sex: f
born: '1334-07-05'
died: '1393-05-10'
note: >-
  Of a ruling house of the central Sahara (the game's AAA43). First wife of Faraj ibn Ismāʿīl, by the royal
  marriage of 1 March 1354, before his second marriage to Fatiu of Ghana. When Faraj went south to Ghana she
  stayed in Granada with his child. Died 1393-05-10 (save of 24 October 1414).
