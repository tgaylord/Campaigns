drives:
  - from: '1339-05-24'
    text: The ablest man at court, given the host against Arghūn at twenty-five.
    by: trent
    source: Trent's account, May 1339
  - from: '1341-07-08'
    text: Goes over to Qashtāla, and serves its fleets and armies.
    by: chronicle
    source: save of 8 September 1341
  - from: '1341-07-08'
    text: >-
      Why he went over, the chronicle never learned. He serves Qashtāla's fleets for thirty years, and is
      never taken.
    by: chronicle
    source: his record
  - from: '1366-01-06'
    text: Leads Qashtāla's last field army, and survives its destruction at San Clemente.
    by: chronicle
    source: save of 5 April 1366
ties:
  - with: murad
    kind: rival
    from: '1366-01-06'
    text: Murād broke his last army at San Clemente; the renegade escaped, as he always did.
    by: chronicle
