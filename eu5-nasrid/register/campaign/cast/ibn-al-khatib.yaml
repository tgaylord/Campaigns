note: >-
  In the game the ablest man at court (88/79/84). Given command of the host against Aragon in May 1339
  (Trent's account). By 8 July 1341 he had left Granada: the save of 8 September 1341 has him in Castile as
  Frederick ibn al-Khaṭīb, Catholic and Castilian, an admiral from 8 July 1341. On 6 January 1366 he led
  Castile's last field army, 950 men, at San Clemente, and Murād destroyed it. He himself survived (save of 5
  April 1366). Died 1373-03-13 (save of 24 October 1414).
