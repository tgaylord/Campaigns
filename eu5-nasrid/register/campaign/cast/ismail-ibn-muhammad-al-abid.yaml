note: >-
  Cousin of the Emperor: son of the Naṣrid princess Maryam bint Ismāʿīl and her second husband Muḥammad ibn
  Aḥmad (died 1352), lord of a Maghribī house of Tunisian culture, whose head he now is. Born at Gharnāṭa. On
  19 February 1396 he was made an explorer, and by 1 June 1397 he was charting southern Macaronesia (the Cape
  Verde seas), sailing from Coria del Río and last reported off Funchal on Madeira (autosave of 1 June 1397).
