name: Muḥammad ibn Ismāʿīl ibn Saʿd
arabic: محمد بن إسماعيل
house: Naṣrid
tier: central
born: '1385-10-25'
father: ismail-ibn-saad
mother: bernarda-of-murcia
reigns:
  - from: '1429-06-28'
    to: null
roles:
  - heir of al-Andalus (1405–1429)
  - emperor and sultan of al-Andalus as Muḥammad V (from 1429)
traits:
  - extortioner
  - worldly
  - scholar
stats:
  adm: 15
  dip: 20
  mil: 16
drives:
  - from: '1398-09-03'
    text: 'Judged unfit to rule at twelve: stubborn, slow in the dīwān.'
    by: trent
    source: Trent's account, 1398
  - from: '1411-06-21'
    text: 'Another man on a deck: he likes boats, and wins at sea.'
    by: trent
    source: Trent's account and battle screen, 1411
  - from: '1429-06-28'
    text: >-
      Keeps his eyes on the sea, the harbours and how things look, more than on how they work; his wives and
      his two eldest sons carry much of the state.
    by: trent
    source: Trent, June 1430 and November 2026
  - from: '1431-06-24'
    text: Embraces the name of warmonger rather than punish the man who gave it.
    by: trent
    source: Trent's screenshot, June 1431
  - from: '1433-11-23'
    text: Comes home from Makka wanting a Ṣūfī faith at the head of the realm's faith.
    by: chronicle
    source: Of the Emperor's Pilgrimage
  - from: '1439-07-15'
    text: Begins, past fifty, to read, and becomes a scholar.
    by: trent
    source: Trent's screenshot, July 1439
  - from: '1442-06-01'
    text: 'Seats the burghers as equals and turns the whole realm outward: the Golden Century.'
    by: trent
    source: Trent's account, June 1442
  - from: '1445-01-30'
    text: Gives up some of his power elsewhere to bring the ports under the crown.
    by: trent
    source: Trent, on Harbor Administration
  - from: '1447-08-01'
    text: >-
      Tells the envoys of Europe 'We have arrived', and hangs the map of the Umayyad borders in the dīwān
      without saying what it is for.
    by: chronicle
    source: Of the Envoys of Europe and the Borders of the Umayyads
  - from: '1448-09-02'
    text: >-
      Decrees, at a Jamāʿa the princes had called, that the commons sit in every Jamāʿa as an estate equal to
      the others, and enjoys the uproar.
    by: trent
    source: Trent's account, 2 September 1448
  - from: '1450-11-29'
    text: >-
      Takes all of Sicily at the peace, receives Athens's fealty and finds himself lord of Negroponte, the
      Sicilian king's island crown.
    by: trent
    source: Trent's account; save of 29 November 1450
  - from: '1451-12-21'
    text: >-
      Keeps Sicily under the crown with a governor at Palermo, for now, unwilling to give the Norman kings'
      palace to a cousin; grieves that the Holy Cities he once visited are in enemy hands while his ally
      fails.
    by: trent
    source: Trent's account; Of the Governor of Balarm and the Holy Cities
ties:
  - with: yusuf-ibn-ismail-ibn-muhammad
    kind: patron
    from: '1438-01-16'
    text: Makes his grandson admiral, as the sea made a man of him.
    by: trent
  - with: edward-v-of-england
    kind: rival
    from: '1440-06-12'
    text: The Angevin crowns' trade war, market by market.
    by: chronicle
stations:
  - role: heir
    from: '1405-03-31'
    to: '1429-07-02'
    source: checkpoints
    approx: true
  - role: admiral
    from: '1411-06-05'
    to: '1433-03-19'
    source: save
    approx: false
note: >-
  Eldest surviving son of the crown prince Ismāʿīl, by Bernarda of Mursiyya; born 25 October 1385, while his
  grandfather was on the road to Makka. By 1398 the game marks him a dull child, and the court thinks him
  stubborn and unfit to rule (Trent's account; save of 3 September 1398). At seventeen, in July 1403, he stood
  at 16/20/17, married and with two children; the childhood trait had lapsed with no adult trait in its place
  (save of 18 July 1403). On his father's accession, 2 March 1405, he became heir to the throne by
  primogeniture (save of 31 March 1405). Heir to his father from 2 March 1405. By August 1408, at twenty-two,
  he was married to two daughters of the Catalan ṭāʾifa houses, Magdalena de Borja of Aragon and Isabel de
  Montsoriu of Catalonia, and had five children: Ismāʿīl (born 4 October 1402) and Saʿd (6 June 1408) by
  Magdalena, Aḥmad (10 June 1403), ʿĀʾisha (10 March 1405) and a daughter (10 August 1407) by Isabel. Both his
  eldest sons were gifted, enough to set aside the thought of changing the succession (Trent's account; save
  of 5 August 1408). On 21 June 1411 he won his first sea battle, at the mouth of the Duero, with 34 ships of
  al-Andalus and Valencia against Portugal's 17, sinking or taking 15 for the loss of 3. He likes boats
  (Trent's battle screen and account). By 1416 he had married a third wife, his cousin Jadīla bint Saʿd of
  Qūnka, who bore him Yūsuf (10 July 1416) and Fāṭima (9 April 1418). By August 1420 the game marks him an
  extortioner (save of 11 August 1420). On 28 June 1429, at forty-three, he succeeded his father as the
  Emperor Muḥammad V, with abilities of 15/20/16; the game greeted the accession with 'We have been cursed!
  God have mercy on us all' (Trent's screenshot). By June 1430 the game also counts him worldly: his years
  with the fleets, among harbours, fishermen and travellers, had taught him how things get done, and his eyes
  stayed on the sea (Trent's account and screenshot). On 15 July 1430, when Santiago de Compostela fell, he
  ordered its cathedral, the shrine of the Apostle James, destroyed, and its Pórtico de la Gloria carried to
  Ishbīliya (Trent's account and screenshot). He laid down the admiralty he had held since 1411 on 19 March
  1433, returned from the Hajj with the honour of a ḥājj on 23 November 1433, and from 27 September 1434 had a
  famous Ṣūfī as his Shaykh al-Islām. From 1431 he was also regent of the Ṭāʾifa of Burghush for the young
  Khālid (save of 10 October 1435). On 15 July 1439, at fifty-three, he gained the Scholar trait (Trent's
  screenshot). At the peace of 29 November 1450 the whole kingdom of Sicily passed to him, Athens became his
  vassal, and he himself became ruler of Negroponte, Sicily's island subject, with Ismāʿīl as its heir (save
  of 29 November 1450).
