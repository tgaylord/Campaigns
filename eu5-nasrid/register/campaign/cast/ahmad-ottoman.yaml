note: >-
  Son of the Ottoman sultan Muḥammad and brother of ʿĀʾisha, the Emperor Ismāʿīl's wife. Sultan from his
  father's death of old age on 1 October 1412. A zealot of little ability (17/14/20), but his peace of April
  1417 took Sivas and the lands of Eretna, Amasya and the Dobruja; in 1420 his realm held 294 towns and 82
  ships, sixth in the world. His heir is his son Murād, born 7 November 1393, a far better diplomat (world
  file of 11 August 1420). His daughter Khadīja married the Emperor's grandson Ismāʿīl by 1422. Attacked by
  the Mamlūks in September 1423, with al-Andalus beside them, he lost 37 towns of central Anatolia at the
  peace of 8 August 1424 (saves of 1423 and 1424).
