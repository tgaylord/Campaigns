name: ʿĀʾisha bint Faraj
arabic: عائشة بنت فرج
sex: f
house: Naṣrid
born: '1355-03-28'
died: '1408-01-15'
father: faraj-ibn-ismail
mother: shama-sahara
note: >-
  Daughter of Faraj ibn Ismāʿīl and Shamʿa, born 28 March 1355 in Granada, about three months after her father
  had gone south to Ghana. By January 1373 the second wife of her cousin Ismāʿīl ibn Yūsuf, to whom she bore
  Muḥammad on 16 November 1372. Died 1408-01-15 (save of 24 October 1414).
