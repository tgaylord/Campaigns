name: Fatiu
sex: f
note: >-
  Daughter of the old ruler of Ghana. The Ghana betrothal of 8 September 1345 was fulfilled by her marriage to
  Faraj ibn Ismāʿīl, the amir's elder brother, who went south to live in Ghana with her (around the new year
  of 1355). Mother of Zineb, Faraj's daughter born in Ghana.
