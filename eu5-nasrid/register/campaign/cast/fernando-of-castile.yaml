note: >-
  Jerónimo's son and heir, six years old in September 1370. King of Portugal from his father's death on 29
  April 1402. In June 1410, at forty-five, he took Portugal into Qashtāla's war against the Emperor Ismāʿīl.
  His heir is his daughter Joana (save of 29 June 1410). He lost Porto on 7 October 1411 and his kingdom with
  it: at the peace of 1 November 1411 Portugal was annexed whole by al-Andalus, and Fernando is found at the
  court of Castile (saves of 1 November 1411).
