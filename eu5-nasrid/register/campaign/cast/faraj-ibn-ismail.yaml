note: >-
  Elder brother of Yūsuf I. Regent of Granada from 9 August 1351 until the sultan's return on 7 April 1352,
  while he made the Hajj (the chronicle's choice; the game named a Naṣr al-Stijjai). Around the new year of
  1355 he married Fatiu, daughter of the old ruler of Ghana, fulfilling the Ghana betrothal of 1345, and went
  south across the desert to live there. His first wife was Shamʿa, of a ruling house of the central Sahara
  (married 1 March 1354). The chronicle reads his going, like Ismāʿīl's in 1359, as the harem clearing the
  court of the amir's grown brothers. He died far from Gharnāṭa on 18 September 1370. In August 1395 his son
  Saʿd was made ruler of the new Ṭāʾifa of Qūnka (save of 5 August 1395).
