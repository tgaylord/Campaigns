note: >-
  Daughter of the ruler of Fezzan, of the house of Murzuq. Betrothed to Yūsuf on 16 November 1337, aged nine.
  Her father's name is the game's (name_salmama); its proper form is unconfirmed. Married to Yūsuf I while the
  Jamāʿa of 1344 sat (Trent's account), a marriage that helped inspire the royal harem law of that October.
  Mother of Sultan Saʿd, Ismāʿīl and Jadīla. By January 1373 she sat in her son's dīwān, promoting Andalusī
  culture beside Duʿā (save of 16 January 1373). From 8 March 1378 she worked in the dīwān on the realm's
  diplomatic endeavours (save of 6 April 1378). She died on 19 November 1380, aged fifty-two (save of 8
  December 1382).
