note: >-
  Son of Yūsuf I and Tizemt the Ḥafṣid, born 6 September 1355, the sultan's younger half-brother. At eighteen
  he led the right wing and two-thirds of the cavalry at the Battle of Barcelona (29 January – 19 February
  1374), the wing that broke the Aragonese flank (Trent's account). He died on 29 August 1404 (save of 29 June
  1410).
