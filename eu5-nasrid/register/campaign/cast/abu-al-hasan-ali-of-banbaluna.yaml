name: Abū al-Ḥasan ʿAlī ibn Aḥmad of Banbalūna
arabic: أبو الحسن علي بن أحمد
house: Naṣrid
born: '1417-02-16'
father: ahmad-ibn-yusuf-ibn-ismail
roles:
  - lord of the Ṭāʾifa of Banbalūna (from 1449)
note: >-
  Eldest son of Aḥmad ibn Yūsuf, lord of the Ṭāʾifa of Banbalūna, whom he succeeded when his father died of
  camp fever on 18 February 1449; his son Aḥmad was born on 18 April 1448 (save of 2 August 1449).
