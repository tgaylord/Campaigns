note: >-
  Daughter of Joan d'Oriola of Valencia, Sunni. Ruler of the Ṭāʾifa of Mursiyya from 29 January 1371, its
  ḥājiba in the court's word. Widow of Blai Manrique de Lara, a Muslim scholar who died in November 1372;
  mother of Bernarda and Estefania. When Murcia was taken into the crown on 16 March 1375 she was granted
  lands and titles and confirmed as a governor there (Trent's account). Died 1398-01-14 (save of 24 October
  1414).
