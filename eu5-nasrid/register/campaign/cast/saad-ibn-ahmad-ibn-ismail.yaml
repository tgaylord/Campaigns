note: >-
  Son of Aḥmad ibn Ismāʿīl ibn Saʿd, ruler of the Ṭāʾifa of Liyūn; born 4 June 1411. Married to two daughters
  of the Emperor Muḥammad, Umm al-Fatḥ and Muʾmina, and father by them of Fāṭima, Muḥammad and Abū al-Ḥasan
  ʿAlī, among others. Succeeded his father at Liyūn on 4 January 1456. (save of 7 March 1456)
