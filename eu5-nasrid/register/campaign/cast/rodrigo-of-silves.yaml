note: >-
  A Portuguese lord, now a Muslim, set over the Ṭāʾifa of al-Gharb when Granada released the Portuguese south
  as its vassal on 13 April 1366 (save of 6 November 1366). In September 1368 Castile guaranteed his ṭāʾifa's
  independence, and Granada backed the loyalists against it. Died 1375-01-24 (save of 24 October 1414).
