name: Aiman
sex: f
house: Baḥrī
tier: central
born: '1344-04-06'
died: '1391-10-14'
drives:
  - from: '1364-01-18'
    text: Saʿd's first wife, a princess of the Mamlūk house, mother of his first child.
    by: chronicle
    source: her record
  - from: '1366-04-05'
    text: >-
      Leads the Mamlūk faction at court: Egypt's alliance, Egypt's money and Egypt's soldiers, against Duʿāʾ's
      Maghrib. As Granada grows stronger, it becomes worth fighting over.
    by: trent
    source: Trent's direction, November 2026
  - from: '1374-06-01'
    text: 'Her faction earns its place: Mamlūk men fight for Granada in Malta and Catalonia.'
    by: trent
    source: Trent's account, 1374–1375
  - from: '1375-03-16'
    text: Sits in the dīwān by the strength of the harem, without a formal office.
    by: trent
    source: Trent's ruling, March 1375
  - from: '1385-08-23'
    text: Quarrels openly with Duʿāʾ while Ismāʿīl is regent.
    by: trent
    source: Trent's account
ties:
  - with: bolot-mamluk
    kind: faction
    from: '1368-10-03'
    to: '1391-10-14'
    text: 'Her half-brother on the throne of Egypt: the Mamlūk alliance is her party''s.'
