name: Tiramakhan
arabic: تيرماخان
tier: key
born: '1385-04-26'
roles:
  - Mansa of Mālī (from 1410)
note: >-
  Mansa of Mālī from 26 August 1410, reigning from Niani. In the first half of 1428 he received Andalusī
  envoys who came by the new sea roads, exchanged gifts with the Emperor Ismāʿīl and exempted Andalusī traders
  from tariffs throughout his empire (Trent's account). His heir is Majan, born 28 June 1405 (world file of 25
  May 1428).
