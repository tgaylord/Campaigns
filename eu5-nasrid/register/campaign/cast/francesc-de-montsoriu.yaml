note: >-
  A Catalan, Sunni, first ruler of the Ṭāʾifa of Catalonia, the ḥājib in the court's word, carved from the
  conquered lands of Aragon around Barcelona on 16 March 1375. On 15 April 1375 he married the Emperor's
  sister Fāṭima bint Yūsuf (save of 5 June 1375; Trent's account). Died 1394-03-20 (save of 24 October 1414).
