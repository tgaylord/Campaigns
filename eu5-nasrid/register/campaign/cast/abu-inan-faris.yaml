note: >-
  Marīnid sultan of Fās. He declared the Second War for the Submission of Granada on 24 October 1368 and led
  the first Marīnid force across the Strait himself. Murād destroyed it at Cádiz on 11 November 1368 (save of
  18 November 1369). He made peace on 12 September 1370 and gave up the whole north shore of the Strait. He
  died on 7 October 1381 (save of 1 October 1387).
