note: >-
  Son of the Emperor Muḥammad's daughter Muʾmina (born 1410, full sister of Prince Aḥmad) and her husband
  Saʿd, son of Aḥmad ibn Ismāʿīl ibn Saʿd; born 9 May 1433. A man of 84/81/67 at nineteen. By the save of
