note: >-
  Son and heir of Sultan Saʿd, born to Duʿāʾ the Marīnid on 8 March 1366, a month before the Peace of
  Independence. At eight he was already a silver tongue (63 in diplomacy). In late 1374 he and his
  half-brother Yūsuf were both given the costly tutors their father had had; his mother Duʿā had wanted them
  for him alone (Trent's account). On 16 March 1375 he was betrothed to Bernarda of Murcia, the gifted heir of
  the Ṭāʾifa of Mursiyya, as Murcia was taken into the crown (Trent's account). From 23 August 1385 he ruled
  as regent while his father made the Hajj, with his mother Duʿā and Aiman quarrelling at court (Trent's
  account). Before that he had served as an admiral, to carry the crown's authority over the seas: his first
  command, from 17 June 1383 (save of 1 October 1387) until he joined the dīwān. In 1386 he was brought home,
  and on 22 January 1387 he took the seat in the dīwān created by the Ḥijāba, to help his father's
  scholar-building project (Trent's account). He had married Bernarda of Murcia by 1 October 1387. In May 1391
  he took a second wife, ʿĀʾisha of the house of ʿOthmān. His sons: Yūsuf (1383–1384) and Muḥammad (born 25
  October 1385) by Bernarda; Saʿd (born 17 June 1392) and Aḥmad (born 21 October 1393) by ʿĀʾisha (save of 2
  January 1394). By 1398 his sons were Muḥammad, the eldest, judged unfit to rule; Saʿd, intelligent and
  studious; and Aḥmad, ambitious (Trent's account; save of 3 September 1398). He became Emperor on 2 March
  1405, at thirty-eight, when his father died on the march through Moya, and sixteen days later won his first
  battle as Emperor before Qūnka, destroying the army of the rebel Kingdom of Toledo (Trent's account and
  screens). On 10 July 1405 he beat the remnant of the Toledo army before Qūnka a second time, and by 24
  August 1405 the risings of 807 were over; on 1 September 1405 the Ṭāʾifa of al-Gharb was taken into the
  crown. On 1 March 1408 he resolved to raise Qurṭuba as the Capital of the Old Caliphate but kept his court
  at Ishbīliya (Trent's screen). By August 1408 the game counted him just as well as deceitful and
  goal-oriented, and he had set aside any thought of changing the succession: his heir Muḥammad's sons would
  carry the line if he reigned long (Trent's account; save of 5 August 1408). In the fourth war of the
  Istirdād he led the army himself: at Cuéllar on 13 January 1411 (17 Ramaḍān 813, the day of Badr), 25,700
  against Castile's 19,300, and at Toro on 15 May 1411, 20,900 against 11,100; both were victories (Trent's
  battle screens). He also won at Ledesma (7 March 1411), Besteiros (28 August 1411) and Guimarães (27 October
  1411). At the peace of 1 November 1411 he annexed Portugal and took 63 towns from Castile, raising the crown
  from 161 towns to 258 and its people from 2.04 to 3.96 million (saves of 1 November 1411). Shortly after the
  Jamāʿa of October 1414 the game also counted him greedy, a ruler who grows iron-fisted and short-sighted in
  collecting revenue: just in public, deceitful in private, goal-oriented, and now greedy (Trent's screen; the
  save of 24 October 1414 does not yet show it). His 'silver tongue' is his diplomacy of 100, not a trait. He
  died on 28 June 1429 (25 Ramaḍān 832), at sixty-three, while the army was camped at Ishbīliya, after a reign
  of twenty-four years; the game remembered him for his fair and impartial rulings (Trent's screenshot).
