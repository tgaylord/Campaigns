note: >-
  Son of Yaḥyā Raḥḥū and Qamar, the mother of Ismāʿīl ibn Ismāʿīl: born into the Raḥḥū house on 30 December
  1342. Took his seat in the dīwān on 2 April 1359, at sixteen, after Ismāʿīl ibn Ismāʿīl left for the Aydınid
  court; set to promoting Andalusī culture. One of the ablest men at court (80/85/78), an architect. Left the
  dīwān on 10 April 1366, when Maryam bint Ismāʿīl took his seat. A general in the Second Marīnid War: he was
  thrown back before Cádiz on 26 June 1369, held the line at Antequera on 15 October and won at Almuñécar on 8
  November (save of 18 November 1369). He went on to win at Adra, Málaga (twice), Jerez and Beja in 1369–1370,
  the general of the war's second half. By January 1373 married to Charlotte of Crato, a Sunnī Portuguese
  noblewoman. In January 1402, at fifty-nine and still 80/85/78, he led the crown's Highland Prospecting
  Survey into the hills, from Almonaster in the Sierra toward El Escorial, Qusanṭīna and home to Ishbīliya
  (Trent's screens). The survey found iron at al-Iskuriyāl, silver at Qusanṭīna and gems at Qrabaqa, and came
  home on 3 August 1402. He is one of the court's favourites, sent whenever a member of the house does not see
  to a thing himself (Trent). On 2 July 1405, at sixty-two, he commanded the joint host of al-Andalus, Aragon
  and Catalonia, some 20,550 men, that broke the rising of Ciudad Rodrigo at Granadilla (save of 8 July 1405).
  On 1 November 1411, at sixty-eight, he was made ruler of the new Ṭāʾifa of Burghush, the 28 towns of Old
  Castile from Burgos and Valladolid to Palencia, Segovia and Logroño, the first man outside the house of Naṣr
  to be given a ṭāʾifa (save of 1 November 1411). He died on 2 September 1412, aged sixty-nine, less than a
  year after he was given Burghush; his son Abū Ḥammū succeeded him (save of 24 October 1414).
