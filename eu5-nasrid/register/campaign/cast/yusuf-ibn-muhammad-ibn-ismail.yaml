note: >-
  Son of the Emperor Muḥammad by the lady Jadīla, born 10 July 1416; full brother of Umm al-Fatḥ and Fāṭima,
  half-brother of the Emperor Ismāʿīl and of Aḥmad. Lives at Gharnāṭa; two wives, nine children. On 1 December
  1456 the Emperor invited him to serve, and he holds the distinction of a prominent leader for life (+10 war,
  +5% morale to the armies), though the court expects his ambition to turn against the throne. (Trent's
  screens of 1 December 1456; save of 2 January 1457)
