note: >-
  Eldest son of the heir Muḥammad, by Magdalena de Borja; born 4 October 1402, the Emperor's grandson and
  great-grandson of the Emperor Saʿd. Gifted, and with his half-brother Aḥmad enough at five to set aside the
  thought of changing the succession (Trent's account; save of 5 August 1408, taken before the boys'
  educations were set). Grown, by August 1420, into a man of 70/73/63; the childhood gift has lapsed with no
  adult trait yet in its place (save of 11 August 1420). By 1422 he had married three princesses of the Muslim
  empires: Tella of Fās, daughter of Abū Ḥammū and sister of the sultan Yaḥyā; Ayaulym, daughter of the Mamlūk
  sultan Aqṭāy; and Khadīja, daughter of the Ottoman sultan Aḥmad. Children: Yūsuf (6 January 1422) by Tella,
  ʿĀʾisha (24 January 1422) by Khadīja, Jadīla (29 June 1422) by Ayaulym, Muʾmina (8 August 1424) by Tella
  (saves of 1423 and 1424).
