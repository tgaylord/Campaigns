name: Ismāʿīl ibn Muḥammad
arabic: إسماعيل بن محمد
house: Naṣrid
tier: central
born: '1402-10-04'
father: muhammad-ibn-ismail-ibn-saad
mother: magdalena-de-borja
roles:
  - heir of al-Andalus (from 1429)
  - member of the dīwān (from 1429)
stats:
  adm: 70
  dip: 73
  mil: 63
drives:
  - from: '1408-08-05'
    text: 'Raised beside his half-brother Aḥmad, both gifted: a bond and an alliance from childhood.'
    by: trent
    source: Trent's account, 1408; Trent's direction, November 2026
  - from: '1422-01-01'
    text: >-
      The silver tongue, deceitful when it serves: he ties the realm to its allies, marrying princesses of
      Fās, Egypt and the Ottomans.
    by: trent
    source: Trent's direction; saves of 1423 and 1424
  - from: '1429-06-28'
    text: >-
      Heir to a father whose eyes are on the sea, he and Aḥmad carry the state between them; when he reigns,
      Aḥmad is to head his council, a second seat of power.
    by: trent
    source: Trent, June 1430; Trent's direction, November 2026
  - from: '1432-05-01'
    text: >-
      The great projects of state are his: the conversion of the north to the faith and to Andalusī culture,
      and the binding of realm and allies together.
    by: trent
    source: Trent's direction; his dīwān seat (Andalusī culture, then assimilating the new lands from 1437)
  - from: '1442-06-11'
    text: Mends the damage of the Jamāʿa of 846, appeasing the estates.
    by: chronicle
    source: Of the Princes' Mending
  - from: '1447-08-01'
    text: >-
      Reads the claim to the Umayyad borders, which run through his wives' homelands, as a sword that never
      leaves the scabbard and is still a sword.
    by: chronicle
    source: Of the Envoys of Europe and the Borders of the Umayyads
  - from: '1448-09-02'
    text: Talks the estates round after his father's decree on the commons.
    by: chronicle
    source: Of the Jamāʿa of the Commons
  - from: '1449-10-25'
    text: >-
      With Aḥmad, raises the first new army in a generation, 4,000 men of the thughūr, to finish the war in
      Sicily.
    by: trent
    source: Trent's account, late October 1449
  - from: '1450-09-28'
    text: Carries to Tunis the Emperor's claim to all of Sicily as compensation, and Tunis understands.
    by: chronicle
    source: Of Catania and the Battle before Balarm
  - from: '1451-12-21'
    text: >-
      Argues for a ṭāʾifa in Sicily, the way the realm has always bound its conquests; loses to his father and
      brother.
    by: chronicle
    source: Of the Governor of Balarm and the Holy Cities
