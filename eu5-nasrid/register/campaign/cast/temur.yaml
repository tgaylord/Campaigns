note: >-
  Lord of Samarqand from 25 October 1360. Between 1394 and 1420 his realm grew from 234 towns to 707, the
  fourth power of the world: Herat, Iṣfahān and Tabrīz by 1407, Kāshghar and Farghāna in February 1414, Fārs,
  Kirmān and Hurmuz in 1415. In August 1420 he was eighty-four and still on the throne; his chosen heir was
  Köke, a conqueror and army reformer of forty-eight (world files of 1394–1420).
