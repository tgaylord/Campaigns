note: >-
  Son of Sultan Saʿd and Aiman the Mamlūk, born 15 October 1371, named for his grandfather Yūsuf I (save of 16
  January 1373). Following in his father's footsteps, as the court saw it; in late 1374, at three, he was
  given the same costly tutors as the heir, over Duʿā's objection (Trent's account). Betrothed by October 1387
  to Madīna, of a Mamlūk-cultured house, and to Caterina de Borja, daughter of King Alfons of Aragon, he
  married both, and by January 1394 he had gone to live at the Aragonese court at Benabarre, as the game moves
  a husband to his wife's court. His children: Muʾmina (born 1389) by Madīna and Saʿd (born 1394) by Caterina,
  and both wives were with child by him in September 1398. In 1398 he commanded troops for Aragon (March to
  July). With his mother dead and himself far away, the old quarrel over the succession has cooled (Trent's
  account; saves of 1 October 1387, 2 January 1394 and 3 September 1398). In September 1398 the Emperor called
  him home to Ishbīliya with his son Saʿd; Caterina stayed in Aragon (Trent's account). On his brother
  Ismāʿīl's accession in March 1405 he took Ismāʿīl's old seat in the dīwān, promoting Andalusī culture (save
  of 31 March 1405). From 7 October 1411 he worked in the dīwān on the realm's standing abroad (save of 1
  November 1411). From 27 October 1414, three days after the Jamāʿa, he worked in the dīwān to appease the
  estates (save of 1 January 1416).
