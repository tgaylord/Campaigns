note: >-
  Eldest son of the heir Ismāʿīl by Tella, born at Gharnāṭa on 6 January 1422, and second in line behind his
  father. Given an expensive, in-depth education, and shrewd as a child. By January 1438 he had married three
  wives: Amie, daughter of Mansa Tiramakhan of Mālī; Fāṭima, daughter of the late Yūsuf ibn Ismāʿīl of
  Banbalūna, to tie the ṭāʾifas to the crown; and Muʾmina, daughter of Muṣliḥ al-Dīn of the court. At sixteen
  his grandfather the Emperor made him admiral of the fleet, believing the post had made a man of him and
  would do the same for his grandson (Trent's screenshot and account; save of 16 January 1438). In January
  1448, admiral of the eleventh fleet in the Tunisian war for Palermo, he proved himself raiding along the
  coast of Naples, and the chancellor reported him an accomplished sailor (Trent's account and screenshot, 13
  January 1448). His squadron sank an Athenian ship off Terracina (5 January 1448) and two Sicilian ships in
  the Gulf of Termini (13 January), and on 21 October 1448, with 21 galleys, sank all five Genoese ships it
  met in the Corsica Channel without loss. His son Āram by Amie was born on 23 April 1449 (save of 2 August
  1449; Trent's battle screen).
