  Ourense and Tui, when they were made a ṭāʾifa of the Emperor on 3 November 1430, two days' work after the
  Peace of Ṣafar: some 518,000 people, Galician in speech and Catholic in faith, with 2,400 regulars and three
  ships (save of 5 November 1430).
