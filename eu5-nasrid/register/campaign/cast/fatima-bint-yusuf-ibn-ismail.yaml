name: Fāṭima bint Yūsuf ibn Ismāʿīl
arabic: فاطمة بنت يوسف بن إسماعيل
sex: f
born: '1419-06-08'
father: yusuf-ibn-ismail
roles:
  - wife of Prince Yūsuf
note: >-
  Daughter of Yūsuf ibn Ismāʿīl, lord of the Ṭāʾifa of Banbalūna (d. 1428). Married to Prince Yūsuf by January
  1438 to tie the ṭāʾifas to the crown (Trent; save of 16 January 1438).
