note: >-
  A Leonese noble who on 4 September 1420, when the Kingdom of Castile fell apart, became king of Asturias: 8
  towns from Oviedo, Castile's last capital, to Avilés, Villaviciosa and Llanes, some 130,000 people, nearly
  all Leonese and Catholic (save of 4 September 1420). On 25 March 1425 Galicia took all of Asturias (save of
  25 May 1428).
