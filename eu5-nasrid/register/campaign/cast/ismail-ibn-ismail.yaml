note: >-
  Betrothed on 16 March 1354 to a daughter of the Aydınids of Anatolia. He married her about March 1359 and
  went to live at the Aydınid court, leaving his seat in the dīwān; the chronicle reads it, like Faraj's
  going, as the harem clearing the court of the amir's grown brothers. He died abroad on 4 October 1380. In
  August 1395 his son Saʿd, born of his Aydınid wife, was made ruler of the new Ṭāʾifa of Shalamanka (save of
  5 August 1395).
