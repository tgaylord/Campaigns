note: >-
  Cousin of the Emperor Saʿd: son of his late uncle Faraj ibn Ismāʿīl and of Shamʿa of the central Sahara.
  Husband of the Emperor's daughter Umm al-Fatḥ, who sits in the dīwān; their daughters were Maryam
  (1390–1394) and Jadīla (born 1393). On 5 August 1395 he was made ruler of the new Ṭāʾifa of Qūnka, 20 towns
  of the Castilian east taken at the Peace of Ramaḍān, with his brother Yūsuf (born 1360) as heir. He is also
  heir to the Ṭāʾifa of Shalamanka (save of 5 August 1395). He died on 20 February 1408, aged forty-nine, and
  his daughter Maryam succeeded him as Shaykha of Qūnka (save of 5 August 1408).
