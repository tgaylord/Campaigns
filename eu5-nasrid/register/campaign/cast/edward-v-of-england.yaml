note: >-
  King of England as Edward V from 18 April 1423. His war with France from April 1427 ended in the peace of 28
  November 1428, which took eighty French towns for England and its vassals and made Languedoc an English
  dominion of Toulouse. On 1 December 1428 he was made king of France as well, uniting England, France and the
  Dauphiné under one crown. England is allied to Castile and counts al-Andalus among its rivals (saves of
  1428). On 11 June 1429 he was crowned in Paris and his crowns were joined as a new Angevin Empire (Trent's
  account).
