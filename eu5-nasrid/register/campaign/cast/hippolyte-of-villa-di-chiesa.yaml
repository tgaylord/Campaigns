note: >-
  Daughter of Xavier, lord of Cagliari in Sardinia, a vassal of Tūnis; Sardinian by culture and Sunnī by
  faith. Married to the sultan's brother Ismāʿīl on 14 September 1370 (save of 1 November 1370). Died
  1405-09-02 (save of 24 October 1414).
