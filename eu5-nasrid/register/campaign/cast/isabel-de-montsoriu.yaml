note: >-
  Daughter of Francesc de Montsoriu, founder of the house that rules the Ṭāʾifa of Catalonia. Wife of the heir
  Muḥammad ibn Ismāʿīl and mother of his son Aḥmad (1403) and two daughters (save of 5 August 1408). Her
  mother was Fāṭima bint Yūsuf, daughter of Yūsuf I, so Isabel is a granddaughter of the house of Naṣr (save
  of 29 June 1410). She died of old age on 19 August 1447, her sixty-fifth birthday, after more than forty
  years as Muḥammad's wife (save of 5 October 1447).
