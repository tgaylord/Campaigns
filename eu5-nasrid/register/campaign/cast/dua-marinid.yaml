drives:
  - from: '1354-08-12'
    text: >-
      A Marīnid princess married into a court at odds with Fās: she brings the Maghrib with her, its manners,
      its scholars and its learning, and makes it fashionable in Gharnāṭa.
    by: trent
    source: Trent's direction, November 2026
  - from: '1355-03-10'
    text: >-
      Rises the moment the amir's brother Faraj leaves: she takes a seat in the dīwān under the harem law, the
      most capable and soon the most influential of the wives.
    by: trent
    source: Trent's direction; her record
  - from: '1358-08-01'
    text: Her Maghribī learning, the court's 'foreign wisdom', wins the scholars and angers the nobles.
    by: chronicle
    source: the game's Foreign Wisdom
  - from: '1363-08-01'
    text: >-
      Outlasts three reigns: widowed, she marries the regent, and widowed again, the young Sultan Saʿd. The
      Maghrib's voice at court survives every change of master.
    by: trent
    source: Trent's direction; her record
  - from: '1366-04-05'
    text: >-
      Fights Aiman for the court once Granada is free: the Maghrib against Egypt, her son Ismāʿīl against
      Aiman's daughters. The quarrel is the court's weather for twenty years.
    by: trent
    source: Trent's direction, November 2026
  - from: '1368-10-24'
    text: >-
      Her loyalty is whispered about while Fās makes war on Granada, and she answers by being more Andalusī
      than the Andalusīs.
    by: trent
    source: Trent's direction (invented colour)
  - from: '1374-06-01'
    text: >-
      Runs the court while Saʿd campaigns, summons the Jamāʿa to give the ʿulamāʾ power over the dhimmī, and
      wants the costly tutors for her son alone.
    by: trent
    source: Trent's account, 1374
  - from: '1385-08-23'
    text: With her son regent, the quarrel with Aiman comes into the open.
    by: trent
    source: Trent's account
