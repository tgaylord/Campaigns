note: >-
  A princess of the Marīnid house of Fās, betrothed to Granada on 18 January 1348 and married to Yūsuf I about
  12 August 1354: the one Marīnid bond that outlived Morocco's annulment of its treaties with Granada in 1351.
  The most capable of the amir's wives, she took Yaḥyā Raḥḥū's seat in the dīwān about 10 March 1355, after
  his death, under the Powerful Harem law that let women sit in the cabinet. By August 1358 she was widely
  praised for bringing fresh ideas and practices to the court (the game's 'Foreign Wisdom'), to the nobility's
  displeasure. Mother of Yūsuf's son Muḥammad (1356–1358). Widowed on 1 August 1363, she married the regent
  Naṣr al-Istijjī within days. Widowed again a few days after 18 January 1364, when Naṣr died of 'sickness',
  she then married the young Sultan Saʿd, her late husband Yūsuf's son. That made her his second wife, beside
  Aiman the Mamlūk. Mother of Saʿd's son and heir Ismāʿīl (born 8 March 1366). While Saʿd campaigned in Aragon
  in 1374 she ran the court in Gharnāṭa, and with his support by letter summoned the Jamāʿa to give the
  ʿulamāʾ more power to regulate and tax the dhimmīs (Trent's account). She died on 28 December 1388, aged
  fifty, after a short illness as the court tells it (the game's death notice gives suicide; the chronicle
  keeps the court's version, by Trent's ruling).
