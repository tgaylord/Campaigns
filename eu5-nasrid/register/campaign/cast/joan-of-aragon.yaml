note: >-
  King of Aragon and of Sicily (the two crowns in a union since 1343) from 24 April 1368; the game gives him
  the Catalan form of Juan. His heir in 1370 is his infant daughter Violant. He lost Aragon to the Naṣrids at
  the peace of 15 March 1375, after the battles of Barcelona and Tarragona and a siege of 282 days, and was
  let go unharmed to Palermo as a term of the peace, keeping Sicily less Malta. He died on 27 April 1410, aged
  sixty (save of 29 June 1410).
