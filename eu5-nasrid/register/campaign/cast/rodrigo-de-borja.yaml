note: >-
  Son of King Alfons; king of the renewed Aragon from his father's death on 24 February 1393, a boy of eleven.
  His sister Caterina is his heir (save of 3 September 1398). Brother of the Empress Magdalena, so uncle of
  the heir Ismāʿīl. A Muslim, kind-hearted, a babbler and no fighter by the game's count. As in 1404, the
  Pope's crusade of 1 October 1431 was declared on his kingdom, aimed at Barbastro (save of 1 October 1431).
