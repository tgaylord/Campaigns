name: Najīb
arabic: نجيب
born: '1317-01-15'
roles:
  - of the ʿulamāʾ
traits:
  - entrepreneur
  - stubborn
note: >-
  A man of the ʿulamāʾ who appears at court by January 1345, with gifts to rival any in the realm (85/96/76).
  The game calls him Abuna Najīb al-ʿĀbidīn. On 6 October 1351 he was handed over to Castile at its demand,
  was baptised, and became Ramiro, a Castilian, taking the learning of Qurṭuba's libraries with him: the
  second great mind of the court to go over to Castile, after Ibn al-Khaṭīb.
