note: >-
  A Zenata Berber, founder and head of the house of Raḥḥū; general from 1 September 1339 at the head of the
  Volunteers of the Faith. The game calls him 'a competent yet fickle figure'. He led the Volunteers of the
  Faith again from 18 October 1346, when they rose against the united crowns (in the game files his second
  command is a separate character with the same name, house and birth date; the chronicle keeps them one man).
  Took Faraj ibn Ismāʿīl's seat in the dīwān in 1355, after Faraj went to Ghana. Died of illness on 18
  February 1355, aged 54 by the game's reckoning, soon after taking the seat; the court called it coincidence.
