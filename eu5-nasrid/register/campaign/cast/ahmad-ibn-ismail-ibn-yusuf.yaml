note: >-
  Son of Ismāʿīl ibn Yūsuf, the old Emperor's brother: a cousin of the Emperor Ismāʿīl. Married to a daughter
  of Maryam bint Yūsuf and to a daughter of Khālid ibn Yaḥyā Raḥḥū. On 1 November 1411 he was made ruler of
  the new Ṭāʾifa of Burtuqāl, the 34 towns of the old Kingdom of Portugal, with his seat at Barcelos (save of
  1 November 1411). On 4 November 1421 he proclaimed his ṭāʾifa the Kingdom of Portugal and took the crown of
  the old kings, still the Emperor's ṭāʾifa; the new kingdom's state faith is Catholic, though he is a Muslim.
  By 1423 the game also marks him a zealot (save of 5 November 1423).
