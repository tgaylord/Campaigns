note: >-
  An Andalusī of the umarāʾ, born at al-Qubbāṣa (Alcobaça, in the old lands of Portugal) on 1 April 1416, two
  years after Portugal ended, and the founder of his own house, which the game names for his birthplace
  (El-Qbasa; Trent read it as al-El-Qhawai). A curious adventurer, a soldier more than a courtier. Made one of
  the empire's explorers on 30 October 1445; in mid-March 1446 he reached a cape where Africa seemed to come
  to an end (Trent's account; autosave of 1 February 1447). His commission as explorer ended on 1 October
  1447; on 5 October he sailed again for the cape, to find a place to leave an outpost (save and Trent's
  account of 5 October 1447).
