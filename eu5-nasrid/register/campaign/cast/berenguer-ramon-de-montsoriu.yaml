note: >-
  Son of Francesc de Montsoriu, ḥājib of Catalonia, and Fāṭima bint Yūsuf, daughter of Yūsuf I, so a first
  cousin of the Emperor Ismāʿīl; a Muslim. He rules the Ṭāʾifa of Catalonia from Barshalūna. In December 1428
  the court made the integration of his ṭāʾifa into the crown a first concern, expected to be complete by the
  middle of 1437 (save of 1 December 1428; Trent's account).
