note: >-
  Son of the sultan Būlād, whom he succeeded on 16 June 1396. Al-Andalus's one ally in the East since 1367. In
  1420 he ruled 191 towns from Cairo and 103 more through vassals from the Ḥijāz to the Taurus, ninth in the
  world; Hungary, the Ottomans and the Tīmūrids are his rivals. His heir is his son Jyral, born 30 December
  1401 (world file of 11 August 1420). His daughter Ayaulym married the Emperor's grandson Ismāʿīl by 1422. On
  19 September 1423 he went to war with the Ottomans and called al-Andalus to arms; the peace of 8 August 1424
  gave him 37 towns of central Anatolia (saves of 1423 and 1424).
