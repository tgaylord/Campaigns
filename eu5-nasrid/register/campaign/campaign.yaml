eras:
  - id: book-of-mending
    title: The Mending of the State
    arabic: كتاب الإصلاح
    from: '1337-04-01'
    to: '1346-10-16'
    summary: >-
      The calm before the storm. A young sultan, tributary to Castile and deep in debt, sets the state in
      order: the Catalan privileges, the war on Aragon and the peace of Balansiyya, the two ṭāʾifas of the
      east, Morocco's defeat of 1340, the Jamāʿa of 1344 and the crown it strengthened, and the debt paid
      down. It ends the day Morocco declares war again.
  - id: book-of-balance
    title: The Balance
    arabic: كتاب الميزان
    from: '1346-08-01'
    to: '1370-09-14'
    summary: >-
      Granada on the scales between the three crowns of Iberia and the Marīnids, from the season sovereignty
      first slipped below 50. The war of 1346 brought five great victories, the Peace of Qurṭuba (January
      1349) and the quiet bargain for Qarmūna and the silver of Qusanṭīna (May 1351). Morocco's surrender in
      June 1351 ended its alliance and its foothold on this shore. The War of Independence (1363–1366) broke
      Castile's hold. When the Marīnids took the north shore and came again, the Second Marīnid War
      (1368–1370) drove them from it. On 14 September 1370 the Battle for the Strait ended: the Throne of
      Granada endures.
  - id: book-of-pestilence
    title: The Pestilence
    arabic: كتاب الوباء
    from: '1346-08-01'
    to: '1352-01-27'
    summary: >-
      The Black Death, from the first rumours out of the east in 1346 and the hospitals the amir raised
      against it in Gharnāṭa, Mālaqa and al-Mariyya, to the day it left the last town of the realm, 27 January
      1352, the Day of ʿArafa on which the amir stood on the plain. Its heart is the reshaping of Granada
      itself: the most urban realm in Iberia, two in five of its people living in cities where Castile had one
      in twenty, lost 42% of its people in four years, the cities and their burghers and scholars worst of
      all, hospitals or no. Ran beside the Book of the Balance.
  - id: book-of-the-call
    title: The Call
    arabic: كتاب الدعوة
    from: '1356-10-01'
    summary: >-
      Education and the return of Islam to al-Andalus as the Emirate grows: roads through the mountains,
      libraries in the cities of the south and then the north, and the slow reconversion of Qurṭuba and the
      valley of the great river, purged of Islam and of Andalusī culture during the Castilian occupation.
      Written as it happens.
  - id: book-of-the-marches
    title: The Marches
    arabic: كتاب الثغور
    from: '1370-09-14'
    to: '1430-11-03'
    summary: >-
      Granada looks north. The old thughūr, the marches of al-Andalus that faced the Christian kingdoms (the
      Lower March of Badajoz and Mérida, the Middle March of Toledo, the Upper March of Zaragoza), are the
      frontier again, with Lisbon and Barcelona at the borders of the ṭāʾifas and Castile the one equal left.
      The book follows the six wars of the Istirdād, from the Upper March (1373) through the Restoration of
      al-Andalus, the League and the War of Jillīqiya that ended Portugal and broke Castile, to the Wars of
      Shant Yāqub and of the Mountains. It closes at the Peace of Ṣafar, 3 November 1430, when Galicia,
      Navarre and the last of Castile were annexed and the whole peninsula belonged to the Emperor and his
      ṭāʾifas.
  - id: book-of-the-encircling-sea
    title: The Encircling Sea
    arabic: كتاب البحر المحيط
    from: '1379-04-25'
    summary: >-
      Al-Andalus turns to the sea and to trade. From the Jamāʿa of 1379, which moved the court to Ishbīliya
      for its river and its market, through the fleet and its admiral the crown prince, the Ḥisba and the
      banks, the arms trade with Mali and the voyage down the African coast toward it, to the islands of the
      Ocean: the Azores, Madeira and the Canaries. Behind it, the crown's building: lumber mills and iron
      smelters, workshops and markets, cotton fields and bathhouses. It is the road toward the Age of
      Discovery. Written as it happens.
  - id: book-of-the-franks
    title: The Franks
    arabic: كتاب الإفرنج
    from: '1430-11-03'
    summary: >-
      Christendom answers. With the Peace of Ṣafar the whole of Iberia belongs to the Emperor and his ṭāʾifas,
      and for the first time since the Arabs crossed the Strait the peninsula is a Muslim land from end to
      end. The book follows Europe's reaction and the wars that follow it, beginning with the destruction of
      Santiago's shrine coming home: the Emperor's warmonger's name, and the second crusade against
      al-Andalus, proclaimed in October 1431. Written as it happens.
  - id: book-of-the-golden-century
    title: The Golden Century
    arabic: كتاب القرن الذهبي
    from: '1442-06-01'
    summary: >-
      The new era. It opens with the Emperor's Jamāʿa of 846, which seated the burghers beside the umarāʾ and
      the ʿulamāʾ, and the reforms that spread from it across the realm, and with the Golden Century of
      al-Andalus proclaimed on 7 August 1442: Iberia gathered under one banner, the Strait held, and a century
      of wealth and consolidation ahead, watched by a Europe that may yet ally against it. Written as it
      happens.
