 temper. But the dīwān had already set its course. The state was built: its offices, its chancery, its inspectors and its banks no longer needed the great lords. From now on the crown would grow by taking from the umarāʾ, as gently as it could, and the burghers would rise in their place.\n\nIn the first days of Ṣafar 805 the Emperor called a Jamāʿa at Ishbīliya. The umarāʾ came for their gift, a monopoly on the land roads of trade for ten years. The burghers came to pay for their privileges, and they pledged a great sum to build up the markets of the south. On the day after the assembly rose, the Emperor granted Ishbīliya a charter for its jewellers, to double their trade with the silver of Qusanṭīna.\n\nBy Dhū al-Ḥijja of that year the workshops were rising. Ishbīliya had eight halls of jewellers and nine more half-built, and [Istijja](place:istijja) two and three more, and the great market of the capital was being enlarged again beside them. The treasury took in far more each month than it had on the eve of the War of the League, and spent a quarter less than it took. And still the umarāʾ, between them, sat on many times the gold the treasury held.\n\n*And give full measure when you measure, and weigh with an even balance. That is the best way and best in result.*"}, {"addr": "807-04-16", "slug": "0807-04-16-of-the-crusade-of-806-and-the-peace-of-avignon", "n": 73, "bn": 15, "hy": 807, "hm": 4, "hd": 16, "w": 1404, "title": "Of the Crusade of 806, the March on Avignon, and the Peace of Avignon", "date": "1404-10-22", "dateStr": "22 October 1404", "hdateStr": "16 Rabīʿ al-Thānī 807", "book": "book-of-the-marches", "people": ["saad-ibn-yusuf", "rodrigo-de-borja"], "places": ["al-mariyya", "ishbiliyya"], "sources": ["1404-02-01-the-crusade", "1404-02-09-battle-gulf-of-roses", "1404-05-10-battle-aix", "1404-06-24-battle-mouths-rhone-ii", "1404-08-03-battle-gulf-florent", "1404-07-04-march-on-avignon", "1404-10-01-the-sephardim-of-al-mariyya", "1404-10-10-battle-barjols", "1404-10-20-battle-barjols-ii", "1404-avignon-taken", "1404-10-22-peace-of-avignon"], "words": 716, "catch": "For nearly nine years after the Peace of Ramaḍān the empire", "canon": 3, "body": "For nearly nine years after the Peace of Ramaḍān the empire fought no one. It was broken from the least likely quarter. On 19 Rajab 806 the Pope at Avignon proclaimed a crusade against al-Andalus, the first ever preached against the empire by name, and declared war on the Ṭāʾifa of Arghūn and its young king [Rodrigo](person:rodrigo-de-borja). The Emperor [Saʿd](person:saad-ibn-yusuf) answered for his ṭāʾifa at once, as he was bound to.\n\nThe court at [Ishbīliya](place:ishbiliyya) waited to see who would take the cross. Almost no one did. The kings of Christendom had their own wars, and Qashtāla, which had most cause to hate the Emperor, did not stir. The crusade was the Pope's own vassals, his cities of Faenza and Siena, and a handful of German prince-bishops and lords from Mainz to Magdeburg, some five thousand men at the proclamation and most of them levies. The Pope's own regiments mustered fewer than three hundred men under arms. Against them stood the empire's regular army and its ṭāʾifas, the Mamlūks of Miṣr with the Holy Cities and all their vassals, and the Marīnids of Fās with their fleet. The preachers of Ishbīliya asked what kind of crusade it was that could not fill a town square.\n\nIts one weapon was a fleet. Eight days into the war seven papal galleys caught two Catalan ships in the Gulf of Roses and sank them both. They did not last the summer. The joined fleets of Catalonia and the Marīnids, ninety-one sail, swept the mouths of the Rhône, and in Muḥarram 807 the Marīnid admiral Abū Ḥammū caught a papal squadron off Corsica and sank it to the last ship. On land the Catalan army marched into Provence, and at Aix three hundred and seventy Sienese crusaders threw themselves on it and died to the last man.\n\nIn Dhū al-Ḥijja 806 the King of France, who had been the empire's friend since the embassies of 797, opened his roads to the armies of the faithful, and the Emperor crossed into Languedoc at their head. He was fifty-six. His officers asked him to let a general take the army over the mountains; he answered that he had marched with the army since he was sixteen and saw no reason to stop now. He slept in the camp, ate what the soldiers ate, and laid siege to Avignon, the Pope's own city on the Rhône.\n\nIt was before Avignon, in Rabīʿ al-Awwal 807, that the question of the Jews of [al-Mariyya](place:al-mariyya) reached him. Jews from all over the peninsula had made the town a haven, where they lived and traded without fear. Some at court called it the justice owed to all of Allāh's creation. The zealous called it a stain on the empire. The Emperor ruled from his tent that the rights of the Jews were under his protection, and he ordered the crown to build them a house for their community at al-Mariyya. It did not escape the dīwān that he did it while making war on the Pope, and it did not escape the Jews of the Christian kingdoms either.\n\nIn Rabīʿ al-Thānī the last papal army came up to relieve the city. On the fourth of the month it threw back the Valencians at Barjols in Provence, and nearly half the Valencian army died there. Ten days later the Emperor came up with his own army and destroyed what was left of the papal host on the same field: of five hundred and nineteen men, twenty-four escaped. He lost four. Avignon had fallen by the time the Pope sued for peace.\n\nThe Pope gave up his crusade on 16 Rabīʿ al-Thānī 807. He was made to declare his humiliation before Christendom, to pay five hundred and eighty-five dīnārs of gold at once and reparations for years to come. The Emperor took no land. He had no wish to rule a Christian city in the middle of France, and he said the Pope's city was worth more to him as a lesson than as a province. Every king in Christendom had seen the Pope preach a crusade against al-Andalus, and every one of them had seen how it ended.\n\n*Fight in the way of Allāh those who fight you, but do not transgress. Indeed, Allāh does not like transgressors.*"}, {"addr": "807-09-16", "slug": "0807-09-16-of-the-risings-of-807-and-the-death-of-the-emperor-saad", "n": 74, "bn": 16, "hy": 807, "hm": 9, "hd": 16, "w": 1405, "title": "Of the Risings of 807, and the Death of the Emperor Saʿd", "date": "1405-03-18", "dateStr": "18 March 1405", "hdateStr": "16 Ramaḍān 807", "book": "book-of-the-marches", "people": ["saad-ibn-yusuf", "saad-ibn-ismail", "ismail-ibn-saad", "muhammad-ibn-ismail-ibn-saad", "saad-ibn-ismail-ibn-saad", "saad-ibn-yusuf-ibn-saad", "yusuf-ibn-saad", "bernarda-of-murcia"], "places": ["shantarin", "yabura", "majrit", "shalamanka", "tulaytula", "al-ushbuna", "batalyaws", "marida", "qunka", "barshaluna", "saraqusta", "ishbiliyya", "al-mariyya"], "sources": ["1404-10-22-peace-of-avignon", "1405-01-01-the-risings", "1405-03-02-death-of-the-emperor", "1405-03-02-accession-of-ismail", "1403-07-18-state", "1405-03-18-battle-cuenca", "1363-08-02-state"], "words": 834, "catch": "The Pope's gold was barely counted when the dīwān turned back", "canon": 3, "body": "The Pope's gold was barely counted when the dīwān turned back to Qashtāla. Since Shawwāl its scribes had been drawing up a new claim on the lands the Castilians still held, and by Rabīʿ al-Thānī 807 the work was well advanced. The ʿulamāʾ had begun to speak of the fourth war of the Istirdād. It did not come that winter, because the north rose first.\n\nOn 28 Jumādā al-Ākhira 807 the lands taken from Portugal at the Peace of Ramaḍān proclaimed a kingdom of their own, which they called Estremadura, from [Shantarīn](place:shantarin) on the Tagus to [Yābura](place:yabura) and Elvas. On the same day the country of [Majrīṭ](place:majrit) and La Mancha rose as a Kingdom of Toledo, thirty towns from Alcalá and the Escorial down to Ciudad Real and Caravaca. The next day the Leonese of [Shalamanka](place:shalamanka) rose against their own ṭāʾifa and its ruler, the Emperor's cousin [Saʿd ibn Ismāʿīl](person:saad-ibn-ismail), and set up a lordship at Ciudad Rodrigo. Forty-eight towns of the crown went over in two days, and sixteen of Shalamanka with them. The iron of the Escorial and the gems of Qrabaqa went with them. [Ṭulayṭula](place:tulaytula) held, and [al-Ushbūna](place:al-ushbuna), and Setúbal, Cáceres, [Baṭalyaws](place:batalyaws) and [Mārida](place:marida). Some at court said this was what the Pope had been waiting for all along. Others said the Christians of the north had simply looked at an emperor of fifty-six who had just spent a summer in France, and decided their moment had come.\n\nThe Emperor marched north at once. He took the army up through the Ṭāʾifa of [Qūnka](place:qunka) toward the rebels of Toledo, and he was with it on 29 Shaʿbān 807, the eve of Ramaḍān, as it passed through Moya. There he died. He was fifty-seven, and he had reigned for forty-one years. The army was on the march, the enemy was in front of it, and he had spent the day in the saddle. The soldiers said he could not have wished for anything else.\n\nConsider what he left. He came to the throne at fifteen, lord of forty-three towns, with twenty-four dīnārs in the treasury and an income of fifty-two a month against expenses of eighty-nine. He left a hundred and forty-eight towns under the crown before the risings, six ṭāʾifas under his hand from Shalamanka to [Barshalūna](place:barshaluna), an income of more than two hundred and forty dīnārs a month and two hundred and eighteen in the treasury, and an empire the courts of Christendom ranked among their first six. He had restored al-Andalus and taken the style of Emperor. He had won back the north shore of the Strait, Ṭulayṭula, [Saraqusṭa](place:saraqusta) and al-Ushbūna, and he had taken Avignon from the Pope.\n\nThe court had called him the Conqueror since he was seventeen. It would be truer to call him the Builder. He moved the capital to [Ishbīliya](place:ishbiliyya) for its river and its market, and gave it a fleet, a chancery, banks, warehouses and jewellers. He gave the realm its four great offices, among them the Ḥisba to keep its weights honest. He built the mills and the forges and the workshops of the south, the acequias of the great river, the bridges of the north and the madrasas of the converts, eleven hammams from [al-Mariyya](place:al-mariyya) to Baṭalyaws, and the new heart of al-Andalus at Majrīṭ. He had the counts' books audited every year, paid the estates every dirham he owed them before he would march or go on pilgrimage, and would not change the law of succession even for the grandson he loved. When the clerks of the dīwān wrote up his reign, the words they chose were that his strong character had made the country a more honest place.\n\nA death answers many questions. The one he had left open answered itself. The crown passed by the law he had kept to his son [Ismāʿīl](person:ismail-ibn-saad), thirty-eight years old, with [Bernarda](person:bernarda-of-murcia) of Mursiyya beside him, and the heir was now Ismāʿīl's eldest, [Muḥammad](person:muhammad-ibn-ismail-ibn-saad), nineteen, slow still, but married and the father of three. The boy the old Emperor had hoped for, Ismāʿīl's second son [Saʿd](person:saad-ibn-ismail-ibn-saad), was twelve and doing all his teachers asked. Prince [Yūsuf](person:yusuf-ibn-saad) took his brother's old seat in the dīwān, and his son, the other [Saʿd](person:saad-ibn-yusuf-ibn-saad), went on with the costly education of the heirs, as gifted as ever. Whether the law would be changed was now for Ismāʿīl to decide, and Ismāʿīl had always been better at saying what men wished to hear than at telling them what he meant.\n\nHe took up his father's war at once. The army went on from Moya, and on 16 Ramaḍān the self-styled king of Toledo threw five thousand men against it before Qūnka. More than three thousand of them fell. The new Emperor lost three hundred. It was his first battle as Emperor, and it was won by a man the court had never thought of as a soldier.\n\n*Everyone upon the earth will perish, and there will remain the Face of your Lord, Owner of Majesty and Honour.*"}, {"addr": "808-03-06", "slug": "0808-03-06-of-granadilla-the-end-of-the-risings-and-al-gharb", "n": 75, "bn": 17, "hy": 808, "hm": 3, "hd": 6, "w": 1405, "title": "Of Granadilla, the End of the Risings, and al-Gharb", "date": "1405-09-01", "dateStr": "1 September 1405", "hdateStr": "6 Rabīʿ al-Awwal 808", "book": "book-of-the-marches", "people": ["ismail-ibn-saad", "khalid-ibn-yahya", "saad-ibn-ismail"], "places": ["qunka", "shalamanka", "al-ushbuna", "majrit", "shantarin", "yabura", "ukshunuba", "shilb", "baja", "ishbiliyya"], "sources": ["1405-01-28-battle-buitrago", "1405-03-18-battle-cuenca", "1405-07-02-battle-granadilla", "1405-07-08-ciudad-rodrigo-crushed", "1405-07-10-battle-cuenca-ii", "1405-08-05-battle-lisbon", "1405-08-24-the-risings-crushed", "1405-09-01-al-gharb-annexed", "1395-08-05-diwan-al-insha"], "words": 595, "catch": "The new Emperor Ismāʿīl inherited three rebel kingdoms and an army", "canon": 3, "body": "The new Emperor [Ismāʿīl](person:ismail-ibn-saad) inherited three rebel kingdoms and an army on the march. He had never been thought a soldier, and he did not pretend to be one. He set himself one task, to end the risings before the year was out, and gave every order in the dīwān to that end. The court, which had heard him called a man who told everyone what they wished to hear, now heard him tell the treasurers what the war would cost, and the generals what he expected of them, and both found he meant it.\n\nThe rebels of Toledo had shown what they were in Rajab, when nearly five thousand of them fell on the hundred and twenty men of the Ṭāʾifa of [Qūnka](place:qunka) at Buitrago in the Guadarrama and killed them all. In Ramaḍān the Emperor had broken their army before Qūnka. Now he turned first to the west, where the Leonese of Shalamanka had set up their lordship at Ciudad Rodrigo. He gave that war to [Khālid ibn Yaḥyā Raḥḥū](person:khalid-ibn-yahya), sixty-two years old, who had beaten the Marīnids in his youth and walked the hills with the prospectors in his age. Khālid gathered the crown's army and the hosts of Arghūn and Catalonia, more than twenty thousand men, and on 4 Muḥarram 808 he found the rebels at Granadilla, three thousand levies with no hope of standing against him. More than half of them fell. Six days later, on the day of ʿĀshūrāʾ, the lordship of Ciudad Rodrigo was gone, and its sixteen towns, [Shalamanka](place:shalamanka), Ávila and Ciudad Rodrigo among them, went back to the Emperor's cousin [Saʿd ibn Ismāʿīl](person:saad-ibn-ismail).\n\nOn 12 Muḥarram the Emperor came before Qūnka a second time, where what was left of the army of Toledo had gathered again, and he destroyed it: twelve hundred of theirs dead or taken, and fewer than a hundred of ours. In the west the rebels of Estremadura had been sitting before [al-Ushbūna](place:al-ushbuna) since the winter. On 8 Ṣafar they tried to take it by storm and met the army of the Ṭāʾifa of al-Gharb under the walls. The men of al-Gharb spoke Portuguese and prayed as Muslims, and they threw the Portuguese Christians back from the city with half their number dead.\n\nOn 27 Ṣafar 808 the Kingdom of Toledo and the Kingdom of Estremadura came to an end together. Their forty-eight towns, from [Majrīṭ](place:majrit) and Alcalá to Ciudad Real and Albacete, and from [Shantarīn](place:shantarin) on the Tagus to [Yābura](place:yabura) and Elvas, came back to the crown. The risings of 807 had lasted eight months. The Emperor's father had died marching against them, and his son had finished them in under six.\n\nAl-Gharb had earned its reward, and the Emperor gave it in his own way. The ṭāʾifa had served the crown since the peace of 767: thirteen towns from [Ukshūnuba](place:ukshunuba), [Shilb](place:shilb), Lagos and Tavira on the coast to [Bāja](place:baja), Mértola and Serpa in the Alentejo, a hundred and thirty-seven thousand people who spoke the tongue of Portugal and had nearly all come to Islam. The secretaries of the Dīwān al-Inshāʾ wrote to its court, and wrote again, and on 6 Rabīʿ al-Awwal 808 al-Gharb was taken into the crown without a sword drawn. What his father had won with armies, the court said, Ismāʿīl gathered in with letters. The crown held a hundred and sixty-one towns of its own, with five ṭāʾifas beside it.\n\n*And obey Allāh and His Messenger, and do not dispute, lest you lose courage and your strength depart, and be patient. Indeed, Allāh is with the patient.*"}, {"addr": "811-03-12", "slug": "0811-03-12-of-the-old-capital-and-the-sons-of-muhammad", "n": 76, "bn": 12, "hy": 811, "hm": 3, "hd": 12, "w": 1408, "title": "Of the Old Capital, the Shaykha of Qūnka, and the Sons of Muḥammad", "date": "1408-08-05", "dateStr": "5 August 1408", "hdateStr": "12 Rabīʿ al-Awwal 811", "book": "book-of-the-call", "people": ["ismail-ibn-saad", "umm-al-fath-bint-saad", "muhammad-ibn-yusuf-ibn-faraj", "yusuf-ibn-saad", "saad-ibn-faraj", "maryam-bint-saad-ibn-faraj", "saad-ibn-ismail-ibn-saad", "ismail-ibn-yusuf", "muhammad-ibn-ismail-ibn-saad", "magdalena-de-borja", "isabel-de-montsoriu", "fatima-bint-yusuf", "ismail-ibn-muhammad-ibn-ismail", "ahmad-ibn-muhammad-ibn-ismail"], "places": ["qurtuba", "ishbiliyya", "qunka"], "sources": ["1405-08-24-the-risings-crushed", "1408-02-20-death-of-saad-ibn-faraj", "1408-03-01-capital-of-the-old-caliphate", "1408-05-27-death-of-ismail-ibn-yusuf", "1408-08-05-the-sons-of-muhammad"], "words": 636, "catch": "After the risings the Emperor Ismāʿīl gave the dīwān to the", "canon": 3, "body": "After the risings the Emperor [Ismāʿīl](person:ismail-ibn-saad) gave the dīwān to the work of binding the north. His half-sister [Umm al-Fatḥ](person:umm-al-fath-bint-saad) and his nephew [Muḥammad ibn Yūsuf](person:muhammad-ibn-yusuf-ibn-faraj), a grandson of the old Emperor through his mother, were set to governing the lands that had risen, and his brother [Yūsuf](person:yusuf-ibn-saad) to drawing Andalusī settlers north to them. In those years the qāḍīs began to say a thing they had not expected to say of him. Whatever the Emperor told men in private, and he told each of them what he wished to hear, his judgments in public were fair, and no one who brought a case before him could say it had been decided by favour.\n\nOn 22 Ramaḍān 810 [Saʿd ibn Faraj](person:saad-ibn-faraj), lord of the Ṭāʾifa of [Qūnka](place:qunka) since the year of the two ṭāʾifas, died at forty-nine. His heir was his daughter [Maryam](person:maryam-bint-saad-ibn-faraj), seventeen years old, the Emperor's niece through her mother Umm al-Fatḥ, and already the wife of the Emperor's second son [Saʿd](person:saad-ibn-ismail-ibn-saad). So the Shaykha of Qūnka was a Naṣrid on both sides, and the frontier ṭāʾifa that had first faced the rebels of Toledo passed to a girl who had grown up in the Emperor's own house.\n\nTen days later, on the morrow of the feast of the breaking of the fast, the Emperor took up the question of [Qurṭuba](place:qurtuba). The city of the caliphs had come back to Islam sixty years before, and still it had not recovered. Its streets were full of thieves, its people cursed the decay that had come over it, and half its old buildings stood in ruins from the wars with the Christians. The old men of the court, and the ʿulamāʾ with them, wanted the court moved there, so that al-Andalus would be governed again from the seat of ʿAbd al-Raḥmān. The Emperor heard them out and gave them half of what they asked. Qurṭuba would be the Capital of the Old Caliphate, with the dignity of the name and the money and labour to rebuild it, for as long as the empire stood. But the court would stay at [Ishbīliya](place:ishbiliyya), on its river and its market, where his father had brought it. The ʿulamāʾ went away content with the name, the merchants with the court, and Ishbīliya grew richer that year than it had ever been.\n\nOn the first day of Muḥarram 811 the old Emperor's brother [Ismāʿīl ibn Yūsuf](person:ismail-ibn-yusuf) died at fifty-four. He had sat in the dīwān for twenty-three years, from the revolt of Ṭulayṭula until the end of the risings, and he was the last of the sons of Yūsuf I.\n\nBy the summer of 811 the question that had troubled the old Emperor's last years had settled itself. The heir [Muḥammad](person:muhammad-ibn-ismail-ibn-saad) was twenty-two. He was still slow, but he had done one thing well: he had married two daughters of the ṭāʾifa houses, [Magdalena](person:magdalena-de-borja) of the Borja of Arghūn and [Isabel](person:isabel-de-montsoriu) of the Montsoriu of Catalonia, whose mother was [Fāṭima](person:fatima-bint-yusuf), daughter of Yūsuf I. They had given him five children. The two eldest were boys of five: [Ismāʿīl](person:ismail-ibn-muhammad-ibn-ismail), Magdalena's son, born in Rabīʿ al-Awwal 805, and [Aḥmad](person:ahmad-ibn-muhammad-ibn-ismail), Isabel's, born in Dhū al-Qaʿda of the same year. Their tutors had not yet been chosen, but those who had seen them said both were gifted. If the Emperor reigned long, the crown would pass to Muḥammad and through him to boys worthy of it, and no one would need to change the law of the house to make it so.\n\nHis brother Saʿd was not forgotten. He was sixteen, the ablest of the Emperor's sons, and married to the Shaykha of Qūnka. The crown would not be his, but the frontier would be his children's.\n\n*And those who believed and whose descendants followed them in faith, We will join with them their descendants.*"}, {"addr": "814-07-14", "slug": "0814-07-14-of-cuellar-porto-and-the-end-of-portugal", "n": 77, "bn": 18, "hy": 814, "hm": 7, "hd": 14, "w": 1411, "title": "Of the War of Jillīqiya, the Gates of Porto, and the Peace of Rajab", "date": "1411-11-01", "dateStr": "1 November 1411", "hdateStr": "14 Rajab 814", "book": "book-of-the-marches", "people": ["ismail-ibn-saad", "muhammad-ibn-ismail-ibn-saad", "pedro-of-castile", "fernando-of-castile", "abu-al-fadl-marinid", "ahmad-ibn-ismail-ibn-yusuf", "ahmad-ibn-ismail-ibn-saad", "yusuf-ibn-ismail", "khalid-ibn-yahya"], "places": ["ishbiliyya", "al-ushbuna", "qunka", "fas", "banbaluna"], "sources": ["1410-06-29-war-on-castile", "1410-09-16-battle-cape-mondego", "1410-10-09-battle-penafiel", "1410-12-11-battle-cuellar", "1411-01-13-battle-cuellar-ii", "1411-03-10-battle-bay-setubal", "1411-05-15-battle-toro", "1411-06-21-battle-mouth-douro-ii", "1411-08-28-battle-besteiros", "1411-09-02-castile-capitulates", "1411-09-the-march-on-porto", "1411-10-07-porto-falls", "1411-10-27-battle-guimaraes", "1411-11-01-the-end-of-portugal", "1411-11-01-four-new-taifas", "1411-11-01-europe-horrified"], "words": 1139, "catch": "The truce of the Peace of Ramaḍān ran out on 25", "canon": 3, "body": "The truce of the Peace of Ramaḍān ran out on 25 Ṣafar 813, and the Emperor [Ismāʿīl](person:ismail-ibn-saad) declared war on Qashtāla the same day. It was the fourth war of the Istirdād, and the Emperor named it himself, in letters the Dīwān al-Inshāʾ carried to every court from Fās to Paris. He did not call it a war for towns. He called it the War of Jillīqiya, by the name the first Arabs had given to the whole Christian country beyond the Duero. Mūsā ibn Nuṣayr had ridden into Jillīqiya in the first years of al-Andalus, he wrote, and al-Manṣūr had marched across it to Shant Yāqub and carried the bells of its church back to Qurṭuba to hang as lamps in the Great Mosque. What they had begun, the house of Naṣr would finish. The ʿulamāʾ read the letters aloud in the mosques. Portugal stood with Qashtāla, as it always had. The sultan [Abū al-Faḍl](person:abu-al-fadl-marinid) of [Fās](place:fas) sent his armies and his fleet, with the men of Tilimsān and Tafilalt. The Mamlūks were busy putting the Fertile Crescent in order, and the Emperor did not ask them to leave it.\n\nThe war began badly. Off Cape Mondego the Castilian admiral Pedro, a seaman of real skill, sent the whole fleet of Tilimsān to the bottom without losing a ship. At Peñafiel the little army of [Qūnka](place:qunka) threw itself on the Castilian host and was destroyed. And in Shaʿbān the Castilian general Crisanto, a careful man who never fought on ground he had not chosen, broke the Catalan army at Cuéllar, south of the Duero.\n\nThe Emperor had never been taken for a soldier, and he knew it. He was a man who set himself one aim and gave every order to it, and his aim that winter was Crisanto. He took the army north himself and found the Castilians on the same field at Cuéllar. He attacked on 17 Ramaḍān 813, the anniversary of Badr, with twenty-five thousand Andalusīs and Marīnids against nineteen thousand. It was the hardest day of his life. Nearly ten thousand of ours fell, and more than eight thousand of theirs. At nightfall the field was his, and the preachers of [Ishbīliya](place:ishbiliyya) had their sermon for the next Friday.\n\nThe sea turned next. In Dhū al-Qaʿda the admiral Pedro tried his luck once more, with fourteen ships against the joined fleets of al-Andalus and Fās, a hundred and seven sail under the Marīnid prince Aḥmad, in the bay of Setúbal below [al-Ushbūna](place:al-ushbuna). None of the fourteen came home. In Muḥarram 814 the Emperor met Crisanto a second time, at Toro outside Zamora, and broke him again. In Ṣafar the Portuguese fleet came out against thirty-four ships at the mouth of the Duero: eleven of Balansiyya under their own admiral, and twenty-three of al-Andalus under the crown prince [Muḥammad](person:muhammad-ibn-ismail-ibn-saad), in his first command. Fifteen Portuguese ships were sunk or taken, for three of ours. The prince had never shone in the dīwān, but on a deck he was another man, and he would talk of ships for the rest of his life. In Jumādā al-Ūlā the Emperor caught the Portuguese army at Besteiros and destroyed more than half of it.\n\nOn 13 Jumādā al-Ūlā 814 Qashtāla surrendered without conditions. Its armies were gone, and the Emperor's flags flew from Zamora to Shant Yāqub, as al-Manṣūr's had four hundred years before. Portugal fought on. The dīwān told the Emperor he could have a separate peace with it whenever he wished, and a province for the asking. He refused. He had not come for a province, and this war would be the end of Portugal. He marched on Porto, its capital, and sent the crown prince round with the fleet to close the river mouth behind it. Porto held out for a month. Then the grain ran out. On 18 Jumādā al-Ākhira the starving city rose against its own garrison, and the townsmen threw open the gates to the army.\n\nThe nobles of Portugal had one army left. In Rajab it came down from the hills to fall on a camp of Marīnid levies, and the Emperor caught it on the march at Guimarães, where their first king had been born. On 9 Rajab he fell on it with twice its number and broke it, and Portugal had no army left.\n\nFive days later, on 14 Rajab 814, the peace was signed. Rajab is one of the sacred months, in which the Prophet forbade war, and the court called it the Peace of Rajab and said it was fitting that this war should end in it. Portugal ceased to be. Its thirty-four towns, from Porto and Braga to Coimbra and Viseu, passed to the crown, and its king [Fernando](person:fernando-of-castile) went into exile at the court of the man who had dragged him into the war. Qashtāla gave up sixty-three towns, the whole of Old Castile, León and Navarre, from Valladolid and Burgos to Segovia, Soria and Pamplona. King [Pedro](person:pedro-of-castile) kept forty-five towns in the rain of the north, in Galicia, Asturias and the Basque hills, and moved his court to Oviedo. The Christians had always said their reconquest began in those mountains, when a Gothic lord held a cave against the first governors of al-Andalus. Seven hundred years later they had been driven back to the same mountains.\n\nOn the day of the peace the crown ruled two hundred and fifty-eight towns and nearly four million souls, three of every four of them Christians. It did not keep them long. The Emperor had learned from his father that Christians obey a lord who owes his crown to the Emperor more readily than a governor, and he gave out the conquests at once as four new ṭāʾifas. His cousin [Aḥmad](person:ahmad-ibn-ismail-ibn-yusuf) took the old kingdom of Portugal as the Ṭāʾifa of Burtuqāl, after the old name of Porto, Portucale, which the Arabs said as Burtuqāl and from which the Christians had named their kingdom. His own son [Aḥmad](person:ahmad-ibn-ismail-ibn-saad), eighteen, took León. His cousin [Yūsuf](person:yusuf-ibn-ismail) took Navarre, with [Banbalūna](place:banbaluna). And Old Castile, from Burgos to Valladolid and Segovia, went to [Khālid ibn Yaḥyā Raḥḥū](person:khalid-ibn-yahya), sixty-eight years old, the general of the Marīnid war, the captain of the prospectors and the victor of Granadilla, the first man outside the house of Naṣr to be given a ṭāʾifa. Europe was horrified, all but Paris, and the Emperor of the Germans could do nothing while France and England were at war again. The ʿulamāʾ said the Istirdād was not finished. Qashtāla still held the mountains of the north, and one more war would push it into the sea.\n\n*When the victory of Allāh has come and the conquest, and you see the people entering into the religion of Allāh in multitudes, then exalt with praise of your Lord and ask forgiveness of Him.*"}, {"addr": "815-03-14", "slug": "0815-03-14-of-the-captains-of-811-and-the-pepper-of-the-indies", "n": 78, "bn": 6, "hy": 815, "hm": 3, "hd": 14, "w": 1412, "title": "Of the Captains of 811, and the Pepper of the Indies", "date": "1412-06-24", "dateStr": "24 June 1412", "hdateStr": "14 Rabīʿ al-Awwal 815", "book": "book-of-the-encircling-sea", "people": ["ismail-ibn-saad"], "places": ["ishbiliyya", "al-ushbuna"], "sources": ["1408-10-11-expeditions", "1412-01-01-funchal", "1412-06-24-spice-trade", "1397-08-14-explorers-push-south"], "words": 515, "catch": "The old Emperor had sent his kinsmen to sea. His son", "canon": 3, "body": "The old Emperor had sent his kinsmen to sea. His son sent whoever would serve him best. In Jumādā al-Ūlā 811, while the dīwān was still busy with the lands of the north, four expeditions put to sea from the ports of [Ishbīliya](place:ishbiliyya) and the coast. One went south, to follow the coast of Africa further than any ship of al-Andalus had gone. One went to the islands that had been found off the western coast, beyond Mali. And two went to the islands the Christian sailors called the Canaries and Madeira, which the geographers called the Eternal Isles. A fifth captain was at sea already: ʿAbd al-Ghafūr, an Andalusī of the merchant class with a rare gift for talking to strangers, had been in the sea of the Azores since before the year began.\n\nThe captain who went south was a Sephardi named Daniel, who had come to Islam and kept the name he was born with. The Sephardim had been under the Emperor's protection since the year of Avignon, and the scribes recorded with some pride that the first of them to command a ship of the empire had sailed further from home than anyone. By 813 he was in the gulf below the bulge of Africa, where the coast turns east and the stars of the north sink into the sea.\n\nThe captain who went to the islands beyond Mali was stranger still. He was García of Ponte de Sor, a Portuguese noble and a Christian, who in 808 had led the rebels of Estremadura against the walls of [al-Ushbūna](place:al-ushbuna) and been thrown back. Three years later he sailed under the Emperor's flag. The Emperor [Ismāʿīl](person:ismail-ibn-saad) had a way of turning men, and he never explained to the dīwān how he had turned this one. By 813 García was off the islands of the Green Cape, charting their harbours.\n\nThe voyages to the islands did more than chart them. On the first day of 1412 by the Christian reckoning, Funchal on Madeira became a town of the crown, the first the empire had ever held beyond the sea: eighteen hundred souls, peasants and slaves, who spoke Castilian and prayed as Muslims.\n\nIn Rabīʿ al-Awwal 815 news reached Ishbīliya that changed the worth of everything the captains were doing. A sea road to the Indies had been found. For as long as anyone remembered, the pepper and cinnamon of the East had come overland, through the hands of the Mamlūks and the Venetians, and every hand had taken its share. Now there was another way. The price of spices rose in every market of the West, and seven markets became the ports of the new trade: Genoa, Constantinople, Barcelona, Bordeaux, Naples, and two of the Emperor's own, Ishbīliya and al-Ushbūna. The merchants of the capital said the Emperor's father had moved the court to the river for exactly this day, and that he had only been thirty years early.\n\n*Do you not see that the ships sail through the sea by the favour of Allāh, that He may show you of His signs?*"}, {"addr": "816-01-29", "slug": "0816-01-29-of-the-madrasas-of-815", "n": 79, "bn": 13, "hy": 816, "hm": 1, "hd": 29, "w": 1413, "title": "Of the Madrasas of 815, and the Children of the House", "date": "1413-05-01", "dateStr": "1 May 1413", "hdateStr": "29 Muḥarram 816", "book": "book-of-the-call", "people": ["ismail-ibn-saad", "saad-ibn-yusuf", "fatima-bint-yusuf", "isabel-de-montsoriu", "saad-ibn-ismail-ibn-saad", "maryam-bint-saad-ibn-faraj", "abu-al-hasan-ali-ibn-saad"], "places": ["qunka", "al-ushbuna", "shantarin"], "sources": ["1409-09-18-death-of-fatima", "1410-04-17-birth-of-abu-al-hasan-ali", "1411-11-01-the-end-of-portugal", "1413-01-14-madrasas-everywhere", "1413-05-01-education-of-the-people", "1397-08-14-infrastructure"], "words": 524, "catch": "In Jumādā al-Ūlā 812 the house of Naṣr lost Fāṭima, the", "canon": 3, "body": "In Jumādā al-Ūlā 812 the house of Naṣr lost [Fāṭima](person:fatima-bint-yusuf), the daughter of Yūsuf I who had married into the Catalan house of Montsoriu. She had been given to Francesc de Montsoriu in the year of the Restoration, when the Ṭāʾifa of Catalonia was made, and she left behind a son who ruled Catalonia, a daughter married to the lord of Shalamanka, and another, [Isabel](person:isabel-de-montsoriu), who was the wife of the heir. So the blood of Yūsuf I ran in three of the ṭāʾifas and in the crown itself. In Dhū al-Ḥijja of the same year a son was born to the Emperor's son [Saʿd](person:saad-ibn-ismail-ibn-saad) and the Shaykha [Maryam](person:maryam-bint-saad-ibn-faraj) of [Qūnka](place:qunka). They named him [Abū al-Ḥasan ʿAlī](person:abu-al-hasan-ali-ibn-saad), and the frontier had its first heir of the new line.\n\nThe Peace of Rajab had filled the treasury and emptied the kingdom of Portugal, and it left the Emperor [Ismāʿīl](person:ismail-ibn-saad) ruling more Christians than any Muslim prince since the conquest. His father had answered the north with madrasas at [al-Ushbūna](place:al-ushbuna) and [Shantarīn](place:shantarin) and a handful of other towns. Ismāʿīl meant to answer it everywhere. On 11 Shawwāl 815, ten days after the feast at the end of Ramaḍān, he ordered a madrasa built in every town and city of the empire, and he did not stop at the crown's own lands. The ṭāʾifas were to have them too, from Burtuqāl to Banbalūna, and the gold taken from Qashtāla would pay for them.\n\nThe ʿulamāʾ had never been given so much at once, and they said so from every minbar. The lords of the ṭāʾifas were less pleased to find the Emperor's teachers in their towns, but none of them could refuse a gift paid for by the Emperor's own treasury. In the dīwān the Emperor gave his reasons in the plain way he kept for matters he meant to see done. A conquered town that has a garrison obeys while the garrison is there, he said. A town that has a madrasa will obey after the garrison has gone, and its children will not need to be conquered at all.\n\nHis second order came on 29 Muḥarram 816, and he made it in honour of his father. The Emperor [Saʿd](person:saad-ibn-yusuf) had sent the costliest tutors in the Islamic world to his sons and paid the estates every dirham he owed them, and the clerks had written of him that he left the country a more honest place. Ismāʿīl now gave his father's realm a law of the Education of the People. Its preamble said that knowledge was the right of every subject, and that all men are born with free will and free thought, which the state must protect. The burgher, the peasant, the labourer and the soldier were all to have their chance at letters. The umarāʾ grumbled that a ploughman who could read would soon stop ploughing. The ʿulamāʾ, who had just been given a madrasa in every town, grumbled that the law spoke of free thought and not of faith. The Emperor told them both that his father would have signed it, and signed it.\n\n*And say: My Lord, increase me in knowledge.*"}, {"addr": "817-08-09", "slug": "0817-08-09-of-the-jamaa-of-817-and-the-landlords-of-the-north", "n": 80, "bn": 19, "hy": 817, "hm": 8, "hd": 9, "w": 1414, "title": "Of the Jamāʿa of 817, and the Landlords of the North", "date": "1414-10-24", "dateStr": "24 October 1414", "hdateStr": "9 Shaʿbān 817", "book": "book-of-the-marches", "people": ["ismail-ibn-saad", "saad-ibn-yusuf"], "places": ["banbaluna", "ishbiliyya", "qurtuba"], "sources": ["1410-09-01-catalan-privileges-return", "1414-10-24-rising-at-pamplona", "1414-10-24-jamaa-of-the-mercenaries", "1414-10-24-the-umara-mutinous", "1402-08-the-umara", "1402-09-jamaa-of-the-markets"], "words": 790, "catch": "In Shaʿbān 817 a handful of malcontents rose at Banbalūna and", "canon": 3, "body": "In Shaʿbān 817 a handful of malcontents rose at [Banbalūna](place:banbaluna) and were put down before the news of their rising had crossed the Ebro. It was nothing, and the Emperor [Ismāʿīl](person:ismail-ibn-saad) made a great deal of it. He told the dīwān that the north was restless, that the empire's armies must be ready to march at a word, and that the old ways of raising them would not serve. He called a Jamāʿa at [Ishbīliya](place:ishbiliyya) for 9 Shaʿbān.\n\nFor a generation the hiring of foreign soldiers had been the business of the umarāʾ. The great families signed the contracts, paid the captains and kept the companies, and every mercenary in the empire's service owed his wages, and so his loyalty, to some lord of the Andalusī houses before he owed it to the crown. The Emperor [Saʿd](person:saad-ibn-yusuf) had seen the danger in that, and from the year 805 the dīwān's policy had been to break the power of the umarāʾ now that the state was built. Ismāʿīl now laid before the Jamāʿa a law to take the contracts away from them, and with it several smaller reforms, each of which took a little more. He had an old ally in it. In Jumādā al-Ūlā 813 the Catalan merchant privileges had come back into force, sixty-four years after the war of the three crowns had ended them. They had always been the first thing lost whenever al-Andalus went to war with the Catalans, and they had always weakened the great lords in favour of the crown. Now Catalonia, Arghūn and Balansiyya were all ṭāʾifas of the Emperor, there could be no more wars with the Catalans, and the privileges were the crown's for good.\n\nHe did not present it as a loss. He came to the assembly with the banners of Cuéllar and Toro carried before him and the keys of Porto on a cushion, and he spoke of the north. The empire had won more land in the War of Jillīqiya than the house of Naṣr had held when he was born, he said, and it needed men of good family to settle it. He offered dozens of the noble houses estates in the conquered lands, and to others he offered claims on lands Qashtāla still held, to be theirs when the next war was won. The umarāʾ had been grumbling for twelve years. Now they went home talking of the castles they would build in León and the vineyards they would have on the Ebro, and they voted for the law.\n\nIt was some time before they read the grants closely. The lands were theirs to live on and to draw rents from, but the grants gave them no courts, no levies and no lordship over the people who worked the land. They had become landlords, not lords. The conquests of Jillīqiya were still the property of the crown and the house of Naṣr, and the mercenaries now drew their pay from the Emperor's treasury. The court remembered that the Emperor's tutors had once said he could tell every man what he wished to hear, and the umarāʾ, who had heard exactly what they wished, had only themselves to blame.\n\nWhen they understood, the umarāʾ came very near to rising. Not one great house in ten was content with the crown, and the peace of the realm was more shaken than it had been since the risings of 807. The Emperor had expected it. He had dressed the law in the oldest authority al-Andalus knew. The Umayyads, he reminded the dīwān, had divided the land into kūras, each under a governor named and recalled by [Qurṭuba](place:qurtuba), with the tax registers and the qāḍīs answering to the capital and not to the governor. That was the order of the caliphs, and he was only restoring it. To the younger men of the chancery he spoke of a newer idea, that a sovereign stands above every estate and bows to no earthly power. The old families heard the first argument and the young secretaries the second, and he meant both to be heard.\n\nThen he set about cooling tempers. He sent the angriest lords north to the ṭāʾifas, where kinsmen of the house of Naṣr sat on most of the thrones and could give them honours, wives and offices that cost the crown nothing. He wrote to each great house himself, in the style the Dīwān al-Inshāʾ had taught a generation of secretaries, and to each he said something a little different. In the dīwān a law to curtail the nobles was passed with little noise while the letters were still on the road.\n\n*We raise in degrees whom We will, and over every possessor of knowledge is one more knowing.*"}, {"addr": "822-08-10", "slug": "0822-08-10-of-the-universities-the-letter-from-denia-and-the-road-to-balansiyya", "n": 81, "bn": 14, "hy": 822, "hm": 8, "hd": 10, "w": 1419, "title": "Of the Universities, the Letter from Denia, and the Road to Balansiyya", "date": "1419-09-01", "dateStr": "1 September 1419", "hdateStr": "10 Shaʿbān 822", "book": "book-of-the-call", "people": ["ismail-ibn-saad", "saad-ibn-yusuf"], "places": ["ishbiliyya", "qurtuba", "gharnata", "tulaytula", "malaqa", "daniya", "balansiyya"], "sources": ["1416-05-20-the-first-universities", "1419-04-01-the-letter-from-denia", "1419-04-the-catalans-and-valencia", "1419-09-the-road-to-balansiyya", "1413-01-14-madrasas-everywhere", "1413-05-01-education-of-the-people"], "words": 699, "catch": "The madrasas of 815 taught the children of the towns their", "canon": 3, "body": "The madrasas of 815 taught the children of the towns their letters. Three years later the Emperor [Ismāʿīl](person:ismail-ibn-saad) wanted something above them. On 22 Rabīʿ al-Awwal 819 the first universities of al-Andalus opened their doors, five of them at once: at [Ishbīliya](place:ishbiliyya), where the court sat; at [Qurṭuba](place:qurtuba), the old capital of the caliphs; at [Gharnāṭa](place:gharnata), where the house of Naṣr began; at [Ṭulayṭula](place:tulaytula), the city of the translators; and at [Mālaqa](place:malaqa), the port. The Emperor's charters gave each of them the same instruction. They were to teach law and grammar, as the mosques always had, but also medicine, astronomy, the measuring of the earth and the reckoning of accounts, and their doors were open to any subject of the empire who could pay or find a patron to pay for him. The umarāʾ asked what the sons of merchants would do with astronomy. The Emperor said they would find their way to the Indies with it, and that the umarāʾ's sons were welcome to come and learn it too.\n\nThe new scholars soon found an old quarrel waiting for them. In Rabīʿ al-Awwal 822 a letter more than three hundred years old began to pass from hand to hand among the secretaries of the dīwān. Its author was Ibn Gharsiya, a Basque Christian who had been carried off as a child and raised a Muslim at the court of [Dāniya](place:daniya), in the age of the first ṭāʾifas. He had written it against the old Arab families who sneered at men like him. The Arabs, he wrote, were masters at describing camels. Philosophy, astronomy and the measuring of the earth had belonged to the peoples they conquered long before the Arabs came, and those peoples still knew them better. In his own day the letter had caused a scandal. Now the secretaries read it aloud to each other and laughed, because half of them were the grandsons of converts themselves. The Berbers had carried the conquest of al-Andalus, the Slavs had commanded the guard of the caliphs, and the sons of converted natives had filled the chanceries, and still the old houses counted a man's descent before they counted his learning.\n\nThe Emperor heard of it and asked for the letter. When he had read it he gave the dīwān his answer in four words that the secretaries copied into the margins of their own copies: a man is what he knows. He sent invitations to scholars of every nation to come to the new universities, and the old Arab families had to accept Berbers, converts and the sons of Christians in office beside them. The court said the Emperor had put it more shortly than Ibn Gharsiya, and had not needed to insult anyone's camels to do it.\n\nThe answer had a purpose nearer home. The integration of [Balansiyya](place:balansiyya), a ṭāʾifa of the crown for eighty years, was nearly complete. Its people spoke Catalan and had nearly all come to Islam, and the dīwān meant them to stand at court as the Portuguese of al-Gharb and Burtuqāl already stood, as subjects whose tongue was no bar to office. The Castilians were not invited. They were the most numerous of the Emperor's subjects, and their king still sat at Oviedo, and the court left them out, when it noticed them at all.\n\nOn 10 Shaʿbān 822 the Emperor ordered a great road built from Ishbīliya to Balansiyya, over the mountains of the old kingdom of Murcia. When Balansiyya came into the crown a governor would sit there, and the road would carry the empire's orders to him, and his influence out into the Middle Sea, as fast as a rider could go. The dīwān noted a second purpose that no one put in the charter. In the crusade of 806 the Emperor's father [Saʿd](person:saad-ibn-yusuf) had marched over the Pyrenees to Avignon. A road that carried a governor's letters to the coast would carry an army to the French border just as fast, should a Pope ever preach another.\n\n*And of His signs is the creation of the heavens and the earth and the diversity of your languages and your colours. Indeed in that are signs for those of knowledge.*"}, {"addr": "823-07-21", "slug": "0823-07-21-of-daniel-the-green-cape-and-angra", "n": 82, "bn": 7, "hy": 823, "hm": 7, "hd": 21, "w": 1420, "title": "Of Daniel, the Green Cape, and Angra", "date": "1420-08-01", "dateStr": "1 August 1420", "hdateStr": "21 Rajab 823", "book": "book-of-the-encircling-sea", "people": ["ismail-ibn-saad"], "places": ["ishbiliyya"], "sources": ["1419-09-04-death-of-daniel", "1420-03-09-maps-of-cabo-verde", "1420-08-01-angra", "1415-04-01-maxorata", "1412-01-01-funchal", "1408-10-11-expeditions"], "words": 412, "catch": "On 13 Shaʿbān 822 Daniel died, at fifty. He was the", "canon": 3, "body": "On 13 Shaʿbān 822 Daniel died, at fifty. He was the Sephardi who had come to Islam and kept the name he was born with, the first of his people to command a ship of the empire, and in the years after 811 he had taken it further south than any captain of al-Andalus had gone, into the gulf below the bulge of Africa where the coast turns east. He died of a fever at Sanlúcar, where the river of [Ishbīliya](place:ishbiliyya) meets the sea, and the sailors said it was more than most captains who had seen the gulf could hope for, to die in sight of home.\n\nThe voyages he had begun went on without him. On 23 Ṣafar 823 the captains of the Green Cape came home with charts of the islands that lie off the westernmost point of Africa, beyond the country of Mālī: their harbours, their springs and the winds that reach them. There was no one on them. Within the month a fleet of settlers sailed for the islands with tools, seed and livestock, to found the first town of the empire in the southern sea. The dīwān's instructions to them were longer than any it had given before. The islands were not to be a fishing post like the others but a land of their own one day, with its own governor and its own people.\n\nThe other islands were filling meanwhile. Funchal on Madeira had been a town of the crown since 814, and Maxorata in the Canaries since 818, where the Guanche islanders lived under the Emperor's protection and kept their own gods. On 21 Rajab 823, the same day Balansiyya came into the crown, the settlers of the Azores founded their first town, Angra, on the island of Terceira, thirty months after they had landed. It had a thousand people. Most were Portuguese, Castilian and Leonese peasants from the north, Christians who had taken the Emperor's offer of land in the middle of the Ocean, and they named their church before they had finished their houses. The dīwān did not object. The Emperor said that every town he founded in the Ocean was a town the king of Qashtāla would never found there, and that the faith of its farmers could wait for the madrasa.\n\n*Your Lord is the one who drives the ship for you through the sea that you may seek of His bounty. Indeed, He is ever Merciful to you.*"}, {"addr": "823-08-01a", "slug": "0823-08-01-of-the-household-of-the-emperor-balansiyya-and-fermoselle", "n": 83, "bn": 20, "hy": 823, "hm": 8, "hd": 1, "w": 1420, "title": "Of the Household of the Emperor, Balansiyya, and Fermoselle", "date": "1420-08-11", "dateStr": "11 August 1420", "hdateStr": "1 Shaʿbān 823", "book": "book-of-the-marches", "people": ["ismail-ibn-saad", "umm-al-fath-bint-saad", "umm-al-fath-bint-yusuf", "jadila-bint-saad-ibn-faraj", "yusuf-ibn-saad", "saad-ibn-yusuf-ibn-saad", "ahmad-ibn-yusuf-ibn-ismail", "ahmad-ibn-ismail-ibn-saad", "abu-hammu-rahhu", "jadila-bint-yusuf", "aisha-bint-yusuf", "muhammad-ibn-ismail-ibn-saad", "ismail-ibn-muhammad-ibn-ismail", "ahmad-ibn-muhammad-ibn-ismail", "eduardo-de-avellaneda"], "places": ["ishbiliyya", "shalamanka", "balansiyya", "daniya", "shatiba", "al-qant"], "sources": ["1416-03-25-death-of-umm-al-fath", "1416-09-29-jadila-steadies-the-realm", "1416-10-23-autocracy", "1416-11-18-shalamanka-handed-north", "1416-12-27-death-of-jadila-bint-yusuf", "1417-12-15-saad-ibn-yusuf-to-the-diwan", "1419-08-29-death-of-aisha-bint-yusuf", "1420-06-01-rising-of-zamora", "1420-08-01-valencia-annexed", "1420-08-10-battle-fermoselle", "1420-08-11-rising-crushed"], "words": 933, "catch": "On 25 Muḥarram 819 Umm al-Fatḥ, the old Emperor's first child,", "canon": 3, "body": "On 25 Muḥarram 819 [Umm al-Fatḥ](person:umm-al-fath-bint-saad), the old Emperor's first child, died at fifty-one. She had sat in the dīwān for twenty-two years, from the year of the League, and for most of them she had done one thing: she took lands the armies had won and made them part of the empire, from the valley of the Tagus to the country of the risings. Her seat stood empty for most of two years. Her daughter [Jadīla](person:jadila-bint-saad-ibn-faraj), the heir's third wife, sat in the dīwān already, and in Shaʿbān the Emperor took her off the settling of migrants and gave her the hardest task he had, to keep the realm at peace. The umarāʾ were still sore from the Jamāʿa of 817, and Prince [Yūsuf](person:yusuf-ibn-saad) was still at work soothing them.\n\nOn the first day of Ramaḍān 819 the Emperor [Ismāʿīl](person:ismail-ibn-saad) told the dīwān how the empire would be governed from then on. The state was the Emperor's, and those who served it served him. The viziers and the governors were members of his household, as the slaves of the palace and the eunuchs of the harem were, and they would answer to him as his household answered, without appeal to any estate. The ʿulamāʾ looked for a precedent and found one in the caliphs of Qurṭuba, who had governed through the men of the palace and not through the great families. The umarāʾ looked for a way to object and found none. They had already given up their mercenaries and their lordships, and they had nothing left to give up but their pride.\n\nHe used his new hand at once. On 27 Ramaḍān, the night the faithful keep as the Night of Power, sixteen of the twenty-one towns of the old Ṭāʾifa of [Shalamanka](place:shalamanka) were given away. The crown had taken them in a year and a half before, when the ṭāʾifa's lord died, and the Emperor had never wanted them. Shalamanka itself, Ciudad Rodrigo, Ledesma, Béjar and Coria and five more went to his son [Aḥmad](person:ahmad-ibn-ismail-ibn-saad) in Liyūn, and Ávila, Arévalo, Oropesa and three more went to [Abū Ḥammū](person:abu-hammu-rahhu) in Burghush. The rule his father had begun was now the rule of the empire. The north, where the Christians were many and the Muslims few, would be held through lords who owed their thrones to the Emperor, and the lands south of it would be the crown's. [Aḥmad ibn Yūsuf](person:ahmad-ibn-yusuf-ibn-ismail) of the dīwān was given new lands to integrate that same day, and in Dhū al-Qaʿda 820 the Emperor's nephew [Saʿd ibn Yūsuf](person:saad-ibn-yusuf-ibn-saad), raised at his court since the age of four, took Umm al-Fatḥ's seat.\n\nThe generation of Yūsuf I passed in those years. [Jadīla](person:jadila-bint-yusuf), his daughter, queen of the Marīnids for thirty-five years, died in Dhū al-Qaʿda 819, three months before her husband. [ʿĀʾisha](person:aisha-bint-yusuf) died in Shaʿbān 822, and of all his children only [Umm al-Fatḥ](person:umm-al-fath-bint-yusuf), the youngest, was left. The court mourned them as the last of the sultanate, the realm of the old Alhambra that had paid tribute to Qashtāla. The empire that buried them stretched from Porto to Barshalūna.\n\nThe next generation had grown up meanwhile. The heir [Muḥammad](person:muhammad-ibn-ismail-ibn-saad) was thirty-four and no better a governor than he had been at seventeen, and the clerks of the treasury now complained that he squeezed his own estates for every dirham they had. But his sons were men. [Ismāʿīl](person:ismail-ibn-muhammad-ibn-ismail) and [Aḥmad](person:ahmad-ibn-muhammad-ibn-ismail), born eight months apart, had come out of their tutors' hands as able as anyone in the house, and the younger, Isabel's son, was better at every art than the elder. No one at court said aloud that the crown would pass from a strong man through a weak one to a strong one again. Everyone had worked it out.\n\nOn 21 Rajab 823 [Balansiyya](place:balansiyya) came into the crown. It had been a ṭāʾifa since Ṣafar 741, when the young Yūsuf I had won it from Arghūn and given it to Joan d'Oriola to hold for him: seventeen towns, from Balansiyya itself, [Shāṭiba](place:shatiba) and [Dāniya](place:daniya) to [al-Qant](place:al-qant), Elche and Orihuela, and two hundred and twenty thousand people, Catalan in speech and Muslim in faith. Its last lord, Melchior, of Joan d'Oriola's house, went to the court of Catalonia with his family and his household. No one in Balansiyya had been asked, and no one in Balansiyya complained. The Emperor's letters had been preparing them for three years, and the governor who would sit in the city had a university and a great road waiting for him.\n\nThe Emperor did not stay for the ceremony. On 19 Jumādā al-Ūlā the Castilians of Zamora had risen against his son in Liyūn, under a lord named [Eduardo de Avellaneda](person:eduardo-de-avellaneda), and proclaimed a kingdom of their own. It was a kingdom of a few hundred men. The Emperor was fifty-four and had not commanded an army since the War of Jillīqiya, and he took the whole standing army of the empire north himself, four thousand nine hundred men, and found the rebels at Fermoselle above the gorges of the Duero. On 30 Rajab he destroyed them, all three hundred and seventy, and lost no one. The next day was the first of Shaʿbān, the rising was over, and the Emperor's letters to the ṭāʾifas of the north had already gone out. A lord who could not keep his own towns quiet, they said, would find the Emperor there to keep them for him, and the Emperor never left a town quite as he had found it.\n\n*Blessed is He in whose hand is dominion, and He is over all things competent.*"}, {"addr": "823-08-01b", "slug": "0823-08-01-the-second-survey-of-the-kingdoms", "n": 84, "bn": 21, "hy": 823, "hm": 8, "hd": 1, "w": 1420, "title": "The Second Survey of the Kingdoms, and the Three Empires of the East", "date": "1420-08-11", "dateStr": "11 August 1420", "hdateStr": "1 Shaʿbān 823", "book": "book-of-the-marches", "people": ["ismail-ibn-saad", "saad-ibn-yusuf", "temur", "ahmad-ottoman", "muhammad-ottoman", "aisha-ottoman", "aktai-mamluk", "bolot-mamluk", "umm-al-fath-bint-saad", "yahya-marinid", "abu-al-fadl-marinid", "jadila-bint-yusuf", "pedro-of-castile"], "places": ["ishbiliyya", "fas"], "sources": ["1420-08-11-the-world", "1417-04-22-ottoman-peace", "1417-03-19-death-of-abu-al-fadl", "1417-07-14-yahya-of-fas", "1411-11-27-alliance-of-tunis", "1370-09-13-the-world"], "words": 1156, "catch": "Fifty years after the first survey of the kingdoms, the Emperor", "canon": 3, "body": "Fifty years after the first survey of the kingdoms, the Emperor [Ismāʿīl](person:ismail-ibn-saad) found it in the treasury, still beside the map of the caliphs, with the leaf of three lines that his father [Saʿd](person:saad-ibn-yusuf) had kept. He read it and laughed at the last section, where the scribes had judged that Gharnāṭa was no longer far from the great powers. Then he ordered a new one. The Dīwān al-Inshāʾ had envoys at every court that mattered by now, and it did not need to question pilgrims and captives. Its survey was ready on the first day of Shaʿbān 823, the day after Fermoselle, and the Emperor read it on the road home.\n\n**Of the three empires of the East.** The scribes began where the news was. Fifty years ago the East had been a quarrel of emirs and beys. Now it had three masters, and every envoy wrote of them in the same breath.\n\nThe greatest in land is [Tīmūr](person:temur), lord of Samarqand. He has reigned for sixty years and is eighty-four, and he has never stopped conquering. When the first survey was written his name was not on the list. Now his empire is the fourth power of the world, with seven hundred and seven towns, more than any realm but the empire of al-Ṣīn. Its frontiers run from Tabrīz to Kāshghar beyond the mountains, and in the last six years he has added Farghāna, Fārs, Kirmān and Hurmuz on the Gulf, where the spice ships of India put in. The envoys said three things of him: that he has never lost a battle, that he leaves pyramids of skulls outside the cities that resist him, and that his treasury is empty, because he spends everything on the next war. The dīwān has named him among the empire's rivals for years, which amused the envoys, since his nearest town lies a thousand leagues from Ishbīliya. He has named as his heir a captain called Köke, a conqueror and a reformer of armies, who is forty-eight. No one at Samarqand expects the empire to hold together long once Tīmūr dies, and no one there says so.\n\nThe second is the house of ʿUthmān at Constantinople, sixth in the world. Fifty years ago the scribes wrote that the Turks were twenty-seventh among the powers and nowhere near the Strait. They have two hundred and ninety-four towns now, from the Danube to Erzurum, and eighty-two ships, the largest fleet in the Middle Sea. Their sultan is [Aḥmad](person:ahmad-ottoman), son of the [Muḥammad](person:muhammad-ottoman) of the first survey, and brother of the Emperor's own wife [ʿĀʾisha](person:aisha-ottoman). He has reigned since 815. He is a pious man and nothing else; the envoys found him slow in council and slower in the field. But in Rabīʿ al-Awwal 820 his generals made a peace that brought Sivas and the lands of Eretna, Amasya and the Dobruja into the empire, and the Turks now hold all of Anatolia except Cilicia, which is the Mamlūks', and the hills of Karaman, which pay them homage. His son Murād is a better man than his father, and the Greeks and the Hungarians watch him.\n\nThe third is the realm of the Mamlūks, ninth in the world and the only one of the three that is a friend. The sultan [Aqṭāy](person:aktai-mamluk) is the son of [Būlād](person:bolot-mamluk), and so a cousin of the Emperor's late half-sister [Umm al-Fatḥ](person:umm-al-fath-bint-saad). He has reigned for twenty-four years, a soldier whom his men will follow anywhere and a man who has seen the world. He holds Cairo, Syria and Palestine, and through his vassals the Ḥijāz and the Holy Cities, nearly three hundred towns in all. His merchants' trade is nearly as rich as the empire's own. The alliance of 768 still stands, the oldest the empire has. The envoys warned that Aqṭāy names both the Turks and Tīmūr among his rivals, and that if either of them turned south the Mamlūks would need their friends.\n\n**Of the Maghrib.** Fās has a new sultan. [Abū al-Faḍl](person:abu-al-fadl-marinid), the Emperor's ally in the War of Jillīqiya, died of a fever of the lungs in Muḥarram 820 after thirty-five years on the throne. His son had died hunting in 813, so the throne went to his grandson [Yaḥyā](person:yahya-marinid), who was fifteen and has ruled in his own name since his sixteenth birthday. He is a grandson of [Jadīla](person:jadila-bint-yusuf), so the blood of Yūsuf I sits on the throne of [Fās](place:fas). The envoys did not like him: a cold young man, they wrote, who is cruel to his servants. But Fās is fourteenth in the world, it has forty-four ships, and it keeps the alliance. So do the Ḥafṣids of Tūnis, who joined it a month after the Peace of Rajab. For the first time since the Almohads every Muslim crown of the West stands together, and al-Andalus stands at their head.\n\n**Of the Franks.** England is the second power of the world, though half its strength lies in its vassals across the sea. Its king, William, is the only prince of Christendom who names al-Andalus among his enemies, and the only friend left to Qashtāla. France is fifth. Its king, Pierre, has the largest army in Christendom, more than forty thousand men, and is using it against the princes of the Low Countries. He names England among his enemies, and not al-Andalus. The crown of the Germans has passed to the duke of Saxony. The Pope, a man of fifty-nine named Guilhèm, sits at Rome again and not at Avignon. Hungary and Naples have one king, László, twenty-eight years old.\n\n**Of the Peninsula.** [Pedro](person:pedro-of-castile) of Qashtāla still reigns at Oviedo, as he has for twenty-six years, over forty-five towns in the rain. The scribes counted Qashtāla sixty-sixth among the powers of the world, and they found that it kept no army at all, only four ships. Its heir, Fernando, is twenty-eight.\n\n**Of al-Andalus.** Then the scribes set down the empire: third among the powers of the world, behind only al-Ṣīn and England. It rules a hundred and eighty-six towns of its own and as many again in its ṭāʾifas, from Porto to Barshalūna, and its trade is worth more than that of any realm in the West. The scribes noted one thing more, in red, as their predecessors had noted the enmity of France. Among the great powers of the world only England counts al-Andalus an enemy, and England has no army to speak of.\n\nThe Emperor read it all on the road from Fermoselle. He had a leaf copied, as his father had, and the clerks who saw it said it had four lines: Tīmūr is eighty-four, the Turks have the fleet, the Mamlūks are our friends, and Qashtāla has no army. He kept it with him.\n\n*And if it were not for Allāh repelling some people by means of others, the earth would have been corrupted, but Allāh is full of bounty to the worlds.*"}, {"addr": "823-08-25", "slug": "0823-08-25-of-the-petty-kings-of-the-mountains", "n": 85, "bn": 22, "hy": 823, "hm": 8, "hd": 25, "w": 1420, "title": "Of the Petty Kings of the Mountains", "date": "1420-09-04", "dateStr": "4 September 1420", "hdateStr": "25 Shaʿbān 823", "book": "book-of-the-marches", "people": ["ismail-ibn-saad", "pedro-of-castile", "diego-villamarin", "jose-fernando-tunon", "alfonso-gaston"], "places": ["ishbiliyya", "banbaluna"], "sources": ["1420-09-04-the-fall-of-qashtala", "1411-11-01-the-end-of-portugal", "1420-08-11-the-world"], "words": 546, "catch": "Since the Peace of Rajab, Qashtāla had been a kingdom of", "canon": 3, "body": "Since the Peace of Rajab, Qashtāla had been a kingdom of forty-five towns in the rain of the north, with no army and four ships. On 25 Shaʿbān 823, three weeks after Fermoselle, it stopped being even that. The news reached [Ishbīliya](place:ishbiliyya) in the last days of the month, before the new moon of Ramaḍān, in letters from the merchants of the Cantabrian ports. The lords of the mountains had stopped answering to their king, and each of them now called himself a king.\n\nThe greatest of them was in the west. [Diego Villamarín](person:diego-villamarin), a Galician lord not yet thirty and the best soldier left in the Christian north, made himself king of Galicia with twenty-three towns, from Santiago, where the Christians keep the tomb of their apostle, to A Coruña, Lugo, Ourense and Tui on the Miño. The secretaries of the Dīwān al-Inshāʾ pointed out that his kingdom was the country the Arabs had always called Jillīqiya, and the Emperor had named his war after it. Now it was a kingdom of its own. At Oviedo, in the mountains where the Christians said their reconquest had begun, a Leonese lord named [José Fernando Tuñón](person:jose-fernando-tunon) took Asturias, eight towns and its old capital. The Basques of the coast, from Bilbao and San Sebastián to Vitoria in the plain of Álava, took a king of their own, [Alfonso Gastón](person:alfonso-gaston), and called him king of Navarre, though the Navarre of the old kings was the Emperor's Ṭāʾifa of [Banbalūna](place:banbaluna) and had been for nine years. [Pedro](person:pedro-of-castile), who had reigned for twenty-six years and lost two wars to the house of Naṣr, was left with four towns around Santander, the port of Laredo, and the valley of Potes beneath the Picos de Europa.\n\nThe court of Ishbīliya received the news with a joy it did not try to hide. The preachers said that the kingdom that had called itself the sword of the reconquest had broken itself on the same rocks where it was born. The older men of the dīwān were less certain. One king with no army had been easy to watch. Now there were four, and only Pedro was bound by the truce sworn at the Peace of Rajab. Diego of Galicia had signed nothing, and he had a soldier's reputation.\n\nThe Emperor [Ismāʿīl](person:ismail-ibn-saad) did what he always did. He wrote to all four kings. To Diego he sent congratulations on his crown and the respect of one soldier for another. To Tuñón he wrote of the antiquity of Oviedo. To Alfonso Gastón he wrote that the Basques had always been a people apart, and that al-Andalus had no quarrel with them. To Pedro he wrote nothing at all for a month, and then a short letter of condolence. The secretaries who copied the four letters noticed that no two of them said the same thing, and none of them were surprised. The ʿulamāʾ said that the last war of the Istirdād would come when Allāh willed it. The Emperor said that four small kingdoms were easier to take one at a time than one large one, and that he was in no hurry.\n\n*Similar situations have passed on before you, so proceed throughout the earth and observe how was the end of those who denied.*"}, {"addr": "827-09-18", "slug": "0827-09-18-of-the-three-brides-and-the-peace-of-kayseri", "n": 86, "bn": 23, "hy": 827, "hm": 9, "hd": 18, "w": 1424, "title": "Of the Three Brides, and the Peace of Kayseri", "date": "1424-08-14", "dateStr": "14 August 1424", "hdateStr": "18 Ramaḍān 827", "book": "book-of-the-marches", "people": ["ismail-ibn-saad", "ismail-ibn-muhammad-ibn-ismail", "ahmad-ibn-muhammad-ibn-ismail", "yahya-marinid", "aktai-mamluk", "ahmad-ottoman", "ahmad-ibn-ismail-ibn-yusuf", "umm-al-fath-bint-yusuf", "pedro-of-castile"], "places": ["ishbiliyya", "fas", "balansiyya"], "sources": ["1423-03-26-the-three-brides", "1421-11-04-kingdom-of-burtuqal", "1422-04-18-death-of-umm-al-fath-bint-yusuf", "1422-10-14-death-of-pedro-of-castile", "1423-11-05-catalans-and-sephardim", "1423-09-19-mamluks-declare-war", "1423-10-01-call-of-the-mamluks", "1424-08-08-peace-of-kayseri"], "words": 785, "catch": "The Emperor Ismāʿīl had read his survey of the kingdoms and", "canon": 3, "body": "The Emperor [Ismāʿīl](person:ismail-ibn-saad) had read his survey of the kingdoms and kept its leaf of four lines, and in the years after it the court watched him act on it through his grandsons. The elder, [Ismāʿīl](person:ismail-ibn-muhammad-ibn-ismail), the son of Magdalena, was married three times over. His first bride was Tella of the Marīnids, sister of the young sultan [Yaḥyā](person:yahya-marinid) of [Fās](place:fas). His second was Ayaulym, daughter of the Mamlūk sultan [Aqṭāy](person:aktai-mamluk). His third was Khadīja, daughter of the Ottoman sultan [Aḥmad](person:ahmad-ottoman), whose sister was already the Emperor's own wife. Of the three great Muslim crowns that the survey had counted around al-Andalus, the heir's heir was now the son-in-law of two and the brother-in-law of the third. His brother [Aḥmad](person:ahmad-ibn-muhammad-ibn-ismail), the abler of the two, was married nearer home: to Dīma of the Ḥafṣids of Tūnis, to Muʾmina, daughter of the lord of Burtuqāl, and to ʿĀʾisha bint Saʿd of the house. In 825 the first of the next generation were born. The secretaries of the Dīwān al-Inshāʾ said the Emperor had found a way to write letters that would still be read in fifty years.\n\nThe old generation went on dying. On 25 Rabīʿ al-Thānī 825 [Umm al-Fatḥ](person:umm-al-fath-bint-yusuf), the youngest child of Yūsuf I, died of dysentery at fifty-nine, and with her the last of the children of the sultan who had ruled Gharnāṭa as Qashtāla's tributary. In the north, on 27 Shawwāl 825, King [Pedro](person:pedro-of-castile) of Qashtāla fell down a flight of stairs in his castle at Santander and died of it. He was fifty-one, and he had reigned for twenty-eight years and lost almost everything. His son Fernando, a young man hungry for glory, inherited four towns and the Cantabrian coast. The preachers of Ishbīliya were too pleased to say anything unkind about the stairs.\n\nThe lord of Burtuqāl, the Emperor's cousin [Aḥmad](person:ahmad-ibn-ismail-ibn-yusuf), had a different kind of ambition. On 8 Dhū al-Qaʿda 824 he proclaimed his ṭāʾifa the Kingdom of Portugal and had himself crowned with the crown of its old kings, before the bishops of the country and in their church, since the kingdom's people were Christians and its laws were theirs. The Emperor allowed it. A king of Portugal who owed his crown to Ishbīliya was worth more to him than a lord of Burtuqāl who might one day forget it. The ʿulamāʾ were uneasy until they learned that the new king had grown more zealous in his own faith with every year on the throne, and that he prayed in his own mosque at Barcelos while his subjects went to their cathedrals.\n\nAt court the dīwān's plan of 822 was carried out. Once [Balansiyya](place:balansiyya) was integrated, the Catalans took their place beside the Andalusīs and the Portuguese as subjects whose tongue was no bar to any office in the empire, and the Sephardim, who had been under the Emperor's protection since the year of Avignon, were accepted with them. The Castilians, as before, were not.\n\nThen the East called. On 13 Shawwāl 826 Aqṭāy of Miṣr declared war on the Ottomans, before, he said, they could declare it on him, and he called his allies in after him. The letter reached Ishbīliya on 25 Shawwāl. The court did not like it. The Mamlūks were the oldest friends al-Andalus had, but the Ottoman sultan was the Emperor's brother-in-law and the father of one of his grandson's wives, and the Mamlūk sultan was the father of another. The Emperor answered the call on the day it came, and all seven ṭāʾifas answered with him, because an alliance of fifty-six years was worth more than one war. But the court let it be known in Cairo, as politely as the Dīwān al-Inshāʾ knew how, that al-Andalus was a long way from Anatolia, and hoped that Aqṭāy did not expect much of it.\n\nHe did not need much. The Mamlūk armies, seventy thousand strong, went up through Cilicia into the plateau, and the Ottomans, for all their sixty thousand men and a hundred and seventy ships, could not stop them. The mountain people of Nafusa, who had joined the Ottomans, made their peace on 25 Shaʿbān 827. On 12 Ramaḍān the Ottomans made theirs. Thirty-seven towns of central Anatolia passed to the Mamlūks, from Kayseri, Niğde and Nevşehir to Malatya, Harput and Çorum. The armies of al-Andalus fought no battle the court thought worth recording, and the empire took nothing and lost nothing. The Emperor sent his congratulations to Cairo and his condolences to Constantinople by the same ship, and the court said it was the shortest and cheapest war the house of Naṣr had ever fought.\n\n*And if two factions among the believers should fight, then make settlement between the two.*"}, {"addr": "831-02-11", "slug": "0831-02-11-of-the-islands-of-the-ocean-and-the-naft-of-ethiopia", "n": 87, "bn": 8, "hy": 831, "hm": 2, "hd": 11, "w": 1427, "title": "Of the Islands of the Ocean, and the Naft of Ethiopia", "date": "1427-12-01", "dateStr": "1 December 1427", "hdateStr": "11 Ṣafar 831", "book": "book-of-the-encircling-sea", "people": ["ismail-ibn-saad"], "places": ["ishbiliyya"], "sources": ["1421-06-01-tamaraceite", "1421-08-01-the-secret-of-the-naft", "1422-09-01-santo-antao", "1423-02-01-santa-cruz-das-flores", "1425-03-01-fogo", "1425-06-01-tedote", "1425-07-01-horta", "1427-08-01-santiago-cape-verde", "1427-12-01-ponta-delgada", "1420-08-01-angra"], "words": 480, "catch": "When Angra was founded on Terceira in 823, the empire had", "canon": 3, "body": "When Angra was founded on Terceira in 823, the empire had three towns in the Ocean. Seven years later it had eleven, and the clerks of the Dīwān al-Inshāʾ had to keep a separate register for them, because the islands were too far apart to be written up with any province of the mainland.\n\nIn the Canaries the settlers went where the islanders already were. Tamaraceite on Gran Canaria became a town of the crown in Jumādā al-Ūlā 824, with eight and a half thousand Guanches, and Tedote on La Palma followed in Rajab 828 with five and a half thousand more. Like the people of Maxorata, they were left to their own customs and their own gods, and they paid their dues to the Emperor's governor and were otherwise left alone.\n\nThe Green Cape was empty, and there the empire had to bring its own people. Santo Antão, the northernmost of the islands, became the empire's first town in the southern sea in Ramaḍān 825, with seventeen hundred Andalusī settlers. Fogo, the island of the fire mountain, followed in Rabīʿ al-Thānī 828. Santiago, the largest of the islands, followed in Shawwāl 830, settled by Portuguese-speaking Muslims of al-Gharb and Burtuqāl. The dīwān had told the first fleet that the islands were to be a land of their own one day, and the captains now spoke of them as the halfway house to Mālī and the Gulf, where a ship bound south could take on water, salt and goats.\n\nThe Azores filled from the west. After Angra came Santa Cruz on Flores, the furthest island of all, in Ṣafar 826; Horta on Faial in Shaʿbān 828; and on 11 Ṣafar 831 Ponta Delgada on São Miguel, the largest of the islands, each with twelve or thirteen hundred settlers. Unlike the Christian farmers of Angra, nearly all of them were Andalusīs and Muslims, and the first building in each town was a mosque. The pilots said that from Flores the sun set over nothing at all, and that no one knew how far the nothing went.\n\nThe Ocean paid for itself in unexpected ways. In Shaʿbān 824 envoys came to [Ishbīliya](place:ishbiliyya) from Ethiopia, the Christian kingdom beyond Egypt, wanting to buy naft, the fire weapons the armies of al-Andalus had used since the days of the sultans. The dīwān warned that a weapon once sold could one day be turned against the seller. The Emperor [Ismāʿīl](person:ismail-ibn-saad) asked how far Ethiopia was from Ishbīliya and how much it was offering. It was a very long way, and the offer was four hundred and nineteen pieces of gold, which the treasurers reckoned at twice the crown's yearly income. He said that it would never backfire, and took the gold.\n\n*And He has cast into the earth firmly set mountains, lest it shift with you, and rivers and roads, that you may be guided.*"}, {"addr": "831-08-10", "slug": "0831-08-10-of-the-jamaa-of-831-and-the-armouries", "n": 88, "bn": 24, "hy": 831, "hm": 8, "hd": 10, "w": 1428, "title": "Of the Jamāʿa of 831, the Armouries, and the Spies of the North", "date": "1428-05-25", "dateStr": "25 May 1428", "hdateStr": "10 Shaʿbān 831", "book": "book-of-the-marches", "people": ["ismail-ibn-saad", "diego-villamarin", "yusuf-ibn-ismail", "ahmad-ibn-yusuf-ibn-ismail", "umm-al-fath-bint-muhammad", "jadila-bint-saad-ibn-faraj", "saad-ibn-yusuf-ibn-saad", "yusuf-ibn-saad"], "places": ["ishbiliyya", "banbaluna", "al-ushbuna", "tulaytula", "qurtuba", "gharnata", "malaqa", "al-mariyya", "yabura", "shantarin", "istijja", "uryula"], "sources": ["1425-03-25-galicia-takes-asturias", "1426-02-01-truce-with-castile-ends", "1427-04-28-war-in-france", "1425-12-17-umm-al-fath-to-the-diwan", "1428-04-30-death-of-yusuf-of-banbaluna", "1428-05-25-the-spies-go-north", "1428-05-25-the-armouries", "1428-05-25-jamaa-against-primacy", "1428-05-25-primacy-revoked"], "words": 719, "catch": "The petty kings of the mountains did not stay four for", "canon": 3, "body": "The petty kings of the mountains did not stay four for long. In Jumādā al-Ūlā 828 [Diego](person:diego-villamarin) of Galicia, the soldier king, made war on Asturias and took all of it, Oviedo and its eight towns, and Galicia stretched from Santiago to Llanes. Three Christian kingdoms were left in the north: Galicia, Navarre on the Basque coast, and what remained of Qashtāla at Santander. In Rabīʿ al-Awwal 829 the truce of the Peace of Rajab ran out, and for the first time in fifteen years nothing bound the empire to peace with any of them. A year later the English went to war with France again, and King Fernando of Qashtāla went with them, until in Jumādā al-Ūlā 831 he made a peace of his own with the French and came home.\n\nThe Emperor [Ismāʿīl](person:ismail-ibn-saad) was sixty-two. He had never been a soldier, and he had always known what he wanted. He wanted the last war of the Istirdād fought in his own lifetime, and he set about it as he had set about everything, by making sure that when it came it would be short. In the spring of 831 his spies went north into all three kingdoms. They did not go to count soldiers. They went to talk, in the markets and the monasteries and the lords' halls, about the return of al-Andalus: that it was not a conquest but a homecoming, that the Portuguese and the Catalans now sat in the Emperor's dīwān, and that every Iberian, whatever he prayed, had a place in it. The secretaries who wrote their instructions remembered what the Emperor had said after Fermoselle, that four small kingdoms
