 either of them.\n\nWhat he had read was this. The empires that lasted were the ones that listened to the men who made their money, and the ones that fell were the ones whose princes and lords had stopped listening. Rome had been ruined by its senators, and Baghdad by its soldiers. He did not intend al-Andalus to be ruined by its umarāʾ. The realm already had the first market of the Middle Sea, a fleet of its own building and trading offices from Niani to Cairo, and it was fighting a trade war with Genoa and the Angevins. The men who would win or lose that war were not in the Jamāʿa as anything more than petitioners.\n\nSo he changed the Jamāʿa. From that session it was to be an assembly of the whole realm, and the burghers of the cities were to sit in it as the equals of the umarāʾ and the ʿulamāʾ, with their own voice in every matter put to it. Then, before the shock had passed, he gave them two privileges as well. The first was the Shipwright Contracts, which handed the building of the empire's ships to merchant houses under state contract, freed from the old regulations of the arsenals. The second was the Urban Development Grants, which put crown money into the walls, streets and markets of the towns. \"The future,\" the Emperor said, quoting no one in particular, \"will dawn within city walls.\"\n\nThe court was, as the clerks put it, incensed. The umarāʾ had lost their equality to his father's Jamāʿa of 831. Now they had lost it again, this time to men who sold cloth. The ʿulamāʾ, who had voted with the crown in 831, found that they had voted themselves into a chamber full of merchants. Even the dhimmī, who had always sided with the crown against the lords, complained that the merchants were getting more than their share. Only the burghers were pleased, and they were very pleased. As for the princes, they said nothing in public. In private the dīwān heard them say that their father had finally done something they had not planned for him, and that they were not yet sure whether to be proud of him.\n\n*And those who have responded to their Lord and established prayer, and whose affair is consultation among themselves, and from what We have provided them, they spend.*"}, {"addr": "846-03-29", "slug": "0846-03-29-of-the-princes-mending-and-the-golden-century", "n": 107, "bn": 2, "hy": 846, "hm": 3, "hd": 29, "w": 1442, "title": "Of the Princes' Mending, and the Golden Century", "date": "1442-08-07", "dateStr": "7 August 1442", "hdateStr": "29 Rabīʿ al-Awwal 846", "book": "book-of-the-golden-century", "people": ["muhammad-ibn-ismail-ibn-saad", "ismail-ibn-muhammad-ibn-ismail", "ahmad-ibn-muhammad-ibn-ismail"], "places": ["ishbiliyya", "qurtuba"], "sources": ["1442-06-11-the-princes-mend-the-damage", "1442-08-07-the-golden-century", "1442-08-07-establish-a-thalassocracy", "1440-10-01-the-palace-city-of-qurtuba", "1442-06-01-national-assemblies", "1442-06-01-privileges-for-the-burghers"], "words": 651, "catch": "The princes Ismāʿīl and Aḥmad had not been asked about their", "canon": 4, "body": "The princes [Ismāʿīl](person:ismail-ibn-muhammad-ibn-ismail) and [Aḥmad](person:ahmad-ibn-muhammad-ibn-ismail) had not been asked about their father's Jamāʿa, but they were left to deal with what came of it, and they did not waste a day. While the umarāʾ were still drafting their protests, the princes rode out to the hinterland. They spoke to the headmen of the villages, the men who had eaten from the Emperor Ismāʿīl's granaries and remembered who had built them, and they told them that the crown had not forgotten the countryside for the cities. The commoners had no love for the merchants, but they had less for the lords, and the hinterland stayed quiet. Then the princes went to the ʿulamāʾ. They could not undo the merchants' seats, but they could promise the scholars that when the heir Ismāʿīl came to the throne, every right the ʿulamāʾ held would be confirmed by his own hand on the day of his accession. The ʿulamāʾ took the promise, and grumbled, and stayed.\n\nTen days after the Jamāʿa the dīwān took stock. The realm's peace had held. The crown's standing with the people had even risen a little, for the princes had been seen to listen where the Emperor had not. But there was no estate of the realm except the burghers that was not deeply angry. The umarāʾ had lost their land rights four years before, and now their place above the merchants. The commoners felt passed over, and the ʿulamāʾ and the dhimmī felt crowded. The burghers, for their part, had never been happier, and in the arsenals of the coast their new contracts were already turning out ships faster than the old masters had ever managed.\n\nTwo months later, at the end of Rabīʿ al-Awwal 846, the Emperor [Muḥammad](person:muhammad-ibn-ismail-ibn-saad) proclaimed what the court had been saying in private for five years. The Strait was held and the rival driven back. For the first time in centuries the call to prayer rose over an Iberia gathered under one banner. The age of the petty kings was over, and what the fall of [Qurṭuba](place:qurtuba) had scattered four hundred years before, he had made whole again. The proclamation was read in the mosques of every city from Lisbon to Perpignan: a century of wealth and consolidation lay ahead, the Golden Century of al-Andalus. Many maps, the clerks of the chancery said, would have to be redrawn.\n\nThe Emperor's first act of the new age was signed the same day. Al-Andalus was to be a thalassocracy, an empire whose strength was its sea. For twenty years the crown would pay a fifth less for every ship it built, great or small, and the arsenals, the shipwrights' contracts and the sons of the umarāʾ serving their seasons with the fleet were all bent to one purpose: a navy that no league of Christian kings could match. Above Qurṭuba, the palace-city of the caliphs, Madīnat al-Zahrāʾ, had risen again from its ruins on the Emperor's orders. The court said that the new age had been given both its symbols at once, a palace on the land and a fleet on the sea, and that it was not hard to tell which the Emperor loved more.\n\nThe princes read the proclamation with care, and so did the ambassadors in [Ishbīliya](place:ishbiliyya). The Christian kingdoms beyond the mountains had long counted al-Andalus a spent and fading power. Now they would have to reckon with its return, and the secretaries of the Dīwān al-Inshāʾ warned that if the empire's power in Europe or across the seas grew too great, its enemies and rivals would one day league together against it. The Emperor said that he had read about leagues too, and that the ones that formed against the great empires of old had usually been too late.\n\n*And when your Lord proclaimed: If you are grateful, I will surely increase you; but if you deny, indeed, My punishment is severe.*"}, {"addr": "847-02-27", "slug": "0847-02-27-of-the-jamaa-of-847-and-the-island-of-fernando-po", "n": 108, "bn": 3, "hy": 847, "hm": 2, "hd": 27, "w": 1443, "title": "Of the Jamāʿa of 847, and the Island of Fernando Po", "date": "1443-06-26", "dateStr": "26 June 1443", "hdateStr": "27 Ṣafar 847", "book": "book-of-the-golden-century", "people": ["muhammad-ibn-ismail-ibn-saad"], "places": ["ishbiliyya"], "sources": ["1443-06-26-the-jamaa-of-847", "1442-06-01-national-assemblies", "1432-05-01-the-green-cape", "1432-05-01-trading-posts"], "words": 366, "catch": "A year after the Emperor Muḥammad had seated the burghers in", "canon": 4, "body": "A year after the Emperor [Muḥammad](person:muhammad-ibn-ismail-ibn-saad) had seated the burghers in the Jamāʿa, the assembly met again at [Ishbīliya](place:ishbiliyya), on 27 Ṣafar 847. Everyone at court expected a quarrel. The umarāʾ had not forgiven the merchants for their seats, and the merchants had not forgotten how loudly the lords had protested. The clerks prepared for a long session.\n\nIt was short. The umarāʾ brought the first business of the session, and it was not a grievance. They asked the crown to push the empire's settlements further down the African coast and out into the Ocean, with lords of the great houses to lead them and lands to be granted there to the men who took them. Some of the lords wanted estates to replace the land rights they had lost at home. Others wanted to be away from a court where they now had to sit beside cloth merchants. The burghers, who had expected to oppose them, found that the lords were asking for exactly what the merchants wanted too: new ports, new harbours for the ships of the Green Cape and the gold coast, and new goods to sell. The two estates that had hated each other for a year voted together, and the motion passed before the noon prayer.\n\nThe assembly named its first object. In the Gulf of Guinea, beyond the trading posts of Kaabu and past the mouths of the great rivers, the pilots had found a high green island rising out of the sea, with a mountain at its heart, a good anchorage and people of its own: the island of Fernando Po. The Jamāʿa asked for it, the burghers offered to share the cost, and the Emperor, who had never needed persuading about anything that floated, agreed.\n\nThe princes noted that the new Jamāʿa had done in a morning what the old one had never managed in a season. The Emperor took it as proof that he had been right.\n\n*And among His signs is that He sends the winds as bearers of good news, and to let you taste His mercy, and so that the ships may sail at His command, and that you may seek of His bounty.*"}]};

  SEQ.push({type:"leaf", addr:L.addr});
});
const seqKey = it => it.type==="book" ? "book/"+it.id : "leaf/"+it.addr;
const SEQI = {}; SEQ.forEach((it,i)=> SEQI[seqKey(it)] = i);
const hrefOf = it => "#/"+seqKey(it);

function reignAt(date){ let r=null; D.reigns.forEach(x=>{ if (x.start<=date && (!x.end || date<x.end)) r=x; }); return r; }
function nextInThread(L){ for (let j=L.i+1;j<D.leaves.length;j++) if (D.leaves[j].book===L.book) return D.leaves[j]; return null; }
function prevInThread(L){ for (let j=L.i-1;j>=0;j--) if (D.leaves[j].book===L.book) return D.leaves[j]; return null; }

// ---------- markdown (the subset the chronicle uses) ----------
function inline(s){
  s = esc(s);
  s = s.replace(/\[([^\]]+)\]\((person|place|war):([^)]+)\)/g,
        (m,t,k,id)=>`<span class="ref ref-${k}" data-ref="${k}:${id}" title="${k}: ${id} (gloss reserved)">${t}</span>`);
  s = s.replace(/\*\*([^*]+)\*\*/g,'<b class="runin">$1</b>');
  s = s.replace(/\*([^*]+)\*/g,'<em>$1</em>');
  return s;
}
const STAR = `<svg class="star" viewBox="0 0 24 24" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.2"><rect x="5" y="5" width="14" height="14"/><rect x="5" y="5" width="14" height="14" transform="rotate(45 12 12)"/></g><circle cx="12" cy="12" r="1.6" fill="currentColor"/></svg>`;
function renderBody(L){
  let paras = L.body.split(/\n\s*\n/).map(p=>p.trim()).filter(Boolean);
  const out = []; let firstDone=false;
  paras.forEach((p,idx)=>{
    const last = idx===paras.length-1;
    if (/^Here begins the Book of [^.]+\.$/.test(p)) { out.push(`<p class="rubric inc">${inline(p)}</p>`); return; }
    if (/^Here ends the Book of [^.]+\.$/.test(p)) { out.push(`<p class="rubric">${inline(p)}</p>`); return; }
    if (last && p.startsWith("*")) { out.push(`<div class="verse">${STAR}<p>${inline(p)}</p></div>`); return; }
    let tail = null;
    const m = p.match(/^([\s\S]*?)\s*(Here ends the Book of [^.]+\.)$/);
    if (m && m[1]) { p = m[1]; tail = m[2]; }
    out.push(`<p${!firstDone?' class="first"':''}>${inline(p)}</p>`); firstDone=true;
    if (tail) out.push(`<p class="rubric">${inline(tail)}</p>`);
  });
  return out.join("\n");
}

// ---------- catchwords ----------
function cwForItem(it, label, kind){
  if (it.type==="book"){
    const b=BOOK[it.id];
    return `<a class="cw" data-way="${kind}" href="${hrefOf(it)}" style="--rub:${rub(b.id)}"><span class="lab">${label}</span>
      <span class="first">${bookTitle(b)} begins</span><span class="tt"><span class="ar">${b.titleArabic}</span> · Book ${ROMAN[b.i]} · ${b.leaves} leaves</span></a>`;
  }
  const L=LEAF[it.addr];
  return `<a class="cw" data-way="${kind}" href="${hrefOf(it)}" style="--rub:${rub(L.book)}"><span class="lab">${label}</span>
    <span class="first">${esc(L.catch)}…</span><span class="tt">${addrShow(L.addr)} · ${esc(L.title)}</span></a>`;
}
function catchwords(fromItem){
  const i = SEQI[seqKey(fromItem)];
  const nx = SEQ[i+1] || null;
  const parts = [];
  let L = fromItem.type==="leaf" ? LEAF[fromItem.addr] : null;
  let thread = null, b = null;
  if (L){ b=BOOK[L.book]; thread = nextInThread(L); }
  else { b=BOOK[fromItem.id]; thread = LEAF[b.first]; }
  const nxLeaf = nx && nx.type==="leaf" ? nx.addr : null;
  const bt = bookTitle(b).replace(/^The /,"the ");
  let codexCW = null, threadCW = null;
  if (nx && thread && nxLeaf===thread.addr){
    codexCW = cwForItem(nx, `Next leaf, and next in ${bt}`, "both");
  } else {
    if (nx) codexCW = cwForItem(nx, nx.type==="book" ? "Next in the codex" : `Next leaf · ${bookTitle(BOOK[LEAF[nx.addr].book]).replace(/^The /,"the ")}`, "codex");
    if (thread) threadCW = cwForItem({type:"leaf",addr:thread.addr}, `Next in ${bt}`, "thread");
    else if (L){
      threadCW = b.closed
        ? `<div class="cw shut" style="--rub:${rub(b.id)}"><span class="lab">${bt}</span><span class="first">is closed. Its ${b.leaves} leaves end here; the codex goes on.</span></div>`
        : `<div class="cw shut" style="--rub:${rub(b.id)}"><span class="lab">${bt}</span><span class="first">continues, written as it happens. Its next leaf is not yet written.</span></div>`;
    }
  }
  if (!nx) codexCW = `<div class="cw shut"><span class="lab">The codex</span><span class="first">This is the last leaf bound. The book stands open here.</span></div>`;
  const way = store.get("codex-way") || "codex";
  if (way==="thread" && threadCW) { parts.push(threadCW); if (codexCW) parts.push(codexCW); }
  else { if (codexCW) parts.push(codexCW); if (threadCW) parts.push(threadCW); }
  return `<nav class="catch" aria-label="Catchwords">${parts.join("")}</nav>`;
}

// ---------- running head ----------
function head({l, r, color, prev, next}){
  $("#rh-l").innerHTML = l; $("#rh-r").innerHTML = r;
  document.querySelector("#rhead").style.setProperty("--rub", color || "var(--rule)");
  const p=$("#rh-prev"), n=$("#rh-next");
  p.href = prev||"#"; p.classList.toggle("dis", !prev);
  n.href = next||"#"; n.classList.toggle("dis", !next);
}

// ---------- contents: the canon tables ----------
function densityStrip(){
  const y0 = D.leaves[0].hy, y1 = D.leaves[D.leaves.length-1].hy;
  const n = y1-y0+1, W = 6, H = 9, top = 20, base = top + 6*H;
  const counts = {}; D.leaves.forEach(L=>{ (counts[L.hy] ||= []).push(L); });
  const saveY = {}; D.saves.forEach(s=>{ saveY[s.hy]=(saveY[s.hy]||0)+1; });
  let svg = `<svg viewBox="0 0 ${n*W+40} ${base+30}" role="img" aria-label="Leaves per Hijri year, coloured by book, with saves below">`;
  // silent stretches: 6+ years with no save
  let run=null;
  for (let y=y0;y<=y1+1;y++){
    if (y<=y1 && !saveY[y]) { if (run===null) run=y; }
    else if (run!==null){ if (y-run>=6) svg += `<rect x="${20+(run-y0)*W}" y="${top-4}" width="${(y-run)*W}" height="${base-top+18}" fill="var(--rule)" opacity=".45"><title>No save from ${run} to ${y-1} AH</title></rect><text x="${20+(run-y0)*W+3}" y="${top-7}" font-size="8" fill="var(--muted)" font-style="italic">no save, ${run}–${y-1}</text>`; run=null; }
  }
  for (let y=y0;y<=y1;y++){
    const x = 20+(y-y0)*W;
    (counts[y]||[]).forEach((L,k)=>{
      svg += `<a href="#/leaf/${L.addr}"><rect x="${x+.5}" y="${base-(k+1)*H+1}" width="${W-1}" height="${H-1.5}" fill="${rub(L.book)}"><title>${addrShow(L.addr)} · ${esc(L.title)}</title></rect></a>`;
    });
    if (saveY[y]) for (let k=0;k<Math.min(saveY[y],4);k++) svg += `<circle cx="${x+W/2}" cy="${base+5+k*3.2}" r="1.2" fill="var(--muted)"><title>${saveY[y]} save(s) in ${y} AH</title></circle>`;
    if (y%10===0) svg += `<line x1="${x}" x2="${x}" y1="${base}" y2="${base+20}" stroke="var(--faint)" stroke-width=".5"/><text x="${x+2}" y="${base+24}" font-size="8" fill="var(--muted)">${y} · ${D.hy[y][0]}</text>`;
  }
  D.reigns.forEach(r=>{ if (r.hy>=y0){ const x=20+(r.hy-y0)*W; svg += `<line x1="${x}" x2="${x}" y1="${top}" y2="${base}" stroke="var(--ink)" stroke-width=".6" stroke-dasharray="2 2"/><text x="${x+2}" y="${top+6}" font-size="7.5" fill="var(--ink)">${esc(r.name.split(" ibn")[0])}</text>`; }});
  svg += `<line x1="20" x2="${20+n*W}" y1="${base}" y2="${base}" stroke="var(--ink)" stroke-width=".6"/></svg>`;
  const leg = D.books.map(b=>`<span><i style="background:${rub(b.id)}"></i>${bookShort(b)}</span>`).join("");
  return `<div class="strip">${svg}<div class="legend">${leg}<span>· dots: saves read</span><span>· dashed: a new reign</span></div></div>`;
}

function canonTable(c, ci){
  const leaves = D.leaves.filter(L=>L.canon===ci);
  const cols = c.cols, N = cols.length;
  const firstHy = {}, lastHy = {};
  cols.forEach(id=>{ const b=BOOK[id]; firstHy[id]=LEAF[b.first].hy; lastHy[id]= b.closed ? LEAF[b.last].hy : 99999; });
  const byYear = {}; leaves.forEach(L=>{ (byYear[L.hy] ||= {}); (byYear[L.hy][L.book] ||= []).push(L); });
  const ribbon = store.get("codex-ribbon"), here = store.get("codex-here");
  const isOpen = (id,y)=> y>=firstHy[id] && y<=lastHy[id];
  const saveCount = (a,b)=> D.saves.filter(s=>s.hy>=a && s.hy<=b).length;
  // walk the years, grouping by decade
  let g = `<div class="cgrid" style="--n:${N}"><div></div>` + cols.map(id=>{ const b=BOOK[id];
    return `<div class="chead" style="--rub:${rub(id)}"><a class="arch" href="#/book/${id}"><span class="ar">${b.titleArabic}</span><span class="en">${bookShort(b)}</span><span class="ct">Book ${ROMAN[b.i]}</span></a></div>`; }).join("");
  let p = `<div class="plist">`;
  const lanesHTML = (y, onId, startId) => `<span class="lanes">` + cols.map(id=>
      `<span class="lane${isOpen(id,y)?" open":""}${id===onId?" on":""}${id===startId?" start":""}" style="--lc:${rub(id)}"></span>`).join("") + `</span>`;
  const decades = {};
  for (let y=c.hy0; y<=c.hy1; y++) (decades[Math.floor(y/10)*10] ||= []).push(y);
  Object.keys(decades).map(Number).sort((a,b)=>a-b).forEach(dec=>{
    const ys = decades[dec];
    const dl = leaves.filter(L=>L.hy>=ys[0] && L.hy<=ys[ys.length-1]);
    // decade summary row (shown when folded)
    g += `<div class="dec" data-dec="${ci}-${dec}"><div class="decsum" onclick="this.parentNode.classList.toggle('open')"><div class="gut"><b>${dec}s</b>${D.hy[ys[0]][0]}–${D.hy[ys[ys.length-1]][1]}</div>` +
      cols.map(id=>{ const k=dl.filter(L=>L.book===id).length; return `<div class="dots${isOpen(id,ys[ys.length-1])||k?" cell open":" cell"}" style="--rub:${rub(id)}">${"●".repeat(Math.min(k,12))}${k?`<small>${k}</small>`:""}</div>`; }).join("") + `</div>`;
    p += `<div class="pdecw" data-dec="${ci}-${dec}"><div class="pdec" onclick="this.parentNode.classList.toggle('open')">${lanesHTML(ys[ys.length-1],null,null)}<span class="ptext"><b>${dec}s AH</b> · ${D.hy[ys[0]][0]}–${D.hy[ys[ys.length-1]][1]} · ${dl.length} leaves</span></div><div class="pyrs">`;
    let empty = [];
    const flush = ()=>{ if (!empty.length) return;
      const a=empty[0], b=empty[empty.length-1], s=saveCount(a,b);
      const wa=D.hy[a][0], wb=D.hy[b][1]; const txt = `No leaf · ${a===b?a:a+"–"+b} AH · ${wa===wb?wa:wa+"–"+wb} · ${s? s+" save"+(s>1?"s":"")+" read, nothing written": "no save, the record is silent"}`;
      g += `<div class="full lacuna yr">${txt}</div>`; p += `<div class="plac">${txt}</div>`; empty=[]; };
    ys.forEach(y=>{
      if (y===c.hy0) { const r0 = reignAt(leaves[0].date);
        if (r0 && r0.hy!==y) { const t = `<b>Reign of ${esc(r0.name)}</b><span>continuing, since ${r0.startStr}</span>`;
          g += `<div class="full reignrule yr">${t}</div>`; p += `<div class="preign">${t}</div>`; } }
      D.reigns.forEach(r=>{ if (r.hy===y) { flush();
        const t = `<b>Reign of ${esc(r.name)}</b><span>from ${r.startStr} · ${r.hd} ${D.hmonths[r.hm-1]} ${r.hy}</span>`;
        g += `<div class="full reignrule yr">${t}</div>`; p += `<div class="preign">${t}</div>`; }});
      if (!byYear[y]) { empty.push(y); return; }
      flush();
      g += `<div class="gut yr" id="y-${ci}-${y}"><b>${y}</b>${westSpan(y)}</div>`;
      p += `<div class="pyr"><div class="plabel"><b>${y} AH</b> · ${westSpan(y)}</div>`;
      cols.forEach(id=>{
        const ls = (byYear[y]||{})[id] || [];
        const b = BOOK[id];
        let inner = "";
        if (LEAF[b.first].hy===y && LEAF[b.first].canon===ci)
          inner += `<a class="chip" href="#/book/${id}">Here begins</a>`;
        ls.forEach(L=>{
          inner += `<a class="lf${L.addr===ribbon?" rib":""}${L.addr===here?" here":""}" id="c-${L.addr}" href="#/leaf/${L.addr}" title="${esc(L.title)}"><span class="d">${L.hd} ${D.hmonths[L.hm-1]}</span><span class="t">${esc(L.title)}</span></a>`;
          if (b.closed && b.last===L.addr) inner += `<span class="chip end">Here ends</span>`;
        });
        g += `<div class="cell yr${isOpen(id,y)?" open":""}" style="--rub:${rub(id)}">${inner}</div>`;
      });
      // phone: one line per leaf, in codex order, with lanes
      leaves.filter(L=>L.hy===y).forEach(L=>{
        const b=BOOK[L.book];
        if (b.first===L.addr) p += `<a class="pchip" href="#/book/${b.id}" style="--rub:${rub(b.id)}">${lanesHTML(y,null,b.id)}<span>Here begins ${bookTitle(b).replace(/^The /,"the ")} · <span class="ar">${b.titleArabic}</span></span></a>`;
        p += `<a class="pleaf${L.addr===ribbon?" rib":""}${L.addr===here?" here":""}" id="p-${L.addr}" href="#/leaf/${L.addr}" style="--rub:${rub(L.book)}">${lanesHTML(y,L.book,null)}<span class="ptext"><small>${L.hd} ${D.hmonths[L.hm-1]} · ${bookShort(b)}</small>${esc(L.title)}</span></a>`;
        if (b.closed && b.last===L.addr) p += `<div class="pchip" style="--rub:${rub(b.id)}">${lanesHTML(y,null,null)}<span>Here ends ${bookTitle(b).replace(/^The /,"the ")}</span></div>`;
      });
      p += `</div>`;
    });
    flush();
    g += `</div>`; p += `</div></div>`;
  });
  g += `</div>`; p += `</div>`;
  const span = `${c.hy0}–${c.hy1} AH · ${D.hy[c.hy0][0]}–${D.hy[c.hy1][1]}`;
  const names = cols.map(id=>`<span style="color:${rub(id)}">${bookShort(BOOK[id])}</span>`).join(" · ");
  return `<section class="canon" id="canon-${ci}"><header><h3>Canon ${ROMAN[ci]}</h3><span class="span">${span} · ${leaves.length} leaves</span><span class="books">${names}</span></header>${g}${p}</section>`;
}

function viewContents(){
  const first = D.leaves[0], last = D.leaves[D.leaves.length-1];
  const ribbon = store.get("codex-ribbon");
  const words = D.leaves.reduce((a,L)=>a+L.words,0);
  const rL = ribbon && LEAF[ribbon];
  head({l:`<b class="sc">Contents</b> · the canon tables`, r:`<span class="hide-s">${D.leaves.length} leaves · ${first.hy}–${last.hy} AH · ${first.w}–${last.w}</span>`,
        color:"var(--ink)", prev:null, next:"#/leaf/"+first.addr});
  return `
  <div class="titlepage">
    <div class="ar">تاريخ بني نصر</div>
    <h1>The Chronicle of the House of Naṣr</h1>
    <div class="sub">in eight books · ${D.leaves.length} leaves · ${words.toLocaleString("en")} words · ${first.hy}–${last.hy} AH · ${first.w}–${last.w} CE</div>
    <p class="howto">Read it straight through, leaf by leaf, or follow one book down its column. Every leaf is addressed by its Hijri date and ends with two catchwords: the next leaf of the codex, and the next leaf of its own book.</p>
    <div class="ways">
      ${rL ? `<a class="btn ribbon" href="#/leaf/${rL.addr}">Resume at the ribbon · ${addrShow(rL.addr)} <small>${esc(rL.title.slice(0,48))}${rL.title.length>48?"…":""}</small></a>` : ""}
      <a class="btn" href="#/book/${D.books[0].id}">Begin at the first leaf</a>
      <a class="btn" href="#/colophon">Colophon</a>
    </div>
  </div>
  <h2 class="sect"><span>The run of the years</span></h2>
  ${densityStrip()}
  <div class="controls"><span>Years run down each table; each book open at the time keeps its own column. A canon closes when a book closes.</span>
    <label class="toggle"><input type="checkbox" id="foldbox" ${document.body.classList.contains("fold")?"checked":""}> Fold the years into decades</label></div>
  ${D.canons.map(canonTable).join("")}
  <h2 class="sect"><span>The books</span></h2>
  <div class="tabula">${D.books.map(b=>`<a href="#/book/${b.id}" style="--rub:${rub(b.id)}"><span class="num">${ROMAN[b.i]}</span><span>${bookTitle(b)}<small>${b.hstart}–${b.hend||"…"} AH · ${b.leaves} leaves · ${b.closed?"closed":"written as it happens"}</small></span><span class="ar">${b.titleArabic}</span></a>`).join("")}</div>`;
}

function viewBook(id){
  const b = BOOK[id]; if (!b) return viewContents();
  const it = {type:"book", id}; const i = SEQI[seqKey(it)];
  const leaves = D.leaves.filter(L=>L.book===id);
  const beside = D.books.filter(o=>o.id!==id && LEAF[o.first].i <= LEAF[b.last].i && (o.closed ? LEAF[o.last].i : 1e9) >= LEAF[b.first].i);
  const canons = [...new Set(leaves.map(L=>L.canon))].map(c=>ROMAN[c]);
  head({l:`<b><span class="hide-s">${bookTitle(b)}</span><span class="show-s">${bookShort(b)}</span></b> · opening`, r:`<span class="hide-s">Book ${ROMAN[b.i]} · </span>${b.hstart} AH · ${b.start.slice(0,4)}`,
        color:rub(id), prev: SEQ[i-1]?hrefOf(SEQ[i-1]):"#/", next: hrefOf(SEQ[i+1])});
  return `<article class="opening" style="--rub:${rub(id)}">
    <div class="bnum">Book ${ROMAN[b.i]} of ${D.books.length}</div>
    <span class="ar">${b.titleArabic}</span>
    <h1>${bookTitle(b)}</h1>
    <div class="span">${b.hstart}–${b.hend||"…"} AH · ${b.startStr} – ${b.endStr||"written as it happens"}</div>
    <p class="summary">${inline(b.summary)}</p>
    <div class="meta">${b.leaves} leaves · ${b.words.toLocaleString("en")} words · in Canon${canons.length>1?"s":""} ${canons.join(", ")}${beside.length?` · runs beside ${beside.map(o=>`<a href="#/book/${o.id}" style="color:${rub(o.id)}">${bookTitle(o).replace(/^The /,"the ")}</a>`).join(", ")}`:""}</div>
    <ol>${leaves.map(L=>`<li><a href="#/leaf/${L.addr}"><span class="a">${addrShow(L.addr)}</span><span class="t">${esc(L.title)}</span></a></li>`).join("")}</ol>
    <p class="rubric" style="margin-top:2rem !important">Here begins ${bookTitle(b).replace(/^The /,"the ")}.</p>
    ${catchwords(it)}
  </article>`;
}

function viewLeaf(addr){
  const L = LEAF[addr]; if (!L) return viewContents();
  const b = BOOK[L.book]; const it = {type:"leaf", addr}; const i = SEQI[seqKey(it)];
  const r = reignAt(L.date);
  store.set("codex-ribbon", addr); store.set("codex-here", addr);
  head({l:`<b><span class="hide-s">${bookTitle(b)}</span><span class="show-s">${bookShort(b)}</span></b><span class="hide-s"> · ${r?"reign of "+esc(r.name):""}</span>`,
        r:`${L.hy} AH · ${L.w}<span class="hide-s"> · leaf ${L.n} of ${D.leaves.length}</span>`,
        color:rub(L.book), prev: SEQ[i-1]?hrefOf(SEQ[i-1]):"#/", next: SEQ[i+1]?hrefOf(SEQ[i+1]):null});
  const pt = prevInThread(L);
  const closing = b.closed && b.last===L.addr;
  const latest = !b.closed && b.last===L.addr;
  return `<article class="leaf" style="--rub:${rub(L.book)}"><div class="leafgrid"><div class="text">
    <div class="lhead"><span class="addr sc">Leaf ${addrShow(L.addr)}</span><span>${bookShort(b)}, leaf ${L.bn} of ${b.leaves}</span></div>
    <h1>${esc(L.title)}</h1>
    <div class="dates"><span class="h">${L.hdateStr} AH</span> · ${L.dateStr}</div>
    <div class="slot mslot"><b>Glosses</b>On a phone the glosses open as sheets from the names in the text. Reserved for the annotated-edition design.</div>
    <div class="prose">${renderBody(L)}</div>
    ${closing ? `<div class="explicit"><b>Explicit · ${bookTitle(b)}</b>${b.leaves} leaves · ${b.words.toLocaleString("en")} words · ${b.hstart}–${b.hend} AH · ${b.start.slice(0,4)}–${b.end.slice(0,4)}</div>` : ""}
    ${latest ? `<div class="explicit"><b>${bookTitle(b)} continues</b>written as it happens · ${b.leaves} leaves so far</div>` : ""}
    <div class="slot foot"><b>Apparatus</b>${L.sources.length} sources · ${L.people.length} people · ${L.places.length} places. Sources, their provenance (read, estimated or invented) and the player's note sit here. Reserved for the annotated-edition design.</div>
    ${catchwords(it)}
    <div class="prevnext"><a href="${SEQ[i-1]?hrefOf(SEQ[i-1]):"#/"}">‹ previous in the codex</a>${pt?`<a href="#/leaf/${pt.addr}">‹ previous in ${bookShort(b)}</a>`:`<a href="#/book/${b.id}">‹ opening of ${bookShort(b)}</a>`}<a href="#/" data-back="1">find it in the tables</a></div>
    <div class="leafcolophon">${L.words} words · read from ${quireOf(L)}</div>
  </div><aside class="margin"><div class="slot"><b>Outer margin</b>Reserved for the glosses of the annotated-edition design (people, places, wars at first mention). This leaf names ${L.people.length} people and ${L.places.length} places.</div></aside></div></article>`;
}
function quireOf(L){
  const q = D.quires.findIndex(q=>q.leaves.includes(L.addr));
  const Q = D.quires[q];
  return Q.save ? `quire ${q+1}, the save of ${Q.saveStr}` : `quire ${q+1}, after the last save in the record`;
}

function viewColophon(){
  const first = D.leaves[0], last = D.leaves[D.leaves.length-1];
  const words = D.leaves.reduce((a,L)=>a+L.words,0);
  head({l:`<b class="sc">Colophon</b>`, r:`${D.quires.length} quires`, color:"var(--ink)", prev:"#/leaf/"+last.addr, next:null});
  return `<article class="colo"><h1>Colophon</h1>
  <p class="lead">Here the book stands at ${D.leaves.length} leaves in eight books, ${words.toLocaleString("en")} words, from ${first.hdateStr} AH (${first.dateStr}) to ${last.hdateStr} AH (${last.dateStr}). ${D.books.filter(b=>b.closed).length} books are closed and ${D.books.filter(b=>!b.closed).length} are written as it happens. It is set down by Trent, with an AI collaborator, after each session of play, in the voice of the Naṣrid court.</p>
  <table><thead><tr><th>Quire</th><th>Read from</th><th>Leaves</th></tr></thead><tbody>
  ${D.quires.map((q,i)=>`<tr><td>${i+1}</td><td>${q.save?`the save of ${q.saveStr}`:"after the last save in the record"}</td><td class="q">${q.leaves.map(a=>`<a href="#/leaf/${a}" style="color:${rub(LEAF[a].book)}" title="${esc(LEAF[a].title)}">${addrShow(a)}</a>`).join("")}</td></tr>`).join("")}
  </tbody></table>
  <p class="note">The real colophon is a session log: one line per binding, with the date bound, the leaves added and any book opened or closed. The brief's folder carries no session dates, so this mockup groups the leaves by the save each was read from. A build would take the binding dates from the repository's commit history.</p>
  </article>`;
}

// ---------- router ----------
function route(){
  const h = location.hash.replace(/^#\/?/,"");
  const [kind, arg] = h.split("/");
  let html;
  const prevHere = store.get("codex-here");
  if (kind==="leaf") html = viewLeaf(arg);
  else if (kind==="book") html = viewBook(arg);
  else if (kind==="colophon") html = viewColophon();
  else html = viewContents();
  $("#app").innerHTML = html;
  if (kind==="leaf" || kind==="book" || kind==="colophon") window.scrollTo(0,0);
  else {
    const fb = $("#foldbox"); if (fb) fb.onchange = ()=>{ document.body.classList.toggle("fold", fb.checked); store.set("codex-fold", fb.checked?"1":"0"); };
    const tgt = prevHere && (document.getElementById("c-"+prevHere)?.offsetParent ? document.getElementById("c-"+prevHere) : document.getElementById("p-"+prevHere));
    if (tgt && sessionStorage.getItem("codex-back")==="1") {
      const dec = tgt.closest(".dec,.pdecw"); if (dec) dec.classList.add("open");
      tgt.scrollIntoView({block:"center"});
    } else window.scrollTo(0,0);
  }
  try{ sessionStorage.setItem("codex-back", kind==="leaf"?"1":"0"); }catch(e){}
  document.querySelectorAll(".cw[data-way]").forEach(a=>a.addEventListener("click",()=>{
    const w=a.dataset.way; if (w!=="both") store.set("codex-way", w); }));
}
window.addEventListener("hashchange", route);
document.addEventListener("keydown", e=>{
  if (e.target.closest("input,textarea")) return;
  if (e.key==="ArrowRight"){ const n=$("#rh-next"); if (!n.classList.contains("dis")) location.hash=n.getAttribute("href"); }
  if (e.key==="ArrowLeft"){ const p=$("#rh-prev"); if (!p.classList.contains("dis")) location.hash=p.getAttribute("href"); }
});
$("#theme").onclick = ()=>{
  const cur = document.documentElement.getAttribute("data-theme") ||
    (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  const nx = cur==="dark" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", nx); store.set("codex-theme", nx);
};
{ const t = store.get("codex-theme"); if (t) document.documentElement.setAttribute("data-theme", t); }
if (store.get("codex-fold")==="1") document.body.classList.add("fold");
route();
</script>
</body>
