<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Codex</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Gentium+Book+Plus:ital@0;1&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#efe6d2; --paper:#faf5ea; --ink:#2b2219; --muted:#6f6352; --faint:#9a8d77; --rule:#d9cdb4; --rule2:#e8dfcb;
  --ribbon:#a8262b;
  --b0:#b23a26; --b1:#2b4c8c; --b2:#6a3d6e; --b3:#2d7558; --b4:#96501f; --b5:#1d6b7d; --b6:#8e2346; --b7:#8f6a0e;
  --serif:"EB Garamond","Gentium Book Plus",Georgia,serif;
  --arabic:"Amiri","Noto Naskh Arabic",serif;
  --rub:var(--ink);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#13110e; --paper:#1c1915; --ink:#e9dfcb; --muted:#a69a84; --faint:#7d725f; --rule:#3a332a; --rule2:#2a251f;
    --ribbon:#e0575b;
    --b0:#e3765f; --b1:#8aa8e6; --b2:#c49ac8; --b3:#72c49f; --b4:#dd9760; --b5:#67bccf; --b6:#e27e9e; --b7:#d9b24c;
  }
}
:root[data-theme="dark"]{
  --bg:#13110e; --paper:#1c1915; --ink:#e9dfcb; --muted:#a69a84; --faint:#7d725f; --rule:#3a332a; --rule2:#2a251f;
  --ribbon:#e0575b;
  --b0:#e3765f; --b1:#8aa8e6; --b2:#c49ac8; --b3:#72c49f; --b4:#dd9760; --b5:#67bccf; --b6:#e27e9e; --b7:#d9b24c;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--serif);font-size:19px;line-height:1.55;
  font-feature-settings:"onum" 1,"kern" 1}
a{color:inherit}
.sc{font-variant:small-caps;letter-spacing:.06em;font-feature-settings:"c2sc" 0,"smcp" 1}
.ar{font-family:var(--arabic);direction:rtl;unicode-bidi:isolate;font-feature-settings:normal}
.wash{background:color-mix(in srgb,var(--rub) 9%,transparent)}

/* ---------- running head ---------- */
#rhead{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 92%,transparent);
  backdrop-filter:blur(6px);border-bottom:1px solid var(--rule)}
#rhead .in{max-width:1180px;margin:0 auto;padding:.45rem 16px;display:flex;align-items:center;gap:.9rem;font-size:.82rem}
#rhead .bar{position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--rub);opacity:.85}
#rhead .l{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#rhead .l b{color:var(--rub);font-weight:600}
#rhead .r{white-space:nowrap;color:var(--muted)}
#rhead nav{display:flex;gap:.25rem}
#rhead nav a,#rhead nav button{font:inherit;font-size:.82rem;color:var(--ink);background:none;border:1px solid var(--rule);
  border-radius:3px;padding:.15rem .55rem;cursor:pointer;text-decoration:none;line-height:1.4}
#rhead nav a:hover,#rhead nav button:hover{border-color:var(--rub)}
#rhead nav .dis{opacity:.3;pointer-events:none}

main{max-width:1180px;margin:0 auto;padding:0 16px 5rem}

/* ---------- contents ---------- */
.titlepage{text-align:center;padding:3.2rem 0 1.6rem}
.titlepage .ar{font-size:2.4rem;color:var(--b3);line-height:1.4}
.titlepage h1{font-weight:500;font-size:2.4rem;margin:.1rem 0 .2rem;letter-spacing:.01em;line-height:1.15}
.titlepage .sub{color:var(--muted)}
.howto{max-width:40rem;margin:1.1rem auto 0;color:var(--muted);font-size:.95rem}
.ways{display:flex;gap:.6rem;justify-content:center;flex-wrap:wrap;margin-top:1.2rem}
.btn{display:inline-block;border:1px solid var(--rule);background:var(--paper);padding:.4rem .9rem;border-radius:3px;
  text-decoration:none;font-size:.95rem;cursor:pointer;font-family:inherit;color:var(--ink)}
.btn:hover{border-color:var(--ink)}
.btn.ribbon{border-color:var(--ribbon);color:var(--ribbon)}
.btn small{color:var(--muted)}

h2.sect{font-weight:500;font-size:1.05rem;text-align:center;margin:2.6rem 0 .8rem;color:var(--muted)}
h2.sect span{font-variant:small-caps;letter-spacing:.12em}

.strip{background:var(--paper);border:1px solid var(--rule);padding:.8rem .8rem .4rem;border-radius:2px}
.strip svg{width:100%;height:auto;display:block}
.strip .legend{display:flex;flex-wrap:wrap;gap:.2rem .9rem;font-size:.78rem;color:var(--muted);margin-top:.4rem}
.strip .legend i{display:inline-block;width:.7em;height:.7em;border-radius:1px;margin-right:.3em;vertical-align:-.05em}

.controls{display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap;margin:1.6rem 0 .4rem;font-size:.9rem;color:var(--muted)}
.toggle{display:inline-flex;gap:.4rem;align-items:center;cursor:pointer}
.toggle input{accent-color:var(--ink)}

.canon{background:var(--paper);border:1px solid var(--rule);margin:1.4rem 0 2rem;border-radius:2px;
  box-shadow:0 1px 0 var(--rule2),0 8px 24px -18px rgba(0,0,0,.35)}
.canon>header{display:flex;align-items:baseline;gap:1rem;flex-wrap:wrap;padding:.9rem 1.1rem .5rem;border-bottom:1px solid var(--rule)}
.canon>header h3{margin:0;font-weight:500;font-size:1.25rem}
.canon>header .span{color:var(--muted);font-size:.9rem}
.canon>header .books{margin-left:auto;font-size:.85rem}

/* desktop grid */
.cgrid{display:grid;grid-template-columns:7.2rem repeat(var(--n),minmax(0,1fr))}
.chead{padding:.9rem .5rem 0}
.arch{border:1px solid var(--rub);border-bottom:none;border-radius:999px 999px 0 0/2.4rem 2.4rem 0 0;text-align:center;
  padding:1.1rem .4rem .45rem;background:color-mix(in srgb,var(--rub) 7%,transparent);text-decoration:none;display:block}
.arch .ar{font-size:1.3rem;color:var(--rub);line-height:1.3;display:block}
.arch .en{font-size:.82rem;font-variant:small-caps;letter-spacing:.06em;display:block}
.arch .ct{font-size:.72rem;color:var(--muted)}
.gut{padding:.5rem .7rem .5rem 1.1rem;font-size:.82rem;color:var(--muted);border-top:1px solid var(--rule2);text-align:right}
.gut b{display:block;color:var(--ink);font-weight:500;font-size:.95rem}
.cell{padding:.35rem .5rem;border-top:1px solid var(--rule2);min-width:0}
.cell.open{border-left:1px solid color-mix(in srgb,var(--rub) 45%,transparent);border-right:1px solid color-mix(in srgb,var(--rub) 45%,transparent);
  background:color-mix(in srgb,var(--rub) 3%,transparent)}
.lf{display:block;text-decoration:none;padding:.22rem .35rem;border-radius:2px;position:relative;font-size:.86rem;line-height:1.3}
.lf:hover{background:color-mix(in srgb,var(--rub) 12%,transparent)}
.lf .d{display:block;font-size:.72rem;color:var(--rub);font-variant:small-caps;letter-spacing:.05em}
.lf .t{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.lf.here{outline:1px solid var(--rub)}
.lf.rib::after{content:"";position:absolute;right:-.15rem;top:-.35rem;width:.55rem;height:1.5rem;background:var(--ribbon);
  clip-path:polygon(0 0,100% 0,100% 100%,50% 78%,0 100%)}
.chip{display:block;font-size:.72rem;color:var(--rub);text-decoration:none;text-align:center;border:1px dashed color-mix(in srgb,var(--rub) 60%,transparent);
  border-radius:2px;padding:.1rem .3rem;margin:.15rem .2rem}
.chip.end{border-style:solid}
.full{grid-column:1/-1}
.lacuna{padding:.3rem 1.1rem;border-top:1px solid var(--rule2);font-size:.8rem;color:var(--faint);font-style:italic;
  background:repeating-linear-gradient(135deg,transparent 0 6px,color-mix(in srgb,var(--rule) 35%,transparent) 6px 7px)}
.reignrule{border-top:1px solid var(--ink);padding:.25rem 1.1rem .2rem;font-size:.8rem;display:flex;gap:.6rem;align-items:baseline}
.reignrule b{font-weight:600;font-variant:small-caps;letter-spacing:.08em}
.reignrule span{color:var(--muted)}
.decsum{display:none;cursor:pointer}
.decsum:hover .gut,.decsum:hover .cell{background:color-mix(in srgb,var(--ink) 4%,transparent)}
.dots{font-size:.8rem;color:var(--rub);letter-spacing:.08em;padding:.35rem .5rem}
.dots small{color:var(--muted);letter-spacing:0;margin-left:.3rem}
body.fold .dec:not(.open) .yr{display:none}
body.fold .decsum{display:contents}
body.fold .dec.open .decsum .gut{color:var(--ink)}
.dec{display:contents}

/* phone list (lanes) */
.plist{display:none}
.pyr{border-top:1px solid var(--rule2);padding:.25rem 0}
.plabel{font-size:.76rem;color:var(--muted);padding:.2rem 12px 0}
.plabel b{color:var(--ink);font-weight:500}
.pleaf{display:flex;gap:.55rem;text-decoration:none;padding:.3rem 12px .3rem 0;align-items:stretch;position:relative}
.lanes{display:flex;flex:none;padding-left:8px}
.lane{width:11px;position:relative}
.lane.open::before{content:"";position:absolute;left:5px;top:-.35rem;bottom:-.35rem;width:1px;background:var(--lc);opacity:.55}
.lane.on::after{content:"";position:absolute;left:1.5px;top:.42rem;width:8px;height:8px;border-radius:50%;background:var(--lc)}
.lane.start::before{top:.6rem}
.ptext{font-size:.92rem;line-height:1.3;min-width:0}
.ptext small{display:block;font-size:.72rem;color:var(--rub);font-variant:small-caps;letter-spacing:.05em}
.pleaf.rib::after{content:"";position:absolute;right:6px;top:-.2rem;width:.5rem;height:1.3rem;background:var(--ribbon);
  clip-path:polygon(0 0,100% 0,100% 100%,50% 78%,0 100%)}
.pleaf.here{background:color-mix(in srgb,var(--rub) 10%,transparent)}
.pchip{font-size:.72rem;color:var(--rub);padding:.1rem 12px .1rem 0;display:flex;gap:.55rem;text-decoration:none}
.plac{font-size:.76rem;color:var(--faint);font-style:italic;padding:.3rem 12px;border-top:1px solid var(--rule2);
  background:repeating-linear-gradient(135deg,transparent 0 6px,color-mix(in srgb,var(--rule) 35%,transparent) 6px 7px)}
.preign{border-top:1px solid var(--ink);font-size:.76rem;padding:.2rem 12px}
.preign b{font-variant:small-caps;letter-spacing:.08em;margin-right:.4rem}
.preign span{color:var(--muted)}
.pdec{display:none;padding:.35rem 0;border-top:1px solid var(--rule2);cursor:pointer}
body.fold .pdecw:not(.open) .pyrs{display:none}
body.fold .pdec{display:flex}

.tabula{columns:2 22rem;column-gap:2rem;background:var(--paper);border:1px solid var(--rule);padding:1rem 1.2rem}
.tabula a{display:flex;gap:.7rem;break-inside:avoid;text-decoration:none;padding:.45rem 0;border-bottom:1px solid var(--rule2);align-items:baseline}
.tabula .num{color:var(--rub);font-variant:small-caps;width:1.8rem;flex:none}
.tabula .ar{color:var(--rub);margin-left:auto;font-size:1.05rem}
.tabula small{display:block;color:var(--muted);font-size:.78rem}

/* ---------- leaf ---------- */
.leaf{background:var(--paper);border:1px solid var(--rule);margin:1.6rem auto 0;max-width:1080px;
  box-shadow:0 1px 0 var(--rule2),0 14px 40px -28px rgba(0,0,0,.45)}
.leafgrid{display:grid;grid-template-columns:minmax(0,1fr) 15rem;gap:0}
.text{padding:3rem 3.2rem 2.4rem 4.2rem;max-width:44rem}
.lhead{display:flex;justify-content:space-between;gap:1rem;font-size:.8rem;color:var(--muted);border-bottom:1px solid var(--rule);padding-bottom:.35rem}
.lhead .addr{color:var(--rub)}
.leaf h1{font-weight:500;font-size:1.75rem;line-height:1.2;margin:1.3rem 0 .4rem;text-wrap:balance}
.leaf .dates{color:var(--muted);font-size:.92rem;margin-bottom:1.6rem}
.leaf .dates .h{color:var(--ink)}
.prose p{margin:0 0 .95rem;hyphens:auto;text-align:justify}
.prose p+p{text-indent:1.4em;margin-top:-.95rem;padding-top:.0rem}
.prose p.first{text-indent:0}
.prose p.first::first-letter{float:left;font-size:3.9em;line-height:.82;font-weight:500;color:var(--rub);
  padding:.12em .14em .06em;margin:.06em .16em 0 0;border:1px solid var(--rub);background:color-mix(in srgb,var(--rub) 9%,transparent)}
.prose b.runin{color:var(--rub);font-weight:600;font-variant:small-caps;letter-spacing:.04em}
.ref{text-decoration:underline dotted color-mix(in srgb,var(--rub) 55%,transparent);text-underline-offset:.18em;text-decoration-thickness:1px}
.rubric,.prose .rubric{color:var(--rub);text-align:center;font-variant:small-caps;letter-spacing:.1em;font-size:1.02rem;margin:1.2rem 0 !important;text-indent:0 !important}
.rubric.inc{margin-top:0 !important}
.verse{text-align:center;margin:2rem auto 0;max-width:30rem;text-indent:0 !important}
.star{display:block;margin:2rem auto .6rem;width:22px;height:22px;color:var(--rub)}
.verse p{margin:0;text-align:center;text-indent:0;font-size:1.02rem}
.explicit{text-align:center;margin-top:1.6rem;font-size:.86rem;color:var(--muted)}
.explicit b{color:var(--rub);font-weight:500;font-variant:small-caps;letter-spacing:.08em;display:block;font-size:.95rem}
.slot{border:1px dashed var(--faint);color:var(--faint);font-size:.78rem;line-height:1.4;padding:.7rem .8rem;border-radius:2px;font-style:italic}
.slot b{font-style:normal;font-variant:small-caps;letter-spacing:.06em;color:var(--muted);display:block;margin-bottom:.2rem}
.margin{padding:3rem 1.2rem 2rem 0}
.margin .slot{position:sticky;top:4rem;min-height:14rem}
.foot{margin-top:2.2rem}
.catch{margin-top:2rem;border-top:1px solid var(--rule);padding-top:1rem;display:grid;gap:1rem}
.cw{display:block;text-align:right;text-decoration:none;padding:.2rem 0}
.cw .lab{font-size:.74rem;color:var(--rub);font-variant:small-caps;letter-spacing:.07em}
.cw .first{display:block;font-style:italic;font-size:1.05rem}
.cw .tt{display:block;font-size:.8rem;color:var(--muted)}
.cw:hover .first{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:.2em}
.cw.shut{cursor:default}
.cw.shut .first{font-style:normal;color:var(--muted);font-size:.95rem}
.prevnext{display:flex;justify-content:space-between;font-size:.8rem;color:var(--muted);margin-top:1.4rem}
.prevnext a{text-decoration:none}
.prevnext a:hover{color:var(--ink)}
.leafcolophon{font-size:.78rem;color:var(--faint);text-align:center;margin-top:1.6rem}

/* ---------- book opening ---------- */
.opening{background:var(--paper);border:1px solid var(--rule);max-width:820px;margin:1.6rem auto 0;padding:3.4rem 3rem 2.4rem;text-align:center;
  box-shadow:0 14px 40px -28px rgba(0,0,0,.45);position:relative}
.opening::before{content:"";position:absolute;inset:10px;border:1px solid color-mix(in srgb,var(--rub) 50%,transparent);pointer-events:none}
.opening .bnum{font-variant:small-caps;letter-spacing:.14em;color:var(--muted);font-size:.85rem}
.opening .ar{font-size:3.2rem;color:var(--rub);line-height:1.5;display:block;margin:.4rem 0 0}
.opening h1{font-weight:500;font-size:2rem;margin:0 0 .3rem}
.opening .span{color:var(--muted);font-size:.95rem}
.opening .summary{text-align:justify;hyphens:auto;max-width:36rem;margin:1.8rem auto 1rem}
.opening .meta{font-size:.86rem;color:var(--muted);margin-bottom:1.6rem}
.opening ol{list-style:none;padding:0;margin:0 auto;max-width:36rem;text-align:left;border-top:1px solid var(--rule)}
.opening li a{display:flex;gap:.8rem;text-decoration:none;padding:.32rem 0;border-bottom:1px solid var(--rule2);font-size:.92rem;line-height:1.3}
.opening li .a{color:var(--rub);font-size:.78rem;width:6.2rem;flex:none;font-variant:small-caps;padding-top:.1rem}
.opening li a:hover .t{text-decoration:underline}
.opening .catch{text-align:right}

/* ---------- colophon ---------- */
.colo{background:var(--paper);border:1px solid var(--rule);max-width:820px;margin:1.6rem auto 0;padding:3rem}
.colo h1{font-weight:500;text-align:center;margin:0 0 1.4rem}
.colo .lead{text-align:center;font-style:italic;max-width:34rem;margin:0 auto 2rem}
.colo table{width:100%;border-collapse:collapse;font-size:.88rem}
.colo td,.colo th{text-align:left;vertical-align:top;padding:.4rem .5rem;border-bottom:1px solid var(--rule2)}
.colo th{font-weight:500;color:var(--muted);font-variant:small-caps;letter-spacing:.06em}
.colo .q a{display:inline-block;text-decoration:none;color:var(--rub);margin:0 .5rem .1rem 0;white-space:nowrap}
.note{font-size:.84rem;color:var(--muted);border-left:2px solid var(--rule);padding-left:.8rem;margin:1.4rem 0}

/* ---------- phone ---------- */
@media (max-width:760px){
  body{font-size:18px}
  .cgrid{display:none}
  .plist{display:block}
  .canon>header .books{margin-left:0}
  .leafgrid{grid-template-columns:1fr}
  .margin{display:none}
  .text{padding:1.6rem 18px 1.6rem}
  .leaf{margin:.8rem -16px 0;border-left:none;border-right:none}
  .leaf h1{font-size:1.45rem}
  .prose p{text-align:left}
  .opening{padding:2.4rem 1.2rem 1.6rem;margin:.8rem -16px 0;border-left:none;border-right:none}
  .opening .ar{font-size:2.4rem}
  .opening h1{font-size:1.6rem}
  .colo{padding:1.6rem 18px;margin:.8rem -16px 0}
  .titlepage{padding-top:2rem}
  .titlepage h1{font-size:1.8rem}
  #rhead .hide-s{display:none}
  #rhead .show-s{display:inline}
  .mslot{display:block !important}
}
.mslot{display:none;margin:-0.2rem 0 1.4rem}
.show-s{display:none}
</style>
</head>

<button id="theme" title="Light or dark">◐</button></nav></div><div class="bar"></div></header>

<script>
const D = {"hmonths": ["Muḥarram", "Ṣafar", "Rabīʿ al-Awwal", "Rabīʿ al-Thānī", "Jumādā al-Ūlā", "Jumādā al-Ākhira", "Rajab", "Shaʿbān", "Ramaḍān", "Shawwāl", "Dhū al-Qaʿda", "Dhū al-Ḥijja"], "books": [{"id": "book-of-mending", "title": "The Mending of the State", "titleArabic": "كتاب الإصلاح", "start": "1337-04-01", "end": "1346-10-16", "summary": "The calm before the storm. A young sultan, tributary to Castile and deep in debt, sets the state in order: the Catalan privileges, the war on Aragon and the peace of Balansiyya, the two ṭāʾifas of the east, Morocco's defeat of 1340, the Jamāʿa of 1344 and the crown it strengthened, and the debt paid down. It ends the day Morocco declares war again.", "leaves": 12, "words": 5313, "first": "738-01-02", "last": "747-06-28", "closed": true, "hstart": 737, "hend": 747, "startStr": "1 April 1337", "endStr": "16 October 1346"}, {"id": "book-of-balance", "title": "The Balance", "titleArabic": "كتاب الميزان", "start": "1346-08-01", "end": "1370-09-14", "summary": "Granada on the scales between the three crowns of Iberia and the Marīnids, from the season sovereignty first slipped below 50. The war of 1346 brought five great victories, the Peace of Qurṭuba (January 1349) and the quiet bargain for Qarmūna and the silver of Qusanṭīna (May 1351). Morocco's surrender in June 1351 ended its alliance and its foothold on this shore. The War of Independence (1363–1366) broke Castile's hold. When the Marīnids took the north shore and came again, the Second Marīnid War (1368–1370) drove them from it. On 14 September 1370 the Battle for the Strait ended: the Throne of Granada endures.", "leaves": 24, "words": 12736, "first": "747-07-01b", "last": "772-02-21", "closed": true, "hstart": 747, "hend": 772, "startStr": "1 August 1346", "endStr": "14 September 1370"}, {"id": "book-of-pestilence", "title": "The Pestilence", "titleArabic": "كتاب الوباء", "start": "1346-08-01", "end": "1352-01-27", "summary": "The Black Death, from the first rumours out of the east in 1346 and the hospitals the amir raised against it in Gharnāṭa, Mālaqa and al-Mariyya, to the day it left the last town of the realm, 27 January 1352, the Day of ʿArafa on which the amir stood on the plain. Its heart is the reshaping of Granada itself: the most urban realm in Iberia, two in five of its people living in cities where Castile had one in twenty, lost 42% of its people in four years, the cities and their burghers and scholars worst of all, hospitals or no. Ran beside the Book of the Balance.", "leaves": 6, "words": 2637, "first": "747-07-01a", "last": "752-12-09", "closed": true, "hstart": 747, "hend": 752, "startStr": "1 August 1346", "endStr": "27 January 1352"}, {"id": "book-of-the-call", "title": "The Call", "titleArabic": "كتاب الدعوة", "start": "1356-10-01", "end": null, "summary": "Education and the return of Islam to al-Andalus as the Emirate grows: roads through the mountains, libraries in the cities of the south and then the north, and the slow reconversion of Qurṭuba and the valley of the great river, purged of Islam and of Andalusī culture during the Castilian occupation. Written as it happens.", "leaves": 18, "words": 10318, "first": "758-07-12", "last": "844-05-04", "closed": false, "hstart": 757, "hend": null, "startStr": "1 October 1356", "endStr": null}, {"id": "book-of-the-marches", "title": "The Marches", "titleArabic": "كتاب الثغور", "start": "1370-09-14", "end": "1430-11-03", "summary": "Granada looks north. The old thughūr, the marches of al-Andalus that faced the Christian kingdoms (the Lower March of Badajoz and Mérida, the Middle March of Toledo, the Upper March of Zaragoza), are the frontier again, with Lisbon and Barcelona at the borders of the ṭāʾifas and Castile the one equal left. The book follows the six wars of the Istirdād, from the Upper March (1373) through the Restoration of al-Andalus, the League and the War of Jillīqiya that ended Portugal and broke Castile, to the Wars of Shant Yāqub and of the Mountains. It closes at the Peace of Ṣafar, 3 November 1430, when Galicia, Navarre and the last of Castile were annexed and the whole peninsula belonged to the Emperor and his ṭāʾifas.", "leaves": 29, "words": 23043, "first": "772-02-22", "last": "834-02-16b", "closed": true, "hstart": 772, "hend": 834, "startStr": "14 September 1370", "endStr": "3 November 1430"}, {"id": "book-of-the-encircling-sea", "title": "The Encircling Sea", "titleArabic": "كتاب البحر المحيط", "start": "1379-04-25", "end": null, "summary": "Al-Andalus turns to the sea and to trade. From the Jamāʿa of 1379, which moved the court to Ishbīliya for its river and its market, through the fleet and its admiral the crown prince, the Ḥisba and the banks, the arms trade with Mali and the voyage down the African coast toward it, to the islands of the Ocean: the Azores, Madeira and the Canaries. Behind it, the crown's building: lumber mills and iron smelters, workshops and markets, cotton fields and bathhouses. It is the road toward the Age of Discovery. Written as it happens.", "leaves": 13, "words": 6648, "first": "781-08-13", "last": "841-10-12", "closed": false, "hstart": 781, "hend": null, "startStr": "25 April 1379", "endStr": null}, {"id": "book-of-the-franks", "title": "The Franks", "titleArabic": "كتاب الإفرنج", "start": "1430-11-03", "end": null, "summary": "Christendom answers. With the Peace of Ṣafar the whole of Iberia belongs to the Emperor and his ṭāʾifas, and for the first time since the Arabs crossed the Strait the peninsula is a Muslim land from end to end. The book follows Europe's reaction and the wars that follow it, beginning with the destruction of Santiago's shrine coming home: the Emperor's warmonger's name, and the second crusade against al-Andalus, proclaimed in October 1431. Written as it happens.", "leaves": 3, "words": 2139, "first": "835-08-29b", "last": "844-01-09", "closed": false, "hstart": 834, "hend": null, "startStr": "3 November 1430", "endStr": null}, {"id": "book-of-the-golden-century", "title": "The Golden Century", "titleArabic": "كتاب القرن الذهبي", "start": "1442-06-01", "end": null, "summary": "The new era. It opens with the Emperor's Jamāʿa of 846, which seated the burghers beside the umarāʾ and the ʿulamāʾ, and the reforms that spread from it across the realm, and with the Golden Century of al-Andalus proclaimed on 7 August 1442: Iberia gathered under one banner, the Strait held, and a century of wealth and consolidation ahead, watched by a Europe that may yet ally against it. Written as it happens.", "leaves": 3, "words": 1512, "first": "846-01-21", "last": "847-02-27", "closed": false, "hstart": 846, "hend": null, "startStr": "1 June 1442", "endStr": null}], "canons": [{"cols": ["book-of-mending"], "first": "738-01-02", "last": "747-06-28", "hy0": 738, "hy1": 747}, {"cols": ["book-of-balance", "book-of-pestilence"], "first": "747-07-01a", "last": "752-12-09", "hy0": 747, "hy1": 752}, {"cols": ["book-of-balance", "book-of-the-call"], "first": "753-02-20a", "last": "772-02-21", "hy0": 753, "hy1": 772}, {"cols": ["book-of-the-call", "book-of-the-marches", "book-of-the-encircling-sea"], "first": "772-02-22", "last": "834-02-16b", "hy0": 772, "hy1": 834}, {"cols": ["book-of-the-call", "book-of-the-encircling-sea", "book-of-the-franks", "book-of-the-golden-century"], "first": "835-08-29a", "last": "847-02-27", "hy0": 835, "hy1": 847}], "hy": {"737": [1336, 1337], "738": [1337, 1338], "739": [1338, 1339], "740": [1339, 1340], "741": [1340, 1341], "742": [1341, 1342], "743": [1342, 1343], "744": [1343, 1344], "745": [1344, 1345], "746": [1345, 1346], "747": [1346, 1347], "748": [1347, 1348], "749": [1348, 1349], "750": [1349, 1350], "751": [1350, 1351], "752": [1351, 1352], "753": [1352, 1353], "754": [1353, 1354], "755": [1354, 1355], "756": [1355, 1356], "757": [1356, 1356], "758": [1356, 1357], "759": [1357, 1358], "760": [1358, 1359], "761": [1359, 1360], "762": [1360, 1361], "763": [1361, 1362], "764": [1362, 1363], "765": 738, "hm": 1, "hd": 2, "w": 1337, "title": "Of the Spring of the Year 737, and the Marīnid War upon Qashtāla", "date": "1337-07-31", "dateStr": "31 July 1337", "hdateStr": "2 Muḥarram 738", "book": "book-of-mending", "people": ["yusuf-i", "fatima-bint-al-ahmar", "faraj-ibn-ismail", "yusuf-ibn-muhammad", "ismail-i"], "places": ["gharnata", "tilimsan", "fas"], "sources": ["1337-04-03-death-fatima", "1337-04-22-joins-tlemcen-war", "1337-04-25-peace-tlemcen", "1337-05-01-strait-begins", "1337-05-01-parias", "1337-05-03-tunis-marriage", "1337-07-09-promote-sovereignty", "1337-07-31-morocco-war-on-castile"], "words": 534, "catch": "In the name of Allāh, the Merciful, the Compassionate. Here begins", "canon": 0, "body": "In the name of Allāh, the Merciful, the Compassionate. Here begins the account of the reign of our lord the sultan Abū al-Ḥajjāj [Yūsuf](person:yusuf-i), son of [Ismāʿīl](person:ismail-i), may Allāh make his days a garden and his banners a shade. He sat in the Alhambra above [Gharnāṭa](place:gharnata) in the nineteenth year of his age, and the realm he held was eighteen towns and their districts, close to four hundred and fifty thousand souls. It was a jewel set in a narrow ring, with Qashtāla pressing on the north and the sea at its back.\n\nOn the first night of Ramaḍān there passed from this world the lady [Fāṭima bint al-Aḥmar](person:fatima-bint-al-ahmar), daughter of the sultan Muḥammad al-Faqīh, mother of Ismāʿīl and grandmother of our lord. She had seen seventy-six years and seven reigns, and she went out with the crescent of the fast. *Every soul shall taste death*, but few are given so fitting an hour to taste it.\n\nIn that same month there came a call from [Fās](place:fas). The Marīnid sultan Abū al-Ḥasan ʿAlī, lord of the Maghrib al-Aqṣā, had made war two years since upon the Banū ʿAbd al-Wād of [Tilimsān](place:tilimsan), and now he called on his ally across the water. On the twentieth of Ramaḍān our lord gave his answer and his word, and three days later [the war](war:fate-of-tlemcen) was ended. Tilimsān bowed its head and became a fief of the Marīnids. Not one Andalusī fell, for the matter was settled before our men had left their homes. Yet the court remembered that the word had been given, and so did Fās.\n\nWith the end of Ramaḍān the old contest over the Strait took on a new and sharper form, the one the clerks of the dīwān name its *battle*. On the first day of the contest the tribute owed to Qashtāla was fixed anew as *parias*, gold weighed out for the infidel king Alfonso. On the morning of ʿĪd al-Fiṭr itself, as the city broke its fast, a royal marriage joined our house to the Ḥafṣids of Tūnis, so that the realm might stand upon more than one shore.\n\nThe dīwān was filled. Our lord set his elder brother [Faraj ibn Ismāʿīl](person:faraj-ibn-ismail), now named heir, to strengthen the government. On the Day of ʿArafa he charged his cousin [Yūsuf ibn Muḥammad](person:yusuf-ibn-muhammad), a man with a rare gift for embassies and plain gifts in all else, with the defence of Granadan sovereignty.\n\nThen, on the second day of Muḥarram in the year 738, with the new year barely begun, Abū al-Ḥasan declared [war](war:moroccan-castilian-war) upon Qashtāla to reclaim al-Andalus, and Tilimsān marched under his banner. The alliance gives Abū al-Ḥasan the right to summon our lord, and he has not yet done so. Our lord is bound by tribute to the one side and by his word to the other. As this is written, the sovereignty of Gharnāṭa stands a hair above the half, by the reckoning of the scribes, and the pull of the two shores leans toward Qashtāla. Between the lion of Fās and the castle of Qashtāla lies a strait one may cross in an afternoon, and Gharnāṭa stands upon its shore and waits. *And Allāh is the best of planners.*"}, {"addr": "739-11-14", "slug": "0739-11-14-the-road-through-mursiyya", "n": 2, "bn": 2, "hy": 739, "hm": 11, "hd": 14, "w": 1339, "title": "Of the Road through Mursiyya, and the Host of Ibn al-Khaṭīb", "date": "1339-05-24", "dateStr": "24 May 1339", "hdateStr": "14 Dhū al-Qaʿda 739", "book": "book-of-mending", "people": ["yusuf-i", "ibn-al-khatib", "gideon-ben-joshua"], "places": ["gharnata", "mursiyya", "ishbiliyya", "qarmuna", "shaluqa"], "sources": ["1338-11-01-battle-ishbiliyya", "1338-11-09-tunis-joins", "1339-02-03-alliance-tunis", "1339-02-28-battle-shaluqa", "1339-03-10-battle-ishbiliyya", "1339-03-25-battle-qarmuna", "1339-04-06-battle-shaluqa", "1339-05-14-death-gideon", "1339-05-24-cb-aragon", "1339-05-24-murcia-held", "1339-05-24-war-on-aragon", "1339-05-24-ibn-al-khatib-commands"], "words": 380, "catch": "Of the war that the Marīnid sultan made upon Qashtāla, there", "canon": 0, "body": "Of the war that the Marīnid sultan made upon Qashtāla, there is little to tell that gladdens the heart. In Rabīʿ al-Thānī of the year 739 the Castilians met the men of Fās beneath the walls of [Ishbīliya](place:ishbiliyya), nearly eighteen thousand against fewer than four, and the field was theirs. That winter and spring they won again at [Shalūqa](place:shaluqa), at Ishbīliya a second time, at [Qarmūna](place:qarmuna), where six hundred men of the Maghrib stood against twelve thousand, and at Shalūqa once more. Five times the infidel prevailed, and five times the banners of the Maghrib went back across the plain. Tūnis entered the war in that same Rabīʿ, bringing Ṭarābulus, Qābis, Qafṣa, Tuqqurt and Bijāya behind it. On the twenty-second of Rajab our lord bound himself to the Ḥafṣids by alliance, as he was already bound to them by marriage.\n\nYet Allāh gives openings where men see only walls. While the Castilian hosts were busy in the west, the Tunisians took [Mursiyya](place:mursiyya) with its fortress and the country around it. For a season, therefore, there ran a road from our own marches eastward to the frontiers of Arghūn, where a Christian king holds lands that were once al-Andalus. Our lord knew that such a road would not stay open long.\n\nIn the court there was one small sorrow. On the fourth of Dhū al-Qaʿda [Gideon ben Joshua](person:gideon-ben-joshua), the Jewish burgher, a man quick with figures and quicker with the cup, missed his footing on a stair and did not rise again.\n\nTen days later, on the fourteenth of Dhū al-Qaʿda in the year 739, the claim was made good. [Gharnāṭa](place:gharnata) would reclaim from Arghūn what belonged to al-Andalus, and [war](war:war-on-aragon) was proclaimed, the first that Gharnāṭa had made in its own name in this reign. Command of the host went to [Muḥammad ibn al-Khaṭīb](person:ibn-al-khatib), who was twenty-five years old and had no equal at court in counsel or in arms. Under him marched nearly ten thousand volunteers of the towns and the mountains, twelve hundred regulars of the sultan, and twelve hundred hired swords. With them went a baggage train of three hundred and fifty, so that the army might still eat when the road through Mursiyya closed behind it.\n\n*And whoever puts his trust in Allāh, He suffices him.*"}, {"addr": "740-02-26", "slug": "0740-02-26-the-ghuzat-al-mujahidin", "n": 3, "bn": 3, "hy": 740, "hm": 2, "hd": 26, "w": 1339, "title": "Of the First Blood at Jumalla, and the Coming of the Ghuzāt", "date": "1339-09-02", "dateStr": "2 September 1339", "hdateStr": "26 Ṣafar 740", "book": "book-of-mending", "people": ["yusuf-i", "ibn-al-khatib", "yahya-rahhu"], "places": ["gharnata", "mursiyya", "jumalla", "al-mariyya", "shaluqa", "muntil", "tilimsan", "al-karash"], "sources": ["1339-05-24-war-on-aragon", "1339-05-24-aragon-allies", "1339-06-13-battle-shaluqa", "1339-08-12-battle-muntil", "1339-08-18-battle-jumalla", "1339-08-23-battle-al-karash", "1339-09-01-ghuzat", "1339-09-01-yahya-general", "1339-09-02-volunteers-hired"], "words": 420, "catch": "When the war against Arghūn was proclaimed, the Christian kings came", "canon": 0, "body": "When the war against Arghūn was proclaimed, the Christian kings came to stand beside their kinsman as crows gather to one carcass: the king of Mayūrqa, the king of Nabarra, and the lord of Qalyari across the sea. [Ibn al-Khaṭīb](person:ibn-al-khatib) led the host out by the road through [Mursiyya](place:mursiyya) and made his camp there, twelve thousand six hundred strong. Most of them were *mutaṭawwiʿa*, volunteers of the towns who take up the sword for the faith.\n\nThe first blood of the war was shed at [Jumalla](place:jumalla) on the eleventh of Ṣafar in the year 740. A company of five hundred levies from [al-Mariyya](place:al-mariyya) came upon five men of Arghūn. Not one of the five lived to carry the news home, and not one of ours was scratched. It was a small thing. The poets of the court have nonetheless made a great deal of it, and the chronicle records it so that the reader may smile.\n\nThe war of the Marīnids went a little better that summer. At [Shalūqa](place:shaluqa), on the fourth of Dhū al-Ḥijja 739, the men of Fās broke a Castilian army at last. They lost three hundred and seventy and killed two thousand seven hundred. In Ṣafar, though, a Tunisian column was cut down at [Munṭīl](place:muntil). Five days after Jumalla the men of [Tilimsān](place:tilimsan), fewer than five hundred, held [al-Karash](place:al-karash) against two and a half thousand Castilians.\n\nOn the twenty-fifth of Ṣafar there came to [Gharnāṭa](place:gharnata) a great company of volunteers for the jihad, the *Ghuzāt al-Mujāhidīn*, most of them Amazigh from across the water. At their head was [Yaḥyā Raḥḥū](person:yahya-rahhu) of the Zanāta, a man of nine and thirty, bold in the fight and able in counsel, but known to bend with the wind. The dīwān warned that such men are kingmakers, and that in the contest for the Strait whoever pays their wages may come to hold the throne. Some urged the sultan to keep only those whose loyalty was certain. Our lord answered: *let these men serve, all of them.* On the next day he took the Volunteers of the Faith into his pay, ten thousand foot and twelve hundred *tornadizo* horse, and Yaḥyā rode at their head as a general of Gharnāṭa.\n\nThe treasury groans under it. Even before the volunteers came, the realm was spending fifty-one dīnārs a month against an income of twenty-seven. But the sultan has an army now such as Gharnāṭa has not seen in a generation, and he means to use it before the road through Mursiyya closes."}, {"addr": "740-05-05", "slug": "0740-05-05-the-day-of-uryula", "n": 4, "bn": 4, "hy": 740, "hm": 5, "hd": 5, "w": 1339, "title": "Of the Day of Uryūla", "date": "1339-11-08", "dateStr": "8 November 1339", "hdateStr": "5 Jumādā al-Ūlā 740", "book": "book-of-mending", "people": ["ibn-al-khatib", "yusuf-i"], "places": ["uryula"], "sources": ["1339-11-01-shadhili-order", "1339-11-08-battle-uryula", "1339-11-08-siege-uryula"], "words": 265, "catch": "At the end of Rabīʿ al-Thānī in the year 740 there", "canon": 0, "body": "At the end of Rabīʿ al-Thānī in the year 740 there came to the court a delegation of the Shādhilī shaykhs, sent from the great zāwiyas of Salā and Tiṭwān with letters from the chamber of the Marīnid sultan. They are not wanderers of the desert but men of the law and of the *Ḥikam* of Ibn ʿAṭāʾ Allāh, as easy at a merchant's table as at a palace door. They offered to found a zāwiya in our land and to lend us their brotherhood on both shores of the Strait. Our lord welcomed them, for theirs is a coin that the Christian kings cannot mint.\n\nThen Allāh gave the victory. On the fifth of Jumādā al-Ūlā the host of [Muḥammad ibn al-Khaṭīb](person:ibn-al-khatib) came down upon the Aragonese before the walls of [Uryūla](place:uryula). The infidel had eight thousand men in the field and fed more into the fight. Our army was twenty-one thousand: the *mutaṭawwiʿa* and the Volunteers of the Faith, the sultan's horse and the hired camel-riders. Their commander knew his trade, but the weight of our numbers told, and at last the Aragonese line broke and fled.\n\nSix thousand of the enemy fell or were lost, more than half his army, against four and a half thousand of ours, nearly all of them *mutaṭawwiʿa*, who stood in the first line and bore the brunt. It was the greatest victory of the reign, and the dīwān reckons that it turned the war plainly in our favour. The siege of Uryūla began that same day.\n\n*And victory comes only from Allāh, the Mighty, the Wise.*"}, {"addr": "741-01-05", "slug": "0741-01-05-the-second-battle-of-uryula", "n": 5, "bn": 5, "hy": 741, "hm": 1, "hd": 5, "w": 1340, "title": "Of the Winter before Uryūla, the Closing of the Road, and the Second Battle", "date": "1340-07-01", "dateStr": "1 July 1340", "hdateStr": "5 Muḥarram 741", "book": "book-of-mending", "people": ["ibn-al-khatib", "yahya-rahhu", "yusuf-i"], "places": ["uryula", "mursiyya"], "sources": ["1339-11-08-volunteers-withdraw", "1340-03-09-estate-loans", "1340-05-26-battle-mursiyya", "1340-05-30-uryula-falls", "1340-05-30-road-cut", "1340-05-30-nobles-discontent", "1340-06-20-second-battle-uryula"], "words": 351, "catch": "All that winter the host lay before Uryūla. When the supplies", "canon": 0, "body": "All that winter the host lay before [Uryūla](place:uryula). When the supplies ran short, the Volunteers of the Faith under [Yaḥyā Raḥḥū](person:yahya-rahhu) drew back to find bread, while [Ibn al-Khaṭīb](person:ibn-al-khatib) kept the siege lines with the rest. The sultan raised more men to carry food and paid for everything with borrowed gold. By the ninth of Ramaḍān in the year 740 the treasury owed the estates of the realm more than thirteen hundred and fifty dīnārs. The estates lent freely and asked their price in return. With every dīnār lent, their voice in the dīwān grew louder and the crown's grew fainter. By spring the nobles spoke louder in the affairs of the state than all the rest together, and the crown's own voice was barely heard.\n\nOn the second of Dhū al-Ḥijja, after nearly seven months, Uryūla opened its gates. That same week came the news that undid the joy of it. Four days earlier the Castilians had fallen on the Tlemcenī garrison of [Mursiyya](place:mursiyya) and killed seven hundred of them, and now they besieged the town. The road by which the host had come was closed. There was no way home but through the enemy, so the host stood where it was and made ready. And in the realm the nobles, their satisfaction worn thin, began to mutter in their castles.\n\nThey did not have to wait long. On the twenty-third of Dhū al-Ḥijja the kings of Nabarra, Mayūrqa and Arghūn came down together to throw the Muslims into the sea, thirteen thousand of them under the same captain who had been beaten before the same walls. Eighteen thousand of ours held the ground and the town behind them. The fight lasted into the new year. On the fifth of Muḥarram 741 the Christians broke, leaving seven and a half thousand of their number on the field. We lost two thousand three hundred. Twice now Ibn al-Khaṭīb had beaten that captain before Uryūla, and the war turned further in our favour.\n\n*Our Lord, pour upon us patience and plant firmly our feet and give us victory over the disbelieving people.*"}, {"addr": "741-02-16", "slug": "0741-02-16-the-peace-of-balansiyya", "n": 6, "bn": 6, "hy": 741, "hm": 2, "hd": 16, "w": 1340, "title": "Of the Bluff before Shāṭiba, and the Peace of Balansiyya", "date": "1340-08-11", "dateStr": "11 August 1340", "hdateStr": "16 Ṣafar 741", "book": "book-of-mending", "people": ["yusuf-i", "ibn-al-khatib"], "places": ["jumalla", "shatiba", "balansiyya", "daniya", "al-qant", "alsh", "qandiya", "al-quy", "ayura", "bunyul", "shalba", "liriya", "uryula", "gharnata"], "sources": ["1340-07-27-jumalla-falls", "1340-07-27-hunger", "1340-08-11-bluff", "1340-08-11-peace-aragon", "1340-08-11-territory", "1340-08-14-demobilised"], "words": 427, "catch": "On the first of Ṣafar in the year 741 Jumalla fell", "canon": 0, "body": "On the first of Ṣafar in the year 741 [Jumalla](place:jumalla) fell to the main army, the same town where the war had first drawn blood a year before. The host had won every battle it fought, but it was starving. Each day the quartermasters found less to put in the pot, and the road home was still closed at Mursiyya.\n\nBut the enemy did not know it. The army of Arghūn and its allies had dwindled to some six thousand men, and ours stood near sixteen thousand: the Volunteers at Alsh, [Ibn al-Khaṭīb](person:ibn-al-khatib)'s host at Jumalla. So the sultan wrote to the Aragonese king in his own hand. He did not ask for peace. He named the towns he would take in it, and told the king plainly that unless he made it, the army of [Gharnāṭa](place:gharnata) would march up the coast and burn Barshalūna to the ground. In truth the host would hardly have passed the fortress of [Shāṭiba](place:shatiba). Had the king known it, the war would have ended in ruin instead of glory. He did not know it. Allāh veiled our hunger from his eyes and showed him only our banners.\n\nOn the sixteenth of Ṣafar 741 the peace was sealed. Arghūn gave up everything south of al-Qasṭalyūn and Tīrwāl. That meant [Balansiyya](place:balansiyya) the great city, lost to the Christians a hundred and two years before, and Shāṭiba of the fortress, [Dāniya](place:daniya) and [Qandiya](place:qandiya) on the coast, [al-Qant](place:al-qant) and [Alsh](place:alsh), [al-Qūy](place:al-quy), [Ayūra](place:ayura), [Bunyūl](place:bunyul), [Shalba](place:shalba) and [Līriya](place:liriya), together with [Uryūla](place:uryula) and Jumalla, where our men had bled. He agreed as well to pay reparations for ten years, and the treasury, which had held a hundred and twenty dīnārs in Dhū al-Ḥijja, held six hundred and seventy by the day of the peace.\n\nSo the realm that had been eighteen towns grew to thirty-one, and its souls from four hundred and eighty-five thousand to six hundred and eighty-three thousand. Among them now are a hundred and forty-seven thousand Christians, Catalans and Aragonese and Castilians, who must be ruled justly if they are to be ruled at all. Three days after the peace the sultan paid the hired companies their wages early and sent them away, and put the host back on peacetime pay. The treasury fell to four hundred and seventy, but the monthly loss shrank from twenty-four dīnārs to five. The debt to the estates remains, and the nobles remain sullen. But Gharnāṭa is no longer only a jewel in a narrow ring. *Say: O Allāh, Owner of Sovereignty, You give sovereignty to whom You will.*"}, {"addr": "741-02-28", "slug": "0741-02-28-the-two-taifas", "n": 7, "bn": 7, "hy": 741, "hm": 2, "hd": 28, "w": 1340, "title": "Of the Two Ṭāʾifas", "date": "1340-08-23", "dateStr": "23 August 1340", "hdateStr": "28 Ṣafar 741", "book": "book-of-mending", "people": ["yusuf-i", "joan-doriola", "juan-manuel-enriquez", "yusuf-ibn-muhammad"], "places": ["gharnata", "balansiyya", "jumalla", "shatiba", "uryula"], "sources": ["1340-08-14-cb-independence", "1340-08-23-taifas", "1340-08-23-taifa-rulers", "1340-08-23-strengthen-government", "1340-08-28-loans-repaid", "1340-08-28-demobilised", "1340-08-28-taifa-loyalty"], "words": 461, "catch": "The thirteen towns won from Arghūn were a gift that could", "canon": 0, "body": "The thirteen towns won from Arghūn were a gift that could choke the one who swallowed it. Nearly two hundred thousand souls lived in them, and three in four were Christians, Catalans and Aragonese who had never known a Muslim lord. The dīwān of [Gharnāṭa](place:gharnata) had neither the clerks nor the soldiers to govern them from the Alhambra. The sultan's counsellors remembered how the old caliphate had fallen. The great city had tried to hold everything, and in the end it held nothing.\n\nSo our lord [Yūsuf](person:yusuf-i) chose the way of the old kings of al-Andalus, before the caliphs and after them. On the twenty-eighth of Ṣafar in the year 741 he raised two ṭāʾifas, two lesser kingdoms bound to Gharnāṭa by oath and tribute and ruled by their own princes. The first was the Ṭāʾifa of [Balansiyya](place:balansiyya), twelve towns with the great city among them, from [Shāṭiba](place:shatiba) to [Uryūla](place:uryula). Over it he set [Joan d'Oriola](person:joan-doriola), a Catalan lord of that land who had taken the faith of Islam. The second was the Ṭāʾifa of Mursiyya, which for now was only the one town of [Jumalla](place:jumalla). Over it he set [Juan Manuel Enríquez](person:juan-manuel-enriquez), a Castilian and likewise a convert, a hard soldier with no gift for words. Both princes kept the Christian names they were born with, for their people knew them by those names and would follow them more readily. So the crown's own towns, thirty-one on the day of the peace, were eighteen again, the old realm of the mountains and the sea, with two tributary kingdoms at its side.\n\nNeither ṭāʾifa loved its new master. The prince of Balansiyya was near content and growing more so. The prince of Mursiyya was a Castilian, and his loyalty was thin. The sultan's envoys went to both with gifts and assurances, and the dīwān settled down to the long work of making friends of them.\n\nAt home the realm put down its arms. The host of nineteen regiments was sent back to its villages until three remained. Five of the loans owed to the estates were repaid from the gold of the peace, and the debt fell from nine hundred and sixty-four dīnārs to eight hundred and forty-three. The treasury was left almost bare again. The sultan's cousin [Yūsuf ibn Muḥammad](person:yusuf-ibn-muhammad), who had spent three years defending the realm's sovereignty, was turned to strengthening the government. Within days of the peace the clerks of the dīwān began, very quietly, to set down the realm's claims against Qashtāla, the long grievance of tribute and lost lands that would one day justify a war of independence. No one spoke of it aloud. The scales were not ready.\n\n*Allāh does not change the condition of a people until they change what is in themselves.*"}, {"addr": "741-05-06", "slug": "0741-05-06-the-marinids-lose-the-shore", "n": 8, "bn": 8, "hy": 741, "hm": 5, "hd": 6, "w": 1340, "title": "Of the Marīnids' Defeat, and the Shore They Lost", "date": "1340-10-28", "dateStr": "28 October 1340", "hdateStr": "6 Jumādā al-Ūlā 741", "book": "book-of-mending", "people": ["maria-of-portugal", "peter-of-portugal", "fatima-bint-ismail"], "places": ["gharnata", "fas", "runda", "marballa", "al-jazira-al-khadra", "jabal-tariq", "balansiyya"], "sources": ["1340-10-25-portuguese-civil-war", "1340-10-28-moroccan-peace", "1340-11-22-royal-marriage-valencia"], "words": 385, "catch": "While Gharnāṭa won its war in the east, the Marīnids lost", "canon": 0, "body": "While [Gharnāṭa](place:gharnata) won its war in the east, the Marīnids lost theirs in the west. For three years the lion of [Fās](place:fas) had fought Qashtāla to reclaim al-Andalus, and Gharnāṭa, bound by tribute to the one side and by its word to the other, had watched from the mountains and was never drawn in. When the reckoning came, it did not have to share it.\n\nOn the sixth of Jumādā al-Ūlā in the year 741 Abū al-Ḥasan made his peace with Qashtāla, and he paid for it with everything his house still held on the Iberian shore. [Runda](place:runda) on its gorge passed to the Christians, and [Marballa](place:marballa) on the coast. So did [al-Jazīra al-Khaḍrāʾ](place:al-jazira-al-khadra), the green island where Ṭāriq's army first came ashore, and [Jabal Ṭāriq](place:jabal-tariq) itself, the mountain that bears his name. For six hundred years Muslims had crossed the Strait and found Muslim harbours waiting. Now every harbour between Mālaqa and the Ocean flew the castle of Qashtāla. Gharnāṭa was the last Muslim crown in al-Andalus, and Qashtāla held towns inside the realm's own mountains, Runda and Marballa, like thorns in a hand.\n\nThe court mourned the towns and did not mourn the lesson. The Marīnids, it was said, are a great help to have across the water and a poor one to have on the same shore. They had lost al-Andalus once already. The scales of the Strait swung far toward Qashtāla that year, and the sultan resolved that Gharnāṭa would be its own weight on them and not a counterweight in another man's hand.\n\nThree days before the peace, word came from the west that Portugal had fallen into civil war. Queen [Maria](person:maria-of-portugal), who is also the wife of Alfonso of Qashtāla, faced a rising by her own younger brother, [Peter](person:peter-of-portugal). The dīwān watched it closely. A crown fighting itself cannot lend its spears to its neighbours.\n\nAnd on the first of Jumādā al-Ākhira a royal marriage bound the house of Naṣr to the princely house of the Ṭāʾifa of [Balansiyya](place:balansiyya): the lady [Fāṭima](person:fatima-bint-ismail), the sultan's sister, was given in marriage into it. What had been made by treaty was now sealed in blood, so that the prince of the ṭāʾifa might count himself kin to the sultan and not only his servant.\n\n*And these days We alternate among the people.*"}, {"addr": "742-03-25", "slug": "0742-03-25-the-defection-of-ibn-al-khatib", "n": 9, "bn": 9, "hy": 742, "hm": 3, "hd": 25, "w": 1341, "title": "Of the Defection of Ibn al-Khaṭīb", "date": "1341-09-08", "dateStr": "8 September 1341", "hdateStr": "25 Rabīʿ al-Awwal 742", "book": "book-of-mending", "people": ["ibn-al-khatib", "yusuf-i", "ismail-ibn-ismail", "yusuf-ibn-muhammad"], "places": ["uryula", "balansiyya", "gharnata"], "sources": ["1341-07-08-ibn-al-khatib-castile", "1341-09-08-cabinet", "1341-09-08-loans", "1341-09-08-burghers", "1341-09-08-sovereignty", "1341-09-08-valencia-conversion"], "words": 478, "catch": "The chronicler must now set down what he would rather leave", "canon": 0, "body": "The chronicler must now set down what he would rather leave out.\n\n[Muḥammad ibn al-Khaṭīb](person:ibn-al-khatib) was the ablest man at the court of Gharnāṭa. In counsel, in letters and in war there was no one to match him. It was he who led the host down the road through Mursiyya and broke the Aragonese on the Day of [Uryūla](place:uryula). If the Peace of [Balansiyya](place:balansiyya) had a father after Allāh and the sultan, it was he. In Ṣafar of 741 he came home with the army, and the people of [Gharnāṭa](place:gharnata) threw flowers under his horse.\n\nSome time in the winter or the spring that followed he left the realm. He did not go to Fās, as an unhappy courtier of Gharnāṭa might, or to Tilimsān or Tūnis. He went north to Qashtāla. In Muḥarram of the year 742 he appears in the rolls of the Christian king's fleet as an admiral of Qashtāla. He had taken the faith of the Cross, and with it a Christian name, Frederick.\n\nThe chronicle does not know why. No letter of his survives in the dīwān, and the sultan has not spoken of it in the hearing of any scribe. Some at court say he was slighted after the peace, when the honours went to princes of the blood and not to the man who had won the war. Others say Qashtāla had been paying him all along, and that the bluff before Shāṭiba was his to expose and he chose not to. Still others say only that a man of such gifts was too large for so small a kingdom. Allāh knows best what is hidden in the hearts. The chronicler records the fact and leaves the judgment to the One who judges.\n\nThe court went on without him. [Ismāʿīl ibn Ismāʿīl](person:ismail-ibn-ismail), the sultan's young brother, took the seat in the dīwān for strengthening the government, in place of their cousin [Yūsuf ibn Muḥammad](person:yusuf-ibn-muhammad). Three more loans were repaid to the estates, and the debt fell to seven hundred and sixty-four. The treasury held ten dīnārs. The burghers soured that year, from content to sullen, and they had cause. The crown, hungry for every dīnār, had raised the tariffs at the ports and the gates and trimmed what it paid out wherever it could, and it was the merchants who paid. Nor had they forgiven the war with Arghūn. It had broken the ties with the Catalan traders through which so much of the silk of Gharnāṭa was sold, and those ties were slow to mend. The realm's sovereignty slipped to within a breath of the half. In the Ṭāʾifa of Balansiyya the call to prayer was heard in more streets every month: fifty-two thousand Muslims now, where there had been forty-five, and the Christians fewer by eight thousand.\n\n*Our Lord, let not our hearts deviate after You have guided us.*"}, {"addr": "743-12-24", "slug": "0743-12-24-the-lean-years", "n": 10, "bn": 10, "hy": 743, "hm": 12, "hd": 24, "w": 1343, "title": "Of the Lean Years, the Gold of Tūnis, and the Royal Decree", "date": "1343-05-20", "dateStr": "20 May 1343", "hdateStr": "24 Dhū al-Ḥijja 743", "book": "book-of-mending", "people": ["yusuf-i", "ismail-ibn-ismail", "yahya-rahhu", "qamar", "khalid-ibn-yahya", "maria-of-portugal", "alfonso-xi", "peter-of-castile"], "places": ["gharnata", "malaqa", "balansiyya"], "sources": ["1342-01-01-renaissance", "1342-02-07-promote-sovereignty", "1342-05-02-hafsid-gift", "1342-08-14-catalan-privileges-restored", "1342-10-01-independence-cb", "1342-12-30-birth-khalid", "1343-01-27-royal-decree", "1343-05-20-loans", "1343-05-20-sovereignty", "1343-05-20-shared-heir", "1343-05-20-conversion"], "words": 559, "catch": "The years 742 and 743 have no battles in them, and", "canon": 0, "body": "The years 742 and 743 have no battles in them, and so the chroniclers of other courts would pass over them in a line. This chronicle will not, for in those years the state was mended. Mending is slower work than war and harder to praise.\n\nThe debt to the estates was the first matter. It had been taken on in the war with Arghūn and it hung on the crown like a chain, for every dīnār owed to the nobles was a dīnār's worth of their say in the realm's affairs. Year by year the sultan paid it down, and year by year the treasury stood empty to do it. By Dhū al-Ḥijja of 743 twelve more loans had been repaid, and the debt stood at four hundred and thirty-seven, less than half what it had been when the war with Arghūn ended. The treasury held four dīnārs.\n\nIn Dhū al-Qaʿda of 742 the sultan wrote across the sea to the Ḥafṣid sultan of Tūnis. He spoke of the struggle for the Strait and of the burden of a lone Muslim kingdom on the Christian shore. The Ḥafṣid answered as a brother and sent two hundred and fifty-eight gold pieces. It was not a great sum, but he asked nothing in return, and the court did not forget it.\n\nIn Rabīʿ al-Awwal of 743 the Catalan merchant privileges came back into force. They had been granted again in the days after the peace with Arghūn, and the merchants of Barshalūna returned to the silk markets of [Gharnāṭa](place:gharnata) and [Mālaqa](place:malaqa) with their ships and their credit. The nobles and the burghers both lost some of their weight in the realm by it, and so the crown weighed more beside them. In Rabīʿ al-Thānī the dīwān's quiet grievance against Qashtāla was complete: the realm now had a just cause for a war of independence, written and sealed, whenever it should choose to use it. It was locked away.\n\nIn Shaʿbān the sultan issued the Royal Decree, by which the crown might command where before it had only asked. The crown's hand grew firmer by it, and the realm began, slowly, to bend toward the throne. Meanwhile [Ismāʿīl ibn Ismāʿīl](person:ismail-ibn-ismail) had turned his seat in the dīwān back to the defence of the realm's sovereignty. It stood a hair above the half, and Qashtāla's pull on the realm had eased.\n\nIn the house of Raḥḥū a son was born. [Khālid](person:khalid-ibn-yahya) was the child of [Yaḥyā Raḥḥū](person:yahya-rahhu), the commander of the Volunteers, and the lady [Qamar](person:qamar), widow of the sultan Ismāʿīl and mother of Ismāʿīl ibn Ismāʿīl. So the house of the Volunteers' general was joined to the house of Naṣr through the old sultan's widow. The court was of two minds about it.\n\nIn the West the Portuguese war went on, and some in the dīwān hoped it might be turned to the realm's use. But Queen [Maria](person:maria-of-portugal) was the wife of [Alfonso](person:alfonso-xi) of Qashtāla, and their son [Peter](person:peter-of-castile) was heir to both crowns. Any blow at Portugal was a blow at the house of Qashtāla. And in the Ṭāʾifas the call to prayer spread on. [Balansiyya](place:balansiyya) now counted sixty-six thousand Muslims, and Mursiyya was nearly half Muslim.\n\n*And whoever fears Allāh, He will make for him a way out, and will provide for him from where he does not expect.*"}, {"addr": "745-06-02", "slug": "0745-06-02-the-jamaa-of-744", "n": 11, "bn": 11, "hy": 745, "hm": 6, "hd": 2, "w": 1344, "title": "Of the Jamāʿa of 744, the Sultan's Marriage, and the Crown Strengthened", "date": "1344-10-11", "dateStr": "11 October 1344", "hdateStr": "2 Jumādā al-Ākhira 745", "book": "book-of-mending", "people": ["yusuf-i", "sayyida-of-fezzan", "alfonso-xi", "maria-of-portugal"], "places": [], "sources": ["1344-03-23-castile-aragon-alliance", "1344-04-castile-intervenes-portugal", "1344-05-12-jamaa-sits", "1344-jamaa-marriage", "1344-05-29-favor-the-ruler", "1344-10-11-royal-harem"], "words": 538, "catch": "In the spring of 744 the sultan called the Jamāʿa, the", "canon": 0, "body": "In the spring of 744 the sultan called the Jamāʿa, the great assembly of the realm, where the nobles and the *ʿulamāʾ*, the burghers, the commoners and the dhimmīs each send their voices to the throne. He had meant to call it for war. Portugal was still divided against itself, and Qashtāla was weakened by it. The grievance against Qashtāla had lain sealed in the dīwān for two years. There were voices in the dīwān that said the hour had come to use it.\n\nBut the hour passed before the Jamāʿa could meet. On the eighth of Dhū al-Qaʿda word came that Qashtāla and Arghūn had sworn an alliance, and that on the same day Qashtāla and Portugal had sealed an Iberian wedding pact. The three crowns of the Christians, which had fought one another for a hundred years, now stood together. In the middle of Dhū al-Ḥijja the tyrant [Alfonso](person:alfonso-xi) marched into Portugal to end its civil war in favour of his queen, [Maria](person:maria-of-portugal). The moment in the north was gone, and a realm still in debt could not fight all three crowns at once.\n\nSo when the Jamāʿa sat at the end of Dhū al-Ḥijja, our lord [Yūsuf](person:yusuf-i) turned it to other work. He would strengthen the crown that the Christians feared to see strong, and pay what the crown still owed. He asked the assembly to change the Distribution of Power itself, so that the balance of the realm's government should favour the ruler and not the estates. The debate was long and the nobles were bitter. But the sultan had paid down half their loans in four years, and he had won them a war. He saw the greatest of them one by one in the evenings, and he bargained with each as a merchant bargains, giving way on small things and never on the great one, until each had sold his voice for less than he had meant to ask. On the fifteenth of Muḥarram 745 the change was proclaimed. Where the old law had weighed against the crown, the new law weighed for it.\n\nIn those same days, while the delegates of the Jamāʿa filled the city, the sultan married. The lady [Sayyida](person:sayyida-of-fezzan), daughter of the house of Murzuq in Fazzān, had been betrothed to him at nine years old, in the first year of this chronicle. Now she was fifteen. The wedding was held in the Alhambra with the whole realm, in a manner of speaking, as its guests. The poets sang of the sultan who took a bride and a crown in the same season.\n\nThe marriage left its mark on the customs of the court. In Jumādā al-Ākhira the old aristocratic court, where the great houses had their places by right of birth, gave way to the royal harem, where the household of the sultan is its own world, and its women and their sons are bound to him alone. Some of the nobles said that the sultan had shut the door of the palace in their faces. So he had.\n\n*And of His signs is that He created for you from yourselves mates that you may find tranquillity in them, and He placed between you affection and mercy.*"}, {"addr": "747-06-28", "slug": "0747-06-28-the-debt-paid", "n": 12, "bn": 12, "hy": 747, "hm": 6, "hd": 28, "w": 1346, "title": "Of the Unquiet Years, the Debt Paid, and the End of the Mending", "date": "1346-10-16", "dateStr": "16 October 1346", "hdateStr": "28 Jumādā al-Ākhira 747", "book": "book-of-mending", "people": ["yusuf-i", "najib", "joan-doriola", "juan-manuel-enriquez"], "places": ["balansiyya", "jumalla", "gharnata"], "sources": ["1345-01-27-stability", "1345-01-27-loans", "1345-01-27-sovereignty", "1345-01-27-taifa-loyalty", "1345-01-27-court", "1345-01-27-conversion", "1345-07-23-betrothal-tunis", "1345-09-08-betrothal-ghana", "1346-08-01-debt", "1346-08-01-stability", "1346-10-16-moroccan-war"], "words": 515, "catch": "A state cannot be remade without being shaken. In the year", "canon": 0, "body": "A state cannot be remade without being shaken. In the year after the Jamāʿa the realm grew unquiet. The calm that had held through the lean years was gone by Ramaḍān of 745, and the old men of the court could not remember the realm so restless in peace. The cause was the mending itself. The Jamāʿa's reforms were tearing down the old order of the realm and raising a new one in its place: a new Distribution of Power, a new custom at court, old offices and old rights unsettled. And all the while the debt to the estates gnawed at the crown's authority, for a lord who owes his nobles money cannot command them as a lord who does not. The realm was being rebuilt with the roof still on, and everyone under it felt the walls move.\n\nThrough it all the sultan held to his course. Six more loans were repaid in that year, and the debt fell to two hundred and eighty-eight dīnārs. The crown now took in more each month than it spent, by nine dīnārs. The realm's sovereignty stood at the barest margin above the half, and the pull of the two shores hung almost even. [Gharnāṭa](place:gharnata) leaned neither toward Qashtāla nor toward Fās.\n\nIn the Ṭāʾifas the work of the sultan's envoys bore fruit. [Joan d'Oriola](person:joan-doriola) of [Balansiyya](place:balansiyya) was counted a loyal servant of the throne, and the land he ruled counted eighty thousand Muslims to a hundred and one thousand Christians. [Juan Manuel Enríquez](person:juan-manuel-enriquez), whose Ṭāʾifa of Mursiyya was still only [Jumalla](place:jumalla), was still sullen, though two in three of his people now prayed toward Makka. At court a man of the *ʿulamāʾ* named [Najīb](person:najib) came to notice. He was a man of rare gifts in counsel, in diplomacy and in arms, and stubborn in all three, and the court marked him as one to watch.\n\nThe house of Naṣr cast its net wide. In Rabīʿ al-Awwal of 746 a betrothal was agreed with the Ḥafṣids of Tūnis, who had sent gold when gold was needed. In Jumādā al-Ūlā another was agreed with the kings of Ghāna, beyond the great desert, whose gold comes up the caravan roads to the markets of the Maghrib. The sultan meant to have friends on every shore.\n\nBy Rabīʿ al-Thānī of 747 the debt was all but gone. Four small loans remained, a hundred and twenty dīnārs or less, where once there had been nearly a thousand. The reforms had gathered power to the crown, and the realm began at last to steady. The state the young sultan had found in debt and tribute ten years before was mended. It was not healed, but it was whole and it was standing.\n\nIt was given eleven weeks to enjoy it. On the twenty-eighth of Jumādā al-Ākhira in the year 747 the Marīnid sultan declared war on Qashtāla once again, and the three crowns of the Christians answered as one. Here ends the Book of the Mending of the State.\n\n*So verily, with hardship there is ease. Verily, with hardship there is ease.*"}, {"addr": "747-07-01a", "slug": "0747-07-01-the-houses-of-healing", "n": 13, "bn": 1, "hy": 747, "hm": 7, "hd": 1, "w": 1346, "title": "Of the Rumour out of the East, and the Houses of Healing", "date": "1346-10-18", "dateStr": "18 October 1346", "hdateStr": "1 Rajab 747", "book": "book-of-pestilence", "people": ["yusuf-i"], "places": ["gharnata", "malaqa", "al-mariyya"], "sources": ["1346-08-01-black-death", "1346-10-18-hospitals"], "words": 373, "catch": "In the month of Rabīʿ al-Thānī in the year 747 the", "canon": 1, "body": "In the month of Rabīʿ al-Thānī in the year 747 the merchants who come by sea from Alexandria and Tūnis brought a tale that the court at first took for a sailors' fable. At Yāyiq, they said, far beyond the Sea of the Khazars in the lands of the Golden Horde, a sickness had risen that no physician could name. It came with swellings under the arm and in the groin and with fever and black blood. A man was well at the dawn prayer and dead by the evening one, and whole towns were given over to the dogs. The sickness moved along the roads of the caravans and the lanes of the ships, westward, as a fire moves along a dry slope.\n\nThe sultan did not dismiss the tale. He remembered that a plague goes where trade goes, and that no realm in al-Andalus lives by trade as [Gharnāṭa](place:gharnata) does. The Christians of Qashtāla live in villages and walled farms; our people live crowded in the great cities, in the alleys of the Albayzín, in the markets of [Mālaqa](place:malaqa), in the harbour quarter of [al-Mariyya](place:al-mariyya), where every ship from the east puts in. If the sickness came, it would find us first and find us thick on the ground.\n\nSo at the beginning of Rajab, in the same days that Fās called the realm to war, our lord [Yūsuf](person:yusuf-i) ordered houses of healing (*bīmāristānāt*) raised in the three great cities, Gharnāṭa, Mālaqa and al-Mariyya. They were to have wards for the sick, cisterns of running water, and physicians paid from the treasury, Muslim and Jewish alike. The debt had been all but paid that summer and the treasury could bear the cost. The nobles grumbled that silver spent on a rumour was silver not spent on lances. The sultan answered that a lance will not turn a fever.\n\nThose who mocked the order would remember it within two years. Those who praised it would learn that walls and wards slow a pestilence but do not stop it, for Allāh's decree outruns the builder.\n\n*No disaster strikes upon the earth or among yourselves except that it is in a register before We bring it into being. Indeed that, for Allāh, is easy.*"}, {"addr": "747-07-01b", "slug": "0747-07-01-the-summons-of-the-marinids", "n": 14, "bn": 1, "hy": 747, "hm": 7, "hd": 1, "w": 1346, "title": "Of the Summons of the Marīnids, and the Volunteers' Return", "date": "1346-10-18", "dateStr": "18 October 1346", "hdateStr": "1 Rajab 747", "book": "book-of-balance", "people": ["yusuf-i", "yahya-rahhu"], "places": ["gharnata", "balansiyya"], "sources": ["1346-08-01-sovereignty", "1346-08-01-conversion", "1346-10-16-moroccan-war", "1346-10-18-tunis-joins", "1346-10-18-call-to-arms", "1346-10-18-granada-joins", "1346-10-18-tributary-ends", "1346-10-18-volunteers-rise", "1346-11-08-mobilisation"], "words": 500, "catch": "And the heaven He raised and imposed the balance, that you", "canon": 1, "body": "*And the heaven He raised and imposed the balance, that you not transgress within the balance.* So Allāh has set a balance over all things, and over the Strait of the Pillars more than most. On one pan of the scales sit the three crowns of the Christians and on the other the Marīnids of Fās, and between them [Gharnāṭa](place:gharnata), the smallest weight, which both would gladly throw onto their own side. In the summer of 747 the scales began to tip. The realm's own sovereignty, the measure of how far it was master of itself, slipped below the half for the first time in the reign. The dīwān marked it, and did not yet know what it foretold.\n\nOn the twenty-eighth of Jumādā al-Ākhira the Marīnid sultan declared war on Qashtāla to reclaim al-Andalus, six years after his host had been broken. The king of Qashtāla called on his friends, and Portugal came in, and Arghūn with Mayūrqa and Qalyari. For the first time all three crowns of Iberia stood in one line. With Fās marched Tāfīlālt, Tuwāt and Tilimsān, and two days later Tūnis and its marches. Then the Marīnid's letter came to Gharnāṭa: our brother in faith expected us to take the field.\n\nThe council was divided. We were the only Muslim power on this side of the water and the only one that would face all three crowns at once. We were Qashtāla's tributary and paid its *parias*. The debt to the estates had only just been paid. The Catalan traders, driven off by the war with Arghūn, had only just begun to come back to the markets, and a new war with Arghūn would drive them off again. And the old men remembered that the Marīnids had dragged the realm into its quarrels before and then left it to bear the cost.\n\nBut the sultan weighed it and judged that the war would not wait on Gharnāṭa's caution. On the first of Rajab he answered the summons. The Ṭāʾifa of [Balansiyya](place:balansiyya) marched with us, and the land there now held more Muslims than Christians, ninety-two thousand to ninety. Taking up arms against our overlord suspended the tribute, and the war itself would decide the realm's independence. The reparations Arghūn had paid since the peace of 741 ceased the same day.\n\nThen the Volunteers of the Faith rose again. These were the same Ghuzāt who had broken Arghūn at Uryūla, and their old commander [Yaḥyā Raḥḥū](person:yahya-rahhu) led them once more: twenty-four companies of men who wanted nothing so much as the war against the united crowns. By the twenty-second of Rajab the host was raised. There were seventeen regiments of the *mutaṭawwiʿa*, the feudal levies of the nobles, the knights and the jinetes, and a second company of hired soldiers taken on two days before. The treasury held fifty-five dīnārs. The war was costing forty a month against an income of twenty-seven. No one in the dīwān pretended that the realm could bear it for long."}, {"addr": "748-02-06", "slug": "0748-02-06-the-day-of-jayyan", "n": 15, "bn": 2, "hy": 748, "hm": 2, "hd": 6, "w": 1347, "title": "Of the Day of Jayyān", "date": "1347-05-18", "dateStr": "18 May 1347", "hdateStr": "6 Ṣafar 748", "book": "book-of-balance", "people": ["yusuf-i", "alfonso-xi"], "places": ["tilimsan", "balansiyya", "al-mariyya", "jayyan", "ishbiliyya"], "sources": ["1346-11-22-battle-bay-palma", "1346-12-02-battle-gulf-of-almeria", "1347-01-16-battle-bay-alcudia", "1347-02-13-battle-castellon-de-la-plana", "1347-03-17-battle-sevilla", "1347-05-18-battle-jaen"], "words": 453, "catch": "The winter brought our allies nothing but grief. In the bay", "canon": 1, "body": "The winter brought our allies nothing but grief. In the bay of Palma the Aragonese galleys sank the fleets of Bijāya and [Tilimsān](place:tilimsan), fourteen ships sent to the bottom without one Christian hull lost. Off Alcúdia they did the same to the fleet of Qābis. The ships of [Balansiyya](place:balansiyya) were worsted by the Portuguese in the very gulf of [al-Mariyya](place:al-mariyya), within sight of our own shore. On the first of Dhū al-Qaʿda the Ṭāʾifa's little army of two thousand was caught at al-Qasṭalyūn by eight thousand Aragonese and destroyed to the last man. And on the third of Dhū al-Ḥijja the Marīnids, landed at last on our side of the Strait, came before [Ishbīliya](place:ishbiliyya) with fewer than three thousand men. The Castilians met them with nearly twelve thousand and drove them off.\n\nThe Christians took heart and believed the Muslims of the West could be beaten one by one. The tyrant himself, [Alfonso](person:alfonso-xi), son of Ferdinand, king of Qashtāla, came south with thirteen thousand men to finish the matter before the walls of [Jayyān](place:jayyan).\n\nOur lord [Yūsuf](person:yusuf-i) had marched north to meet him with twenty-two thousand of the faithful, and three and a half thousand Moroccans joined him on the road. It was the sixth of Ṣafar in the year 748. The king of Qashtāla was a soldier who had fought Muslims since his youth. He did not refuse battle, though he was outnumbered two to one, for he thought the Andalusīs soft from long peace and fat on Catalan trade. The Volunteers held the centre with the *mutaṭawwiʿa* in the first line, as at Uryūla. The jinetes rode on the wings in the old manner of al-Andalus, wheeling in, loosing and wheeling out again. All day the Castilian knights threw themselves at the line and all day the line held. At evening the jinetes turned their flank, and the Castilian army broke.\n\nSeven thousand five hundred Castilians fell or were taken, more than half of those who came. We lost four thousand two hundred, Allāh have mercy on them. That night the sultan did not sit down to the victory feast. He went among the wounded with the physicians and a lamp, cleaning and binding wounds with his own hands as he had learned to do on campaign, and he had the Castilian wounded carried in and laid beside ours. The physicians said he had a surgeon's hands and wasted them on a throne. The king escaped with his household, but he left the confidence of the winter on that field. The Andalusīs, whom the Christians had called soft, began to call themselves the sword of the West.\n\n*Truth has come, and falsehood has departed. Indeed, falsehood is ever bound to depart.*"}, {"addr": "748-05-23", "slug": "0748-05-23-of-al-qusayr-and-balma", "n": 16, "bn": 3, "hy": 748, "hm": 5, "hd": 23, "w": 1347, "title": "Of al-Quṣayr and Balma", "date": "1347-08-31", "dateStr": "31 August 1347", "hdateStr": "23 Jumādā al-Ūlā 748", "book": "book-of-balance", "people": ["yusuf-i"], "places": ["jayyan", "qurtuba", "al-qusayr", "ishbiliyya", "qadis", "sharish", "balma", "gharnata"], "sources": ["1347-06-17-battle-jerez-de-la-frontera", "1347-06-21-battle-carpio", "1347-07-13-battle-sevilla", "1347-08-08-constantinople-falls", "1347-08-31-battle-palma-del-rio", "1347-09-14-the-war-so-far"], "words": 471, "catch": "After Jayyān the sultan did not go home. He turned the", "canon": 1, "body": "After [Jayyān](place:jayyan) the sultan did not go home. He turned the host down the valley of the great river, the Wādī al-Kabīr, toward [Qurṭuba](place:qurtuba). The farms and granaries of the Castilian frontier burned behind it, for the Christians had burned ours for a hundred years and had taught us how. On the eleventh of Rabīʿ al-Awwal, at [al-Quṣayr](place:al-qusayr) on the river above Qurṭuba, a Castilian army of seven thousand stood across the road. The sultan had eighteen thousand. The battle was short. Four thousand three hundred Christians fell, against fourteen hundred of ours, and the road to Qurṭuba lay open.\n\nOur Marīnid brothers fared otherwise. On the far side of [Ishbīliya](place:ishbiliyya), between that city and [Qādis](place:qadis), the Marīnid columns landed in small bands and were beaten in small bands. On the seventh of Rabīʿ al-Awwal a column of two and a half thousand was beaten at [Sharīsh](place:sharish) by ten thousand. On the third of Rabīʿ al-Thānī a column of nine hundred was destroyed before Ishbīliya to the last man, without the loss of one Castilian. Qashtāla's southern army, nearly ten thousand strong, grew fat on these easy victories. Its captains came to believe that every Muslim in the field would break as the Moroccans broke.\n\nSo the sultan swung west to relieve his allies. On the twenty-third of Jumādā al-Ūlā, at [Balma](place:balma) where the Shanīl runs into the Wādī al-Kabīr, the Castilian southern army attacked him. He had sixteen thousand of his own and four thousand Moroccans who had gathered to his banner. The Castilians came on in the confidence of men who had won all summer and found they were not fighting Moroccans. By evening five thousand three hundred of them lay on the riverbank. Our dead numbered seven hundred. Of all the sultan's victories it was the cheapest.\n\nIn those same weeks word came from the East that Qusṭanṭīniyya, the Queen of Cities, had fallen to the Ottomans, and that the Cross was taken down from its great church. The faithful of [Gharnāṭa](place:gharnata) gave thanks in the mosques. The wiser heads at court reflected that the Turks had won their city alone, and that no one should count on help from the far end of the sea.\n\nWhen the first year of the war was reckoned in Jumādā al-Ākhira, the account stood thus. The army of Gharnāṭa had won every battle it fought and lost fewer than six thousand men in them. The Moroccans had lost three and a half thousand in battle and six thousand more to hunger and sickness on the march. Qashtāla had lost more than eighteen thousand, most of them to the sultan's sword. The dīwān held that Gharnāṭa had done almost twice Morocco's share of the war, and done it with half the men.\n\n*If Allāh should aid you, no one can overcome you.*"}, {"addr": "748-09-09", "slug": "0748-09-09-of-muntil-and-the-gate-of-qurtuba", "n": 17, "bn": 4, "hy": 748, "hm": 9, "hd": 9, "w": 1347, "title": "Of Munṭīl, and the Gate of Qurṭuba", "date": "1347-12-13", "dateStr": "13 December 1347", "hdateStr": "9 Ramaḍān 748", "book": "book-of-balance", "people": ["yusuf-i"], "places": ["muntil", "qurtuba", "jayyan", "al-qusayr", "balma"], "sources": ["1347-10-04-battle-montiel", "1347-10-30-battle-montiel", "1347-12-13-battle-cordoba"], "words": 389, "catch": "In the autumn the Marīnids tried their fortune in the north.", "canon": 1, "body": "In the autumn the Marīnids tried their fortune in the north. A Marīnid army of four thousand, with a handful of Tunisians, struck into the high plain of La Mancha. On the twenty-seventh of Jumādā al-Ākhira, at [Munṭīl](place:muntil), it met eight thousand Castilians. The Moroccans were beaten and fled. Yet they sold the field dearly: twelve hundred of the
