at Zafra. It was Castilian land that the Marīnids had taken, so that Muslims of the far shore held the field on which Muslims of this one fought. Murād had nine thousand eight hundred men, the sultan's army with a contingent of [Balansiyya](place:balansiyya). The enemy had six thousand seven hundred and fifty, Portuguese and Aragonese under one command. The Portuguese commander was a capable man, and the Christian line held through the morning. In the afternoon Murād sent the jinetes of Gharnāṭa around its flank, and then he sent the thagrī footmen in. The Christian line broke, the Aragonese first. Three thousand three hundred and fifty of the enemy were left on the field, and two thousand two hundred of ours. It was not cheap, but it was a victory. The joined host of the two crowns no longer existed. Only its pieces were left, running west toward the one city they still hoped to hold.\n\nMurād followed them all the way back to al-Ushbūna. Under its walls, on the twelfth of Dhū al-Ḥijja, he destroyed what was left of the Portuguese: sixteen hundred men, every one of them killed or taken, and not one of ours lost. The next day it was the Aragonese remnant's turn, seventeen hundred and seventy men, and again not one of ours. Those were the days of tashrīq, when the pilgrims at Minā cast their stones at the pillars of the Devil. The army of Gharnāṭa cast its own before the gates of al-Ushbūna.\n\nPortugal had nothing left in the field, and it sued for peace the same day. It gave up its whole south: the Algarve that the old geographers called al-Gharb, with [Shilb](place:shilb), [Ukshūnuba](place:ukshunuba) and Tavira, and the lower plains of the Alentejo with [Bāja](place:baja), Mértola and Serpa. That was thirteen towns and eighty-three thousand souls. Portugal would also pay reparations for ten years. The court did not mean to keep these Portuguese Christians under its own hand. When the war was won they would be given a prince of their own, as Balansiyya and [Mursiyya](place:mursiyya) had been, and become a third ṭāʾifa of al-Andalus.\n\nQashtāla and Arghūn fought on. But the sultan's treasury, which had held twenty-four dīnārs on the day his father died, now held five hundred.\n\n*And you did not kill them, but it was Allāh who killed them. And you threw not when you threw, but it was Allāh who threw.*"}, {"addr": "767-07-23", "slug": "0767-07-23-the-peace-of-independence", "n": 40, "bn": 20, "hy": 767, "hm": 7, "hd": 23, "w": 1366, "title": "Of the Conqueror, the Renegade at San Clemente, and the Peace of Independence", "date": "1366-04-05", "dateStr": "5 April 1366", "hdateStr": "23 Rajab 767", "book": "book-of-balance", "people": ["saad-ibn-yusuf", "murad", "ibn-al-khatib", "aiman-mamluk", "dua-marinid", "ismail-ibn-saad", "umm-al-fath-bint-saad", "rodrigo-of-silves"], "places": ["balansiyya", "tulaytula", "gharnata", "walba", "ayamunt", "ukshunuba"], "sources": ["1364-12-13-birth-umm-al-fath-bint-saad", "1365-03-saad-conqueror", "1365-07-14-battle-canete", "1365-09-02-peace-aragon", "1366-01-06-battle-san-clemente", "1366-03-08-birth-ismail-ibn-saad", "1366-04-05-peace-castile", "1366-04-13-taifa-al-gharb", "1366-04-05-the-south-burned"], "words": 549, "catch": "In Rabīʿ al-Awwal of the year 766 Aiman gave the sultan", "canon": 2, "body": "In Rabīʿ al-Awwal of the year 766 [Aiman](person:aiman-mamluk) gave the sultan his first child, a daughter. He named her [Umm al-Fatḥ](person:umm-al-fath-bint-saad), mother of victory, which was either a prayer or a boast. Aiman, a daughter of the Mamlūk house, is said to have answered that in Cairo it would be read as both. By spring the chancellor was recording a new title in the registers of the dīwān. The court had stopped calling [Saʿd](person:saad-ibn-yusuf) the prodigy. It called him *al-Fātiḥ*, the Conqueror. He was seventeen.\n\nThe war in the east still had to be finished. On the twenty-fourth of Shawwāl, at Cañete, where the Portuguese had broken the men of [Balansiyya](place:balansiyya) the year before, sixteen hundred Aragonese attacked [Murād](person:murad)'s army of five thousand seven hundred. Twelve hundred and sixty of them were left on the field, against a hundred and ninety of ours. Arghūn had joined the war for an ally's sake and gained nothing from it. On the fifteenth of Dhū al-Ḥijja it made its own peace and agreed to pay reparations for ten years.\n\nThat left Qashtāla, alone, as [Gharnāṭa](place:gharnata) had been alone so often. On the twenty-second of Rabīʿ al-Thānī 767 Murād found its last army in the field at San Clemente, in La Mancha. There were nine hundred and fifty men, and at their head was a man the court knew well. It was [Ibn al-Khaṭīb](person:ibn-al-khatib), the vizier who had gone over to the Cross a quarter of a century before and served Qashtāla ever since as Frederick, its admiral. Murād had six thousand two hundred and fifty men. Eight hundred and forty Castilians died, a hundred and five were taken, and thirty-one Granadans fell. The renegade escaped, as he always did. The army pushed on into La Mancha and up the road to [Ṭulayṭula](place:tulaytula), the old city of the Goths, and held it when the envoys came.\n\nA month before the peace, [Duʿāʾ](person:dua-marinid) gave the sultan a son, [Ismāʿīl](person:ismail-ibn-saad), and the realm had an heir of the sultan's own blood. The ʿulamāʾ remembered whose widow his mother was, and prayed for the child all the same.\n\nOn the twenty-third of Rajab 767 the peace was sealed, and the tyrant of Qashtāla let Gharnāṭa go. The house of Naṣr, which had paid tribute to the Castilian crown for longer than anyone living could remember, declared itself free and subject to no one but Allāh. Qashtāla gave up the country of [Walba](place:walba): six towns between the Guadalquivir and the Guadiana, from the coast to the hills of Aracena. Among them was [Ayamūnt](place:ayamunt), where al-Ḥājj Yūsuf had died on the march, so the son brought the place of his father's death into the realm. Qashtāla paid a sum into the treasury and owed reparations for ten years. Ṭulayṭula was given back, burned and half emptied, its people fewer by a third than they had been seven years before.\n\nEight days later the sultan kept his word to the Portuguese south. On the first of Shaʿbān the thirteen towns of al-Gharb were made a ṭāʾifa, with its seat at [Ukshūnuba](place:ukshunuba), under [Rodrigo of Silves](person:rodrigo-of-silves). He was a Portuguese lord who had taken the shahāda and a soldier of real ability. Gharnāṭa now had three ṭāʾifas, and no overlord at all.\n\n*Indeed, We have given you a clear conquest.*"}, {"addr": "768-01-26", "slug": "0768-01-26-the-slow-return", "n": 41, "bn": 3, "hy": 768, "hm": 1, "hd": 26, "w": 1366, "title": "Of the Slow Return, and the Day Qurṭuba Turned", "date": "1366-10-02", "dateStr": "2 October 1366", "hdateStr": "26 Muḥarram 768", "book": "book-of-the-call", "people": ["saad-ibn-yusuf"], "places": ["qurtuba", "al-qusayr", "balma", "istijja", "qusantina", "ishbiliyya", "jayyan", "gharnata"], "sources": ["1363-05-baena-andalusi", "1364-05-19-jamaa-summoned", "1364-09-11-andalusi-majority", "1366-04-qurtuba-andalusi", "1366-qurtuba-muslim", "1366-11-06-state"], "words": 560, "catch": "The return of al-Andalus did not happen in the mosques first.", "canon": 2, "body": "The return of al-Andalus did not happen in the mosques first. It happened in the kitchens and the markets, in the songs mothers sang over cradles and the words men used to haggle over wool. The tongue came back before the faith.\n\nThe first town to turn was Baena, in the hills south of [Qurṭuba](place:qurtuba), some time in the years of the Marīnid war. The dīwān's surveyors found that its people now counted themselves Andalusīs and not Castilians. They spoke the Arabic of the south, kept its feasts and wore its clothes, and they still went to Mass on Sundays. Over the next three years the surveyors found the same thing again and again. [al-Quṣayr](place:al-qusayr) turned in 764, [Balma](place:balma) in 765, and [Istijja](place:istijja), [Qusanṭīna](place:qusantina) and Fuenteovejuna in 766. Towns that had been Castilian for a century became Andalusī within a single generation, and stayed Christian. The jurists did not know what to make of them. Some said they were halfway to Islam. Others said they were Mozarabs again, the Christians of al-Andalus who had lived under the caliphs and spoken their tongue, as their ancestors had been before Qashtāla came. Both may be true.\n\nFaith came more slowly, and it needed help. In Shaʿbān 765 the Jamāʿa restored the jizya and began a new campaign of preaching. The jizya is a hard teacher but a patient one. A Christian of [Ishbīliya](place:ishbiliyya) who paid it every year was reminded every year what conversion would save him. When the campaign began, thirteen in every hundred souls of Ishbīliya were Muslims. A year later it was twenty-six. In [Jayyān](place:jayyan), where scarcely one soul in fifty had prayed toward Makka when the war began, three in ten did so by the time it ended.\n\nThen Qurṭuba turned. In the spring of 767, in the weeks of the peace, the surveyors counted more Andalusīs in the city than Castilians, for the first time since Ferdinand of Qashtāla took it a hundred and thirty years before. In 749 there had been thirty-four thousand Castilians to six thousand Andalusīs. Now there were nineteen thousand five hundred Andalusīs to sixteen thousand three hundred Castilians. Six months later, on the twenty-sixth of Muḥarram 768, the count of the faithful was finished. Eighteen thousand two hundred Muslims, eighteen thousand Christians and three thousand four hundred Jews lived in the city of the caliphs. By the narrowest of margins, Qurṭuba was a Muslim city again.\n\nOur lord [Saʿd](person:saad-ibn-yusuf) was told in [Gharnāṭa](place:gharnata). He is said to have asked only one question: whether the great mosque was still a cathedral. It was. He said that he could wait. The mosque had waited a hundred and thirty years, and the people of Qurṭuba would give it back themselves when they were ready. He was less patient with the treasury. It had been filled at the peace, and the young sultan, who read the dīwān's ledgers line by line himself, would not let it sit idle. That same year it opened new silver mines at Qusanṭīna, laid out new farms at Úbeda at the head of the valley, and paid for another Great Madrasa, this one at Ishbīliya. A mosque could wait for its people, he told the treasurers, but silver left in the ground earned nothing for anyone.\n\n*There is no compulsion in religion. The right way has become distinct from the wrong.*"}, {"addr": "770-03-11", "slug": "0770-03-11-the-marinids-on-the-northern-shore", "n": 42, "bn": 21, "hy": 770, "hm": 3, "hd": 11, "w": 1368, "title": "Of the Marīnids on the Northern Shore, and the Second Demand of Fās", "date": "1368-10-24", "dateStr": "24 October 1368", "hdateStr": "11 Rabīʿ al-Awwal 770", "book": "book-of-balance", "people": ["saad-ibn-yusuf", "abu-inan-faris", "rodrigo-of-silves", "aiman-mamluk"], "places": ["gharnata", "fas", "runda", "marballa", "qadis", "sharish", "jabal-tariq", "tarifa", "al-jazira-al-khadra", "ishbiliyya", "ukshunuba", "tilimsan"], "sources": ["1365-08-31-moroccan-peace-castile", "1366-01-10-marinid-sevilla", "1366-05-12-castile-courts", "1367-01-30-mamluk-alliance", "1367-08-01-moroccan-claim", "1368-05-10-moroccan-insult", "1368-07-moroccan-hostility", "1368-07-26-castile-markets", "1368-07-30-spies-in-fas", "1368-09-26-castile-guarantees-al-gharb", "1368-10-24-marinid-war"], "words": 504, "catch": "While Gharnāṭa was winning its freedom, Fās was winning something else.", "canon": 2, "body": "While [Gharnāṭa](place:gharnata) was winning its freedom, [Fās](place:fas) was winning something else. On the thirteenth of Dhū al-Ḥijja 766 the Marīnids made their own peace with Qashtāla and took from it the whole northern shore of the Strait. That was eleven towns, from [Runda](place:runda) in its mountains and [Marballa](place:marballa) on the sea to [Qādis](place:qadis), [Sharīsh](place:sharish), [Jabal Ṭāriq](place:jabal-tariq), [Ṭarīfa](place:tarifa) and [al-Jazīra al-Khaḍrāʾ](place:al-jazira-al-khadra). These were the very gates through which Ṭāriq had come into al-Andalus. At court men said it was better that the shore should be held by Muslims than by Christians. The wiser ones answered that it was better still that it should not be held by Fās.\n\nFās soon showed what it intended. In Rabīʿ al-Thānī 767 the Marīnid sultan, [Abū ʿInān Fāris](person:abu-inan-faris), made nine of the eleven towns into a fief under a lord of his own. He gave it the name the rebels had used thirteen years before, the Kingdom of Sevilla. [Ishbīliya](place:ishbiliyya) itself was Gharnāṭa's and had been since 749, so the kingdom was named for a city it did not hold, and anyone could see which city it meant to claim.\n\nPeace lasted two years, and they were not quiet ones. Qashtāla, beaten, began to court Gharnāṭa with sweet words. In Ṣafar 768 the alliance with Cairo lapsed. [Saʿd](person:saad-ibn-yusuf)'s wife [Aiman](person:aiman-mamluk) wrote to her father, and in Jumādā al-Ūlā the sultan renewed it. Then Fās took up its old demand again. In Dhū al-Ḥijja 768 the dīwān learned that the Marīnid sultan claimed the same right he had used in 761, to demand Gharnāṭa's submission as his subject.\n\nThe year 769 was worse. The Marīnids broke the trade agreements. Their envoys spoke of the claims of the Kingdom of Sevilla as if it were a real crown and not a garrison. On the twenty-first of Ramaḍān they insulted the sultan's ambassadors before the whole court of Fās. That gave Gharnāṭa a just cause of its own, and the sultan put it away for later. In the month of the pilgrimage Qashtāla closed its markets to Gharnāṭa's merchants. In Ṣafar 770 it declared itself guarantor of the independence of al-Gharb, Gharnāṭa's newest ṭāʾifa, as though [Rodrigo of Silves](person:rodrigo-of-silves) needed a Christian king to protect him from his own lord. The next day the sultan's agents were in [Ukshūnuba](place:ukshunuba) buying up the loyalty of al-Gharb's notables. Other agents had been in Fās since Dhū al-Ḥijja.\n\nOn the eleventh of Rabīʿ al-Awwal 770 Fās declared war, as everyone had known it would. [Tilimsān](place:tilimsan), Tāfīlālt, Tuwāt and the puppet kingdom marched with it. Gharnāṭa had its three ṭāʾifas. It also had something it had never had before: the sultan of Egypt, and with him every vassal of the Mamlūk house from Makka and Madīna to Barqa and the Western Oases. Saʿd heard the declaration read and is said to have answered: *Let them come, and let them remember Sharīsh.*\n\n*Permission to fight has been given to those who are fought against, because they were wronged. And indeed, Allāh is competent to give them victory.*"}, {"addr": "770-07-21", "slug": "0770-07-21-the-first-winter", "n": 43, "bn": 22, "hy": 770, "hm": 7, "hd": 21, "w": 1369, "title": "Of the First Winter, When the Sultan of Fās Was Beaten at Qādis", "date": "1369-03-01", "dateStr": "1 March 1369", "hdateStr": "21 Rajab 770", "book": "book-of-balance", "people": ["saad-ibn-yusuf", "murad", "abu-inan-faris", "aiman-mamluk", "jadila-bint-saad"], "places": ["fas", "qadis", "marballa", "jabal-tariq", "tarifa", "gharnata", "tilimsan", "runda"], "sources": ["1368-11-11-battle-cadiz", "1368-12-01-battle-marbella", "1368-12-13-birth-jadila-bint-saad", "1368-12-15-battle-gibraltar", "1368-12-25-battle-tarifa", "1369-01-31-battle-costa-blanca", "1369-02-08-battle-marbella", "1369-02-15-battle-ronda", "1369-03-the-south-subdued", "1369-03-strength"], "words": 521, "catch": "The sultan of Fās came across the water himself to take", "canon": 2, "body": "The sultan of [Fās](place:fas) came across the water himself to take what he had demanded. [Abū ʿInān Fāris](person:abu-inan-faris) was a zealot and a soldier, and he had planned many attacks in his life. The plague had marked him years before. He landed at [Qādis](place:qadis) with eight hundred men, the vanguard of the host that was to follow. On the twenty-ninth of Rabīʿ al-Awwal 770, eighteen days after the declaration, [Murād](person:murad) fell on him with three thousand three hundred. Seven hundred and forty Marīnids died and sixty were taken. Sixty-five of ours fell. Abū ʿInān escaped to his ships. A sultan who had come to demand submission sailed home with the smallest army he had ever commanded.\n\nThen the court did what it had promised in 761: it threw its whole weight into the war. [Marballa](place:marballa) fell on the nineteenth of Rabīʿ al-Thānī to a single assault, its garrison of thirteen overwhelmed. On the fourth of Jumādā al-Ūlā the army of the so-called Kingdom of Sevilla, eight hundred men, stood at [Jabal Ṭāriq](place:jabal-tariq) and was broken. Ten days later its last three hundred and twenty were destroyed to a man at [Ṭarīfa](place:tarifa). The puppet kingdom had no army left, and its towns began to open their gates.\n\nIn the middle of that campaign news came from [Gharnāṭa](place:gharnata). [Aiman](person:aiman-mamluk) had given our lord [Saʿd](person:saad-ibn-yusuf) a second daughter, [Jadīla](person:jadila-bint-saad), named for her aunt. Seven weeks later the first fruit of the Egyptian alliance arrived in the western sea. Ten Mamlūk ships out of Barqa met a ship of [Tilimsān](place:tilimsan) off the eastern coast and sank it. They were the first ships of Egypt in those waters in the memory of anyone living.\n\nThe Marīnids answered with their first landing. On the twenty-ninth of Jumādā al-Ākhira two thousand six hundred came ashore at Marballa to take it back and fell on Murād's army of six thousand four hundred. Fifteen hundred and forty of them died, against five hundred and seventy of ours, and the rest were driven back into the sea. A week later the stragglers, a thousand and fifty men cut off in the mountains, attacked five hundred and seventy-five Granadans at [Runda](place:runda) and were destroyed to the last man.\n\nBy Rajab the whole northern shore was in the sultan's hands, save one place. The old fortress of Qādis, on its island at the end of its causeway, still flew the banner of Fās. By any reckoning the war was going Gharnāṭa's way. But the dīwān's reckoners looked across the water and were not comforted. Fās and its allies had forty-seven thousand men under arms, twenty-three thousand of them the Marīnid sultan's own. Gharnāṭa had eight thousand eight hundred, and its ṭāʾifas fewer than three thousand. The Mamlūk sultan and his vassals had a hundred thousand more, but they were at the other end of the sea. The winter had been won with speed. The spring would be a test of numbers.\n\n*And remember when you were few and oppressed in the land, fearing that people might abduct you, but He sheltered you, supported you with His victory, and provided you with good things.*"}, {"addr": "771-04-17", "slug": "0771-04-17-the-year-of-the-counterattack", "n": 44, "bn": 23, "hy": 771, "hm": 4, "hd": 17, "w": 1369, "title": "Of the Year of the Counterattack, and the Line at Antaqīra", "date": "1369-11-18", "dateStr": "18 November 1369", "hdateStr": "17 Rabīʿ al-Thānī 771", "book": "book-of-balance", "people": ["saad-ibn-yusuf", "khalid-ibn-yahya", "murad", "osman-marinid", "juan-manuel-enriquez"], "places": ["fas", "sharish", "shaluqa", "qadis", "mursiyya", "gharnata", "malaqa", "antaqira", "hisn-al-munakkab", "jarghal", "al-mariyya", "labla", "runda", "abdara"], "sources": ["1369-04-05-battle-jerez-de-la-frontera", "1369-04-28-battle-jerez-de-la-frontera", "1369-05-12-battle-sanlucar", "1369-06-02-battle-cadiz", "1369-06-26-battle-cadiz", "1369-estate-loans", "1369-09-16-battle-malaga", "1369-10-15-battle-antequera", "1369-11-08-battle-almunecar", "1369-11-18-state"], "words": 658, "catch": "In the spring Fās began to pour men across the Strait,", "canon": 2, "body": "In the spring [Fās](place:fas) began to pour men across the Strait, and it did not stop. Its fleet was eighty ships strong and ruled the water, so it could land wherever it chose, and it chose everywhere. On the twenty-sixth of Shaʿbān 770 a Granadan column of two thousand one hundred attacked a Marīnid force of equal size at [Sharīsh](place:sharish) and was destroyed. [Murād](person:murad) retook the town in Ramaḍān with seven thousand men and five hundred of al-Gharb, and in Shawwāl he cleared [Shalūqa](place:shaluqa) at the mouth of the river.\n\nThe Marīnid general that year was [ʿUthmān](person:osman-marinid). He was a level-headed man, born in the saddle, and he understood what the Granadans did not: [Qādis](place:qadis) mattered more than anything else on the coast. In Shawwāl he landed beside it, wiped out the five hundred and eighty Granadans who held the siege lines, and brought the fortress fresh men and grain. On the twentieth of Dhū al-Qaʿda [Khālid ibn Yaḥyā](person:khalid-ibn-yahya) came to take it back. Khālid was the architect who had sat in the dīwān from sixteen and had now been made a general. He brought six thousand four hundred and sixty men, Granadans, Gharbīs and the men of [Mursiyya](place:mursiyya), against four thousand seven hundred and seventy behind the causeway and the walls. It was the worst day of the war. Three thousand eight hundred and sixty of ours were left on the causeway, in the shallows and before the gate, and fourteen hundred and twenty of theirs. Khālid brought the rest home. When the dīwān met, our lord [Saʿd](person:saad-ibn-yusuf) spoke before anyone could reproach the general. The assault had been his order, he said, given in [Gharnāṭa](place:gharnata) and not in the lines, and the dead on the causeway were his to answer for before Allāh. No one at court reproached Khālid after that.\n\nThe treasury could not replace those men, so the sultan borrowed from his own estates. Seven loans of sixty-seven dīnārs each, four hundred and sixty-nine in all, bought a company of four thousand eight hundred mercenaries. They were half of Khālid's army by autumn. The rest of the money came wherever the sultan could squeeze it: from the estates, from the ṭāʾifas, from what Fās had conceded, and from Egypt.\n\nIn Ṣafar 771 a Marīnid army of four thousand eight hundred landed at [Mālaqa](place:malaqa). It caught the host of Mursiyya, four hundred and ten men under [Juan Manuel](person:juan-manuel-enriquez), and destroyed it. Then ʿUthmān marched inland with eight thousand men to cut the realm in two at [Antaqīra](place:antaqira), on the road between Mālaqa and Gharnāṭa.\n\nKhālid met him there on the thirteenth of Rabīʿ al-Awwal with six thousand two hundred. Those who fought that day said the line nearly broke in the afternoon. The mercenaries on the left gave ground and the Marīnid horse came through the gap. Khālid filled it himself with the last of the sultan's guard. The line held. When ʿUthmān drew off at dusk, four thousand and ninety of his men lay before it, against nine hundred and sixty of ours. No battle of the war killed more of the enemy, and none mattered more. Antaqīra was the high-water mark of the Marīnid flood. The heart of the realm was not reached.\n\nThree weeks later Khālid caught eighteen hundred and seventy Marīnids besieging [Ḥiṣn al-Munakkab](place:hisn-al-munakkab) on the coast and broke them, eleven hundred dead for two hundred of ours. In the same days the first Mamlūk army came ashore at [Jarghal](place:jarghal) in the hills above [al-Mariyya](place:al-mariyya), five thousand seven hundred soldiers of Egypt on the soil of al-Andalus. But the year belonged to Fās. Of all the north shore, only [Labla](place:labla) still answered to Gharnāṭa. Marīnid armies stood at [Runda](place:runda), [Abdara](place:abdara) and the gates of Mālaqa. The treasury was spending a hundred and seventy-six dīnārs a month and taking in seventy-six.\n\n*O you who have believed, when you encounter a company, stand firm and remember Allāh much, that you may be successful.*"}, {"addr": "772-02-20", "slug": "0772-02-20-the-reckoning-of-the-faithful", "n": 45, "bn": 4, "hy": 772, "hm": 2, "hd": 20, "w": 1370, "title": "Of the Reckoning of the Faithful, in the Year the Strait Was Won", "date": "1370-09-13", "dateStr": "13 September 1370", "hdateStr": "20 Ṣafar 772", "book": "book-of-the-call", "people": ["saad-ibn-yusuf"], "places": ["fas", "qurtuba", "qarmuna", "ishbiliyya", "jayyan", "qadis", "sharish", "shaluqa", "jabal-tariq", "al-jazira-al-khadra", "gharnata"], "sources": ["1370-09-conversion-reading", "1370-09-13-state", "1366-qurtuba-muslim"], "words": 473, "catch": "When the peace with Fās was sealed, our lord Saʿd ordered", "canon": 2, "body": "When the peace with [Fās](place:fas) was sealed, our lord [Saʿd](person:saad-ibn-yusuf) ordered a count of the realm, as his grandfather's grandfathers had done after every war: how many souls, of what tongue, of what faith. The scribes worked through Ṣafar, and their reckoning is set down here, because it is the measure of everything this book is about.\n\nIn the valley of the great river, the lands won from Qashtāla in 749, seven of every hundred souls had been Andalusī at the Peace of [Qurṭuba](place:qurtuba). On the eve of the Marīnid war it was thirty-three. In faith the change was slower: eight in a hundred had been Muslim in 749, and nineteen were by the eve of the war. Twelve towns of the valley now counted themselves Andalusī, [Qarmūna](place:qarmuna) the latest of them, on the eve of the war. Only one was yet Muslim by the greater part of its people, and that one was Qurṭuba. There the faithful had been twenty-seven in a hundred at the peace and were now fifty-nine. [Ishbīliya](place:ishbiliyya) had gone from fourteen to thirty-one and [Jayyān](place:jayyan) from none to thirty. Úbeda, at the far end of the valley, had gone from none to ten. It had heard the call last.\n\nThe northern shore taught the scribes something they did not like. [Qādis](place:qadis), [Sharīsh](place:sharish), [Shalūqa](place:shaluqa), [Jabal Ṭāriq](place:jabal-tariq) and [al-Jazīra al-Khaḍrāʾ](place:al-jazira-al-khadra) had been Castilian towns when Fās took them five years before. They came back to the house of Naṣr already Muslim by the greater part of their people. In five years the Marīnids had done there what twenty years of libraries and madrasas had not done in the valley. The ʿulamāʾ of [Gharnāṭa](place:gharnata) praised it. The older men of the dīwān asked how it had been done. They reminded the court that there is no compulsion in religion, and that what is made by the sword can be unmade by the sword.\n\nAcross the whole realm the count was this. Of seven hundred and forty-nine thousand souls, three hundred and sixty-eight thousand were Muslims and three hundred and thirty-three thousand Christians, with forty-seven thousand Jews beside them. Four hundred and seven thousand were Andalusīs and two hundred and eighty-nine thousand Castilians. The Muslims had been the larger faith before, by a few thousand, and lost that place when the Portuguese south came in. Now they held it by thirty-five thousand. The realm of Gharnāṭa was Muslim by the count of its own people, and not only by the faith of its prince.\n\nThe call has been made. It is being answered, slowly, in Arabic first and in prayer after, and town by town. The madrasas will go on teaching for a hundred years. This book will go on as long as they do.\n\n*And say: The truth has come, and falsehood has departed. Indeed, falsehood is ever bound to depart.*"}, {"addr": "772-02-21", "slug": "0772-02-21-the-throne-that-endures", "n": 46, "bn": 24, "hy": 772, "hm": 2, "hd": 21, "w": 1370, "title": "Of the Last Battles, the Peace of the Northern Shore, and the Throne That Endures", "date": "1370-09-14", "dateStr": "14 September 1370", "hdateStr": "21 Ṣafar 772", "book": "book-of-balance", "people": ["saad-ibn-yusuf", "khalid-ibn-yahya", "osman-marinid", "abu-inan-faris"], "places": ["antaqira", "abdara", "malaqa", "balansiyya", "sharish", "gharnata", "baja", "fas", "runda", "marballa", "qadis", "labla", "shaluqa", "shidhuna", "arkush", "jabal-tariq", "tarifa", "al-jazira-al-khadra"], "sources": ["1369-11-21-battle-adra", "1369-12-16-battle-malaga", "1370-03-08-battle-malaga", "1370-03-31-battle-jerez", "1370-04-06-battle-jerez", "1370-05-31-battle-beja", "1370-06-morocco-near-defeat", "1370-09-12-battle-malaga", "1370-09-12-peace-morocco", "1370-09-14-strait-ends"], "words": 668, "catch": "After Antaqīra the war belonged to Khālid. On the twentieth of", "canon": 2, "body": "After [Antaqīra](place:antaqira) the war belonged to [Khālid](person:khalid-ibn-yahya). On the twentieth of Rabīʿ al-Thānī 771 he fell on a Marīnid landing at [Abdara](place:abdara) and left none of its nine hundred and seventy alive. In Jumādā al-Ūlā the Egyptians came down from Jarghal and joined him before [Mālaqa](place:malaqa). It was a strange army: Andalusīs, men of [Balansiyya](place:balansiyya), mercenaries from every shore of the sea, and the soldiers of the Mamlūk sultan in their quilted coats. When seven hundred and fifty Marīnids were foolish enough to attack it, they were destroyed without the loss of a single man. In Shaʿbān the Marīnid general Muṣliḥ al-Dīn tried again at Mālaqa with three thousand three hundred and left two thousand four hundred and forty of them under its walls.\n\nIn Ramaḍān the Egyptians wanted a victory of their own. With the men of Balansiyya beside them, five thousand six hundred and fifty Mamlūks attacked [ʿUthmān](person:osman-marinid) at [Sharīsh](place:sharish) on the third of the month. They were thrown back, and three thousand one hundred and ten of them were left in the vineyards. Six days later Khālid came to Sharīsh with seven thousand two hundred and sixty. ʿUthmān lost eighteen hundred and seventy men and Sharīsh, and the Egyptians were avenged. In Dhū al-Qaʿda a last Marīnid army of three thousand three hundred and eighty landed in al-Gharb, hoping to find [Gharnāṭa](place:gharnata)'s newest ṭāʾifa undefended. Khālid marched the length of the south to meet it at [Bāja](place:baja), and two thousand two hundred and sixty of the invaders never saw the sea again.\n\nBy the summer [Fās](place:fas) was finished, though it did not yet admit it. One more battle was needed. On the nineteenth of Ṣafar 772 two thousand eight hundred and ninety Marīnids met eight thousand three hundred and seventy Granadans at Mālaqa, where so much of the war had been fought. They lost a thousand and forty men, and we lost a hundred and fifty-four. That same day the envoys of [Abū ʿInān](person:abu-inan-faris) sealed the peace.\n\nFās gave up the whole northern shore. [Runda](place:runda) and [Marballa](place:marballa) came back to the house of Naṣr, and so did the nine towns of the so-called Kingdom of Sevilla, which ceased to exist: [Qādis](place:qadis), Sharīsh, [Labla](place:labla), [Shalūqa](place:shaluqa), [Shidhūna](place:shidhuna), [Arkush](place:arkush), [Jabal Ṭāriq](place:jabal-tariq), [Ṭarīfa](place:tarifa) and [al-Jazīra al-Khaḍrāʾ](place:al-jazira-al-khadra). That was eighty-four thousand souls, many of them already Muslims after five years under Fās. The Marīnids would pay reparations and swore to keep the sea free of their corsairs. With its ṭāʾifas, Gharnāṭa held every one of the seventy-two towns of the Strait's three lands, both of its shores. The price was written in the dīwān's registers: some thirteen thousand of the sultan's own men dead in two years of war, and twenty-three thousand of the enemy.\n\nTwo days later, on the twenty-first of Ṣafar, the chancellor read a reckoning to the court. The crown of Qashtāla had stopped sending demands. Fās had tried twice to cross and failed both times. The throne in Gharnāṭa had the same occupant it had begun the war with. For a generation every court of Christendom and the Maghrib had expected the house of Naṣr to fall, and it had outlasted them all. Our lord [Saʿd](person:saad-ibn-yusuf) answered in three words, and the scribes wrote them at the head of the register: *Gharnāṭa stands free.* Every town of the old kingdom and the valley of the great river was made a part of the realm for good, the government of the realm was confirmed for a hundred years, and the ṭāʾifas were drawn closer to the throne.\n\nSo the scale that had hung between Qashtāla and Fās for twenty-four years came to rest, and it came to rest in Gharnāṭa. Al-Ḥājj Yūsuf began this book as the tributary of one and the prey of the other. His son ended it as the master of the Strait. What the house of Naṣr does with that freedom belongs to another book.\n\nHere ends the Book of the Balance.\n\n*For indeed, with hardship comes ease. Indeed, with hardship comes ease.*"}, {"addr": "772-02-22", "slug": "0772-02-22-of-the-three-marches", "n": 47, "bn": 1, "hy": 772, "hm": 2, "hd": 22, "w": 1370, "title": "Of the Three Marches, and What Lies North of Them", "date": "1370-09-15", "dateStr": "15 September 1370", "hdateStr": "22 Ṣafar 772", "book": "book-of-the-marches", "people": ["saad-ibn-yusuf", "rodrigo-of-silves", "maria-of-portugal", "jeronimo-of-castile", "faraj-ibn-ismail"], "places": ["gharnata", "baja", "batalyaws", "marida", "tulaytula", "saraqusta", "al-ushbuna", "balansiyya", "barshaluna", "qurtuba", "mursiyya", "fas", "malaqa", "qadis", "antaqira"], "sources": ["1370-09-14-strait-ends", "1370-09-13-state", "1366-04-05-the-south-burned", "1367-10-04-castile-portugal-union", "1370-09-18-death-of-faraj"], "words": 842, "catch": "The day after the reckoning of the Strait was read, our", "canon": 3, "body": "The day after the reckoning of the Strait was read, our lord [Saʿd](person:saad-ibn-yusuf) had the great map of al-Andalus brought out of the treasury of [Gharnāṭa](place:gharnata). It had been drawn in the days of the caliphs, and no sultan of the house of Naṣr had unrolled it in living memory, because it only showed what had been lost. Across its northern half ran three lines in red ink, the *thughūr*: the marches where the land of Islam met the kingdoms of the Christians. The Lower March ran from [Bāja](place:baja) to [Baṭalyaws](place:batalyaws) and [Mārida](place:marida). The Middle March was the march of [Ṭulayṭula](place:tulaytula). The Upper March was the march of [Saraqusṭa](place:saraqusta) on the Ebro. In the caliphs' day the marches had been the realm's shield. For a hundred and fifty years since, they had been the roads by which the Christians came south.\n\nNow the sultan laid the map beside the dīwān's own, and the court saw how far the frontier had moved. The ṭāʾifa of al-Gharb under [Rodrigo of Silves](person:rodrigo-of-silves) looked across the Tagus at [al-Ushbūna](place:al-ushbuna). The ṭāʾifa of [Balansiyya](place:balansiyya) looked north up the coast toward [Barshalūna](place:barshaluna), the city of the Catalans. Between them the realm's own lands, from [Qurṭuba](place:qurtuba) to the hills of [Mursiyya](place:mursiyya), faced the long border of Qashtāla. The thughūr were the frontier again, and for the first time since the caliphs they faced the other way.\n\nThe dīwān's reckoners laid out the balance, and they began with a marriage of crowns. Three years before, in Ṣafar of the year 769, Queen [Maria of Portugal](person:maria-of-portugal) had died, and her crown had passed to her son [Jerónimo](person:jeronimo-of-castile), who had been king of Qashtāla since his father Alfonso fell on the march in the last war. Maria and Alfonso had joined their crowns by marriage a quarter of a century before; now the son wore both. Each kingdom kept its own council and its own law of succession, and the Portuguese still called themselves a free people. But al-Ushbūna and Ṭulayṭula now sent their letters to one court, and the frontier from the Tagus to the hills of Mursiyya answered to one king. For a generation the reckoners did not count Portugal as a separate realm.\n\nArghūn had thirty-six towns and had lost its nerve, and its young king wore the crown of Ṣiqilliya as well. [Fās](place:fas), across the water, had ninety and had been beaten twice. The two crowns of Jerónimo together held two hundred and eighty-three towns and four million souls: two hundred and twenty-nine towns and three million in Qashtāla, fifty-four towns and nine hundred thousand in Portugal. Gharnāṭa with its ṭāʾifas had a hundred and two towns and one million one hundred thousand. On paper the north was nearly four to one. But Qashtāla had bled for twenty years. It had lost its southern shore to the Marīnids, its south to Gharnāṭa, and a fifth of the people of Extremadura and the lands of Ṭulayṭula to the wars that burned across them. Portugal had lost its south to the ṭāʾifa of al-Gharb. The reckoners' spies found that Jerónimo kept no army in the field at all, only nine ships, while the sultan still kept his regulars under arms. Its king no longer sent demands. The court judged it an even fight, if Gharnāṭa struck before the two crowns learned to fight as one.\n\nThe reckoning of the Strait had left the sultan more than a title. The old kingdom and the valley were his for good. The jurists said the claim to all al-Andalus could now be pressed at less cost than ever before. And the ṭāʾifas had been drawn closer to the throne. The sultan had been made heir, in the eyes of his court, to the caliphs whose map lay on his table. One more war might be enough to make that claim true.\n\nThere were reasons for patience. The estates were still owed four hundred and sixty-nine dīnārs. The mercenaries still had to be paid. Thirteen thousand of the sultan's men lay in the soil of [Mālaqa](place:malaqa), [Qādis](place:qadis) and [Antaqīra](place:antaqira). And Saʿd was twenty-two, with a lifetime before him. The court remembered what his father had learned: a war of freedom cannot be fought from the treasury, but a war of conquest must be.\n\nThe sultan had the old map hung in the Hall of Ambassadors, under the cedar heavens his uncle [Faraj](person:faraj-ibn-ismail) had raised as regent, where every envoy from the north would see it. Three days later, on the twenty-fifth of Ṣafar, Faraj himself died far beyond the desert, where he had lived since his marriage in the land of Ghāna fifteen years before. He was fifty-three. The news was months on the road, and few at court still remembered his face, though every envoy who came to Gharnāṭa would stand under his ceiling. The sultan went back to the business of the treasury. Here begins the Book of the Marches.\n\n*And We wanted to confer favour upon those who were oppressed in the land and make them leaders and make them inheritors.*"}, {"addr": "772-02-27", "slug": "0772-02-27-the-survey-of-the-kingdoms", "n": 48, "bn": 2, "hy": 772, "hm": 2, "hd": 27, "w": 1370, "title": "The Survey of the Kingdoms, After the Manner of the Roads of the Eyes", "date": "1370-09-20", "dateStr": "20 September 1370", "hdateStr": "27 Ṣafar 772", "book": "book-of-the-marches", "people": ["saad-ibn-yusuf", "aiman-mamluk", "bolot-mamluk", "muhammad-ottoman", "jean-of-france", "edward-of-england", "charles-of-bohemia", "pope-abundius", "robert-of-anjou", "abu-inan-faris", "abu-ishaq-ibrahim", "jeronimo-of-castile", "joan-of-aragon"], "places": ["gharnata", "fas", "tilimsan"], "sources": ["1370-09-13-the-world", "1367-10-04-castile-portugal-union", "1367-01-30-mamluk-alliance", "1370-09-12-peace-morocco"], "words": 1131, "catch": "When the map of the caliphs hung in the Hall of", "canon": 3, "body": "When the map of the caliphs hung in the Hall of Ambassadors, our lord [Saʿd](person:saad-ibn-yusuf) saw that it showed only al-Andalus, and he asked for the rest of the world. He told the chancery to make him a survey of the kingdoms like the one Ibn Faḍl Allāh al-ʿUmarī wrote in Cairo a generation before, *The Roads of the Eyes through the Kingdoms of the Cities*. It was to say who ruled each kingdom, how many towns and men it had, whom it loved and whom it hated. The scribes questioned the Genoese factors in [Gharnāṭa](place:gharnata), the Mamlūk envoys, the captives of the last war and the pilgrims coming home from the East. At the end of Ṣafar 772 they laid before him a list of the powers of the world in order of their weight, and this is its substance.\n\n**Of the far East.** The three heaviest kingdoms of the earth lie beyond India, in al-Ṣīn and the islands past it. The reckoners set them down with care, because the numbers were hard to believe: the first of them counts its people in tens of millions. None of them has ever heard of Gharnāṭa, and the sultan said it was a comfort to know that some empires are too far away to be a danger.\n\n**Of Miṣr, the sultan's friend.** The seventh kingdom of the world is the realm of the Mamlūks, and it is the only crown that stands with Gharnāṭa. Its sultan is [Būlād](person:bolot-mamluk), who took the throne when his father Jamāl died in Ṣafar 770. He is twenty-six, and he is the half-brother of the sultan's wife [Aiman](person:aiman-mamluk), so the alliance now runs through the household as well as through the treaty. Miṣr has a hundred and fifty towns of its own and nearly as many again in its subjects, from the Ḥijāz to the Taurus, and some sixty thousand men under arms. Its weakness is at home: the envoys admitted that Cairo has been restless since the old sultan died.\n\n**Of the house of ʿUthmān.** The Ottoman Turks have done what the Companions of the Prophet could not do, and taken Constantinople. Their sultan [Muḥammad](person:muhammad-ottoman) is twenty-two, the same age as our lord. He is a careful governor and a timid soldier, and the second is said of him more quietly. He is at war with Karaman and the beyliks of Anatolia, with twenty-seven thousand men in the field and seventy-three ships at sea. The Rūm who once ruled from Constantinople keep only twenty-five towns around Demetrias in Thessaly. The ʿulamāʾ wept when they heard it. A courtier pointed out that the Turks are twenty-seventh among the powers and nowhere near the Strait.\n\n**Of the Franks.** France and England are the fourth and fifth kingdoms of the world, and they hate each other. [Jean of France](person:jean-of-france) has reigned for twenty-eight years and is losing his kingdom slowly. His realm is in disorder, and England's vassals hold Aquitaine, Burgundy, Flanders and Brittany. England has a new king, [Edward](person:edward-of-england), crowned in Dhū al-Ḥijja. His crown rules more land through its subjects than in England itself. The scribe noted that the king of France also counts Qashtāla among his enemies, and he wrote that line in red.\n\nEast of France sits [Charles of Bohemia](person:charles-of-bohemia), Emperor over three hundred and nineteen princes and cities. He is fifty-four, and by every report the ablest prince in Christendom. For reasons no envoy could explain, he names [Fās](place:fas) and Tūnis among his rivals. The [Pope](person:pope-abundius), an old man of sixty, sits at Avignon rather than Rome, and of all the princes of the north he is the only friend of Qashtāla. Italy is divided between two leagues. The Guelphs follow Naples, the Pope and Genoa. The Ghibellines follow Florence, Venice, Milan and Ṣiqilliya. Naples, Hungary and Croatia have one king, [Robert of Anjou](person:robert-of-anjou), a scholar of nineteen. His armies are far away in Halych and Volhynia. Genoa has only six towns of its own. But the scribe counted its trade and found it worth twice the trade of all Qashtāla, and he advised the sultan never to quarrel with a Genoese he owed money to.\n\n**Of the Maghrib.** Fās is eleventh in the world, two places above Gharnāṭa. It is twice beaten but not broken. [Abū ʿInān Fāris](person:abu-inan-faris) rules [Tilimsān](place:tilimsan) as his fief, and Tilimsān still had eleven thousand men under arms when the peace was sealed. The Marīnid fleet is the true danger: eighty ships, against the sultan's four. The reckoners also found that Fās names Qashtāla, Portugal and Naples as its rivals, and not Gharnāṭa. The dīwān argued over whether this meant forgiveness or contempt. Beyond Fās, the Ḥafṣid [Ibrāhīm](person:abu-ishaq-ibrahim) rules Tūnis and nine subject lands, the twenty-first power of the world. His realm is close to disorder and his quarrel is with Tilimsān, so the Marīnids have an enemy at their back.\n\n**Of the Land of the Blacks.** South of the sands, Mālī is sixteenth in the world, and every caravan of gold that reaches the Maghrib comes from its mines. Its throne stood empty when the scribes wrote, its heir is a boy of seven, and its armies are at war with the Mossi. Merchants said the gold still came north.\n\n**Of the Peninsula.** Last the scribes came home. Qashtāla is eighth in the world, and with the Portuguese crown on its king's head since Ṣafar 769 it is the greatest power any sultan of Gharnāṭa has faced. But among the great powers it stands second from the last, barely ahead of Bohemia, and no stronger. [Jerónimo](person:jeronimo-of-castile) kept no army in the field. Arghūn, forty-seventh in the world, has a king of twenty, [Joan](person:joan-of-aragon), who also rules Ṣiqilliya, and Arghūn itself has spent its strength.\n\n**Of Gharnāṭa.** Then the scribes wrote the realm itself into the list: thirteenth among the powers of the world, not yet counted among the great powers, but in the company of Delhi and of Majapahit in the islands of the Indies. Twenty years before, Gharnāṭa had no place on the list at all, because the reckoners only count sovereign kingdoms, and Gharnāṭa paid tribute to Qashtāla. The scribes judged that the distance between it and the last of the great powers was no longer great.\n\nThe sultan read the whole survey in one sitting. Then he asked for three things to be copied out on a single leaf: the king of France is Qashtāla's enemy, Fās does not count Gharnāṭa among its enemies, and Miṣr is ruled by his wife's brother. He kept that leaf with him. The rest of the survey went to the treasury beside the map of the caliphs.\n\n*O mankind, We have created you from male and female and made you peoples and tribes, that you may know one another.*"}, {"addr": "772-08-07", "slug": "0772-08-07-the-moneylenders-of-ishbiliya", "n": 49, "bn": 5, "hy": 772, "hm": 8, "hd": 7, "w": 1371, "title": "Of the Towns of the North, and the Moneylenders of Ishbīliya", "date": "1371-02-24", "dateStr": "24 February 1371", "hdateStr": "7 Shaʿbān 772", "book": "book-of-the-call", "people": ["saad-ibn-yusuf", "maryam-bint-ismail", "dua-marinid", "dolca-of-murcia"], "places": ["gharnata", "malaqa", "fas", "runda", "ishbiliyya", "jayyan", "mursiyya", "uryula"], "sources": ["1370-11-01-the-north", "1371-02-24-spread-of-usury", "1371-02-24-state", "1370-11-01-state", "1370-10-01-maryam-culture", "1370-09-26-reconquest-claim", "1370-09-20-murcia-annexation", "1371-01-29-murcia-dolca"], "words": 674, "catch": "When the war chest was empty and the mercenaries had gone", "canon": 3, "body": "When the war chest was empty and the mercenaries had gone home, our lord [Saʿd](person:saad-ibn-yusuf) turned to the lands he had won. He did not like what the dīwān's reckoners showed him. Three realms were living under one crown, and only one of them was rich.\n\nThe first was the old kingdom of the mountains and the coast, from [Gharnāṭa](place:gharnata) to [Mālaqa](place:malaqa): eighteen towns and a quarter of a million souls, nearly all of them Muslim, and nearly three-quarters of what the land could yield reaching the treasury. The second was the valley of the great river, won from Qashtāla in the wars of the last twenty years: thirty-one towns and four hundred thousand souls, one in five of them Muslim, held by the crown with half a grip and yielding three-fifths of what it might. The third was the north shore of the Strait, taken from [Fās](place:fas) only months before. There were eleven towns and eighty-five thousand souls, more than half of them Muslims, because the Marīnids had converted them. They had been fought over again and again in twenty years of war. Their fields were poorer than when the wars began, [Runda](place:runda) poorest of all. Of every hundred dīnārs the north shore could have paid, less than one came to Gharnāṭa.\n\nThen there was [Ishbīliya](place:ishbiliyya). The reckoners counted seventy-seven thousand seven hundred souls in it, more than in Gharnāṭa itself, so the greatest city of the realm was not the sultan's capital. Its weavers made cloth fine enough for kings, its smiths made arms, and its paper-makers and copyists kept a scriptorium. It was still a Christian city in its tongue and in most of its prayers. But in the last four years the Muslims within its walls had grown from twenty thousand to twenty-four thousand, and the crown's hold on it had risen from less than half to more than half. In the merchants' reckoning its market had become the first in all the West, ahead of Fās. The sultan said that a city like that was worth more than a province of wheat, and that he would rebuild the north around it.\n\nHe began with the dīwān. [Maryam bint Ismāʿīl](person:maryam-bint-ismail), who had spent four years binding the new lands to the crown, was set to the same work as [Duʿāʾ](person:dua-marinid): making the conquered towns Andalusī again. Duʿāʾ took Ishbīliya and Maryam took [Jayyān](place:jayyan), which already had its madrasa. The sultan told them he did not want the Castilians driven out, because a weaver who left took his loom with him. He wanted their children to speak Arabic.\n\nIn Shaʿbān 772 the ʿulamāʾ came to him about the moneylenders. In the towns of the valley, they said, Muslim merchant families had begun to lend at interest, as the Jews and the Genoese did, and the practice was spreading. The qāḍī recited the verse: *Allāh has permitted trade and forbidden usury.* The court waited. The sultan had sat through every war of his reign in debt to his own estates, and he still owed seven loans. He answered that the ʿulamāʾ were overreacting, and that he would sooner have Muslims lending in Ishbīliya than Genoese. The ʿulamāʾ went away displeased, and they did not forget it.\n\nThe treasury now gained a little over ten dīnārs a month, and the sultan meant to spend all of it in the north. There were Castilian rebels in arms in the hills and a claim against Qashtāla to be drawn up. There was also [Mursiyya](place:mursiyya), one of the two oldest ṭāʾifas, which the crown had begun to draw into its own hands; its new ḥājiba, [Dolça](person:dolca-of-murcia) of the old house of [Uryūla](place:uryula), had taken her seat only that winter. None of it would come cheap. But the court noted that this was the first sultan of the house of Naṣr to talk about rebuilding the towns of the valley instead of defending the passes against them.\n\n*O you who have believed, do not consume one another's wealth unjustly, but only in lawful business by mutual consent.*"}, {"addr": "775-09-06", "slug": "0775-09-06-the-battle-before-barshaluna", "n": 50, "bn": 3, "hy": 775, "hm": 9, "hd": 6, "w": 1374, "title": "Of the March into the Upper March, and the Battle Before the Walls of Barshalūna", "date": "1374-02-19", "dateStr": "19 February 1374", "hdateStr": "6 Ramaḍān 775", "book": "book-of-the-marches", "people": ["sayyida-of-fezzan", "dua-marinid", "saad-ibn-yusuf", "joan-of-aragon", "bolot-mamluk", "ali-ibn-yusuf"], "places": ["mursiyya", "gharnata", "balansiyya", "barshaluna"], "sources": ["1373-01-16-state", "1373-01-16-court", "1372-12-13-murcia-fezzan", "1373-01-16-hajj", "1373-10-01-march-on-valencia", "1373-12-01-war-on-aragon", "1373-12-01-mamluks-join", "1374-02-19-battle-barcelona"], "words": 853, "catch": "In the winter of 774 the last of the seven loans", "canon": 3, "body": "In the winter of 774 the last of the seven loans of the Marīnid war was paid back to the estates, every dirham of it, with the interest the dīwān had promised. The sultan had refused to think of a new war, or even of the pilgrimage, while he still owed his own lords money. A man who stood at ʿArafa in debt, he said, stood there with another man's purse. Now the treasury took in half again what it spent, every estate paid more into it than before, and even the north shore, which had yielded almost nothing at the peace, had begun to pay. His mother [Sayyida](person:sayyida-of-fezzan) had taken a seat in the dīwān beside [Duʿāʾ](person:dua-marinid), and a marriage had bound the ṭāʾifa of [Mursiyya](place:mursiyya) to Fezzan, her homeland beyond the desert. Only then did the sultan begin to make ready for the Hajj.\n\nThe truce with Arghūn ran out in Dhū al-Ḥijja of the year 774, on the day of the feast, and the sultan let it run out in [Gharnāṭa](place:gharnata) rather than at Minā. He had put off his pilgrimage for it, and he did not mean to waste the delay. By Rabīʿ al-Thānī 775 the dīwān's second claim was written, this one against the crown of the Catalans, and our lord [Saʿd](person:saad-ibn-yusuf) rode north at the head of the armies of the realm. He wintered them at [Balansiyya](place:balansiyya), within sight of the Upper March. The old map of the caliphs called that country the Thaghr al-Aʿlā, and no army of the house of Naṣr had ever marched into it.\n\nArghūn stood alone. Its king, [Joan](person:joan-of-aragon), was twenty-four and wore two crowns, Arghūn's and Ṣiqilliya's, but the second brought him only three ships and Ṣiqilliya's subjects across the sea. The Genoese, who were the Sicilians' friends, were busy with a war against Bologna and Pisa. The Pope at Avignon wrote letters and sent nothing. The dīwān reckoned the Catalan host at a few hundred men under arms against the sultan's three thousand three hundred. So the sultan raised no levies. He said the regulars would do, and that the peasants of the valley had a harvest to bring in.\n\nOn 14 Jumādā al-Ākhira 775 the herald read the declaration in Balansiyya. The same week, word came from Alexandria that the sultan [Būlād](person:bolot-mamluk) had answered the call as an ally should. The Mamlūk galleys had put out with the Egyptian vassals behind them, and they were sailing for the shores of Ṣiqilliya, so that Joan's second crown would have to look to itself.\n\nKing Joan chose not to sit out a siege. He called out the levies of Catalonia: archers from the mountain towns, foot from the coast, and a few hundred horsemen, among them the mailed knights of the estates around [Barshalūna](place:barshaluna). In Shaʿbān he brought five thousand three hundred men to meet the sultan's three thousand three hundred on the coastal plain below the city walls.\n\nThe sultan commanded in person. He set his heavy foot in the centre to hold whatever came at them. He gave the right wing, and two-thirds of all the horse, to his brother [Abū al-Ḥasan ʿAlī](person:ali-ibn-yusuf), who was eighteen and had never led men in battle. The sultan kept the left under his own banner. The plan was the old one of the Andalusī jinetes: hold the centre, ride round the wings, and close the jaws.\n\nThe battle lasted three weeks of manoeuvre, sallies and skirmishes in the winter rain, and it ran on into Ramaḍān. The jurists ruled that men in the field were travellers and might break the fast, and the sultan broke it with them so that none would be ashamed to eat. The centre did what was asked of it. It took the weight of the Catalan foot and the archers' arrows and did not move, while the two wings fell on the Aragonese flanks and destroyed them. By the end only the Catalan centre was left on the field: levies, and the Catalan knights gathered around them. Then the centre pushed forward. Abū al-Ḥasan's right wavered under the knights' last charge, and for a moment the court's watchers on the hill thought the day might turn. Then the sultan brought the left round on the Catalans' other side, and they were caught between the two wings.\n\nIt ended on 6 Ramaḍān. Three thousand three hundred and seventy-five of King Joan's men lay dead or scattered before the walls of his capital, against one thousand two hundred and twenty-eight of ours. Barshalūna's gates were shut, and the Catalan army had left the field. The court poets compared the battle to a woven cloth, with the centre the warp, the horse the weft, and the sultan the weaver, and for once the courtiers did not think they had exaggerated. It was the first Muslim victory before Barshalūna since the days of the caliphs. It had cost the realm more than a third of the army that fought it.\n\n*And already had Allāh given you victory at Badr while you were few. So fear Allāh, that you may be grateful.*"}, {"addr": "775-09-24", "slug": "0775-09-24-the-pursuit-to-tarrakuna", "n": 51, "bn": 4, "hy": 775, "hm": 9, "hd": 24, "w": 1374, "title": "Of the Pursuit to Ṭarrakūna", "date": "1374-03-09", "dateStr": "9 March 1374", "hdateStr": "24 Ramaḍān 775", "book": "book-of-the-marches", "people": ["saad-ibn-yusuf", "joan-of-aragon", "jean-of-france"], "places": ["barshaluna", "tarrakuna", "gharnata", "walba"], "sources": ["1374-03-09-battle-tarragona", "1374-02-19-battle-barcelona", "1374-03-09-france-busy", "1372-02-01-france-england", "1374-03-09-constructions"], "words": 449, "catch": "Our lord Saʿd gave the Catalans no time to gather again", "canon": 3, "body": "Our lord [Saʿd](person:saad-ibn-yusuf) gave the Catalans no time to gather again under the walls of [Barshalūna](place:barshaluna). He marched the whole army south along the coast after what was left of King [Joan](person:joan-of-aragon)'s army: thirteen hundred archers and a few dozen riders making for the old Roman walls of [Ṭarrakūna](place:tarrakuna).\n\nThe jinetes caught them on the plain before the city, and the foot came up behind; it ended on 24 Ramaḍān. It was hardly a battle. The archers had no horse to cover them and nowhere to run, and the sultan's riders broke them in a morning. Thirteen hundred Catalans were killed. Eleven horsemen surrendered and were taken into the sultan's service, to the delight of the court, which said that Arghūn was now paying the sultan in men. Thirty-one of ours were lost.\n\nWhen the sultan broke the fast that night in the camp outside Ṭarrakūna, the scouts reported that the whole host of Arghūn now came to a hundred and sixty-one levies hiding in the mountains. The king who wore two crowns had no army left to defend either of them.\n\nThe sultan's council sat late that night, and the talk was of Ifranja as much as of Arghūn. Beyond the Pyrenees the king of France, [Jean](person:jean-of-france), was fighting for his kingdom against the English again. The merchants said the English held the west of France from the sea of Normandy to Poitou, and that every French lance was needed there. In any other year, the sultan said, he would have been wary of carrying his banners up to the French border, because a French king with nothing else to do might come over the mountains to save his Catalan neighbour. This year the French king had plenty to do. Every month the English kept him busy was a month the Upper March lay open. The sultan resolved to take all of Arghūn, from the Ebro to the Pyrenees, before France was free to look south. He told the dīwān it was a race, and that he meant to win it.\n\nBefore he slept he sealed the week's letters for home, as he did throughout the campaign, and the war took up less of them than the building. The treasury was to go on paying for the new royal court rising in [Gharnāṭa](place:gharnata), for the mines being cut at Almonaster in the hills above [Walba](place:walba), and for stronger walls on the frontier fort at Aracena, on the Castilian border. The Upper March, he wrote, was no reason to leave the Lower March unguarded, and a mine opened in a year of war paid as well as one opened in peace.\n\n*So they defeated them by permission of Allāh.*"}, {"addr": "775-11-19", "slug": "0775-11-19-the-regency-of-dua", "n": 52, "bn": 6, "hy": 775, "hm": 11, "hd": 19, "w": 1374, "title": "Of Duʿāʾ's Regency, and the Tithe Given to the ʿUlamāʾ", "date": "1374-05-02", "dateStr": "2 May 1374", "hdateStr": "19 Dhū al-Qaʿda 775", "book": "book-of-the-call", "people": ["dua-marinid", "saad-ibn-yusuf", "sayyida-of-fezzan"], "places": ["gharnata", "barshaluna"], "sources": ["1374-03-jamaa-tithes", "1374-05-02-jamaa-passes", "1371-02-24-spread-of-usury", "1374-02-19-battle-barcelona"], "words": 464, "catch": "While the sultan was in the Upper March, the court at", "canon": 3, "body": "While the sultan was in the Upper March, the court at [Gharnāṭa](place:gharnata) was run by a woman, and nobody who knew her was surprised. [Duʿāʾ](person:dua-marinid) the Marīnid had sat in the dīwān for nineteen years, under three husbands and two reigns. She had brought the court foreign learning and the nobles' displeasure with it, and she had spent the last thirteen of those years making the Christians of the new lands into Andalusīs. When our lord [Saʿd](person:saad-ibn-yusuf) rode north, he left the seal with her. The sultan's mother, [Sayyida](person:sayyida-of-fezzan), sat beside her in the dīwān. No one at court could remember the realm in more experienced hands.\n\nThe quarrel over the moneylenders was still open. Three years earlier the sultan had told the ʿulamāʾ they were overreacting, and they had nursed the wound since. Duʿāʾ meant to heal it before the army came home. In the spring of 775 a letter came from the camp before [Barshalūna](place:barshaluna), written in the sultan's own hand. It gave her leave to summon the Jamāʿa. The question she put to it was the tithe: who should collect the dues of the faithful and the taxes of the dhimmīs, and by what rule. Across the realm, and above all in the new lands, collection had grown irregular. Each town paid what its governor could squeeze out of it, and the Christians and Jews of the valley never knew from one year to the next what they owed. Duʿāʾ proposed to give the whole business to the ʿulamāʾ, under one rule for the realm. They would gain the revenue and the authority over the dhimmī communities. The crown would gain a tax that was reliably paid.\n\nThe ʿulamāʾ were delighted. The nobles were not. Every dirham the scholars collected was a dirham the lords of the valley could not, and they made their price plain. Duʿāʾ paid it. It was a handful of small privileges, nothing the sultan would notice from Catalonia, and each of them bound the peasants of the nobles' estates a little more tightly to the land. On 19 Dhū al-Qaʿda 775 the Jamāʿa voted the measure through. For ten years the tithe would be regulated across the realm, the ʿulamāʾ would be content, and the treasury would collect more of what it was owed.\n\nDuʿāʾ wrote to the sultan that the scholars were reconciled to him and the dhimmīs would know what they owed. She also wrote that the nobles had been bought cheaply. The sultan wrote back that nothing the nobles sold was cheap, and that the peasants would remember the price after the lords had forgotten it. But he did not undo the bargain. He had a war to finish.\n\n*And consult them in the matter; then when you have decided, rely upon Allāh.*"}, {"addr": "776-08-02", "slug": "0776-08-02-of-the-siege-of-barshaluna", "n": 53, "bn": 5, "hy": 776, "hm": 8, "hd": 2, "w": 1375, "title": "Of the Siege of Barshalūna, the Taking of Māliṭa, and the Two Princes", "date": "1375-01-06", "dateStr": "6 January 1375", "hdateStr": "2 Shaʿbān 776", "book": "book-of-the-marches", "people": ["saad-ibn-yusuf", "ramadan-of-barqa", "bolot-mamluk", "ismail-ibn-saad", "yusuf-ibn-saad", "dua-marinid", "aiman-mamluk"], "places": ["barshaluna", "gharnata", "jarunda", "fas"], "sources": ["1374-10-25-malta-taken", "1374-11-12-battle-george-bay", "1374-10-the-princes-tutors", "1375-01-06-mamluk-army-catalonia", "1375-01-06-court-factions", "1374-05-23-battle-zuwara", "1374-06-24-battle-gharyan"], "words": 656, "catch": "Arghūn had no army left, but Barshalūna still had its walls.", "canon": 3, "body": "Arghūn had no army left, but [Barshalūna](place:barshaluna) still had its walls. They were the walls of the old counts of the city, built on Roman ones, with the sea at their back where the Catalan galleys could come and go. In the last days of Dhū al-Ḥijja 775, with the Feast of the Sacrifice kept in camp, our lord [Saʿd](person:saad-ibn-yusuf) drew his lines around the city. The siege that followed was not the work of a season. Summer passed, and autumn, and the sultan's engineers counted the days by the stones they had brought down. The townsmen counted them by what was left in their granaries.\n\nThe war was being fought on other shores too. The Mamlūk sultan [Būlād](person:bolot-mamluk) had promised to keep the second crown of King Joan busy, and he kept his word through the shaykh of Barqa, [Ramaḍān](person:ramadan-of-barqa). Ramaḍān was a Baḥrī of the sultans' own house, fifty-four years old, with four wives, eight children, and a soldier's temper. In the spring he had marched west along the coast of Ifrīqiya against the Jabal Nafūsa, the Berbers of the mountains who paid homage to Ṣiqilliya. He scattered their army at Zuwāra and finished it at Gharyān. Then he took ship. In Jumādā al-Ūlā 776 he landed two thousand nine hundred men on Māliṭa, the rock between Ṣiqilliya and Ifrīqiya, which the Duke of Athens held for the Sicilian crown, and took it. The Arabs had held that island once, and the Normans had taken it from them. The court at [Gharnāṭa](place:gharnata) said it was another front of the faith's return, from the Ebro to the sea of Ṣiqilliya.\n\nThe Sicilians did not let it go quietly. Three weeks later, on 6 Jumādā al-Ākhira, their fleet of thirty-one sail found Barqa's eight ships at anchor in the bay below the island, which the Christians call St George's. Not one of Ramaḍān's ships came out of it. Māliṭa stayed taken, but its garrison was cut off from home, and the Sicilians let the shaykh know that the sea around their island was still theirs.\n\nIn those same weeks the sultan settled a matter of his own house, and it was harder than the siege. His father had brought the finest tutors of the Islamic world to Gharnāṭa for him when he was a boy, and the court said the realm had been paying back the cost ever since in victories. Now there were two princes. The heir, [Ismāʿīl](person:ismail-ibn-saad), son of [Duʿāʾ](person:dua-marinid), was eight, and already had a tongue that could talk a qāḍī out of his own verdict. [Yūsuf](person:yusuf-ibn-saad), son of [Aiman](person:aiman-mamluk) the Mamlūk, was three and already following his father about the yard with a wooden sword. Duʿāʾ wrote from the regency that the tutors were an heir's right and an heir's alone. The sultan wrote back from the camp before Barshalūna that both were his sons. The masters were sent for, at great cost, and both boys sat before them. Duʿāʾ said nothing more about it, which the court took for a bad sign.\n\nOn 2 Shaʿbān 776 a second Mamlūk host was in Catalonia. There were four thousand two hundred and seventy-two of them, foot and horse, under another Baḥrī cousin of the sultans' house. They marched through [Jarunda](place:jarunda) for Empúries under the mountains, though the country had been stripped bare and they could draw no bread from it. Barshalūna was already under siege and hardly needed them. The court understood what they had come to say. The Marīnids of [Fās](place:fas), Duʿāʾ's house, had twice made war on Gharnāṭa in a dozen years. The Baḥrī sultans of Miṣr, Aiman's house, were fighting beside it in Ifrīqiya, at Māliṭa and now in Catalonia. Those who had spoken for the Mamlūk alliance were heard more often in the dīwān that winter, and Aiman's household had more visitors than it had had in years.\n\n*The believing men and believing women are allies of one another.*"}, {"addr": "776-10-11", "slug": "0776-10-11-of-the-peace-of-the-upper-march", "n": 54, "bn": 6, "hy": 776, "hm": 10, "hd": 11, "w": 1375, "title": "Of the Peace of the Upper March, and the End of Arghūn", "date": "1375-03-15", "dateStr": "15 March 1375", "hdateStr": "11 Shawwāl 776", "book": "book-of-the-marches", "people": ["saad-ibn-yusuf", "joan-of-aragon", "ramadan-of-barqa"], "places": ["barshaluna", "qurtuba", "balansiyya", "tarrakuna", "jarunda", "larida", "turtusha", "saraqusta", "mursiyya", "ishbiliyya", "gharnata"], "sources": ["1375-03-15-peace-aragon", "1375-03-15-aragon-falls-apart", "1375-03-15-state", "1375-03-15-the-new-taifas", "1374-11-12-battle-george-bay"], "words": 863, "catch": "By the end of Ramaḍān 776, Barshalūna had been under siege", "canon": 3, "body": "By the end of Ramaḍān 776, [Barshalūna](place:barshaluna) had been under siege for two hundred and eighty days. The walls on the landward side were breached in three places, and the townsmen were eating what townsmen eat when the bread is gone. King [Joan](person:joan-of-aragon) knew how few days he had left. He was not finished, though. He still wore the crown of Ṣiqilliya, and the Sicilians had an army of five thousand levies and the fleet that had sunk Barqa's ships off Māliṭa. A king with an island behind him could lose his capital and still go on fighting, and the war might go on for years.\n\nThe shaykh of Barqa ended that hope. [Ramaḍān](person:ramadan-of-barqa) had lost his ships, so he found others. In the last weeks of the fast he put three thousand men ashore on Ṣiqilliya itself and took Saraqūsa by storm, the old city of the Greeks on the island's eastern shore. The Sicilian levies could probably have driven his three thousand back into the sea. But the sultan's envoys, when they came to King Joan in the days after the feast of the breaking of the fast, asked him what he would do about the next landing, and the one after that.\n\nThey gave him a choice. He could make peace. Arghūn would pass to the sultan. Māliṭa would pass to the Mamlūks. And the king himself would go to Balarm unharmed and free, with his household and his Sicilian crown. Or the war could go on in Ṣiqilliya. The island had been a land of Islam for two hundred years before the Normans took it. The envoys said its peasants would soon show whether they remembered the faith of their forefathers as well as [Qurṭuba](place:qurtuba) had. Joan was greedy, but he was not a fool. On 11 Shawwāl 776 he accepted, and sailed for Balarm.\n\nBy the time the peace was sealed, Arghūn had already come apart. Its outlying lordships had gone their own ways in the last months of the war. Montpellier, beyond the mountains, swore itself to the king of Inkiltara rather than the king of Ifranja. Sassari, on the island of Sardāniya, was taken back by the judges of Arborea, who were vassals of Janawa. What was left was thirty-four towns from the Pyrenees to the Ebro: Barshalūna and [Ṭarrakūna](place:tarrakuna), [Jarunda](place:jarunda) under the mountains, [Lārida](place:larida) on the Segre, [Ṭurṭūsha](place:turtusha) at the Ebro's mouth, Perpignan beyond the passes, and the hill towns of the old Aragonese marches at Fraga, Munt Shūn and Barbashturu. Half a million souls lived in them, nearly all of them Catalan and Christian. All of it passed to the sultan, and the Kingdom of Arghūn held no land at all. The courtiers called it the end of Arghūn. The sultan said: for now.\n\nThe dīwān's reckoners brought him the new count, and it made the old courtiers uneasy. The realm now had ninety-four towns and one million two hundred and seventy-five thousand souls. For the first time, the Catalans outnumbered the Andalusīs in the sultan's own lands, four hundred and fifty-five thousand to four hundred and fifty-two thousand. The Christians outnumbered the faithful two to one. Barshalūna, with forty-six thousand people, was the third city of the realm after [Ishbīliya](place:ishbiliyya) and [Gharnāṭa](place:gharnata). The war had cost the sultan one thousand two hundred and sixty men in battle and Arghūn four thousand seven hundred, besides those the siege and the winter took. In fifteen months the sultan had more than doubled the number of Christians who called him lord.\n\nOur lord [Saʿd](person:saad-ibn-yusuf) did not mean to keep it that way. He had read the Survey of the Kingdoms. He knew what Ifranja, Qashtāla and the Pope at Avignon would say of a Muslim sultan who swallowed a Christian kingdom whole. So he told the dīwān that the crown would not keep Catalonia and Arghūn. They would become two new ṭāʾifas, like [Balansiyya](place:balansiyya) and al-Gharb before them. One would be Catalonia on the coast. The other would be Arghūn itself, raised again in the interior, a successor kingdom to the one that had died. The sultan would not be seen to have seized Aragonese land. He would be seen to have returned it to its rightful heirs, under his protection. In the same reordering, [Mursiyya](place:mursiyya), a ṭāʾifa for thirty-five years, would be taken into the crown directly.\n\nThe old men of the dīwān who had studied the caliphs' map in the Hall of Ambassadors understood what came next. The War of the Upper March had been won without [Saraqusṭa](place:saraqusta), the Upper March's own capital. Saraqusṭa and the heart of old Arghūn, from the Ebro to the mountains of Jaca, were held by Qashtāla. A restored Arghūn would have a claim to them, and its protector would have a cause. The truce with Qashtāla would end on the fourth day of Muḥarram 777. The sultan's scribes were already drafting the claim. He meant the world to read it not as a war of Gharnāṭa, but as the restoration of Arghūn.\n\n*But if they intend to deceive you, then sufficient for you is Allāh. It is He who supported you with His help and with the believers.*"}, {"addr": "776-10-12", "slug": "0776-10-12-of-the-restoration-of-al-andalus", "n": 55, "bn": 7, "hy": 776, "hm": 10, "hd": 12, "w": 1375, "title": "Of the Reordering of the Realm, and the Restoration of al-Andalus", "date": "1375-03-16", "dateStr": "16 March 1375", "hdateStr": "12 Shawwāl 776", "book": "book-of-the-marches", "people": ["saad-ibn-yusuf", "dolca-of-murcia", "bernarda-of-murcia", "ismail-ibn-saad", "francesc-de-montsoriu", "alfons-de-borja", "maryam-bint-yusuf", "aiman-mamluk", "fatima-bint-yusuf"], "places": ["mursiyya", "barshaluna", "qurtuba", "gharnata"], "sources": ["1375-03-15-the-new-taifas", "1375-03-16-murcia-into-the-crown", "1375-03-16-bernarda-betrothed", "1375-03-16-two-new-taifas", "1375-03-16-restoration-of-al-andalus", "1375-03-17-maryam-to-the-diwan", "1375-04-15-catalan-marriage"], "words": 788, "catch": "The ink on the peace with Arghūn was hardly dry when", "canon": 3, "body": "The ink on the peace with Arghūn was hardly dry when our lord [Saʿd](person:saad-ibn-yusuf) reordered the realm. He did it in three parts, and the court said afterwards that the third was the one the first two had been for.\n\nThe first part was [Mursiyya](place:mursiyya). It had been one of the first ṭāʾifas, under the sultan's protection for thirty-five years, and the crown now took it into its own hands. Its towns, from Mursiyya and Qarṭājanna to Lūrqa and the hills of Albacete, passed to the sultan directly. Its ḥājiba, [Dolça](person:dolca-of-murcia), the old house of Oriola's daughter, was not cast aside. She was granted lands and titles and confirmed as a governor. Her daughter [Bernarda](person:bernarda-of-murcia), eight years old and gifted beyond her years, was betrothed to the heir [Ismāʿīl](person:ismail-ibn-saad). The boy was nine and charmed everyone who met him. His tutors noted that he had already learned to tell each of his elders what that elder wished to hear, and they did not all count it a virtue. The crown's reach in Mursiyya would be short at first, and the sultan meant it to be. Mursiyya's traders were bound to the Catalans of the coast, and its court had a Catalan cast to it, so he let its institutions stand inside the state instead of ignoring them. There was one thing the dīwān watched. Bernarda, a Castilian by her father's blood, was being raised at the court of Qashtāla. The betrothal held all the same.\n\nThe second part was the conquered land itself. The sultan did not keep it. In the east he freed the Catalans from the Aragonese, as his heralds put it, and made a strong ṭāʾifa of them around [Barshalūna](place:barshaluna): twenty-eight towns and four hundred and fifty thousand souls under a Catalan of their own, [Francesc de Montsoriu](person:francesc-de-montsoriu), whom the court called the ḥājib. In the west, on the edge of the Aragonese hills, he proclaimed a renewed Arghūn: six towns around Benabarre and Munt Shūn, under a king of the house of Borja, [Alfons](person:alfons-de-borja), whom the scribes counted the fifth Alfons to wear that crown. It was an Islamic state remade from the old one, dressed as its successor. The kings of Ifranja and the Pope at Avignon could say that the sultan had swallowed a Christian kingdom. They could not easily say it of a sultan who had given Arghūn back to a king of Arghūn.\n\nThe third part was the restoration. Ever since the first war against the Aragonese, the sultan had called himself the successor of the caliphs. Now he gave up the word successor. On 12 Shawwāl 776 the dīwān proclaimed the restoration of al-Andalus: not a new state that inherited the old one, but the old one itself, a single line running back through the Naṣrids and the ṭāʾifas to the Umayyads of [Qurṭuba](place:qurtuba) and the conquest, more than six hundred years. The sultanate of [Gharnāṭa](place:gharnata) was no more. In its place stood al-Andalus, and its lord was Emperor and Sultan. Woe to those who denied it.\n\nThe scholars put a question to him that al-Andalus had faced since the days of the Umayyads. Would he revive the convivencia of the caliphs, when mosques stood beside synagogues and churches, Ibn Rushd argued with Aristotle and Maimonides found refuge under Muslim rule? Or would he take the road of the Almohads and the Almoravids, who crossed the Strait with armies of Berber cavalry and built an empire on military piety and strict doctrine? The Emperor did not hesitate. *Let Qurṭuba shine again as the ornament of the world.* Tolerance, wealth and learning were to stand level with the Word. The realm would feel it for thirty years, in its scholars and its markets and in the ease of its Christians and Jews.\n\nThe dīwān changed with the realm. The next day the Emperor's younger sister [Maryam](person:maryam-bint-yusuf) took a seat in it, eighteen years old and the ablest mind at court, set to reshaping the realm's ideals. His principal wife, [Aiman](person:aiman-mamluk), held no office there, for no custom allowed a consort to sit on the council. Everyone at court knew she sat there all the same, by the strength of the harem. A month later his sister [Fāṭima](person:fatima-bint-yusuf) was married to the ḥājib of Barshalūna, and the house of Naṣr was bound to the Catalans.\n\nMuch work remained. The bureaucracy would have to stretch over the new lands, and Qashtāla watched the consolidation greedily from behind a truce with three months left to run. But the empire had been proclaimed, and it was not waiting for the Christians' permission.\n\n*Say: O Allāh, Owner of sovereignty, You give sovereignty to whom You will, and You take sovereignty away from whom You will.*"}, {"addr": "777-08-20", "slug": "0777-08-20-of-the-war-of-restoration-and-the-day-of-shalba", "n": 56, "bn": 8, "hy": 777, "hm": 8, "hd": 20, "w": 1376, "title": "Of the War of the Aragonese Restoration, and the Day of Shalba", "date": "1376-01-14", "dateStr": "14 January 1376", "hdateStr": "20 Shaʿbān 777", "book": "book-of-the-marches", "people": ["saad-ibn-yusuf", "francesc-de-montsoriu", "alfonso-de-onate", "dua-marinid", "abu-inan-faris", "abu-al-fadl-marinid", "jadila-bint-yusuf"], "places": ["sar
