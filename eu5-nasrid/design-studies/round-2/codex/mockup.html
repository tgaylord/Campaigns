were easier to take one at a time, and they noticed that the spies were told to say something a little different in each.\n\nAt home he began to build an army that would not need the umarāʾ to raise it. In a dozen towns and cities of the empire, from Lisbon, Évora and Santarém to Toledo, Córdoba, Granada, Málaga and Almería, the crown built armouries, so that each could arm its own men and fill the ranks without waiting on any lord's levy. The umarāʾ watched the walls go up and understood exactly what they were for.\n\nThe house changed in those years too. In Ṣafar 829 the heir's daughter [Umm al-Fatḥ](person:umm-al-fath-bint-muhammad), fourteen years old and named for her grandmother, took a seat in the dīwān beside her mother [Jadīla](person:jadila-bint-saad-ibn-faraj), and the clerks said she was already abler than her father had ever been. Saʿd ibn Yūsuf and then Prince Yūsuf himself turned from settling the new lands to spreading the tongue and learning of al-Andalus through them. And on 15 Rajab 831 [Yūsuf ibn Ismāʿīl](person:yusuf-ibn-ismail), lord of [Banbalūna](place:banbaluna) since the Peace of Rajab, died of a fever in camp at fifty-six. His son [Aḥmad](person:ahmad-ibn-yusuf-ibn-ismail), who had sat in the dīwān for thirteen years and was one of the ablest men of the house, succeeded him on the Navarrese frontier.\n\nThen the Emperor called the Jamāʿa. It met at [Ishbīliya](place:ishbiliyya) on 10 Shaʿbān 831, and the Emperor told it that a war was coming and the empire must be ready. He asked the assembly for one thing. Since the days of the first sultans the great houses had held the Primacy of Nobility: they counted themselves the ruler's equals, and no important decision could be made without them. The Emperor said that an empire about to go to war could not wait for every lord in it to be consulted, and that the caliphs of Qurṭuba had consulted no one. The ʿulamāʾ, the merchants and the dhimmī voted with the crown, and the Primacy was revoked.\n\nThe umarāʾ had lost their mercenaries in 817 and their lordships with them. Now they had lost their equality. Barely one great house in six was content with the crown, and the peace of the realm, which had been mended slowly for fourteen years, was worn through. The Emperor did not send them gifts this time. He had armouries now, and a war to fight, and he seemed to think the umarāʾ would come round once they had castles in Galicia to quarrel over.\n\n*Indeed, Allāh commands you to render trusts to whom they are due, and when you judge between people, to judge with justice.*"}, {"addr": "831-08-19", "slug": "0831-08-19-of-the-village-granaries-and-the-road-to-niani", "n": 89, "bn": 9, "hy": 831, "hm": 8, "hd": 19, "w": 1428, "title": "Of the Village Granaries, and the Road to Niani", "date": "1428-06-03", "dateStr": "3 June 1428", "hdateStr": "19 Shaʿbān 831", "book": "book-of-the-encircling-sea", "people": ["ismail-ibn-saad", "tiramakhan-mali", "khayr-al-din-al-jayyani"], "places": ["ishbiliyya", "qurtuba"], "sources": ["1428-06-03-the-village-granaries", "1428-06-03-farms-mills-and-acequias", "1428-06-03-embassy-to-niani", "1428-05-25-primacy-revoked", "1391-07-coast-to-mali"], "words": 519, "catch": "The Emperor Ismāʿīl had taken the umarāʾ's equality from them at", "canon": 3, "body": "The Emperor [Ismāʿīl](person:ismail-ibn-saad) had taken the umarāʾ's equality from them at the Jamāʿa of 831, and he knew it would not be forgotten. He did not try to win back the great houses. He went around them, to the people who lived on their lands. In the first half of that year, at his insistence, the crown began to build a granary in nearly every large village of the empire: a stone store, held in common, where a farming settlement could set aside part of each harvest against a bad year. The Emperor told the dīwān why. He was old enough to remember the wars with Qashtāla, when armies ate the harvest before it was in, bread doubled in price in a season, and the villages of the frontier went hungry while their lords sold grain in the cities. A village with its own store would not go hungry again, and it would know who had built the store.\n\nThe granaries had to be filled. Across several of the farming countries the crown laid out new wheat fields, built windmills on the ridges to grind them, and dug acequias to water them, in the manner of the canals the Emperor's father had dug along the great river from Ishbīliya to [Qurṭuba](place:qurtuba). Lumber mills went up beside them to cut the timber for the granaries and, when the time came, to rebuild them. The work cost the umarāʾ almost nothing and the peasants less, and that was the point: the villages would owe their bread to the crown, and the lords could not even complain of the price.\n\nThe other half of his plan lay across the sea. Thirty-seven years earlier, as crown prince, Ismāʿīl had sent [Khayr al-Dīn al-Jayyānī](person:khayr-al-din-al-jayyani) to find a road to Mālī by water, so that the gold of the south would no longer pay a toll at every well of the Ṣaḥrāʾ. Now the road was there, by way of the islands of the Green Cape, and in the spring of 831 his envoys took it. They sailed south to the coast and went inland, up the rivers and across the savanna, to Niani, the city of Mansa [Tiramakhan](person:tiramakhan-mali), who had ruled the gold country for eighteen years. They carried gifts from Ishbīliya, and they came home with gifts from Niani and with something worth more: the Mansa's word that Andalusī merchants would pay no tariff anywhere in his empire.\n\nBefore the envoys had finished their report, the merchants of Ishbīliya were fitting out expeditions to bring the gold north. Some of it would go to the jewellers of the capital, whose work was already sold from Cairo to Bruges. The rest would be sold on to the Christians, who had no road to Mālī of their own and would have to buy its gold from the Emperor. The court said that the Emperor had spent the umarāʾ's privileges on the villages and would get them back from the Franks.\n\n*He said: You will plant for seven years consecutively; and what you harvest, leave in its spikes, except a little from which you will eat.*"}, {"addr": "832-02-22", "slug": "0832-02-22-of-the-english-crown-of-france", "n": 90, "bn": 25, "hy": 832, "hm": 2, "hd": 22, "w": 1428, "title": "Of the English Crown of France", "date": "1428-12-01", "dateStr": "1 December 1428", "hdateStr": "22 Ṣafar 832", "book": "book-of-the-marches", "people": ["ismail-ibn-saad", "edward-v-of-england", "philippe-vii-of-france"], "places": ["ishbiliyya", "balansiyya", "barshaluna"], "sources": ["1427-04-28-war-in-france", "1428-11-28-peace-of-the-hundred-years-war", "1428-12-01-the-english-crown-of-france", "1428-05-25-the-spies-go-north", "1419-09-the-road-to-balansiyya"], "words": 548, "catch": "The kings of England and France had been at war, on", "canon": 3, "body": "The kings of England and France had been at war, on and off, since before the house of Naṣr had a sultan old enough to remember it. The scribes of the first survey had written in 772 that the two hated each other, and that the French king was losing his kingdom slowly. In Rajab 830 the English went to war again, with all their vassals in France behind them and King Fernando of Qashtāla beside them, and this time the losing was not slow. Fernando made his own peace with the French in the spring and went home. The English did not.\n\nOn 19 Ṣafar 832 France made peace. It gave up eighty towns. Picardy and Poitou, from Amiens and Saint-Quentin to Poitiers, went to England itself. The Agenais went to the English duke of Aquitaine, and the country of Langres to the duke of Burgundy, who was England's vassal. The whole of Languedoc, forty-two towns from Toulouse to Carcassonne, Montpellier, Nîmes and Foix, became a new dominion of the English crown, ruled from Narbonne. The ʿulamāʾ of [Ishbīliya](place:ishbiliyya) knew both names. Narbonne was Arbūna, which the armies of the first governors of al-Andalus had taken and held for forty years. Poitiers was the field the Arabs called the Pavement of the Martyrs, where the advance of Islam into the land of the Franks had stopped seven hundred years before. Now both belonged to the king of England.\n\nThree days later the French crown went with them. On 22 Ṣafar 832 Edward of England, twenty-eight years old and five years a king, was made king of France as well. England, France and the Dauphiné had one ruler. [Philippe](person:philippe-vii-of-france), the French king who had lost the war, was allowed to keep a seat in his conqueror's French council, and the court of Ishbīliya thought that the most humiliating part of the peace.\n\nThe dīwān heard the news in silence. The Emperor [Ismāʿīl](person:ismail-ibn-saad) had spent six months sending spies into the north to prepare the last war of the Istirdād, and he had counted on Qashtāla being alone. Qashtāla was four towns on the Cantabrian coast with no army, but it had one ally, and that ally was [Edward](person:edward-v-of-england). England was now the second power of the world and stronger with every treaty. It was the only great power that named al-Andalus among its enemies, and its lands now ran along the Pyrenees beside the Ṭāʾifa of Catalonia, within a few days' march of [Barshalūna](place:barshaluna). The great road to [Balansiyya](place:balansiyya) had been built to carry an army to the French border should the Pope ever preach another crusade. The border at its end was now English.\n\nThe secretaries of the Dīwān al-Inshāʾ pointed out that England and France would need years to digest each other, that the French nobles had not accepted an English king out of love, and that every English soldier in Languedoc was a soldier who would be needed there. The Emperor listened. Then he ordered his envoys to London and Paris, which now meant the same thing, with letters of congratulation. He also asked the treasurers how many more armouries the empire could afford.\n\n*The Romans have been defeated, in the nearest land. But they, after their defeat, will overcome, within three to nine years.*"}, {"addr": "832-09-25", "slug": "0832-09-25-of-the-death-of-the-emperor-ismail-and-the-two-princes", "n": 91, "bn": 26, "hy": 832, "hm": 9, "hd": 25, "w": 1429, "title": "Of the Death of the Emperor Ismāʿīl, and the Two Princes", "date": "1429-06-28", "dateStr": "28 June 1429", "hdateStr": "25 Ramaḍān 832", "book": "book-of-the-marches", "people": ["ismail-ibn-saad", "muhammad-ibn-ismail-ibn-saad", "ismail-ibn-muhammad-ibn-ismail", "ahmad-ibn-muhammad-ibn-ismail", "edward-v-of-england", "berenguer-ramon-de-montsoriu", "saad-ibn-yusuf", "isabel-de-montsoriu", "umm-al-fath-bint-muhammad", "jadila-bint-saad-ibn-faraj", "yusuf-ibn-saad"], "places": ["ishbiliyya", "barshaluna", "qurtuba", "balansiyya", "al-ushbuna"], "sources": ["1428-12-01-forts-of-jaca-and-talarn", "1428-12-01-catalonia-to-the-crown", "1429-06-11-the-angevin-empire", "1429-06-28-death-of-the-emperor-ismail", "1429-06-28-accession-of-muhammad-v", "1429-06-28-the-two-princes", "1405-03-02-death-of-the-emperor"], "words": 968, "catch": "The last winter of the Emperor Ismāʿīl was spent looking north.", "canon": 3, "body": "The last winter of the Emperor [Ismāʿīl](person:ismail-ibn-saad) was spent looking north. The English were on the far side of the Pyrenees now, and he ordered two fortresses built in the mountains: at Jaca, in the Ṭāʾifa of Arghūn, and at Talarn in the Pallars, in the Ṭāʾifa of Catalonia. He also told the dīwān that Catalonia itself must come into the crown, as Balansiyya had, and that he expected the work done within nine years. Its lord was his own cousin [Berenguer Ramon](person:berenguer-ramon-de-montsoriu), the son of Yūsuf I's daughter Fāṭima, and a good soldier. The Emperor did not think that made [Barshalūna](place:barshaluna) any less important. A great port on a border with the English was not a thing to leave to a ṭāʾifa, however loyal.\n\nIn Ramaḍān 832 word came from the north that King [Edward](person:edward-v-of-england) had been crowned in Paris and had joined his crowns into one, which the Franks called the Angevin Empire. Its borders were those of the peace of the year before. Its name was new, and so were its ambitions. The envoys reported that the English king spoke of the whole inheritance of his ancestors, which had once run from the Scottish border to the Pyrenees. The Emperor had the report read to him twice.\n\nHe did not live to answer it. On 25 Ramaḍān 832, in the last ten nights of the month, with the army gathered in its camp outside [Ishbīliya](place:ishbiliyya), the Emperor Ismāʿīl died. He was sixty-three. His father [Saʿd](person:saad-ibn-yusuf) had died on the march on the eve of Ramaḍān, twenty-four years before, and the people of the capital said that the father had died at the beginning of the month of mercy and the son at its end, and that the whole of the son's reign had been held between them.\n\nConsider what he left. He had come to the throne in the middle of the risings of 807, with a hundred towns of the crown still loyal out of a hundred and forty-eight, and he ended them in six months. He took al-Gharb with letters and Balansiyya with patience. In the War of Jillīqiya he led the army himself, though no one had ever called him a soldier, and at the Peace of Rajab he ended the kingdom of Portugal and drove Qashtāla into the mountains it had come out of, where it fell apart into four petty kingdoms and then three. He left a hundred and ninety-five towns under the crown and as many again under seven ṭāʾifas, two and a half million subjects of his own, and an empire that the courts of the world ranked third among all the powers, behind only al-Ṣīn and the new empire of the English. He built a madrasa in every town, universities in five cities and a granary in nearly every village. He took the mercenaries from the umarāʾ, then their lordships, then their equality, and he never once let them rise. He married his grandsons into the houses of Fās, Cairo and Constantinople, and sent his envoys to Niani by the sea road he had sent Khayr al-Dīn to find when he was a young man.\n\nThe court had always said that he told every man in private what that man wished to hear. The court also said, and this was rarer, that he judged every man in public by the law, and that no one who came before him could say he had been judged by favour. When the chancellor announced his death to the realm, it was that he chose to mention: the Emperor's fair and impartial rulings, which the realm would miss. Those who had been lied to by him found, on reflection, that they had been lied to for the good of the state, and those who had been judged by him found that they had been judged fairly, and most of the umarāʾ had been both.\n\nThe crown passed by the law of the house, which he had never changed, to his eldest son [Muḥammad](person:muhammad-ibn-ismail-ibn-saad), forty-three, who took the throne as Muḥammad V with [Isabel](person:isabel-de-montsoriu) of the Montsoriu beside him. The court had judged him unfit to rule when he was twelve, and in thirty years nothing had changed its mind except a day at the mouth of the Duero, when he had commanded the fleet and won. He was slow in council, and the treasury clerks said he squeezed his estates for every dirham. When the chancellor came to proclaim the new Emperor in the mosques, the old men of the court were heard to say that the realm had been cursed, and to ask God's mercy on them all.\n\nBut the old Emperor had seen this coming for thirty years, and he had left the realm something better than a law. The new Emperor's sons, [Ismāʿīl](person:ismail-ibn-muhammad-ibn-ismail), now the heir, and [Aḥmad](person:ahmad-ibn-muhammad-ibn-ismail), took seats in the dīwān at their father's accession, beside their sister [Umm al-Fatḥ](person:umm-al-fath-bint-muhammad), her mother [Jadīla](person:jadila-bint-saad-ibn-faraj) and their great-uncle Prince [Yūsuf](person:yusuf-ibn-saad). In every earlier generation of the house of Naṣr the princes had been rivals. These two were not. They were twenty-six and twenty-six, sons of different mothers born eight months apart, and they had grown up being told that one of them would have to rule for the father who could not. They had decided between themselves to do it together. From the first week of the new reign the dīwān learned that a request refused by one prince was refused by both, and that an order the Emperor gave in a temper would be reconsidered by both before it was carried out. The realm would be kept together, whatever its Emperor did.\n\n*And no soul perceives what it will earn tomorrow, and no soul perceives in what land it will die. Indeed, Allāh is Knowing and Acquainted.*"}, {"addr": "833-10-23", "slug": "0833-10-23-of-the-war-of-shant-yaqub-and-the-shrine-of-the-apostle", "n": 92, "bn": 27, "hy": 833, "hm": 10, "hd": 23, "w": 1430, "title": "Of the War of Shant Yāqub, and the Shrine of the Apostle", "date": "1430-07-15", "dateStr": "15 July 1430", "hdateStr": "23 Shawwāl 833", "book": "book-of-the-marches", "people": ["muhammad-ibn-ismail-ibn-saad", "ismail-ibn-muhammad-ibn-ismail", "ahmad-ibn-muhammad-ibn-ismail", "abu-al-hasan-ali-ibn-ahmad", "ahmad-ibn-ismail-ibn-saad", "diego-villamarin", "magdalena-de-borja", "isabel-de-montsoriu", "jadila-bint-saad-ibn-faraj"], "places": ["shant-yaqub", "ishbiliyya", "qurtuba"], "sources": ["1430-05-18-the-princes-counsel", "1430-05-18-war-on-galicia", "1430-05-18-take-the-capital", "1430-06-30-battle-santiago", "1430-06-30-the-emperor-worldly", "1430-06-30-ahmad-the-architect", "1430-06-30-the-emperors-household", "1430-07-15-santiago-falls", "1420-09-04-the-fall-of-qashtala", "1425-03-25-galicia-takes-asturias"], "words": 989, "catch": "The Emperor Muḥammad had been on the throne less than a", "canon": 3, "body": "The Emperor [Muḥammad](person:muhammad-ibn-ismail-ibn-saad) had been on the throne less than a year when he called for war, and he called for it the way he did everything, all at once. His father had died with the work of the Istirdād unfinished, and the son meant to finish it and be done. He ordered the army north against Qashtāla, which had begun every war of the house of Naṣr for a hundred years, and he wanted it gone by the end of the summer.\n\nHis sons talked him out of it. The princes [Ismāʿīl](person:ismail-ibn-muhammad-ibn-ismail) and [Aḥmad](person:ahmad-ibn-muhammad-ibn-ismail) did not argue with their father in the dīwān, where he did not like to be argued with. They argued with him in private, and they argued for a greater war, not a lesser one. Qashtāla was four towns and a king who sheltered behind the English, they said. The greatest of the kingdoms of the mountains was Jillīqiya, thirty-one towns from Shant Yāqub to the sea at Llanes, ruled by [Diego Villamarín](person:diego-villamarin), the best soldier left in the Christian north. Jillīqiya would be the nobler conquest and the harder one. After it would come Nabarra on the Basque coast, whose people the princes reckoned far more formidable than any Castilian. Qashtāla could wait for last. The Emperor liked the sound of a nobler conquest, and for now he was persuaded.\n\nOn 24 Shaʿbān 833 (18 May 1430) war was declared on Jillīqiya. It was the fifth war of the Istirdād, and it was named for the city at its end, Shant Yāqub, which the Christians call Santiago de Compostela. All seven ṭāʾifas marched with the crown. The Emperor's orders to his generals ran to one line: take the capital. The princes added the rest. Jillīqiya had no army in the field and two ships; the empire had four thousand six hundred regulars and fifty sail. The princes meant to reach Shant Yāqub before Diego could raise one.\n\nHe very nearly raised one in time. On 8 Shawwāl 833 the Galicians met the vanguard before the walls of Shant Yāqub: seven thousand men, nearly all of them levied archers called in from the villages. Against them stood four thousand nine hundred under [Abū al-Ḥasan ʿAlī](person:abu-al-hasan-ali-ibn-ahmad), the son of the Emperor's brother [Aḥmad](person:ahmad-ibn-ismail-ibn-saad) of Liyūn. He was seventeen years old. He sent his light horse around the archers' flanks, rode the heavy horse into them, and broke them before noon. Three thousand eight hundred Galicians were killed or taken, for two hundred and twenty-seven of ours. The way to the city was open, and the court reckoned the war a quarter won in a single day.\n\nThe Emperor heard the news among his ships. The court said that his years with the fleet had made him another man from the slow boy of the dīwān. He knew fishermen and harbour-masters and the captains of every merchant house in Ishbīliya by name, and he understood how things were actually done in the world better than many cleverer men. His eyes, all the same, were on the sea, and the state was carried by those around him. His three wives, [Magdalena](person:magdalena-de-borja) of the Borja, [Isabel](person:isabel-de-montsoriu) of the Montsoriu and [Jadīla](person:jadila-bint-saad-ibn-faraj) of his own house, had been chosen by his father and grandfather for their minds as well as their blood. With the two princes they did most of the governing, and the old Emperors had meant them to. Prince Aḥmad had begun to draw buildings, as his forebears had, and to talk of the great works he would raise in the capital one day.\n\nShant Yāqub held out for fifteen days. Its garrison was broken by hunger and sickness, not by assault, and on 23 Shawwāl 833 (15 July 1430) it was allowed to march out under its own banners. Then the Emperor gave the order that will be remembered longer than the battle.\n\nThe cathedral of Shant Yāqub was the greatest church of the Christian West outside Rome. It had been raised over the tomb the Christians believed was that of the Apostle James, whom they called their patron and the Moor-slayer, and it stood at the end of the pilgrim road that ran across all of Christendom from the Rhine and the Alps. Every year tens of thousands walked that road to touch the stone. When al-Manṣūr took the city in 387 he carried its bells back to [Qurṭuba](place:qurtuba) on the backs of Christian captives, to be hung upside down as lamps in the Great Mosque. But he left the tomb alone. The chroniclers said he found a single old monk sitting beside it and told his men to leave the man in peace.\n\nThe Emperor Muḥammad did not leave the tomb alone. On his direct orders the cathedral was pulled down. The masons of the army were told to save one thing. The great carved porch of the west front, the Pórtico de la Gloria, with its two hundred figures of prophets, elders and the saved, was taken down stone by stone and carted south to [Ishbīliya](place:ishbiliyya). The rest became a field of rubble.\n\nNo one in the dīwān asked the Emperor why. Some of the ʿulamāʾ praised the deed from the pulpit, and others kept silent, and the silent ones were the more learned. The princes did not speak of it at all. The court had seen what happened to Christendom when a pope preached a crusade, and it knew that the Christians of the north, who had been told for two years that the Emperor's coming was a homecoming, now had a different story to tell. What the destruction of the Apostle's shrine would cost al-Andalus, and when, and to whom it would be paid, remains to be seen.\n\n*And were it not that Allāh checks the people, some by means of others, there would have been demolished monasteries, churches, synagogues, and mosques in which the name of Allāh is much mentioned.*"}, {"addr": "834-02-16a", "slug": "0834-02-16-of-the-war-of-the-mountains-and-the-peace-of-safar", "n": 93, "bn": 28, "hy": 834, "hm": 2, "hd": 16, "w": 1430, "title": "Of the War of the Mountains, and the Peace of Ṣafar", "date": "1430-11-03", "dateStr": "3 November 1430", "hdateStr": "16 Ṣafar 834", "book": "book-of-the-marches", "people": ["muhammad-ibn-ismail-ibn-saad", "ismail-ibn-muhammad-ibn-ismail", "ahmad-ibn-muhammad-ibn-ismail", "juan-cangas", "ahmad-ibn-ismail-ibn-saad", "diego-villamarin", "alfonso-gaston", "fernando-son-of-pedro", "juan-son-of-fernando", "edward-v-of-england", "abu-hammu-rahhu", "ahmad-ibn-yusuf-ibn-ismail", "diego-sotomaior"], "places": ["shant-yaqub", "banbaluna", "ishbiliyya"], "sources": ["1430-08-05-battle-oviedo", "1430-08-17-the-princes-opening", "1430-08-17-war-on-navarre", "1430-11-03-battle-bilbo", "1430-11-03-all-three-fall", "1430-11-03-peace-with-galicia", "1430-11-03-peace-with-navarre-and-castile", "1430-11-03-iberia-is-conquered", "1430-11-03-the-north-divided", "1430-11-03-taifa-of-galicia"], "words": 1050, "catch": "King Diego had lost his capital, but he had not yet", "canon": 3, "body": "King Diego had lost his capital, but he had not yet lost his kingdom. He gathered what men he still had in the east of it, three thousand two hundred, and in Dhū al-Qaʿda 833 he threw them at Oviedo, where the host of the Ṭāʾifa of Liyūn lay in the old capital of the Asturian kings. Liyūn's general was [Juan Cangas](person:juan-cangas), a Leonese of the faith, and he had five thousand six hundred men behind good walls. On 15 Dhū al-Qaʿda the Galicians came at him, and by evening there were none of them left. Not one man of Liyūn was lost. Jillīqiya had no army now, and its annexation was a question only of the day on which the Emperor would accept it.\n\nThe princes did not want to accept it yet. Their father had never given up his hatred of Qashtāla, and he would not rest while a Castilian king sat in Santander. But Qashtāla was under the protection of London, and the empire was not ready for a war with the English, who held France and Languedoc and the passes of the Pyrenees beside Catalonia. Then the princes saw an opening. King [Alfonso](person:alfonso-gaston) of Nabarra had allied himself with Qashtāla. Qashtāla had the protection of London, but Nabarra had none. If the empire made war on Nabarra, Qashtāla would be bound to come in on Nabarra's side, and London would have to decide whether it was bound to follow. The armies of al-Andalus were already in the north, and the war with Jillīqiya was not yet closed. If they moved before King [Edward](person:edward-v-of-england)'s council had made up its mind, they could overwhelm both kingdoms and present London with a peace already made.\n\nOn 27 Dhū al-Qaʿda 833 (17 August 1430), with the Galician war still open, the Emperor declared war on Nabarra. It was the sixth war of the Istirdād. [Fernando](person:fernando-son-of-pedro) of Qashtāla answered his ally's call as the princes had expected, and the English did not answer his. Neither Basque nor Castilian had a man under arms on the day of the declaration. The war is called the War of the Mountains, after the country it was fought in, the wet green hills of Cantabria and the Basque coast where the Christians said their kingdoms had first been born.\n\nIt took eleven weeks. The armies of the empire swept through Qashtāla's four towns without a battle worth the name, and came down the valley of the Nervión to the gates of Bilbao. There, on 16 Ṣafar 834 (3 November 1430), Nabarra made its stand with three thousand five hundred Basques, most of them archers from the villages, against four thousand six hundred and seventy of ours. The Basques were brave, as the princes had said they would be, and it did them no good. They broke under the charge of the horse, and two thousand seven hundred and fifty of them were killed or taken, for a hundred and ninety-one of ours.\n\nThat same day all three kingdoms fell. Jillīqiya, beaten past any hope, was annexed whole: its thirty-one towns, from Shant Yāqub and A Coruña to Oviedo and Llanes, passed to the crown. Nabarra and Qashtāla were annexed with it: the ten Basque towns from Bilbao and San Sebastián to Vitoria, and the last four of Qashtāla on the Cantabrian shore, Santander, Laredo, Potes and San Vicente. The court called it the Peace of Ṣafar. For a day the crown ruled two hundred and forty-one towns and three million three hundred and seventy thousand souls, from the Algarve to San Sebastián.\n\nThe kings went their separate ways. King Diego, the soldier, left the peninsula altogether and turned up at Augsburg in the German lands, among its merchants and shipwrights, a careful and quiet man of thirty-nine who now built ships instead of armies. King Alfonso of Nabarra stayed at the court of the Ṭāʾifa of [Banbalūna](place:banbaluna), where he was said to drink more than was good for him. King Fernando, the last king of Qashtāla, son of the Pedro who had lost the War of the League and the War of Jillīqiya, went with his son [Juan](person:juan-son-of-fernando) to the court of the Ṭāʾifa of Burghush. Juan was eighteen and wore the garter of the English king's order of knighthood. In Burghush, the old capital of his ancestors, he was a guest of a Muslim lord.\n\nThe new lands were not kept by the crown. The rule of the house since the Peace of Rajab had been that the far north, where the Christians were many and the Muslims few, would be held through ṭāʾifas, and the princes saw it done the same day. The eight towns of old Ashturiyās, Oviedo and Cangas among them, went to the Emperor's brother [Aḥmad](person:ahmad-ibn-ismail-ibn-saad) of Liyūn, whose son had won the battle before Shant Yāqub and whose general had won the battle at Oviedo. Santander and the Cantabrian coast went to [Abū Ḥammū](person:abu-hammu-rahhu) of Burghush, and the Basque coast to [Aḥmad ibn Yūsuf](person:ahmad-ibn-yusuf-ibn-ismail) of Banbalūna, so that the old Navarre and the new were joined under one lord of the house of Naṣr. The other twenty-three towns of Jillīqiya, from Shant Yāqub, A Coruña and Lugo to Ourense and Tui, were made a ṭāʾifa of their own and given to [Diego Sotomaior](person:diego-sotomaior), a Galician noble of the faith, thirty-one years old. He ruled half a million Galicians from the city whose shrine the Emperor had pulled down, and the court did not envy him.\n\nThat left the crown a hundred and ninety-six towns and two and a half million subjects of its own, and eight ṭāʾifas with two hundred and thirty-six towns and nearly four million more. Every town of the peninsula from Finisterre to the Pyrenees, and from the Cantabrian Sea to the Strait, now belonged to the Emperor or to a lord who owed his throne to him. The courts of the world ranked al-Andalus third among the powers, after al-Ṣīn and the Angevins.\n\n*It is He who expelled the ones who disbelieved among the People of the Scripture from their homes at the first gathering. You did not think that they would leave, and they thought that their fortresses would protect them from Allāh; but Allāh came upon them from where they had not expected.*"}, {"addr": "834-02-16b", "slug": "0834-02-16-the-close-of-the-book-of-the-marches", "n": 94, "bn": 29, "hy": 834, "hm": 2, "hd": 16, "w": 1430, "title": "The Close of the Book of the Marches", "date": "1430-11-03", "dateStr": "3 November 1430", "hdateStr": "16 Ṣafar 834", "book": "book-of-the-marches", "people": ["saad-ibn-yusuf", "ismail-ibn-saad", "muhammad-ibn-ismail-ibn-saad", "ahmad-ibn-ismail-ibn-saad", "ismail-ibn-muhammad-ibn-ismail", "ahmad-ibn-muhammad-ibn-ismail"], "places": ["gharnata", "ishbiliyya", "shant-yaqub", "qurtuba"], "sources": ["1430-11-03-iberia-is-conquered", "1430-11-03-the-north-divided", "1430-11-03-taifa-of-galicia", "1430-07-15-santiago-falls"], "words": 511, "catch": "It opened sixty-two years ago by the reckoning of the Hijra,", "canon": 3, "body": "Here ends the Book of the Marches.\n\nIt opened sixty-two years ago by the reckoning of the Hijra, on 21 Ṣafar 772, on the day the Marīnids gave up the north shore and the throne of [Gharnāṭa](place:gharnata) was secure at last. The Emir [Saʿd](person:saad-ibn-yusuf) then ruled sixty towns and three quarters of a million people from the Alhambra. The old thughūr of al-Andalus, the Lower March of Badajoz, the Middle March of Toledo and the Upper March of Zaragoza, had been Christian country for two and three centuries, and Qashtāla was the greatest kingdom of the peninsula. The ʿulamāʾ of that day prayed for the restoration of al-Andalus as men pray for rain in a drought, without much expecting it.\n\nSix wars brought it. The War of the Upper March broke Aragon and brought Barshalūna and Catalonia under the crown, and on 16 March 1375 Saʿd proclaimed the restoration of al-Andalus and took the title of Emperor. The War of the Aragonese Restoration, the War of the League and the War of Jillīqiya broke Qashtāla piece by piece, ended Portugal, and drove the Castilians back into the mountains of the north. The War of Shant Yāqub and the War of the Mountains finished them. Three Emperors fought those wars. Saʿd won the marches, his son [Ismāʿīl](person:ismail-ibn-saad) the heartland of Old Castile, and his grandson [Muḥammad](person:muhammad-ibn-ismail-ibn-saad) the mountains.\n\nThe Christians had always said that their reconquest began in those mountains, when a Gothic lord named Pelayo held a cave at Covadonga against the first governors of al-Andalus, above the town the Asturians call Cangas. On 16 Ṣafar 834 Cangas was given with the rest of Ashturiyās to the Emperor's brother [Aḥmad](person:ahmad-ibn-ismail-ibn-saad) of Liyūn, a prince of the house of Naṣr. In 814 the ʿulamāʾ had said that one more war would push Qashtāla into the sea. Its last king rode out of Santander to live as a guest in Burghush, and the sea he left behind him was the empire's.\n\nThe empire that closes the book has four hundred and thirty-two towns, the crown's and the ṭāʾifas' together, and six and a half million people, from the Bay of Biscay to the Green Cape. There are no marches left in Iberia, only borders: with the English along the Pyrenees, and the open sea everywhere else.\n\nThe court has not forgotten Shant Yāqub. In [Ishbīliya](place:ishbiliyya) the Pórtico de la Gloria waits in a storeroom for the Emperor to decide where to set it up, and every merchant ship from the north brings word of what the Christians are saying about the Apostle's tomb. In 387 al-Manṣūr carried the bells of Shant Yāqub to [Qurṭuba](place:qurtuba) and left the tomb untouched. The Christians took Qurṭuba back two and a half centuries later, and they carried the bells back to Shant Yāqub on Muslim shoulders. The princes [Ismāʿīl](person:ismail-ibn-muhammad-ibn-ismail) and [Aḥmad](person:ahmad-ibn-muhammad-ibn-ismail) know that story, as every child of the house does. Their father looks at the sea.\n\n*And We have already written in the Book, after the Reminder, that the land is inherited by My righteous servants.*"}, {"addr": "835-08-29a", "slug": "0835-08-29-of-the-trading-posts-of-the-gold-coast-and-the-spice-road", "n": 95, "bn": 10, "hy": 835, "hm": 8, "hd": 29, "w": 1432, "title": "Of the Trading Posts of the Gold Coast, and the Spice Road", "date": "1432-05-01", "dateStr": "1 May 1432", "hdateStr": "29 Shaʿbān 835", "book": "book-of-the-encircling-sea", "people": ["muhammad-ibn-ismail-ibn-saad", "tiramakhan-mali", "ismail-ibn-saad"], "places": ["ishbiliyya"], "sources": ["1432-05-01-trading-posts", "1428-06-03-embassy-to-niani", "1432-05-the-dar-al-sinaa"], "words": 389, "catch": "A crusade was being fought in the waters of Sardinia, and", "canon": 4, "body": "A crusade was being fought in the waters of Sardinia, and the Emperor [Muḥammad](person:muhammad-ibn-ismail-ibn-saad) was thinking about the rivers of Guinea. His father [Ismāʿīl](person:ismail-ibn-saad) had sent envoys to Niani and won the Mansa's word that Andalusī merchants would pay no tariff anywhere in Mālī. The son meant to use it. In the spring of 835 the crown began eight trading posts on the coast of Kaabu, the Mansa's vassal on the Gambia and the rivers south of it: at the mouth of the Gambia, at Bintang, on the Casamance and at Diaboudior, at Cacheu and Bissau, and at Bafatá and Tankular. They were stores and wharves more than towns, where the ships that watered at the islands of the Green Cape could load the gold that came down the rivers from the mines of the interior without sending a single caravan across the Ṣaḥrāʾ.\n\nThe caravans were not forgotten either. The empire already kept trade offices at Niani and at Timbuktu, at the ports of Ifrīqiya and Sicily, and in the cities of the Marīnids. Now the offices at Marrakesh and at Sijilmasa, where the gold of the desert road came out of the sands, were ordered enlarged again and again, and a new office was opened at Cairo, beside the Emperor's embassy there, with a plan for its growth that ran to more than twenty stages. Cairo was where the pepper, cloves and cinnamon of the Indies came up the Red Sea from the ports of Yemen, and the Emperor wanted the spices of the East to reach Ishbīliya through the hands of his own merchants and those of his Mamlūk allies, with no Venetian or Genoese in between.\n\nThe treasurers asked whether this was the time. The fleet had seven arsenals to pay for, and the crusade was not over. The Emperor said that the war would end and the trade would not, and that the Genoese were at war with him for the same reason he was building in Cairo. The empire still kept a trade office in Genoa itself, and he gave no order to close it.\n\n*For the accustomed security of the Quraysh, their accustomed security in the caravan of winter and of summer, let them worship the Lord of this House, who has fed them against hunger and made them safe from fear.*"}, {"addr": "835-08-29b", "slug": "0835-08-29-of-the-warmongers-name-the-crusade-of-835-and-the-arsenals", "n": 96, "bn": 1, "hy": 835, "hm": 8, "hd": 29, "w": 1432, "title": "Of the Warmonger's Name, the Crusade of 835, and the Arsenals", "date": "1432-05-01", "dateStr": "1 May 1432", "hdateStr": "29 Shaʿbān 835", "book": "book-of-the-franks", "people": ["muhammad-ibn-ismail-ibn-saad", "pope-fabrizio-ricci", "vukmir-jankovic", "khayr-al-din-khayyam", "abd-al-wahhab-barakat", "rodrigo-de-borja", "magdalena-de-borja", "ismail-ibn-muhammad-ibn-ismail", "diego-sotomaior", "saad-ibn-yusuf"], "places": ["ishbiliyya", "shant-yaqub", "malaqa", "al-mariyya", "al-ushbuna", "balansiyya", "mursiyya"], "sources": ["1431-06-24-the-warmongers-name", "1431-10-01-the-second-crusade", "1431-10-03-genoa-joins-the-crusade", "1431-11-20-battle-oristano", "1431-11-26-battle-gulf-talamone", "1431-12-05-battle-gulf-talamone", "1431-12-20-battle-coast-lazio", "1431-12-31-battle-tivoli", "1432-01-27-battle-gulf-olbia", "1432-02-01-battle-gulf-orosei", "1432-03-14-battle-corsica-channel", "1432-03-26-battle-pitigliano", "1432-05-the-dar-al-sinaa", "1432-05-01-the-green-cape", "1430-07-15-santiago-falls", "1404-02-01-the-crusade"], "words": 1117, "catch": "For seven hundred years, since the first governors of al-Andalus failed", "canon": 4, "body": "Here begins the Book of the Franks.\n\nFor seven hundred years, since the first governors of al-Andalus failed to take a cave in the Asturian hills, there had always been some corner of the peninsula where a Christian king still ruled. After the Peace of Ṣafar there was none. Every town from Finisterre to the Pyrenees belonged to the Emperor or to a lord who owed his throne to him. The courts of Christendom had watched al-Andalus come north for sixty years, one war at a time. Now they had to decide what to do about it, and the answer began with the rubble of Shant Yāqub.\n\nThe first sign came from inside the palace. In Shawwāl 834 a pamphlet began to pass from hand to hand at court in [Ishbīliya](place:ishbiliyya). It said that the Emperor [Muḥammad](person:muhammad-ibn-ismail-ibn-saad) was a ruthless warmonger, a man who had destroyed the shrine of an Apostle out of spite and who would drag the realm into war with all of Christendom. No one knew who had written it. The dīwān expected the Emperor to find someone to hang for it, and offered him several names. He refused them all. He had the pamphlet read to him, and he told the dīwān that it was true and that he did not mind who knew it. A man who sold his estates' grain for every dirham it would fetch had never cared to be loved, and a warmonger, he said, was what the Christians called a Muslim who won. The courts of Europe heard of his answer within the month, and they did not take it as a joke.\n\nOn 23 Muḥarram 835 (1 October 1431) the Pope at Rome, [Fabrizio Ricci](person:pope-fabrizio-ricci), proclaimed a crusade against al-Andalus, the second to be preached against the empire by name. The first, in 806, had ended with the Emperor [Saʿd](person:saad-ibn-yusuf) in the Pope's own city of Avignon. This Pope was sixty, a careful and hard-working man, and his crusade fell where the first one had. He declared war on the Ṭāʾifa of Arghūn and its king [Rodrigo de Borja](person:rodrigo-de-borja), who was the brother of the Empress [Magdalena](person:magdalena-de-borja) and the uncle of the heir [Ismāʿīl](person:ismail-ibn-muhammad-ibn-ismail), and he named Barbastro as the crusade's prize. The Pope himself held three towns and had thirteen ships and no army. The Church's call brought him Provence, the archbishops of Cologne and Trier, a dozen lords of the German and French lands, and from the far edge of the world Ireland and Iceland. The English king, who now ruled France, did not come. The court said that he had heard what had happened at Avignon.\n\nEvery ally of al-Andalus answered on the same day. All eight ṭāʾifas came in, the new Ṭāʾifa of Jillīqiya among them, so that [Diego Sotomaior](person:diego-sotomaior) of Shant Yāqub marched against a crusade preached in revenge for his own city. With them came the Mamlūks of Miṣr and all their vassals from Makka to Suakin, the Marīnids of Fās, and the Ḥafṣids of Tūnis.\n\nTwo days later the crusade found its real strength. Genoa joined it, with Siena and Aquileia. Genoa had eleven towns, Corsica and Arborea in Sardinia, a trading colony on the Black Sea, and twenty-four war galleys. Its merchants had been the rivals of the merchants of Ishbīliya on the western sea for as long as the empire had had a fleet. Its doge Raimondo was a clever diplomat who would not trouble the Pope for long if the trade turned against him, but while the war lasted the western sea was no longer the empire's own.\n\nThe war that winter was fought far from al-Andalus, and the Emperor's own army never left its camps. The fleets of the Maghrib carried it to Italy. The Ḥafṣids landed men in Sardinia and on the coast of Lazio, within a few days' march of Rome, and won and lost by turns. The Pope had found himself an admiral, a Slav named [Vukmir Janković](person:vukmir-jankovic), and in Rabīʿ al-Awwal and Rabīʿ al-Thānī he showed what one good seaman could do. With six ships he destroyed a squadron of fourteen from Tripoli in the Gulf of Talamone. Then, with fifteen Genoese galleys beside his own, he fell on the fleet of Tūnis off Lazio and sank or took fifteen of its twenty-four ships for the loss of one. That was the high-water mark of the crusade at sea. In Jumādā al-Ūlā the Marīnids came up, and with the ships of Tūnis and Barqa they put a hundred and eighty-five sail into the waters off Sardinia. Nine papal ships that attacked them in the Gulf of Olbia were lost to the last one, and seventeen of Aquileia's twenty-eight in the Gulf of Orosei. In Rajab Vukmir attacked again in the Corsica Channel with the five ships he had left, and lost them all. On land the crusaders had the stranger captain. Their army in Tuscany was led by [Khayr al-Dīn Khayyām](person:khayr-al-din-khayyam), an Andalusī and a Muslim, who sold his company of jinetes to whoever paid. He beat the Tunisians at Tivoli, and in Rajab at Pitigliano the Moroccans broke his army of seventeen thousand with four and a half thousand. The court of Ishbīliya was not sure whether to be ashamed of him or proud.\n\nThe Emperor had waited his whole life for a war at sea. The fleets of Fās and Tūnis had won the winter, and he did not mean to owe the next war to them. In Shaʿbān 835 he ordered arsenals built in seven ports of the empire, of the kind the caliphs of Qurṭuba had called the dār al-ṣināʿa, the house of making: at [Ishbīliya](place:ishbiliyya), [Mālaqa](place:malaqa), [al-Mariyya](place:al-mariyya), [al-Ushbūna](place:al-ushbuna), [Balansiyya](place:balansiyya), Cartagena and [Mursiyya](place:mursiyya). The Christians had taken the word along with the thing and called it the arsenal. Each one would take two years to finish, and the treasurers reminded him what seven of them would cost. He signed the orders anyway, and had seven war galleys laid down on the slipways beside them before a single arsenal wall was up. In the same month the four towns of the islands of the Green Cape were made a land of their own, as the dīwān had promised the first settlers, under an Andalusī governor, [ʿAbd al-Wahhāb Barakat](person:abd-al-wahhab-barakat), at Santiago. The Emperor's eyes were on the sea in every direction. The admirals of Ishbīliya said that it was the first time since his accession that they had seen him look happy.\n\n*And of His signs are the ships in the sea, like mountains. If He willed, He could still the wind, and they would remain motionless on its surface. Indeed in that are signs for everyone patient and grateful.*"}, {"addr": "835-11-28", "slug": "0835-11-28-of-the-peace-of-the-pope-and-the-decree-on-the-taifas", "n": 97, "bn": 2, "hy": 835, "hm": 11, "hd": 28, "w": 1432, "title": "Of the Peace of the Pope, and the Decree on the Ṭāʾifas", "date": "1432-07-27", "dateStr": "27 July 1432", "hdateStr": "28 Dhū al-Qaʿda 835", "book": "book-of-the-franks", "people": ["muhammad-ibn-ismail-ibn-saad", "pope-fabrizio-ricci", "berenguer-ramon-de-montsoriu", "rodrigo-de-borja", "magdalena-de-borja", "maryam-bint-saad-ibn-faraj", "jadila-bint-saad-ibn-faraj", "saad-ibn-ismail-ibn-saad"], "places": ["ishbiliyya"], "sources": ["1432-05-17-battle-terracina", "1432-06-01-battle-viterbo", "1432-06-27-battle-cape-mondego", "1432-07-27-peace-with-the-pope", "1432-07-the-decree-on-the-taifas"], "words": 613, "catch": "By the summer of 835 the crusade had run out of", "canon": 4, "body": "By the summer of 835 the crusade had run out of crusaders. The Ḥafṣid landings in Lazio ended at Terracina, where the Pope's army caught two hundred and seventy Tunisians and killed them all, and the Moroccans who had marched on Viterbo were beaten off by an army seven times their size. But the Pope's army could not stay in Lazio. Since Rajab the lords of Mantua and Milan had been at war with Faenza, his vassal, and the Pope, Genoa and every subject of Genoa were bound to defend it. The court of [Ishbīliya](place:ishbiliyya) watched the princes of Christendom fight a crusade against al-Andalus with one hand and each other with the other, and found it very satisfying.\n\nThe war at sea ended in the Ocean, where it had never been expected. On 27 Shawwāl a fleet of twenty-nine ships from Mecklenburg, on the Baltic, came down the coast of Burtuqāl and attacked a fleet off Cape Mondego. It was [Berenguer Ramon](person:berenguer-ramon-de-montsoriu) of Catalonia with thirty-two Catalan ships and eight of the Emperor's own. The Mecklenburgers lost eighteen ships and did not sink one. It was the first time in the war that the Emperor's ships had fought, and the Emperor had the report read to him more than once.\n\nIn Dhū al-Qaʿda the Pope's envoys came to Ishbīliya asking for peace. The Emperor's terms were short. The Pope would pay a hundred and fifteen dīnārs at once and a tenth of his income for five years, some thirty-six dīnārs a month, in reparation for the war he had begun, and he would annul every treaty he had with Genoa, Siena and Aquileia, so that the next pope who preached a crusade would have to find his allies again from the beginning. No town changed hands. [Fabrizio Ricci](person:pope-fabrizio-ricci) accepted on 28 Dhū al-Qaʿda 835 (27 July 1432), and the Crusade of 835 was over ten months after it began. The court called it the Peace of Dhū al-Qaʿda. It said that the Christians could not even keep their own quarrels in check long enough to fight the Muslims.\n\nThe peace changed the Emperor. His father and grandfather had left the ṭāʾifas to rule their own courts in their own way, Christian subjects and all, and had been content with tribute, loyalty and soldiers. Muḥammad was no longer content. A crusade had been preached against his realm and fought in the name of its Christians, and he did not mean to leave enemies in his rear for the next one. He decreed that the ṭāʾifas of Arghūn, Qūnka, Banbalūna, Burghush and Liyūn, each as soon as it was bound closely enough to the crown, were to impose the ways of al-Andalus on the Christians who remained in their lands.\n\nOnly two were bound closely enough yet, and both were ruled by the Emperor's own family by marriage. Arghūn belonged to [Rodrigo de Borja](person:rodrigo-de-borja), the brother of the Empress [Magdalena](person:magdalena-de-borja), a gentle and talkative man whose kingdom had just been the target of the crusade. Qūnka belonged to the Shaykha [Maryam](person:maryam-bint-saad-ibn-faraj), sister of the Empress [Jadīla](person:jadila-bint-saad-ibn-faraj) and married to the Emperor's brother [Saʿd](person:saad-ibn-ismail-ibn-saad). Their courts were ordered to act, and they obeyed. They also complained, and in the ṭāʾifas of the north, which knew their turn would come, the complaints were louder. For three generations the house of Naṣr had told the Christians of Iberia that its coming was a homecoming. Some of the old men of the dīwān wondered what the Christians would call it now.\n\n*And had your Lord willed, those on earth would have believed, all of them entirely. Then will you compel the people in order that they become believers?*"}, {"addr": "838-11-04", "slug": "0838-11-04-of-the-emperors-pilgrimage-and-the-sufi-shaykh-al-islam", "n": 98, "bn": 15, "hy": 838, "hm": 11, "hd": 4, "w": 1435, "title": "Of the Emperor's Pilgrimage, and the Ṣūfī Shaykh al-Islām", "date": "1435-06-01", "dateStr": "1 June 1435", "hdateStr": "4 Dhū al-Qaʿda 838", "book": "book-of-the-call", "people": ["muhammad-ibn-ismail-ibn-saad", "abu-hammu-rahhu", "khalid-ibn-abi-hammu", "temur", "aktai-mamluk", "yusuf-ibn-saad", "ismail-ibn-muhammad-ibn-ismail", "ahmad-ibn-muhammad-ibn-ismail", "umm-al-fath-bint-muhammad", "yusuf-i"], "places": ["ishbiliyya"], "sources": ["1431-01-21-death-of-abu-hammu", "1432-10-16-death-of-aktai", "1433-03-19-the-emperor-leaves-the-admiralty", "1433-07-26-death-of-temur", "1433-11-23-the-emperors-hajj", "1434-09-27-the-shaykh-al-islam", "1435-06-01-death-of-prince-yusuf", "1432-07-17-birth-ahmad", "1433-03-12-birth-abu-al-hasan-ali", "1433-04-24-birth-muhammad"], "words": 612, "catch": "Two months after the Peace of Ṣafar gave him Santander and", "canon": 4, "body": "Two months after the Peace of Ṣafar gave him Santander and the Cantabrian shore, [Abū Ḥammū](person:abu-hammu-rahhu), lord of the Ṭāʾifa of Burghush, died suddenly in Jumādā al-Ūlā 834. The court said it was a fever of the chest, and no one in the dīwān asked further. His heir [Khālid](person:khalid-ibn-abi-hammu) was nine years old. The tutors of Burghush said he was the cleverest child they had ever taught, but a boy of nine could not rule a frontier ṭāʾifa with the last king of Qashtāla living at his court. So the Emperor [Muḥammad](person:muhammad-ibn-ismail-ibn-saad) took the regency of Burghush himself, to hold until the boy turned sixteen.\n\nIn the spring of 836 the Emperor laid down the command of the fleet, which he had held for twenty-two years. In the summer he went on the Hajj. He was the first ruler of the house of Naṣr to make the pilgrimage since the Sultan [Yūsuf I](person:yusuf-i), eighty years before, and he went by sea, as he did everything. The Mamlūk sultan [Aktai](person:aktai-mamluk), who had been the empire's ally for thirty-six years, had died in camp the autumn before, and it was his successor Jyral who received the Emperor of al-Andalus on the road to the Holy Places. On 8 Dhū al-Ḥijja 836, the day the pilgrims went out from Makka to Minā, [Temür](person:temur), master of half of Asia, died on the march in the far east of his empire at the age of ninety-seven. The news reached the pilgrims of al-Andalus on their way home. The Emperor returned to Ishbīliya in Rabīʿ al-Thānī 837 with the title of ḥājj, and the people of the capital came out to the river to meet his ship.\n\nHe came home a changed man in one respect. He had always been worldly, and he still was. But at ʿArafa he had stood among the Ṣūfīs of the East, and he came back wanting their kind of faith at the head of the faith of his own realm. When the dīwān told him in Ṣafar 838 that an empire so large needed a Shaykh al-Islām, a single authority over all the muftīs of the realm to write fatwās, appoint the muftīs of the provinces and judge whether the Emperor's own edicts were lawful, it offered him three kinds of candidate: the most loyal of the muftīs, the most learned, or a famous Ṣūfī. The ʿulamāʾ expected him to choose loyalty, as his father would have. He chose the Ṣūfī. He would be a Mālikī like every jurist of al-Andalus, but the court noticed that the Emperor's legitimacy in the eyes of the people rose a little every month he sat in the office, and that the ascetics and the brotherhoods of the realm, who had never cared much for the house of Naṣr, began to pray for it.\n\nThe house was growing again. Since the year of the Emperor's accession, nine grandchildren had been born to him. The heir [Ismāʿīl](person:ismail-ibn-muhammad-ibn-ismail) had a son, Aḥmad, and three daughters, Prince [Aḥmad](person:ahmad-ibn-muhammad-ibn-ismail) a daughter and two sons, one of them named Abū al-Ḥasan ʿAlī after the general of Shant Yāqub, and the Emperor's daughter [Umm al-Fatḥ](person:umm-al-fath-bint-muhammad) a daughter and a son. The house was also losing its oldest member. On 4 Dhū al-Qaʿda 838 Prince [Yūsuf](person:yusuf-ibn-saad), a son of the first Emperor, died of old age at sixty-three, thirty years after he had first taken his seat in the dīwān. He had settled the new lands of two Emperors and spread the tongue of al-Andalus through them.\n\n*Hajj is in the well-known months. And take provisions, but indeed, the best provision is the fear of Allāh. So fear Me, O you of understanding.*"}, {"addr": "839-10-14", "slug": "0839-10-14-of-the-arsenals-finished-and-the-turn-to-the-sea", "n": 99, "bn": 11, "hy": 839, "hm": 10, "hd": 14, "w": 1436, "title": "Of the Arsenals Finished, and the Turn to the Sea", "date": "1436-05-01", "dateStr": "1 May 1436", "hdateStr": "14 Shawwāl 839", "book": "book-of-the-encircling-sea", "people": ["muhammad-ibn-ismail-ibn-saad", "berenguer-ramon-de-montsoriu", "francesc-de-montsoriu", "vukmir-jankovic", "abd-al-jalil-al-qbasai", "raimundo-coimbra"], "places": ["ishbiliyya", "malaqa", "al-mariyya", "al-ushbuna", "balansiyya", "mursiyya"], "sources": ["1435-10-10-the-turn-to-the-sea", "1432-08-30-death-of-berenguer-ramon", "1435-04-09-death-of-vukmir", "1433-03-19-the-emperor-leaves-the-admiralty", "1436-05-01-the-two-explorers", "1432-05-the-dar-al-sinaa"], "words": 490, "catch": "The crusade ended, and the arsenals went on rising. Two years", "canon": 4, "body": "The crusade ended, and the arsenals went on rising. Two years after the Emperor [Muḥammad](person:muhammad-ibn-ismail-ibn-saad) had signed the orders, all seven were finished, at [Ishbīliya](place:ishbiliyya), [Mālaqa](place:malaqa), [al-Mariyya](place:al-mariyya), [al-Ushbūna](place:al-ushbuna), [Balansiyya](place:balansiyya), Cartagena and [Mursiyya](place:mursiyya). Their first work was already at sea: eight war galleys of a new Andalusī pattern, long, low and fast under oar, the first warships of the empire not copied from the Christians. They sailed beside the fifty caravels the fleet already had. A new guild of naval chandlers was licensed at Cáceres, far inland, to send pitch and cordage down the river roads to the ports, and the treasurers, who had complained of every arsenal, found that the realm took in ninety dīnārs a month more than it spent.\n\nThe Emperor had given up the admiral's command before his pilgrimage, but he had not given up the sea, and he did not let the realm give it up either. He gave the arsenals' masters seats at his audiences. He gave his prizes for poetry to poems about ships. He sent the sons of the umarāʾ to serve a season with the fleet before he would give them a command on land. In the three years after the crusade the court's talk, and the talk of the cities, turned further from the land to the sea than in all the reign of his father. The young men of Lisbon and the Algarve wanted to be pilots. The merchants of Ishbīliya wanted ships of their own. In Mālaqa the ʿulamāʾ were heard to preach that al-Andalus lay between two seas as the believer lies between fear and hope, and that it would live by both.\n\nThe sea took its price. [Berenguer Ramon](person:berenguer-ramon-de-montsoriu) of Catalonia, who had beaten the Mecklenburgers off Cape Mondego, was lost at sea two months later, in Muḥarram 836, and his son [Francesc](person:francesc-de-montsoriu) took his seat in Barshalūna. Less than three years later the sea took the crusaders' admiral [Vukmir Janković](person:vukmir-jankovic) too, and the captains of Ishbīliya drank to him in their own fashion, with sherbet.\n\nBy Shawwāl 839 the Emperor's ships were reaching further than they had ever gone. A new town of the crown had been planted at Ipalán on La Gomera in the Canaries, and an expedition was fitting out at Ishbīliya for the open Ocean. Two men of al-Ushbūna led the work. [ʿAbd al-Jalīl al-Qbasī](person:abd-al-jalil-al-qbasai) was an Andalusī of nineteen, a born soldier with the explorer's eye. Dom [Raimundo Coimbra](person:raimundo-coimbra) was a Portuguese Muslim of twenty-six, and in that month he was somewhere out on the high sea of the eastern Ocean, beyond sight of any land, toward the waters where the pilots of Flores had said that the sun set over nothing at all.\n\n*He released the two seas, meeting side by side; between them is a barrier which neither of them transgresses. So which of the favours of your Lord would you deny? From both of them emerge pearl and coral.*"}, {"addr": "840-08-22", "slug": "0840-08-22-of-barshaluna-returned-the-hegemony-of-letters-and-the-new-world", "n": 100, "bn": 16, "hy": 840, "hm": 8, "hd": 22, "w": 1437, "title": "Of Barshalūna Returned to the Crown, the Hegemony of Letters, and the New World", "date": "1437-03-01", "dateStr": "1 March 1437", "hdateStr": "22 Shaʿbān 840", "book": "book-of-the-call", "people": ["muhammad-ibn-ismail-ibn-saad", "francesc-de-montsoriu", "ismail-ibn-saad"], "places": ["barshaluna", "ishbiliyya", "qurtuba"], "sources": ["1436-06-01-catalonia-annexed", "1437-01-01-the-age-of-discovery", "1437-01-01-cultural-hegemon", "1437-03-01-the-new-world-institution", "1428-12-01-catalonia-to-the-crown"], "words": 509, "catch": "The Emperor Ismāʿīl had told the dīwān that Catalonia must come", "canon": 4, "body": "The Emperor [Ismāʿīl](person:ismail-ibn-saad) had told the dīwān that Catalonia must come into the crown within nine years, and he had not lived to see it. His son did it within eight. On 16 Dhū al-Qaʿda 839 (1 June 1436) the Ṭāʾifa of Catalonia was annexed, a year before the court had expected, and [Barshalūna](place:barshaluna), the great port on the English border, was ruled from [Ishbīliya](place:ishbiliyya) for the first time. Its lord [Francesc](person:francesc-de-montsoriu), son of the Berenguer Ramon who had died at sea, was a Muslim and a grandson of the house of Naṣr through his grandmother. He gave up his throne without a war. The Catalans had been accepted at court for thirteen years, and the merchants of Barshalūna had been trading under the Emperor's peace for sixty. Most of them found that very little changed except the address of the tax-collector.\n\nAt the turn of the year 840 the scholars of the court took stock, as they did at the end of every age. They agreed that the age of the rebirth of learning, which the Franks had called the Renaissance, was over, and that a new age had begun, the age of the discovery of the world. The ships of al-Andalus were already in it. They also agreed, more quietly, on something that would not have been believed in [Qurṭuba](place:qurtuba) a hundred years before. The learning, the poetry, the music, the buildings and the manners of al-Andalus were once more what the rest of the world imitated. The books copied in the madrasas of Ishbīliya were read in Cairo and Fās and, in translation, in Paris and Bologna. The courts of Christendom built their gardens with Andalusī water and hired Andalusī masons. In the chanceries of the world al-Andalus was named the first of all realms in culture.\n\nTwo months later the new age found its name in Ishbīliya itself. No one had yet found land beyond the Ocean. But the city was full of men who meant to: pilots home from the Azores and the Green Cape arguing over charts in the funduqs by the river, merchants buying shares in voyages that had not yet sailed, scholars of the madrasas asking what the ancients had meant by the Isles of the Blessed, and the crown paying for all of it. By Shaʿbān 840 the scholars of other realms had begun to call it a new way of thinking about the world, and to say that it had been born on the banks of the Wādī al-Kabīr. Perhaps the captains would find something out there.\n\nThe old men of the court said that it was the age of the caliphs come again. The Emperor [Muḥammad](person:muhammad-ibn-ismail-ibn-saad), who had never read a book for pleasure in his life, accepted the compliment on behalf of his grandfather, his father and the madrasas they had built in every town, and went back to his ships.\n\n*And thus We have made you a middle nation, that you will be witnesses over the people, and the Messenger will be a witness over you.*"}, {"addr": "841-07-19", "slug": "0841-07-19-of-the-admiral-prince-and-his-three-wives", "n": 101, "bn": 12, "hy": 841, "hm": 7, "hd": 19, "w": 1438, "title": "Of the Admiral Prince, and His Three Wives", "date": "1438-01-16", "dateStr": "16 January 1438", "hdateStr": "19 Rajab 841", "book": "book-of-the-encircling-sea", "people": ["yusuf-ibn-ismail-ibn-muhammad", "muhammad-ibn-ismail-ibn-saad", "ismail-ibn-muhammad-ibn-ismail", "amie-of-mali", "fatima-bint-yusuf-ibn-ismail", "mumina-bint-muslih-al-din", "tiramakhan-mali", "yusuf-ibn-ismail", "bernarda-of-murcia", "khalid-ibn-abi-hammu"], "places": ["gharnata", "ishbiliyya", "barshaluna", "banbaluna"], "sources": ["1438-01-16-the-admiral-prince", "1438-01-16-the-realm-turns-to-the-sea", "1437-06-11-khalid-comes-of-age", "1437-11-06-death-of-bernarda"], "words": 489, "catch": "The Emperor Muḥammad had been twenty-five, and judged unfit to rule", "canon": 4, "body": "The Emperor [Muḥammad](person:muhammad-ibn-ismail-ibn-saad) had been twenty-five, and judged unfit to rule by everyone who knew him, when he was given the fleet. He had never forgotten what it had done for him. The court had called him slow; the captains had called him admiral. He had learned the names of harbour-masters, the price of pitch and the turn of the winds off Cape Saint Vincent, and he had come back from the sea a man who could win a battle at the mouth of the Duero. In the winter of 841 he did for his grandson what had been done for him.\n\n[Yūsuf](person:yusuf-ibn-ismail-ibn-muhammad) was the eldest son of the heir [Ismāʿīl](person:ismail-ibn-muhammad-ibn-ismail), by Tella of the house of Fās, and second in line to the throne after his father. He was sixteen. He had been born at [Gharnāṭa](place:gharnata) and given the most expensive schooling the realm could buy, and his tutors had called him shrewd before he could ride. He was not slow, and he had not been judged unfit by anyone. The Emperor made him admiral of the fleet anyway, because, he said, a prince who had never been to sea did not know what his empire was made of.\n\nYūsuf had already married three wives, and the court read them as a map of the realm his grandfather meant him to rule. The first was [Amie](person:amie-of-mali), a daughter of Mansa [Tiramakhan](person:tiramakhan-mali) of Mālī, who had come north by the sea road to Ishbīliya with a dowry the treasurers spoke of for a month. The second was [Fāṭima](person:fatima-bint-yusuf-ibn-ismail), daughter of the late [Yūsuf ibn Ismāʿīl](person:yusuf-ibn-ismail), lord of [Banbalūna](place:banbaluna), so that the heir's heir was bound by marriage to the ṭāʾifas of the north at the moment the Emperor was demanding more of them. The third was [Muʾmina](person:mumina-bint-muslih-al-din), daughter of Muṣliḥ al-Dīn, a Naṣrid of the court, so that Ishbīliya would not feel left out. The gold country, the frontier and the palace now shared a household.\n\nThe realm the young admiral would sail for had changed again. [Barshalūna](place:barshaluna) and all of Catalonia had come into the crown, and the Emperor was building protected harbours at Barcelona, Girona, Tarragona, Tortosa and Perpignan. For the first time in the memory of the court, the temper of al-Andalus leaned more to the sea than to the land. In Burghush the boy [Khālid](person:khalid-ibn-abi-hammu) had come of age and taken back his ṭāʾifa from the Emperor's regency. And on 7 Jumādā al-Ūlā 841 the Emperor's mother [Bernarda](person:bernarda-of-murcia) died at seventy. She had been born an heiress of Mursiyya, Castilian in speech, and raised at the court of Qashtāla, she had been the wife of one Emperor and the mother of another, and she had lived to see Qashtāla vanish from the map.\n\n*It is He who has made you successors upon the earth and has raised some of you above others in degrees, that He may try you through what He has given you.*"}, {"addr": "841-10-12", "slug": "0841-10-12-of-the-charter-of-majrit-and-the-land-rights-of-the-umara", "n": 102, "bn": 13, "hy": 841, "hm": 10, "hd": 12, "w": 1438, "title": "Of the Charter of Majrīṭ, and the Land Rights of the Umarāʾ", "date": "1438-04-08", "dateStr": "8 April 1438", "hdateStr": "12 Shawwāl 841", "book": "book-of-the-encircling-sea", "people": ["muhammad-ibn-ismail-ibn-saad", "ismail-ibn-muhammad-ibn-ismail", "ahmad-ibn-muhammad-ibn-ismail", "ismail-ibn-saad"], "places": ["majrit", "tulaytula", "ishbiliyya"], "sources": ["1438-04-08-the-charter-of-majrit", "1438-04-08-land-rights-unravelled", "1428-05-25-primacy-revoked"], "words": 398, "catch": "Majrīṭ had been a frontier fort when the amīr Muḥammad I", "canon": 4, "body": "[Majrīṭ](place:majrit) had been a frontier fort when the amīr Muḥammad I built it on the Manzanares, to guard the road to [Ṭulayṭula](place:tulaytula) against the Christians of the north. Nearly six hundred years later it had become something else. The road it guarded now ran through the middle of the empire, and the town had grown along it faster than any other in the interior, a market of wool, grain and leather where the drovers of the meseta met the merchants of Ṭulayṭula. In the spring of 841 its burghers came to [Ishbīliya](place:ishbiliyya) to ask the Emperor for a city charter.\n\nThe Emperor [Muḥammad](person:muhammad-ibn-ismail-ibn-saad) did not want to give it. \"Why should I grant such a favour so far from the sea?\" he asked the dīwān. \"Won't the city merely wither and die?\" Every dirham the crown spent, in his view, should float.\n\nThe two princes saw a different chance. [Ismāʿīl](person:ismail-ibn-muhammad-ibn-ismail) and [Aḥmad](person:ahmad-ibn-muhammad-ibn-ismail) had taken up the work their grandfather [Ismāʿīl](person:ismail-ibn-saad) had begun and never finished: the breaking of the umarāʾ. The great houses had lost their mercenaries, their lordships and their equality with the crown. They had kept their land. In the integrated territories of the north they still held their estates by right, could open new mines and fields as they pleased, raise villas, and bind the peasants a little tighter to the soil every year. The northern umarāʾ wanted Majrīṭ's charter to fail as little as the burghers did, because their wool and grain went through its market, and the princes made them pay for it. In Shawwāl 841 the charter was granted, and the umarāʾ of the north agreed in return that their Land Rights in the integrated territories would be unravelled, slowly, one estate at a time.\n\nNobody at court pretended that this was a fair bargain. To soften it, the crown granted the great houses a yearly stipend for the patronage of the arts, so that every noble household might keep its poets, musicians and copyists. The clerks of the treasury, who paid it, called it by its real name, the fund that kept the umarāʾ from open mutiny. The Emperor signed both orders without much interest. The princes had spent the winter working out exactly what each one was worth.\n\n*Have We not established for them a safe sanctuary, to which are brought the fruits of all things as provision from Us?*"}, {"addr": "843-02-02", "slug": "0843-02-02-of-the-emperor-who-became-a-scholar", "n": 103, "bn": 17, "hy": 843, "hm": 2, "hd": 2, "w": 1439, "title": "Of the Emperor Who Became a Scholar", "date": "1439-07-15", "dateStr": "15 July 1439", "hdateStr": "2 Ṣafar 843", "book": "book-of-the-call", "people": ["muhammad-ibn-ismail-ibn-saad", "ismail-ibn-saad", "saad-ibn-yusuf", "ismail-ibn-muhammad-ibn-ismail", "ahmad-ibn-muhammad-ibn-ismail"], "places": ["ishbiliyya", "majrit"], "sources": ["1439-07-15-the-emperor-a-scholar", "1438-04-08-land-rights-unravelled", "1437-03-01-the-new-world-institution"], "words": 413, "catch": "The Emperor Muḥammad had been told all his life that he", "canon": 4, "body": "The Emperor [Muḥammad](person:muhammad-ibn-ismail-ibn-saad) had been told all his life that he was not the man his forebears were. His grandfather [Saʿd](person:saad-ibn-yusuf) had restored al-Andalus and his father [Ismāʿīl](person:ismail-ibn-saad) had built it a madrasa in every town, and the court had judged him unfit at twelve and said so again when he took the throne. He had never argued. He had gone to sea instead, and then to Makka, and in the years since the pilgrimage he had begun to do something no one at court had expected of him: he had begun to read.\n\nHe read the way he did everything, slowly and without shame. He had the pilots of the Ocean voyages brought to him to explain their charts, and kept them until he understood the charts himself. He sat in on the lectures of the madrasa of Ishbīliya, at the back, and asked the questions the students were too proud to ask. He had the astronomers explain the instruments by which a ship found its latitude, and the physicians explain the plagues that came in with the ships, and the engineers of the arsenals explain why one hull was faster than another. By Ṣafar 843, when he was fifty-three, the scholars of the court had stopped humouring him and begun to argue with him, and they agreed among themselves that he understood a new idea, once he had it, better and faster than most of them. Under him the realm took up new learning more readily than it ever had, and the madrasas taught more children to read.\n\nHe did not pretend to be his father. He said that his father had known things and he had to find them out, and that the finding out was the part he enjoyed. The court noticed that he had begun to say \"the old Emperors\" with less weight in his voice than before.\n\nIt was a hard year at home. The umarāʾ had not taken the loss of their land rights quietly, the stipend for their poets notwithstanding, and the peace of the realm had fallen further in a year than in any year since the risings of 807. The princes [Ismāʿīl](person:ismail-ibn-muhammad-ibn-ismail) and [Aḥmad](person:ahmad-ibn-muhammad-ibn-ismail) spent it appeasing the estates while the charter of [Majrīṭ](place:majrit) worked its way through the chancery. The Emperor left that to them and went back to his books.\n\n*Say: Are those who know equal to those who do not know? Only they will remember who are people of understanding.*"}, {"addr": "844-01-09", "slug": "0844-01-09-of-the-trade-war-with-genoa-and-the-angevins", "n": 104, "bn": 3, "hy": 844, "hm": 1, "hd": 9, "w": 1440, "title": "Of the Trade War with Genoa and the Angevins", "date": "1440-06-10", "dateStr": "10 June 1440", "hdateStr": "9 Muḥarram 844", "book": "book-of-the-franks", "people": ["muhammad-ibn-ismail-ibn-saad", "rodrigo-de-borja", "edward-v-of-england"], "places": ["ishbiliyya", "barshaluna"], "sources": ["1440-06-the-catalan-privileges", "1440-06-the-genoese-embargo", "1432-05-01-trading-posts", "1432-07-27-peace-with-the-pope"], "words": 409, "catch": "The crusade had been fought with ships and swords. The war", "canon": 4, "body": "The crusade had been fought with ships and swords. The war that followed it was fought with ledgers, and it had been coming for years. The merchants of Ishbīliya had outgrown the western sea. Their offices ran from Niani to Cairo, the Emperor's arsenals had given them a fleet, and the markets of Ishbīliya, [Barshalūna](place:barshaluna) and al-Ushbūna were each the first of their region. The merchants of Genoa, who had been the masters of that sea before them, had watched every one of those offices open.\n\nThe first quarrel was at home. In the last days of Dhū al-Ḥijja 843 the Andalusī merchants of the crown brought a complaint to the dīwān. In the Ṭāʾifa of Arghūn, under King [Rodrigo de Borja](person:rodrigo-de-borja), the Catalan merchant houses still kept the privileges they had held since before the Restoration: their own consuls, their own courts, their own rates at the customs. Now that Barshalūna itself belonged to the crown, the merchants asked why the Catalans of Arghūn should trade on better terms than the Emperor's own subjects. The dīwān heard them and did nothing. The king of Arghūn was the Empress's brother, and the Emperor had a larger quarrel on his hands.\n\nIn the same weeks Genoa closed Italy to the merchants of al-Andalus. The Genoese did not do it alone. The court of King [Edward](person:edward-v-of-england) in London, which ruled France as well, had leaned on them all spring, and the embargo they proclaimed reached every port and market where Genoa's word counted. The answer from Ishbīliya came within days, in the first week of Muḥarram 844. No merchant of the Angevin crowns, English, French or Gascon, would be received in any port of the Emperor. The admiral prince Yūsuf was given the order to enforce it at sea.\n\nThe old merchants of the capital said that a trade war hurt both sides and helped neither, and that the Venetians would be the only ones to profit. The young ones said that the Franks would need Andalusī sugar, gold and paper long before al-Andalus needed English wool. The Emperor, who had read a good deal about trade by then, agreed with the young ones. He also ordered the treasurers to tell him every month what it was costing.\n\n*Woe to those who give less than due, who, when they take a measure from people, take in full. But if they give by measure or by weight to them, they cause loss.*"}, {"addr": "844-05-04", "slug": "0844-05-04-of-the-radiant-city-restored", "n": 105, "bn": 18, "hy": 844, "hm": 5, "hd": 4, "w": 1440, "title": "Of the Radiant City Restored", "date": "1440-10-01", "dateStr": "1 October 1440", "hdateStr": "4 Jumādā al-Ūlā 844", "book": "book-of-the-call", "people": ["muhammad-ibn-ismail-ibn-saad"], "places": ["qurtuba", "ishbiliyya"], "sources": ["1440-10-01-the-palace-city-of-qurtuba", "1439-07-15-the-emperor-a-scholar", "1437-01-01-cultural-hegemon"], "words": 434, "catch": "Three miles west of Qurṭuba, on the slope where the Sierra", "canon": 4, "body": "Three miles west of [Qurṭuba](place:qurtuba), on the slope where the Sierra Morena comes down to the plain, the caliph ʿAbd al-Raḥmān III had built a city for himself and named it Madīnat al-Zahrāʾ, the Radiant City. It had palaces of marble and onyx, a hall whose roof was said to be made of gold and silver tiles, gardens watered from the mountains, a mosque, a mint and barracks for the caliph's guard. Ambassadors from Constantinople and the German emperor had been received there and told to wait in halls designed to make them feel small. It had stood for less than eighty years. In the fitna of the eleventh century, when the caliphate tore itself apart, the Berber soldiers sacked it, and for four hundred years its stones had been carried off to build other men's houses. By the time the house of Naṣr took Qurṭuba back, it was a field of broken columns that the shepherds of the Sierra used as a sheepfold.\n\nThe Emperor [Muḥammad](person:muhammad-ibn-ismail-ibn-saad) went to see it in Jumādā al-Ūlā 844. He had been reading the histories of the caliphate, as he now read everything, and he walked the ruins for a whole day with the old books in the hands of a secretary, matching the descriptions to the stones. When he came back to [Ishbīliya](place:ishbiliyya) he told the dīwān that he would rebuild it. Some in the dīwān said that a ruin was a ruin and that the money would be better spent on ships. He answered that every king and pretender in Christendom who doubted the empire's right to the peninsula should be made to wait in its halls, as their ancestors had waited. He paid for the first year's work out of his own treasury.\n\nThe masons, glassmakers and goldsmiths came from every city of the empire, and the merchants of Ishbīliya sent fine cloth for the hangings at prices that the clerks thought suspiciously low. A year later the halls of the Radiant City were standing again on the slope above Qurṭuba, built over the old foundations and as close to the old descriptions as the Emperor and his secretaries could make them. The court began to receive ambassadors there. The crown's hold on the country around it tightened, and the town below grew prosperous on the custom of the court. Across the peninsula, the court noticed, people had begun to speak of the Emperor as the caliphs' heir, which was what the court had intended.\n\n*Do you construct on every elevation a sign, amusing yourselves, and take for yourselves palaces that you might abide eternally?*"}, {"addr": "846-01-21", "slug": "0846-01-21-of-the-jamaa-of-846-and-the-burghers", "n": 106, "bn": 1, "hy": 846, "hm": 1, "hd": 21, "w": 1442, "title": "Of the Jamāʿa of 846, and the Burghers", "date": "1442-06-01", "dateStr": "1 June 1442", "hdateStr": "21 Muḥarram 846", "book": "book-of-the-golden-century", "people": ["muhammad-ibn-ismail-ibn-saad", "ismail-ibn-muhammad-ibn-ismail", "ahmad-ibn-muhammad-ibn-ismail", "ismail-ibn-saad"], "places": ["ishbiliyya"], "sources": ["1442-06-01-national-assemblies", "1442-06-01-privileges-for-the-burghers", "1428-05-25-jamaa-against-primacy", "1439-07-15-the-emperor-a-scholar", "1440-06-the-genoese-embargo"], "words": 495, "catch": "The Emperor Muḥammad called the Jamāʿa to Ishbīliya in Muḥarram 846,", "canon": 4, "body": "The Emperor [Muḥammad](person:muhammad-ibn-ismail-ibn-saad) called the Jamāʿa to [Ishbīliya](place:ishbiliyya) in Muḥarram 846, and for once he did not tell his sons what he meant to say to it. The princes [Ismāʿīl](person:ismail-ibn-muhammad-ibn-ismail) and [Aḥmad](person:ahmad-ibn-muhammad-ibn-ismail) had steered the realm for thirteen years. They had argued him out of Qashtāla, bargained Majrīṭ's charter out of the umarāʾ, and spent a year of their lives appeasing the estates. They learned what he intended at the same moment as the assembly did. He was the Emperor, he told them afterwards, and he had read more about the empires of old than
