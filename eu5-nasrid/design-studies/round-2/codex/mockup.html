m fell, and three thousand eight hundred of the enemy.\n\nWhen the sultan heard of it he marched north to Munṭīl. On the twenty-fourth of Rajab, on the same field where the Moroccans had broken, he met what remained of the Castilian army, some four and a half thousand men, with sixteen thousand of his own. The Christians had not had time to bury their dead from the first battle before they joined them. Three thousand one hundred fell, and we lost five hundred. The jinetes pursued the rest into the hills, and the Moroccans' debt was paid.\n\nThen the host came down again to [Qurṭuba](place:qurtuba), the old seat of the caliphs. The Christians have held it for a hundred and eleven years and made its great mosque into a church. On the ninth of Ramaḍān, the month of Badr, Qashtāla's southern army was rebuilt once more and sent to keep the sultan from the city. It had four thousand four hundred men. The sultan had fifteen thousand seven hundred. The Castilians did not break at once, but when they broke the jinetes rode them down. Three thousand three hundred and fifty Christians died before the gate of Qurṭuba, and two hundred and fifty of ours.\n\nThat made five great victories in a year, at [Jayyān](place:jayyan), [al-Quṣayr](place:al-qusayr), [Balma](place:balma), Munṭīl and Qurṭuba. Nearly twenty-four thousand Castilians had fallen in them, and the king's armies in the south had been broken again and again and made whole again from fresh levies. The old soldiers said they could not be made whole for ever. Qashtāla had men still. What it was running out of was men who believed they could win.\n\n*How many a small company has overcome a large company by permission of Allāh.* So it was said of Badr, when the believers were few. In Ramaḍān of 748 the believers were many and the infidels few, and the verse was turned around, and still it held, for Allāh is with the patient."}, {"addr": "748-10-15", "slug": "0748-10-15-the-birth-of-saad", "n": 18, "bn": 5, "hy": 748, "hm": 10, "hd": 15, "w": 1348, "title": "Of the Birth of Saʿd", "date": "1348-01-18", "dateStr": "18 January 1348", "hdateStr": "15 Shawwāl 748", "book": "book-of-balance", "people": ["saad-ibn-yusuf", "yusuf-i", "sayyida-of-fezzan", "faraj-ibn-ismail", "dua-marinid"], "places": ["qurtuba", "gharnata", "fas"], "sources": ["1348-01-18-birth-saad", "1348-01-18-betrothal-morocco"], "words": 294, "catch": "In the middle of Shawwāl in the year 748, while the", "canon": 1, "body": "In the middle of Shawwāl in the year 748, while the host wintered on the frontier of [Qurṭuba](place:qurtuba), a rider came up from [Gharnāṭa](place:gharnata) with the news the court had waited for. The lady [Sayyida](person:sayyida-of-fezzan), daughter of the house of Murzuq in Fazzān, had given our lord [Yūsuf](person:yusuf-i) a son. He was named [Saʿd](person:saad-ibn-yusuf), which is good fortune, and the name was thought well chosen: he was born in the second year of the war, in a season of victories, with the pestilence still far off in the East. A son of the sultan's body stood before a brother in the succession, and from that day the court counted the infant, and no longer his uncle [Faraj](person:faraj-ibn-ismail), the heir of Gharnāṭa.\n\nSayyida had come to Gharnāṭa a child of nine, betrothed to the young sultan in 738, and had married him in the year of the Jamāʿa. The women of the palace had long whispered that the harem the Jamāʿa enshrined would fill with sons. Now it had given one to the house of Naṣr. Alms were given at the gates of the Alhambra, and the poets of the court wrote odes that were better in their sentiment than their metre.\n\nThat same day a Naṣrid betrothal was sealed with the Marīnids of [Fās](place:fas), binding the two houses as the war bound the two realms. The bride was [Duʿāʾ](person:dua-marinid), a girl of nine of the Marīnid house, and she was promised not to the newborn but to the sultan himself. The dīwān thought it a prudent knot. In time the court would learn how quickly the knots the Marīnids tied could come undone, and that this one, alone of them, would hold.\n\n*Wealth and children are the adornment of the life of this world.*"}, {"addr": "749-02-15", "slug": "0749-02-15-the-coming-of-the-pestilence", "n": 19, "bn": 2, "hy": 749, "hm": 2, "hd": 15, "w": 1348, "title": "Of the Coming of the Pestilence", "date": "1348-05-15", "dateStr": "15 May 1348", "hdateStr": "15 Ṣafar 749", "book": "book-of-pestilence", "people": ["yusuf-i"], "places": ["qurtuba", "gharnata"], "sources": ["1348-05-15-black-death-arrives", "1348-plague-segregation", "1348-plague-scapegoats"], "words": 436, "catch": "On the fifteenth of Ṣafar in the year 749 the thing", "canon": 1, "body": "On the fifteenth of Ṣafar in the year 749 the thing the merchants had spoken of two years before came ashore. No chronicle records the name of the ship that carried it. It came in the spring with the trade from the east, as the sultan had said it would, while the host was far away on the plains of [Qurṭuba](place:qurtuba). Within days the physicians of the new houses of healing were sending word up to the Alhambra: the swellings, the fever, the black blood. The *ṭāʿūn* had come to al-Andalus.\n\nThe sultan's answer was the hardest one. He ordered the infected separated from the healthy. Whole streets were closed with chains, the sick were carried out of the cities to camps beyond the walls, and their houses were sealed with their goods inside. The physicians said it was the only way to slow the sickness, and they were right. But the burghers, whose shops were shut, and the common people, whose sons and mothers were carried off to the camps, cursed the order and the men who enforced it. Some of the *ʿulamāʾ* said that to flee a plague, or to drive others from it, was to doubt the decree of Allāh. Others answered with the Prophet's own words, peace be upon him: if you hear of a plague in a land, do not enter it; and if it breaks out in a land where you are, do not leave it.\n\nWhen the sultan came back from the frontier in the weeks that followed, he went to the house of healing in [Gharnāṭa](place:gharnata) against the pleading of his physicians. He walked its wards with a cloth soaked in vinegar over his mouth, looked at the swellings as a man who had dressed wounds on the field, and asked each physician what he lacked. What they asked for, the treasury sent.\n\nIn the farther villages, where the sultan's officers rode seldom, the people found a different remedy. Elders gathered and named those they held guilty. Sometimes it was a Jew who had sold medicines, sometimes a widow who lived alone, sometimes a stranger who had come up from the coast the month before. Then they drove them out, or worse. The government sent orders to stop it and the orders came too late. It is the oldest sin of frightened men to seek a hand to punish when the hand that strikes is Allāh's.\n\n*Wherever you may be, death will overtake you, even if you should be within towers of lofty construction.* The faithful knew it as a verse. Now they learned it as a season."}, {"addr": "749-04-03", "slug": "0749-04-03-the-madman-and-the-flame", "n": 20, "bn": 6, "hy": 749, "hm": 4, "hd": 3, "w": 1348, "title": "Of the Madman at al-Manṣūra, and the Flame the Turks would not Rekindle", "date": "1348-07-01", "dateStr": "1 July 1348", "hdateStr": "3 Rabīʿ al-Thānī 749", "book": "book-of-balance", "people": ["yusuf-i"], "places": ["qurtuba", "al-mansura", "gharnata"], "sources": ["1348-05-30-battle-cordoba", "1348-06-01-assassination-attempt", "1348-06-12-battle-cape-ben-sakka", "1348-07-01-help-from-the-east", "1348-07-01-influence-crosses", "1348-07-01-war-chest"], "words": 479, "catch": "On the first of Rabīʿ al-Awwal in the year 749 the", "canon": 1, "body": "On the first of Rabīʿ al-Awwal in the year 749 the host destroyed one more Castilian column before [Qurṭuba](place:qurtuba), two thousand men caught in the open. It was a small victory and the last of that spring, for the pestilence was already in the land behind the army. Two days later Allāh tested the realm in its head.\n\nThe sultan had come back from the frontier and was at [al-Manṣūra](place:al-mansura) in the east of the realm. As he came out from the prayer a man rushed through the crowd with a blade and fell on him. He was a madman, the guards said. Others said, more quietly, that he had been paid. Our lord [Yūsuf](person:yusuf-i) took the blade across the face, and the guards cut the man down before he could strike again. The sultan lived. He bears the scar to this day, and the people say it has made him look more like the warrior he has shown himself to be.\n\nBut the court asked why the guards had been so far from his side at the mosque door. Some whispered that they had been drawn away on purpose, by men who opposed the sultan's rule, his strengthened crown and his costly war. No one was named and no one was punished, which only made the whispers louder. The blow fell on the realm's sovereignty as much as on the sultan's face. The war, the pestilence and the knife together drove it far below the half.\n\nIn those weeks the scales of the Strait tipped in a new direction. For the first time, the sway of the Marīnids over [Gharnāṭa](place:gharnata) outweighed the sway of Qashtāla. On the fourteenth of Rabīʿ al-Awwal the great fleet of Fās, fifty-four ships, fell on the Aragonese off Cape Ben Sakka and sank thirteen of their sixteen galleys. It was the first victory the allies had won at sea in the whole war, and it made the Marīnid sultan bold and his envoys at Gharnāṭa overbearing. The court had gone to war to keep Qashtāla's hand off the realm. It began to fear that it was only exchanging one master for another.\n\nSo the sultan looked further east. He sent a delegation to Qusṭanṭīniyya to congratulate the Ottoman beys on their conquest and to ask, after ten years of friendly letters, for soldiers against the crowns of Iberia. Sulaymān Bey received them courteously and sent them home with this answer: *Why should we try to rekindle a nearly extinguished flame?* By this he meant al-Andalus.\n\nThe war was now costing fifty dīnārs a month against an income of nineteen. Five loans were owed again, and the treasury held eight hundred and nineteen. The realm was winning every battle and paying for every one of them.\n\n*And it is not for a soul to die except by permission of Allāh at a decree determined.*"}, {"addr": "749-08-09", "slug": "0749-08-09-of-wages-medicines-and-maids", "n": 21, "bn": 3, "hy": 749, "hm": 8, "hd": 9, "w": 1348, "title": "Of Wages, Medicines and Maids", "date": "1348-11-02", "dateStr": "2 November 1348", "hdateStr": "9 Shaʿbān 749", "book": "book-of-pestilence", "people": ["yusuf-i"], "places": ["washqa", "antaqira", "balansiyya", "shatiba", "qandiya", "muyaqar", "ishbiliyya"], "sources": ["1348-07-01-plague-spread", "1348-07-01-wage-fixing", "1348-09-01-expired-medicaments", "1348-11-01-maid-draft", "1348-11-02-plague-toll"], "words": 524, "catch": "By the beginning of Rabīʿ al-Thānī the pestilence was in Washqa", "canon": 1, "body": "By the beginning of Rabīʿ al-Thānī the pestilence was in [Washqa](place:washqa) in the north and [Antaqīra](place:antaqira) in the west, and in the mountain villages of the Alpujarra. In [Balansiyya](place:balansiyya) it was in [Shāṭiba](place:shatiba) and [Qandiya](place:qandiya). The realm counted seventeen thousand fewer souls than in the autumn before. That was only the beginning, though no one yet knew it.\n\nThe plague killed the poor first and fastest, for they lived closest together. Within a season the masters of the workshops and the owners of the fields were crying that there were no hands to hire. Those labourers who were left knew their worth and asked double. In [Muyaqar](place:muyaqar) and the towns around it the guilds agreed among themselves to hold wages where they had been, and the labourers came to the governor to complain of it. The sultan was asked to judge. He sided with the guilds, for a realm at war cannot let its wages run wild, and the judgment went out in the words the guild masters had asked for: the labourers must be shown their place. Those about him said he gave it with a heavy face, and that winter bread was handed out at the gates of Muyaqar, paid for from his own purse and not the treasury's. The labourers went back to work. They did not forget, and their grumbling spread across the realm further than the governor reported.\n\nIn Jumādā al-Ākhira the physicians of the houses of healing came to the sultan with a darker complaint. Half the medicines sold in the markets were spoiled, they said, or cut with chalk and flour by merchants who had seen that a frightened man will pay anything. Worse, such filth might itself carry the sickness from house to house. The sultan ordered them burned. Officers went through the markets of the realm, whose trade all answers to the great market of [Ishbīliya](place:ishbiliyya) beyond the frontier, and nearly half the medicines in that whole trade went onto the fires. The merchants wept and the crown paid them a little to quiet them. The physicians said it was the best order of the year.\n\nIn Shaʿbān the nobles came to the sultan with their own complaint. No servant would enter the house of a sick nobleman for any wage, and the great houses were left with no one to carry the water or wash the dying. They asked for the right to draft servants from among the common people. The sultan needed the nobles, who led his levies, more than he needed the goodwill of the villages. He granted it, and of all his orders that year it was the one he liked least. Men and women of the villages were taken from their fields to serve in houses where the plague already was.\n\nOn the ninth of Shaʿbān the dīwān's account stood thus. The sickness had touched eleven of the realm's towns and the pestilence itself had killed nine thousand of its people. In all the known world it had carried off more than twenty million since it rose at Yāyiq. Some at court hoped the worst had passed.\n\nThey were wrong."}, {"addr": "749-11-07", "slug": "0749-11-07-the-peace-of-qurtuba", "n": 22, "bn": 7, "hy": 749, "hm": 11, "hd": 7, "w": 1349, "title": "Of the Peace of Qurṭuba", "date": "1349-01-27", "dateStr": "27 January 1349", "hdateStr": "7 Dhū al-Qaʿda 749", "book": "book-of-balance", "people": ["yusuf-i", "alfonso-xi"], "places": ["qurtuba", "ishbiliyya", "jayyan", "istijja", "al-qusayr", "balma", "wubira", "mursiyya", "gharnata"], "sources": ["1348-09-02-portugal-peace", "1349-01-27-peace-of-qurtuba", "1349-01-27-tributary-in-name", "1349-01-27-realm-doubled", "1349-01-27-unrest"], "words": 558, "catch": "In Jumādā al-Ākhira of the year 749 the first crown fell", "canon": 1, "body": "In Jumādā al-Ākhira of the year 749 the first crown fell away. Portugal had lost no army and hardly a ship, but fifty-five thousand of its people had died in the years of the war. It made a separate peace with the Marīnids and annulled for ten years every treaty it had with Qashtāla. It paid reparations and gave a hundred and forty gold pieces to the allies besides. [Alfonso](person:alfonso-xi) of Qashtāla was left with Arghūn alone beside him, and Arghūn's best fleet lay at the bottom of the sea off Cape Ben Sakka.\n\nThe pestilence did not take sides. It came into Qashtāla as it had come into [Gharnāṭa](place:gharnata), and it found the Castilian armies in their winter camps, crowded, hungry and beaten. The levies deserted to bury their families. The captains wrote to the king that they could not hold the frontier. And at the beginning of Dhū al-Qaʿda in the year 749 the envoys of Alfonso came, not to the Marīnid sultan, who had begun the war, but to our lord [Yūsuf](person:yusuf-i), who had won it. They asked for a separate peace with Gharnāṭa alone.\n\nThe sultan received the envoys standing, with the scar of al-Manṣūra still red across his face. He named his terms once, town by town, in a level voice, and when the Castilians began to bargain he left them with his secretary and went out to his other business. The dīwān expected the terms to be refused. Before evening the envoys had sent after him. On the seventh of Dhū al-Qaʿda the Peace of [Qurṭuba](place:qurtuba) was sealed. Qashtāla gave up twenty-three towns along the river and in the hills of the frontier:\n\n- Qurṭuba of the caliphs, lost a hundred and twelve years before;\n- [Ishbīliya](place:ishbiliyya), lost a hundred years before;\n- [Jayyān](place:jayyan), where the tyrant had been broken;\n- Ubbadha al-ʿArab, Bayyāsa and [Istijja](place:istijja), and al-Yusāna, Martush and Ūshūna;\n- [al-Quṣayr](place:al-qusayr) and [Balma](place:balma), where the sultan had won his victories;\n- [Wubīra](place:wubira) of the old Naṣrid claim, and others besides.\n\nThe Ṭāʾifa of [Mursiyya](place:mursiyya) took the whole of its own land, eleven towns more. Qashtāla paid reparations in gold and annulled its treaties with Arghūn. In return Gharnāṭa took again the name of Qashtāla's tributary.\n\nIt was only a name. The realm that had held nineteen of the seventy-two towns of the Strait's three lands now held fifty-three. It had been eighteen towns and was now forty-one. Its souls had been three hundred and seventy-seven thousand, after the plague's first year, and were now seven hundred and fifty-four thousand. But nearly half of them were Castilian Christians who had gone to sleep subjects of Alfonso and woken subjects of the house of Naṣr. They had not been asked, and they had buried their own dead that winter.\n\nThe realm was greater than at any time since the house of Naṣr was founded, and it was not at peace with itself. War and plague had shaken every estate, and the realm was more unsettled than at any time in the reign. In the new lands the bells still rang for the Christian dead. The Marīnids fought on alone. The sultan had made the peace his victories had earned, and Fās would have to make its own.\n\n*And if they incline to peace, then incline to it also, and rely upon Allāh.*"}, {"addr": "750-03-16", "slug": "0750-03-16-the-embassy-to-al-qahira", "n": 23, "bn": 8, "hy": 750, "hm": 3, "hd": 16, "w": 1349, "title": "Of the Foundations on the Sabīka, and the Embassy to al-Qāhira", "date": "1349-06-04", "dateStr": "4 June 1349", "hdateStr": "16 Rabīʿ al-Awwal 750", "book": "book-of-balance", "people": ["yusuf-i"], "places": ["gharnata", "jayyan", "ishbiliyya"], "sources": ["1349-alhambra-foundations", "1349-06-01-estates-reading", "1349-06-01-castilian-patriots", "1349-06-01-embassy-to-cairo", "1349-06-02-mamluk-alliance", "1349-06-04-sovereignty", "1349-06-tunis-alliance-ends"], "words": 472, "catch": "With the gold of the peace our lord Yūsuf did what", "canon": 1, "body": "With the gold of the peace our lord [Yūsuf](person:yusuf-i) did what the princes of his house have always done when Allāh gave them a season of fortune. He built. In Rabīʿ al-Awwal of the year 750 the masons laid the foundations of a new wing of al-Ḥamrāʾ on the Sabīka hill above [Gharnāṭa](place:gharnata). Its vaults were to be hung with *muqarnas* like the cells of a honeycomb, and its walls cut with verses in praise of the house of Naṣr. The sultan meant it as a letter to Qashtāla and to Fās alike. The house of Naṣr is not a guest in al-Andalus that may be asked to leave. It means to stay, and it builds as those who mean to stay build.\n\nThe realm needed telling, for its sovereignty had fallen far below the half and the Strait leaned toward Fās. The estates were weighed that month after the peace. The crown's voice in the realm had grown, and the nobles, once the loudest, had lost much of theirs. The dhimmīs, swollen by the Christians of the new lands, now spoke with a weight no one in the dīwān could ignore. In those lands Castilian patriots were gathering in the hills of [Jayyān](place:jayyan) and [Ishbīliya](place:ishbiliyya). The two princes of the cabinet were sent to bind those cities to the realm, while the plague went on taking their people.\n\nSo the sultan sought a weight to set on his own side of the scales. He sent an envoy across the whole length of the sea to al-Qāhira, to the Mamlūk sultan Jamāl al-Dīn, keeper of the two holy cities and lord of Egypt and Syria. The embassy cost a hundred and seven dīnārs, a quarter of a year's income. The envoy carried a plea: the last Muslim kingdom of the West stood alone between the Christian crowns and a Marīnid ally who wished to be its master.\n\nThe answer came on the fourteenth of Rabīʿ al-Awwal, and it was more than the court had dared hope. The Mamlūk wrote as a brother in faith. He granted an alliance with Gharnāṭa, and sent Mamlūk horsemen and foot to stand in the sultan's army, the slave-soldiers who had broken the Mongols at ʿAyn Jālūt. He promised gold and men every year besides. Within three days the realm's sovereignty rose above the half again, for the first time since the summer of 747.\n\nBut friendship has its price. The court's envoys were stretched across too many courts: Fās, Tūnis and now al-Qāhira, with too few clerks and too little silver to keep them all. The strain fell on the crown itself. The sultan let the alliance with Tūnis lapse quietly, and kept the Marīnid one for now, to see what the Marīnids would do.\n\n*The believers are but brothers, so make settlement between your brothers.*"}, {"addr": "750-08-24", "slug": "0750-08-24-the-great-dying", "n": 24, "bn": 4, "hy": 750, "hm": 8, "hd": 24, "w": 1349, "title": "Of the Great Dying", "date": "1349-11-07", "dateStr": "7 November 1349", "hdateStr": "24 Shaʿbān 750", "book": "book-of-pestilence", "people": ["yusuf-i"], "places": ["qurtuba", "ishbiliyya", "jayyan", "gharnata", "malaqa"], "sources": ["1349-06-01-castilian-patriots", "1349-11-07-plague-toll"], "words": 344, "catch": "The peace brought no peace from the pestilence. Through the summer", "canon": 1, "body": "The peace brought no peace from the pestilence. Through the summer and autumn of the year 750 it came back stronger than before, as a flood that has drawn back comes again over the same ground. It settled worst on the lands newly won, on [Qurṭuba](place:qurtuba) and [Ishbīliya](place:ishbiliyya) and the river towns between them. Their walls held a hundred years of Christian crowding and their people were weak from the war that had passed over them twice. Then it climbed back over the mountains into the old realm, into [Gharnāṭa](place:gharnata) and [Mālaqa](place:malaqa), where the houses of healing were full and the cemeteries were fuller.\n\nBy the twenty-fourth of Shaʿbān the dīwān had stopped counting by the week and begun counting by the month. The sickness lay over seventeen of the realm's towns. It had killed two hundred and ten thousand of its people, where a year before the toll had been nine thousand. Each month nearly six thousand more were lost. Of the seven hundred and fifty-four thousand who had been the sultan's subjects on the day of the Peace of Qurṭuba, six hundred and twelve thousand remained. In all the known world forty-four million were dead.\n\nThese are numbers, and a chronicle can set them down in a line. What they meant is harder to write. It meant the call to prayer given by a boy because the muezzin was dead and his son with him. It meant the *qāḍī*'s court closed for want of witnesses. It meant fields of ripe wheat in the Vega with no one to cut them, and the price of bread rising while the price of land fell. It meant the bells of the Christians in [Jayyān](place:jayyan) tolling from dawn to dusk. It meant that Muslim and Christian and Jew were washed and wrapped by the same hands and laid in trenches side by side, because there was no one left to dig them apart.\n\nThe physicians did what they could, and it was not enough.\n\n*Indeed we belong to Allāh, and indeed to Him we will return.*"}, {"addr": "751-06-28", "slug": "0751-06-28-the-emptied-cities", "n": 25, "bn": 5, "hy": 751, "hm": 6, "hd": 28, "w": 1350, "title": "Of the Emptied Cities", "date": "1350-09-02", "dateStr": "2 September 1350", "hdateStr": "28 Jumādā al-Ākhira 751", "book": "book-of-pestilence", "people": ["yusuf-i"], "places": ["gharnata", "malaqa", "al-mariyya"], "sources": ["1350-09-02-great-dying-census", "1350-09-02-cities-emptied", "1350-09-02-recovery"], "words": 526, "catch": "At the end of Jumādā al-Ākhira in the year 751 the", "canon": 1, "body": "At the end of Jumādā al-Ākhira in the year 751 the pestilence was at last withdrawing. It touched only four towns of the realm now, and the physicians of the houses of healing began to send their assistants home. So the sultan ordered the dīwān to make a reckoning. It was to cover not only the realm as it now stood, but the old realm as it had been in the summer of 747, when the rumour first came out of the East, and every land beside it that had sent word.\n\nThe reckoning was this. The old lands of Gharnāṭa, which had held four hundred and ninety thousand souls when the merchants first spoke of Yāyiq, now held two hundred and eighty-four thousand. Two in every five had died. Of all the realms of which word came, only one far in the East had lost a greater share. Qashtāla had lost a little more than a third of its people, and Arghūn a third. Portugal had lost nearly as many. But Morocco had lost fewer than one in five, and Tūnis fewer than one in thirteen. The Mamlūks had lost fewer than one in six. Across the whole world some forty-six million had died.\n\nWhy had Gharnāṭa suffered worse than the Christians it had beaten? The dīwān found the answer in its own ledgers, and it was bitter. Gharnāṭa was a realm of cities as Qashtāla was not. Two of every five of the sultan's subjects lived within the walls of [Gharnāṭa](place:gharnata), [Mālaqa](place:malaqa), [al-Mariyya](place:al-mariyya) and the other great towns. In Qashtāla it was one in twenty. The Castilians live scattered in hamlets and walled farms, where a sickness can burn out in a single household. Our people live in the alleys of the Albayzín and the markets of the coast, where it ran from door to door. The cities of the realm lost almost half their people, the houses of healing notwithstanding. The few cities of Qashtāla lost one in five.\n\nAnd it took the people who had made the cities what they were. The burghers, the merchants of silk and sugar and the masters of the guilds, fell by three in five. The *ʿulamāʾ*, the scholars and the judges and the teachers of the madrasa, fell by more than half. The nobles fell by nearly half, the common folk of the fields by a little less. The soldiers, who had spent those years in camp on the frontier and not in the crowded streets, lost only one in seven. The old Gharnāṭa of the scholars and the silk merchants was gone. The realm that remained was smaller, more rural and more martial, and nearly half of it was Christian.\n\nYet the realm steadied. With the sickness passing, the realm grew quieter than it had been since the war began, and its sovereignty, so long hovering about the half, climbed well above it. The dead could not be recalled, but the living could still be ruled.\n\n*In order that you not despair over what has eluded you and not exult over what He has given you. And Allāh does not like everyone self-deluded and boastful.*"}, {"addr": "751-10-07", "slug": "0751-10-07-the-islands", "n": 26, "bn": 9, "hy": 751, "hm": 10, "hd": 7, "w": 1350, "title": "Of the Islands, and the Eyes Turned to the Strait", "date": "1350-12-08", "dateStr": "8 December 1350", "hdateStr": "7 Shawwāl 751", "book": "book-of-balance", "people": [], "places": ["gharnata", "qadis"], "sources": ["1350-07-the-war-turns", "1350-12-aragon-peace", "1351-01-01-majorca-mainland"], "words": 290, "catch": "While Gharnāṭa buried its dead, the war it had left went", "canon": 1, "body": "While [Gharnāṭa](place:gharnata) buried its dead, the war it had left went on without it. By Rabīʿ al-Thānī of the year 751 Qashtāla had found five thousand men among the living. With them it drove the Marīnid raiders back from its heartlands, where they had burned and taken captives at will for two summers. Yet in the lands of Arghūn and on its islands the ships of Tūnis and the other lords of the Maghrib went where they pleased, and sacked the countryside from the Ebro to Mayūrqa. Arghūn had won every battle at sea in the war's first years, and since the day off Cape Ben Sakka it had no fleet to stop them.\n\nOn the seventh of Shawwāl Arghūn made its peace with the Muslim powers. Fās took the Balearic Islands, Mayūrqa, Manūrqa and Yābisa, which had been lost to the Christians more than a century before. Tūnis took Arghūn's vassal in Sardinia, the county of Qalyari, and made it its own subject. On the first day of the new Christian year the mainland lands of the king of Mayūrqa, Perpinyà, Prades and Puigcerdà in the mountains, and Montpellier, passed to Arghūn. So the kingdom of Mayūrqa was no more, divided between the Cross and the Crescent.\n\nThe Marīnids had their islands, and they had them because Gharnāṭa had broken Qashtāla's armies in the field. They did not say so. Now there was only Qashtāla left in the war, and all eyes turned to the Strait. The Castilians pushed south to [Qādis](place:qadis) and the ports of the Strait, and drove the men of Fās from this shore. The Marīnid sultan, who had begun the war to reclaim al-Andalus, held islands in the sea and no foot of al-Andalus itself."}, {"addr": "751-11-20", "slug": "0751-11-20-the-prodigy-and-the-daughter-of-cairo", "n": 27, "bn": 10, "hy": 751, "hm": 11, "hd": 20, "w": 1351, "title": "Of the Prodigy, and the Daughter of al-Qāhira", "date": "1351-01-19", "dateStr": "19 January 1351", "hdateStr": "20 Dhū al-Qaʿda 751", "book": "book-of-balance", "people": ["saad-ibn-yusuf", "aiman-mamluk", "yusuf-i"], "places": ["gharnata", "fas", "tilimsan"], "sources": ["1351-01-19-mamluk-betrothal", "1351-01-saad-prodigy", "1351-01-saad-tutors"], "words": 405, "catch": "In Dhū al-Qaʿda of the year 751 a letter came from", "canon": 1, "body": "In Dhū al-Qaʿda of the year 751 a letter came from al-Qāhira, sealed with the seal of the Mamlūk sultan. Jamāl al-Dīn agreed to give his daughter [Aiman](person:aiman-mamluk) in marriage to [Saʿd](person:saad-ibn-yusuf), son of our lord [Yūsuf](person:yusuf-i) and heir to the throne of [Gharnāṭa](place:gharnata), when the two came of age. So the alliance made in the embassy of 750 became a bond of blood between the house of Naṣr and the lords of Egypt and Syria. So the heir's bride would come from the East, while the Marīnid girl promised to his father in the year of Saʿd's birth was still growing up in [Fās](place:fas).\n\nIn that same month the chancellor brought the sultan a report on his son, who was not yet three years old. The tutors of the nursery said the child learned as other children breathe. He knew his letters before he could run, and he asked questions about the stars and the Qurʾān that his teachers could not always answer. The chancellor wrote that his future was bright, and that his name would be written in the books of history. The court began to whisper what no one had dared say aloud in the plague years: that this child might be the prince to lead the realm out of the darkness.\n\nThe sultan answered as a father and as a king. He sent to every corner of the Islamic world for the finest teachers that silver could bring to Gharnāṭa. There were grammarians and jurists of the Mālikī school, astronomers and physicians, masters of the Qurʾān and of poetry, from Fās and [Tilimsān](place:tilimsan), from Tūnis and al-Qāhira and Dimashq. And because the realm now held nearly as many Christians as Muslims, he sent too for several learned Christians. They were to teach the heir the tongues and laws and customs of the people he would one day rule. Some of the *ʿulamāʾ* frowned at it. The sultan said that a prince who would rule Castilians must first understand them.\n\nThe plague had taken the scholars of Gharnāṭa by the half. Now the scholars of the world came to Gharnāṭa for the sake of one small boy. The education of Saʿd would be long and thorough, and the court watched it as a farmer watches the first green shoot after a hard winter.\n\n*He gives wisdom to whom He wills, and whoever has been given wisdom has certainly been given much good.*"}, {"addr": "752-04-07", "slug": "0752-04-07-the-silver-of-qusantina", "n": 28, "bn": 11, "hy": 752, "hm": 4, "hd": 7, "w": 1351, "title": "Of the Silver of Qusanṭīna, and the Surrender of the Marīnids", "date": "1351-06-03", "dateStr": "3 June 1351", "hdateStr": "7 Rabīʿ al-Thānī 752", "book": "book-of-balance", "people": ["yusuf-i", "alfonso-xi", "abu-inan-faris"], "places": ["gharnata", "ishbiliyya", "qarmuna", "qusantina", "qadis", "runda", "marballa"], "sources": ["1351-01-silver-for-silence", "1351-05-21-qarmuna-qusantina", "1351-06-03-moroccan-surrender", "1351-06-03-state"], "words": 498, "catch": "The dīwān of Gharnāṭa watched the last year of the war", "canon": 1, "body": "The dīwān of [Gharnāṭa](place:gharnata) watched the last year of the war as a merchant watches two men bidding against each other for the same bale. Qashtāla was bled white by the pestilence and stood at the very edge of defeat. A little gold sent to the Marīnids might have pushed it over: gold for ships and for the wages of the raiders on the coast of Arghūn. Fās was bled less, but it was beaten on this shore and ruled now by the young sultan [Abū ʿInān Fāris](person:abu-inan-faris). And Gharnāṭa, which had made its own peace, held the balance between them.\n\nSo in Dhū al-Qaʿda of the year 751 the sultan's envoys went quietly to the court of [Alfonso](person:alfonso-xi). They made no threat, for a threat can be answered. They spoke instead of what the sultan might do and had not yet done. Gharnāṭa, they said, had no wish to see Qashtāla humbled further. It would send no silver across the Strait, so long as the border between the two realms were made a little more just: a mild shift along the river below [Ishbīliya](place:ishbiliyya). They asked for [Qarmūna](place:qarmuna) on its hill, and north of it, in the dark hills of the Sierra Morena, [Qusanṭīna](place:qusantina).\n\nThey called the shift mild, and the Castilians may have believed it. Qarmūna is a small town of potters. But the hills of Qusanṭīna are full of silver, and the dīwān had reckoned that their mines could yield the crown more than all of Ishbīliya. On the twenty-fourth of Rabīʿ al-Awwal 752 the king of Qashtāla, with the Marīnids at his throat and no silver to spare for pride, set his seal to it.\n\nThirteen days later, on the seventh of Rabīʿ al-Thānī, the Marīnids surrendered to Qashtāla. They kept the islands they had taken from Arghūn. And among the terms the Castilians demanded was one the court had not looked for: Fās was to annul its treaties with Gharnāṭa. The alliance that had dragged the realm into the war, which the sultan had kept only to see what Fās would do, was broken for him by the hand of his enemy. Qashtāla had done Gharnāṭa's work for it, and perhaps believed it had wounded Gharnāṭa.\n\nWhen the war of 747 began, the realm held nineteen towns of the Strait's three lands, and its sovereignty was slipping below the half. At its end the realm held fifty-five of the seventy-two. Its sovereignty stood well above the half, the realm was quiet, and the treasury owed nothing to anyone. Its only ally now was the lord of Egypt, whose daughter would marry its heir. It was still Qashtāla's tributary in name. But the balance had moved, and it had moved toward Gharnāṭa. The last seventeen towns of the Strait still flew the banners of Qashtāla, from [Qādis](place:qadis) on the coast to [Runda](place:runda) and [Marballa](place:marballa) within the realm's own mountains.\n\n*And Allāh is predominant over His affair, but most of the people do not know.*"}, {"addr": "752-12-09", "slug": "0752-12-09-the-departing-of-the-pestilence", "n": 29, "bn": 6, "hy": 752, "hm": 12, "hd": 9, "w": 1352, "title": "Of the Departing of the Pestilence", "date": "1352-01-27", "dateStr": "27 January 1352", "hdateStr": "9 Dhū al-Ḥijja 752", "book": "book-of-pestilence", "people": ["yusuf-i"], "places": ["gharnata", "malaqa", "al-mariyya"], "sources": ["1352-01-27-plague-gone", "1350-09-02-great-dying-census", "1350-09-02-cities-emptied"], "words": 434, "catch": "On the ninth of Dhū al-Ḥijja in the year 752, the", "canon": 1, "body": "On the ninth of Dhū al-Ḥijja in the year 752, the Day of ʿArafa, while our lord stood on the plain beyond Makka, the pestilence left the last town of the realm. No messenger brought word of it, for there was no one moment of its going. A physician in a mountain village found one morning that there was no new swelling to lance. A grave-digger in [Mālaqa](place:malaqa) found that no one came to him that day. The bells of the Christians fell silent, and the muezzins called the prayer to mosques that were fuller than they had been in years. Only later, when the scribes of the dīwān went through their reports, did they find that the last house had been cleared on that day.\n\nThe reckoning was made, and it is written in this book. Two hundred and twenty-one thousand of the realm's people were dead. Fifty-two million were dead in the whole known world from Yāyiq to the Ocean. Of every five souls in the old realm of Gharnāṭa, two were in the ground. The cities had suffered most, [Gharnāṭa](place:gharnata), Mālaqa and [al-Mariyya](place:al-mariyya), with their alleys and their markets. The houses of healing had slowed the sickness but could not stop it. It took the burghers and the scholars hardest of all, the very men who had made those cities the light of the West.\n\nIn the years that followed, the dead were not replaced. Four years after the pestilence left, the old lands of the realm counted fewer souls than they had at the reckoning. The empty houses of the Albayzín stayed empty. The realm that came out of the plague years was not the realm that went in. It was smaller in its cities and larger in its lands, more rural and more martial than before, and nearly half Christian. It had been won in the field by the sword while it was being emptied at home by the sickness.\n\nThe physicians say the pestilence has not left the world. It lingers in the East and may come again. But in Gharnāṭa no one has died of it in four years, and the court has decided that this book may be closed. What comes next must be a book of filling what was emptied, of the madrasas and the libraries, of the call to prayer carried back into the towns that had forgotten it.\n\nHere ends the Book of the Pestilence.\n\n*And We will surely test you with something of fear and hunger and a loss of wealth and lives and fruits, but give good tidings to the patient.*"}, {"addr": "753-02-20a", "slug": "0753-02-20-the-royal-hajj", "n": 30, "bn": 12, "hy": 753, "hm": 2, "hd": 20, "w": 1352, "title": "Of the Royal Ḥajj", "date": "1352-04-07", "dateStr": "7 April 1352", "hdateStr": "20 Ṣafar 753", "book": "book-of-balance", "people": ["yusuf-i", "faraj-ibn-ismail"], "places": ["gharnata"], "sources": ["1351-08-09-hajj-departs", "1351-10-07-hajj-al-qahira", "1352-01-01-hajj-makka", "1352-01-27-plague-gone", "1352-04-07-hajj-return"], "words": 640, "catch": "And proclaim to the people the Ḥajj; they will come to", "canon": 2, "body": "*And proclaim to the people the Ḥajj; they will come to you on foot and on every lean camel, coming from every distant pass.*\n\nNo reigning sultan of the house of Naṣr, it was said, had ever made the pilgrimage. The road from [Gharnāṭa](place:gharnata) to Makka is the longest in the Muslim world: across the whole sea, the whole of Egypt and the whole of the Ḥijāz. A prince of al-Andalus who leaves his throne for a year leaves it within a day's ride of Qashtāla. But the war was won and the pestilence was passing, and our lord [Yūsuf](person:yusuf-i) resolved to go. On the fifteenth of Jumādā al-Ākhira in the year 752, half a year before the season of the pilgrimage, he took ship for the East. His elder brother [Faraj ibn Ismāʿīl](person:faraj-ibn-ismail) governed the realm as regent. The caravan was stocked for a year and guarded like an army, and at its head went the *maḥmal* of Gharnāṭa, the empty litter that is the banner of a prince's pilgrimage. It was hung with brocade and carried in all the splendour the treasury could bear.\n\nOn the fifteenth of Shaʿbān, the night of the middle of the month, when the faithful say the record of the year is written, the caravan came through the northern gate of al-Qāhira. The city swallowed it at once: the noise, the spice, the tanneries and the roasting meat. Over the roofs rose al-Azhar, whose scholars are counted among the finest in Islam. The sultan might have sat with them, or pushed on at once for Makka. He did neither. He had the caravan dressed in banners and silk and kept it ten days in the city of the Mamlūks, so that the court whose daughter was promised to his son might see what the house of Naṣr could still put on the road.\n\nOn the thirteenth of Dhū al-Qaʿda the caravan came down into Makka, and the Grand Mosque opened before it. The Kaʿba stood at its heart, draped in black, older than memory, and the white-robed faithful moved around it in their patient circles. There a sultan and a shepherd dress alike. Our lord asked himself what kind of pilgrim he would be, for what a king does in Makka is talked of in every market of Islam for a generation. He chose to be a generous one. He gave gold freely in the streets of the holy city, that no pilgrim there should go hungry while the lord of Gharnāṭa was among them.\n\nThen he waited a month for the days of the pilgrimage. On the eighth of Dhū al-Ḥijja he went out to Minā with the multitude. On the ninth he stood on the plain of ʿArafa from noon until the sun went down, among a hundred thousand voices crying *labbayka*, and asked Allāh's forgiveness for himself and his people. The scribes of the dīwān later found that on that same day, far away in the West, the pestilence left the last town of the realm. Not one house in Gharnāṭa was still touched by it. The chronicler sets the two facts side by side and draws no conclusion.\n\nHe came home on the twentieth of Ṣafar in the year 753, eight months after he had left. Word had outrun the caravan. Every court of Islam had heard of the sultan of al-Andalus who stood at ʿArafa and fed the poor of Makka, and they thought better of Gharnāṭa for it. The *ʿulamāʾ* were content as they had not been for years. Faraj handed back the seal of the regency. And from that day our lord carried a title that no victory could have given him: al-Ḥājj Yūsuf.\n\n*Our Lord, give us in this world good and in the Hereafter good, and protect us from the punishment of the Fire.*"}, {"addr": "753-02-20b", "slug": "0753-02-20-the-works-of-the-regency", "n": 31, "bn": 13, "hy": 753, "hm": 2, "hd": 20, "w": 1352, "title": "Of the Works of the Regency, the Thought of Qurṭuba, and the Murmuring of the Castilians", "date": "1352-04-07", "dateStr": "7 April 1352", "hdateStr": "20 Ṣafar 753", "book": "book-of-balance", "people": ["faraj-ibn-ismail", "nasr-al-istijji", "yusuf-i", "najib"], "places": ["istijja", "gharnata", "qurtuba", "qusantina", "jayyan", "ishbiliyya"], "sources": ["1351-10-01-great-madrasa", "1351-10-06-najib-to-castile", "1351-11-08-unlimited-export", "1352-01-01-hall-of-ambassadors", "1352-04-capital-qurtuba", "1352-04-castilian-unrest", "1352-04-jizya-remitted"], "words": 840, "catch": "While the sultan walked toward Makka, the regent Faraj did not", "canon": 2, "body": "While the sultan walked toward Makka, the regent [Faraj](person:faraj-ibn-ismail) did not sit idle in the Alhambra. He governed as his brother would have wished, which is to say he built. His audiences were crowded with the lords of the realm, and loudest among them was [Naṣr al-Istijjī](person:nasr-al-istijji), of the house that takes its name from [Istijja](place:istijja), a man who could talk through a whole afternoon of council and leave it no wiser than he found it.\n\nOn the ninth of Shaʿbān in the year 752 he founded the Great Madrasa of [Gharnāṭa](place:gharnata) beside the great mosque. For years the scholars of the city had begged for a college where the law might be taught under one roof, as it is in Fās and al-Qāhira. The pestilence had taken more than half of them, and those who remained pressed the harder for it, lest the learning of al-Andalus die with them. The regent paid two hundred and eighteen dīnārs, and the walls began to rise. It was meant to draw students and jurists from across the Strait and to bind the learning of the cities to the service of the sultan.\n\nFive days later Allāh showed how much such a house was needed. [Najīb al-ʿĀbidīn](person:najib) of the *ʿulamāʾ*, the most gifted mind left at court, was claimed by Qashtāla at its demand as overlord. He went north without a struggle. There, before the cathedral chapter of the Christians, he was baptised and took the name Ramiro. He carried with him in his saddlebags the letters, treatises and reckoning tables that were the inheritance of the libraries of [Qurṭuba](place:qurtuba). The Christian scholars rejoiced over what he brought them. This was the second great mind of Gharnāṭa to go over to the Cross, after Ibn al-Khaṭīb. The court began to say bitterly that Qashtāla no longer needed to take our towns when it could take our men.\n\nIn Ramaḍān the regent turned to the silver of [Qusanṭīna](place:qusantina), which was the realm's own at last. He opened the treasuries to the merchants. Gold and silver were to flow out freely to the markets of the world, where they would buy more than they could ever buy as coin in the mint at home. And on the thirteenth of Dhū al-Qaʿda, in the days when the sultan came down into Makka, Faraj raised within the great tower of the palace a hall to receive the envoys of kings. Its cedar ceiling was carved with the seven heavens, thousands of pieces set above the throne, so that every embassy might see the order of creation under which the house of Naṣr sits. It cost a hundred dīnārs, a fifth of a year's income. It speaks for Gharnāṭa more plainly than any letter.\n\nSo when al-Ḥājj Yūsuf came home in Ṣafar 753, he found his city richer in learning and in splendour, though poorer by one great scholar. He stood a long while under the cedar ceiling of the new hall, following the seven heavens with his eyes, and said only that he would have hung the stars a little higher. Then he called for the masons' drawings of the madrasa and sat over them half the night. And he found himself looking north. Gharnāṭa had been the capital of a mountain kingdom of eighteen towns. The realm was now forty-three towns, its heart lay in the valley of the great river, and its greatest cities were Qurṭuba and Ishbīliya. Qurṭuba had been the seat of the caliphs when al-Andalus was the light of the West. The sultan began to speak of moving the throne back to it. The court was divided, and the old families of Gharnāṭa were alarmed.\n\nBut one matter outweighed all the others, and it was not in Gharnāṭa. In the new lands, in the villages around [Jayyān](place:jayyan) and [Ishbīliya](place:ishbiliyya), the Castilian peasants were murmuring. They had buried a third of their people in the plague years, and they paid their taxes to a Muslim lord. They had not been asked whether they wished to change masters. The Castilian patriots who had gathered in the hills since the peace were no longer a band of malcontents. They were becoming a cause. A throne in Qurṭuba would sit in the middle of it.\n\nSo the crown offered a concession. For a time the *jizya*, the tax that the dhimmīs pay for the protection of the Muslim state, would not be collected. The Christians of the new lands would keep in their own purses what they had paid to Gharnāṭa every year since the peace. The *ʿulamāʾ* grumbled that the law of Allāh was not the sultan's to suspend, and that a tax forgiven to rebels is a reward for rebellion. The sultan heard them and did it anyway. But he told those closest to him that he doubted it would be enough. A man who hates his master, he said, does not love him more for being charged less.\n\n*And hold firmly to the rope of Allāh all together, and do not become divided.*"}, {"addr": "754-06-02", "slug": "0754-06-02-the-kingdom-of-ishbiliyya", "n": 32, "bn": 14, "hy": 754, "hm": 6, "hd": 2, "w": 1353, "title": "Of the So-Called Kingdom of Ishbīliya, and the Old Border Reaffirmed", "date": "1353-07-05", "dateStr": "5 July 1353", "hdateStr": "2 Jumādā al-Ākhira 754", "book": "book-of-balance", "people": ["yusuf-i", "alfonso-xi"], "places": ["ishbiliyya", "qurtuba", "jayyan", "qarmuna", "qusantina", "gharnata", "balansiyya", "sharish", "shaluqa-al-kubra"], "sources": ["1353-02-01-kingdom-of-sevilla", "1353-02-01-castile-answers", "1353-02-02-state", "1353-06-06-battle-jerez", "1353-06-27-battle-sanlucar-la-mayor", "1353-07-03-state", "1353-07-05-revolt-ends"], "words": 603, "catch": "The sultan had doubted that a remitted tax would buy a", "canon": 2, "body": "The sultan had doubted that a remitted tax would buy a loyal heart, and he was right. On the twenty-fifth of Dhū al-Ḥijja in the year 753, as the year ran out, the Castilian peasants of the new lands rose together. In [Ishbīliya](place:ishbiliyya) they proclaimed a kingdom of their own, which they called the Kingdom of Sevilla. In a single day every town won at the Peace of Qurṭuba, and the two bought in 752, went over to it. [Qurṭuba](place:qurtuba), Ishbīliya and [Jayyān](place:jayyan) were lost, and [Qarmūna](place:qarmuna) and the silver of [Qusanṭīna](place:qusantina) with them: twenty-five towns and three hundred and twenty-eight thousand souls. [Gharnāṭa](place:gharnata) woke to find itself what it had been before the war with the three crowns, eighteen towns in the mountains and on the sea.\n\nThen came the thing that made the court laugh in the middle of its fear. The rebels were Castilians who had risen against a Muslim lord. Yet the tyrant of Qashtāla, [Alfonso](person:alfonso-xi), did not march to help them. He marched against them, for Gharnāṭa was still his tributary in name, and a lord who will not defend his tributary will soon have none. The ṭāʾifas of [Balansiyya](place:balansiyya) and Mursiyya took the field beside us as well. But the laughter did not last long, for the dīwān saw the danger at once. If the Castilian host reached Ishbīliya first, it would not take the city back for Gharnāṭa. It would take the city back for Qashtāla, and the Peace of Qurṭuba would be undone by the very king who had sealed it.\n\nSo our lord [Yūsuf](person:yusuf-i) did not wait for his overlord. The rebels had taken the land, but they could not raise men to hold it, for the plague had emptied their villages as it had emptied ours. On the third of Jumādā al-Ūlā in the year 754 they gathered what they had, some four and a half thousand, and fell on the army of Gharnāṭa at [Sharīsh](place:sharish). They broke against it and left two thousand three hundred on the field. On the twenty-fourth of that month the sultan's horse caught their last army, two thousand men, at [Shalūqa al-Kubrā](place:shaluqa-al-kubra) on the road below Ishbīliya. Not one of them came away, and the sultan lost thirteen men. When the captives were brought before him, he had their wounds dressed before their names were written down, and said that a beaten man needs no further punishment to remember it.\n\nThe so-called kingdom had no army left, and its towns opened their gates. On the second of Jumādā al-Ākhira the revolt was ended. Qashtāla came to the peace with nothing in its hands, since Gharnāṭa had done the fighting, and it could only reaffirm the border it had sealed four years before. All twenty-five towns returned to the house of Naṣr. The realm was forty-three towns again, six hundred thousand souls, and fifty-five of the seventy-two towns of the Strait's three lands. Its sovereignty stood higher than it had ever stood in the reign.\n\nThe court praised the speed of the sultan's horse. Older men remembered how the revolt had begun. The Castilians of the valley had not been won by the remitted tax and would not be won by the victory. They had been beaten, and that is not the same thing. The sultan's thoughts of moving his throne to Qurṭuba were not abandoned. But no one now imagined it would be easy to sit there.\n\n*Perhaps you dislike a thing and it is good for you, and perhaps you love a thing and it is bad for you. And Allāh knows, while you know not.*"}, {"addr": "756-03-04", "slug": "0756-03-04-the-governor-and-the-harem", "n": 33, "bn": 15, "hy": 756, "hm": 3, "hd": 4, "w": 1355, "title": "Of the Governor of Qurṭuba, and the Brides from Across the Sea", "date": "1355-03-19", "dateStr": "19 March 1355", "hdateStr": "4 Rabīʿ al-Awwal 756", "book": "book-of-balance", "people": ["yusuf-i", "dua-marinid", "tizemt-hafsid", "sayyida-of-fezzan", "faraj-ibn-ismail", "fatiu-ghana", "shama-sahara", "aisha-bint-faraj", "yahya-rahhu"], "places": ["qurtuba", "gharnata", "ishbiliyya", "fas"], "sources": ["1354-03-01-royal-marriage-central-sahara", "1354-07-governor-begun", "1354-08-12-marinid-marriage", "1354-11-19-hafsid-marriage", "1355-ghana-marriage", "1355-yahya-council", "1355-powerful-harem", "1355-yahya-dies", "1355-dua-council", "1355-03-15-governor-qurtuba", "1355-03-19-calm", "1355-03-28-birth-aisha"], "words": 583, "catch": "The so-called kingdom had been beaten, but our lord Yūsuf knew", "canon": 2, "body": "The so-called kingdom had been beaten, but our lord [Yūsuf](person:yusuf-i) knew that the valley of the great river had not been won. A man who means to keep a valley must sit in it. So on the sixteenth of Jumādā al-Ākhira in the year 755 the masons began work on a governor's seat in [Qurṭuba](place:qurtuba), the old city of the Umayyads. The road from [Gharnāṭa](place:gharnata), built when Qurṭuba was the capital, still ran through the hills. For two hundred and fifty days the court's men rebuilt halls that had stood empty since the Castilians came. On the twenty-ninth of Ṣafar 756 the governor took his seat. From that day the crown's word went up and down the river as easily as the barges, as far as [Ishbīliya](place:ishbiliyya).\n\nWhile the masons worked, the sultan kept two promises made long before. On the twenty-second of Rajab 755 he married [Duʿāʾ](person:dua-marinid) of the house of [Fās](place:fas). She had been promised to him in the year of the war with the three crowns, and she was the one thread to Fās that had not been cut when Qashtāla made the Marīnids tear up their treaties. On the third of Dhū al-Qaʿda he married [Tizemt](person:tizemt-hafsid) of Tūnis. In three months two daughters of the Maghrib had come to the Alhambra to stand beside [Sayyida](person:sayyida-of-fezzan), the first wife. The harem grew, and with it a new kind of power. The *ḥarīm* had always been a household. Now it became a court within the court, full of women who had learned statecraft in the palaces of Fās and Tūnis, and their clients and their whispers. The nobles complained that power was flowing inward, to the throne and to the women around it, and no one at court troubled to deny it.\n\nNot every marriage went as the court intended. [Faraj](person:faraj-ibn-ismail), the sultan's elder brother and lately regent, married [Fatiu](person:fatiu-ghana), a princess of Ghāna, and went south across the desert to live at her father's court. The court said it was the harem's work: a brother who might have been a rival was now a guest at the edge of the world. He left behind in Gharnāṭa his first wife, [Shamʿa](person:shama-sahara), of a ruling house of the Sahara, whom he had married the spring before, and she was with child. Three months after he had gone she bore him a daughter, [ʿĀʾisha](person:aisha-bint-faraj). His seat in the dīwān went to [Yaḥyā Raḥḥū](person:yahya-rahhu), the Zanāta general who had led the Volunteers of the Faith against Arghūn. Yaḥyā sat there barely a month. On the fourth of Ṣafar he died of an illness, at fifty-four. The court called it a coincidence, and said so a little too often.\n\nTwenty days later the empty seat went to Duʿāʾ. She was the most capable of the sultan's wives, and the law of the harem now allowed a woman to sit in the council. The great houses watched a Marīnid princess take her place among the viziers and said nothing in public.\n\nBy Rabīʿ al-Awwal the fruit of all this was plain. The remitted tax and the new governor together had stopped a second Castilian rising before it began. The valley paid its dues, the crown's hold on it grew month by month, and for the first time since the Peace of Qurṭuba the sultan could look at the map without counting the towns he might lose.\n\n*And Allāh has made for you from yourselves mates and has made for you from your mates sons and grandchildren.*"}, {"addr": "758-07-12", "slug": "0758-07-12-roads-libraries-and-the-weavers", "n": 34, "bn": 1, "hy": 758, "hm": 7, "hd": 12, "w": 1357, "title": "Of Roads, Libraries, and the Charter of the Weavers", "date": "1357-07-01", "dateStr": "1 July 1357", "hdateStr": "12 Rajab 758", "book": "book-of-the-call", "people": ["yusuf-i"], "places": ["gharnata", "al-mariyya", "wadi-ash", "basta", "qurtuba", "jayyan", "ishbiliyya"], "sources": ["1356-06-09-textile-charter", "1356-10-roads", "1356-10-libraries", "1357-07-northern-madrasas"], "words": 506, "catch": "Read, in the name of your Lord who created. The first", "canon": 2, "body": "*Read, in the name of your Lord who created.* The first word Allāh sent down to His Prophet was not *fight* or *rule* but *read*. In the years after the pestilence and the Sevillan revolt, our lord [Yūsuf](person:yusuf-i) set out to make it the first word of his government as well.\n\nHe began, as a prudent prince does, with the wealth that would pay for it. On the ninth of Jumādā al-Ākhira 757 he granted a charter to the weavers of [Gharnāṭa](place:gharnata). For a generation the silk of the city had been carried to every market from Genoa to Tūnis, and now the guilds of the city had a law of their own and the protection of the crown. The looms of the Albayzín, which the plague had half emptied, filled again.\n\nIn Shawwāl the roads followed. Engineers cut new ways through the mountains: south from Gharnāṭa to [al-Mariyya](place:al-mariyya) and its harbour, and north-east to the saffron fields of [Wādī Āsh](place:wadi-ash) and [Basṭa](place:basta). Tracks that a mule could barely climb in winter became roads that carried carts in every season. Every road the sultan built to carry silk would also carry teachers.\n\nAt the same time the libraries rose, in Gharnāṭa first and then in the other cities of the south. These were not the treasure-houses of a prince, locked away for his own pleasure. They were rooms where any man who could read might sit and read. The sultan's purpose was plain, and he did not hide it. More than a hundred years under Qashtāla had stripped [Qurṭuba](place:qurtuba) and the valley of the great river of their faith and their language. The mosques had been made churches, the schools closed, and the books burned or carried north. The Peace of Qurṭuba had given back the land. The libraries were meant to give back the people.\n\nOn the twelfth of Rajab 758 the second part of the reform began. Madrasas were founded in the northern cities as well, in the lands won from Qashtāla, where [Jayyān](place:jayyan) and [Ishbīliya](place:ishbiliyya) had not heard the law taught for a century. The jurists who taught in them were paid from the treasury. They were told to teach the Book and the law to anyone who would listen, the sons of Christian farmers among them, and not to compel anyone. The ʿulamāʾ grumbled that teaching unbelievers was a strange use of the treasury. The sultan answered that the Prophet had freed captives at Badr for teaching ten Muslim children to read, and that he could at least pay for the same in reverse.\n\nThe court did not expect quick results, and it got none. In the year the northern madrasas opened, three in every ten souls in Qurṭuba were Muslims, the same as at the peace, and about one in ten in the valley around it. But a madrasa is not built for a year. It is built for a hundred.\n\n*Read, and your Lord is the most Generous, who taught by the pen, taught man that which he knew not.*"}, {"addr": "759-09-02", "slug": "0759-09-02-the-great-madrasa-of-qurtuba", "n": 35, "bn": 2, "hy": 759, "hm": 9, "hd": 2, "w": 1358, "title": "Of the Great Madrasa of Qurṭuba, and the Foreign Wisdom", "date": "1358-08-08", "dateStr": "8 August 1358", "hdateStr": "2 Ramaḍān 759", "book": "book-of-the-call", "people": ["yusuf-i", "saad-ibn-yusuf", "dua-marinid", "sayyida-of-fezzan", "ismail-ibn-yusuf", "jadila-bint-yusuf", "tizemt-hafsid", "ali-ibn-yusuf", "maryam-bint-yusuf", "fatima-bint-yusuf", "muhammad-ibn-yusuf"], "places": ["qurtuba", "fas", "jayyan", "gharnata", "istijja", "ishbiliyya", "malaqa", "urjuba"], "sources": ["1358-02-great-madrasa-qurtuba", "1358-08-08-foreign-wisdom", "1358-08-08-works"], "words": 561, "catch": "In Ṣafar of the year 759 the masons came to Qurṭuba", "canon": 2, "body": "In Ṣafar of the year 759 the masons came to [Qurṭuba](place:qurtuba) again, this time to build for Allāh and not for the governor. Beside the great mosque, which the Castilians had made a cathedral and which still stood as one, our lord [Yūsuf](person:yusuf-i) began a Great Madrasa. It was meant to be the largest college west of [Fās](place:fas). Qurṭuba's Muslims were few, perhaps three in ten, but there were more each year: converts from the Christian quarters, Andalusīs back from exile in the mountains, students drawn by the libraries. The old mosques of the city could no longer hold them, and the old learning of the city had no house. The Great Madrasa was to be both.\n\nNor was it the only work that year. By Ramaḍān the dīwān's register of works read like a census of the realm's ambitions. There was a madrasa rising in [Jayyān](place:jayyan) and a guild of spinners in [Gharnāṭa](place:gharnata). There were marketplaces in [Istijja](place:istijja), [Ishbīliya](place:ishbiliyya) and [Mālaqa](place:malaqa), and a road of gravel to [Yuz Aryuba](place:urjuba). The dīwān paid for its new clerks out of the crown's own coffers, so that no estate could claim to own them. The sultan's son [Saʿd](person:saad-ibn-yusuf), ten years old that year, was allowed to sit at the foot of the table when the register was read. His tutors wrote that he asked of every work not what it would cost but what it would bring in, and how soon.\n\nThe mind behind much of this sat in the dīwān and not on the throne. [Duʿāʾ](person:dua-marinid), the Marīnid wife who had taken a seat in the council in 756, had become the most talked-about minister in the realm. She had grown up in the palaces of Fās and had seen how the Marīnids ran their colleges and their chanceries. She brought those methods to Gharnāṭa: the endowments that paid for the madrasas, the registers that counted their students, and the habit of asking what a thing cost before praising it. Scholars and merchants praised her for the fresh air she brought into a court that had grown stale in the lean years. The nobles were troubled. A foreigner, a woman and a Marīnid sat at the sultan's right hand, and they did not like any of the three. They muttered it to each other, and once, unwisely, to the sultan. He told them that the Prophet's wife Khadīja had been a merchant and his wife ʿĀʾisha a scholar, and asked which of them they would have advised him against.\n\nThe harem that had brought Duʿāʾ to the council had filled by then, as the women of the palace had foretold at Saʿd's birth, though not with sons alone. [Sayyida](person:sayyida-of-fezzan) had borne the sultan [Ismāʿīl](person:ismail-ibn-yusuf) and [Jadīla](person:jadila-bint-yusuf). [Tizemt](person:tizemt-hafsid) had borne him [ʿAlī](person:ali-ibn-yusuf), [Maryam](person:maryam-bint-yusuf) and [Fāṭima](person:fatima-bint-yusuf). Duʿāʾ had borne him a son, [Muḥammad](person:muhammad-ibn-yusuf), a sickly child, and lost him that spring when he was barely two. The nurses said that little Maryam was as quick as Saʿd had been at her age.\n\nThe Great Madrasa took years to finish, as such houses do. But from the year it was begun the call to prayer was heard more often in Qurṭuba. By the year the War of Independence began, nearly four in ten of the city's people were Muslims.\n\n*Allāh raises those who have believed among you and those who were given knowledge, by degrees.*"}, {"addr": "763-10-07", "slug": "0763-10-07-the-marinid-demand", "n": 36, "bn": 16, "hy": 763, "hm": 10, "hd": 7, "w": 1362, "title": "Of the Marīnid Demand, and the Peace Bought with a Warning", "date": "1362-07-30", "dateStr": "30 July 1362", "hdateStr": "7 Shawwāl 763", "book": "book-of-balance", "people": ["yusuf-i", "ismail-ibn-ismail", "sayyida-of-fezzan", "khalid-ibn-yahya", "aisha-bint-yusuf", "saad-ibn-yusuf", "tizemt-hafsid", "umm-al-fath-bint-yusuf"], "places": ["gharnata", "qurtuba", "fas", "tilimsan", "al-mariyya", "sharish", "ishbiliyya", "qadis", "walba", "balansiyya"], "sources": ["1354-03-16-betrothal-aydinids", "1359-03-15-castile-aragon-war", "1359-ismail-to-aydin", "1359-04-khalid-council", "1359-07-01-funduq", "1360-06-26-state", "1360-06-26-marinid-war", "1360-06-26-chance-lost", "1360-11-07-battle-almeria", "1360-11-14-diwan-al-mustakhlas", "1361-02-03-marinid-landings", "1361-03-23-battle-jerez", "1361-12-13-battle-sevilla", "1362-04-08-battle-sevilla", "1362-06-10-state", "1362-07-30-white-peace-morocco"], "words": 809, "catch": "For twenty years the court had worked to set the Christian", "canon": 2, "body": "For twenty years the court had worked to set the Christian crowns against one another. In Rabīʿ al-Thānī of the year 760 the work bore fruit. Qashtāla and Portugal marched east together into Arghūn, and Arghūn called Savoy and Sicily to its side. The dīwān counted the dead of that war as the reports came in, ten thousand Castilians and thirty thousand Portuguese, and began to speak openly of independence. [Gharnāṭa](place:gharnata) was still Qashtāla's tributary in name. If the Christians bled each other white, it would strike for its freedom.\n\nThe house of Naṣr lost another prince to a foreign court that spring. [Ismāʿīl ibn Ismāʿīl](person:ismail-ibn-ismail), the sultan's brother, married the bride of the house of Aydīn promised to him five years before, and went east to live in her father's palace in Anatolia. As with Faraj, the harem was blamed for it. The sultan would have given his brother's seat to [Sayyida](person:sayyida-of-fezzan), his first wife, but it was not to be. It went to [Khālid](person:khalid-ibn-yahya), son of the late Yaḥyā Raḥḥū. He was sixteen years old and one of the ablest men the court had seen in a generation.\n\nThat summer the merchants, the Italians above all, who carried the better part of the realm's trade, pressed the sultan for a walled inn where their wares might lie under lock and their factors sleep under guard. He built them a *funduq* beside the silk market and chose the ground for it himself. The burghers were delighted, and the trade of Gharnāṭa and [Qurṭuba](place:qurtuba) ran more freely through its gates. In the winter Sayyida bore the sultan another daughter, [ʿĀʾisha](person:aisha-bint-yusuf).\n\nThen [Fās](place:fas) spoiled everything. On the tenth of Shaʿbān 761, with the friendship between the two courts at its warmest, the Marīnid sultan declared war on Gharnāṭa to demand its submission as his subject. [Tilimsān](place:tilimsan), Tāfīlālt and Tuwāt marched with him. The court could hardly believe it. The ambassadors had been feasted in Fās that very spring. But a sultan who sees two crowns exhausted and a third alone does not care what his ambassadors ate. By the reckoning of the dīwān that very day, Gharnāṭa had never been so wholly its own master, and Qashtāla's overlordship had shrunk to a word on parchment. Fās had chosen that day to demand that it become a subject. Qashtāla, as Gharnāṭa's overlord, came into the war to defend it. The bitterest men at court said that the great chance had been thrown away. Instead of striking at an exhausted Qashtāla, Gharnāṭa would spend its men holding off the Marīnids until Qashtāla recovered.\n\nThe Marīnids found the shore of al-Andalus harder to hold than their fleet had promised. The first landing, two thousand men of Tilimsān at [al-Mariyya](place:al-mariyya), was thrown back into the sea by ten thousand Granadans on the twenty-sixth of Dhū al-Ḥijja. A week later, in the first days of 762, the sultan founded the Dīwān al-Mustakhlaṣ to keep his private domain, the estates, mills and revenues set apart from the public treasury to pay for the court and al-Ḥamrāʾ. It grew out of the harem's widening hand in the palace. The burghers liked it, and the nobles did not. At [Sharīsh](place:sharish), in Jumādā al-Ūlā 762, the Marīnids attacked an army four times their number and left fifteen hundred dead. Twice before [Ishbīliya](place:ishbiliyya) they broke themselves on the sultan's lines. Elsewhere they did as they pleased. They landed at [Qādis](place:qadis) and on the coast of [Walba](place:walba), and their horsemen rode through Qashtāla as far as El Escorial and Cáceres, breaking every Castilian army they met. Their fleets ruled the sea.\n\nSo in the summer of 763 our lord sent a message to Fās, and it was not a plea. If Gharnāṭa threw its full weight into this war, he wrote, Fās would lose it. If Gharnāṭa stood aside, Fās would very likely beat Qashtāla. The young [Saʿd](person:saad-ibn-yusuf), fourteen that summer, sat at his father's side while the letter was drafted. He asked only how many men the Marīnids had lost on this shore. When he was told more than six thousand, he said that the number was the letter and the rest was courtesy. The Marīnids understood. On the seventh of Shawwāl they granted a white peace and promised to respect the lands of Gharnāṭa. Qashtāla was left to fight on alone. The ṭāʾifas of [Balansiyya](place:balansiyya) and Mursiyya had been kept out of the war entirely, and they would come untouched to the war that the court still meant to fight.\n\nThree weeks before the peace [Tizemt](person:tizemt-hafsid) had borne the sultan a daughter, and he had named her [Umm al-Fatḥ](person:umm-al-fath-bint-yusuf), the mother of victory. The court took the name for an omen.\n\n*So do not weaken and call for peace while you are superior; and Allāh is with you and will never deprive you of the reward of your deeds.*"}, {"addr": "764-10-19", "slug": "0764-10-19-the-death-of-al-hajj-yusuf", "n": 37, "bn": 17, "hy": 764, "hm": 10, "hd": 19, "w": 1363, "title": "Of the March into the West, and the Death of al-Ḥājj Yūsuf", "date": "1363-08-01", "dateStr": "1 August 1363", "hdateStr": "19 Shawwāl 764", "book": "book-of-balance", "people": ["yusuf-i", "saad-ibn-yusuf", "nasr-al-istijji", "dua-marinid"], "places": ["ayamunt", "tulaytula", "balansiyya", "mursiyya", "fas", "qurtuba", "istijja"], "sources": ["1362-11-01-qasr-al-riyad", "1363-05-20-war-of-independence", "1363-05-20-state", "1363-05-20-portugal-first", "1363-05-20-taifas-untouched", "1363-07-27-aragon-joins", "1363-08-01-death-yusuf", "1363-08-01-saad-succeeds", "1363-08-dua-marries-nasr", "1363-08-02-state"], "words": 493, "catch": "On the fifth of Shaʿbān in the year 764, the truce", "canon": 2, "body": "On the fifth of Shaʿbān in the year 764, the truce with Qashtāla ran out, and our lord [Yūsuf](person:yusuf-i) did not wait an hour longer. He had a just cause, and he had the ṭāʾifas of [Balansiyya](place:balansiyya) and [Mursiyya](place:mursiyya), whole and untouched. He also had a rival who could barely stand. The Marīnids held fifty-eight Castilian towns, as far as [Ṭulayṭula](place:tulaytula) itself, and the tyrant of Qashtāla had fewer than two hundred men left to call up. The treasury held fifty-seven dīnārs. The sultan said that a war for freedom is not fought with what is in the treasury, and he marched north.\n\nHis plan was simple. Portugal had made its own peace with [Fās](place:fas) and its army was whole, so Portugal would be knocked out first, before it could join the others. The army went west through the hills toward the Guadiana. In Shawwāl came word that Arghūn had joined Qashtāla. A year earlier the two had been at war with each other.\n\nThe sultan never reached Portugal. On the nineteenth of Shawwāl, at [Ayamūnt](place:ayamunt) where the Guadiana meets the sea, al-Ḥājj Yūsuf died on the march, ten weeks into the war he had waited thirty years to fight. He was forty-five. The physicians spoke of the heat of the road and a fever that came on in the night. The soldiers said only that he had gone to Allāh with his face turned toward the enemy, and they asked for nothing better for themselves.\n\nConsider what he left. He came to the throne at fifteen, lord of eighteen towns in the mountains, tributary to Qashtāla and in debt to his own estates. He left forty-three towns, the valley of the great river and [Qurṭuba](place:qurtuba) of the caliphs, a treasury that had once been free of debt, and a sovereignty the court reckoned complete. He had made the pilgrimage and fed the poor of Makka. He had outlived the pestilence. In his last year he had begun the Qaṣr al-Riyāḍ al-Saʿīd in the heart of the Alhambra, with its lions and its vaults of muqarnas, so that the house of Naṣr would have a palace worthy of what it had become. He did not live to see it finished.\n\nHis son [Saʿd](person:saad-ibn-yusuf) was fifteen, the same age his father had been, and the court said there was no child like him in all of Islam. But he could not rule until he came of age in Rabīʿ al-Thānī. The dīwān named a regent, [Naṣr al-Istijjī](person:nasr-al-istijji), a noble of the house of [Istijja](place:istijja). He was a man of no great gifts, chosen perhaps because no one feared him. Within days of the burial he had married [Duʿāʾ](person:dua-marinid), the late sultan's Marīnid widow and minister. The court noticed. The army, still in the field, went on without its sultan, and the treasury held twenty-four dīnārs.\n\n*Every soul will taste death, and you will only be given your full reward on the Day of Resurrection.*"}, {"addr": "765-08-16", "slug": "0765-08-16-the-regent-who-did-not-last", "n": 38, "bn": 18, "hy": 765, "hm": 8, "hd": 16, "w": 1364, "title": "Of the Regent Who Did Not Last, and the Sultan's Second Wife", "date": "1364-05-19", "dateStr": "19 May 1364", "hdateStr": "16 Shaʿbān 765", "book": "book-of-balance", "people": ["saad-ibn-yusuf", "nasr-al-istijji", "dua-marinid", "aiman-mamluk", "yusuf-i"], "places": ["gharnata", "ishbiliyya", "qurtuba", "balansiyya"], "sources": ["1364-01-18-saad-of-age", "1364-01-18-death-nasr", "1364-01-saad-marries-dua", "1364-03-01-battle-canete", "1364-04-05-battle-castellon", "1364-05-19-ulama-displeased", "1364-05-19-jamaa-summoned"], "words": 531, "catch": "On the twelfth of Rabīʿ al-Thānī in the year 765 our", "canon": 2, "body": "On the twelfth of Rabīʿ al-Thānī in the year 765 our lord [Saʿd](person:saad-ibn-yusuf) turned sixteen and took the government of the realm into his own hands. The regency of [Naṣr al-Istijjī](person:nasr-al-istijji) ended that morning, and so, by evening, did Naṣr. The court gave out that he had died of a sickness. The huntsmen who had ridden out with him told a different story, of a fall in the hills and a horse that came home without its rider, and were told to stop telling it. The chronicler writes down both and judges neither. Allāh knows best.\n\nWithin days the young sultan made his choice of a second wife. He had one already, [Aiman](person:aiman-mamluk), daughter of the Mamlūk sultan, promised to him when he was three and married to him before his majority. But a sultan of al-Andalus needs the Maghrib as well as Egypt, and there was a Marīnid princess in his own palace. So Saʿd married [Duʿāʾ](person:dua-marinid): twice widowed, ten years his elder, the most capable mind in the dīwān, and the widow of his father.\n\nThe ʿulamāʾ were outraged, and they were right to be. The Book is plain on it: *do not marry those women whom your fathers married.* The jurists of [Gharnāṭa](place:gharnata) said so from the pulpit of the great mosque, and the jurists of [Qurṭuba](place:qurtuba) said it more loudly still. Men who had loved [al-Ḥājj Yūsuf](person:yusuf-i) said that his son had married his stepmother before the earth on his grave had settled. In the souks they said worse: that it was Duʿāʾ, not the boy, who had arranged it, and that a regent's fall from his horse had cleared the way for her. By the middle of Shaʿbān the ʿulamāʾ were nearer to open defiance of the throne than they had been in a generation. In the middle of a war that was a danger, not just a scandal.\n\nMeanwhile the war went badly in the east. On the twenty-sixth of Jumādā al-Ūlā the Portuguese, whom the dead sultan had marched west to find, appeared instead at Cañete and broke the host of [Balansiyya](place:balansiyya). In Rajab the ṭāʾifas attacked the joined armies of Portugal and Arghūn at Castellón and were thrown back.\n\nThe young sultan proved his gifts first in the council, not on the field. He summoned the Jamāʿa and gave the ʿulamāʾ what they had wanted for twelve years. The tax on the dhimmīs, remitted since 753 to quiet the Castilians of the valley, would be collected again. A new campaign of conversion would be preached in Qurṭuba and [Ishbīliya](place:ishbiliyya) and every town the crown held. The jurists took the bargain. They did not forgive the marriage, but they stopped preaching against it. The Christians of the valley would pay for the sultan's peace with his clergy, as subjects so often pay for their rulers' sins. The old men of the court noted that a prince of sixteen had struck his first bargain with the ʿulamāʾ in the open, before the Jamāʿa, with the price written into the registers for any man to read. They noted too whose money paid it.\n\n*Allāh wants to lighten for you your difficulties; and mankind was created weak.*"}, {"addr": "765-12-13", "slug": "0765-12-13-zafra-and-the-walls-of-lisbon", "n": 39, "bn": 19, "hy": 765, "hm": 12, "hd": 13, "w": 1364, "title": "Of Zafra and the Walls of al-Ushbūna, and the Peace with Portugal", "date": "1364-09-11", "dateStr": "11 September 1364", "hdateStr": "13 Dhū al-Ḥijja 765", "book": "book-of-balance", "people": ["saad-ibn-yusuf", "murad"], "places": ["gharnata", "al-ushbuna", "balansiyya", "shilb", "ukshunuba", "baja", "mursiyya"], "sources": ["1364-08-03-battle-zafra", "1364-09-10-battle-lisbon", "1364-09-11-battle-lisbon", "1364-09-11-peace-portugal", "1364-09-11-state"], "words": 528, "catch": "Al-Ḥājj Yūsuf had marched to knock Portugal out of the war,", "canon": 2, "body": "Al-Ḥājj Yūsuf had marched to knock Portugal out of the war, and his son [Saʿd](person:saad-ibn-yusuf) kept to the plan. In the summer of 765 the army of [Gharnāṭa](place:gharnata) went deep into Portugal and laid siege to [al-Ushbūna](place:al-ushbuna) itself. But the Portuguese army was not there. It had gone east to join the host of Arghūn, and together they were burning their way through the lands of the ṭāʾifas. So the army left a screen before the walls and marched east, under a general named [Murād](person:murad). He was a quiet man who kept his own company, and he planned every attack as carefully as a merchant counts his coin. He chased the joined host halfway across Iberia.\n\nHe caught them on the fourth of Dhū al-Qaʿda
