aqusta", "balansiyya", "shalba", "barshaluna", "gharnata", "fas"], "sources": ["1371-03-01-reconquest-claim-ready", "1375-06-05-war-on-castile", "1375-06-05-rome-and-lisbon", "1375-12-12-catalans-ambushed", "1376-01-14-battle-xelva", "1376-01-14-second-levy", "1376-01-14-envoys-to-fas", "1376-01-14-jadila-married"], "words": 763, "catch": "The truce with Qashtāla ran out on 4 Muḥarram 777, and", "canon": 3, "body": "The truce with Qashtāla ran out on 4 Muḥarram 777, and the Emperor [Saʿd](person:saad-ibn-yusuf) did not let a day of the new year pass. Beyond the Pyrenees the French were pushing the English into the sea. Once they had finished, the Pope at Avignon would rally them against al-Andalus, and every advance the Emperor made after that would be blunted by French lances. *We cannot afford to wait*, he told the dīwān. War was declared on Qashtāla that day. The claim the dīwān had drawn up four years before reached to all the peninsula the Christians had taken, but the heralds proclaimed the war as the Aragonese restoration. [Saraqusṭa](place:saraqusta) and the heart of old Arghūn, from Jaca to Teruel, lay in Castilian hands, and the renewed kingdom had a right to them.\n\nA levy was laid on the nobles and on the ṭāʾifas, in gold and in men. The treasury, which had held two hundred and eighty-six dīnārs in Shawwāl, held fifteen hundred and seventy-nine by the declaration. Al-Ushbūna and Avignon answered the Castilian call: al-Burtughāl, whose king was also king of Qashtāla, and the Pope with his vassals of Faenza and Siena. Miṣr answered ours, and the four ṭāʾifas marched beside the Emperor. At the declaration he had three thousand three hundred regulars under arms, and the Castilian king had seventeen hundred and fifty. Nobody had yet called out the levies.\n\nThey were called out over the summer and autumn. The campaign opened in the east in Rajab. The ḥājib [Francesc](person:francesc-de-montsoriu) had brought six thousand Catalans and Algarvians to the outskirts of [Balansiyya](place:balansiyya), and on 17 Rajab, at [Shalba](place:shalba) in the hills behind the coast, the Castilian general [Alfonso de Oñate](person:alfonso-de-onate) fell on them with nearly twenty-five thousand. The Emperor was marching to them with ten thousand five hundred, and Balansiyya's levies with him, but the Catalans did not hold until he came. They lost three thousand two hundred men to Qashtāla's eight hundred and sixty and broke for the coast.\n\nThat left the Emperor facing Oñate's whole army on Oñate's chosen ground: hills, forest and a river, everything that hobbles horse and favours the defender. Retreat would give up the country around Balansiyya. On 18 Rajab he gave battle, thirteen thousand eight hundred against twenty-three thousand nine hundred.\n\nIt went on for a month, into Shaʿbān. The Emperor did what the Andalusī horse had always done. He threw his cavalry at both Castilian flanks to sweep them away before the weight of the Castilian foot could tell. On the open plain before [Barshalūna](place:barshaluna) two years earlier that had won the day. In the broken country of Shalba the horse could not close the jaws fast enough. The centre held, by a thread, through weeks of grinding, while the wings were worn down against twice their numbers. On 20 Shaʿbān the Emperor drew off what was left. He had lost eight thousand one hundred and seventy men, against seven thousand five hundred and twenty of Oñate's. Qashtāla had lost nearly as many as he had, and it could spare them; he could not. The old soldiers said it was the price of fighting on unsuitable ground, and the Emperor did not argue with them.\n\nHe levied two thousand more men from the nobles, and he listened to [Duʿāʾ](person:dua-marinid). Since the last war there had been a warm silence between [Gharnāṭa](place:gharnata) and [Fās](place:fas). It was not hostile, but on our side it was distrustful. The Marīnids had courted Gharnāṭa and then stabbed it in the back the moment they could, and the court had a long memory. Duʿāʾ argued that the time had come to renew the alliance all the same. The dīwān's clerks had grown with the realm and could carry the embassy, she said, and it would be months before the first Mamlūk army could reach Iberia. There was a bond now as well. [Abū ʿInān](person:abu-inan-faris)'s heir, [Abū al-Faḍl](person:abu-al-fadl-marinid), had lately married the Emperor's sister [Jadīla](person:jadila-bint-yusuf). Between Jadīla and Duʿāʾ there was enough to open a dialogue between what had once been good friends.\n\nThe envoys rode for Fās, and a pact was offered. On 22 Shaʿbān the alliance was signed. Fās had a truce with Qashtāla that would not end until the autumn of the year after next, so it could not join the war before then. Its envoys swore it would help when it could. The Emperor's council was not sure their word was worth believing.\n\n*If a wound has touched you, a wound like it has touched the others. These are the days We alternate among the people.*"}, {"addr": "778-04-15", "slug": "0778-04-15-of-the-mercenaries-and-the-slaughter-at-agramunt", "n": 57, "bn": 9, "hy": 778, "hm": 4, "hd": 15, "w": 1376, "title": "Of Defeat in Detail, the Mercenaries of the Marches, and the Slaughter at Agramunt", "date": "1376-09-01", "dateStr": "1 September 1376", "hdateStr": "15 Rabīʿ al-Thānī 778", "book": "book-of-the-marches", "people": ["francesc-de-montsoriu", "saad-ibn-yusuf", "abu-inan-faris", "dua-marinid", "alfonso-de-onate", "bolot-mamluk"], "places": ["shalba", "barshaluna", "gharnata", "jarunda", "fas"], "sources": ["1376-01-21-catalans-destroyed-at-barcelona", "1376-03-01-battle-cape-ben-sakka", "1376-05-25-battle-girona", "1376-06-12-second-battle-girona", "1376-06-mercenaries-and-the-faithful", "1376-08-moroccan-gift", "1376-09-01-battle-agramunt", "1376-12-catalan-shipwrights"], "words": 726, "catch": "The spring of 777 was the worst of the war. A", "canon": 3, "body": "The spring of 777 was the worst of the war. A week after [Shalba](place:shalba), the Pope at Avignon put two thousand men ashore on the Catalan coast. On 27 Shaʿbān they caught the Catalans of [Francesc](person:francesc-de-montsoriu) who had escaped Shalba, two thousand five hundred and sixty-seven of them, before the walls of [Barshalūna](place:barshaluna), and killed or took every one without losing a man. On 8 Shawwāl, off Cape Ben Sakka on the coast of Ifrīqiya, the fleets of al-Burtughāl and Qashtāla, twenty-eight sail under the Portuguese admiral Rafael Araújo, found the Catalan fleet of twenty and sank or took nineteen. After that the sea belonged to the Iberians. By the spring a Castilian army had Barshalūna itself under siege, the war was going plainly against us, and men in the markets of [Gharnāṭa](place:gharnata) asked one another whether the Emperor [Saʿd](person:saad-ibn-yusuf) had overreached.\n\nThe Emperor had an answer, and he gave it a soldier's name: *defeat in detail.* The enemy had more men, but they were scattered across the Peninsula, landed in pieces and marching in pieces. He meant to meet each piece alone. The Pope's army was the first. In Muḥarram 778 the Emperor came on it before [Jarunda](place:jarunda), eight thousand four hundred against two thousand nine hundred, and in a day two thousand two hundred and fifty-two of the Pope's men were lost for two hundred and thirty-four of ours. The court called the papal landing a foolish venture, and nobody defended it. Eighteen days later the men of Siena followed their master's footsteps to the same field. Fifteen hundred and fifty-eight came against the Emperor, and every one of them fell, for one hundred and one of ours.\n\nThat cleared the north of the Pope's men. It did not lift the siege of Barshalūna. For that the Emperor went back to a remedy the house of Naṣr had used in its first war, nearly forty years before: mercenaries and the faithful. He raised more than seven thousand veterans from the Marches, hard men who had fought on the frontier all their lives and would fight wherever they were paid. They were expensive. The treasury paid out seventy dīnārs a month more than it took in. Then help came from an unexpected quarter. [Abū ʿInān](person:abu-inan-faris) of [Fās](place:fas), who could not join the war while his truce held, sent a gift of gold into the Emperor's treasury, freely given. The councillors who had doubted his word found that [Duʿāʾ](person:dua-marinid) had been right about her own house, and she let them find it without any help from her.\n\nIn Rabīʿ al-Awwal the Emperor brought fifteen thousand men, the veterans of the Marches at their heart, against [Alfonso de Oñate](person:alfonso-de-onate) in the Catalan plain at Agramunt. Oñate had nineteen thousand Castilians and papal troops, and he had beaten the Emperor at Shalba. This time the ground was open. The Emperor's heavy foot held the centre, and his horse had room to work. They fought for a fortnight. When it ended on 15 Rabīʿ al-Thānī, twelve thousand seven hundred of Oñate's men were dead or scattered, against two thousand eight hundred and thirty-nine of ours. It was not a victory, the soldiers said; it was a slaughter. A war that had looked all but lost when the battle began was in the balance again, though the balance still leaned against us.\n\nThere was still the sea. The armies of Miṣr, tens of thousands of them, waited on the far shore because the Mamlūks had almost no ships, and the Iberian fleets would sink anything they sent. *This will not do*, the Emperor said. In Rajab 778 the crown sent Catalan shipwrights east, to five ports of the Mamlūk sultan [Būlād](person:bolot-mamluk): al-Iskandariyya, Dimyāṭ, ʿAkkā, Anṭākiya and Ṭarsūs. They were to build proper shipbuilding wharves there with the Mamlūks' coin, and to teach the Egyptians to build galleys of the new Catalan kind. The plan was the Emperor's own, and so was the reckoning behind it: the Mamlūks would pay for the wharves, and the sea would be cleared at little cost to the treasury of al-Andalus. By the next winter the Mamlūks had twenty-two ships, where eighteen months before they had had one.\n\n*And prepare against them whatever you are able of power and of steeds of war, by which you may terrify the enemy of Allāh and your enemy.*"}, {"addr": "779-12-07", "slug": "0779-12-07-of-saraqusta-and-the-peace-of-the-restoration", "n": 58, "bn": 10, "hy": 779, "hm": 12, "hd": 7, "w": 1378, "title": "Of Saraqusṭa, the Day of Shalūqa, and the Peace of the Restoration", "date": "1378-04-06", "dateStr": "6 April 1378", "hdateStr": "7 Dhū al-Ḥijja 779", "book": "book-of-the-marches", "people": ["saad-ibn-yusuf", "abu-inan-faris", "jeronimo-of-castile", "alfons-de-borja", "sayyida-of-fezzan"], "places": ["saraqusta", "qalat-ayyub", "fas", "barshaluna", "tilimsan", "ishbiliyya", "shaluqa-al-kubra", "al-ushbuna", "tulaytula", "batalyaws", "marida", "gharnata", "qurtuba"], "sources": ["1378-04-06-castles-razed", "1377-01-31-battle-zaragoza", "1377-06-13-battle-calatayud", "1377-09-30-morocco-joins", "1377-10-19-battle-cape-sao-vicente", "1377-11-04-battle-bay-setubal", "1378-01-17-battle-shaluqa", "1378-04-06-peace-castile", "1378-04-06-sayyida-diplomacy", "1378-05-khilafat-qurtuba-renewed", "1378-07-09-tunis-marriage"], "words": 955, "catch": "Qashtāla raised another army over the winter, and the Emperor Saʿd", "canon": 3, "body": "Qashtāla raised another army over the winter, and the Emperor [Saʿd](person:saad-ibn-yusuf) went to meet it in the country it was fighting for. On 20 Ramaḍān 778 he found it before [Saraqusṭa](place:saraqusta) on the Ebro, the old capital of the Upper March, which no Muslim army had seen for two hundred and fifty years. The Castilians were led now by Alfonso Yáñez, a capable administrator but no great general, and they numbered seven thousand four hundred, with the Pope's men among them. The Emperor had thirteen thousand two hundred. Five thousand six hundred and seventy-five of theirs fell or fled, for seven hundred and five of ours. In Ṣafar 779 he caught the last of that army at [Qalʿat Ayyūb](place:qalat-ayyub) on the Jalón, the fortress of Ayyūb, and destroyed it: two thousand and twenty-nine of theirs against three hundred and eighty-five of ours. Qashtāla had no field army left, and the war ran in our favour again. The Emperor turned his attention west, to the Portuguese.\n\nThe Marīnids kept their word. On 26 Jumādā al-Ūlā 779, the day their truce with Qashtāla ended, the court asked [Fās](place:fas) to join the war, and [Abū ʿInān](person:abu-inan-faris) answered with a call to arms. Three weeks later the fleet of Fās, eighteen sail under Abū Ḥammū, met five Castilian ships off Cape São Vicente and sent all five to the bottom without losing one. The Iberian fleets still had teeth. They sank the last ship of [Barshalūna](place:barshaluna) in the bay of Setúbal and three ships of [Tilimsān](place:tilimsan), Fās's vassal, off Cape Mondego. But they were no longer alone on the sea, and the ships of Fās began to clear a path through it.\n\nIn Ramaḍān the Portuguese came down out of the west on [Ishbīliya](place:ishbiliyya), eleven thousand three hundred of them, while another of the Emperor's armies lay before Valladolid in the heart of Qashtāla. The Emperor met them at [Shalūqa al-Kubrā](place:shaluqa-al-kubra), on the edge of the greatest city of the realm, with ten thousand three hundred. For ten days he stood with the heavy foot of the centre, slept on the ground among them and kept the fast as they kept it, and the soldiers said afterwards that wherever the line thinned, his banner was there. The battle ended on the seventeenth of Ramaḍān, the day of Badr, and the army knew it. Eight thousand three hundred and forty-three Portuguese were lost to their king, against one thousand and sixty-nine of ours, and the rest were driven back across the border. After that day the Iberians could no longer hope to win the war, only to end it.\n\nBy Dhū al-Ḥijja Valladolid was weeks from falling. The Emperor's army was marching on [al-Ushbūna](place:al-ushbuna). The fleet of Fās had cleared the sea, and the first Mamlūk army, carried, the court said, in galleys from the new wharves, lay off the coast of Tūnis. The Emperor's envoys went to [Jerónimo](person:jeronimo-of-castile), king of Qashtāla and al-Burtughāl, with the offer the king of Arghūn had been given three years before: peace, or blood. The Iberians knew when they were beaten. On 7 Dhū al-Ḥijja 779, two days before the pilgrims stood at ʿArafa, they chose peace.\n\nThe heartland of Arghūn, twenty-four towns from Jaca under the Pyrenees to Teruel, with Saraqusṭa, Huesca and Qalʿat Ayyūb, was restored to the renewed kingdom of [Alfons](person:alfons-de-borja), whose six towns became thirty. The Upper March had its capital again, and the war had earned its name. To the crown itself passed forty-six towns of the Middle and Lower Marches: [Ṭulayṭula](place:tulaytula), the old capital of the Visigoths and of a ṭāʾifa of our own faith, with Ṭalabayra and the towns of La Mancha, and in the west [Baṭalyaws](place:batalyaws), [Mārida](place:marida), Turjāla and the hills of the Guadiana. Four hundred thousand souls came with them, nearly all Castilian and Christian. Qashtāla paid reparations besides, and razed seven of its own castles, at León, Zamora, Valladolid, Segovia, Cuenca, Pamplona and Laguardia, so that the road to its heart would lie open if it ever broke the peace. It had held two hundred and twenty-nine towns when the war began and now held one hundred and fifty-nine.\n\nSeven years earlier our lord Saʿd had unrolled the great map of the caliphs from the treasury of [Gharnāṭa](place:gharnata) and looked at its three red lines, the thughūr. Now every one of them lay within the realm of al-Andalus or of its ṭāʾifas: the Upper March of Saraqusṭa, the Middle March of Ṭulayṭula, the Lower March of Baṭalyaws and Mārida. The cost was written in the dīwān's ledgers. Nineteen thousand two hundred and fifty-six of our side had fallen in the field, and forty-one thousand one hundred and twenty-one of theirs. The truce would hold for fifteen years.\n\nThe Emperor meant the peace to be used. A month before it was sealed his mother [Sayyida](person:sayyida-of-fezzan) had left the work of the new towns for the embassies of the realm. In the months after it the scholars set to work at his command on the renewal of the caliphate of [Qurṭuba](place:qurtuba): the ceremonial of ʿAbd al-Raḥmān III, a throne hall in a rebuilt Madīnat al-Zahrāʾ, robes of ṭirāz with the regnal year worked in gold thread, and dīnārs struck from the gold of the Land of the Blacks. With it went a covenant setting down in writing what the Christians and Jews of the realm owed and what they were owed. He wanted it written, he said, so that no governor could take from a dhimmī a dirham more than the law allowed. In the summer a royal marriage bound al-Andalus to the Ḥafṣids of Tūnis.\n\n*And another favour that you love: victory from Allāh and an imminent conquest; and give good tidings to the believers.*"}, {"addr": "780-01-02", "slug": "0780-01-02-of-tulaytula-and-the-count-of-the-christians", "n": 59, "bn": 7, "hy": 780, "hm": 1, "hd": 2, "w": 1378, "title": "Of Ṭulayṭula, the Gem of Iberia, and the Count of the Christians", "date": "1378-05-01", "dateStr": "1 May 1378", "hdateStr": "2 Muḥarram 780", "book": "book-of-the-call", "people": ["saad-ibn-yusuf"], "places": ["tulaytula", "qurtuba", "mursiyya", "gharnata"], "sources": ["1378-05-01-gem-of-iberia", "1378-05-count-of-the-christians", "1378-05-khilafat-qurtuba-renewed", "1378-05-governor-of-tulaytula", "1378-05-silk-of-gharnata", "1378-04-06-peace-castile"], "words": 697, "catch": "The year 780 opened with the Emperor in Ṭulayṭula. The city", "canon": 3, "body": "The year 780 opened with the Emperor in [Ṭulayṭula](place:tulaytula). The city stands on its rock in a bend of the Tagus at the centre of Iberia. It had been the capital of the Visigoths, then a city of Islam for three hundred and seventy years, and the seat of a ṭāʾifa king of our own faith, before Alfonso of Qashtāla took it in the year 478. For three centuries since, Christians, Muslims and Jews had lived in it side by side, more or less, and scholars of all three had sat in its libraries putting the books of the Arabs into Latin. Now it was the Emperor's again. Twenty-nine thousand souls lived in it, nearly all of them Christian.\n\nThe court did not mean to hold it as a conquered city. On 2 Muḥarram 780 the Emperor declared that Ṭulayṭula would become the gem of Iberia, and every estate was set to the work: the ʿulamāʾ, the nobles, the merchants and the dhimmīs. The city's markets were rebuilt, and before the year was out its streets were busier and its merchants richer than they had been under Qashtāla. Ṭulayṭula and the towns of its land, Wādī al-Lubb, Illīshka, al-Yabānis, Muntalbān and the rest, were declared lands of al-Andalus in full, no longer conquests held by the sword. A governor was set over the city to see it done.\n\nThe harder question was how to govern four hundred thousand Christians who had been Castilians a month before. The Emperor answered it from the history of [Qurṭuba](place:qurtuba). Under the Umayyads, the Christians of the capital had answered to the emir through one of their own: the *qūmis*, from the Latin *comes*, the Count of the Christians, who spoke for his community and was held to account for its taxes. A Christian judge beside him heard their cases by the old law of the Visigoths, and the Jews had a head of their own, the office Ḥasdai ibn Shaprūṭ had held under ʿAbd al-Raḥmān III. The treasury of the caliphs had found the arrangement cheap and sure. The Mālikī jurists had found it hard to bear that a Christian or a Jew should be set over revenue. The scholars of the court were already at work reviving the ceremonial of ʿAbd al-Raḥmān III, his robes of ṭirāz and his Friday sermon in the Great Mosque, and the count belonged to the same revival: the covenant of the dhimma, as the caliphs had kept it, set down again over the realm's Christians and Jews.\n\nThe Emperor revived the office as the first new branch of the bureaucracy he had promised the conquered lands. He was clear about its terms. The counts would gather the dhimmīs' taxes more fully, their communities would be treated with more tolerance, and the ʿulamāʾ, though they would grumble, would have no real cause for complaint, since the call to Islam would not slow in the new lands. But the office had to be paid for, every year. If the crown let it starve, the jurists' objection would come back, the scholars' patience would wear thin, and conversion would falter. The Emperor meant to keep paying, and he meant to see what he paid for. Each count's books were to come to the dīwān once a year, to be audited by its own scribes dirham by dirham. He would not take a false account from his own treasurers, and he would not take one from a Christian count. The dhimmīs were glad to answer to one of their own.\n\nThere was money for it, for once, because Qashtāla was paying reparations. Part of it went south. In the spring the Emperor spent five hundred dīnārs of Castilian gold to carry the famous silk of [Gharnāṭa](place:gharnata) into [Mursiyya](place:mursiyya), now in the crown's own hands: more mulberry groves, more silkworm houses, and more silk sent on to the markets of Europe, which had always paid well for it. Qashtāla, which had once taken tribute from the house of Naṣr, was now paying for its silk.\n\n*O mankind, We created you from a male and a female, and made you peoples and tribes so that you may know one another.*"}, {"addr": "781-08-13", "slug": "0781-08-13-of-the-move-to-ishbiliya", "n": 60, "bn": 1, "hy": 781, "hm": 8, "hd": 13, "w": 1379, "title": "Of the Jamāʿa of 781, and the Court's Removal to Ishbīliya", "date": "1379-11-24", "dateStr": "24 November 1379", "hdateStr": "13 Shaʿbān 781", "book": "book-of-the-encircling-sea", "people": ["saad-ibn-yusuf"], "places": ["gharnata", "qurtuba", "ishbiliyya", "barshaluna", "sharish", "malaqa", "batalyaws", "tulaytula"], "sources": ["1379-04-jamaa-of-the-capital", "1379-04-roads-to-ishbiliya", "1379-11-capital-at-ishbiliya", "1380-gharnata-historical-capital"], "words": 549, "catch": "When the Jamāʿa met in Muḥarram 781, the question before it", "canon": 3, "body": "When the Jamāʿa met in Muḥarram 781, the question before it was the one the conquests had been asking for ten years. The house of Naṣr had ruled from [Gharnāṭa](place:gharnata) for a hundred and forty years. The city had been chosen because the mountains defended it, and the mountains had kept the Christians out of it through every war since. But the frontier was no longer in the mountains. It ran now past [Ṭulayṭula](place:tulaytula) and [Baṭalyaws](place:batalyaws), many days' ride north, and the lands won from Qashtāla were still only half held. The court found itself far from the provinces it most needed to govern. A governor's letter took a week to reach the dīwān, and the answer took another week to go back.\n\nThe elders of the court spoke first, for [Qurṭuba](place:qurtuba), seat of the caliphs, at the heart of al-Andalus, with the Great Mosque of ʿAbd al-Raḥmān still standing in it. It was the capital a restored al-Andalus seemed to call for, and for a time the assembly leaned toward it. Then a second proposal was put. The empire should invest in the sea. The Catalan shipwrights of [Barshalūna](place:barshaluna), who had built galleys for the Mamlūks at al-Iskandariyya, were the Emperor's own subjects now, and they could build the empire a merchant fleet. If the empire was going to live by trade, its capital belonged where the trade was. [Ishbīliya](place:ishbiliyya) was the greatest city of the realm, with seventy-eight thousand souls and the first market in the world, and its river ran down to the Ocean. The assembly agreed, and so did the Emperor, who had always read a ledger as closely as a map: he chose the river and the market over the prestige of Qurṭuba. The court would move to Ishbīliya before the year was out.\n\nThe move would not be cheap. A capital needs roads, and the Emperor ordered them in every direction: south to [Sharīsh](place:sharish), east to [Mālaqa](place:malaqa), and north across the Guadiana to Baṭalyaws and to Ṭulayṭula itself. Each road would take as long as its length and its ground required. To pay for them the crown borrowed from the estates, five loans of a hundred and thirteen dīnārs each. The nobles and the merchants lent willingly enough, since the roads would carry their goods as well as the Emperor's letters.\n\nIn Shaʿbān 781 the court came down from the hills. The dīwān sat in the palaces of Ishbīliya, and the Emperor's grip on the city, which had never been more than half certain, tightened within months. By the end of the year seven stretches of new road were finished, and the rest were under way.\n\nGharnāṭa was not abandoned. The Emperor decreed that the city of his fathers would keep the honours of a capital. Al-Ḥamrāʾ still stood on its hill, and the court that sat there kept its full weight: the fortress its strength, the crown its authority, and the realm the learning and the dignity that had been gathering in those halls for a century and a half. Gharnāṭa had become the realm's ancestral seat, and in a realm that called itself a restoration, that was worth a great deal.\n\n*It is He who made the earth tame for you, so walk among its slopes and eat of His provision.*"}, {"addr": "785-02-26", "slug": "0785-02-26-of-the-kingdom-of-tulaytula", "n": 61, "bn": 11, "hy": 785, "hm": 2, "hd": 26, "w": 1383, "title": "Of the Deaths of Sayyida and Abū ʿInān, and the So-Called Kingdom of Ṭulayṭula", "date": "1383-04-30", "dateStr": "30 April 1383", "hdateStr": "26 Ṣafar 785", "book": "book-of-the-marches", "people": ["saad-ibn-yusuf", "sayyida-of-fezzan", "yusuf-i", "abu-inan-faris", "abu-al-fadl-marinid", "jadila-bint-yusuf", "dua-marinid", "ismail-ibn-yusuf"], "places": ["gharnata", "fas", "tulaytula", "jayyan", "mursiyya", "ishbiliyya"], "sources": ["1380-11-19-death-of-sayyida", "1381-10-07-death-of-abu-inan", "1382-12-01-revolt-of-tulaytula", "1382-12-01-ismail-to-the-diwan", "1383-02-22-battle-munt-shaqir", "1383-04-30-battle-jaen", "1383-04-30-revolt-crushed"], "words": 491, "catch": "In Shaʿbān 782 the Emperor's mother died. Sayyida, daughter of the", "canon": 3, "body": "In Shaʿbān 782 the Emperor's mother died. [Sayyida](person:sayyida-of-fezzan), daughter of the lords of Fezzan, had been betrothed to [Yūsuf](person:yusuf-i) at nine years old. She came to [Gharnāṭa](place:gharnata) across the desert and the sea and outlived her husband by seventeen years. She sat in her son's dīwān through the worst of his wars and lived to see him proclaimed Emperor. She was fifty-two. The court mourned her as a mother of the dynasty. Her son mourned her as his mother, and for some weeks he would see no one.\n\nA year later news came from [Fās](place:fas) that [Abū ʿInān Fāris](person:abu-inan-faris) was dead. He had ruled the Marīnids for thirty-six years and twice made war on the house of Naṣr to bring it to heel, and twice failed. His son [Abū al-Faḍl](person:abu-al-fadl-marinid) took the throne, and with him the Emperor's sister [Jadīla](person:jadila-bint-yusuf) became queen of the Marīnids. The alliance [Duʿāʾ](person:dua-marinid) had argued for was now a family matter on both sides of the Strait.\n\nThe peace held for four years and then broke from inside. On 24 Ramaḍān 784, as the city kept the last nights of the fast, [Ṭulayṭula](place:tulaytula) rose. The Castilians of the old Visigothic capital drove the Emperor's governor out of the city and wrecked the madrasa the crown had built in its heart. They proclaimed a Kingdom of Ṭulayṭula, and the country followed them. Fifty-eight towns went over: the Middle March and La Mancha, the hills of Extremadura, and even the lands of [Mursiyya](place:mursiyya) and [Jayyān](place:jayyan), Ubbadha and Bayyāsa, and the coast of Walba. Half a million souls were in revolt, most of them Castilians and three in four of them Christians. The rebels raised nearly six thousand men, most of them peasant levies, against the Emperor's thirty-seven hundred regulars. The court called it another so-called kingdom, as it had called the rising of [Ishbīliya](place:ishbiliyya) thirty years before. It was no small matter.\n\nThe Emperor's younger brother [Ismāʿīl](person:ismail-ibn-yusuf), twenty-eight, took their mother's empty seat in the dīwān as the revolt began. The Emperor took the field. The rebels came to him in Dhū al-Ḥijja, at Munt Shāqir in the hills above the Guadiana, four thousand nine hundred against his ten thousand six hundred, and he broke them there. It was the only real battle of the revolt. The rest was a hunt. On 26 Ṣafar 785 the Emperor caught the last rebel host, one thousand eight hundred and seven men, outside the walls of Jayyān, and destroyed it to the last man. Forty-four of his own fell. The rebels' kingdom had lasted five months.\n\nThe towns came back to their obedience one by one. The governor went back to Ṭulayṭula, and the masons went back to the madrasa. The Emperor, with the realm secure for the first time in ten years, began to plan the pilgrimage he had put off since 774.\n\n*So do not weaken and do not grieve, and you will be superior if you are believers.*"}, {"addr": "787-12-04", "slug": "0787-12-04-of-the-pilgrimage-that-came-too-late", "n": 62, "bn": 8, "hy": 787, "hm": 12, "hd": 4, "w": 1386, "title": "Of the County of Teruel, and the Pilgrimage That Came Too Late", "date": "1386-01-06", "dateStr": "6 January 1386", "hdateStr": "4 Dhū al-Ḥijja 787", "book": "book-of-the-call", "people": ["saad-ibn-yusuf", "alfons-de-borja", "ismail-ibn-saad", "dua-marinid", "aiman-mamluk", "bolot-mamluk"], "places": ["ishbiliyya"], "sources": ["1383-04-30-hajj-planned", "1385-05-03-county-of-teruel", "1385-08-23-teruel-crushed", "1385-08-23-the-emperor-departs-on-hajj", "1385-10-28-al-qahira", "1386-01-06-the-season-passed", "1386-jamaa-theological-seminaries"], "words": 580, "catch": "The pilgrimage was put off once more. In Rabīʿ al-Awwal 787", "canon": 3, "body": "The pilgrimage was put off once more. In Rabīʿ al-Awwal 787 the lords of the Aragonese uplands rose against King [Alfons](person:alfons-de-borja) of the renewed Arghūn, and proclaimed a County of Teruel in the inner country of his kingdom. It was a small rising, but it was a rising in a ṭāʾifa the Emperor had made and promised to protect, and he would not leave for Makka with it unsettled. It took the summer. On 16 Rajab 787 the County of Teruel was crushed and its towns returned to King Alfons. That same day the Emperor's caravan left [Ishbīliya](place:ishbiliyya) for the east.\n\nIt was as fine as the caravan his father had led thirty-four years before. There were camels and horses and the scholars of the court, gifts for the sharīf of Makka, and alms for the poor of the two holy cities. The crown prince [Ismāʿīl](person:ismail-ibn-saad), nineteen years old, ruled as regent in his father's absence. He ruled well, by the dīwān's account. He had a gift for sending a minister away from an audience sure that the prince agreed with him, whatever the prince meant to do. That gift did not serve him in the harem. His mother [Duʿāʾ](person:dua-marinid) and the Emperor's first wife [Aiman](person:aiman-mamluk) had been rivals since the princes were children, and with the Emperor gone they quarrelled openly. They argued over precedence and households, and over whose son the court should look to. The regent learned that it was easier to govern an empire than to keep peace between two women who had each borne the Emperor a son.\n\nIn Ramaḍān the caravan reached al-Qāhira, the city of a thousand minarets, which swallows a caravan the moment it passes the northern gate. Above the noise and spice and roasting meat rose the mosque of al-Azhar, whose scholars were counted among the finest in the Muslim world. The Emperor lingered. He sat with them for a month, and he held long talks with his brother-in-law the sultan [Būlād](person:bolot-mamluk) about the fleet, the Maghrib and the Christians of the north. He said afterwards that it was the best month of his reign. Then he pushed on for Makka.\n\nHe came too late. When the caravan reached the holy city, the standing at ʿArafāt had passed: the hours between noon and sunset when every pilgrim of the season stands together on the plain beneath the Mount of Mercy, praying and asking forgiveness. A saying of the Prophet holds that the Ḥajj is nothing more or less than that single afternoon, and no rite performed afterwards can complete the pilgrimage. The Emperor heard the news in silence. Then he gave the order the caravan dreaded: they had tarried too long, and it must all be done again. The caravan broke up and turned for home.\n\nBut misfortune turned to fortune on the road back. The scholars the Emperor had sat with in al-Qāhira had taken his measure as he had taken theirs. When he offered them halls, stipends and students in Ishbīliya, many of them came west with him. The Jamāʿa had to be persuaded to pay for them. The ʿulamāʾ backed the measure warmly, since it was their own order the Emperor proposed to enlarge, and the assembly voted to sponsor theological seminaries across the realm for ten years. A pilgrimage that never reached ʿArafāt had brought al-Azhar to Ishbīliya.\n\n*But perhaps you hate a thing and it is good for you; and Allāh knows, while you know not.*"}, {"addr": "791-08-15", "slug": "0791-08-15-of-the-hijaba-the-hisba-and-the-death-of-dua", "n": 63, "bn": 9, "hy": 791, "hm": 8, "hd": 15, "w": 1389, "title": "Of the Ḥijāba and the Ḥisba, and the Death of Duʿāʾ", "date": "1389-08-09", "dateStr": "9 August 1389", "hdateStr": "15 Shaʿbān 791", "book": "book-of-the-call", "people": ["saad-ibn-yusuf", "ismail-ibn-saad", "bernarda-of-murcia", "dua-marinid", "maryam-bint-yusuf", "ismail-ibn-yusuf"], "places": ["ishbiliyya", "qurtuba"], "sources": ["1387-01-22-the-hijaba", "1387-01-22-ismail-to-the-diwan", "1387-hammams", "1387-10-01-castile-and-france", "1387-10-01-state", "1388-12-28-death-of-dua", "1389-08-09-the-hisba"], "words": 647, "catch": "The Emperor returned from al-Qāhira with his head full of what", "canon": 3, "body": "The Emperor returned from al-Qāhira with his head full of what he had seen there: the Mamlūk court with its offices and ranks, and the books the scholars of al-Azhar had opened for him on the government of the old caliphs. He meant to build on them. The first fruit was the Ḥijāba. Under the Umayyads of [Qurṭuba](place:qurtuba) the ḥājib had been the chamberlain of the court. He presided over his own council, received petitioners and embassies, and drafted decrees in the caliph's name. Under al-Manṣūr he became the caliph's power in all but name. The Emperor revived the office. It made the throne stronger and gave it something of the dignity of the caliphs' own court. Like the ḥājibs of old, it would also stand between the throne and the great lords, and the nobles noticed.\n\nThe Ḥijāba brought a new seat in the dīwān, and the Emperor filled it with his heir. The crown prince [Ismāʿīl](person:ismail-ibn-saad) had been at sea as an admiral, carrying the crown's authority over the coasts. Nobody took him for a fighting sailor, and he did not pretend to be one; he governed the coasts by persuasion and left the fighting to his captains. His father called him home, and on the first day of Muḥarram 789 he took his seat beside his aunt [Maryam](person:maryam-bint-yusuf), his uncle [Ismāʿīl](person:ismail-ibn-yusuf) and his mother. He was set to the Emperor's great project: the seminaries, the scholars, and the shaping of what the realm should prize. He was twenty, married now to [Bernarda](person:bernarda-of-murcia) of Mursiyya, and the court said he could talk a bird down from a tree.\n\nOther lessons from the east took root in the towns. Across the realm the crown began to build hammams, beginning at [Ishbīliya](place:ishbiliyya): bathhouses for washing, company and ritual purity, a cornerstone of Andalusī town life that the Castilians had let fall into ruin. From beyond the Pyrenees came news the court did not pretend to regret. Qashtāla had joined a war in the north on the side of a little Ardennes county against the king of France, and lost two armies in the hills of the Rhône.\n\nIn Dhū al-Ḥijja 790, in the last days of the year, [Duʿāʾ](person:dua-marinid) the Marīnid died. She was fifty years old. She had sat in the dīwān for thirty-three years, under two husbands and two reigns. She had brought the court foreign learning and kept the realm through the War of the Upper March as regent, and she had seen her son made heir. The court gave out that she died of a short illness. It was very short. The physicians were not called until it was over, and the household was quiet for a long time afterwards. The Emperor ordered her buried with every honour, in the Rawḍa beside the kings of the house, and he did not speak of her again in the dīwān.\n\nMore than seven months later, in Shaʿbān 791, the bureaucracy gained a third office, as the empire turned slowly toward the sea and its trade. This was the Ḥisba, the old inspectorate of the Islamic city. Its muḥtasib walked the markets, checked the weights and the measures, put down fraud and enforced honest dealing. The ʿulamāʾ approved, since the muḥtasib was one of their own. The merchants did not, since he was not one of theirs. The Emperor gave the first muḥtasib of Ishbīliya one order in his own words: to begin with the crown's warehouses, and to hold the Emperor's weights to the same measure as any grocer's in the sūq. The merchants still grumbled, but none of them could say the scales were weighted for the crown. The empire's goods sold better for being honestly weighed, and its markets moved a little further from barter and a little nearer to coin.\n\n*O reassured soul, return to your Lord, well-pleased and pleasing to Him.*"}, {"addr": "794-03-25", "slug": "0794-03-25-of-al-hajj-saad", "n": 64, "bn": 10, "hy": 794, "hm": 3, "hd": 25, "w": 1392, "title": "Of the Second Pilgrimage, the Death of Aiman, and al-Ḥājj Saʿd", "date": "1392-02-20", "dateStr": "20 February 1392", "hdateStr": "25 Rabīʿ al-Awwal 794", "book": "book-of-the-call", "people": ["saad-ibn-yusuf", "ismail-ibn-saad", "aisha-ottoman", "bernarda-of-murcia", "aiman-mamluk", "dua-marinid", "yusuf-ibn-saad", "bolot-mamluk"], "places": ["ishbiliyya", "fas"], "sources": ["1391-05-ottoman-marriage", "1391-05-11-second-hajj-departs", "1391-07-01-merchant-at-sea", "1391-07-25-al-qahira-again", "1391-10-the-kaaba", "1391-10-14-death-of-aiman", "1392-02-20-hajji", "1392-11-banking", "1371-02-24-spread-of-usury"], "words": 739, "catch": "Five years after the season passed him by, the Emperor set", "canon": 3, "body": "Five years after the season passed him by, the Emperor set out again, and this time he left in spring. He stayed at court only long enough for one more marriage. A princess of the house of ʿOthmān, the sultans rising in Anatolia, came west to marry his son: [ʿĀʾisha](person:aisha-ottoman), fifteen years old, who became the crown prince's second wife beside [Bernarda](person:bernarda-of-murcia). The wedding was hardly over before the caravan moved. On 6 Jumādā al-Ākhira 793 he left [Ishbīliya](place:ishbiliyya) with half a year in hand, and the crown prince [Ismāʿīl](person:ismail-ibn-saad) took up the regency a second time.\n\nThis time the pilgrimage went by sea along the coast of the Maghrib. Off that coast a merchant ship hailed the Emperor's galleys, her decks stacked with bolts of silk and fine cloth from distant ports, and her captain would sell only after a merchant's unhurried haggling. The Emperor bought the finest cloth aboard for the caravan, and lost ten days to the bargaining. In Shaʿbān he came again to al-Qāhira, and the court that had watched him the first time watched him now. He was a creature of habit. He sat with the scholars of al-Azhar for another month, and took up with the sultan [Būlād](person:bolot-mamluk) where they had left off. But it was summer, not autumn, and when he rode out of the northern gate there were months to spare.\n\nIn the last days of Dhū al-Qaʿda 793 the Grand Mosque of Makka opened before him. The Kaʿba stood at its heart, black-draped, older than memory, with the white-robed faithful moving round it in patient circles, thousands of them from every land where the call to prayer is heard. Sultan and shepherd dressed alike. On the ninth of Dhū al-Ḥijja the Emperor stood with them on the plain of ʿArafāt beneath the Mount of Mercy, from noon until the sun went down, and the pilgrimage he had first meant to make in 774 was complete. He had been asked what kind of pilgrim he would be, since what a king gives in Makka is told in every market of Islam for a generation. He answered by distributing his gold freely, so that no pilgrim in the city went hungry that season.\n\nHe was in the holy city when the letter from Ishbīliya found him. [Aiman](person:aiman-mamluk) of the Baḥrī house, his first wife, sister of the Mamlūk sultan and mother of his son [Yūsuf](person:yusuf-ibn-saad), was dead at forty-seven. She had gone home to Miṣr to see her family while the caravan was on the road, and the letter said a beast of the Nile had taken her by the river. The Emperor read it twice and gave the order for prayers. Courts keep count of such things, and this one counted two great wives lost in three years: [Duʿāʾ](person:dua-marinid) while the Emperor was at court, and now Aiman while he was half the world away at Makka. It noted too that Aiman's son, twenty years old, now had no mother to speak for him, and that there were those in the crown prince's household who did not seem sorry. Nobody at court said any of this aloud.\n\nOn 25 Rabīʿ al-Awwal 794 the caravan came home. Its stores were lighter and its pilgrims were changed, and word had outpaced the camels. Crowds filled the road into Ishbīliya to welcome a ruler who had stood before the Kaʿba and come back to tell of it. From that day he bore the title al-Ḥājj, earned and not granted, as his father had. *Let it be known*, the heralds cried, *Makka and back, by the grace of Allāh.* The ʿulamāʾ were content with him as they had not been in years, and every Muslim court from [Fās](place:fas) to al-Qāhira sent its congratulations.\n\nHe met his grief as he always had, with work. Before the year was out he did a thing that would have been unthinkable twenty years earlier, when the ʿulamāʾ had come to him about the moneylenders of Ishbīliya. He gave moneylending a form and a law. Banking, the new craft of the Genoese and the Florentines, was admitted into the empire and set under rules, so that the houses of credit of Ishbīliya could stand beside those of Janawa. The ʿulamāʾ, freshly content with their Ḥājj, let it pass.\n\n*And pilgrimage to the House is a duty owed to Allāh by all people who are able to find a way there.*"}, {"addr": "794-03-26", "slug": "0794-03-26-of-the-western-ocean", "n": 65, "bn": 2, "hy": 794, "hm": 3, "hd": 26, "w": 1392, "title": "Of the Mansa's Merchants, and the Ships Sent into the Western Ocean", "date": "1392-02-21", "dateStr": "21 February 1392", "hdateStr": "26 Rabīʿ al-Awwal 794", "book": "book-of-the-encircling-sea", "people": ["ismail-ibn-saad", "khayr-al-din-al-jayyani", "saad-ibn-yusuf"], "places": ["ishbiliyya", "jayyan", "washqa"], "sources": ["1391-06-08-guns-for-mali", "1391-07-coast-to-mali", "1392-02-atlantic-expeditions"], "words": 407, "catch": "While the Emperor was on the road to Makka, merchants arrived", "canon": 3, "body": "While the Emperor was on the road to Makka, merchants arrived at [Ishbīliya](place:ishbiliyya) from the far side of the desert. They had been sent by the Mansa of Mali himself, the lord of the gold country, whose forebear Mansa Mūsā had passed through al-Qāhira on pilgrimage spending so much gold that its price fell for years. They had come to buy the *madāfiʿ* of the empire's arsenals: the fire-tubes and small bombards whose roar the Naṣrids had first loosed at the walls of [Washqa](place:washqa) nearly seventy years before. They wanted the craft of casting them as well. The crown prince [Ismāʿīl](person:ismail-ibn-saad), ruling as regent, weighed it. Some in the dīwān warned that arms sold to a friend can be turned against a friend's trade. The prince judged otherwise. Mali was far away and rich, and it would pay a fifth of a year's income for the privilege. It would also become a grateful friend in the lands where the gold came from. He sold, and the Mansa's merchants went home content.\n\nA friendship with Mali needed a road to Mali, and the prince did not want it to be the old one. For six hundred years the gold had come north on camels across the Ṣaḥrāʾ, through Sijilmāsa and the oases, paying a toll at every well. The prince sent instead a courtier of [Jayyān](place:jayyan), [Khayr al-Dīn al-Jayyānī](person:khayr-al-din-al-jayyani), a man of forty with a gift for talking to strangers, to find the way by sea: down the Atlantic coast of Africa, past the last towns the merchants knew, to wherever the shore turned toward the Mansa's country.\n\nWhen the Emperor returned from Makka he did not undo his son's work. He added to it. Two more expeditions were fitted out with new captains. One was to chart the sea around the Azores, the scattered islands the Genoese had glimpsed in the western Ocean. The other was to Madeira, the wooded island the Arab geographers had heard of and the Portuguese had not yet claimed. The Catalan shipwrights were set to building ships for the Ocean.\n\nThe scholars of the court muttered about the Sea of Darkness. The Emperor had all three expeditions entered in the dīwān's registers, with their stores, their wages and their cost to the last dirham, for he meant to know what the Ocean gave back for what he spent on it.\n\n*And His are the ships raised high in the sea like mountains.*"}, {"addr": "797-04-12", "slug": "0797-04-12-of-the-days-of-banbaluna-and-ejea", "n": 66, "bn": 12, "hy": 797, "hm": 4, "hd": 12, "w": 1395, "title": "Of the League, the Ships of Catalonia, and the Days of Banbalūna and Ejea", "date": "1395-02-04", "dateStr": "4 February 1395", "hdateStr": "12 Rabīʿ al-Thānī 797", "book": "book-of-the-marches", "people": ["saad-ibn-yusuf", "pedro-of-castile", "agustin-arce", "rodrigo-de-borja"], "places": ["ishbiliyya", "fas", "balansiyya", "banbaluna", "qalat-ayyub"], "sources": ["1393-coalition", "1393-02-24-death-of-alfons", "1394-01-02-eve-of-war", "1394-01-06-pedro-of-castile", "1394-03-04-war-on-castile", "1394-06-13-battle-mouths-rhone-ii", "1394-07-03-battle-atlantic", "1394-07-14-battle-mouth-douro", "1394-09-18-battle-bay-setubal-ii", "1394-08-siguenza", "1394-08-18-battle-grosseto", "1394-09-11-battle-piombino", "1394-11-15-battle-grosseto-ii", "1394-08-14-algarve-armies", "1394-09-the-chase", "1394-10-12-battle-pamplona", "1394-11-17-return-from-the-north", "1394-12-14-battle-ejea", "1395-02-04-battle-penafiel", "1395-05-24-battle-montalcino"], "words": 854, "catch": "The peace of 779 had been made for fifteen years, and", "canon": 3, "body": "The peace of 779 had been made for fifteen years, and the Christians spent the last of them afraid. In Jumādā al-Ākhira 795 Qashtāla, Portugal and the little mountain lordship of Andorra swore a league against al-Andalus. The court at [Ishbīliya](place:ishbiliyya) took it as a compliment, and when the war came it named the war after the League. Its spies had been inside Qashtāla for two years. By the turn of the Christian year the dīwān had its claim ready, and the ʿulamāʾ gave the cause its name. The chroniclers of Qashtāla had long written of their wars on al-Andalus as a recovery of what the Goths had lost. The ʿulamāʾ turned the word around: al-Istirdād, the Recovery, of what the Christians had taken. They counted the War of the Upper March and the War of the Aragonese Restoration as its first two wars. This would be the third. Five days later, King Fernando of Qashtāla died at fifty-nine, and his son [Pedro](person:pedro-of-castile), twenty-three, stubborn and fond of his wine, inherited the war his father had seen coming.\n\nOn 1 Jumādā al-Ūlā 796 the Emperor [Saʿd](person:saad-ibn-yusuf) declared it. The four ṭāʾifas marched with him, and so did the Marīnids of [Fās](place:fas) with their vassals and the Mamlūks of Miṣr with theirs. With Qashtāla stood Portugal, Andorra, and the Pope in Rome, with his cities of Siena and Faenza.\n\nThe sea war went both ways. In Shaʿbān the fleet of Fās, seventy-two sail, caught the Pope's squadron at the mouths of the Rhône and sank all fourteen of its galleys. Far out on the Ocean, though, a Castilian squadron of only eleven ships hunted the Catalan fleet down three times: off Galicia, at the mouth of the Duero, and in the bay of Setúbal. Of the thirty-three ships Catalonia had sent out, three came home. The Castilians lost none.\n\nOn land, the Christians struck first and struck the weakest. In Shawwāl Qashtāla's great host, twenty-four thousand men, came down past Sigüenza onto the small armies of the ṭāʾifas. Arghūn's fell back in time. [Balansiyya](place:balansiyya)'s did not, and it died there to the last man, three thousand nine hundred and fifty-eight of them, for a hundred and forty Castilians. In the same week the Portuguese came down into the Alentejo and destroyed both armies of the Ṭāʾifa of the Algarve, at Setúbal and at Montemor.\n\nThe Emperor had seventeen thousand six hundred men and no wish to meet twenty-four thousand on their own terms. He followed them north instead. Through Shawwāl and Dhū al-Qaʿda his host shadowed the Castilians up the Aragonese border, from [Qalʿat Ayyūb](place:qalat-ayyub) toward the Ebro and Tudela, with the Catalans and Aragonese on their other flank, waiting for the Castilians to make a mistake. On 16 Dhū al-Ḥijja they made it. They had chased an Aragonese army of nearly nine thousand into the hills of Navarre, and at [Banbalūna](place:banbaluna) they found the Emperor across their road. Their pursuit was cut off and their host beaten, nearly two and a half thousand of theirs lost for fewer than fifteen hundred of ours, and the Castilians went back the way they had come in haste.\n\nThey came south again with the cold weather, still nearly twenty-two thousand strong, under the best general left to Qashtāla. [Agustín Arce](person:agustin-arce) was Grand Master of the Order of Alcántara, fifty years old, a soldier since boyhood. On 10 Ṣafar 797 the Emperor caught him on the plain of the Cinco Villas at Ejea de los Caballeros. It was ground of Arce's choosing, and the officers told the Emperor so. He attacked anyway, and he did not command it from a hill. He was forty-six, and for nine days he rode among his men from first light, ate what they ate and slept where they slept. Through all nine the Grand Master held, and the knights of Alcántara were all that the chronicles of their order would later claim. On the ninth day they broke. Ten thousand eight hundred Castilians were dead or scattered, against some four thousand seven hundred of ours. That one field moved the war further than the whole of the summer before it.\n\nWhat was left of Arce's host fled west into Old Castile, nearly eleven thousand men with no fight left in them. On 12 Rabīʿ al-Thānī, at Peñafiel on the Duero, fewer than nine hundred horsemen of the Ṭāʾifa of Arghūn found them. They rode for the boy-king [Rodrigo](person:rodrigo-de-borja), whose father had died two years before, and they cut down or scattered more than ten and a half thousand men without losing one of their own. Qashtāla had no army left in the field.\n\nOnly in Tuscany did the war go badly for the faithful. There the men of Barqa and a Mamlūk detachment, sent to keep the Pope busy at home, were beaten by the Sienese, twice at Grosseto, once at Piombino and, when the spring came, at Montalcino. The Pope stayed busy, though, and he sent nothing more to Qashtāla.\n\n*Indeed, Allāh loves those who fight in His cause in a row as though they are a single structure joined firmly.*"}, {"addr": "797-09-03a", "slug": "0797-09-03-of-portalegre-and-the-peace-of-ramadan", "n": 67, "bn": 13, "hy": 797, "hm": 9, "hd": 3, "w": 1395, "title": "Of the Stand at Portalegre, and the Peace of Ramaḍān", "date": "1395-06-22", "dateStr": "22 June 1395", "hdateStr": "3 Ramaḍān 797", "book": "book-of-the-marches", "people": ["saad-ibn-yusuf", "pedro-of-castile", "jeronimo-of-castile"], "places": ["al-ushbuna", "majrit", "shalamanka", "qunka", "yabura", "shantarin", "tulaytula", "ishbiliyya", "balansiyya"], "sources": ["1389-05-01-castile-portugal-split", "1395-06-18-battle-portalegre", "1395-06-22-peace-castile-portugal"], "words": 712, "catch": "With Qashtāla's armies gone, the war passed to Portugal. Its king", "canon": 3, "body": "With Qashtāla's armies gone, the war passed to Portugal. Its king was [Jerónimo](person:jeronimo-of-castile), fifty-two, who had once worn the crowns of Qashtāla and Portugal together and had kept only the second when they parted six years before. He had lost a war to the Emperor already, in 779, and he had no wish to lose another. In the spring he gathered every man Portugal could raise, nearly fifteen thousand of them, and waited on the Alentejo border at Portalegre.\n\nThe Emperor came to him on 10 Shaʿbān 797 with fourteen thousand six hundred, the Aragonese riders of Peñafiel and the Mamlūk contingents beside him. The armies were near enough equal that the Portuguese had reason to hope, and for eighteen days they held. On 28 Shaʿbān they broke, with some seven thousand of theirs lost for fewer than four thousand of ours. The scribes of the dīwān reckoned the war complete. There was nothing left that the Christians could put in the field, and nothing left that the Emperor could not take.\n\nOn the third day of Ramaḍān, King [Pedro](person:pedro-of-castile) of Qashtāla asked for peace, and Portugal, which had gone to war for Qashtāla, was made to sign beside him. It was signed in the holy month, so the court called it the Peace of Ramaḍān, and the preachers of [Ishbīliya](place:ishbiliyya) made much of the date at the Friday prayer. So ended the War of the League, the third war of the Istirdād.\n\nQashtāla gave up fifty-one towns. In the west it lost [Shalamanka](place:shalamanka) on the Tormes, the largest of them, with Ávila behind its walls, Ciudad Rodrigo, Ledesma and the Leonese country to the Portuguese border. Beyond the Guadarrama it lost [Majrīṭ](place:majrit), the fortress the amīr Muḥammad built on the Manzanares five hundred years before to guard the road to [Ṭulayṭula](place:tulaytula), and Alcalá, Guadalajara and Sigüenza, where the army of [Balansiyya](place:balansiyya) had died. To the east went [Qūnka](place:qunka), Molina and Requena, and to the south-west Cáceres, Plasencia and Coria, the upper country of the old Lower March. Qashtāla would also pay reparations for ten years.\n\nPortugal gave up twenty: Setúbal and the Sado, [Yābura](place:yabura) and the Alentejo from Elvas to Portalegre, [Shantarīn](place:shantarin) on the Tagus, and [al-Ushbūna](place:al-ushbuna) itself. Al-Ushbūna had been a city of al-Andalus for four hundred and thirty years before the crusaders took it, and now, after more than two centuries under the cross, it was one again. Its mosques had become churches, and they would stay churches. The court said so plainly at the signing, for the Emperor meant al-Ushbūna to know at once that he had come to rule its Christians, not to unmake them: they would keep their worship under him, so long as they kept the peace and paid what the dhimma asked of them.\n\nAll seventy-one towns passed directly to the crown. The realm grew in a day from a hundred and eighteen towns to a hundred and eighty-nine, and its people by a million, to more than two million three hundred thousand souls. The war itself had cost the realm nearly a hundred and fifty thousand of its own. The scribes added up the new figures more slowly than the old. The Castilians in the empire now outnumbered the Andalusīs two to one, with the Leonese and the Portuguese besides, and the Christians outnumbered the faithful three to one.\n\nNo Muslim ruler had held so much of the peninsula since the caliphs. And no Muslim ruler had ever ruled so many Christians. The foreign courts watched the empire to see whether it would choke on what it had swallowed, and for a season they ranked it lower than they had before the war. In the dīwān the question was already how such lands should be governed, and by whom. The ṭāʾifas of the north had taught the court that Christians would obey a Christian king who owed his crown to the Emperor more readily than a Muslim governor, and there was talk of new ṭāʾifas in the conquered lands, from the Leonese country in the west to the hills of Qūnka in the east.\n\n*Allāh has promised those among you who believe and do righteous deeds that He will surely make them successors upon the earth, as He made those before them successors.*"}, {"addr": "797-09-03b", "slug": "0797-09-03-of-the-encircling-sea-and-fifteen-years-of-building", "n": 68, "bn": 3, "hy": 797, "hm": 9, "hd": 3, "w": 1395, "title": "Of the Encircling Sea, and Fifteen Years of Building", "date": "1395-06-22", "dateStr": "22 June 1395", "hdateStr": "3 Ramaḍān 797", "book": "book-of-the-encircling-sea", "people": ["saad-ibn-yusuf", "ismail-ibn-saad", "khayr-al-din-al-jayyani"], "places": ["al-ushbuna", "ishbiliyya", "qusantina", "qarmuna", "istijja", "walba", "labla", "qadis", "ayamunt", "sharish", "batalyaws", "mursiyya", "qurtuba", "gharnata", "malaqa", "tulaytula", "al-mariyya"], "sources": ["1379-04-jamaa-of-the-capital", "1379-11-capital-at-ishbiliya", "1376-12-catalan-shipwrights", "1383-06-17-ismail-admiral", "1387-hammams", "1389-08-09-the-hisba", "1392-11-banking", "1392-02-atlantic-expeditions", "1395-06-22-fifteen-years-of-building"], "words": 745, "catch": "The geographer al-Idrīsī, who wrote for a Norman king in Ṣiqilliya,", "canon": 3, "body": "The geographer al-Idrīsī, who wrote for a Norman king in Ṣiqilliya, tells of eight cousins of [al-Ushbūna](place:al-ushbuna) who fitted out a ship with water and food for months and sailed west into the Ocean, to learn what was in it and where it ended. The geographers called that Ocean al-Baḥr al-Muḥīṭ, the Encircling Sea, because it was believed to run around the whole inhabited world. The sailors called it the Sea of Darkness. The cousins found islands, some of them deserted and some of them inhabited, and a people who held them prisoner until a king sent them home blindfolded. The Ushbūnīs called them the Mugharrirūn, the men who were led astray, and named a street of the city after them. Two hundred and fifty years after the Christians took al-Ushbūna, it is a city of al-Andalus again, and the empire has its own Mugharrirūn at sea. This book tells how al-Andalus turned to the Ocean.\n\nThe court dates it from the Jamāʿa of 7 Muḥarram 781, which moved the capital from the mountains to [Ishbīliya](place:ishbiliyya) for its river and its market. A capital on a river that runs down to the Ocean needed ships, and the empire had four. It also had the Catalan shipwrights, who had already been sent to build galleys for the Mamlūks in five ports, and now they built for their own sovereign. By the declaration of 796 the fleet numbered sixteen. Its first admiral of the blood was the crown prince [Ismāʿīl](person:ismail-ibn-saad), who took the command at seventeen and held it until the Ḥijāba called him into the dīwān.\n\nThe court had called Saʿd the Conqueror since the year 766. In these fifteen years the Conqueror became the greatest builder the house of Naṣr had known. He studied a smelter's accounts as closely as the plan of a siege, and every dīnār the crown did not spend on war and on settling the new lands went into building. Lumber mills went up in the Sierra Morena around [Qusanṭīna](place:qusantina), in the campiña below it at [Qarmūna](place:qarmuna) and [Istijja](place:istijja), and at the capital itself, to feed the shipwrights, and their number went from nine to twenty-two. In the marshes of [Walba](place:walba), [Labla](place:labla) and [Ayamunt](place:ayamunt), and on the bay of [Qādis](place:qadis), the crown raised eight smelters for the bog iron that lies under the reeds, with eight charcoal-burners to feed them. The silver of Qusanṭīna, held since the bargain of 752, went to the jewellers, whose guilds went from seven to fifteen, most of them at Ishbīliya. There were four new workshops for tools and five for cloth, and in the fields of [Sharīsh](place:sharish), [Baṭalyaws](place:batalyaws) and [Mursiyya](place:mursiyya) cotton was planted again, as it had been under the caliphs until the Castilians let it die.\n\nThe trade needed markets, and the crown built nine more, with three great warehouses at Ishbīliya. It needed honest weights, and the Ḥisba gave it inspectors. It needed money that could travel without a camel to carry it, and the banking offices went from one, a Genoese house at Ishbīliya, to eight, in [Qurṭuba](place:qurtuba), [Gharnāṭa](place:gharnata), [Mālaqa](place:malaqa), [Ṭulayṭula](place:tulaytula) and the capital. The trade of the African coast brought men as well as gold, as it always had, and two slave markets opened at Ishbīliya.\n\nHe did not build for the purse alone. Because a city of al-Andalus is not a city without them, the crown raised eleven hammams, from [al-Mariyya](place:al-mariyya) to Baṭalyaws. The libraries of the realm went from five to eleven and its madrasas from four to seven, and there were five hospitals where there had been three. And at Ishbīliya the empire at last gave itself the house of a capital: the halls of a royal court, a hall for the scribes of the dīwān, and a royal garden beside them.\n\nThe scribes counted it all on the eve of the Peace of Ramaḍān. The crown's income, a hundred and one dīnārs a month when the court came down to Ishbīliya, was a hundred and forty-five. By then [Khayr al-Dīn al-Jayyānī](person:khayr-al-din-al-jayyani) was charting the coast toward Mali, the Emperor's ships had gone out to the sea of the Azores and to Madeira, and the crown was fitting out new voyages to the Canaries and the islands beyond them.\n\n*And it is He who subjected the sea, that you may eat from it tender meat and bring forth from it ornaments to wear. And you see the ships ploughing through it, that you may seek of His bounty.*"}, {"addr": "797-10-17", "slug": "0797-10-17-of-the-diwan-al-insha-and-the-two-taifas", "n": 69, "bn": 14, "hy": 797, "hm": 10, "hd": 17, "w": 1395, "title": "Of the Dīwān al-Inshāʾ, the Two Ṭāʾifas, and the Embassies", "date": "1395-08-05", "dateStr": "5 August 1395", "hdateStr": "17 Shawwāl 797", "book": "book-of-the-marches", "people": ["saad-ibn-yusuf", "saad-ibn-ismail", "saad-ibn-faraj", "umm-al-fath-bint-saad", "ismail-ibn-saad"], "places": ["shalamanka", "qunka", "majrit", "al-ushbuna", "qurtuba", "ishbiliyya"], "sources": ["1395-08-05-diwan-al-insha", "1395-08-05-the-embassies", "1395-08-05-two-new-taifas", "1395-08-05-hold-on-al-ushbuna"], "words": 681, "catch": "Six weeks after the Peace of Ramaḍān the Emperor Saʿd gave", "canon": 3, "body": "Six weeks after the Peace of Ramaḍān the Emperor [Saʿd](person:saad-ibn-yusuf) gave the realm its fourth great office. The Count of the Christians had come in 780, the Ḥijāba in 789 and the Ḥisba in 791. On 17 Shawwāl 797 he founded the Dīwān al-Inshāʾ, the chancery, whose secretaries drafted the edicts, the treaties and the letters to foreign kings in the high style of the court. Under the caliphs the kātib of the Inshāʾ had been prized above poets, for a well-turned letter could win what an army could not. The ʿulamāʾ approved. The umarāʾ grumbled that the realm was now governed by men who held pens instead of lances, and the Emperor answered that the lance had won the land and the pen would keep it. He fixed the secretaries' pay from the treasury himself and forbade them to take gifts from the courts they wrote to. A chancery that could be bought, he said, would write whatever the highest bidder wanted.\n\nThe empire's letters already went far. That summer its envoys were received at Paris, at Naples, at Qusṭanṭīniyya of the Ottomans, and even in London, at the court of the English king. [Ismāʿīl](person:ismail-ibn-saad) the crown prince, who sat in the dīwān and could talk a bird down from a tree, was said to read the letters to Paris before they were sealed. Qashtāla would not be a friend; its young king had signed away fifty-one towns and did not mean to forget it. France was another matter. Its king answered warmly, and there was talk in the dīwān of an alliance. The cost was plain to everyone. France was losing a war against the English, the Burgundians and its own rebels of Boulogne and Brittany, and an alliance with France meant a share of that war. The Emperor let the talk go on and signed nothing.\n\nThen came the question the peace had left. The seventy-one towns of Ramaḍān had all passed to the crown, and the ṭāʾifas of the north had taught the court that Christians obeyed a Christian king who owed his crown to the Emperor more readily than a Muslim governor. On the same day as the chancery the Emperor carved two new ṭāʾifas from the Castilian lands, and gave them to two of his cousins, each of them named Saʿd like himself. [Saʿd ibn Ismāʿīl](person:saad-ibn-ismail), son of his late uncle Ismāʿīl and an Aydınid princess, took the Ṭāʾifa of [Shalamanka](place:shalamanka), twenty-one towns of the Leonese west from Ávila to the Portuguese border. [Saʿd ibn Faraj](person:saad-ibn-faraj), son of his uncle Faraj, took the Ṭāʾifa of [Qūnka](place:qunka), twenty towns of the Castilian east from Guadalajara and Sigüenza to Molina and Requena. He was also the Emperor's son-in-law, the husband of [Umm al-Fatḥ](person:umm-al-fath-bint-saad), who sat in the dīwān and had the integration of the new lands in her charge.\n\nThe crown kept the rest: [Majrīṭ](place:majrit) and its towns from Alcalá to the Escorial, Cáceres and the country of Alcántara, and every town that had been Portugal's. The crown's own towns fell from a hundred and eighty-nine to a hundred and forty-eight. Giving away so much land in a day unsettled the realm for a season, and the old families of [Ishbīliya](place:ishbiliyya) wondered aloud why the Emperor had fought for towns only to hand them to his cousins. The foreign courts drew the opposite conclusion. A realm with six ṭāʾifas under its hand was a power, and they ranked al-Andalus among the first seven kingdoms of Christendom and Islam.\n\n[Al-Ushbūna](place:al-ushbuna), which the court had feared would be the hardest of all to hold, proved the easiest of the new lands. The seas along the coast were safer than they had been in living memory, and what could be reached by water could be governed by water. The governors of al-Ushbūna already answered to Ishbīliya far better than those of Majrīṭ, and far better than the Alentejo, where Yābura hardly answered at all. The dīwān reckoned that in a generation al-Ushbūna would be bound to the crown as closely as [Qurṭuba](place:qurtuba).\n\n*Nūn. By the pen and what they inscribe.*"}, {"addr": "799-11-19", "slug": "0799-11-19-of-majrit-the-acequias-and-the-eternal-isles", "n": 70, "bn": 4, "hy": 799, "hm": 11, "hd": 19, "w": 1397, "title": "Of Majrīṭ, the Acequias, and the Eternal Isles", "date": "1397-08-14", "dateStr": "14 August 1397", "hdateStr": "19 Dhū al-Qaʿda 799", "book": "book-of-the-encircling-sea", "people": ["saad-ibn-yusuf", "muhammad-ibn-ismail", "maryam-bint-yusuf", "ismail-ibn-muhammad-al-abid"], "places": ["majrit", "tulaytula", "qarmuna", "istijja", "shaluqa-al-kubra", "qurtuba", "binar", "al-ushbuna", "malaqa", "shantarin", "al-mariyya", "ishbiliyya"], "sources": ["1396-03-13-majrit-and-tulaytula", "1397-08-14-infrastructure", "1397-08-14-explorers-push-south"], "words": 554, "catch": "The amīr Muḥammad had built Majrīṭ as a watchtower, to guard", "canon": 3, "body": "The amīr Muḥammad had built [Majrīṭ](place:majrit) as a watchtower, to guard the road to [Ṭulayṭula](place:tulaytula) from the Christians beyond the mountains. Five hundred years later the Emperor [Saʿd](person:saad-ibn-yusuf) looked at it with a merchant's eye. It stood in the middle of the peninsula, where the roads from the four quarters crossed, with the Guadarrama behind it for timber and iron and the plain before it for wheat. A town at a crossroads, he told the dīwān, will grow whether a king helps it or not, and a king who helps it will be paid back many times over. In Jumādā al-Ākhira 798 he set the crown to building a second heart for al-Andalus on the Tagus and the Manzanares. Ṭulayṭula, which had made blades since before the Arabs came, was given weaponsmiths. Mines and lumber mills went up toward the Guadarrama, and wheat farms on the plain, and seven building sites stood open between the two cities at once.\n\nIn Dhū al-Qaʿda 799 a new round of building began across the empire. Across the valley and the new lands of the north the crown threw fourteen bridges, and it raised madrasas at [al-Ushbūna](place:al-ushbuna) and [Shantarīn](place:shantarin), so that the children of the converts would learn their religion from Andalusī teachers. In the old lands [Mālaqa](place:malaqa) and [al-Mariyya](place:al-mariyya) were given madrasas too. Majrīṭ was given a guild of toolmakers and Ṭulayṭula a tannery. Along the great river, from the capital to [Qurṭuba](place:qurtuba), the crown dug a chain of acequias at [Qarmūna](place:qarmuna), [Istijja](place:istijja), [Shalūqa al-Kubrā](place:shaluqa-al-kubra) and Qurṭuba itself, canals that carried water from the hills to the fields and gardens. Another watered the fields of [Bīnār](place:binar). The Castilians had kept the old canals of the caliphs and called them by their Arabic name, acequia, from al-sāqiya. Now the Arabic word was spoken over them again. The Emperor rode out to see the first water come down the channel at Qarmūna, and asked the engineers what each cubit of it had cost before he praised them.\n\nThe same years carried the empire's ships further south than they had gone before. The geographers called the islands off the coast of the Maghrib al-Jazāʾir al-Khālidāt, the Eternal Isles, and placed the edge of the known world there. Two men of the Emperor's own family went to find them. [Muḥammad ibn Ismāʿīl al-Aḥmar](person:muhammad-ibn-ismail), the husband of his half-sister [Maryam](person:maryam-bint-yusuf), took ship from [Ishbīliya](place:ishbiliyya) in Rabīʿ al-Thānī 798 at the age of sixty-two, an age at which most men of the house asked only for a garden. By the summer of 799 he was charting the Canaries and lay off Aguere on Tenerife, where the islanders still went about in goatskins and had never heard the call to prayer. His cousin [Ismāʿīl ibn Muḥammad al-ʿĀbid](person:ismail-ibn-muhammad-al-abid) sailed from Coria on the river for the seas beyond, toward the green cape far down the African coast, and in the summer of 799 he lay off Funchal on Madeira, gathering water for the long run south.\n\nThey were not alone on the Ocean. The ships of Qashtāla were in the sea of the Azores, and the sails of another kingdom had been seen off Madeira. The Christians of the north had begun to look at the Encircling Sea as the Emperor did.\n\n*And We made from water every living thing. Then will they not believe?*"}, {"addr": "800-12-20", "slug": "0800-12-20-of-the-grandsons-and-the-prince-from-benabarre", "n": 71, "bn": 11, "hy": 800, "hm": 12, "hd": 20, "w": 1398, "title": "Of the Grandsons, and the Prince Who Came Home from Benabarre", "date": "1398-09-03", "dateStr": "3 September 1398", "hdateStr": "20 Dhū al-Ḥijja 800", "book": "book-of-the-call", "people": ["saad-ibn-yusuf", "yusuf-ibn-saad", "caterina-de-borja", "alfons-de-borja", "rodrigo-de-borja", "ismail-ibn-saad", "bernarda-of-murcia", "aisha-ottoman", "muhammad-ibn-ismail-ibn-saad", "saad-ibn-ismail-ibn-saad", "saad-ibn-yusuf-ibn-saad", "dua-marinid", "aiman-mamluk"], "places": ["ishbiliyya"], "sources": ["1393-02-24-death-of-alfons", "1398-09-03-the-grandsons", "1398-09-03-yusuf-comes-home"], "words": 590, "catch": "The Emperor's second son, Yūsuf, had married twice: Madīna, of a", "canon": 3, "body": "The Emperor's second son, [Yūsuf](person:yusuf-ibn-saad), had married twice: Madīna, of a house of the Mamlūk lands, and [Caterina](person:caterina-de-borja), daughter of King [Alfons](person:alfons-de-borja) of the Ṭāʾifa of Arghūn. The Christians of the north have a custom that a prince who marries an heiress goes to live at her father's court, and Yūsuf went. By the year 796 he was living at Benabarre in the Aragonese hills, a guest of the house of Borja, and in the spring of 800 he led its soldiers in the field. King Alfons had died in Rabīʿ al-Thānī 795, and his son [Rodrigo](person:rodrigo-de-borja), a boy of eleven then, had worn the little crown since. Rodrigo had no son, and Caterina was his heir.\n\nSo the old quarrel of the harem ended without anyone winning it. [Duʿāʾ](person:dua-marinid) and [Aiman](person:aiman-mamluk), who had fought for the better part of twenty years over whose son would inherit, were both in their graves. The crown prince [Ismāʿīl](person:ismail-ibn-saad) was heir beyond dispute, and his brother was across the mountains. But the question did not die. It went down a generation.\n\nIsmāʿīl had three sons. The eldest, [Muḥammad](person:muhammad-ibn-ismail-ibn-saad), son of [Bernarda](person:bernarda-of-murcia) of Mursiyya, was twelve, stubborn and slow, and his tutors had given up making excuses for him. The second, [Saʿd](person:saad-ibn-ismail-ibn-saad), son of the Ottoman princess [ʿĀʾisha](person:aisha-ottoman), was six. He was quick, he loved his books, and he had been given the costliest teachers in the realm. The third, Aḥmad, was four and wanted everything his brothers had. By the law of the house, which the Emperor had inherited and never changed, the crown would pass from Ismāʿīl to Muḥammad.\n\nThen there was Yūsuf's son, another [Saʿd](person:saad-ibn-yusuf-ibn-saad), born at Benabarre in Rabīʿ al-Thānī 796 to the heiress of Arghūn. He was four, and his teachers wrote that they had never seen a child like him. The old men of the court remembered another boy named Saʿd of whom the same had been said, fifty years before, and they looked at the Emperor when they said it. The Emperor did not hide that he had grown fond of the boy. He stood sixth in the line of succession.\n\nThe law could be changed. A sultan of the house could name whichever son he chose, as the caliphs had done. But a crown that changed its law for a favourite would shake the realm from end to end, and the realm had only just steadied itself after the giving of the ṭāʾifas. The umarāʾ would ask what other law the Emperor might change for his pleasure. The Emperor had spent thirty-five years telling the qāḍīs, the counts and the tax-farmers that the law bound everyone, and he would not now make himself the exception. He left the law as it stood. If Ismāʿīl's son Saʿd grew into a man fit to rule, the question would wait for Ismāʿīl's reign. If not, the Emperor would decide it himself, and pay the price.\n\nWhat he did not leave was the boy. In Dhū al-Ḥijja 800 he sent to Benabarre and called his son Yūsuf home to [Ishbīliya](place:ishbiliyya), and the little Saʿd with him, to be raised at his grandfather's court and under his grandfather's eye. Caterina stayed at her brother's court, with child by Yūsuf again. The crown prince welcomed his brother and his nephew with the fairest words in the dīwān, and everyone who heard them agreed that nobody could have said it better.\n\n*Our Lord, grant us from among our wives and offspring comfort to our eyes, and make us a leader for the righteous.*"}, {"addr": "805-12-27", "slug": "0805-12-27-of-the-prospectors-and-the-jamaa-of-the-markets", "n": 72, "bn": 5, "hy": 805, "hm": 12, "hd": 27, "w": 1403, "title": "Of the Prospectors, the Silver of Qusanṭīna, and the Jamāʿa of the Markets", "date": "1403-07-18", "dateStr": "18 July 1403", "hdateStr": "27 Dhū al-Ḥijja 805", "book": "book-of-the-encircling-sea", "people": ["saad-ibn-yusuf", "khalid-ibn-yahya"], "places": ["ishbiliyya", "qusantina", "istijja"], "sources": ["1402-01-17-highland-prospecting-survey", "1402-01-18-prospecting-commission", "1402-03-09-iron-at-al-iskuriyal", "1402-04-26-silver-at-qusantina", "1402-06-11-gems-at-qrabaqa", "1402-08-03-survey-returns", "1402-08-burghers-privileges", "1402-08-the-umara", "1402-09-jamaa-of-the-markets", "1402-09-jewellery-charter", "1403-07-18-state"], "words": 701, "catch": "The hills of al-Andalus had fed the caliphs with silver and", "canon": 3, "body": "The hills of al-Andalus had fed the caliphs with silver and iron, and the Emperor [Saʿd](person:saad-ibn-yusuf) wanted to know what they still held. In Jumādā al-Ākhira 804 he sent a survey into the highlands: prospectors to walk the streambeds and hammer the outcrops, and assayers to test what they found. He gave the command to [Khālid ibn Yaḥyā Raḥḥū](person:khalid-ibn-yahya), fifty-nine years old, son of the captain of the Volunteers of the Faith, once of the dīwān and once the general who won the second half of the Marīnid war. Khālid had a builder's training and a soldier's legs, and he was the man the court sent whenever no prince of the house could go himself. When the treasurers asked how much the assayers might spend, the Emperor told them to spare nothing: a survey done cheaply would find only what it was paid to find.\n\nThe first find was a warning. At Almonaster in the Sierra a new copper prospect was set to roast its first heap of ore, and it gave off a yellow smoke that drove the men off the slope and withered the grass downwind. The farmers of the valley brought a complaint to the governor. The metallurgist offered to build kilns that would keep the smoke in, at a cost no one had counted. The court sided with the farmers, and the copper was left in the ground.\n\nThe hills paid for it afterwards. In Shaʿbān the prospectors found a seam of iron at al-Iskuriyāl in the Guadarrama, the rock streaked black and red and running deep into the mountain, where the headman's grandfather had spoken of old workings. In Ramaḍān they found silver at [Qusanṭīna](place:qusantina), the old silver town of the house of Naṣr: a vein wide enough to swing a pick in, so pure it could be polished straight from the rock. In Dhū al-Qaʿda, at Qrabaqa, they traced a scatter of bright gravel up a streambed to a pocket of crystal in the hillside, and the lapidaries called the stones exceptional. The Emperor ordered all three kept quiet. A merchant who tells the market what he has found, he said, sells it for less. Khālid's men came home to [Ishbīliya](place:ishbiliyya) in Muḥarram 805, after seven months in the hills, and the finds had already repaid the assayers nearly three times over.\n\nSilver needed coiners, and the Emperor gave the coinage to the burghers. They would strike good coin of honest weight from the new silver and gold, under the eye of the Ḥisba, and with it they were given grants to raise the cities. The burghers were delighted. The umarāʾ were not, nor were the ʿulamāʾ and the dhimmīs, and of all the estates the nobles were now the least content. The court sent them gifts to keep their
