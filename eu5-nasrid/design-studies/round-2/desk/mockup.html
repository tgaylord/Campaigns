g of the State", "words": 380, "text": "And whoever puts his trust in Allāh, He suffices him.", "ref": "65:3", "sura": 65, "suraName": "al-Ṭalāq", "ayat": [3], "pos": "closes", "theme": "signs and providence"}, {"file": "0740-05-05-the-day-of-uryula", "title": "Of the Day of Uryūla", "date": "1339-11-08", "west": "8 November 1339", "hijri": "5 Jumādā al-Ūlā 740", "book": "The Mending of the State", "words": 265, "text": "And victory comes only from Allāh, the Mighty, the Wise.", "ref": "3:126", "sura": 3, "suraName": "Āl ʿImrān", "ayat": [126], "pos": "closes", "theme": "war and victory"}, {"file": "0741-01-05-the-second-battle-of-uryula", "title": "Of the Winter before Uryūla, the Closing of the Road, and the Second Battle", "date": "1340-07-01", "west": "1 July 1340", "hijri": "5 Muḥarram 741", "book": "The Mending of the State", "words": 351, "text": "Our Lord, pour upon us patience and plant firmly our feet and give us victory over the disbelieving people.", "ref": "2:250", "sura": 2, "suraName": "al-Baqara", "ayat": [250], "pos": "closes", "theme": "war and victory"}, {"file": "0741-02-16-the-peace-of-balansiyya", "title": "Of the Bluff before Shāṭiba, and the Peace of Balansiyya", "date": "1340-08-11", "west": "11 August 1340", "hijri": "16 Ṣafar 741", "book": "The Mending of the State", "words": 427, "text": "Say: O Allāh, Owner of Sovereignty, You give sovereignty to whom You will.", "ref": "3:26", "sura": 3, "suraName": "Āl ʿImrān", "ayat": [26], "pos": "closes", "theme": "sovereignty"}, {"file": "0741-02-28-the-two-taifas", "title": "Of the Two Ṭāʾifas", "date": "1340-08-23", "west": "23 August 1340", "hijri": "28 Ṣafar 741", "book": "The Mending of the State", "words": 461, "text": "Allāh does not change the condition of a people until they change what is in themselves.", "ref": "13:11", "sura": 13, "suraName": "al-Raʿd", "ayat": [11], "pos": "closes", "theme": "sovereignty"}, {"file": "0741-05-06-the-marinids-lose-the-shore", "title": "Of the Marīnids' Defeat, and the Shore They Lost", "date": "1340-10-28", "west": "28 October 1340", "hijri": "6 Jumādā al-Ūlā 741", "book": "The Mending of the State", "words": 385, "text": "And these days We alternate among the people.", "ref": "3:140", "sura": 3, "suraName": "Āl ʿImrān", "ayat": [140], "pos": "closes", "theme": "trial and patience"}, {"file": "0742-03-25-the-defection-of-ibn-al-khatib", "title": "Of the Defection of Ibn al-Khaṭīb", "date": "1341-09-08", "west": "8 September 1341", "hijri": "25 Rabīʿ al-Awwal 742", "book": "The Mending of the State", "words": 478, "text": "Our Lord, let not our hearts deviate after You have guided us.", "ref": "3:8", "sura": 3, "suraName": "Āl ʿImrān", "ayat": [8], "pos": "closes", "theme": "signs and providence"}, {"file": "0743-12-24-the-lean-years", "title": "Of the Lean Years, the Gold of Tūnis, and the Royal Decree", "date": "1343-05-20", "west": "20 May 1343", "hijri": "24 Dhū al-Ḥijja 743", "book": "The Mending of the State", "words": 559, "text": "And whoever fears Allāh, He will make for him a way out, and will provide for him from where he does not expect.", "ref": "65:2-3", "sura": 65, "suraName": "al-Ṭalāq", "ayat": [2, 3], "pos": "closes", "theme": "signs and providence"}, {"file": "0745-06-02-the-jamaa-of-744", "title": "Of the Jamāʿa of 744, the Sultan's Marriage, and the Crown Strengthened", "date": "1344-10-11", "west": "11 October 1344", "hijri": "2 Jumādā al-Ākhira 745", "book": "The Mending of the State", "words": 538, "text": "And of His signs is that He created for you from yourselves mates that you may find tranquillity in them, and He placed between you affection and mercy.", "ref": "30:21", "sura": 30, "suraName": "al-Rūm", "ayat": [21], "pos": "closes", "theme": "kin and marriage"}, {"file": "0747-06-28-the-debt-paid", "title": "Of the Unquiet Years, the Debt Paid, and the End of the Mending", "date": "1346-10-16", "west": "16 October 1346", "hijri": "28 Jumādā al-Ākhira 747", "book": "The Mending of the State", "words": 515, "text": "So verily, with hardship there is ease. Verily, with hardship there is ease.", "ref": "94:5-6", "sura": 94, "suraName": "al-Sharḥ", "ayat": [5, 6], "pos": "closes", "theme": "trial and patience"}, {"file": "0747-07-01-the-houses-of-healing", "title": "Of the Rumour out of the East, and the Houses of Healing", "date": "1346-10-18", "west": "18 October 1346", "hijri": "1 Rajab 747", "book": "The Pestilence", "words": 373, "text": "No disaster strikes upon the earth or among yourselves except that it is in a register before We bring it into being. Indeed that, for Allāh, is easy.", "ref": "57:22", "sura": 57, "suraName": "al-Ḥadīd", "ayat": [22], "pos": "closes", "theme": "trial and patience"}, {"file": "0747-07-01-the-summons-of-the-marinids", "title": "Of the Summons of the Marīnids, and the Volunteers' Return", "date": "1346-10-18", "west": "18 October 1346", "hijri": "1 Rajab 747", "book": "The Balance", "words": 500, "text": "And the heaven He raised and imposed the balance, that you not transgress within the balance.", "ref": "55:7-8", "sura": 55, "suraName": "al-Raḥmān", "ayat": [7, 8], "pos": "opens", "theme": "signs and providence"}, {"file": "0748-02-06-the-day-of-jayyan", "title": "Of the Day of Jayyān", "date": "1347-05-18", "west": "18 May 1347", "hijri": "6 Ṣafar 748", "book": "The Balance", "words": 453, "text": "Truth has come, and falsehood has departed. Indeed, falsehood is ever bound to depart.", "ref": "17:81", "sura": 17, "suraName": "al-Isrāʾ", "ayat": [81], "pos": "closes", "theme": "signs and providence"}, {"file": "0748-05-23-of-al-qusayr-and-balma", "title": "Of al-Quṣayr and Balma", "date": "1347-08-31", "west": "31 August 1347", "hijri": "23 Jumādā al-Ūlā 748", "book": "The Balance", "words": 471, "text": "If Allāh should aid you, no one can overcome you.", "ref": "3:160", "sura": 3, "suraName": "Āl ʿImrān", "ayat": [160], "pos": "closes", "theme": "war and victory"}, {"file": "0748-09-09-of-muntil-and-the-gate-of-qurtuba", "title": "Of Munṭīl, and the Gate of Qurṭuba", "date": "1347-12-13", "west": "13 December 1347", "hijri": "9 Ramaḍān 748", "book": "The Balance", "words": 389, "text": "How many a small company has overcome a large company by permission of Allāh.", "ref": "2:249", "sura": 2, "suraName": "al-Baqara", "ayat": [249], "pos": "closes", "theme": "war and victory"}, {"file": "0748-10-15-the-birth-of-saad", "title": "Of the Birth of Saʿd", "date": "1348-01-18", "west": "18 January 1348", "hijri": "15 Shawwāl 748", "book": "The Balance", "words": 294, "text": "Wealth and children are the adornment of the life of this world.", "ref": "18:46", "sura": 18, "suraName": "al-Kahf", "ayat": [46], "pos": "closes", "theme": "kin and marriage"}, {"file": "0749-02-15-the-coming-of-the-pestilence", "title": "Of the Coming of the Pestilence", "date": "1348-05-15", "west": "15 May 1348", "hijri": "15 Ṣafar 749", "book": "The Pestilence", "words": 436, "text": "Wherever you may be, death will overtake you, even if you should be within towers of lofty construction.", "ref": "4:78", "sura": 4, "suraName": "al-Nisāʾ", "ayat": [78], "pos": "closes", "theme": "death"}, {"file": "0749-04-03-the-madman-and-the-flame", "title": "Of the Madman at al-Manṣūra, and the Flame the Turks would not Rekindle", "date": "1348-07-01", "west": "1 July 1348", "hijri": "3 Rabīʿ al-Thānī 749", "book": "The Balance", "words": 479, "text": "And it is not for a soul to die except by permission of Allāh at a decree determined.", "ref": "3:145", "sura": 3, "suraName": "Āl ʿImrān", "ayat": [145], "pos": "closes", "theme": "death"}, {"file": "0749-11-07-the-peace-of-qurtuba", "title": "Of the Peace of Qurṭuba", "date": "1349-01-27", "west": "27 January 1349", "hijri": "7 Dhū al-Qaʿda 749", "book": "The Balance", "words": 558, "text": "And if they incline to peace, then incline to it also, and rely upon Allāh.", "ref": "8:61", "sura": 8, "suraName": "al-Anfāl", "ayat": [61], "pos": "closes", "theme": "peace and brotherhood"}, {"file": "0750-03-16-the-embassy-to-al-qahira", "title": "Of the Foundations on the Sabīka, and the Embassy to al-Qāhira", "date": "1349-06-04", "west": "4 June 1349", "hijri": "16 Rabīʿ al-Awwal 750", "book": "The Balance", "words": 472, "text": "The believers are but brothers, so make settlement between your brothers.", "ref": "49:10", "sura": 49, "suraName": "al-Ḥujurāt", "ayat": [10], "pos": "closes", "theme": "peace and brotherhood"}, {"file": "0750-08-24-the-great-dying", "title": "Of the Great Dying", "date": "1349-11-07", "west": "7 November 1349", "hijri": "24 Shaʿbān 750", "book": "The Pestilence", "words": 344, "text": "Indeed we belong to Allāh, and indeed to Him we will return.", "ref": "2:156", "sura": 2, "suraName": "al-Baqara", "ayat": [156], "pos": "closes", "theme": "death"}, {"file": "0751-06-28-the-emptied-cities", "title": "Of the Emptied Cities", "date": "1350-09-02", "west": "2 September 1350", "hijri": "28 Jumādā al-Ākhira 751", "book": "The Pestilence", "words": 526, "text": "In order that you not despair over what has eluded you and not exult over what He has given you. And Allāh does not like everyone self-deluded and boastful.", "ref": "57:23", "sura": 57, "suraName": "al-Ḥadīd", "ayat": [23], "pos": "closes", "theme": "trial and patience"}, {"file": "0751-11-20-the-prodigy-and-the-daughter-of-cairo", "title": "Of the Prodigy, and the Daughter of al-Qāhira", "date": "1351-01-19", "west": "19 January 1351", "hijri": "20 Dhū al-Qaʿda 751", "book": "The Balance", "words": 405, "text": "He gives wisdom to whom He wills, and whoever has been given wisdom has certainly been given much good.", "ref": "2:269", "sura": 2, "suraName": "al-Baqara", "ayat": [269], "pos": "closes", "theme": "knowledge"}, {"file": "0752-04-07-the-silver-of-qusantina", "title": "Of the Silver of Qusanṭīna, and the Surrender of the Marīnids", "date": "1351-06-03", "west": "3 June 1351", "hijri": "7 Rabīʿ al-Thānī 752", "book": "The Balance", "words": 498, "text": "And Allāh is predominant over His affair, but most of the people do not know.", "ref": "12:21", "sura": 12, "suraName": "Yūsuf", "ayat": [21], "pos": "closes", "theme": "sovereignty"}, {"file": "0752-12-09-the-departing-of-the-pestilence", "title": "Of the Departing of the Pestilence", "date": "1352-01-27", "west": "27 January 1352", "hijri": "9 Dhū al-Ḥijja 752", "book": "The Pestilence", "words": 434, "text": "And We will surely test you with something of fear and hunger and a loss of wealth and lives and fruits, but give good tidings to the patient.", "ref": "2:155", "sura": 2, "suraName": "al-Baqara", "ayat": [155], "pos": "closes", "theme": "trial and patience"}, {"file": "0753-02-20-the-royal-hajj", "title": "Of the Royal Ḥajj", "date": "1352-04-07", "west": "7 April 1352", "hijri": "20 Ṣafar 753", "book": "The Balance", "words": 640, "text": "Our Lord, give us in this world good and in the Hereafter good, and protect us from the punishment of the Fire.", "ref": "2:201", "sura": 2, "suraName": "al-Baqara", "ayat": [201], "pos": "closes", "theme": "signs and providence"}, {"file": "0753-02-20-the-works-of-the-regency", "title": "Of the Works of the Regency, the Thought of Qurṭuba, and the Murmuring of the Castilians", "date": "1352-04-07", "west": "7 April 1352", "hijri": "20 Ṣafar 753", "book": "The Balance", "words": 840, "text": "And hold firmly to the rope of Allāh all together, and do not become divided.", "ref": "3:103", "sura": 3, "suraName": "Āl ʿImrān", "ayat": [103], "pos": "closes", "theme": "signs and providence"}, {"file": "0754-06-02-the-kingdom-of-ishbiliyya", "title": "Of the So-Called Kingdom of Ishbīliya, and the Old Border Reaffirmed", "date": "1353-07-05", "west": "5 July 1353", "hijri": "2 Jumādā al-Ākhira 754", "book": "The Balance", "words": 603, "text": "Perhaps you dislike a thing and it is good for you, and perhaps you love a thing and it is bad for you. And Allāh knows, while you know not.", "ref": "2:216", "sura": 2, "suraName": "al-Baqara", "ayat": [216], "pos": "closes", "theme": "trial and patience"}, {"file": "0756-03-04-the-governor-and-the-harem", "title": "Of the Governor of Qurṭuba, and the Brides from Across the Sea", "date": "1355-03-19", "west": "19 March 1355", "hijri": "4 Rabīʿ al-Awwal 756", "book": "The Balance", "words": 583, "text": "And Allāh has made for you from yourselves mates and has made for you from your mates sons and grandchildren.", "ref": "16:72", "sura": 16, "suraName": "al-Naḥl", "ayat": [72], "pos": "closes", "theme": "kin and marriage"}, {"file": "0758-07-12-roads-libraries-and-the-weavers", "title": "Of Roads, Libraries, and the Charter of the Weavers", "date": "1357-07-01", "west": "1 July 1357", "hijri": "12 Rajab 758", "book": "The Call", "words": 506, "text": "Read, and your Lord is the most Generous, who taught by the pen, taught man that which he knew not.", "ref": "96:3-5", "sura": 96, "suraName": "al-ʿAlaq", "ayat": [3, 4, 5], "pos": "closes", "theme": "knowledge"}, {"file": "0759-09-02-the-great-madrasa-of-qurtuba", "title": "Of the Great Madrasa of Qurṭuba, and the Foreign Wisdom", "date": "1358-08-08", "west": "8 August 1358", "hijri": "2 Ramaḍān 759", "book": "The Call", "words": 561, "text": "Allāh raises those who have believed among you and those who were given knowledge, by degrees.", "ref": "58:11", "sura": 58, "suraName": "al-Mujādila", "ayat": [11], "pos": "closes", "theme": "knowledge"}, {"file": "0763-10-07-the-marinid-demand", "title": "Of the Marīnid Demand, and the Peace Bought with a Warning", "date": "1362-07-30", "west": "30 July 1362", "hijri": "7 Shawwāl 763", "book": "The Balance", "words": 809, "text": "So do not weaken and call for peace while you are superior; and Allāh is with you and will never deprive you of the reward of your deeds.", "ref": "47:35", "sura": 47, "suraName": "Muḥammad", "ayat": [35], "pos": "closes", "theme": "trial and patience"}, {"file": "0764-10-19-the-death-of-al-hajj-yusuf", "title": "Of the March into the West, and the Death of al-Ḥājj Yūsuf", "date": "1363-08-01", "west": "1 August 1363", "hijri": "19 Shawwāl 764", "book": "The Balance", "words": 493, "text": "Every soul will taste death, and you will only be given your full reward on the Day of Resurrection.", "ref": "3:185", "sura": 3, "suraName": "Āl ʿImrān", "ayat": [185], "pos": "closes", "theme": "death"}, {"file": "0765-08-16-the-regent-who-did-not-last", "title": "Of the Regent Who Did Not Last, and the Sultan's Second Wife", "date": "1364-05-19", "west": "19 May 1364", "hijri": "16 Shaʿbān 765", "book": "The Balance", "words": 531, "text": "Allāh wants to lighten for you your difficulties; and mankind was created weak.", "ref": "4:28", "sura": 4, "suraName": "al-Nisāʾ", "ayat": [28], "pos": "closes", "theme": "trial and patience"}, {"file": "0765-12-13-zafra-and-the-walls-of-lisbon", "title": "Of Zafra and the Walls of al-Ushbūna, and the Peace with Portugal", "date": "1364-09-11", "west": "11 September 1364", "hijri": "13 Dhū al-Ḥijja 765", "book": "The Balance", "words": 528, "text": "And you did not kill them, but it was Allāh who killed them. And you threw not when you threw, but it was Allāh who threw.", "ref": "8:17", "sura": 8, "suraName": "al-Anfāl", "ayat": [17], "pos": "closes", "theme": "war and victory"}, {"file": "0767-07-23-the-peace-of-independence", "title": "Of the Conqueror, the Renegade at San Clemente, and the Peace of Independence", "date": "1366-04-05", "west": "5 April 1366", "hijri": "23 Rajab 767", "book": "The Balance", "words": 549, "text": "Indeed, We have given you a clear conquest.", "ref": "48:1", "sura": 48, "suraName": "al-Fatḥ", "ayat": [1], "pos": "closes", "theme": "war and victory"}, {"file": "0768-01-26-the-slow-return", "title": "Of the Slow Return, and the Day Qurṭuba Turned", "date": "1366-10-02", "west": "2 October 1366", "hijri": "26 Muḥarram 768", "book": "The Call", "words": 560, "text": "There is no compulsion in religion. The right way has become distinct from the wrong.", "ref": "2:256", "sura": 2, "suraName": "al-Baqara", "ayat": [256], "pos": "closes", "theme": "peace and brotherhood"}, {"file": "0770-03-11-the-marinids-on-the-northern-shore", "title": "Of the Marīnids on the Northern Shore, and the Second Demand of Fās", "date": "1368-10-24", "west": "24 October 1368", "hijri": "11 Rabīʿ al-Awwal 770", "book": "The Balance", "words": 504, "text": "Permission to fight has been given to those who are fought against, because they were wronged. And indeed, Allāh is competent to give them victory.", "ref": "22:39", "sura": 22, "suraName": "al-Ḥajj", "ayat": [39], "pos": "closes", "theme": "war and victory"}, {"file": "0770-07-21-the-first-winter", "title": "Of the First Winter, When the Sultan of Fās Was Beaten at Qādis", "date": "1369-03-01", "west": "1 March 1369", "hijri": "21 Rajab 770", "book": "The Balance", "words": 521, "text": "And remember when you were few and oppressed in the land, fearing that people might abduct you, but He sheltered you, supported you with His victory, and provided you with good things.", "ref": "8:26", "sura": 8, "suraName": "al-Anfāl", "ayat": [26], "pos": "closes", "theme": "war and victory"}, {"file": "0771-04-17-the-year-of-the-counterattack", "title": "Of the Year of the Counterattack, and the Line at Antaqīra", "date": "1369-11-18", "west": "18 November 1369", "hijri": "17 Rabīʿ al-Thānī 771", "book": "The Balance", "words": 658, "text": "O you who have believed, when you encounter a company, stand firm and remember Allāh much, that you may be successful.", "ref": "8:45", "sura": 8, "suraName": "al-Anfāl", "ayat": [45], "pos": "closes", "theme": "war and victory"}, {"file": "0772-02-20-the-reckoning-of-the-faithful", "title": "Of the Reckoning of the Faithful, in the Year the Strait Was Won", "date": "1370-09-13", "west": "13 September 1370", "hijri": "20 Ṣafar 772", "book": "The Call", "words": 473, "text": "And say: The truth has come, and falsehood has departed. Indeed, falsehood is ever bound to depart.", "ref": "17:81", "sura": 17, "suraName": "al-Isrāʾ", "ayat": [81], "pos": "closes", "theme": "signs and providence"}, {"file": "0772-02-21-the-throne-that-endures", "title": "Of the Last Battles, the Peace of the Northern Shore, and the Throne That Endures", "date": "1370-09-14", "west": "14 September 1370", "hijri": "21 Ṣafar 772", "book": "The Balance", "words": 668, "text": "For indeed, with hardship comes ease. Indeed, with hardship comes ease.", "ref": "94:5-6", "sura": 94, "suraName": "al-Sharḥ", "ayat": [5, 6], "pos": "closes", "theme": "trial and patience"}, {"file": "0772-02-22-of-the-three-marches", "title": "Of the Three Marches, and What Lies North of Them", "date": "1370-09-15", "west": "15 September 1370", "hijri": "22 Ṣafar 772", "book": "The Marches", "words": 842, "text": "And We wanted to confer favour upon those who were oppressed in the land and make them leaders and make them inheritors.", "ref": "28:5", "sura": 28, "suraName": "al-Qaṣaṣ", "ayat": [5], "pos": "closes", "theme": "sovereignty"}, {"file": "0772-02-27-the-survey-of-the-kingdoms", "title": "The Survey of the Kingdoms, After the Manner of the Roads of the Eyes", "date": "1370-09-20", "west": "20 September 1370", "hijri": "27 Ṣafar 772", "book": "The Marches", "words": 1131, "text": "O mankind, We have created you from male and female and made you peoples and tribes, that you may know one another.", "ref": "49:13", "sura": 49, "suraName": "al-Ḥujurāt", "ayat": [13], "pos": "closes", "theme": "signs and providence"}, {"file": "0772-08-07-the-moneylenders-of-ishbiliya", "title": "Of the Towns of the North, and the Moneylenders of Ishbīliya", "date": "1371-02-24", "west": "24 February 1371", "hijri": "7 Shaʿbān 772", "book": "The Call", "words": 674, "text": "O you who have believed, do not consume one another's wealth unjustly, but only in lawful business by mutual consent.", "ref": "4:29", "sura": 4, "suraName": "al-Nisāʾ", "ayat": [29], "pos": "closes", "theme": "justice and trade"}, {"file": "0775-09-06-the-battle-before-barshaluna", "title": "Of the March into the Upper March, and the Battle Before the Walls of Barshalūna", "date": "1374-02-19", "west": "19 February 1374", "hijri": "6 Ramaḍān 775", "book": "The Marches", "words": 853, "text": "And already had Allāh given you victory at Badr while you were few. So fear Allāh, that you may be grateful.", "ref": "3:123", "sura": 3, "suraName": "Āl ʿImrān", "ayat": [123], "pos": "closes", "theme": "war and victory"}, {"file": "0775-09-24-the-pursuit-to-tarrakuna", "title": "Of the Pursuit to Ṭarrakūna", "date": "1374-03-09", "west": "9 March 1374", "hijri": "24 Ramaḍān 775", "book": "The Marches", "words": 449, "text": "So they defeated them by permission of Allāh.", "ref": "2:251", "sura": 2, "suraName": "al-Baqara", "ayat": [251], "pos": "closes", "theme": "war and victory"}, {"file": "0775-11-19-the-regency-of-dua", "title": "Of Duʿāʾ's Regency, and the Tithe Given to the ʿUlamāʾ", "date": "1374-05-02", "west": "2 May 1374", "hijri": "19 Dhū al-Qaʿda 775", "book": "The Call", "words": 464, "text": "And consult them in the matter; then when you have decided, rely upon Allāh.", "ref": "3:159", "sura": 3, "suraName": "Āl ʿImrān", "ayat": [159], "pos": "closes", "theme": "justice and trade"}, {"file": "0776-08-02-of-the-siege-of-barshaluna", "title": "Of the Siege of Barshalūna, the Taking of Māliṭa, and the Two Princes", "date": "1375-01-06", "west": "6 January 1375", "hijri": "2 Shaʿbān 776", "book": "The Marches", "words": 656, "text": "The believing men and believing women are allies of one another.", "ref": "9:71", "sura": 9, "suraName": "al-Tawba", "ayat": [71], "pos": "closes", "theme": "peace and brotherhood"}, {"file": "0776-10-11-of-the-peace-of-the-upper-march", "title": "Of the Peace of the Upper March, and the End of Arghūn", "date": "1375-03-15", "west": "15 March 1375", "hijri": "11 Shawwāl 776", "book": "The Marches", "words": 863, "text": "But if they intend to deceive you, then sufficient for you is Allāh. It is He who supported you with His help and with the believers.", "ref": "8:62", "sura": 8, "suraName": "al-Anfāl", "ayat": [62], "pos": "closes", "theme": "signs and providence"}, {"file": "0776-10-12-of-the-restoration-of-al-andalus", "title": "Of the Reordering of the Realm, and the Restoration of al-Andalus", "date": "1375-03-16", "west": "16 March 1375", "hijri": "12 Shawwāl 776", "book": "The Marches", "words": 788, "text": "Say: O Allāh, Owner of sovereignty, You give sovereignty to whom You will, and You take sovereignty away from whom You will.", "ref": "3:26", "sura": 3, "suraName": "Āl ʿImrān", "ayat": [26], "pos": "closes", "theme": "sovereignty"}, {"file": "0777-08-20-of-the-war-of-restoration-and-the-day-of-shalba", "title": "Of the War of the Aragonese Restoration, and the Day of Shalba", "date": "1376-01-14", "west": "14 January 1376", "hijri": "20 Shaʿbān 777", "book": "The Marches", "words": 763, "text": "If a wound has touched you, a wound like it has touched the others. These are the days We alternate among the people.", "ref": "3:140", "sura": 3, "suraName": "Āl ʿImrān", "ayat": [140], "pos": "closes", "theme": "trial and patience"}, {"file": "0778-04-15-of-the-mercenaries-and-the-slaughter-at-agramunt", "title": "Of Defeat in Detail, the Mercenaries of the Marches, and the Slaughter at Agramunt", "date": "1376-09-01", "west": "1 September 1376", "hijri": "15 Rabīʿ al-Thānī 778", "book": "The Marches", "words": 726, "text": "And prepare against them whatever you are able of power and of steeds of war, by which you may terrify the enemy of Allāh and your enemy.", "ref": "8:60", "sura": 8, "suraName": "al-Anfāl", "ayat": [60], "pos": "closes", "theme": "war and victory"}, {"file": "0779-12-07-of-saraqusta-and-the-peace-of-the-restoration", "title": "Of Saraqusṭa, the Day of Shalūqa, and the Peace of the Restoration", "date": "1378-04-06", "west": "6 April 1378", "hijri": "7 Dhū al-Ḥijja 779", "book": "The Marches", "words": 955, "text": "And another favour that you love: victory from Allāh and an imminent conquest; and give good tidings to the believers.", "ref": "61:13", "sura": 61, "suraName": "al-Ṣaff", "ayat": [13], "pos": "closes", "theme": "war and victory"}, {"file": "0780-01-02-of-tulaytula-and-the-count-of-the-christians", "title": "Of Ṭulayṭula, the Gem of Iberia, and the Count of the Christians", "date": "1378-05-01", "west": "1 May 1378", "hijri": "2 Muḥarram 780", "book": "The Call", "words": 697, "text": "O mankind, We created you from a male and a female, and made you peoples and tribes so that you may know one another.", "ref": "49:13", "sura": 49, "suraName": "al-Ḥujurāt", "ayat": [13], "pos": "closes", "theme": "signs and providence"}, {"file": "0781-08-13-of-the-move-to-ishbiliya", "title": "Of the Jamāʿa of 781, and the Court's Removal to Ishbīliya", "date": "1379-11-24", "west": "24 November 1379", "hijri": "13 Shaʿbān 781", "book": "The Encircling Sea", "words": 549, "text": "It is He who made the earth tame for you, so walk among its slopes and eat of His provision.", "ref": "67:15", "sura": 67, "suraName": "al-Mulk", "ayat": [15], "pos": "closes", "theme": "signs and providence"}, {"file": "0785-02-26-of-the-kingdom-of-tulaytula", "title": "Of the Deaths of Sayyida and Abū ʿInān, and the So-Called Kingdom of Ṭulayṭula", "date": "1383-04-30", "west": "30 April 1383", "hijri": "26 Ṣafar 785", "book": "The Marches", "words": 491, "text": "So do not weaken and do not grieve, and you will be superior if you are believers.", "ref": "3:139", "sura": 3, "suraName": "Āl ʿImrān", "ayat": [139], "pos": "closes", "theme": "trial and patience"}, {"file": "0787-12-04-of-the-pilgrimage-that-came-too-late", "title": "Of the County of Teruel, and the Pilgrimage That Came Too Late", "date": "1386-01-06", "west": "6 January 1386", "hijri": "4 Dhū al-Ḥijja 787", "book": "The Call", "words": 580, "text": "But perhaps you hate a thing and it is good for you; and Allāh knows, while you know not.", "ref": "2:216", "sura": 2, "suraName": "al-Baqara", "ayat": [216], "pos": "closes", "theme": "trial and patience"}, {"file": "0791-08-15-of-the-hijaba-the-hisba-and-the-death-of-dua", "title": "Of the Ḥijāba and the Ḥisba, and the Death of Duʿāʾ", "date": "1389-08-09", "west": "9 August 1389", "hijri": "15 Shaʿbān 791", "book": "The Call", "words": 647, "text": "O reassured soul, return to your Lord, well-pleased and pleasing to Him.", "ref": "89:27-28", "sura": 89, "suraName": "al-Fajr", "ayat": [27, 28], "pos": "closes", "theme": "death"}, {"file": "0794-03-25-of-al-hajj-saad", "title": "Of the Second Pilgrimage, the Death of Aiman, and al-Ḥājj Saʿd", "date": "1392-02-20", "west": "20 February 1392", "hijri": "25 Rabīʿ al-Awwal 794", "book": "The Call", "words": 739, "text": "And pilgrimage to the House is a duty owed to Allāh by all people who are able to find a way there.", "ref": "3:97", "sura": 3, "suraName": "Āl ʿImrān", "ayat": [97], "pos": "closes", "theme": "signs and providence"}, {"file": "0794-03-26-of-the-western-ocean", "title": "Of the Mansa's Merchants, and the Ships Sent into the Western Ocean", "date": "1392-02-21", "west": "21 February 1392", "hijri": "26 Rabīʿ al-Awwal 794", "book": "The Encircling Sea", "words": 407, "text": "And His are the ships raised high in the sea like mountains.", "ref": "55:24", "sura": 55, "suraName": "al-Raḥmān", "ayat": [24], "pos": "closes", "theme": "the sea"}, {"file": "0797-04-12-of-the-days-of-banbaluna-and-ejea", "title": "Of the League, the Ships of Catalonia, and the Days of Banbalūna and Ejea", "date": "1395-02-04", "west": "4 February 1395", "hijri": "12 Rabīʿ al-Thānī 797", "book": "The Marches", "words": 854, "text": "Indeed, Allāh loves those who fight in His cause in a row as though they are a single structure joined firmly.", "ref": "61:4", "sura": 61, "suraName": "al-Ṣaff", "ayat": [4], "pos": "closes", "theme": "war and victory"}, {"file": "0797-09-03-of-portalegre-and-the-peace-of-ramadan", "title": "Of the Stand at Portalegre, and the Peace of Ramaḍān", "date": "1395-06-22", "west": "22 June 1395", "hijri": "3 Ramaḍān 797", "book": "The Marches", "words": 712, "text": "Allāh has promised those among you who believe and do righteous deeds that He will surely make them successors upon the earth, as He made those before them successors.", "ref": "24:55", "sura": 24, "suraName": "al-Nūr", "ayat": [55], "pos": "closes", "theme": "sovereignty"}, {"file": "0797-09-03-of-the-encircling-sea-and-fifteen-years-of-building", "title": "Of the Encircling Sea, and Fifteen Years of Building", "date": "1395-06-22", "west": "22 June 1395", "hijri": "3 Ramaḍān 797", "book": "The Encircling Sea", "words": 745, "text": "And it is He who subjected the sea, that you may eat from it tender meat and bring forth from it ornaments to wear. And you see the ships ploughing through it, that you may seek of His bounty.", "ref": "16:14", "sura": 16, "suraName": "al-Naḥl", "ayat": [14], "pos": "closes", "theme": "the sea"}, {"file": "0797-10-17-of-the-diwan-al-insha-and-the-two-taifas", "title": "Of the Dīwān al-Inshāʾ, the Two Ṭāʾifas, and the Embassies", "date": "1395-08-05", "west": "5 August 1395", "hijri": "17 Shawwāl 797", "book": "The Marches", "words": 681, "text": "Nūn. By the pen and what they inscribe.", "ref": "68:1", "sura": 68, "suraName": "al-Qalam", "ayat": [1], "pos": "closes", "theme": "knowledge"}, {"file": "0799-11-19-of-majrit-the-acequias-and-the-eternal-isles", "title": "Of Majrīṭ, the Acequias, and the Eternal Isles", "date": "1397-08-14", "west": "14 August 1397", "hijri": "19 Dhū al-Qaʿda 799", "book": "The Encircling Sea", "words": 554, "text": "And We made from water every living thing. Then will they not believe?", "ref": "21:30", "sura": 21, "suraName": "al-Anbiyāʾ", "ayat": [30], "pos": "closes", "theme": "signs and providence"}, {"file": "0800-12-20-of-the-grandsons-and-the-prince-from-benabarre", "title": "Of the Grandsons, and the Prince Who Came Home from Benabarre", "date": "1398-09-03", "west": "3 September 1398", "hijri": "20 Dhū al-Ḥijja 800", "book": "The Call", "words": 590, "text": "Our Lord, grant us from among our wives and offspring comfort to our eyes, and make us a leader for the righteous.", "ref": "25:74", "sura": 25, "suraName": "al-Furqān", "ayat": [74], "pos": "closes", "theme": "kin and marriage"}, {"file": "0805-12-27-of-the-prospectors-and-the-jamaa-of-the-markets", "title": "Of the Prospectors, the Silver of Qusanṭīna, and the Jamāʿa of the Markets", "date": "1403-07-18", "west": "18 July 1403", "hijri": "27 Dhū al-Ḥijja 805", "book": "The Encircling Sea", "words": 701, "text": "And give full measure when you measure, and weigh with an even balance. That is the best way and best in result.", "ref": "17:35", "sura": 17, "suraName": "al-Isrāʾ", "ayat": [35], "pos": "closes", "theme": "justice and trade"}, {"file": "0807-04-16-of-the-crusade-of-806-and-the-peace-of-avignon", "title": "Of the Crusade of 806, the March on Avignon, and the Peace of Avignon", "date": "1404-10-22", "west": "22 October 1404", "hijri": "16 Rabīʿ al-Thānī 807", "book": "The Marches", "words": 716, "text": "Fight in the way of Allāh those who fight you, but do not transgress. Indeed, Allāh does not like transgressors.", "ref": "2:190", "sura": 2, "suraName": "al-Baqara", "ayat": [190], "pos": "closes", "theme": "war and victory"}, {"file": "0807-09-16-of-the-risings-of-807-and-the-death-of-the-emperor-saad", "title": "Of the Risings of 807, and the Death of the Emperor Saʿd", "date": "1405-03-18", "west": "18 March 1405", "hijri": "16 Ramaḍān 807", "book": "The Marches", "words": 834, "text": "Everyone upon the earth will perish, and there will remain the Face of your Lord, Owner of Majesty and Honour.", "ref": "55:26-27", "sura": 55, "suraName": "al-Raḥmān", "ayat": [26, 27], "pos": "closes", "theme": "death"}, {"file": "0808-03-06-of-granadilla-the-end-of-the-risings-and-al-gharb", "title": "Of Granadilla, the End of the Risings, and al-Gharb", "date": "1405-09-01", "west": "1 September 1405", "hijri": "6 Rabīʿ al-Awwal 808", "book": "The Marches", "words": 595, "text": "And obey Allāh and His Messenger, and do not dispute, lest you lose courage and your strength depart, and be patient. Indeed, Allāh is with the patient.", "ref": "8:46", "sura": 8, "suraName": "al-Anfāl", "ayat": [46], "pos": "closes", "theme": "signs and providence"}, {"file": "0811-03-12-of-the-old-capital-and-the-sons-of-muhammad", "title": "Of the Old Capital, the Shaykha of Qūnka, and the Sons of Muḥammad", "date": "1408-08-05", "west": "5 August 1408", "hijri": "12 Rabīʿ al-Awwal 811", "book": "The Call", "words": 636, "text": "And those who believed and whose descendants followed them in faith, We will join with them their descendants.", "ref": "52:21", "sura": 52, "suraName": "al-Ṭūr", "ayat": [21], "pos": "closes", "theme": "kin and marriage"}, {"file": "0814-07-14-of-cuellar-porto-and-the-end-of-portugal", "title": "Of the War of Jillīqiya, the Gates of Porto, and the Peace of Rajab", "date": "1411-11-01", "west": "1 November 1411", "hijri": "14 Rajab 814", "book": "The Marches", "words": 1139, "text": "When the victory of Allāh has come and the conquest, and you see the people entering into the religion of Allāh in multitudes, then exalt with praise of your Lord and ask forgiveness of Him.", "ref": "110:1-2", "sura": 110, "suraName": "al-Naṣr", "ayat": [1, 2], "pos": "closes", "theme": "war and victory"}, {"file": "0815-03-14-of-the-captains-of-811-and-the-pepper-of-the-indies", "title": "Of the Captains of 811, and the Pepper of the Indies", "date": "1412-06-24", "west": "24 June 1412", "hijri": "14 Rabīʿ al-Awwal 815", "book": "The Encircling Sea", "words": 515, "text": "Do you not see that the ships sail through the sea by the favour of Allāh, that He may show you of His signs?", "ref": "31:31", "sura": 31, "suraName": "Luqmān", "ayat": [31], "pos": "closes", "theme": "the sea"}, {"file": "0816-01-29-of-the-madrasas-of-815", "title": "Of the Madrasas of 815, and the Children of the House", "date": "1413-05-01", "west": "1 May 1413", "hijri": "29 Muḥarram 816", "book": "The Call", "words": 524, "text": "And say: My Lord, increase me in knowledge.", "ref": "20:114", "sura": 20, "suraName": "Ṭā Hā", "ayat": [114], "pos": "closes", "theme": "knowledge"}, {"file": "0817-08-09-of-the-jamaa-of-817-and-the-landlords-of-the-north", "title": "Of the Jamāʿa of 817, and the Landlords of the North", "date": "1414-10-24", "west": "24 October 1414", "hijri": "9 Shaʿbān 817", "book": "The Marches", "words": 790, "text": "We raise in degrees whom We will, and over every possessor of knowledge is one more knowing.", "ref": "12:76", "sura": 12, "suraName": "Yūsuf", "ayat": [76], "pos": "closes", "theme": "knowledge"}, {"file": "0822-08-10-of-the-universities-the-letter-from-denia-and-the-road-to-balansiyya", "title": "Of the Universities, the Letter from Denia, and the Road to Balansiyya", "date": "1419-09-01", "west": "1 September 1419", "hijri": "10 Shaʿbān 822", "book": "The Call", "words": 699, "text": "And of His signs is the creation of the heavens and the earth and the diversity of your languages and your colours. Indeed in that are signs for those of knowledge.", "ref": "30:22", "sura": 30, "suraName": "al-Rūm", "ayat": [22], "pos": "closes", "theme": "knowledge"}, {"file": "0823-07-21-of-daniel-the-green-cape-and-angra", "title": "Of Daniel, the Green Cape, and Angra", "date": "1420-08-01", "west": "1 August 1420", "hijri": "21 Rajab 823", "book": "The Encircling Sea", "words": 412, "text": "Your Lord is the one who drives the ship for you through the sea that you may seek of His bounty. Indeed, He is ever Merciful to you.", "ref": "17:66", "sura": 17, "suraName": "al-Isrāʾ", "ayat": [66], "pos": "closes", "theme": "the sea"}, {"file": "0823-08-01-of-the-household-of-the-emperor-balansiyya-and-fermoselle", "title": "Of the Household of the Emperor, Balansiyya, and Fermoselle", "date": "1420-08-11", "west": "11 August 1420", "hijri": "1 Shaʿbān 823", "book": "The Marches", "words": 933, "text": "Blessed is He in whose hand is dominion, and He is over all things competent.", "ref": "67:1", "sura": 67, "suraName": "al-Mulk", "ayat": [1], "pos": "closes", "theme": "sovereignty"}, {"file": "0823-08-01-the-second-survey-of-the-kingdoms", "title": "The Second Survey of the Kingdoms, and the Three Empires of the East", "date": "1420-08-11", "west": "11 August 1420", "hijri": "1 Shaʿbān 823", "book": "The Marches", "words": 1156, "text": "And if it were not for Allāh repelling some people by means of others, the earth would have been corrupted, but Allāh is full of bounty to the worlds.", "ref": "2:251", "sura": 2, "suraName": "al-Baqara", "ayat": [251], "pos": "closes", "theme": "signs and providence"}, {"file": "0823-08-25-of-the-petty-kings-of-the-mountains", "title": "Of the Petty Kings of the Mountains", "date": "1420-09-04", "west": "4 September 1420", "hijri": "25 Shaʿbān 823", "book": "The Marches", "words": 546, "text": "Similar situations have passed on before you, so proceed throughout the earth and observe how was the end of those who denied.", "ref": "3:137", "sura": 3, "suraName": "Āl ʿImrān", "ayat": [137], "pos": "closes", "theme": "signs and providence"}, {"file": "0827-09-18-of-the-three-brides-and-the-peace-of-kayseri", "title": "Of the Three Brides, and the Peace of Kayseri", "date": "1424-08-14", "west": "14 August 1424", "hijri": "18 Ramaḍān 827", "book": "The Marches", "words": 785, "text": "And if two factions among the believers should fight, then make settlement between the two.", "ref": "49:9", "sura": 49, "suraName": "al-Ḥujurāt", "ayat": [9], "pos": "closes", "theme": "war and victory"}, {"file": "0831-02-11-of-the-islands-of-the-ocean-and-the-naft-of-ethiopia", "title": "Of the Islands of the Ocean, and the Naft of Ethiopia", "date": "1427-12-01", "west": "1 December 1427", "hijri": "11 Ṣafar 831", "book": "The Encircling Sea", "words": 480, "text": "And He has cast into the earth firmly set mountains, lest it shift with you, and rivers and roads, that you may be guided.", "ref": "16:15", "sura": 16, "suraName": "al-Naḥl", "ayat": [15], "pos": "closes", "theme": "signs and providence"}, {"file": "0831-08-10-of-the-jamaa-of-831-and-the-armouries", "title": "Of the Jamāʿa of 831, the Armouries, and the Spies of the North", "date": "1428-05-25", "west": "25 May 1428", "hijri": "10 Shaʿbān 831", "book": "The Marches", "words": 719, "text": "Indeed, Allāh commands you to render trusts to whom they are due, and when you judge between people, to judge with justice.", "ref": "4:58", "sura": 4, "suraName": "al-Nisāʾ", "ayat": [58], "pos": "closes", "theme": "justice and trade"}, {"file": "0831-08-19-of-the-village-granaries-and-the-road-to-niani", "title": "Of the Village Granaries, and the Road to Niani", "date": "1428-06-03", "west": "3 June 1428", "hijri": "19 Shaʿbān 831", "book": "The Encircling Sea", "words": 519, "text": "He said: You will plant for seven years consecutively; and what you harvest, leave in its spikes, except a little from which you will eat.", "ref": "12:47", "sura": 12, "suraName": "Yūsuf", "ayat": [47], "pos": "closes", "theme": "signs and providence"}, {"file": "0832-02-22-of-the-english-crown-of-france", "title": "Of the English Crown of France", "date": "1428-12-01", "west": "1 December 1428", "hijri": "22 Ṣafar 832", "book": "The Marches", "words": 548, "text": "The Romans have been defeated, in the nearest land. But they, after their defeat, will overcome, within three to nine years.", "ref": "30:2-4", "sura": 30, "suraName": "al-Rūm", "ayat": [2, 3, 4], "pos": "closes", "theme": "war and victory"}, {"file": "0832-09-25-of-the-death-of-the-emperor-ismail-and-the-two-princes", "title": "Of the Death of the Emperor Ismāʿīl, and the Two Princes", "date": "1429-06-28", "west": "28 June 1429", "hijri": "25 Ramaḍān 832", "book": "The Marches", "words": 968, "text": "And no soul perceives what it will earn tomorrow, and no soul perceives in what land it will die. Indeed, Allāh is Knowing and Acquainted.", "ref": "31:34", "sura": 31, "suraName": "Luqmān", "ayat": [34], "pos": "closes", "theme": "death"}, {"file": "0833-10-23-of-the-war-of-shant-yaqub-and-the-shrine-of-the-apostle", "title": "Of the War of Shant Yāqub, and the Shrine of the Apostle", "date": "1430-07-15", "west": "15 July 1430", "hijri": "23 Shawwāl 833", "book": "The Marches", "words": 989, "text": "And were it not that Allāh checks the people, some by means of others, there would have been demolished monasteries, churches, synagogues, and mosques in which the name of Allāh is much mentioned.", "ref": "22:40", "sura": 22, "suraName": "al-Ḥajj", "ayat": [40], "pos": "closes", "theme": "signs and providence"}, {"file": "0834-02-16-of-the-war-of-the-mountains-and-the-peace-of-safar", "title": "Of the War of the Mountains, and the Peace of Ṣafar", "date": "1430-11-03", "west": "3 November 1430", "hijri": "16 Ṣafar 834", "book": "The Marches", "words": 1050, "text": "It is He who expelled the ones who disbelieved among the People of the Scripture from their homes at the first gathering. You did not think that they would leave, and they thought that their fortresses would protect them from Allāh; but Allāh came upon them from where they had not expected.", "ref": "59:2", "sura": 59, "suraName": "al-Ḥashr", "ayat": [2], "pos": "closes", "theme": "war and victory"}, {"file": "0834-02-16-the-close-of-the-book-of-the-marches", "title": "The Close of the Book of the Marches", "date": "1430-11-03", "west": "3 November 1430", "hijri": "16 Ṣafar 834", "book": "The Marches", "words": 511, "text": "And We have already written in the Book, after the Reminder, that the land is inherited by My righteous servants.", "ref": "21:105", "sura": 21, "suraName": "al-Anbiyāʾ", "ayat": [105], "pos": "closes", "theme": "sovereignty"}, {"file": "0835-08-29-of-the-trading-posts-of-the-gold-coast-and-the-spice-road", "title": "Of the Trading Posts of the Gold Coast, and the Spice Road", "date": "1432-05-01", "west": "1 May 1432", "hijri": "29 Shaʿbān 835", "book": "The Encircling Sea", "words": 389, "text": "For the accustomed security of the Quraysh, their accustomed security in the caravan of winter and of summer, let them worship the Lord of this House, who has fed them against hunger and made them safe from fear.", "ref": "106:1-2", "sura": 106, "suraName": "Quraysh", "ayat": [1, 2], "pos": "closes", "theme": "justice and trade"}, {"file": "0835-08-29-of-the-warmongers-name-the-crusade-of-835-and-the-arsenals", "title": "Of the Warmonger's Name, the Crusade of 835, and the Arsenals", "date": "1432-05-01", "west": "1 May 1432", "hijri": "29 Shaʿbān 835", "book": "The Franks", "words": 1117, "text": "And of His signs are the ships in the sea, like mountains. If He willed, He could still the wind, and they would remain motionless on its surface. Indeed in that are signs for everyone patient and grateful.", "ref": "42:32-33", "sura": 42, "suraName": "al-Shūrā", "ayat": [32, 33], "pos": "closes", "theme": "the sea"}, {"file": "0835-11-28-of-the-peace-of-the-pope-and-the-decree-on-the-taifas", "title": "Of the Peace of the Pope, and the Decree on the Ṭāʾifas", "date": "1432-07-27", "west": "27 July 1432", "hijri": "28 Dhū al-Qaʿda 835", "book": "The Franks", "words": 613, "text": "And had your Lord willed, those on earth would have believed, all of them entirely. Then will you compel the people in order that they become believers?", "ref": "10:99", "sura": 10, "suraName": "Yūnus", "ayat": [99], "pos": "closes", "theme": "peace and brotherhood"}, {"file": "0838-11-04-of-the-emperors-pilgrimage-and-the-sufi-shaykh-al-islam", "title": "Of the Emperor's Pilgrimage, and the Ṣūfī Shaykh al-Islām", "date": "1435-06-01", "west": "1 June 1435", "hijri": "4 Dhū al-Qaʿda 838", "book": "The Call", "words": 612, "text": "Hajj is in the well-known months. And take provisions, but indeed, the best provision is the fear of Allāh. So fear Me, O you of understanding.", "ref": "2:197", "sura": 2, "suraName": "al-Baqara", "ayat": [197], "pos": "closes", "theme": "signs and providence"}, {"file": "0839-10-14-of-the-arsenals-finished-and-the-turn-to-the-sea", "title": "Of the Arsenals Finished, and the Turn to the Sea", "date": "1436-05-01", "west": "1 May 1436", "hijri": "14 Shawwāl 839", "book": "The Encircling Sea", "words": 490, "text": "He released the two seas, meeting side by side; between them is a barrier which neither of them transgresses. So which of the favours of your Lord would you deny? From both of them emerge pearl and coral.", "ref": "55:19-20", "sura": 55, "suraName": "al-Raḥmān", "ayat": [19, 20], "pos": "closes", "theme": "the sea"}, {"file": "0840-08-22-of-barshaluna-returned-the-hegemony-of-letters-and-the-new-world", "title": "Of Barshalūna Returned to the Crown, the Hegemony of Letters, and the New World", "date": "1437-03-01", "west": "1 March 1437", "hijri": "22 Shaʿbān 840", "book": "The Call", "words": 509, "text": "And thus We have made you a middle nation, that you will be witnesses over the people, and the Messenger will be a witness over you.", "ref": "2:143", "sura": 2, "suraName": "al-Baqara", "ayat": [143], "pos": "closes", "theme": "signs and providence"}, {"file": "0841-07-19-of-the-admiral-prince-and-his-three-wives", "title": "Of the Admiral Prince, and His Three Wives", "date": "1438-01-16", "west": "16 January 1438", "hijri": "19 Rajab 841", "book": "The Encircling Sea", "words": 489, "text": "It is He who has made you successors upon the earth and has raised some of you above others in degrees, that He may try you through what He has given you.", "ref": "6:165", "sura": 6, "suraName": "al-Anʿām", "ayat": [165], "pos": "closes", "theme": "sovereignty"}, {"file": "0841-10-12-of-the-charter-of-majrit-and-the-land-rights-of-the-umara", "title": "Of the Charter of Majrīṭ, and the Land Rights of the Umarāʾ", "date": "1438-04-08", "west": "8 April 1438", "hijri": "12 Shawwāl 841", "book": "The Encircling Sea", "words": 398, "text": "Have We not established for them a safe sanctuary, to which are brought the fruits of all things as provision from Us?", "ref": "28:57", "sura": 28, "suraName": "al-Qaṣaṣ", "ayat": [57], "pos": "closes", "theme": "signs and providence"}, {"file": "0843-02-02-of-the-emperor-who-became-a-scholar", "title": "Of the Emperor Who Became a Scholar", "date": "1439-07-15", "west": "15 July 1439", "hijri": "2 Ṣafar 843", "book": "The Call", "words": 413, "text": "Say: Are those who know equal to those who do not know? Only they will remember who are people of understanding.", "ref": "39:9", "sura": 39, "suraName": "al-Zumar", "ayat": [9], "pos": "closes", "theme": "knowledge"}, {"file": "0844-01-09-of-the-trade-war-with-genoa-and-the-angevins", "title": "Of the Trade War with Genoa and the Angevins", "date": "1440-06-10", "west": "10 June 1440", "hijri": "9 Muḥarram 844", "book": "The Franks", "words": 409, "text": "Woe to those who give less than due, who, when they take a measure from people, take in full. But if they give by measure or by weight to them, they cause loss.", "ref": "83:1-3", "sura": 83, "suraName": "al-Muṭaffifīn", "ayat": [1, 2, 3], "pos": "closes", "theme": "justice and trade"}, {"file": "0844-05-04-of-the-radiant-city-restored", "title": "Of the Radiant City Restored", "date": "1440-10-01", "west": "1 October 1440", "hijri": "4 Jumādā al-Ūlā 844", "book": "The Call", "words": 434, "text": "Do you construct on every elevation a sign, amusing yourselves, and take for yourselves palaces that you might abide eternally?", "ref": "26:128-129", "sura": 26, "suraName": "al-Shuʿarāʾ", "ayat": [128, 129], "pos": "closes", "theme": "signs and providence"}, {"file": "0846-01-21-of-the-jamaa-of-846-and-the-burghers", "title": "Of the Jamāʿa of 846, and the Burghers", "date": "1442-06-01", "west": "1 June 1442", "hijri": "21 Muḥarram 846", "book": "The Golden Century", "words": 495, "text": "And those who have responded to their Lord and established prayer, and whose affair is consultation among themselves, and from what We have provided them, they spend.", "ref": "42:38", "sura": 42, "suraName": "al-Shūrā", "ayat": [38], "pos": "closes", "theme": "justice and trade"}, {"file": "0846-03-29-of-the-princes-mending-and-the-golden-century", "title": "Of the Princes' Mending, and the Golden Century", "date": "1442-08-07", "west": "7 August 1442", "hijri": "29 Rabīʿ al-Awwal 846", "book": "The Golden Century", "words": 651, "text": "And when your Lord proclaimed: If you are grateful, I will surely increase you; but if you deny, indeed, My punishment is severe.", "ref": "14:7", "sura": 14, "suraName": "Ibrāhīm", "ayat": [7], "pos": "closes", "theme": "signs and providence"}, {"file": "0847-02-27-of-the-jamaa-of-847-and-the-island-of-fernando-po", "title": "Of the Jamāʿa of 847, and the Island of Fernando Po", "date": "1443-06-26", "west": "26 June 1443", "hijri": "27 Ṣafar 847", "book": "The Golden Century", "words": 366, "text": "And among His signs is that He sends the winds as bearers of good news, and to let you taste His mercy, and so that the ships may sail at His command, and that you may seek of His bounty.", "ref": "30:46", "sura": 30, "suraName": "al-Rūm", "ayat": [46], "pos": "closes", "theme": "the sea"}], "repeats": [{"ref": "65:3 / 65:2-3", "a": "0739-11-14-the-road-through-mursiyya", "b": "0743-12-24-the-lean-years", "aTitle": "Of the Road through Mursiyya, and the Host of Ibn al-Khaṭīb", "bTitle": "Of the Lean Years, the Gold of Tūnis, and the Royal Decree", "aText": "And whoever puts his trust in Allāh, He suffices him.", "bText": "And whoever fears Allāh, He will make for him a way out, and will provide for him from where he does not expect.", "aDate": "1339-05-24", "bDate": "1343-05-20", "kind": "same āya, different words"}, {"ref": "3:26", "a": "0741-02-16-the-peace-of-balansiyya", "b": "0776-10-12-of-the-restoration-of-al-andalus", "aTitle": "Of the Bluff before Shāṭiba, and the Peace of Balansiyya", "bTitle": "Of the Reordering of the Realm, and the Restoration of al-Andalus", "aText": "Say: O Allāh, Owner of Sovereignty, You give sovereignty to whom You will.", "bText": "Say: O Allāh, Owner of sovereignty, You give sovereignty to whom You will, and You take sovereignty away from whom You will.", "aDate": "1340-08-11", "bDate": "1375-03-16", "kind": "same āya, different words"}, {"ref": "3:140", "a": "0741-05-06-the-marinids-lose-the-shore", "b": "0777-08-20-of-the-war-of-restoration-and-the-day-of-shalba", "aTitle": "Of the Marīnids' Defeat, and the Shore They Lost", "bTitle": "Of the War of the Aragonese Restoration, and the Day of Shalba", "aText": "And these days We alternate among the people.", "bText": "If a wound has touched you, a wound like it has touched the others. These are the days We alternate among the people.", "aDate": "1340-10-28", "bDate": "1376-01-14", "kind": "same āya, different words"}, {"ref": "94:5-6", "a": "0747-06-28-the-debt-paid", "b": "0772-02-21-the-throne-that-endures", "aTitle": "Of the Unquiet Years, the Debt Paid, and the End of the Mending", "bTitle": "Of the Last Battles, the Peace of the Northern Shore, and the Throne That Endures", "aText": "So verily, with hardship there is ease. Verily, with hardship there is ease.", "bText": "For indeed, with hardship comes ease. Indeed, with hardship comes ease.", "aDate": "1346-10-16", "bDate": "1370-09-14", "kind": "same āya, different words"}, {"ref": "17:81", "a": "0748-02-06-the-day-of-jayyan", "b": "0772-02-20-the-reckoning-of-the-faithful", "aTitle": "Of the Day of Jayyān", "bTitle": "Of the Reckoning of the Faithful, in the Year the Strait Was Won", "aText": "Truth has come, and falsehood has departed. Indeed, falsehood is ever bound to depart.", "bText": "And say: The truth has come, and falsehood has departed. Indeed, falsehood is ever bound to depart.", "aDate": "1347-05-18", "bDate": "1370-09-13", "kind": "same āya, different words"}, {"ref": "2:216", "a": "0754-06-02-the-kingdom-of-ishbiliyya", "b": "0787-12-04-of-the-pilgrimage-that-came-too-late", "aTitle": "Of the So-Called Kingdom of Ishbīliya, and the Old Border Reaffirmed", "bTitle": "Of the County of Teruel, and the Pilgrimage That Came Too Late", "aText": "Perhaps you dislike a thing and it is good for you, and perhaps you love a thing and it is bad for you. And Allāh knows, while you know not.", "bText": "But perhaps you hate a thing and it is good for you; and Allāh knows, while you know not.", "aDate": "1353-07-05", "bDate": "1386-01-06", "kind": "same āya, different words"}, {"ref": "49:13", "a": "0772-02-27-the-survey-of-the-kingdoms", "b": "0780-01-02-of-tulaytula-and-the-count-of-the-christians", "aTitle": "The Survey of the Kingdoms, After the Manner of the Roads of the Eyes", "bTitle": "Of Ṭulayṭula, the Gem of Iberia, and the Count of the Christians", "aText": "O mankind, We have created you from male and female and made you peoples and tribes, that you may know one another.", "bText": "O mankind, We created you from a male and a female, and made you peoples and tribes so that you may know one another.", "aDate": "1370-09-20", "bDate": "1378-05-01", "kind": "same āya, different words"}, {"ref": "2:251", "a": "0775-09-24-the-pursuit-to-tarrakuna", "b": "0823-08-01-the-second-survey-of-the-kingdoms", "aTitle": "Of the Pursuit to Ṭarrakūna", "bTitle": "The Second Survey of the Kingdoms, and the Three Empires of the East", "aText": "So they defeated them by permission of Allāh.", "bText": "And if it were not for Allāh repelling some people by means of others, the earth would have been corrupted, but Allāh is full of bounty to the worlds.", "aDate": "1374-03-09", "bDate": "1420-08-11", "kind": "same āya, different words"}], "noVerse": [{"file": "0740-02-26-the-ghuzat-al-mujahidin", "title": n by his father and grandfather for their minds as well as their blood. With the two princes they did most of the governing, and the old Emperors had meant them to. <span class=\"kq\" data-t=\"ahmads-drawings\">Prince Aḥmad had begun to draw buildings, as his forebears had, and to talk of the great works he would raise in the capital one day.<\/span>", "knots": [{"thread": "ahmads-drawings", "i": 0, "role": "open", "quote": "Prince Aḥmad had begun to draw buildings, as his forebears had, and to talk of the great works he would raise in the capital one day."}]}, {"html": "Shant Yāqub held out for fifteen days. Its garrison was broken by hunger and sickness, not by assault, and on 23 Shawwāl 833 (15 July 1430) it was allowed to march out under its own banners. Then the Emperor gave the order that will be remembered longer than the battle.", "knots": []}, {"html": "The cathedral of Shant Yāqub was the greatest church of the Christian West outside Rome. It had been raised over the tomb the Christians believed was that of the Apostle James, whom they called their patron and the Moor-slayer, and it stood at the end of the pilgrim road that ran across all of Christendom from the Rhine and the Alps. Every year tens of thousands walked that road to touch the stone. When al-Manṣūr took the city in 387 he carried its bells back to Qurṭuba on the backs of Christian captives, to be hung upside down as lamps in the Great Mosque. But he left the tomb alone. The chroniclers said he found a single old monk sitting beside it and told his men to leave the man in peace.", "knots": []}, {"html": "The Emperor Muḥammad did not leave the tomb alone. On his direct orders the cathedral was pulled down. The masons of the army were told to save one thing. The great carved porch of the west front, the Pórtico de la Gloria, with its two hundred figures of prophets, elders and the saved, <span class=\"kq\" data-t=\"portico\">was taken down stone by stone and carted south to Ishbīliya.<\/span> The const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num = n => typeof n === 'number' ? (Math.abs(n) >= 1000 ? Math.round(n).toLocaleString('en-GB') : (Number.isInteger(n) ? n : n.toFixed(1))) : n;
const yr = d => +d.slice(0,4);
const pl = (n, one, many) => `${n} ${n===1 ? one : (many || one + 's')}`;
const TBY = Object.fromEntries(D.threads.map(t => [t.id, t]));
const KIND = {promise:'promise', question:'question', omen:'omen', grudge:'grudge', motif:'motif', venture:'venture', object:'object', debt:'debt'};
const ROLE = {open:'Begun', knot:'Knotted', tie:'Tied', echo:'Echoed'};
const Y0 = 1337, Y1 = yr(D.frontier.date);
let who = 'trent';
try { who = localStorage.getItem('desk.who') || 'trent'; } catch(e) {}

function knotSVG(tied, color='var(--rubric)'){
  return `<svg class="knot" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 12 C5 12 6 4 9 4 C12 4 12.5 9 9.5 9.5 C7 10 6.5 6 9 5.5" fill="none" stroke="${color}" stroke-width="1.6" stroke-linecap="round"/>${tied?`<path d="M9.5 9.5 C11 10 12 12 14 12" fill="none" stroke="${color}" stroke-width="1.6" stroke-linecap="round"/><circle cx="9.3" cy="7.3" r="2.1" fill="${color}"/>`:`<path d="M9.5 9.5 C11 10.5 12.5 13.5 14.5 14" fill="none" stroke="${color}" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="1.6 2"/>`}</svg>`;
}
const pos = y => ((y - Y0) / (Y1 - Y0) * 100).toFixed(2) + '%';

  <div class="grid g2">

      <div class="kicker" style="margin-bottom:6px">What has passed</div>

      <p class="note">${S.entries.length} entries, ${num(S.words)} words. Open them from the book's own table of contents. The Desk doesn't order the book.</p>

    <div class="grid" style="align-content:start">
