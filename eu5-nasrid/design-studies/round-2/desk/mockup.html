<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Source+Sans+3:wght@400;500;600;700&family=Amiri&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f3ede1; --sheet:#fbf8f1; --ink:#2a2420; --ink2:#5e554b; --muted:#8a8073; --rule:#d9cfbd; --rule2:#e8e0d0;
  --rubric:#9b2c1f; --rubric-soft:#f1dcd4; --gold:#9a6f22; --gold-soft:#efe2c4; --sea:#2c5f73; --sea-soft:#d8e6ea;
  --ok:#3d6b3a; --ok-soft:#dfe9d6; --warn:#a0601a; --warn-soft:#f4e3cb;
  --serif:"EB Garamond",Georgia,serif; --sans:"Source Sans 3",system-ui,sans-serif; --ar:"Amiri",serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#191613; --sheet:#221e1a; --ink:#ece4d6; --ink2:#c2b8a8; --muted:#968b7c; --rule:#3e362e; --rule2:#2e2823;
    --rubric:#e58a73; --rubric-soft:#3d2620; --gold:#d9b267; --gold-soft:#3a2f1c; --sea:#8cc3d4; --sea-soft:#1e3138;
    --ok:#9cc493; --ok-soft:#24301f; --warn:#e3a965; --warn-soft:#3a2a17;
  }
}
:root[data-theme="dark"]{
    --paper:#191613; --sheet:#221e1a; --ink:#ece4d6; --ink2:#c2b8a8; --muted:#968b7c; --rule:#3e362e; --rule2:#2e2823;
    --rubric:#e58a73; --rubric-soft:#3d2620; --gold:#d9b267; --gold-soft:#3a2f1c; --sea:#8cc3d4; --sea-soft:#1e3138;
    --ok:#9cc493; --ok-soft:#24301f; --warn:#e3a965; --warn-soft:#3a2a17;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5}
a{color:inherit}
button{font:inherit;color:inherit}
.wrap{max-width:1120px;margin:0 auto;padding:0 16px}
/* masthead */
header.mast{border-bottom:1px solid var(--rule);background:var(--sheet)}
.mast .wrap{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 18px;padding-top:14px;padding-bottom:10px}
.mast h1{font-family:var(--serif);font-weight:500;font-size:26px;margin:0;letter-spacing:.01em}
.mast h1 .ar{font-family:var(--ar);font-size:20px;color:var(--gold);margin-left:8px}
.frontier{font-size:13px;color:var(--ink2)}
.frontier b{color:var(--ink);font-weight:600}
.mast .tools{margin-left:auto;display:flex;gap:8px;align-items:center;font-size:13px}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:999px;overflow:hidden}
.seg button{border:0;background:transparent;padding:3px 10px;cursor:pointer;color:var(--ink2)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--sheet)}
nav.tabs{position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:1px solid var(--rule)}
nav.tabs .wrap{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.tabs a{flex:none;text-decoration:none;padding:10px 12px 9px;font-size:14px;color:var(--ink2);border-bottom:2px solid transparent;white-space:nowrap}
nav.tabs a.on{color:var(--ink);border-color:var(--rubric);font-weight:600}
nav.tabs a .n{font-size:11px;background:var(--rule2);border-radius:8px;padding:0 6px;margin-left:4px;color:var(--ink2)}
main{padding:22px 0 60px}
section.view{display:none}
section.view.on{display:block}
h2{font-family:var(--serif);font-weight:500;font-size:30px;line-height:1.15;margin:0 0 4px}
h3{font-family:var(--serif);font-weight:600;font-size:19px;margin:0 0 8px}
.kicker{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--rubric);font-weight:600}
.sub{color:var(--ink2);font-size:14px}
.card{background:var(--sheet);border:1px solid var(--rule);border-radius:6px;padding:16px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:1.25fr 1fr}
.g3{grid-template-columns:repeat(3,1fr)}
@media (max-width:820px){.g2,.g3{grid-template-columns:1fr}}
.note{font-size:12.5px;color:var(--muted)}
.pill{display:inline-block;font-size:11.5px;border-radius:999px;padding:1px 8px;border:1px solid var(--rule);color:var(--ink2);background:var(--sheet);white-space:nowrap}
.pill.red{border-color:transparent;background:var(--rubric-soft);color:var(--rubric)}
.pill.gold{border-color:transparent;background:var(--gold-soft);color:var(--gold)}
.pill.sea{border-color:transparent;background:var(--sea-soft);color:var(--sea)}
.pill.ok{border-color:transparent;background:var(--ok-soft);color:var(--ok)}
.pill.warn{border-color:transparent;background:var(--warn-soft);color:var(--warn)}
.serif{font-family:var(--serif)}
/* cover */
.cover-head{display:flex;flex-wrap:wrap;gap:6px 24px;align-items:flex-end;border-bottom:3px double var(--rule);padding-bottom:14px;margin-bottom:18px}
.cover-head .span{font-family:var(--serif);font-size:18px;color:var(--ink2)}
.recap{font-family:var(--serif);font-size:20px;line-height:1.5}
.recap::first-letter{font-size:3.1em;float:left;line-height:.85;padding:4px 8px 0 0;color:var(--rubric)}
ol.contents{list-style:none;margin:0;padding:0;counter-reset:c}
ol.contents li{counter-increment:c;display:grid;grid-template-columns:28px 1fr auto;gap:2px 10px;padding:9px 0;border-top:1px solid var(--rule2)}
ol.contents li::before{content:counter(c,upper-roman);font-family:var(--serif);color:var(--rubric);font-size:15px}
ol.contents .t{font-family:var(--serif);font-size:17px;line-height:1.25}
ol.contents .d{grid-column:2;font-size:12.5px;color:var(--muted)}
ol.contents .w{grid-row:1/3;grid-column:3;font-size:12px;color:var(--muted);text-align:right}
table.vit{width:100%;border-collapse:collapse;font-size:14px}
table.vit td{padding:5px 0;border-top:1px solid var(--rule2)}
table.vit td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.up{color:var(--ok)} .down{color:var(--rubric)}
.bar{height:8px;background:var(--rule2);border-radius:4px;position:relative;overflow:hidden}
.bar i{position:absolute;top:0;bottom:0;left:0;background:var(--ink2);opacity:.35;border-radius:4px}
.bar b{position:absolute;top:0;bottom:0;left:0;background:var(--gold);border-radius:4px}
.est{display:grid;grid-template-columns:90px 1fr 70px;gap:6px 10px;align-items:center;font-size:13.5px;margin:4px 0}
.chiprow{display:flex;flex-wrap:wrap;gap:6px}
.tlink{cursor:pointer;text-decoration:none}
.tlink:hover .pill{border-color:var(--rubric)}
/* knot glyph */
.knot{display:inline-block;width:15px;height:15px;vertical-align:-2px;flex:none}
/* threads */
.tfilters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:14px 0}
.thread{display:grid;grid-template-columns:22px 1fr;gap:4px 10px;padding:14px 0;border-top:1px solid var(--rule)}
.thread .ti{font-family:var(--serif);font-size:19px;line-height:1.2;cursor:pointer}
.thread .ti:hover{color:var(--rubric)}
.thread .meta{grid-column:2;font-size:13px;color:var(--ink2);display:flex;flex-wrap:wrap;gap:4px 12px}
.thread .gist{grid-column:2;font-family:var(--serif);font-size:16px;color:var(--ink2)}
.strip{grid-column:2;position:relative;height:22px;margin-top:4px}
.strip .ln{position:absolute;left:0;right:0;top:10px;height:1px;background:var(--rule)}
.strip .seg2{position:absolute;top:9px;height:3px;background:var(--rubric);opacity:.35}
.strip .dot{position:absolute;top:6px;width:9px;height:9px;margin-left:-4px;border-radius:50%;border:2px solid var(--rubric);background:var(--sheet)}
.strip .dot.tie{background:var(--rubric)}
.strip .dot.echo{border-style:dotted}
.strip .yr{position:absolute;top:13px;font-size:10px;color:var(--muted);transform:translateX(-50%)}
.strip .now{position:absolute;top:2px;bottom:2px;right:0;width:2px;background:var(--gold)}
/* follow view */
.follow{max-width:760px;margin:0 auto}
.back{font-size:13px;color:var(--ink2);text-decoration:none;cursor:pointer}
.kn{position:relative;padding:0 0 0 34px;margin:0}
.kn::before{content:"";position:absolute;left:10px;top:0;bottom:0;width:1px;background:var(--rule)}
.kn .g{position:absolute;left:2px;top:4px;background:var(--paper)}
.kn .role{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--rubric);font-weight:600}
.kn .et{font-family:var(--serif);font-size:18px;line-height:1.25;margin:2px 0}
.kn .dd{font-size:12.5px;color:var(--muted)}
.kn blockquote{margin:10px 0 0;padding:12px 14px;background:var(--sheet);border:1px solid var(--rule);border-radius:6px;font-family:var(--serif);font-size:16.5px;line-height:1.55;color:var(--ink2)}
.kn mark{background:var(--rubric-soft);color:var(--ink);padding:0 2px;border-radius:2px}
.gap{padding:12px 0 18px 34px;position:relative;font-size:12.5px;color:var(--muted);font-style:italic}
.gap::before{content:"";position:absolute;left:10px;top:0;bottom:0;width:1px;border-left:1px dashed var(--rule)}
.veil{margin:6px 0 0 34px;padding:12px 14px;border:1px dashed var(--rule);border-radius:6px;color:var(--ink2);font-size:14px}
/* court */
.cgroup{margin-top:26px}
.cgroup>h3{display:flex;gap:10px;align-items:baseline}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.pc{background:var(--sheet);border:1px solid var(--rule);border-radius:6px;padding:12px;display:flex;flex-direction:column;gap:4px}
.pc .nm{font-family:var(--serif);font-size:17px;line-height:1.2}
.pc .ar{font-family:var(--ar);color:var(--gold);font-size:15px}
.pc .age{font-size:12.5px;color:var(--ink2)}
.pc .off{font-size:12.5px;color:var(--ink2)}
.pc .silence{font-size:12px;color:var(--muted);margin-top:auto;padding-top:6px}
.sil{height:4px;background:var(--rule2);border-radius:2px;overflow:hidden;margin-top:3px}
.sil i{display:block;height:100%;background:var(--warn)}
.pc.flag{border-color:var(--rubric)}
/* verses */
.vcheck{display:flex;gap:8px;flex-wrap:wrap}
.vcheck input{flex:1;min-width:200px;font:inherit;padding:9px 12px;border:1px solid var(--rule);border-radius:6px;background:var(--sheet);color:var(--ink)}
.vres{margin-top:10px;font-size:14px}
.rep{display:grid;grid-template-columns:70px 1fr 1fr;gap:8px 14px;padding:10px 0;border-top:1px solid var(--rule2);font-size:14px}
.rep .ref{font-weight:600;color:var(--rubric)}
.rep .v{font-family:var(--serif);font-size:15.5px;font-style:italic}
.rep .src{font-size:12px;color:var(--muted);font-style:normal;display:block}
@media (max-width:640px){.rep{grid-template-columns:1fr}}
table.conc{width:100%;border-collapse:collapse;font-size:14px}
table.conc th{text-align:left;font-size:12px;color:var(--muted);font-weight:600;padding:6px 8px 6px 0;border-bottom:1px solid var(--rule)}
table.conc td{padding:7px 8px 7px 0;border-top:1px solid var(--rule2);vertical-align:top}
table.conc td.r{white-space:nowrap;font-variant-numeric:tabular-nums;font-weight:600}
table.conc td.v{font-family:var(--serif);font-style:italic;font-size:15.5px}
table.conc tr.dup td.r{color:var(--rubric)}
.themes{display:flex;flex-wrap:wrap;gap:6px}
@media (max-width:640px){ table.conc .hide-s{display:none} }
/* checklist */
.ck{display:grid;grid-template-columns:26px 1fr;gap:4px 8px;padding:12px 0;border-top:1px solid var(--rule2)}
.ck input{width:18px;height:18px;margin-top:3px;accent-color:var(--rubric)}
.ck .h{font-weight:600}
.ck ul{margin:6px 0 0;padding-left:18px;color:var(--ink2);font-size:14px}
.ck ul li{margin:2px 0}
/* margin demo */
.page{display:grid;grid-template-columns:minmax(0,1fr) 230px;gap:0 28px;background:var(--sheet);border:1px solid var(--rule);border-radius:6px;padding:28px 28px 34px}
.page .ttl{grid-column:1/-1;margin-bottom:14px}
.page .ttl h2{font-size:28px}
.page p{font-family:var(--serif);font-size:18.5px;line-height:1.62;margin:0 0 14px;grid-column:1}
.page .mg{grid-column:2;font-size:13px;align-self:start}
.page .kq{background:linear-gradient(transparent 62%,var(--rubric-soft) 62%)}
.mk{display:flex;gap:8px;padding:6px 0;border-top:1px solid var(--rule2)}
.mk:first-child{border-top:0}
.mk .mt{font-family:var(--serif);font-size:15px;line-height:1.2;color:var(--rubric)}
.mk .mr{font-size:11.5px;color:var(--muted)}
.mk a{font-size:12.5px;cursor:pointer;text-decoration:underline;text-underline-offset:2px;color:var(--ink2)}
.page .verse{font-style:italic}
@media (max-width:820px){
  .page{grid-template-columns:1fr;padding:20px 16px}
  .page .mg{grid-column:1;margin:-6px 0 16px;padding:8px 10px;border-left:2px solid var(--rubric);background:var(--paper);border-radius:0 6px 6px 0}
}
.flaglist li{margin:6px 0}
.hr{height:1px;background:var(--rule);margin:22px 0}
.small{font-size:13px}
.right{text-align:right}
.mono{font-variant-numeric:tabular-nums}
.friend-only{display:none}
body.friend .friend-only{display:block}
body.friend .trent-only{display:none}
</style>
</head>
<body>
<header class="mast">
  <div class="wrap">
    <h1>The Desk <span class="ar">المكتب</span></h1>
    <div class="frontier" id="frontier"></div>
    <div class="tools">
      <span class="note">Reading as</span>
      <span class="seg" id="who"><button data-who="trent" aria-pressed="true">Trent</button><button data-who="friend" aria-pressed="false">a friend</button></span>
    </div>
  </div>
</header>
<nav class="tabs" aria-label="Desk"><div class="wrap" id="tabs"></div></nav>
<main><div class="wrap">

<section class="view" id="v-cover"></section>
<section class="view" id="v-threads"></section>
<section class="view" id="v-thread"></section>
<section class="view" id="v-court"></section>
<section class="view" id="v-verses"></section>
<section class="view" id="v-awaiting"></section>
<section class="view" id="v-checklist"></section>
<section class="view" id="v-margin"></section>

</div></main>
