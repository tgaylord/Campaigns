/* ---------- threads ---------- */
let tFilter = 'open', tKind = 'all';
function strip(t){
  const ks = t.knots, a = yr(ks[0].date), b = yr(ks[ks.length-1].date);
  const end = t.status === 'open' ? Y1 : b;
  return `<div class="strip" aria-hidden="true"><div class="ln"></div>
    <div class="seg2" style="left:${pos(a)};width:calc(${pos(end)} - ${pos(a)})"></div>
    ${ks.map(k=>`<span class="dot ${k.role}" style="left:${pos(yr(k.date))}" title="${esc(k.title)}"></span>`).join('')}
    <span class="yr" style="left:${pos(a)}">${a}</span>${b-a>=12?`<span class="yr" style="left:${pos(b)}">${b}</span>`:''}
    <span class="now" title="the frontier"></span></div>`;
}
function renderThreads(){
  const kinds = ['all', ...new Set(D.threads.map(t=>t.kind))];
  let list = D.threads.filter(t => (tFilter==='all' || t.status===tFilter) && (tKind==='all' || t.kind===tKind));
  list.sort((x,y) => x.status===y.status ? x.opened.localeCompare(y.opened) : (x.status==='open'?-1:1));
  const friendHidesTied = who==='friend' && tFilter!=='open';
  const tiedN = D.threads.length - openN;
  $('#v-threads').innerHTML = `
    <div class="kicker">The Desk</div>
    <h2>Threads</h2>
    <p class="sub" style="max-width:720px">Promises, questions and warnings the chronicle has made to itself. A thread begins where the prose points forward, gets knotted again each time an entry comes back to it, and is tied where it is paid off. <b>${openN}</b> are open at the frontier and <b>${tiedN}</b> are tied. The ${D.threads.length} here were read from the entries by hand for the mockup. Every quote is checked against the text.</p>
    <div class="friend-only card" style="margin-top:12px;border-color:var(--gold)"><b>A note for friends:</b> the Desk stands at the open end of the book, in ${esc(F.west.slice(-4))}. Open threads are what is unresolved there, and they give away who is alive and in power at the end. Tied threads tell you how earlier questions came out. Read the book first if you'd rather not know.</div>
    <div class="tfilters">
      <span class="seg" id="tf">${['open','tied','all'].map(f=>`<button data-f="${f}" aria-pressed="${f===tFilter}">${f}</button>`).join('')}</span>
      <span class="chiprow" id="tk">${kinds.map(k=>`<button class="pill ${k===tKind?'red':''}" data-k="${k}" style="cursor:pointer">${k}</button>`).join('')}</span>
    </div>
    ${friendHidesTied ? `<div class="veil" style="margin-left:0">Tied threads tell you how things turn out. <a href="#" id="showTied">Show them anyway</a></div>` : ''}
    <div id="tlist">${(friendHidesTied ? list.filter(t=>t.status==='open') : list).map(t => `
      <div class="thread">
        <div>${knotSVG(t.status==='tied')}</div>
        <div class="ti" data-open="${t.id}">${esc(t.title)}</div>
        <div class="meta">
          <span class="pill ${t.status==='open'?'red':'ok'}">${t.status}</span><span class="pill">${t.kind}</span>
          <span>begun ${yr(t.opened)}, in <i>${esc(t.knots[0].title)}</i></span>
          ${t.status==='open' ? `<span>${t.knots.length} knot${t.knots.length>1?'s':''} · ${t.yearsSince ? `quiet for ${pl(t.yearsSince,'year')}, ${pl(t.entriesSince,'entry','entries')}` : 'touched in the latest session'}</span>` : `<span>tied ${yr(t.lastTouched)}, after ${t.span} yrs and ${t.knots.length} knots</span>`}
          ${t.due ? `<span class="pill gold">due ${esc(t.due)}</span>`:''}
        </div>
        <div class="gist">${esc(t.gist)}</div>
        ${strip(t)}
      </div>`).join('')}</div>`;
  $('#tf').onclick = e => { const f = e.target.dataset.f; if (f){ tFilter=f; renderThreads(); } };
  $('#tk').onclick = e => { const k = e.target.dataset.k; if (k){ tKind=k; renderThreads(); } };
  const st = $('#showTied'); if (st) st.onclick = e => { e.preventDefault(); who='trent'; setWho(); };
  document.querySelectorAll('#tlist [data-open]').forEach(el => el.onclick = () => location.hash = 'thread/' + el.dataset.open);
}

function renderThread(id, upto){
  const t = TBY[id]; if (!t) return;
  const limit = (who==='friend' && upto!==undefined) ? upto : t.knots.length-1;
  let html = `<div class="follow">
    <a class="back" href="#threads">← all threads</a>
    <div class="kicker" style="margin-top:14px">Following a thread · ${t.kind}</div>
    <h2>${knotSVG(t.status==='tied')} ${esc(t.title)}</h2>
    <p class="sub serif" style="font-size:17px">${esc(who==='friend' && limit < t.knots.length-1 ? t.frontier : t.gist)}</p>
    <div class="chiprow" style="margin:6px 0 22px">${limit < t.knots.length-1 ? `<span class="pill">as far as you have read: knot ${limit+1}</span>` : `<span class="pill ${t.status==='open'?'red':'ok'}">${t.status}</span>${t.due?`<span class="pill gold">due ${esc(t.due)}</span>`:''}<span class="pill">${pl(t.knots.length,'knot')} across ${pl(t.span,'year')}</span>`}</div>`;
  t.knots.forEach((k,i) => {
    if (i > limit) return;
    if (i > 0){
      const prev = t.knots[i-1]; const gy = yr(k.date)-yr(prev.date);
      const between = prev.file===k.file ? 'later in the same entry' : gy ? `${pl(gy,'year')} later` : 'later the same year';
      html += `<div class="gap">${between}</div>`;
    }
    html += `<div class="kn"><span class="g">${knotSVG(k.role==='tie')}</span>
      <div class="role">${ROLE[k.role]}</div>
      <div class="et">${esc(k.title)}</div>
      <div class="dd">${esc(k.hijri)} · ${esc(k.west)} · <i>${esc(k.book)}</i></div>
      <blockquote>${k.para}</blockquote></div>`;
  });
  if (limit < t.knots.length-1){
    html += `<div class="veil">This thread goes on for ${t.knots.length-1-limit} more knot${t.knots.length-1-limit>1?'s':''}. You'll meet ${t.knots.length-1-limit>1?'them':'it'} as you read on. <a href="#" id="unveil">Show the rest</a></div>`;
  } else if (t.status==='open'){
    html += `<div class="gap">open at the frontier, ${esc(F.west)}</div><div class="veil" style="border-color:var(--rubric)">${knotSVG(false)} Still to be paid. ${t.due ? 'Falls due ' + esc(t.due) + '. ' : ''}Last touched ${pl(t.yearsSince,'year')} and ${pl(t.entriesSince,'entry','entries')} ago.</div>`;
  }
  html += `</div>`;
  $('#v-thread').innerHTML = html;
  const u = $('#unveil'); if (u) u.onclick = e => { e.preventDefault(); renderThread(id); };
}

/* ---------- court ---------- */
let cSort = 'house';
function renderCourt(){
  const groups = [['house','The house of Naṣr','Living members with a person record.'],['court','The court and the ṭāʾifas','Consorts, ṭāʾifa lords, governors and captains.'],['abroad','Abroad','Crowns and exiles the chronicle follows. Their deaths are often not recorded, so read these as “last heard of”.']];
  const maxS = Math.max(...D.court.map(c=>c.yearsSince||0));
  const card = c => {
    const stale = c.office.some(o=>/member of the dīwān/.test(o)) && !D.cabinet.includes(c.id);
    return `<div class="pc">
    <div class="nm">${esc(c.name)}</div>${c.arabic?`<div class="ar" dir="rtl">${esc(c.arabic)}</div>`:''}
    <div class="age">${c.age!=null ? `${c.age} years old` : 'age not recorded'}${c.born?` · b. ${c.born.slice(0,4)}`:''}</div>
    ${c.office.length?`<div class="off">${c.office.map(esc).join(' · ')}</div>`:''}
    ${stale?`<div><span class="pill warn">not in the dīwān of the ${esc(D.cabinetDate)} save</span></div>`:''}
    <div class="silence">${c.last ? `Last in <i>${esc(c.last.title)}</i> (${yr(c.last.date)})${c.yearsSince?` · unmentioned for <b>${c.yearsSince}</b> yrs, ${c.entriesSince} entries`:' · in the latest entry'}` : 'Never named in the chronicle'}
      <div class="sil"><i style="width:${c.yearsSince? (c.yearsSince/maxS*100).toFixed(0):0}%"></i></div></div>
  </div>`;};
  const sorter = cSort==='silence' ? (a,b)=>(b.yearsSince??-1)-(a.yearsSince??-1) : cSort==='age' ? (a,b)=>(b.age??0)-(a.age??0) : (a,b)=>(b.mentions-a.mentions);
  let body;
  if (cSort==='house'){
    body = groups.map(([g,l,n]) => { const xs = D.court.filter(c=>c.group===g).sort(sorter);
      return `<div class="cgroup"><h3>${l} <span class="note">${xs.length}</span></h3><p class="note" style="margin:-4px 0 10px">${n}</p><div class="cards">${xs.map(card).join('')}</div></div>`; }).join('');
  } else {
    const xs = D.court.filter(c=>c.group!=='unburied').sort(sorter);
    body = `<div class="cards" style="margin-top:16px">${xs.map(card).join('')}</div>`;
  }
  const un = D.unrolled.map(u=>`<div class="pc"><div class="nm">${esc(u.name)}</div><div class="age">${u.age} years old · b. ${u.born.slice(0,4)}</div><div class="off">${esc(u.title)}</div><div class="silence">From the record's birth events. No person record yet. ${u.age>=12?`<b>Turns sixteen in ${yr(u.born)+16}.</b>`:''}</div></div>`).join('');
  const bur = D.court.filter(c=>c.group==='unburied').sort((a,b)=>(b.age??0)-(a.age??0)).map(card).join('');
  const dic = D.deadInCabinet.map(x=>`<div class="pc flag"><div class="nm">${esc(x.name)}</div><div class="off">Died ${esc(x.died)} (told in <i>Of the Emperor's Pilgrimage</i>), but the saves of 1438 and ${esc(D.cabinetDate)} still seat him in the dīwān: “${esc(x.role)}”.</div><div class="silence">Probably the extractor matched the wrong Yūsuf. Check the game id.</div></div>`).join('');
  $('#v-court').innerHTML = `
    <div class="kicker">The Desk</div>
    <h2>The court as it stands</h2>
    <p class="sub" style="max-width:720px">Everyone with a person record and no recorded death, with ages at the frontier (${esc(F.west)}), their offices, and how long the chronicle has gone without naming them. Offices come from the person records and the cabinet of the ${esc(D.cabinetDate)} save.</p>
    <div class="tfilters"><span class="note">Arrange</span><span class="seg" id="cs">${[['house','by house'],['silence','by silence'],['age','by age']].map(([k,l])=>`<button data-s="${k}" aria-pressed="${k===cSort}">${l}</button>`).join('')}</span></div>
    ${body}
    <div class="cgroup trent-only"><h3>Not yet on the roll <span class="note">${D.unrolled.length}</span></h3><p class="note" style="margin:-4px 0 10px">Children of the house born 1430–34. <i>Of the Emperor's Pilgrimage</i> counts them as “nine grandchildren” and names two. None has a person record. The eldest come of age in 1446.</p><div class="cards">${un}</div></div>
    <div class="cgroup trent-only"><h3>Never buried <span class="note">${D.court.filter(c=>c.group==='unburied').length}</span></h3><p class="note" style="margin:-4px 0 10px">No death is recorded, and they would be past eighty-five or have been out of the record for half a century. Decide whether each died offstage, or give them a line.</p><div class="cards">${bur}</div></div>
    <div class="cgroup trent-only"><h3>A dead man in the dīwān</h3><div class="cards">${dic}</div></div>`;
  $('#cs').onclick = e => { const s=e.target.dataset.s; if(s){ cSort=s; renderCourt(); } };
}

/* ---------- verses ---------- */
const dupFiles = new Set(D.repeats.flatMap(r=>[r.a,r.b]));
function refSort(a,b){ return a.sura-b.sura || a.ayat[0]-b.ayat[0] || a.date.localeCompare(b.date); }
function stem(w){ return w.toLowerCase().replace(/[^a-zāīūḥṣḍṭẓʿʾ]/g,'').replace(/(ing|ed|es|s)$/,''); }
const STOP = new Set('and the of to a in is that you your for it he his him them they we our us who which not be by as with from those have has are was will indeed allah lord say all their its upon this then so but if or what when whom there when'.split(' '));
function words(s){ return new Set(s.split(/\s+/).map(stem).filter(w=>w.length>2 && !STOP.has(w))); }
function checkVerse(q){
  q = q.trim(); if (!q) return '';
  const m = q.match(/^(\d+)\s*:\s*(\d+)(?:\s*-\s*(\d+))?$/);
  let hits;
  if (m){ const s=+m[1], a0=+m[2], a1=+(m[3]||m[2]); hits = D.verses.filter(v=>v.sura===s && v.ayat.some(x=>x>=a0&&x<=a1)).map(v=>[v,1]); }
  else { const W = words(q); hits = D.verses.map(v=>{ const V=words(v.text); let c=0; W.forEach(w=>{ if(V.has(w)) c++; }); return [v, W.size? c/Math.min(W.size,V.size):0, c]; }).filter(x=>x[2]>=2 && x[1]>=.4).sort((a,b)=>b[1]-a[1]).slice(0,5); }
  if (!hits.length) return `<span class="pill ok">Not found among the ${D.verses.length} verses used</span> <span class="note">Matching is by reference or by shared words, so a different translation can slip through. Record the sura:āya.</span>`;
  return `<span class="pill red">${m ? 'Already used' : 'Close to verses already used'}</span>` + hits.map(([v])=>`<div style="margin-top:8px"><b>${v.ref}</b> <span class="serif" style="font-style:italic">${esc(v.text)}</span><div class="note">${v.pos} <i>${esc(v.title)}</i>, ${yr(v.date)}</div></div>`).join('');
}
function renderVerses(){
  const themes = {}; D.verses.forEach(v=>themes[v.theme]=(themes[v.theme]||0)+1);
  const rows = [...D.verses].sort(refSort).map(v=>`<tr class="${dupFiles.has(v.file)?'dup':''}"><td class="r">${v.ref}</td><td class="hide-s note">${esc(v.suraName)}</td><td class="v">${esc(v.text)}${v.pos==='opens'?' <span class="pill warn" style="font-style:normal">opens the entry</span>':''}</td><td class="small">${esc(v.title)}<div class="note">${yr(v.date)} · ${esc(v.theme)}</div></td></tr>`).join('');
  $('#v-verses').innerHTML = `
    <div class="kicker">The Desk</div>
    <h2>The verse concordance</h2>
    <p class="sub" style="max-width:740px">Every entry is meant to close with a verse of the Qurʾān, never repeated. Here are all ${D.verses.length} in sura order. The concordance found that the rule has already been broken: <b>${D.repeats.length} āyāt are used twice</b>, mostly in different English wordings, which is why a check by wording alone misses them. <span class="note">The sura:āya references were added by the designer for this mockup and need checking before they are adopted. The material doesn't record them.</span></p>
    <div class="card" style="margin:16px 0">
      <h3>Check a verse before you use it</h3>
      <div class="vcheck"><input id="vq" placeholder="Paste the verse, or type a reference like 3:26" autocomplete="off"></div>
      <div class="vres" id="vres"><span class="note">Try “Owner of sovereignty”, “ships like mountains” or 2:216.</span></div>
    </div>
    <h3 style="margin-top:22px">Used twice</h3>
    ${D.repeats.map(r=>`<div class="rep"><div class="ref">${r.ref}<div class="note" style="font-weight:400">${r.kind}</div></div><div class="v">${esc(r.aText)}<span class="src">${esc(r.aTitle)}, ${yr(r.aDate)}</span></div><div class="v">${esc(r.bText)}<span class="src">${esc(r.bTitle)}, ${yr(r.bDate)}</span></div></div>`).join('')}
    <div class="grid g2" style="margin-top:22px">
      <div class="card"><h3>Entries without a closing verse</h3><ul class="small" style="margin:0;padding-left:18px">${D.noVerse.map(e=>`<li><i>${esc(e.title)}</i>, ${yr(e.date)}</li>`).join('')}<li><i>Of the Summons of the Marīnids</i>, 1346, opens with its verse (55:7–8) instead of closing with one</li></ul></div>
      <div class="card"><h3>Quoted in the body</h3><ul class="small" style="margin:0;padding-left:18px">${D.inBody.map(x=>`<li><b>${esc(x.ref)}</b> <span class="serif" style="font-style:italic">${esc(x.text)}</span>. ${esc(x.note)}</li>`).join('')}</ul><p class="note" style="margin:8px 0 0">Found by hand, not exhaustive. Recording verses that appear in the body would let the check cover these too.</p></div>
    </div>
    <h3 style="margin-top:22px">By theme</h3>
    <div class="themes">${Object.entries(themes).sort((a,b)=>b[1]-a[1]).map(([k,n])=>`<span class="pill gold">${esc(k)} · ${n}</span>`).join('')}</div>
    <p class="note">Rough themes, assigned by keyword. They show what the closings lean on (war, the sea) before the next one is chosen.</p>
    <h3 style="margin-top:22px">Concordance</h3>
    <table class="conc"><thead><tr><th>Ref.</th><th class="hide-s">Sura</th><th>Verse</th><th>Entry</th></tr></thead><tbody>${rows}</tbody></table>`;
  const q = $('#vq'); q.oninput = () => $('#vres').innerHTML = checkVerse(q.value) || '<span class="note">Paste a verse or a reference.</span>';
}

/* ---------- awaiting ---------- */
function renderAwaiting(){
  const stale = D.court.filter(c=>c.office.some(o=>/member of the dīwān/.test(o)) && !D.cabinet.includes(c.id));
  $('#v-awaiting').innerHTML = `
    <div class="kicker">The Desk</div>
    <h2>Awaiting the save</h2>
    <p class="sub" style="max-width:720px">Facts the book already tells but no save yet confirms, then the continuity flags the build found in the record. The first list is for the next session's opening minutes, the second for Trent and his collaborator to decide.</p>
    <h3 style="margin-top:18px">Told since the last save (${esc(F.lastSave)})</h3>
    ${D.awaiting.map(a=>`<div class="ck"><input type="checkbox" aria-label="confirmed"><div><div class="h">${esc(a.what)}</div><div class="note">${esc(a.west)} · source: ${esc(a.source)}</div><div class="small" style="margin-top:4px">Next save should show: ${esc(a.check)}</div></div></div>`).join('')}
    <h3 style="margin-top:22px">Never settled</h3>
    ${D.older.map(a=>`<div class="ck"><input type="checkbox" aria-label="settled"><div><div class="h">${esc(a.what)}${a.date?` <span class="note">${a.date}</span>`:''}</div><div class="small">${esc(a.flag)}</div></div></div>`).join('')}
    <h3 style="margin-top:22px">Continuity flags</h3>
    <ul class="flaglist">
      <li><b>${D.deadInCabinet.map(x=>esc(x.name)).join(', ')}</b> sits in the dīwān in the saves of 1438 and ${esc(D.cabinetDate)}, though he died in 1435. <a href="#court">The court</a></li>
      <li><b>${D.repeats.length} verses repeated</b> and ${D.noVerse.length} entries without a closing verse. <a href="#verses">Verses</a></li>
      <li><b>${D.court.filter(c=>c.group==='unburied').length} people never buried</b>: Najīb would be 126. <a href="#court">The court</a></li>
      <li><b>${D.unrolled.length} children of the house</b> with no person records, the eldest turning sixteen in 1446.</li>
      <li><b>${stale.length} people</b> whose person record says “member of the dīwān” but who are not in the ${esc(D.cabinetDate)} cabinet: ${stale.map(s=>esc(s.name)).join(', ')}.</li>
    </ul>`;
}

/* ---------- checklist ---------- */
function renderChecklist(){
  const open = D.threads.filter(t=>t.status==='open');
  const quiet = [...open].sort((a,b)=>b.yearsSince-a.yearsSince).slice(0,5);
  const due = open.filter(t=>t.due);
  const house = D.court.filter(c=>c.group==='house' && c.yearsSince).sort((a,b)=>b.yearsSince-a.yearsSince).slice(0,5);
  const coming = D.unrolled.filter(u=>u.age>=12).concat([]);
  const ruler = D.court.find(c=>c.id==='muhammad-ibn-ismail-ibn-saad');
  const last = D.session.entries[D.session.entries.length-1];
  let saved = {}; try { saved = JSON.parse(localStorage.getItem('desk.ck')||'{}'); } catch(e) {}
  const item = (id, head, body) => `<div class="ck"><input type="checkbox" data-ck="${id}" ${saved[id]?'checked':''}><div><div class="h">${head}</div>${body}</div></div>`;
  $('#v-checklist').innerHTML = `
    <div class="kicker">For the writers</div>
    <h2>Before the next session</h2>
    <p class="sub" style="max-width:720px">Built from the Desk. Trent and the collaborator run through it before playing on, so the next entries pick up every open string. Ticks are kept in this browser only.</p>
    <div class="grid g2" style="margin-top:12px">
    <div>
    ${item('recap','Pick up where the book stopped', `<ul><li>The last entry is <i>${esc(last.title)}</i> (${esc(last.hijri)}).</li><li>Read “What has passed” on the <a href="#cover">cover</a>.</li></ul>`)}
    ${item('due','Promises that fall due', `<ul>${due.map(t=>`<li><a href="#thread/${t.id}">${esc(t.title)}</a>: due ${esc(t.due)}. The Emperor is ${ruler.age}.</li>`).join('')}</ul>`)}
    ${item('quiet','Threads gone quiet', `<ul>${quiet.map(t=>`<li><a href="#thread/${t.id}">${esc(t.title)}</a>: untouched for ${t.yearsSince} years, since <i>${esc(t.knots[t.knots.length-1].title)}</i></li>`).join('')}</ul>`)}
    ${item('people','Members of the house the book has forgotten', `<ul>${house.map(c=>`<li>${esc(c.name)}, ${c.age}: unmentioned for ${c.yearsSince} years${c.office[0]?` (${esc(c.office[0])})`:''}</li>`).join('')}</ul>`)}
    ${item('age','Coming of age', `<ul>${coming.map(u=>{ const m=u.title.match(/^A (son|daughter), [^,]+, is born to (.+)$/); return `<li>${esc(u.name)}, ${m?esc(m[1]+' of '+m[2]):''}, turns sixteen in ${yr(u.born)+16}.</li>`; }).join('')}<li>Give each a person record before they act in an entry.</li></ul>`)}
    </div><div>
    ${item('verses','Choosing the closing verse', `<ul><li>${D.verses.length} used. <a href="#verses">Check the next one</a> by reference, not by wording.</li><li>The sea has closed ${D.verses.filter(v=>v.theme==='the sea').length} entries, war and victory ${D.verses.filter(v=>v.theme==='war and victory').length}.</li></ul>`)}
    ${item('save','From the save, first thing', `<ul>${D.awaiting.map(a=>`<li>${esc(a.check)}</li>`).join('')}<li>Is ${esc(D.deadInCabinet[0]?.name||'')} still listed in the cabinet?</li></ul>`)}
    ${item('after','After the session: the thread pass', `<ul><li>The collaborator reads the new entries against the open threads and proposes changes: <i>knot</i>, <i>tie</i>, <i>new thread</i>, or <i>let go</i>, each with the sentence that anchors it.</li><li>Trent accepts or rejects each line. That's the whole chore.</li><li>Then the session record: span, recap, copyist's note.</li></ul>`)}
    </div></div>`;
  document.querySelectorAll('[data-ck]').forEach(c => c.onchange = () => { saved[c.dataset.ck]=c.checked; try{ localStorage.setItem('desk.ck', JSON.stringify(saved)); }catch(e){} });
}

/* ---------- margin demo ---------- */
function renderMargin(){
  const dm = D.demo;
  const paras = dm.paras.map((p,i) => {
    const last = i === dm.paras.length-1;
    const mg = p.knots.map(k => { const t = TBY[k.thread]; const n = t.knots.length;
      const back = k.i>0 ? `<div class="mr">knot ${k.i+1} of ${who==='friend'?'?':n} · first in ${yr(t.knots[0].date)}</div>` : `<div class="mr">${ROLE[k.role].toLowerCase()} here${who==='friend'?'':` · ${n} knot${n>1?'s':''}, ${t.status}`}</div>`;
      return `<div class="mk">${knotSVG(t.status==='tied' && who!=='friend')}<div><div class="mt">${esc(t.title)}</div>${back}<a data-follow="${t.id}" data-i="${k.i}">follow this thread</a></div></div>`; }).join('');
    return `<p class="${last?'verse':''}">${p.html}</p>${mg?`<aside class="mg">${mg}</aside>`:''}`;
  }).join('');
  $('#v-margin').innerHTML = `
    <p class="sub" style="max-width:720px;margin-top:0">One real entry, as the reader meets it. The Desk owns just one mark in the margin: the <b>knot</b>, where a thread begins or comes back. Glosses and everything else in the margin belong to other designs. In “a friend” mode a knot points only backward: it says where the thread began, and following it shows the knots up to this one.</p>
    <article class="page">
      <div class="ttl"><div class="kicker">${esc(dm.book)}</div><h2>${esc(dm.title)}</h2><div class="sub">${esc(dm.hijri)} · ${esc(dm.west)}</div></div>
      ${paras}
    </article>`;
  document.querySelectorAll('[data-follow]').forEach(a => a.onclick = () => { location.hash = `thread/${a.dataset.follow}/${a.dataset.i}`; });
}

/* ---------- routing ---------- */
function setWho(){
  document.body.classList.toggle('friend', who==='friend');
  document.querySelectorAll('#who button').forEach(b=>b.setAttribute('aria-pressed', b.dataset.who===who));
  try { localStorage.setItem('desk.who', who); } catch(e) {}
  route();
}
$('#who').onclick = e => { if (e.target.dataset.who){ who = e.target.dataset.who; setWho(); } };
function route(){
  const h = (location.hash||'#cover').slice(1).split('/');
  let v = h[0] || 'cover';
  if (!['cover','threads','thread','court','verses','awaiting','checklist','margin'].includes(v)) v = 'cover';
  document.querySelectorAll('section.view').forEach(s=>s.classList.toggle('on', s.id==='v-'+v));
  document.querySelectorAll('#tabs a').forEach(a=>a.classList.toggle('on', a.dataset.tab===(v==='thread'?'threads':v)));
  ({cover:renderCover, threads:renderThreads, court:renderCourt, verses:renderVerses, awaiting:renderAwaiting, checklist:renderChecklist, margin:renderMargin})[v]?.();
  if (v==='thread') renderThread(h[1], h[2]!==undefined ? +h[2] : undefined);
  if (v==='thread') window.scrollTo(0,0);
}
window.addEventListener('hashchange', route);
setWho();
</script>
