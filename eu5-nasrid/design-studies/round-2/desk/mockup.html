 "date": "1443-06-26", "west": "26 June 1443", "hijri": "27 Ṣafar 847", "book": "The Golden Century", "words": 366, "people": 1}], "words": 3166, "checkpoints": [{"date": "1442-06-11", "west": "11 June 1442", "name": "The Princes Mend the Damage", "save": "SP_ADU_1442_06_11 (compressed)"}], "prevCheckpoint": {"date": "1438-01-16", "west": "16 January 1438", "name": "The Admiral Prince"}, "newPeople": [], "gone": [], "lastLoss": {"name": "Bernarda of Mursiyya", "died": "6 November 1437", "where": "told in the previous session (Of the Admiral Prince)"}, "vital": [{"label": "Towns of the crown", "from": 221, "to": 222}, {"label": "Subjects of the crown", "from": 3246583, "to": 3327740}, {"label": "Stability", "from": 24.2, "to": 14.2}, {"label": "Legitimacy", "from": 100.0, "to": 65.0}, {"label": "Prestige", "from": 89, "to": 86}, {"label": "Treasury (dīnārs)", "from": 1653, "to": 1767}, {"label": "Income a month", "from": 391.3, "to": 412.9}, {"label": "Land ↔ sea (+ is sea)", "from": 1.08, "to": 26.26}], "estates": [{"name": "Nobility", "from": 41, "to": 32}, {"name": "ʿUlamāʾ", "from": 50, "to": 44}, {"name": "Burghers", "from": 50, "to": 74}, {"name": "Commoners", "from": 50, "to": 34}, {"name": "Dhimmī", "from": 50, "to": 45}], "privAdd": ["Shipwright Contracts", "Urban Development Grants"], "privDel": ["Land Rights"], "provenance": {"events": 12, "save": 2, "account": 10}, "threads": {"opened": ["umara-grievance", "catalan-privileges", "trade-war", "promise-to-the-ulama", "the-league", "fernando-po"], "advanced": [], "tied": ["the-slow-prince"]}, "recap": "In the years after the admiral prince put to sea, the Emperor Muḥammad gave Majrīṭ its charter and took the umarāʾ's land rights as its price. At fifty-three he became a scholar, and he raised the Radiant City again above Qurṭuba. He fought Genoa and the English with ledgers. Then, without a word to his sons, he seated the burghers in the Jamāʿa beside the lords, and the princes mended what they could. He proclaimed the Golden Century and an empire of the sea, and the new Jamāʿa, lords and merchants together, asked for Fernando Po."}, "threads": [{"id": "word-to-fas", "title": "The word given to Fās", "kind": "promise", "status": "tied", "gist": "The alliance lets the Marīnid sultan summon Granada to his wars. He has not yet done so.", "frontier": "The Marīnids may yet call on the word given in 1337.", "people": ["yusuf-i"], "knots": [{"file": "0738-01-02-the-marinid-war-upon-castile", "title": "Of the Spring of the Year 737, and the Marīnid War upon Qashtāla", "date": "1337-07-31", "west": "31 July 1337", "hijri": "2 Muḥarram 738", "book": "The Mending of the State", "words": 534, "role": "open", "quote": "The alliance gives Abū al-Ḥasan the right to summon our lord, and he has not yet done so.", "para": "Then, on the second day of Muḥarram in the year 738, with the new year barely begun, Abū al-Ḥasan declared war upon Qashtāla to reclaim al-Andalus, and Tilimsān marched under his banner. <mark>The alliance gives Abū al-Ḥasan the right to summon our lord, and he has not yet done so.<\/mark> Our lord is bound by tribute to the one side and by his word to the other. As this is written, the sovereignty of Gharnāṭa stands a hair above the half, by the reckoning of the scribes, and the pull of the two shores leans toward Qashtāla. Between the lion of Fās and the castle of Qashtāla lies a strait one may cross in an afternoon, and Gharnāṭa stands upon its shore and waits. And Allāh is the best of planners."}, {"file": "0747-07-01-the-summons-of-the-marinids", "title": "Of the Summons of the Marīnids, and the Volunteers' Return", "date": "1346-10-18", "west": "18 October 1346", "hijri": "1 Rajab 747", "book": "The Balance", "words": 500, "role": "knot", "quote": "Then the Marīnid's letter came to Gharnāṭa: our brother in faith expected us to take the field.", "para": "On the twenty-eighth of Jumādā al-Ākhira the Marīnid sultan declared war on Qashtāla to reclaim al-Andalus, six years after his host had been broken. The king of Qashtāla called on his friends, and Portugal came in, and Arghūn with Mayūrqa and Qalyari. For the first time all three crowns of Iberia stood in one line. With Fās marched Tāfīlālt, Tuwāt and Tilimsān, and two days later Tūnis and its marches. <mark>Then the Marīnid's letter came to Gharnāṭa: our brother in faith expected us to take the field.<\/mark>"}, {"file": "0747-07-01-the-summons-of-the-marinids", "title": "Of the Summons of the Marīnids, and the Volunteers' Return", "date": "1346-10-18", "west": "18 October 1346", "hijri": "1 Rajab 747", "book": "The Balance", "words": 500, "role": "tie", "quote": "On the first of Rajab he answered the summons.", "para": "But the sultan weighed it and judged that the war would not wait on Gharnāṭa's caution. <mark>On the first of Rajab he answered the summons.<\/mark> The Ṭāʾifa of Balansiyya marched with us, and the land there now held more Muslims than Christians, ninety-two thousand to ninety. Taking up arms against our overlord suspended the tribute, and the war itself would decide the realm's independence. The reparations Arghūn had paid since the peace of 741 ceased the same day."}], "opened": "1337-07-31", "lastTouched": "1346-10-18", "entriesSince": 94, "yearsSince": 97, "span": 9}, {"id": "grievance-in-the-drawer", "title": "The grievance in the drawer", "kind": "promise", "status": "tied", "gist": "After the peace of 741 the clerks quietly begin writing up the realm's claims against Castile.", "frontier": "A claim against Qashtāla lies sealed in the dīwān.", "people": ["yusuf-i"], "knots": [{"file": "0741-02-28-the-two-taifas", "title": "Of the Two Ṭāʾifas", "date": "1340-08-23", "west": "23 August 1340", "hijri": "28 Ṣafar 741", "book": "The Mending of the State", "words": 461, "role": "open", "quote": "Within days of the peace the clerks of the dīwān began, very quietly, to set down the realm's claims against Qashtāla, the long grievance of tribute and lost lands that would one day justify a war of independence.", "para": "At home the realm put down its arms. The host of nineteen regiments was sent back to its villages until three remained. Five of the loans owed to the estates were repaid from the gold of the peace, and the debt fell from nine hundred and sixty-four dīnārs to eight hundred and forty-three. The treasury was left almost bare again. The sultan's cousin Yūsuf ibn Muḥammad, who had spent three years defending the realm's sovereignty, was turned to strengthening the government. <mark>Within days of the peace the clerks of the dīwān began, very quietly, to set down the realm's claims against Qashtāla, the long grievance of tribute and lost lands that would one day justify a war of independence.<\/mark> No one spoke of it aloud. The scales were not ready."}, {"file": "0745-06-02-the-jamaa-of-744", "title": "Of the Jamāʿa of 744, the Sultan's Marriage, and the Crown Strengthened", "date": "1344-10-11", "west": "11 October 1344", "hijri": "2 Jumādā al-Ākhira 745", "book": "The Mending of the State", "words": 538, "role": "knot", "quote": "The grievance against Qashtāla had lain sealed in the dīwān for two years.", "para": "In the spring of 744 the sultan called the Jamāʿa, the great assembly of the realm, where the nobles and the ʿulamāʾ, the burghers, the commoners and the dhimmīs each send their voices to the throne. He had meant to call it for war. Portugal was still divided against itself, and Qashtāla was weakened by it. <mark>The grievance against Qashtāla had lain sealed in the dīwān for two years.<\/mark> There were voices in the dīwān that said the hour had come to use it."}, {"file": "0764-10-19-the-death-of-al-hajj-yusuf", "title": "Of the March into the West, and the Death of al-Ḥājj Yūsuf", "date": "1363-08-01", "west": "1 August 1363", "hijri": "19 Shawwāl 764", "book": "The Balance", "words": 493, "role": "knot", "quote": "On the fifth of Shaʿbān in the year 764, the truce with Qashtāla ran out, and our lord Yūsuf did not wait an hour longer.", "para": "<mark>On the fifth of Shaʿbān in the year 764, the truce with Qashtāla ran out, and our lord Yūsuf did not wait an hour longer.<\/mark> He had a just cause, and he had the ṭāʾifas of Balansiyya and Mursiyya, whole and untouched. He also had a rival who could barely stand. The Marīnids held fifty-eight Castilian towns, as far as Ṭulayṭula itself, and the tyrant of Qashtāla had fewer than two hundred men left to call up. The treasury held fifty-seven dīnārs. The sultan said that a war for freedom is not fought with what is in the treasury, and he marched north."}, {"file": "0767-07-23-the-peace-of-independence", "title": "Of the Conqueror, the Renegade at San Clemente, and the Peace of Independence", "date": "1366-04-05", "west": "5 April 1366", "hijri": "23 Rajab 767", "book": "The Balance", "words": 549, "role": "tie", "quote": "The house of Naṣr, which had paid tribute to the Castilian crown for longer than anyone living could remember, declared itself free and subject to no one but Allāh.", "para": "On the twenty-third of Rajab 767 the peace was sealed, and the tyrant of Qashtāla let Gharnāṭa go. <mark>The house of Naṣr, which had paid tribute to the Castilian crown for longer than anyone living could remember, declared itself free and subject to no one but Allāh.<\/mark> Qashtāla gave up the country of Walba: six towns between the Guadalquivir and the Guadiana, from the coast to the hills of Aracena. Among them was Ayamūnt, where al-Ḥājj Yūsuf had died on the march, so the son brought the place of his father's death into the realm. Qashtāla paid a sum into the treasury and owed reparations for ten years. Ṭulayṭula was given back, burned and half emptied, its people fewer by a third than they had been seven years before."}], "opened": "1340-08-23", "lastTouched": "1366-04-05", "entriesSince": 68, "yearsSince": 77, "span": 26}, {"id": "the-knot-that-held", "title": "The one knot that held", "kind": "omen", "status": "tied", "gist": "A Marīnid girl of nine is betrothed to the sultan. The chronicle says that this knot, alone of the Marīnid knots, will hold.", "frontier": "A Marīnid bride of nine is promised to the sultan.", "people": ["dua-marinid", "yusuf-i"], "knots": [{"file": "0748-10-15-the-birth-of-saad", "title": "Of the Birth of Saʿd", "date": "1348-01-18", "west": "18 January 1348", "hijri": "15 Shawwāl 748", "book": "The Balance", "words": 294, "role": "open", "quote": "In time the court would learn how quickly the knots the Marīnids tied could come undone, and that this one, alone of them, would hold.", "para": "That same day a Naṣrid betrothal was sealed with the Marīnids of Fās, binding the two houses as the war bound the two realms. The bride was Duʿāʾ, a girl of nine of the Marīnid house, and she was promised not to the newborn but to the sultan himself. The dīwān thought it a prudent knot. <mark>In time the court would learn how quickly the knots the Marīnids tied could come undone, and that this one, alone of them, would hold.<\/mark>"}, {"file": "0751-11-20-the-prodigy-and-the-daughter-of-cairo", "title": "Of the Prodigy, and the Daughter of al-Qāhira", "date": "1351-01-19", "west": "19 January 1351", "hijri": "20 Dhū al-Qaʿda 751", "book": "The Balance", "words": 405, "role": "knot", "quote": "the Marīnid girl promised to his father in the year of Saʿd's birth was still growing up in Fās.", "para": "In Dhū al-Qaʿda of the year 751 a letter came from al-Qāhira, sealed with the seal of the Mamlūk sultan. Jamāl al-Dīn agreed to give his daughter Aiman in marriage to Saʿd, son of our lord Yūsuf and heir to the throne of Gharnāṭa, when the two came of age. So the alliance made in the embassy of 750 became a bond of blood between the house of Naṣr and the lords of Egypt and Syria. So the heir's bride would come from the East, while <mark>the Marīnid girl promised to his father in the year of Saʿd's birth was still growing up in Fās.<\/mark>"}, {"file": "0756-03-04-the-governor-and-the-harem", "title": "Of the Governor of Qurṭuba, and the Brides from Across the Sea", "date": "1355-03-19", "west": "19 March 1355", "hijri": "4 Rabīʿ al-Awwal 756", "book": "The Balance", "words": 583, "role": "tie", "quote": "She had been promised to him in the year of the war with the three crowns, and she was the one thread to Fās that had not been cut when Qashtāla made the Marīnids tear up their treaties.", "para": "While the masons worked, the sultan kept two promises made long before. On the twenty-second of Rajab 755 he married Duʿāʾ of the house of Fās. <mark>She had been promised to him in the year of the war with the three crowns, and she was the one thread to Fās that had not been cut when Qashtāla made the Marīnids tear up their treaties.<\/mark> On the third of Dhū al-Qaʿda he married Tizemt of Tūnis. In three months two daughters of the Maghrib had come to the Alhambra to stand beside Sayyida, the first wife. The harem grew, and with it a new kind of power. The ḥarīm had always been a household. Now it became a court within the court, full of women who had learned statecraft in the palaces of Fās and Tūnis, and their clients and their whispers. The nobles complained that power was flowing inward, to the throne and to the women around it, and no one at court troubled to deny it."}], "opened": "1348-01-18", "lastTouched": "1355-03-19", "entriesSince": 75, "yearsSince": 88, "span": 7}, {"id": "walls-and-wards", "title": "Walls and wards", "kind": "omen", "status": "tied", "gist": "The houses of healing go up before the plague. The chronicle warns that they will slow it but not stop it.", "frontier": "The houses of healing stand ready.", "people": ["yusuf-i"], "knots": [{"file": "0747-07-01-the-houses-of-healing", "title": "Of the Rumour out of the East, and the Houses of Healing", "date": "1346-10-18", "west": "18 October 1346", "hijri": "1 Rajab 747", "book": "The Pestilence", "words": 373, "role": "open", "quote": "Those who praised it would learn that walls and wards slow a pestilence but do not stop it, for Allāh's decree outruns the builder.", "para": "Those who mocked the order would remember it within two years. <mark>Those who praised it would learn that walls and wards slow a pestilence but do not stop it, for Allāh's decree outruns the builder.<\/mark>"}, {"file": "0749-02-15-the-coming-of-the-pestilence", "title": "Of the Coming of the Pestilence", "date": "1348-05-15", "west": "15 May 1348", "hijri": "15 Ṣafar 749", "book": "The Pestilence", "words": 436, "role": "knot", "quote": "The physicians said it was the only way to slow the sickness, and they were right.", "para": "The sultan's answer was the hardest one. He ordered the infected separated from the healthy. Whole streets were closed with chains, the sick were carried out of the cities to camps beyond the walls, and their houses were sealed with their goods inside. <mark>The physicians said it was the only way to slow the sickness, and they were right.<\/mark> But the burghers, whose shops were shut, and the common people, whose sons and mothers were carried off to the camps, cursed the order and the men who enforced it. Some of the ʿulamāʾ said that to flee a plague, or to drive others from it, was to doubt the decree of Allāh. Others answered with the Prophet's own words, peace be upon him: if you hear of a plague in a land, do not enter it; and if it breaks out in a land where you are, do not leave it."}, {"file": "0752-12-09-the-departing-of-the-pestilence", "title": "Of the Departing of the Pestilence", "date": "1352-01-27", "west": "27 January 1352", "hijri": "9 Dhū al-Ḥijja 752", "book": "The Pestilence", "words": 434, "role": "tie", "quote": "The houses of healing had slowed the sickness but could not stop it.", "para": "The reckoning was made, and it is written in this book. Two hundred and twenty-one thousand of the realm's people were dead. Fifty-two million were dead in the whole known world from Yāyiq to the Ocean. Of every five souls in the old realm of Gharnāṭa, two were in the ground. The cities had suffered most, Gharnāṭa, Mālaqa and al-Mariyya, with their alleys and their markets. <mark>The houses of healing had slowed the sickness but could not stop it.<\/mark> It took the burghers and the scholars hardest of all, the very men who had made those cities the light of the West."}], "opened": "1346-10-18", "lastTouched": "1352-01-27", "entriesSince": 79, "yearsSince": 91, "span": 6}, {"id": "moneylenders", "title": "The ʿulamāʾ and the moneylenders", "kind": "grudge", "status": "tied", "gist": "Saʿd waves away the scholars' complaint about Muslim moneylenders. They do not forget it.", "frontier": "The ʿulamāʾ hold a grudge over usury.", "people": ["saad-ibn-yusuf"], "knots": [{"file": "0772-08-07-the-moneylenders-of-ishbiliya", "title": "Of the Towns of the North, and the Moneylenders of Ishbīliya", "date": "1371-02-24", "west": "24 February 1371", "hijri": "7 Shaʿbān 772", "book": "The Call", "words": 674, "role": "open", "quote": "The ʿulamāʾ went away displeased, and they did not forget it.", "para": "In Shaʿbān 772 the ʿulamāʾ came to him about the moneylenders. In the towns of the valley, they said, Muslim merchant families had begun to lend at interest, as the Jews and the Genoese did, and the practice was spreading. The qāḍī recited the verse: Allāh has permitted trade and forbidden usury. The court waited. The sultan had sat through every war of his reign in debt to his own estates, and he still owed seven loans. He answered that the ʿulamāʾ were overreacting, and that he would sooner have Muslims lending in Ishbīliya than Genoese. <mark>The ʿulamāʾ went away displeased, and they did not forget it.<\/mark>"}, {"file": "0794-03-25-of-al-hajj-saad", "title": "Of the Second Pilgrimage, the Death of Aiman, and al-Ḥājj Saʿd", "date": "1392-02-20", "west": "20 February 1392", "hijri": "25 Rabīʿ al-Awwal 794", "book": "The Call", "words": 739, "role": "tie", "quote": "The ʿulamāʾ, freshly content with their Ḥājj, let it pass.", "para": "He met his grief as he always had, with work. Before the year was out he did a thing that would have been unthinkable twenty years earlier, when the ʿulamāʾ had come to him about the moneylenders of Ishbīliya. He gave moneylending a form and a law. Banking, the new craft of the Genoese and the Florentines, was admitted into the empire and set under rules, so that the houses of credit of Ishbīliya could stand beside those of Janawa. <mark>The ʿulamāʾ, freshly content with their Ḥājj, let it pass.<\/mark>"}], "opened": "1371-02-24", "lastTouched": "1392-02-20", "entriesSince": 44, "yearsSince": 51, "span": 21}, {"id": "law-of-the-house", "title": "The law of the house", "kind": "question", "status": "tied", "gist": "The Emperor loves a gifted grandson who stands sixth in line, but he will not bend the law of succession for him. The question passes down a generation.", "frontier": "Will the law of succession be changed for a gifted grandson?", "people": ["saad-ibn-yusuf", "ismail-ibn-saad", "muhammad-ibn-ismail-ibn-saad", "saad-ibn-yusuf-ibn-saad"], "knots": [{"file": "0800-12-20-of-the-grandsons-and-the-prince-from-benabarre", "title": "Of the Grandsons, and the Prince Who Came Home from Benabarre", "date": "1398-09-03", "west": "3 September 1398", "hijri": "20 Dhū al-Ḥijja 800", "book": "The Call", "words": 590, "role": "open", "quote": "But the question did not die. It went down a generation.", "para": "So the old quarrel of the harem ended without anyone winning it. Duʿāʾ and Aiman, who had fought for the better part of twenty years over whose son would inherit, were both in their graves. The crown prince Ismāʿīl was heir beyond dispute, and his brother was across the mountains. <mark>But the question did not die. It went down a generation.<\/mark>"}, {"file": "0800-12-20-of-the-grandsons-and-the-prince-from-benabarre", "title": "Of the Grandsons, and the Prince Who Came Home from Benabarre", "date": "1398-09-03", "west": "3 September 1398", "hijri": "20 Dhū al-Ḥijja 800", "book": "The Call", "words": 590, "role": "knot", "quote": "If Ismāʿīl's son Saʿd grew into a man fit to rule, the question would wait for Ismāʿīl's reign.", "para": "The law could be changed. A sultan of the house could name whichever son he chose, as the caliphs had done. But a crown that changed its law for a favourite would shake the realm from end to end, and the realm had only just steadied itself after the giving of the ṭāʾifas. The umarāʾ would ask what other law the Emperor might change for his pleasure. The Emperor had spent thirty-five years telling the qāḍīs, the counts and the tax-farmers that the law bound everyone, and he would not now make himself the exception. He left the law as it stood. <mark>If Ismāʿīl's son Saʿd grew into a man fit to rule, the question would wait for Ismāʿīl's reign.<\/mark> If not, the Emperor would decide it himself, and pay the price."}, {"file": "0807-09-16-of-the-risings-of-807-and-the-death-of-the-emperor-saad", "title": "Of the Risings of 807, and the Death of the Emperor Saʿd", "date": "1405-03-18", "west": "18 March 1405", "hijri": "16 Ramaḍān 807", "book": "The Marches", "words": 834, "role": "knot", "quote": "Whether the law would be changed was now for Ismāʿīl to decide, and Ismāʿīl had always been better at saying what men wished to hear than at telling them what he meant.", "para": "A death answers many questions. The one he had left open answered itself. The crown passed by the law he had kept to his son Ismāʿīl, thirty-eight years old, with Bernarda of Mursiyya beside him, and the heir was now Ismāʿīl's eldest, Muḥammad, nineteen, slow still, but married and the father of three. The boy the old Emperor had hoped for, Ismāʿīl's second son Saʿd, was twelve and doing all his teachers asked. Prince Yūsuf took his brother's old seat in the dīwān, and his son, the other Saʿd, went on with the costly education of the heirs, as gifted as ever. <mark>Whether the law would be changed was now for Ismāʿīl to decide, and Ismāʿīl had always been better at saying what men wished to hear than at telling them what he meant.<\/mark>"}, {"file": "0811-03-12-of-the-old-capital-and-the-sons-of-muhammad", "title": "Of the Old Capital, the Shaykha of Qūnka, and the Sons of Muḥammad", "date": "1408-08-05", "west": "5 August 1408", "hijri": "12 Rabīʿ al-Awwal 811", "book": "The Call", "words": 636, "role": "tie", "quote": "By the summer of 811 the question that had troubled the old Emperor's last years had settled itself.", "para": "<mark>By the summer of 811 the question that had troubled the old Emperor's last years had settled itself.<\/mark> The heir Muḥammad was twenty-two. He was still slow, but he had done one thing well: he had married two daughters of the ṭāʾifa houses, Magdalena of the Borja of Arghūn and Isabel of the Montsoriu of Catalonia, whose mother was Fāṭima, daughter of Yūsuf I. They had given him five children. The two eldest were boys of five: Ismāʿīl, Magdalena's son, born in Rabīʿ al-Awwal 805, and Aḥmad, Isabel's, born in Dhū al-Qaʿda of the same year. Their tutors had not yet been chosen, but those who had seen them said both were gifted. If the Emperor reigned long, the crown would pass to Muḥammad and through him to boys worthy of it, and no one would need to change the law of the house to make it so."}, {"file": "0832-09-25-of-the-death-of-the-emperor-ismail-and-the-two-princes", "title": "Of the Death of the Emperor Ismāʿīl, and the Two Princes", "date": "1429-06-28", "west": "28 June 1429", "hijri": "25 Ramaḍān 832", "book": "The Marches", "words": 968, "role": "echo", "quote": "The crown passed by the law of the house, which he had never changed, to his eldest son Muḥammad", "para": "<mark>The crown passed by the law of the house, which he had never changed, to his eldest son Muḥammad<\/mark>, forty-three, who took the throne as Muḥammad V with Isabel of the Montsoriu beside him. The court had judged him unfit to rule when he was twelve, and in thirty years nothing had changed its mind except a day at the mouth of the Duero, when he had commanded the fleet and won. He was slow in council, and the treasury clerks said he squeezed his estates for every dirham. When the chancellor came to proclaim the new Emperor in the mosques, the old men of the court were heard to say that the realm had been cursed, and to ask God's mercy on them all."}], "opened": "1398-09-03", "lastTouched": "1429-06-28", "entriesSince": 17, "yearsSince": 14, "span": 31}, {"id": "what-he-wishes-to-hear", "title": "What each man wishes to hear", "kind": "motif", "status": "tied", "gist": "Ismāʿīl tells each man what he wants to hear, from the age of nine until his obituary.", "frontier": "The young Ismāʿīl tells his elders what they want to hear.", "people": ["ismail-ibn-saad"], "knots": [{"file": "0776-10-12-of-the-restoration-of-al-andalus", "title": "Of the Reordering of the Realm, and the Restoration of al-Andalus", "date": "1375-03-16", "west": "16 March 1375", "hijri": "12 Shawwāl 776", "book": "The Marches", "words": 788, "role": "open", "quote": "His tutors noted that he had already learned to tell each of his elders what that elder wished to hear, and they did not all count it a virtue.", "para": "The first part was Mursiyya. It had been one of the first ṭāʾifas, under the sultan's protection for thirty-five years, and the crown now took it into its own hands. Its towns, from Mursiyya and Qarṭājanna to Lūrqa and the hills of Albacete, passed to the sultan directly. Its ḥājiba, Dolça, the old house of Oriola's daughter, was not cast aside. She was granted lands and titles and confirmed as a governor. Her daughter Bernarda, eight years old and gifted beyond her years, was betrothed to the heir Ismāʿīl. The boy was nine and charmed everyone who met him. <mark>His tutors noted that he had already learned to tell each of his elders what that elder wished to hear, and they did not all count it a virtue.<\/mark> The crown's reach in Mursiyya would be short at first, and the sultan meant it to be. Mursiyya's traders were bound to the Catalans of the coast, and its court had a Catalan cast to it, so he let its institutions stand inside the state instead of ignoring them. There was one thing the dīwān watched. Bernarda, a Castilian by her father's blood, was being raised at the court of Qashtāla. The betrothal held all the same."}, {"file": "0800-12-20-of-the-grandsons-and-the-prince-from-benabarre", "title": "Of the Grandsons, and the Prince Who Came Home from Benabarre", "date": "1398-09-03", "west": "3 September 1398", "hijri": "20 Dhū al-Ḥijja 800", "book": "The Call", "words": 590, "role": "knot", "quote": "The crown prince welcomed his brother and his nephew with the fairest words in the dīwān, and everyone who heard them agreed that nobody could have said it better.", "para": "What he did not leave was the boy. In Dhū al-Ḥijja 800 he sent to Benabarre and called his son Yūsuf home to Ishbīliya, and the little Saʿd with him, to be raised at his grandfather's court and under his grandfather's eye. Caterina stayed at her brother's court, with child by Yūsuf again. <mark>The crown prince welcomed his brother and his nephew with the fairest words in the dīwān, and everyone who heard them agreed that nobody could have said it better.<\/mark>"}, {"file": "0807-09-16-of-the-risings-of-807-and-the-death-of-the-emperor-saad", "title": "Of the Risings of 807, and the Death of the Emperor Saʿd", "date": "1405-03-18", "west": "18 March 1405", "hijri": "16 Ramaḍān 807", "book": "The Marches", "words": 834, "role": "knot", "quote": "Ismāʿīl had always been better at saying what men wished to hear than at telling them what he meant.", "para": "A death answers many questions. The one he had left open answered itself. The crown passed by the law he had kept to his son Ismāʿīl, thirty-eight years old, with Bernarda of Mursiyya beside him, and the heir was now Ismāʿīl's eldest, Muḥammad, nineteen, slow still, but married and the father of three. The boy the old Emperor had hoped for, Ismāʿīl's second son Saʿd, was twelve and doing all his teachers asked. Prince Yūsuf took his brother's old seat in the dīwān, and his son, the other Saʿd, went on with the costly education of the heirs, as gifted as ever. Whether the law would be changed was now for Ismāʿīl to decide, and <mark>Ismāʿīl had always been better at saying what men wished to hear than at telling them what he meant.<\/mark>"}, {"file": "0811-03-12-of-the-old-capital-and-the-sons-of-muhammad", "title": "Of the Old Capital, the Shaykha of Qūnka, and the Sons of Muḥammad", "date": "1408-08-05", "west": "5 August 1408", "hijri": "12 Rabīʿ al-Awwal 811", "book": "The Call", "words": 636, "role": "knot", "quote": "Whatever the Emperor told men in private, and he told each of them what he wished to hear, his judgments in public were fair, and no one who brought a case before him could say it had been decided by favour.", "para": "After the risings the Emperor Ismāʿīl gave the dīwān to the work of binding the north. His half-sister Umm al-Fatḥ and his nephew Muḥammad ibn Yūsuf, a grandson of the old Emperor through his mother, were set to governing the lands that had risen, and his brother Yūsuf to drawing Andalusī settlers north to them. In those years the qāḍīs began to say a thing they had not expected to say of him. <mark>Whatever the Emperor told men in private, and he told each of them what he wished to hear, his judgments in public were fair, and no one who brought a case before him could say it had been decided by favour.<\/mark>"}, {"file": "0832-09-25-of-the-death-of-the-emperor-ismail-and-the-two-princes", "title": "Of the Death of the Emperor Ismāʿīl, and the Two Princes", "date": "1429-06-28", "west": "28 June 1429", "hijri": "25 Ramaḍān 832", "book": "The Marches", "words": 968, "role": "tie", "quote": "Those who had been lied to by him found, on reflection, that they had been lied to for the good of the state, and those who had been judged by him found that they had been judged fairly, and most of the umarāʾ had been both.", "para": "The court had always said that he told every man in private what that man wished to hear. The court also said, and this was rarer, that he judged every man in public by the law, and that no one who came before him could say he had been judged by favour. When the chancellor announced his death to the realm, it was that he chose to mention: the Emperor's fair and impartial rulings, which the realm would miss. <mark>Those who had been lied to by him found, on reflection, that they had been lied to for the good of the state, and those who had been judged by him found that they had been judged fairly, and most of the umarāʾ had been both.<\/mark>"}], "opened": "1375-03-16", "lastTouched": "1429-06-28", "entriesSince": 17, "yearsSince": 14, "span": 54}, {"id": "the-slow-prince", "title": "The slow prince", "kind": "question", "status": "tied", "gist": "Muḥammad is judged slow and unfit as a boy, and the old men call the realm cursed at his accession. Does the judgment stand?", "frontier": "The heir's eldest son is slow, and his tutors have given up on him.", "people": ["muhammad-ibn-ismail-ibn-saad"], "knots": [{"file": "0800-12-20-of-the-grandsons-and-the-prince-from-benabarre", "title": "Of the Grandsons, and the Prince Who Came Home from Benabarre", "date": "1398-09-03", "west": "3 September 1398", "hijri": "20 Dhū al-Ḥijja 800", "book": "The Call", "words": 590, "role": "open", "quote": "stubborn and slow, and his tutors had given up making excuses for him.", "para": "Ismāʿīl had three sons. The eldest, Muḥammad, son of Bernarda of Mursiyya, was twelve, <mark>stubborn and slow, and his tutors had given up making excuses for him.<\/mark> The second, Saʿd, son of the Ottoman princess ʿĀʾisha, was six. He was quick, he loved his books, and he had been given the costliest teachers in the realm. The third, Aḥmad, was four and wanted everything his brothers had. By the law of the house, which the Emperor had inherited and never changed, the crown would pass from Ismāʿīl to Muḥammad."}, {"file": "0832-09-25-of-the-death-of-the-emperor-ismail-and-the-two-princes", "title": "Of the Death of the Emperor Ismāʿīl, and the Two Princes", "date": "1429-06-28", "west": "28 June 1429", "hijri": "25 Ramaḍān 832", "book": "The Marches", "words": 968, "role": "knot", "quote": "the old men of the court were heard to say that the realm had been cursed, and to ask God's mercy on them all.", "para": "The crown passed by the law of the house, which he had never changed, to his eldest son Muḥammad, forty-three, who took the throne as Muḥammad V with Isabel of the Montsoriu beside him. The court had judged him unfit to rule when he was twelve, and in thirty years nothing had changed its mind except a day at the mouth of the Duero, when he had commanded the fleet and won. He was slow in council, and the treasury clerks said he squeezed his estates for every dirham. When the chancellor came to proclaim the new Emperor in the mosques, <mark>the old men of the court were heard to say that the realm had been cursed, and to ask God's mercy on them all.<\/mark>"}, {"file": "0841-07-19-of-the-admiral-prince-and-his-three-wives", "title": "Of the Admiral Prince, and His Three Wives", "date": "1438-01-16", "west": "16 January 1438", "hijri": "19 Rajab 841", "book": "The Encircling Sea", "words": 489, "role": "knot", "quote": "The court had called him slow; the captains had called him admiral.", "para": "The Emperor Muḥammad had been twenty-five, and judged unfit to rule by everyone who knew him, when he was given the fleet. He had never forgotten what it had done for him. <mark>The court had called him slow; the captains had called him admiral.<\/mark> He had learned the names of harbour-masters, the price of pitch and the turn of the winds off Cape Saint Vincent, and he had come back from the sea a man who could win a battle at the mouth of the Duero. In the winter of 841 he did for his grandson what had been done for him."}, {"file": "0843-02-02-of-the-emperor-who-became-a-scholar", "title": "Of the Emperor Who Became a Scholar", "date": "1439-07-15", "west": "15 July 1439", "hijri": "2 Ṣafar 843", "book": "The Call", "words": 413, "role": "tie", "quote": "they agreed among themselves that he understood a new idea, once he had it, better and faster than most of them.", "para": "He read the way he did everything, slowly and without shame. He had the pilots of the Ocean voyages brought to him to explain their charts, and kept them until he understood the charts himself. He sat in on the lectures of the madrasa of Ishbīliya, at the back, and asked the questions the students were too proud to ask. He had the astronomers explain the instruments by which a ship found its latitude, and the physicians explain the plagues that came in with the ships, and the engineers of the arsenals explain why one hull was faster than another. By Ṣafar 843, when he was fifty-three, the scholars of the court had stopped humouring him and begun to argue with him, and <mark>they agreed among themselves that he understood a new idea, once he had it, better and faster than most of them.<\/mark> Under him the realm took up new learning more readily than it ever had, and the madrasas taught more children to read."}], "opened": "1398-09-03", "lastTouched": "1439-07-15", "entriesSince": 5, "yearsSince": 4, "span": 41}, {"id": "a-land-of-their-own", "title": "A land of their own one day", "kind": "promise", "status": "tied", "gist": "The dīwān promises the first settlers of the Green Cape a land of their own, with its own governor.", "frontier": "The settlers of the Green Cape were promised a land of their own.", "people": ["abd-al-wahhab-barakat"], "knots": [{"file": "0823-07-21-of-daniel-the-green-cape-and-angra", "title": "Of Daniel, the Green Cape, and Angra", "date": "1420-08-01", "west": "1 August 1420", "hijri": "21 Rajab 823", "book": "The Encircling Sea", "words": 412, "role": "open", "quote": "The islands were not to be a fishing post like the others but a land of their own one day, with its own governor and its own people.", "para": "The voyages he had begun went on without him. On 23 Ṣafar 823 the captains of the Green Cape came home with charts of the islands that lie off the westernmost point of Africa, beyond the country of Mālī: their harbours, their springs and the winds that reach them. There was no one on them. Within the month a fleet of settlers sailed for the islands with tools, seed and livestock, to found the first town of the empire in the southern sea. The dīwān's instructions to them were longer than any it had given before. <mark>The islands were not to be a fishing post like the others but a land of their own one day, with its own governor and its own people.<\/mark>"}, {"file": "0831-02-11-of-the-islands-of-the-ocean-and-the-naft-of-ethiopia", "title": "Of the Islands of the Ocean, and the Naft of Ethiopia", "date": "1427-12-01", "west": "1 December 1427", "hijri": "11 Ṣafar 831", "book": "The Encircling Sea", "words": 480, "role": "knot", "quote": "The dīwān had told the first fleet that the islands were to be a land of their own one day", "para": "The Green Cape was empty, and there the empire had to bring its own people. Santo Antão, the northernmost of the islands, became the empire's first town in the southern sea in Ramaḍān 825, with seventeen hundred Andalusī settlers. Fogo, the island of the fire mountain, followed in Rabīʿ al-Thānī 828. Santiago, the largest of the islands, followed in Shawwāl 830, settled by Portuguese-speaking Muslims of al-Gharb and Burtuqāl. <mark>The dīwān had told the first fleet that the islands were to be a land of their own one day<\/mark>, and the captains now spoke of them as the halfway house to Mālī and the Gulf, where a ship bound south could take on water, salt and goats."}, {"file": "0835-08-29-of-the-warmongers-name-the-crusade-of-835-and-the-arsenals", "title": "Of the Warmonger's Name, the Crusade of 835, and the Arsenals", "date": "1432-05-01", "west": "1 May 1432", "hijri": "29 Shaʿbān 835", "book": "The Franks", "words": 1117, "role": "tie", "quote": "In the same month the four towns of the islands of the Green Cape were made a land of their own, as the dīwān had promised the first settlers", "para": "The Emperor had waited his whole life for a war at sea. The fleets of Fās and Tūnis had won the winter, and he did not mean to owe the next war to them. In Shaʿbān 835 he ordered arsenals built in seven ports of the empire, of the kind the caliphs of Qurṭuba had called the dār al-ṣināʿa, the house of making: at Ishbīliya, Mālaqa, al-Mariyya, al-Ushbūna, Balansiyya, Cartagena and Mursiyya. The Christians had taken the word along with the thing and called it the arsenal. Each one would take two years to finish, and the treasurers reminded him what seven of them would cost. He signed the orders anyway, and had seven war galleys laid down on the slipways beside them before a single arsenal wall was up. <mark>In the same month the four towns of the islands of the Green Cape were made a land of their own, as the dīwān had promised the first settlers<\/mark>, under an Andalusī governor, ʿAbd al-Wahhāb Barakat, at Santiago. The Emperor's eyes were on the sea in every direction. The admirals of Ishbīliya said that it was the first time since his accession that they had seen him look happy."}], "opened": "1420-08-01", "lastTouched": "1432-05-01", "entriesSince": 12, "yearsSince": 11, "span": 12}, {"id": "naft-of-ethiopia", "title": "The naft of Ethiopia", "kind": "omen", "status": "open", "gist": "Ismāʿīl sells fire weapons to Christian Ethiopia for twice a year's income and says it will never backfire.", "frontier": "Fire weapons sold to Ethiopia: 'it would never backfire.'", "people": ["ismail-ibn-saad"], "knots": [{"file": "0831-02-11-of-the-islands-of-the-ocean-and-the-naft-of-ethiopia", "title": "Of the Islands of the Ocean, and the Naft of Ethiopia", "date": "1427-12-01", "west": "1 December 1427", "hijri": "11 Ṣafar 831", "book": "The Encircling Sea", "words": 480, "role": "open", "quote": "The dīwān warned that a weapon once sold could one day be turned against the seller.", "para": "The Ocean paid for itself in unexpected ways. In Shaʿbān 824 envoys came to Ishbīliya from Ethiopia, the Christian kingdom beyond Egypt, wanting to buy naft, the fire weapons the armies of al-Andalus had used since the days of the sultans. <mark>The dīwān warned that a weapon once sold could one day be turned against the seller.<\/mark> The Emperor Ismāʿīl asked how far Ethiopia was from Ishbīliya and how much it was offering. It was a very long way, and the offer was four hundred and nineteen pieces of gold, which the treasurers reckoned at twice the crown's yearly income. He said that it would never backfire, and took the gold."}, {"file": "0831-02-11-of-the-islands-of-the-ocean-and-the-naft-of-ethiopia", "title": "Of the Islands of the Ocean, and the Naft of Ethiopia", "date": "1427-12-01", "west": "1 December 1427", "hijri": "11 Ṣafar 831", "book": "The Encircling Sea", "words": 480, "role": "knot", "quote": "He said that it would never backfire, and took the gold.", "para": "The Ocean paid for itself in unexpected ways. In Shaʿbān 824 envoys came to Ishbīliya from Ethiopia, the Christian kingdom beyond Egypt, wanting to buy naft, the fire weapons the armies of al-Andalus had used since the days of the sultans. The dīwān warned that a weapon once sold could one day be turned against the seller. The Emperor Ismāʿīl asked how far Ethiopia was from Ishbīliya and how much it was offering. It was a very long way, and the offer was four hundred and nineteen pieces of gold, which the treasurers reckoned at twice the crown's yearly income. <mark>He said that it would never backfire, and took the gold.<\/mark>"}], "opened": "1427-12-01", "lastTouched": "1427-12-01", "entriesSince": 21, "yearsSince": 16, "span": 0}, {"id": "price-of-shant-yaqub", "title": "The price of Shant Yāqub", "kind": "debt", "status": "open", "gist": "Muḥammad pulls down the Apostle's shrine. The chronicle says plainly that the cost is still to be paid. The Crusade of 835 is the first instalment.", "frontier": "The cost of the Apostle's shrine 'remains to be seen'.", "people": ["muhammad-ibn-ismail-ibn-saad"], "knots": [{"file": "0833-10-23-of-the-war-of-shant-yaqub-and-the-shrine-of-the-apostle", "title": "Of the War of Shant Yāqub, and the Shrine of the Apostle", "date": "1430-07-15", "west": "15 July 1430", "hijri": "23 Shawwāl 833", "book": "The Marches", "words": 989, "role": "open", "quote": "What the destruction of the Apostle's shrine would cost al-Andalus, and when, and to whom it would be paid, remains to be seen.", "para": "No one in the dīwān asked the Emperor why. Some of the ʿulamāʾ praised the deed from the pulpit, and others kept silent, and the silent ones were the more learned. The princes did not speak of it at all. The court had seen what happened to Christendom when a pope preached a crusade, and it knew that the Christians of the north, who had been told for two years that the Emperor's coming was a homecoming, now had a different story to tell. <mark>What the destruction of the Apostle's shrine would cost al-Andalus, and when, and to whom it would be paid, remains to be seen.<\/mark>"}, {"file": "0834-02-16-the-close-of-the-book-of-the-marches", "title": "The Close of the Book of the Marches", "date": "1430-11-03", "west": "3 November 1430", "hijri": "16 Ṣafar 834", "book": "The Marches", "words": 511, "role": "knot", "quote": "The court has not forgotten Shant Yāqub.", "para": "<mark>The court has not forgotten Shant Yāqub.<\/mark> In Ishbīliya the Pórtico de la Gloria waits in a storeroom for the Emperor to decide where to set it up, and every merchant ship from the north brings word of what the Christians are saying about the Apostle's tomb. In 387 al-Manṣūr carried the bells of Shant Yāqub to Qurṭuba and left the tomb untouched. The Christians took Qurṭuba back two and a half centuries later, and they carried the bells back to Shant Yāqub on Muslim shoulders. The princes Ismāʿīl and Aḥmad know that story, as every child of the house does. Their father looks at the sea."}, {"file": "0835-08-29-of-the-warmongers-name-the-crusade-of-835-and-the-arsenals", "title": "Of the Warmonger's Name, the Crusade of 835, and the Arsenals", "date": "1432-05-01", "west": "1 May 1432", "hijri": "29 Shaʿbān 835", "book": "The Franks", "words": 1117, "role": "knot", "quote": "Now they had to decide what to do about it, and the answer began with the rubble of Shant Yāqub.", "para": "For seven hundred years, since the first governors of al-Andalus failed to take a cave in the Asturian hills, there had always been some corner of the peninsula where a Christian king still ruled. After the Peace of Ṣafar there was none. Every town from Finisterre to the Pyrenees belonged to the Emperor or to a lord who owed his throne to him. The courts of Christendom had watched al-Andalus come north for sixty years, one war at a time. <mark>Now they had to decide what to do about it, and the answer began with the rubble of Shant Yāqub.<\/mark>"}, {"file": "0835-11-28-of-the-peace-of-the-pope-and-the-decree-on-the-taifas", "title": "Of the Peace of the Pope, and the Decree on the Ṭāʾifas", "date": "1432-07-27", "west": "27 July 1432", "hijri": "28 Dhū al-Qaʿda 835", "book": "The Franks", "words": 613, "role": "knot", "quote": "Some of the old men of the dīwān wondered what the Christians would call it now.", "para": "Only two were bound closely enough yet, and both were ruled by the Emperor's own family by marriage. Arghūn belonged to Rodrigo de Borja, the brother of the Empress Magdalena, a gentle and talkative man whose kingdom had just been the target of the crusade. Qūnka belonged to the Shaykha Maryam, sister of the Empress Jadīla and married to the Emperor's brother Saʿd. Their courts were ordered to act, and they obeyed. They also complained, and in the ṭāʾifas of the north, which knew their turn would come, the complaints were louder. For three generations the house of Naṣr had told the Christians of Iberia that its coming was a homecoming. <mark>Some of the old men of the dīwān wondered what the Christians would call it now.<\/mark>"}], "opened": "1430-07-15", "lastTouched": "1432-07-27", "entriesSince": 11, "yearsSince": 11, "span": 2}, {"id": "portico", "title": "The Pórtico in the storeroom", "kind": "object", "status": "open", "gist": "The carved porch of Santiago is taken down stone by stone and carted to Seville, where it waits for the Emperor to decide where to put it.", "frontier": "The Pórtico de la Gloria waits in a storeroom in Ishbīliya.", "people": ["muhammad-ibn-ismail-ibn-saad"], "knots": [{"file": "0833-10-23-of-the-war-of-shant-yaqub-and-the-shrine-of-the-apostle", "title": "Of the War of Shant Yāqub, and the Shrine of the Apostle", "date": "1430-07-15", "west": "15 July 1430", "hijri": "23 Shawwāl 833", "book": "The Marches", "words": 989, "role": "open", "quote": "was taken down stone by stone and carted south to Ishbīliya.", "para": "The Emperor Muḥammad did not leave the tomb alone. On his direct orders the cathedral was pulled down. The masons of the army were told to save one thing. The great carved porch of the west front, the Pórtico de la Gloria, with its two hundred figures of prophets, elders and the saved, <mark>was taken down stone by stone and carted south to Ishbīliya.<\/mark> The rest became a field of rubble."}, {"file": "0834-02-16-the-close-of-the-book-of-the-marches", "title": "The Close of the Book of the Marches", "date": "1430-11-03", "west": "3 November 1430", "hijri": "16 Ṣafar 834", "book": "The Marches", "words": 511, "role": "knot", "quote": "In Ishbīliya the Pórtico de la Gloria waits in a storeroom for the Emperor to decide where to set it up", "para": "The court has not forgotten Shant Yāqub. <mark>In Ishbīliya the Pórtico de la Gloria waits in a storeroom for the Emperor to decide where to set it up<\/mark>, and every merchant ship from the north brings word of what the Christians are saying about the Apostle's tomb. In 387 al-Manṣūr carried the bells of Shant Yāqub to Qurṭuba and left the tomb untouched. The Christians took Qurṭuba back two and a half centuries later, and they carried the bells back to Shant Yāqub on Muslim shoulders. The princes Ismāʿīl and Aḥmad know that story, as every child of the house does. Their father looks at the sea."}], "opened": "1430-07-15", "lastTouched": "1430-11-03", "entriesSince": 14, "yearsSince": 13, "span": 0}, {"id": "ahmads-drawings", "title": "Prince Aḥmad's drawings", "kind": "promise", "status": "open", "gist": "Prince Aḥmad draws buildings and talks of the great works he will raise one day. (The Radiant City was his father's work, not his.)", "frontier": "Prince Aḥmad means to build in the capital one day.", "people": ["ahmad-ibn-muhammad-ibn-ismail"], "knots": [{"file": "0833-10-23-of-the-war-of-shant-yaqub-and-the-shrine-of-the-apostle", "title": "Of the War of Shant Yāqub, and the Shrine of the Apostle", "date": "1430-07-15", "west": "15 July 1430", "hijri": "23 Shawwāl 833", "book": "The Marches", "words": 989, "role": "open", "quote": "Prince Aḥmad had begun to draw buildings, as his forebears had, and to talk of the great works he would raise in the capital one day.", "para": "The Emperor heard the news among his ships. The court said that his years with the fleet had made him another man from the slow boy of the dīwān. He knew fishermen and harbour-masters and the captains of every merchant house in Ishbīliya by name, and he understood how things were actually done in the world better than many cleverer men. His eyes, all the same, were on the sea, and the state was carried by those around him. His three wives, Magdalena of the Borja, Isabel of the Montsoriu and Jadīla of his own house, had been chosen by his father and grandfather for their minds as well as their blood. With the two princes they did most of the governing, and the old Emperors had meant them to. <mark>Prince Aḥmad had begun to draw buildings, as his forebears had, and to talk of the great works he would raise in the capital one day.<\/mark>"}], "opened": "1430-07-15", "lastTouched": "1430-07-15", "entriesSince": 16, "yearsSince": 13, "span": 0}, {"id": "umara-grievance", "title": "The umarāʾ's grievance", "kind": "grudge", "status": "open", "gist": "The nobles lose their land rights for Majrīṭ's charter, then their place beside the merchants. In 847 they find common cause with the burghers overseas.", "frontier": "The umarāʾ are losing their land rights one estate at a time.", "people": ["ismail-ibn-muhammad-ibn-ismail", "ahmad-ibn-muhammad-ibn-ismail"], "knots": [{"file": "0841-10-12-of-the-charter-of-majrit-and-the-land-rights-of-the-umara", "title": "Of the Charter of Majrīṭ, and the Land Rights of the Umarāʾ", "date": "1438-04-08", "west": "8 April 1438", "hijri": "12 Shawwāl 841", "book": "The Encircling Sea", "words": 398, "role": "open", "quote": "the umarāʾ of the north agreed in return that their Land Rights in the integrated territories would be unravelled, slowly, one estate at a time.", "para": "The two princes saw a different chance. Ismāʿīl and Aḥmad had taken up the work their grandfather Ismāʿīl had begun and never finished: the breaking of the umarāʾ. The great houses had lost their mercenaries, their lordships and their equality with the crown. They had kept their land. In the integrated territories of the north they still held their estates by right, could open new mines and fields as they pleased, raise villas, and bind the peasants a little tighter to the soil every year. The northern umarāʾ wanted Majrīṭ's charter to fail as little as the burghers did, because their wool and grain went through its market, and the princes made them pay for it. In Shawwāl 841 the charter was granted, and <mark>the umarāʾ of the north agreed in return that their Land Rights in the integrated territories would be unravelled, slowly, one estate at a time.<\/mark>"}, {"file": "0843-02-02-of-the-emperor-who-became-a-scholar", "title": "Of the Emperor Who Became a Scholar", "date": "1439-07-15", "west": "15 July 1439", "hijri": "2 Ṣafar 843", "book": "The Call", "words": 413, "role": "knot", "quote": "The umarāʾ had not taken the loss of their land rights quietly, the stipend for their poets notwithstanding", "para": "It was a hard year at home. <mark>The umarāʾ had not taken the loss of their land rights quietly, the stipend for their poets notwithstanding<\/mark>, and the peace of the realm had fallen further in a year than in any year since the risings of 807. The princes Ismāʿīl and Aḥmad spent it appeasing the estates while the charter of Majrīṭ worked its way through the chancery. The Emperor left that to them and went back to his books."}, {"file": "0846-01-21-of-the-jamaa-of-846-and-the-burghers", "title": "Of the Jamāʿa of 846, and the Burghers", "date": "1442-06-01", "west": "1 June 1442", "hijri": "21 Muḥarram 846", "book": "The Golden Century", "words": 495, "role": "knot", "quote": "Now they had lost it again, this time to men who sold cloth.", "para": "The court was, as the clerks put it, incensed. The umarāʾ had lost their equality to his father's Jamāʿa of 831. <mark>Now they had lost it again, this time to men who sold cloth.<\/mark> The ʿulamāʾ, who had voted with the crown in 831, found that they had voted themselves into a chamber full of merchants. Even the dhimmī, who had always sided with the crown against the lords, complained that the merchants were getting more than their share. Only the burghers were pleased, and they were very pleased. As for the princes, they said nothing in public. In private the dīwān heard them say that their father had finally done something they had not planned for him, and that they were not yet sure whether to be proud of him."}, {"file": "0847-02-27-of-the-jamaa-of-847-and-the-island-of-fernando-po", "title": "Of the Jamāʿa of 847, and the Island of Fernando Po", "date": "1443-06-26", "west": "26 June 1443", "hijri": "27 Ṣafar 847", "book": "The Golden Century", "words": 366, "role": "knot", "quote": "The two estates that had hated each other for a year voted together, and the motion passed before the noon prayer.", "para": "It was short. The umarāʾ brought the first business of the session, and it was not a grievance. They asked the crown to push the empire's settlements further down the African coast and out into the Ocean, with lords of the great houses to lead them and lands to be granted there to the men who took them. Some of the lords wanted estates to replace the land rights they had lost at home. Others wanted to be away from a court where they now had to sit beside cloth merchants. The burghers, who had expected to oppose them, found that the lords were asking for exactly what the merchants wanted too: new ports, new harbours for the ships of the Green Cape and the gold coast, and new goods to sell. <mark>The two estates that had hated each other for a year voted together, and the motion passed before the noon prayer.<\/mark>"}], "opened": "1438-04-08", "lastTouched": "1443-06-26", "entriesSince": 0, "yearsSince": 0, "span": 5}, {"id": "catalan-privileges", "title": "The Catalan privileges in Arghūn", "kind": "grudge", "status": "open", "gist": "The Emperor's merchants complain that the Catalans of Arghūn still trade on better terms than they do. The dīwān does nothing, because the king of Arghūn is the Empress's brother.", "frontier": "The crown's merchants resent the Catalans' old privileges.", "people": ["rodrigo-de-borja"], "knots": [{"file": "0844-01-09-of-the-trade-war-with-genoa-and-the-angevins", "title": "Of the Trade War with Genoa and the Angevins", "date": "1440-06-10", "west": "10 June 1440", "hijri": "9 Muḥarram 844", "book": "The Franks", "words": 409, "role": "open", "quote": "The dīwān heard them and did nothing.", "para": "The first quarrel was at home. In the last days of Dhū al-Ḥijja 843 the Andalusī merchants of the crown brought a complaint to the dīwān. In the Ṭāʾifa of Arghūn, under King Rodrigo de Borja, the Catalan merchant houses still kept the privileges they had held since before the Restoration: their own consuls, their own courts, their own rates at the customs. Now that Barshalūna itself belonged to the crown, the merchants asked why the Catalans of Arghūn should trade on better terms than the Emperor's own subjects. <mark>The dīwān heard them and did nothing.<\/mark> The king of Arghūn was the Empress's brother, and the Emperor had a larger quarrel on his hands."}], "opened": "1440-06-10", "lastTouched": "1440-06-10", "entriesSince": 4, "yearsSince": 3, "span": 0}, {"id": "trade-war", "title": "The trade war with Genoa and the Angevins", "kind": "question", "status": "open", "gist": "Genoa closes Italy and al-Andalus closes its ports to the Angevins. No peace is recorded.", "frontier": "A war of ledgers with Genoa and the English crowns.", "people": ["muhammad-ibn-ismail-ibn-saad", "edward-v-of-england", "yusuf-ibn-ismail-ibn-muhammad"], "knots": [{"file": "0844-01-09-of-the-trade-war-with-genoa-and-the-angevins", "title": "Of the Trade War with Genoa and the Angevins", "date": "1440-06-10", "west": "10 June 1440", "hijri": "9 Muḥarram 844", "book": "The Franks", "words": 409, "role": "open", "quote": "He also ordered the treasurers to tell him every month what it was costing.", "para": "The old merchants of the capital said that a trade war hurt both sides and helped neither, and that the Venetians would be the only ones to profit. The young ones said that the Franks would need Andalusī sugar, gold and paper long before al-Andalus needed English wool. The Emperor, who had read a good deal about trade by then, agreed with the young ones. <mark>He also ordered the treasurers to tell him every month what it was costing.<\/mark>"}, {"file": "0846-01-21-of-the-jamaa-of-846-and-the-burghers", "title": "Of the Jamāʿa of 846, and the Burghers", "date": "1442-06-01", "west": "1 June 1442", "hijri": "21 Muḥarram 846", "book": "The Golden Century", "words": 495, "role": "knot", "quote": "it was fighting a trade war with Genoa and the Angevins.", "para": "What he had read was this. The empires that lasted were the ones that listened to the men who made their money, and the ones that fell were the ones whose princes and lords had stopped listening. Rome had been ruined by its senators, and Baghdad by its soldiers. He did not intend al-Andalus to be ruined by its umarāʾ. The realm already had the first market of the Middle Sea, a fleet of its own building and trading offices from Niani to Cairo, and <mark>it was fighting a trade war with Genoa and the Angevins.<\/mark> The men who would win or lose that war were not in the Jamāʿa as anything more than petitioners."}], "opened": "1440-06-10", "lastTouched": "1442-06-01", "entriesSince": 2, "yearsSince": 1, "span": 2}, {"id": "promise-to-the-ulama", "title": "The princes' promise to the ʿulamāʾ", "kind": "promise", "status": "open", "gist": "To keep the scholars in line, the princes promise that Ismāʿīl will confirm all their rights by his own hand on the day he comes to the throne.", "due": "at the accession of Ismāʿīl ibn Muḥammad", "frontier": "Ismāʿīl must confirm the ʿulamāʾ's rights on the day he comes to the throne.", "people": ["ismail-ibn-muhammad-ibn-ismail", "ahmad-ibn-muhammad-ibn-ismail"], "knots": [{"file": "0846-03-29-of-the-princes-mending-and-the-golden-century", "title": "Of the Princes' Mending, and the Golden Century", "date": "1442-08-07", "west": "7 August 1442", "hijri": "29 Rabīʿ al-Awwal 846", "book": "The Golden Century", "words": 651, "role": "open", "quote": "they could promise the scholars that when the heir Ismāʿīl came to the throne, every right the ʿulamāʾ held would be confirmed by his own hand on the day of his accession.", "para": "The princes Ismāʿīl and Aḥmad had not been asked about their father's Jamāʿa, but they were left to deal with what came of it, and they did not waste a day. While the umarāʾ were still drafting their protests, the princes rode out to the hinterland. They spoke to the headmen of the villages, the men who had eaten from the Emperor Ismāʿīl's granaries and remembered who had built them, and they told them that the crown had not forgotten the countryside for the cities. The commoners had no love for the merchants, but they had less for the lords, and the hinterland stayed quiet. Then the princes went to the ʿulamāʾ. They could not undo the merchants' seats, but <mark>they could promise the scholars that when the heir Ismāʿīl came to the throne, every right the ʿulamāʾ held would be confirmed by his own hand on the day of his accession.<\/mark> The ʿulamāʾ took the promise, and grumbled, and stayed."}], "opened": "1442-08-07", "lastTouched": "1442-08-07", "entriesSince": 1, "yearsSince": 1, "span": 0}, {"id": "the-league", "title": "The league against al-Andalus", "kind": "omen", "status": "open", "gist": "The chancery warns that if the empire grows too strong its rivals will one day league together against it. The Emperor answers that such leagues usually come too late.", "frontier": "The chancery warns of a league against al-Andalus.", "people": ["muhammad-ibn-ismail-ibn-saad"], "knots": [{"file": "0846-03-29-of-the-princes-mending-and-the-golden-century", "title": "Of the Princes' Mending, and the Golden Century", "date": "1442-08-07", "west": "7 August 1442", "hijri": "29 Rabīʿ al-Awwal 846", "book": "The Golden Century", "words": 651, "role": "open", "quote": "its enemies and rivals would one day league together against it.", "para": "The princes read the proclamation with care, and so did the ambassadors in Ishbīliya. The Christian kingdoms beyond the mountains had long counted al-Andalus a spent and fading power. Now they would have to reckon with its return, and the secretaries of the Dīwān al-Inshāʾ warned that if the empire's power in Europe or across the seas grew too great, <mark>its enemies and rivals would one day league together against it.<\/mark> The Emperor said that he had read about leagues too, and that the ones that formed against the great empires of old had usually been too late."}, {"file": "0846-03-29-of-the-princes-mending-and-the-golden-century", "title": "Of the Princes' Mending, and the Golden Century", "date": "1442-08-07", "west": "7 August 1442", "hijri": "29 Rabīʿ al-Awwal 846", "book": "The Golden Century", "words": 651, "role": "knot", "quote": "the ones that formed against the great empires of old had usually been too late.", "para": "The princes read the proclamation with care, and so did the ambassadors in Ishbīliya. The Christian kingdoms beyond the mountains had long counted al-Andalus a spent and fading power. Now they would have to reckon with its return, and the secretaries of the Dīwān al-Inshāʾ warned that if the empire's power in Europe or across the seas grew too great, its enemies and rivals would one day league together against it. The Emperor said that he had read about leagues too, and that <mark>the ones that formed against the great empires of old had usually been too late.<\/mark>"}], "opened": "1442-08-07", "lastTouched": "1442-08-07", "entriesSince": 1, "yearsSince": 1, "span": 0}, {"id": "fernando-po", "title": "Fernando Po", "kind": "venture", "status": "open", "gist": "The first Jamāʿa of the new order names its first object overseas: a high green island in the Gulf of Guinea.", "frontier": "The Jamāʿa has asked for the island of Fernando Po.", "people": ["muhammad-ibn-ismail-ibn-saad"], "knots": [{"file": "0847-02-27-of-the-jamaa-of-847-and-the-island-of-fernando-po", "title": "Of the Jamāʿa of 847, and the Island of Fernando Po", "date": "1443-06-26", "west": "26 June 1443", "hijri": "27 Ṣafar 847", "book": "The Golden Century", "words": 366, "role": "open", "quote": "The Jamāʿa asked for it, the burghers offered to share the cost, and the Emperor, who had never needed persuading about anything that floated, agreed.", "para": "The assembly named its first object. In the Gulf of Guinea, beyond the trading posts of Kaabu and past the mouths of the great rivers, the pilots had found a high green island rising out of the sea, with a mountain at its heart, a good anchorage and people of its own: the island of Fernando Po. <mark>The Jamāʿa asked for it, the burghers offered to share the cost, and the Emperor, who had never needed persuading about anything that floated, agreed.<\/mark>"}], "opened": "1443-06-26", "lastTouched": "1443-06-26", "entriesSince": 0, "yearsSince": 0, "span": 0}], "knotsByEntry": {"0738-01-02-the-marinid-war-upon-castile": [{"thread": "word-to-fas", "i": 0, "role": "open", "quote": "The alliance gives Abū al-Ḥasan the right to summon our lord, and he has not yet done so."}], "0747-07-01-the-summons-of-the-marinids": [{"thread": "word-to-fas", "i": 1, "role": "knot", "quote": "Then the Marīnid's letter came to Gharnāṭa: our brother in faith expected us to take the field."}, {"thread": "word-to-fas", "i": 2, "role": "tie", "quote": "On the first of Rajab he answered the summons."}], "0741-02-28-the-two-taifas": [{"thread": "grievance-in-the-drawer", "i": 0, "role": "open", "quote": "Within days of the peace the clerks of the dīwān began, very quietly, to set down the realm's claims against Qashtāla, the long grievance of tribute and lost lands that would one day justify a war of independence."}], "0745-06-02-the-jamaa-of-744": [{"thread": "grievance-in-the-drawer", "i": 1, "role": "knot", "quote": "The grievance against Qashtāla had lain sealed in the dīwān for two years."}], "0764-10-19-the-death-of-al-hajj-yusuf": [{"thread": "grievance-in-the-drawer", "i": 2, "role": "knot", "quote": "On the fifth of Shaʿbān in the year 764, the truce with Qashtāla ran out, and our lord Yūsuf did not wait an hour longer."}], "0767-07-23-the-peace-of-independence": [{"thread": "grievance-in-the-drawer", "i": 3, "role": "tie", "quote": "The house of Naṣr, which had paid tribute to the Castilian crown for longer than anyone living could remember, declared itself free and subject to no one but Allāh."}], "0748-10-15-the-birth-of-saad": [{"thread": "the-knot-that-held", "i": 0, "role": "open", "quote": "In time the court would learn how quickly the knots the Marīnids tied could come undone, and that this one, alone of them, would hold."}], "0751-11-20-the-prodigy-and-the-daughter-of-cairo": [{"thread": "the-knot-that-held", "i": 1, "role": "knot", "quote": "the Marīnid girl promised to his father in the year of Saʿd's birth was still growing up in Fās."}], "0756-03-04-the-governor-and-the-harem": [{"thread": "the-knot-that-held", "i": 2, "role": "tie", "quote": "She had been promised to him in the year of the war with the three crowns, and she was the one thread to Fās that had not been cut when Qashtāla made the Marīnids tear up their treaties."}], "0747-07-01-the-houses-of-healing": [{"thread": "walls-and-wards", "i": 0, "role": "open", "quote": "Those who praised it would learn that walls and wards slow a pestilence but do not stop it, for Allāh's decree outruns the builder."}], "0749-02-15-the-coming-of-the-pestilence": [{"thread": "walls-and-wards", "i": 1, "role": "knot", "quote": "The physicians said it was the only way to slow the sickness, and they were right."}], "0752-12-09-the-departing-of-the-pestilence": [{"thread": "walls-and-wards", "i": 2, "role": "tie", "quote": "The houses of healing had slowed the sickness but could not stop it."}], "0772-08-07-the-moneylenders-of-ishbiliya": [{"thread": "moneylenders", "i": 0, "role": "open", "quote": "The ʿulamāʾ went away displeased, and they did not forget it."}], "0794-03-25-of-al-hajj-saad": [{"thread": "moneylenders", "i": 1, "role": "tie", "quote": "The ʿulamāʾ, freshly content with their Ḥājj, let it pass."}], "0800-12-20-of-the-grandsons-and-the-prince-from-benabarre": [{"thread": "law-of-the-house", "i": 0, "role": "open", "quote": "But the question did not die. It went down a generation."}, {"thread": "law-of-the-house", "i": 1, "role": "knot", "quote": "If Ismāʿīl's son Saʿd grew into a man fit to rule, the question would wait for Ismāʿīl's reign."}, {"thread": "what-he-wishes-to-hear", "i": 1, "role": "knot", "quote": "The crown prince welcomed his brother and his nephew with the fairest words in the dīwān, and everyone who heard them agreed that nobody could have said it better."}, {"thread": "the-slow-prince", "i": 0, "role": "open", "quote": "stubborn and slow, and his tutors had given up making excuses for him."}], "0807-09-16-of-the-risings-of-807-and-the-death-of-the-emperor-saad": [{"thread": "law-of-the-house", "i": 2, "role": "knot", "quote": "Whether the law would be changed was now for Ismāʿīl to decide, and Ismāʿīl had always been better at saying what men wished to hear than at telling them what he meant."}, {"thread": "what-he-wishes-to-hear", "i": 2, "role": "knot", "quote": "Ismāʿīl had always been better at saying what men wished to hear than at telling them what he meant."}], "0811-03-12-of-the-old-capital-and-the-sons-of-muhammad": [{"thread": "law-of-the-house", "i": 3, "role": "tie", "quote": "By the summer of 811 the question that had troubled the old Emperor's last years had settled itself."}, {"thread": "what-he-wishes-to-hear", "i": 3, "role": "knot", "quote": "Whatever the Emperor told men in private, and he told each of them what he wished to hear, his judgments in public were fair, and no one who brought a case before him could say it had been decided by favour."}], "0832-09-25-of-the-death-of-the-emperor-ismail-and-the-two-princes": [{"thread": "law-of-the-house", "i": 4, "role": "echo", "quote": "The crown passed by the law of the house, which he had never changed, to his eldest son Muḥammad"}, {"thread": "what-he-wishes-to-hear", "i": 4, "role": "tie", "quote": "Those who had been lied to by him found, on reflection, that they had been lied to for the good of the state, and those who had been judged by him found that they had been judged fairly, and most of the umarāʾ had been both."}, {"thread": "the-slow-prince", "i": 1, "role": "knot", "quote": "the old men of the court were heard to say that the realm had been cursed, and to ask God's mercy on them all."}], "0776-10-12-of-the-restoration-of-al-andalus": [{"thread": "what-he-wishes-to-hear", "i": 0, "role": "open", "quote": "His tutors noted that he had already learned to tell each of his elders what that elder wished to hear, and they did not all count it a virtue."}], "0841-07-19-of-the-admiral-prince-and-his-three-wives": [{"thread": "the-slow-prince", "i": 2, "role": "knot", "quote": "The court had called him slow; the captains had called him admiral."}], "0843-02-02-of-the-emperor-who-became-a-scholar": [{"thread": "the-slow-prince", "i": 3, "role": "tie", "quote": "they agreed among themselves that he understood a new idea, once he had it, better and faster than most of them."}, {"thread": "umara-grievance", "i": 1, "role": "knot", "quote": "The umarāʾ had not taken the loss of their land rights quietly, the stipend for their poets notwithstanding"}], "0823-07-21-of-daniel-the-green-cape-and-angra": [{"thread": "a-land-of-their-own", "i": 0, "role": "open", "quote": "The islands were not to be a fishing post like the others but a land of their own one day, with its own governor and its own people."}], "0831-02-11-of-the-islands-of-the-ocean-and-the-naft-of-ethiopia": [{"thread": "a-land-of-their-own", "i": 1, "role": "knot", "quote": "The dīwān had told the first fleet that the islands were to be a land of their own one day"}, {"thread": "naft-of-ethiopia", "i": 0, "role": "open", "quote": "The dīwān warned that a weapon once sold could one day be turned against the seller."}, {"thread": "naft-of-ethiopia", "i": 1, "role": "knot", "quote": "He said that it would never backfire, and took the gold."}], "0835-08-29-of-the-warmongers-name-the-crusade-of-835-and-the-arsenals": [{"thread": "a-land-of-their-own", "i": 2, "role": "tie", "quote": "In the same month the four towns of the islands of the Green Cape were made a land of their own, as the dīwān had promised the first settlers"}, {"thread": "price-of-shant-yaqub", "i": 2, "role": "knot", "quote": "Now they had to decide what to do about it, and the answer began with the rubble of Shant Yāqub."}], "0833-10-23-of-the-war-of-shant-yaqub-and-the-shrine-of-the-apostle": [{"thread": "price-of-shant-yaqub", "i": 0, "role": "open", "quote": "What the destruction of the Apostle's shrine would cost al-Andalus, and when, and to whom it would be paid, remains to be seen."}, {"thread": "portico", "i": 0, "role": "open", "quote": "was taken down stone by stone and carted south to Ishbīliya."}, {"thread": "ahmads-drawings", "i": 0, "role": "open", "quote": "Prince Aḥmad had begun to draw buildings, as his forebears had, and to talk of the great works he would raise in the capital one day."}], "0834-02-16-the-close-of-the-book-of-the-marches": [{"thread": "price-of-shant-yaqub", "i": 1, "role": "knot", "quote": "The court has not forgotten Shant Yāqub."}, {"thread": "portico", "i": 1, "role": "knot", "quote": "In Ishbīliya the Pórtico de la Gloria waits in a storeroom for the Emperor to decide where to set it up"}], "0835-11-28-of-the-peace-of-the-pope-and-the-decree-on-the-taifas": [{"thread": "price-of-shant-yaqub", "i": 3, "role": "knot", "quote": "Some of the old men of the dīwān wondered what the Christians would call it now."}], "0841-10-12-of-the-charter-of-majrit-and-the-land-rights-of-the-umara": [{"thread": "umara-grievance", "i": 0, "role": "open", "quote": "the umarāʾ of the north agreed in return that their Land Rights in the integrated territories would be unravelled, slowly, one estate at a time."}], "0846-01-21-of-the-jamaa-of-846-and-the-burghers": [{"thread": "umara-grievance", "i": 2, "role": "knot", "quote": "Now they had lost it again, this time to men who sold cloth."}, {"thread": "trade-war", "i": 1, "role": "knot", "quote": "it was fighting a trade war with Genoa and the Angevins."}], "0847-02-27-of-the-jamaa-of-847-and-the-island-of-fernando-po": [{"thread": "umara-grievance", "i": 3, "role": "knot", "quote": "The two estates that had hated each other for a year voted together, and the motion passed before the noon prayer."}, {"thread": "fernando-po", "i": 0, "role": "open", "quote": "The Jamāʿa asked for it, the burghers offered to share the cost, and the Emperor, who had never needed persuading about anything that floated, agreed."}], "0844-01-09-of-the-trade-war-with-genoa-and-the-angevins": [{"thread": "catalan-privileges", "i": 0, "role": "open", "quote": "The dīwān heard them and did nothing."}, {"thread": "trade-war", "i": 0, "role": "open", "quote": "He also ordered the treasurers to tell him every month what it was costing."}], "0846-03-29-of-the-princes-mending-and-the-golden-century": [{"thread": "promise-to-the-ulama", "i": 0, "role": "open", "quote": "they could promise the scholars that when the heir Ismāʿīl came to the throne, every right the ʿulamāʾ held would be confirmed by his own hand on the day of his accession."}, {"thread": "the-league", "i": 0, "role": "open", "quote": "its enemies and rivals would one day league together against it."}, {"thread": "the-league", "i": 1, "role": "knot", "quote": "the ones that formed against the great empires of old had usually been too late."}]}, "court": [{"id": "najib", "name": "Najīb", "arabic": "نجيب", "age": 126, "born": "1317-01-15", "female": false, "group": "unburied", "office": ["of the ʿulamāʾ"], "mentions": 2, "last": {"file": "0753-02-20-the-works-of-the-regency", "title": "Of the Work
